  role_aldeano: 'NPC · Солнечная деревня', role_alcalde: 'NPC · Солнечная деревня', role_militar: 'NPC · Город Высших Военных', role_general: 'NPC · Город Высших Военных', role_playista: 'NPC · Остров Касьонесвака',
  role_esclavo: 'NPC · Город Сулу', role_comun: 'Злодей · Приспешник', role_guard: 'Злодей · Босс уровня 1-1', role_gigante: 'Злодей · Приспешник', role_jefe: 'Злодей · Босс замка',
  role_acuatico: 'Злодей · Приспешник', role_dorado_s: 'Злодей · Приспешник', role_militarOp: 'Злодей · Босс', role_imperialista: 'Злодей · ФИНАЛЬНЫЙ БОСС',
  desc_chulin: 'Чулин — главный герой игры: он смелый, заботится о других и очень добрый. Все его любят. Его лучший друг — Мексикано. В одном приключении он потерял глаз, и ему подарили золотой. Он пользуется маленьким жёлтым пистолетом.',
  desc_mexicano: 'Мексикано — лучший друг Чулина. В том же приключении, где Чулин потерял левый глаз, он потерял правый, но ему ничего не подарили, поэтому он носит повязку. Он нарисовал себе глаз на спине, чтобы «все думали, что он следит за ними отовсюду», не зная, что глаз вышел слишком кривым. Он стреляет из настоящих винтовок.',
  desc_dorado: 'Блестящая золотая версия Чулина. У него на одно сердце больше. Открывается, когда соберёшь всего 200 монет (рекорд каждого уровня).',
  desc_volador: 'Приспешник с реактивным ранцем. После поражения Империалиста он перешёл на сторону добра. Держи ⤒ в воздухе, чтобы немного полетать.',
  desc_aldeano: 'Жители Солнечной деревни: белые кантриболы, спокойные и добрые. Многих похитили Приспешники.',
  desc_alcalde: 'Мэр Солнечной деревни. Приспешники заперли его в клетке, но Чулин его спас, и теперь мэр помогает ему в приключении.',
  desc_militar: 'Жители Города Высших Военных носят зелёные кепки. Они были самыми сильными из всех деревень... пока на них не надели наручники.',
  desc_general: 'Глава Города Высших Военных. Он даёт Чулину приказы, чтобы освободить город. Любит устраивать проверки.',
  desc_playista: 'Жители острова Касьонесвака всегда носят солнечные очки. Они знают много морских секретов.',
  desc_esclavo: 'Жители всех городов, которых увезли рабами в Город Сулу служить Империалисту.',
  desc_comun: 'Невиданные раньше кантриболы с красными глазами, красной звездой и синим пистолетом. Обожают править.',
  desc_guard: 'Первый Приспешник, с которым сразился Чулин: страж, охранявший остальных, пока они жгли Солнечную деревню.',
  desc_gigante: 'Огромный Приспешник с огнемётом. Не подходи слишком близко!',
  desc_jefe: 'Начальник операций: больше великана и в полицейской фуражке. Охраняет каждый замок Империалиста.',
  desc_acuatico: 'Приспешники в очках для плавания, которые плавают и бросают горящих пираний. Говорят, электричество и вода плохо сочетаются...',
  desc_dorado_s: 'Элитные Приспешники Города Сулу. Летают гораздо лучше и точнее обычных летающих и носят винтовки.',
  desc_militarOp: 'В Городе Сулу начальники операций становятся Военными операций — в три раза больше!',
  desc_imperialista: 'Предводитель Приспешников. Носит золотую корону и хочет захватить весь мир. Обожает править.',
  lock_chulin: '', lock_mexicano: 'Открывается на уровне 1-2.', lock_dorado: 'Собери всего 200 монет (рекорд каждого уровня).', lock_electrico: 'Пройди игру.', lock_volador: 'Пройди игру.',
  'story1.title': 'Мир 1: Солнечная деревня',
  'story1.0': 'Это был обычный день. Чулин вышел прогуляться по своей родной Солнечной деревне со своим верным маленьким жёлтым пистолетом.',
  'story1.1': 'Но в воздухе было что-то странное... пахло дымом.',
  'story1.2': 'Сам того не зная, Чулин вот-вот начнёт самое большое приключение в своей жизни.',
  'story2.title': 'Мир 2: Город Высших Военных',
  'story2.0': 'Освободив Солнечную деревню, Чулин и Мексикано отплыли в следующий город — Город Высших Военных, самых сильных из всех деревень.',
  'story2.1': 'Но когда они прибыли, небоскрёбы горели, а жители были в наручниках.',
  'story3.title': 'Мир 3: Остров Касьонесвака',
  'story3.0': 'Преследуя Приспешников по воде, Чулин добрался до острова Касьонесвака, состоящего из маленьких островков.',
  'story3.1': 'Там появились новые Водные Приспешники... и новый вид — Летающий Приспешник.',
  'story4.title': 'Мир 4: Город Сулу',
  'story4.0': 'Миллионы замков летели по небу — все в Город Сулу, самый важный город.',
  'story4.1': 'Теперь там всё — сплошные замки. Чулин больше не проходит уровни: он должен исследовать замки и куски украденных городов... и найти Золотой Электрокристалл.',
  'ending.title': 'Эпилог',
  'ending.0': 'Когда Империалист был побеждён, замки начали падать с неба, словно сухие листья.',
  'ending.1': 'Жители всех городов были освобождены и вернулись домой: в Солнечную деревню, Город Высших Военных и на остров Касьонесвака.',
  'ending.2': 'Чулин снова стал прежним. Летающий Приспешник раскаялся и перешёл на сторону добра.',
  'ending.3': 'Но когда Чулин обернулся, чтобы отпраздновать с лучшим другом... Мексикано рядом не было. Куда же он делся? Продолжение следует...',
  'crystal.0': 'Электрокристалл! От него веет... силой.', 'crystal.1': 'Говорят, такой есть в каждом замке, дружище.', 'crystal.2': 'Возьму его с собой. Что-то мне подсказывает, что он нам пригодится.',
  '1-1.start.0': 'Какой чудесный день для прогулки по Солнечной деревне!', '1-1.start.1': 'Пойду поздороваюсь с соседями.',
  '1-1.smoke.0': 'А? Дым?', '1-1.smoke.1': 'Деревня горит?!',
  '1-1.who.0': 'Кто это? Никогда не видел таких кантриболов...', '1-1.who.1': 'Красные глаза и синие пистолеты! Они нападают на деревню!',
  '1-1.guard.0': 'Стой! Никто не смеет мешать приказам Империалиста.', '1-1.guard.1': 'Импер... кого? Оставь моих соседей в покое!', '1-1.guard.2': 'Хе-хе... уже слишком поздно.',
  '1-1.guardEnd.0': 'Фух... куда делись остальные?', '1-1.guardEnd.1': 'Никого не осталось... они забрали жителей.',
  '1-1.villager.0': 'Чулин! Слава небесам, ты цел!', '1-1.villager.1': 'Что здесь случилось? Кто это был?',
  '1-1.villager.2': 'Их зовут Приспешниками... они сожгли дома и забрали многих.', '1-1.villager.3': 'Говорят, есть некий Империалист, который хочет захватить мир.',
  '1-1.villager.4': 'Тогда я его остановлю. Пойду разберусь!',
  '1-2.start.0': 'ЧУЛИН! Наконец-то я тебя нашёл, дружище!', '1-2.start.1': 'Мексикано! Ты в порядке?', '1-2.start.2': 'Я спрятался, когда пришли Приспешники. Я видел, куда они увели людей.',
  '1-2.start.3': 'Держи, я принёс винтовки. Работают как настоящие! Пойдём вместе!', '1-2.start.4': 'Вот это по-нашему!', '1-2.start.5': 'Мексикано присоединился! Теперь за него можно играть.',
  '1-2.npc1.0': 'Деревья высохли от огня...', '1-2.npc1.1': 'Будь осторожен: они повсюду оставили шипы, мины и бомбы.',
  '1-2.giant.0': 'СЖЕЧЬ ВСЁЁЁ!!', '1-2.giant.1': 'Этот Приспешник — ВЕЛИКАН! И у него огнемёт!', '1-2.giant.2': 'Чем больше шкаф, тем громче падает!',
  '1-2.giantEnd.0': 'Вот это был громила!', '1-2.giantEnd.1': 'Идём дальше. Нужно найти остальных.',
  '1-3.start.0': 'Летающие платформы? Это технологии Приспешников...', '1-3.start.1': 'А если мы упадём?', '1-3.start.2': 'Ну... давай не падать.',
  '1-3.mayor.0': 'Чулин! Ты меня спас!', '1-3.mayor.1': 'Господин мэр! Вы в порядке?', '1-3.mayor.2': 'Приспешники построили замок на краю деревни. Там их главный.',
  '1-3.mayor.3': 'Я знаю дорогу. Я пойду с тобой!', '1-3.mayor.4': 'Вперёд, к замку!',
  '1-4.start.0': 'Вот и замок. Осторожно: тут ложные пути, лава и пилы.', '1-4.start.1': 'И порталы, которые переносят куда попало...', '1-4.start.2': 'Я ничего не боюсь. Вперёд!',
  '1-4.portal.0': 'Стена? И куда теперь?', '1-4.portal.1': 'Этот портал... может унести нас куда угодно. Придётся рискнуть!',
  '1-4.boss.0': 'Я — начальник операций этого района.', '1-4.boss.1': 'Империалист не терпит неудач... так что я не проиграю!', '1-4.boss.2': 'Верни жителей!', '1-4.boss.3': 'Задай ему, дружище!',
  '1-4.bossEnd.0': 'Н-не может быть... Империалист об этом узнает...', '1-4.bossEnd.1': 'Солнечная деревня снова свободна!',
  '1-5.start.0': 'В деревне всё стало как прежде. Все празднуют!', '1-5.start.1': 'Собери как можно больше монет!',
  '1-5.npc1.0': 'Чулин, ты герой!', '1-5.npc1.1': 'Я просто поступил правильно.',
  '1-5.npc2.0': 'Мой дом больше не горит! Спасибо, спасибо, спасибо!',
  '1-5.npc3.0': 'Мексикано, ты тоже герой!', '1-5.npc3.1': 'Я знаю! То есть... спасибо.',
  '1-5.mayor.0': 'Спасибо, что спас нас, Чулин!', '1-5.mayor.1': 'Но Приспешники пришли с моря... и увезли людей в Город Высших Военных.',
  '1-5.mayor.2': 'Они были самыми сильными из всех деревень. Если напали на них, дело очень серьёзное.', '1-5.mayor.3': 'Тогда мы отправимся туда.', '1-5.mayor.4': 'Готовьте корабль, господин мэр!',
  '1-6.start.0': 'Все на борт! Корабль отвезёт нас в Город Высших Военных.', '1-6.start.1': 'В море!', '1-6.start.2': 'Надеюсь, меня не укачает...',
  '1-6.ambush.0': 'Приспешники на кораблях!', '1-6.ambush.1': 'Они нас не остановят!',
  '1-6.end.0': 'Вот и Город Высших Военных... но там очень много дыма.', '1-6.end.1': 'Случилось что-то плохое. Пошли.',
  '2-1.start.0': 'Город... жители в наручниках!', '2-1.start.1': 'Даже Высших Военных победили...',
  '2-1.npc1.0': 'На нас надели наручники... на нас, Высших Военных!', '2-1.npc1.1': 'Найди Генерала. Он знает, что делать.',
  '2-1.npc2.0': 'Моя зелёная кепка... она была гордостью города... у-у-у...',
  '2-1.general.0': 'Ты Чулин? Я слышал, ты освободил Солнечную деревню.', '2-1.general.1': 'Да. Что здесь случилось?',
  '2-1.general.2': 'Приспешники подожгли небоскрёбы. Освободи город: заберись по зданиям и доберись до их замка.',
  '2-1.general.3': 'Но здесь мало просто стрелять. Я научу тебя драться вблизи!', '2-1.general.4': 'Ты научился ближнему бою! Нажми кнопку с кулаком, чтобы ударить.',
  '2-2.start.0': 'Небоскрёбы горят. Прыгай с крыши на крышу.', '2-2.start.1': 'Как высоко!',
  '2-2.smoke.0': '*кхе-кхе* Сколько дыма! Если долго стоять рядом, я задохнусь...', '2-2.smoke.1': 'Не стой в дыму, дружище. Он тебя замедляет!',
  '2-3.start.0': 'Опять дым... надо проскочить быстро.', '2-3.start.1': 'Мы почти у замка!',
  '2-4.start.0': 'Этот замок — башня. Придётся забраться на самый верх.', '2-4.start.1': 'И найти ключ, который охраняет начальника.',
  '2-4.boss.0': 'Как ты сюда забрался?!', '2-4.boss.1': 'Этот город принадлежит Империалисту!', '2-4.boss.2': 'Больше нет!',
  '2-4.bossEnd.0': 'Держи... ключ от города... хе-хе-хе...', '2-4.bossEnd.1': 'Чулин получил ЭЛЕКТРОПИСТОЛЕТ! (переключай кнопкой ⟳)', '2-4.bossEnd.2': 'Электропистолет!',

  'story4.title': 'Świat 4: Miasto Sulu',
  'story4.0': 'Miliony zamków leciały po niebie, wszystkie do Miasta Sulu, najważniejszego miasta.',
  'story4.1': 'Teraz wszystko tam to zamki. Chulin nie przechodzi już poziomów: musi zbadać zamki i kawałki skradzionych miast... i znaleźć Złoty Kryształ Elektryczny.',
  'ending.title': 'Epilog',
  'ending.0': 'Po pokonaniu Imperialisty zamki zaczęły spadać z nieba jak suche liście.',
  'ending.1': 'Mieszkańcy wszystkich osad zostali uwolnieni i wrócili do domów: do Słonecznej Wioski, Miasta Wysokich Wojskowych i na Wyspę Cacionesvaca.',
  'ending.2': 'Chulin znów był sobą. Latający Sługus, żałując swoich czynów, dołączył do dobrych.',
  'ending.3': 'Ale gdy Chulin odwrócił się, by świętować z najlepszym przyjacielem... Mexicano już nie było. Gdzie on się podział? Ciąg dalszy nastąpi...',
  'crystal.0': 'Kryształ Elektryczny! Czuć od niego... moc.', 'crystal.1': 'Mówią, że jest jeden w każdym zamku, stary.', 'crystal.2': 'Zatrzymam go. Coś mi mówi, że się przyda.',
  '1-1.start.0': 'Jaki piękny dzień na spacer po Słonecznej Wiosce!', '1-1.start.1': 'Pójdę przywitać się z sąsiadami.',
  '1-1.smoke.0': 'Co? Dym?', '1-1.smoke.1': 'Wioska się pali?!',
  '1-1.who.0': 'Kim oni są? Nigdy nie widziałem takich countryballi...', '1-1.who.1': 'Czerwone oczy i niebieskie pistolety! Atakują wioskę!',
  '1-1.guard.0': 'Stój! Nikt nie przeszkadza w rozkazach Imperialisty.', '1-1.guard.1': 'Imperia-kogo? Zostaw moich sąsiadów w spokoju!', '1-1.guard.2': 'Hehe... już za późno.',
  '1-1.guardEnd.0': 'Uff... gdzie poszli pozostali?', '1-1.guardEnd.1': 'Nikogo już nie ma... zabrali mieszkańców.',
  '1-1.villager.0': 'Chulin! Dzięki niebiosom, nic ci nie jest!', '1-1.villager.1': 'Co tu się stało? Kim oni byli?',
  '1-1.villager.2': 'Nazywają ich Sługusami... spalili domy i zabrali wielu ludzi.', '1-1.villager.3': 'Mówią, że jest jakiś Imperialista, który chce przejąć świat.',
  '1-1.villager.4': 'W takim razie muszę go powstrzymać. Idę to zbadać!',
  '1-2.start.0': 'CHULIN! W końcu cię znalazłem, stary!', '1-2.start.1': 'Mexicano! Nic ci nie jest?', '1-2.start.2': 'Schowałem się, kiedy przyszli Sługusi. Widziałem, dokąd zabrali ludzi.',
  '1-2.start.3': 'Masz, przyniosłem karabiny. Działają jak prawdziwe! Chodźmy razem!', '1-2.start.4': 'Tak trzymać!', '1-2.start.5': 'Mexicano dołączył! Teraz jest grywalną postacią.',
  '1-2.npc1.0': 'Drzewa uschły od ognia...', '1-2.npc1.1': 'Uważaj, zostawili wszędzie kolce, miny i bomby.',
  '1-2.giant.0': 'SPALIĆ WSZYYYSTKO!!', '1-2.giant.1': 'Ten Sługus jest OGROMNY! I ma miotacz ognia!', '1-2.giant.2': 'Im większy, tym głośniej upada!',
  '1-2.giantEnd.0': 'Ale był wielki!', '1-2.giantEnd.1': 'Idziemy dalej. Musimy znaleźć pozostałych.',
  '1-3.start.0': 'Latające platformy? To technologia Sługusów...', '1-3.start.1': 'A jak spadniemy?', '1-3.start.2': 'No... to nie spadajmy.',
  '1-3.mayor.0': 'Chulin! Uratowałeś mnie!', '1-3.mayor.1': 'Panie burmistrzu! Wszystko w porządku?', '1-3.mayor.2': 'Sługusi zbudowali zamek na końcu wioski. Tam jest ich szef.',
  '1-3.mayor.3': 'Znam drogę. Pójdę z tobą!', '1-3.mayor.4': 'Ruszajmy do tego zamku!',
  '1-4.start.0': 'To jest ten zamek. Uwaga: są tu fałszywe ścieżki, lawa i piły.', '1-4.start.1': 'I portale, które przenoszą w losowe miejsca...', '1-4.start.2': 'Niczego się nie boję. Naprzód!',
  '1-4.portal.0': 'Ściana? Którędy teraz?', '1-4.portal.1': 'Ten portal... może nas zabrać gdziekolwiek. Musimy zaryzykować!',
  '1-4.boss.0': 'Jestem Szefem Operacji w tym rejonie.', '1-4.boss.1': 'Imperialista nie toleruje porażek... więc nie przegram!', '1-4.boss.2': 'Oddaj mieszkańców!', '1-4.boss.3': 'Dawaj, stary!',
  '1-4.bossEnd.0': 'N-niemożliwe... Imperialista się o tym dowie...', '1-4.bossEnd.1': 'Słoneczna Wioska znów jest wolna!',
  '1-5.start.0': 'W wiosce wszystko wróciło do normy. Wszyscy świętują!', '1-5.start.1': 'Zbierz jak najwięcej monet!',
  '1-5.npc1.0': 'Chulin, jesteś bohaterem!', '1-5.npc1.1': 'Po prostu zrobiłem to, co należało.',
  '1-5.npc2.0': 'Mój dom już się nie pali! Dziękuję, dziękuję, dziękuję!',
  '1-5.npc3.0': 'Mexicano, ty też jesteś bohaterem!', '1-5.npc3.1': 'Wiem! To znaczy... dzięki.',
  '1-5.mayor.0': 'Dziękujemy, że nas uratowałeś, Chulin!', '1-5.mayor.1': 'Ale Sługusi przypłynęli z morza... i zabrali ludzi do Miasta Wysokich Wojskowych.',
  '1-5.mayor.2': 'Oni byli najpotężniejsi ze wszystkich wiosek. Jeśli ich zaatakowano, to bardzo poważna sprawa.', '1-5.mayor.3': 'W takim razie tam popłyniemy.', '1-5.mayor.4': 'Proszę przygotować statek, panie burmistrzu!',
  '1-6.start.0': 'Wszyscy na pokład! Statek zabierze nas do Miasta Wysokich Wojskowych.', '1-6.start.1': 'Na morze!', '1-6.start.2': 'Oby mnie nie złapała choroba morska...',
  '1-6.ambush.0': 'Sługusi na statkach!', '1-6.ambush.1': 'Nie zatrzymają nas!',
  '1-6.end.0': 'Oto Miasto Wysokich Wojskowych... ale jest tam mnóstwo dymu.', '1-6.end.1': 'Stało się coś złego. Idziemy.',
  '2-1.start.0': 'Miasto... mieszkańcy są skuci kajdankami!', '2-1.start.1': 'Pokonali nawet Wysokich Wojskowych...',
  '2-1.npc1.0': 'Skuli nas... nas, Wysokich Wojskowych!', '2-1.npc1.1': 'Znajdź Generała. On będzie wiedział, co robić.',
  '2-1.npc2.0': 'Moja zielona czapka... była dumą miasta... buuu...',
  '2-1.general.0': 'Ty jesteś Chulin? Słyszałem, że uwolniłeś Słoneczną Wioskę.', '2-1.general.1': 'Tak. Co tu się stało?',
  '2-1.general.2': 'Sługusi podpalili wieżowce. Uwolnij miasto: wespnij się po budynkach i dotrzyj do ich zamku.',
  '2-1.general.3': 'Ale tu samo strzelanie nie wystarczy. Nauczę cię walki wręcz!', '2-1.general.4': 'Nauczyłeś się walki wręcz! Dotknij przycisku z pięścią, aby uderzyć.',
  '2-2.start.0': 'Wieżowce płoną. Skacz z dachu na dach.', '2-2.start.1': 'Ale wysoko!',
  '2-2.smoke.0': '*kaszl kaszl* Ile dymu! Jeśli zostanę tu za długo, uduszę się...', '2-2.smoke.1': 'Nie stój w dymie, stary. Spowalnia cię!',
  '2-3.start.0': 'Znowu dym... trzeba szybko przejść.', '2-3.start.1': 'Jesteśmy prawie przy zamku!',
  '2-4.start.0': 'Ten zamek to wieża. Będziesz musiał wspiąć się na sam szczyt.', '2-4.start.1': 'I znaleźć klucz, który chroni Szefa.',
  '2-4.boss.0': 'Jak się tu dostałeś?!', '2-4.boss.1': 'To miasto należy do Imperialisty!', '2-4.boss.2': 'Już nie!',
  '2-4.bossEnd.0': 'Masz... klucz do miasta... hehehe...', '2-4.bossEnd.1': 'Chulin zdobył PISTOLET ELEKTRYCZNY! (zmieniasz go przyciskiem ⟳)', '2-4.bossEnd.2': 'Pistolet elektryczny!',
  '2-4.cutkey.0': 'Klucz jest przecięty na pół!', '2-4.cutkey.1': 'A może skleimy go gumą do żucia?', '2-4.cutkey.2': 'Mam lepszy pomysł... strzel w niego z pistoletu elektrycznego!',
  '2-4.keyElec.0': 'Prąd go zespawał! Teraz działa!', '2-4.keyElec.1': 'Wow... łap go!',
  '2-4.free.0': 'Kajdanki się otworzyły! Miasto jest wolne!', '2-4.free.1': 'Udało się!',
  '2-5.start.0': 'Miasto świętuje! Baw się, Chulin.', '2-5.start.1': 'Wszędzie monety!',
  '2-5.npc1.0': 'Dzięki, że nas uwolniłeś! Bierz tyle monet, ile chcesz.',
  '2-5.npc2.0': 'Niech żyje Chulin!', '2-5.npc2.1': 'A ja? Nikt nie powie „niech żyje Mexicano”?',
  '2-5.ambush.0': 'ŻOŁNIERZE! ATAKOWAĆ CHULINA!', '2-5.ambush.1': 'Co?! Czemu mnie atakujecie?!', '2-5.ambush.2': 'To była pułapka!',
  '2-5.test.0': 'Hahaha, spokojnie, Chulin. To był test.', '2-5.test.1': 'Chcieliśmy sprawdzić, czy naprawdę jesteś godny nam pomagać. I jesteś!',
  '2-5.test.2': '...test?', '2-5.test.3': 'Hehe! Ten idzie ze mną!', '2-5.test.4': 'AAA! POMOCY!', '2-5.test.5': 'GENERALE! Za nim!',
  '2-6.start.0': 'Uwozi go po wodzie!', '2-6.start.1': 'Musisz go złapać, stary!',
  '2-6.kidnap.0': 'Nigdy mnie nie złapiesz! Piranie, do ataku!', '2-6.kidnap.1': 'Chulin, pomóż mi!',
  '2-6.piranha.0': 'Patrz, stary! Strzał do wody z pistoletu elektrycznego smaży piranie. Złap jedną, a dostaniesz tarczę elektryczną!',
  '2-6.end.0': 'Znowu mnie uratowałeś! Naprawdę jesteś godny.', '2-6.end.1': 'Dokąd zabierali ludzi?', '2-6.end.2': 'Za morzem leży Wyspa Cacionesvaca. Sługusi płyną właśnie tam.',
  '3-1.start.0': 'Wyspa Cacionesvaca: małe wysepki, słońce i wszędzie woda.', '3-1.start.1': 'Wakacje! ...no, nie.',
  '3-1.npc1.0': 'Witaj na Wyspie Cacionesvaca, przyjacielu!', '3-1.npc1.1': 'Uważaj: woda jest pełna Wodnych Sługusów.',
  '3-1.npc2.0': 'Są tu płonące piranie!', '3-1.npc2.1': 'Mówią, że prąd i woda się nie lubią... przynajmniej dla Sługusów.',
  '3-1.npc3.0': 'Strzel do wody z pistoletu elektrycznego, a zobaczysz. To najstarsza sztuczka na wyspie.',
  '3-2.start.0': 'Latający Sługusi?!', '3-2.start.1': 'Mają plecaki odrzutowe! Celuj w górę!',
  '3-2.npc1.0': 'Rozstawili piły po całej plaży... nawet poopalać się nie można.',
  '3-3.start.0': 'Rafa. Jesteśmy prawie przy zamku wyspy.', '3-3.start.1': 'Idziemy.',
  '3-4.start.0': 'Zamek wyspy... po co mu taki wielki łańcuch?', '3-4.start.1': 'Wcale mi się to nie podoba.',
  '3-4.boss.0': 'Spóźniłeś się, Chulin!', '3-4.boss.1': 'Plan Imperialisty już się zaczął...', '3-4.boss.2': 'Powstrzymam go!',
  '3-4.bossEnd.0': 'Hehehe... spójrz w górę.', '3-4.bossEnd.1': 'Co to za hałas?',
  '3-4.lift.0': 'Zamek był przypięty do gigantycznego łańcucha... i OGROMNY statek powietrzny zaczął go zabierać!', '3-4.lift.1': 'Spójrz na niebo! Lecą tam miliony zamków!',
  '3-4.lift.2': 'Wszystkie lecą w to samo miejsce...', '3-4.lift.3': 'Miasto Sulu. Najważniejsze miasto.', '3-4.lift.4': 'To lecimy za nimi!',
  '3-5.start.0': 'Musimy podążać za zamkami po niebie.', '3-5.start.1': 'Nie patrz w dół, nie patrz w dół...',
  '3-5.end.0': 'To jest... Miasto Sulu.', '3-5.end.1': 'Wszędzie zamki... i spójrz na tych wszystkich mieszkańców...', '3-5.end.2': 'Przywieźli ich tu jako niewolników. To koniec, Imperialisto!',
  '4-1.start.0': 'Mieszkańcy wszystkich osad zabrani w niewolę. Kawałki skradzionych miast. Wszędzie zamki.', '4-1.start.1': 'Tu wszyscy są Szefami Operacji...', '4-1.start.2': 'A my jesteśmy Chulin i Mexicano. Naprzód!',
  '4-1.npc1.0': 'Przywieźli nas ze Słonecznej Wioski... pracujemy dzień i noc...', '4-1.npc1.1': 'Mówią, że Imperialista jest na samej górze.',
  '4-1.npc2.0': 'Uważaj na Złotych Sługusów! Latają dużo lepiej niż inni.',
  '4-1.npc3.0': 'Wojskowy Operacji pilnuje Złotego Kryształu Elektrycznego.', '4-1.npc3.1': 'Więc ten kryształ to klucz.',
  '4-1.militar.0': 'Jestem WOJSKOWYM Operacji. Trzy razy większym od Szefa!', '4-1.militar.1': 'Jest gigantyczny!', '4-1.militar.2': 'Nie obchodzi mnie, jaki jest duży!',
  '4-1.transform.0': 'Ta energia... jest niesamowita...', '4-1.transform.1': 'Teraz, Imperialisto. Idę po ciebie.',
  '4-2.start.0': 'Najwyższy zamek. On jest na górze.',
  '4-3.start.0': 'Tu kończy się droga.',
  '4-3.boss.0': 'A więc to ty zrujnowałeś wszystkie moje operacje.', '4-3.boss.1': 'Uwielbiam rządzić! I będę rządził całym światem!', '4-3.boss.2': 'To koniec, Imperialisto.', '4-3.boss.3': 'Jeszcze zobaczymy.',
  '4-3.phase2.0': 'ZŁOCI SŁUGUSI! BROŃCIE SWOJEGO KRÓLA!',
  '4-3.phase3.0': 'Nie... jak to możliwe?!', '4-3.phase3.1': 'Poddaj się!',
  '4-3.end.0': 'Moje... królestwo...', '4-3.end.1': 'Mieszkańcy są wolni. A ty już nikim nie będziesz rządził.',
  '4-3.end.2': 'Statki powietrzne spadły. Łańcuchy pękły.', '4-3.end.3': 'Zamki zaczęły się rozpadać...', '4-3.end.4': 'Chulin uratował świat!',
  cr_by: 'Twórca', cr_studio: 'Studio', cr_owned: 'Należy do', cr_rights: 'Prawa do postaci', t_bossRetry: 'Walka z bossem zaczyna się od nowa. Spróbuj jeszcze raz!',
  opt_aim: 'Celowanie', aim_drag: 'przeciągnij przycisk strzału', aim_stick: 'dodatkowy joystick', t_fly: 'Lot',
  desc_electrico: 'Chulin po dotknięciu Złotego Kryształu Elektrycznego. Staje się istotą najwyższą: większy, szybszy, ma 6 serc, krótki lot (przytrzymaj ⤒ w powietrzu) i strzela błyskawicami.',

  role_acuatico: 'Kötü · Uşak', role_dorado_s: 'Kötü · Uşak', role_militarOp: 'Kötü · Patron', role_imperialista: 'Kötü · SON PATRON',
  desc_chulin: 'Chulin oyunun ana kahramanı: cesur, başkalarını önemseyen ve çok nazik biri. Herkes onu sever. En iyi arkadaşı Mexicano. Bir maceradaki kazada bir gözünü kaybetti ve ona hediye olarak altın bir göz verildi. Küçük sarı bir tabanca kullanır.',
  desc_mexicano: "Mexicano, Chulin'in en iyi arkadaşı. Chulin'in sol gözünü kaybettiği aynı macerada o da sağ gözünü kaybetti ama ona kimse bir şey vermedi, bu yüzden sadece göz bandı takıyor. \"Herkes onları her yerden izlediğini düşünsün\" diye sırtına bir göz çizdi, ama gözün fazla çarpık olduğundan haberi yok. Gerçek tüfekler kullanır.",
  desc_dorado: "Chulin'in parlak altın versiyonu. Bir fazla kalbi var. Toplam 200 altın toplayınca açılır (her bölümün rekoru sayılır).",
  desc_volador: "Roket çantalı bir Uşak. Emperyalist'in yenilgisinden sonra taraf değiştirmeye karar verdi. Bir süre uçmak için havada ⤒ tuşunu basılı tut.",
  desc_aldeano: "Güneş Köyü'nün köylüleri: beyaz, sakin ve nazik countryball'lar. Birçoğu Uşaklar tarafından kaçırıldı.",
  desc_alcalde: "Güneş Köyü'nün belediye başkanı. Uşaklar onu bir kafese kapattı ama Chulin onu kurtardı ve o da maceraya katıldı.",
  desc_militar: "Yüksek Askerler Şehri'nin köylüleri yeşil kep takar. Tüm köylerin en güçlüleriydiler... kelepçelenene kadar.",
  desc_general: "Yüksek Askerler Şehri'nin lideri. Şehri kurtarması için Chulin'e emirler verir. Başkalarını sınamayı sever.",
  desc_playista: "Cacionesvaca Adası'nın köylüleri her zaman güneş gözlüğü takar. Denizin birçok sırrını bilirler.",
  desc_esclavo: "Her kasabadan köylüler; Emperyalist'e hizmet etmeleri için köle olarak Sulu Şehri'ne götürüldüler.",
  desc_comun: "Daha önce hiç görülmemiş, kırmızı gözlü, kırmızı yıldızlı ve mavi tabancalı countryball'lar. Hükmetmeye bayılırlar.",
  desc_guard: "Chulin'in karşılaştığı ilk Uşak: diğerleri Güneş Köyü'nü yakarken onları koruyan bir muhafız.",
  desc_gigante: 'Alev silahlı dev bir Uşak. Fazla yaklaşma!',
  desc_jefe: "Operasyon Şefi: bir devden bile büyük ve polis şapkalı. Emperyalist'in her şatosunu korur.",
  desc_acuatico: 'Yüzen ve alevli piranalar fırlatan, dalgıç gözlüklü Uşaklar. Elektrik ile suyun anlaşamadığı söylenir...',
  desc_dorado_s: "Sulu Şehri'nin seçkin Uşakları. Uçanlardan çok daha iyi ve kontrollü uçarlar ve tüfek taşırlar.",
  desc_militarOp: "Sulu Şehri'nde Operasyon Şefleri, Operasyon Askeri olur: üç kat daha büyük!",
  desc_imperialista: 'Uşakların lideri. Altın bir taç takar ve tüm dünyayı ele geçirmek ister. Hükmetmeye bayılır.',
  lock_chulin: '', lock_mexicano: '1-2. bölümde açılır.', lock_dorado: 'Toplam 200 altın topla (her bölümün rekoru).', lock_electrico: 'Oyunu bitir.', lock_volador: 'Oyunu bitir.',
  'story1.title': 'Dünya 1: Güneş Köyü',
  'story1.0': "Sıradan bir gündü. Chulin, her zamanki küçük sarı tabancasıyla kendi mahallesi Güneş Köyü'nde yürüyüşe çıkmıştı.",
  'story1.1': 'Ama havada tuhaf bir şey vardı... duman kokuyordu.',
  'story1.2': 'Chulin farkında olmadan hayatının en büyük macerasına başlamak üzereydi.',
  'story2.title': 'Dünya 2: Yüksek Askerler Şehri',
  'story2.0': "Güneş Köyü'nü kurtardıktan sonra Chulin ve Mexicano bir sonraki yere doğru yelken açtı: tüm köylerin en güçlüleri olan Yüksek Askerler Şehri'ne.",
  'story2.1': 'Ama vardıklarında gökdelenler yanıyordu ve köylüler kelepçeliydi.',
  'story3.title': 'Dünya 3: Cacionesvaca Adası',
  'story3.0': "Uşakları su üzerinde kovalayan Chulin, küçük adalardan oluşan Cacionesvaca Adası'na vardı.",
  'story3.1': 'Orada daha fazla Su Uşağı ortaya çıktı... ve yeni bir tür: Uçan Uşak.',
  'story4.title': 'Dünya 4: Sulu Şehri',
  'story4.0': "Milyonlarca şato gökyüzünde uçuyordu, hepsi en önemli şehir olan Sulu Şehri'ne gidiyordu.",
  'story4.1': "Artık orada her şey şato. Chulin artık bölüm geçmiyor: şatoları ve çalınmış şehirlerin parçalarını keşfetmeli... ve Altın Elektrik Kristali'ni bulmalı.",
  'ending.title': 'Son söz',
  'ending.0': 'Emperyalist yenilince şatolar kuru yapraklar gibi gökten düşmeye başladı.',
  'ending.1': "Tüm kasabaların köylüleri özgür kaldı ve evlerine döndü: Güneş Köyü'ne, Yüksek Askerler Şehri'ne ve Cacionesvaca Adası'na.",
  'ending.2': 'Chulin yine eski hâline döndü. Uçan Uşak pişman oldu ve iyilerin tarafına geçti.',
  'ending.3': 'Ama Chulin en iyi arkadaşıyla kutlamak için arkasını döndüğünde... Mexicano orada değildi. Acaba nereye gitti? Devam edecek...',
  'crystal.0': 'Bir Elektrik Kristali! Çok... güçlü hissettiriyor.', 'crystal.1': 'Her şatoda bir tane olduğu söyleniyor, kanka.', 'crystal.2': 'Bunu saklayacağım. İçimden bir ses ona ihtiyacımız olacağını söylüyor.',
  '1-1.start.0': "Güneş Köyü'nde yürüyüş için ne güzel bir gün!", '1-1.start.1': 'Komşulara bir merhaba diyeyim.',
  '1-1.smoke.0': 'Ha? Duman mı?', '1-1.smoke.1': 'Köy yanıyor mu?!',
  '1-1.who.0': "Bunlar da kim? Böyle countryball'lar hiç görmedim...", '1-1.who.1': 'Kırmızı gözler ve mavi tabancalar! Köye saldırıyorlar!',
  '1-1.guard.0': "Dur! Kimse Emperyalist'in emirlerine engel olamaz.", '1-1.guard.1': 'Empery-ne? Komşularımı rahat bırak!', '1-1.guard.2': 'Hehe... artık çok geç.',
  '1-1.guardEnd.0': 'Of... diğerleri nereye gitti?', '1-1.guardEnd.1': 'Kimse kalmadı... köylüleri götürdüler.',
  '1-1.villager.0': 'Chulin! Çok şükür iyisin!', '1-1.villager.1': 'Burada ne oldu? Onlar kimdi?',
  '1-1.villager.2': 'Onlara Uşaklar diyorlar... evleri yaktılar ve birçok kişiyi götürdüler.', '1-1.villager.3': "Dünyayı ele geçirmek isteyen bir Emperyalist varmış.",
  '1-1.villager.4': 'O zaman onu durdurmam gerek. Gidip araştıracağım!',
  '1-2.start.0': 'CHULIN! Sonunda seni buldum, kanka!', '1-2.start.1': 'Mexicano! İyi misin?', '1-2.start.2': 'Uşaklar geldiğinde saklandım. İnsanları nereye götürdüklerini gördüm.',
  '1-2.start.3': 'Al, tüfek getirdim. Gerçekleri gibi çalışıyorlar! Birlikte gidelim!', '1-2.start.4': 'İşte bu!', '1-2.start.5': 'Mexicano katıldı! Artık oynanabilir bir karakter.',
  '1-2.npc1.0': 'Ağaçlar yangından kurudu...', '1-2.npc1.1': 'Dikkat et, her yere diken, mayın ve bomba bıraktılar.',
  '1-2.giant.0': 'YAKIIIN!!', '1-2.giant.1': 'Bu Uşak DEV gibi! Bir de alev silahı var!', '1-2.giant.2': 'Ne kadar büyükse o kadar sert düşer!',
  '1-2.giantEnd.0': 'O gerçekten kocamandı!', '1-2.giantEnd.1': 'Devam edelim. Diğerlerini bulmalıyız.',
  '1-3.start.0': 'Uçan platformlar mı? Bu Uşakların teknolojisi...', '1-3.start.1': 'Ya düşersek?', '1-3.start.2': 'Eee... düşmeyelim o zaman.',
  '1-3.mayor.0': 'Chulin! Beni kurtardın!', '1-3.mayor.1': 'Başkan! İyi misiniz?', '1-3.mayor.2': 'Uşaklar köyün sonunda bir şato inşa etti. Liderleri orada.',
  '1-3.mayor.3': 'Yolu biliyorum. Seninle geliyorum!', '1-3.mayor.4': 'Haydi o şatoya!',
  '1-4.start.0': 'İşte şato. Dikkat: sahte yollar, lav ve testereler var.', '1-4.start.1': 'Bir de rastgele yerlere götüren portallar...', '1-4.start.2': 'Hiçbir şeyden korkmam. İleri!',
  '1-4.portal.0': 'Duvar mı? Şimdi nereden?', '1-4.portal.1': 'O portal... bizi her yere götürebilir. Risk almalıyız!',
  '1-4.boss.0': 'Ben bu bölgenin Operasyon Şefiyim.', '1-4.boss.1': 'Emperyalist başarısızlığa tahammül etmez... o yüzden başarısız olmayacağım!', '1-4.boss.2': 'Köylüleri geri ver!', '1-4.boss.3': 'Hadi kanka, yakala onu!',
  '1-4.bossEnd.0': 'O-olamaz... Emperyalist bunu duyacak...', '1-4.bossEnd.1': 'Güneş Köyü yeniden özgür!',
  '1-5.start.0': 'Köy eski hâline döndü. Herkes kutlama yapıyor!', '1-5.start.1': 'Toplayabildiğin kadar altın topla!',
  '1-5.npc1.0': 'Chulin, sen bir kahramansın!', '1-5.npc1.1': 'Sadece doğru olanı yaptım.',
  '1-5.npc2.0': 'Evim artık yanmıyor! Teşekkürler, teşekkürler, teşekkürler!',
  '1-5.npc3.0': 'Mexicano, sen de bir kahramansın!', '1-5.npc3.1': 'Biliyorum! Yani... teşekkürler.',
  '1-5.mayor.0': 'Bizi kurtardığın için teşekkürler, Chulin!', '1-5.mayor.1': "Ama Uşaklar denizden geldi... ve insanları Yüksek Askerler Şehri'ne doğru götürdüler.",
  '1-5.mayor.2': 'Onlar tüm köylerin en güçlüleriydi. Onlara saldırıldıysa bu çok ciddi.', '1-5.mayor.3': 'O zaman oraya gideceğiz.', '1-5.mayor.4': 'Gemiyi hazırlayın, Başkan!',
  '1-6.start.0': "Herkes gemiye! Gemi bizi Yüksek Askerler Şehri'ne götürecek.", '1-6.start.1': 'Denize!', '1-6.start.2': 'Umarım deniz tutmaz...',
  '1-6.ambush.0': 'Gemilerde Uşaklar var!', '1-6.ambush.1': 'Bizi durduramayacaklar!',
  '1-6.end.0': 'İşte Yüksek Askerler Şehri... ama çok duman var.', '1-6.end.1': 'Kötü bir şey olmuş. Gidelim.',
  '2-1.start.0': 'Şehir... köylüler kelepçeli!', '2-1.start.1': 'Yüksek Askerleri bile yenmişler...',
  '2-1.npc1.0': 'Bizi kelepçelediler... biz, Yüksek Askerleri!', '2-1.npc1.1': "General'i bul. Ne yapacağını o bilir.",
  '2-1.npc2.0': 'Yeşil kepim... şehrin gururuydu... hıçkır...',
  '2-1.general.0': "Sen Chulin misin? Güneş Köyü'nü kurtardığını duydum.", '2-1.general.1': 'Evet. Burada ne oldu?',
  '2-1.general.2': 'Uşaklar gökdelenleri ateşe verdi. Şehri kurtar: binalara tırman ve şatolarına ulaş.',
  '2-1.general.3': 'Ama burada ateş etmek yetmez. Sana yakın dövüşü öğreteceğim!', '2-1.general.4': 'Yakın dövüşü öğrendin! Vurmak için yumruk tuşuna dokun.',
  '2-2.start.0': 'Gökdelenler yanıyor. Çatıdan çatıya atla.', '2-2.start.1': 'Ne kadar yüksek!',
  '2-2.smoke.0': '*öhö öhö* Çok fazla duman! Uzun süre yakın kalırsam boğulurum...', '2-2.smoke.1': 'Dumanın içinde durma, kanka. Seni yavaşlatıyor!',
  '2-3.start.0': 'Yine duman... hızlı geçmeliyiz.', '2-3.start.1': 'Şatoya neredeyse geldik!',
  '2-4.start.0': 'Bu şato bir kule. Hepsine tırmanman gerekecek.', '2-4.start.1': "Bir de Şef'i koruyan anahtarı bulmalısın.",
  '2-4.boss.0': 'Buraya nasıl çıktın?!', '2-4.boss.1': "Bu şehir Emperyalist'e ait!", '2-4.boss.2': 'Artık değil!',
  '2-4.bossEnd.0': 'Al... şehrin anahtarı... hehehe...', '2-4.bossEnd.1': 'Chulin ELEKTRİKLİ TABANCA kazandı! (⟳ ile değiştir)', '2-4.bossEnd.2': 'Elektrikli tabanca!',
  '2-4.cutkey.0': 'Anahtar ikiye bölünmüş!', '2-4.cutkey.1': 'Sakızla yapıştırsak?', '2-4.cutkey.2': 'Daha iyi bir fikrim var... elektrikli tabancayla ona ateş et!',
  '2-4.keyElec.0': 'Elektrik onu kaynattı! Artık çalışıyor!', '2-4.keyElec.1': 'Vay... yakala onu!',
  '2-4.free.0': 'Kelepçeler açıldı! Şehir özgür!', '2-4.free.1': 'Başardık!',
  '2-5.start.0': 'Şehir kutlama yapıyor! Tadını çıkar, Chulin.', '2-5.start.1': 'Her yerde altın!',
  '2-5.npc1.0': 'Bizi kurtardığın için teşekkürler! İstediğin kadar altın al.',
  '2-5.npc2.0': 'Yaşasın Chulin!', '2-5.npc2.1': 'Peki ya ben? Kimse "yaşasın Mexicano" demiyor mu?',
  '2-5.ambush.0': "ASKERLER! CHULIN'E SALDIRIN!", '2-5.ambush.1': 'Ne?! Neden bana saldırıyorsunuz?!', '2-5.ambush.2': 'Bu bir tuzaktı!',
  '2-5.test.0': 'Hahaha, sakin ol Chulin. Bu bir sınavdı.', '2-5.test.1': 'Bize yardım etmeye gerçekten layık mısın görmek istedik. Ve layıksın!',
  '2-5.test.2': '...bir sınav mı?', '2-5.test.3': 'Hehe! Bu benimle geliyor!', '2-5.test.4': 'AAAH! İMDAT!', '2-5.test.5': 'GENERAL! Peşinden!',
  '2-6.start.0': 'Onu su üzerinden kaçırıyor!', '2-6.start.1': 'Onu yakalamalısın, kanka!',
  '2-6.kidnap.0': 'Beni asla yakalayamazsın! Piranalar, saldırın!', '2-6.kidnap.1': 'Chulin, yardım et!',
  '2-6.piranha.0': 'Bak kanka! Elektrikli tabancayla suya ateş edince piranalar kızarıyor. Birini yakalarsan elektrik kalkanı kazanırsın!',
  '2-6.end.0': 'Beni yine kurtardın! Gerçekten layıksın.', '2-6.end.1': 'İnsanları nereye götürüyorlardı?', '2-6.end.2': "Denizin ötesinde Cacionesvaca Adası var. Uşaklar oraya gidiyor.",
  '3-1.start.0': 'Cacionesvaca Adası: küçük adalar, güneş ve her yerde su.', '3-1.start.1': 'Tatil! ...yok, değil.',
  '3-1.npc1.0': "Cacionesvaca Adası'na hoş geldin, dostum!", '3-1.npc1.1': 'Dikkat et: su, Su Uşaklarıyla dolu.',
  '3-1.npc2.0': 'Alevli piranalar var!', '3-1.npc2.1': 'Elektrik ile suyun anlaşamadığı söylenir... Uşaklar için.',
  '3-1.npc3.0': 'Elektrikli tabancayla suya ateş et, görürsün. Adanın en eski numarası.',
  '3-2.start.0': 'Uçan Uşaklar mı?!', '3-2.start.1': 'Roket çantaları var! Yukarı nişan al!',
  '3-2.npc1.0': 'Bütün plaja testere koymuşlar... artık güneşlenmek bile mümkün değil.',
  '3-3.start.0': 'Resif. Adanın şatosuna neredeyse geldik.', '3-3.start.1': 'Gidelim.',
  '3-4.start.0': 'Adanın şatosu... neden bu kadar büyük bir zinciri var?', '3-4.start.1': 'Bundan hiç hoşlanmadım.',
  '3-4.boss.0': 'Çok geç kaldın, Chulin!', '3-4.boss.1': "Emperyalist'in planı çoktan başladı...", '3-4.boss.2': 'Onu durduracağım!',
  '3-4.bossEnd.0': 'Hehehe... yukarı bak.', '3-4.bossEnd.1': 'Bu ses de ne?',
  '3-4.lift.0': 'Şato dev bir zincire bağlıymış... ve KOCAMAN bir hava gemisi onu götürmeye başladı!', '3-4.lift.1': 'Gökyüzüne bak! Milyonlarca uçan şato var!',
  '3-4.lift.2': 'Hepsi aynı yere gidiyor...', '3-4.lift.3': 'Sulu Şehri. En önemli şehir.', '3-4.lift.4': 'O zaman peşlerinden!',
  '3-5.start.0': 'Şatoları gökyüzünde takip etmeliyiz.', '3-5.start.1': 'Aşağı bakma, aşağı bakma...',

  desc_chulin: '丘林是游戏的主角：他勇敢、关心别人，而且非常善良。大家都喜欢他。他最好的朋友是墨西哥诺。他在一次冒险中失去了一只眼睛，后来换上了别人送他的金色眼睛。他使用一把小小的黄色手枪。',
  desc_mexicano: '墨西哥诺是丘林最好的朋友。在丘林失去左眼的那次冒险中，他失去了右眼，但没有人送他任何东西，所以他只戴着眼罩。他在背上画了一只眼睛，想让"别人以为他到处都在看着"，却不知道画得太歪了。他使用真正的步枪。',
  desc_dorado: '闪闪发光的黄金版丘林。多一颗心。累计收集200枚金币即可解锁（按每关最高纪录计算）。',
  desc_volador: '背着火箭背包的爪牙。帝国主义者被打败后，他决定改邪归正。在空中按住⤒可以飞一会儿。',
  desc_aldeano: '太阳村的村民：白色的国家球，安静又友善。很多人被爪牙抓走了。',
  desc_alcalde: '太阳村的村长。他被爪牙关进了笼子，丘林救出了他，之后他陪着丘林一起冒险。',
  desc_militar: '高级军人城的居民都戴着绿色帽子。他们曾是所有村庄里最强大的……直到被戴上了手铐。',
  desc_general: '高级军人城的领袖。他命令丘林去解放城市。他喜欢考验别人。',
  desc_playista: '卡西奥内斯瓦卡岛的居民总是戴着墨镜。他们知道很多大海的秘密。',
  desc_esclavo: '来自各个城镇的村民，被抓到苏鲁城当奴隶，侍奉帝国主义者。',
  desc_comun: '从未见过的国家球：红眼睛、红星星，拿着蓝色手枪。他们最喜欢统治别人。',
  desc_guard: '丘林第一个对战的爪牙：一个守卫，在同伙烧毁太阳村时负责把风。',
  desc_gigante: '拿着火焰喷射器的巨大爪牙。别靠太近！',
  desc_jefe: '行动队长：比巨人还大，戴着警帽。他守护着帝国主义者的每一座城堡。',
  desc_acuatico: '戴着泳镜的爪牙，会游泳，还会扔着火的食人鱼。听说电和水合不来……',
  desc_dorado_s: '苏鲁城的精英爪牙。比飞行爪牙飞得更好、更灵活，还拿着步枪。',
  desc_militarOp: '在苏鲁城，行动队长会晋升为行动将军：体型足足大三倍！',
  desc_imperialista: '爪牙们的首领。戴着金色王冠，想要统治整个世界。最喜欢统治别人。',
  lock_chulin: '', lock_mexicano: '在1-2关解锁。', lock_dorado: '累计收集200枚金币（每关最高纪录）。', lock_electrico: '通关游戏。', lock_volador: '通关游戏。',
  'story1.title': '世界1：太阳村',
  'story1.0': '那是普通的一天。丘林带着他那把小小的黄色手枪，在自己的家乡太阳村散步。',
  'story1.1': '可是空气里有种奇怪的感觉……闻起来像烟。',
  'story1.2': '丘林还不知道，他人生中最大的冒险即将开始。',
  'story2.title': '世界2：高级军人城',
  'story2.0': '解放太阳村之后，丘林和墨西哥诺扬帆前往下一个城镇：高级军人城，所有村庄中最强大的地方。',
  'story2.1': '可是当他们到达时，摩天楼在燃烧，居民们都戴着手铐。',
  'story3.title': '世界3：卡西奥内斯瓦卡岛',
  'story3.0': '丘林在水上追赶爪牙，来到了由许多小岛组成的卡西奥内斯瓦卡岛。',
  'story3.1': '那里出现了更多水中爪牙……还有一种新的爪牙：飞行爪牙。',
  'story4.title': '世界4：苏鲁城',
  'story4.0': '数百万座城堡在天空中飞行，全都飞向最重要的城市——苏鲁城。',
  'story4.1': '现在那里全是城堡。丘林不再按关卡前进：他必须探索城堡和被偷走的城市碎片……并找到黄金电击水晶。',
  'ending.title': '尾声',
  'ending.0': '帝国主义者被打败后，城堡像枯叶一样从天上落了下来。',
  'ending.1': '各个城镇的村民都被解放，回到了自己的家：太阳村、高级军人城和卡西奥内斯瓦卡岛。',
  'ending.2': '丘林又变回了平常的样子。飞行爪牙感到后悔，决定加入正义的一方。',
  'ending.3': '可是当丘林转身想和最好的朋友一起庆祝时……墨西哥诺不见了。他去哪里了呢？未完待续……',
  'crystal.0': '电击水晶！感觉……力量好强。', 'crystal.1': '听说每座城堡里都有一颗，兄弟。', 'crystal.2': '我收着吧。总觉得以后会用得上。',
  '1-1.start.0': '真是在太阳村散步的好日子！', '1-1.start.1': '去跟邻居们打个招呼吧。',
  '1-1.smoke.0': '咦？烟？', '1-1.smoke.1': '村子着火了？！',
  '1-1.who.0': '他们是谁？我从没见过这样的国家球……', '1-1.who.1': '红眼睛和蓝手枪！他们在袭击村子！',
  '1-1.guard.0': '站住！谁也不许妨碍帝国主义者大人的命令。', '1-1.guard.1': '帝国什么？离我的邻居远一点！', '1-1.guard.2': '嘿嘿……已经太迟了。',
  '1-1.guardEnd.0': '呼……其他人去哪了？', '1-1.guardEnd.1': '一个都不剩了……他们把村民带走了。',
  '1-1.villager.0': '丘林！谢天谢地你没事！', '1-1.villager.1': '这里发生了什么？那些家伙是谁？',
  '1-1.villager.2': '他们被叫做"爪牙"……他们烧了房子，抓走了好多人。', '1-1.villager.3': '听说有个帝国主义者想要统治世界。',
  '1-1.villager.4': '那我一定要阻止他。我去调查一下！',
  '1-2.start.0': '丘林！终于找到你了，兄弟！', '1-2.start.1': '墨西哥诺！你没事吧？', '1-2.start.2': '爪牙来的时候我躲起来了。我看见他们把大家带到哪里去了。',
  '1-2.start.3': '给，我带了步枪。跟真的一样好用！我们一起走吧！', '1-2.start.4': '这才对嘛！', '1-2.start.5': '墨西哥诺加入了！现在他是可操作的角色。',
  '1-2.npc1.0': '树都被火烤干了……', '1-2.npc1.1': '小心，他们到处留下了尖刺、地雷和炸弹。',
  '1-2.giant.0': '烧光一切！！', '1-2.giant.1': '那个爪牙好巨大！还拿着火焰喷射器！', '1-2.giant.2': '块头越大，摔得越重！',
  '1-2.giantEnd.0': '那家伙真够大的！', '1-2.giantEnd.1': '继续前进。我们得找到其他人。',
  '1-3.start.0': '飞行平台？这是爪牙的科技……', '1-3.start.1': '要是掉下去怎么办？', '1-3.start.2': '呃……那就别掉下去。',
  '1-3.mayor.0': '丘林！你救了我！', '1-3.mayor.1': '村长！您没事吧？', '1-3.mayor.2': '爪牙在村子尽头建了一座城堡。他们的头目就在那里。',
  '1-3.mayor.3': '我认识路。我跟你一起去！', '1-3.mayor.4': '向那座城堡出发！',
  '1-4.start.0': '这就是城堡。小心：这里有假路、熔岩和锯子。', '1-4.start.1': '还有会把你传送到随机地点的传送门……', '1-4.start.2': '我什么都不怕。前进！',
  '1-4.portal.0': '一堵墙？现在往哪走？', '1-4.portal.1': '那个传送门……可能把我们带到任何地方。只能赌一把了！',
  '1-4.boss.0': '我是这一带的行动队长。', '1-4.boss.1': '帝国主义者大人绝不容忍失败……所以我不会输！', '1-4.boss.2': '把村民还回来！', '1-4.boss.3': '上啊，兄弟！',
  '1-4.bossEnd.0': '不、不可能……帝国主义者大人会知道的……', '1-4.bossEnd.1': '太阳村又自由了！',
  '1-5.start.0': '村子恢复了原样。大家都在庆祝！', '1-5.start.1': '尽量多收集金币吧！',
  '1-5.npc1.0': '丘林，你是英雄！', '1-5.npc1.1': '我只是做了该做的事。',
  '1-5.npc2.0': '我的房子不再着火了！谢谢，谢谢，谢谢！',
  '1-5.npc3.0': '墨西哥诺，你也是英雄！', '1-5.npc3.1': '我知道！呃……谢谢啦。',
  '1-5.mayor.0': '谢谢你救了我们，丘林！', '1-5.mayor.1': '不过爪牙是从海上来的……他们把人带往了高级军人城。',
  '1-5.mayor.2': '他们曾是所有村庄里最强大的。如果连他们都遭到袭击，事情就严重了。', '1-5.mayor.3': '那我们就去那里。', '1-5.mayor.4': '村长，准备好船吧！',
  '1-6.start.0': '大家上船！这艘船会带我们去高级军人城。', '1-6.start.1': '出海啦！', '1-6.start.2': '希望我不会晕船……',
  '1-6.ambush.0': '船上有爪牙！', '1-6.ambush.1': '他们阻止不了我们！',
  '1-6.end.0': '那就是高级军人城……可是浓烟滚滚。', '1-6.end.1': '一定出了什么坏事。走吧。',
  '2-1.start.0': '这座城……居民们都戴着手铐！', '2-1.start.1': '连高级军人都被打败了……',
  '2-1.npc1.0': '他们给我们戴上了手铐……我们可是高级军人啊！', '2-1.npc1.1': '去找将军。他知道该怎么做。',
  '2-1.npc2.0': '我的绿帽子……曾是全城的骄傲……呜呜……',
  '2-1.general.0': '你就是丘林？我听说你解放了太阳村。', '2-1.general.1': '是的。这里发生了什么？',
  '2-1.general.2': '爪牙放火烧了摩天楼。去解放这座城吧：爬上大楼，抵达他们的城堡。',
  '2-1.general.3': '不过在这里光会开枪可不够。我来教你近身格斗！', '2-1.general.4': '你学会了近战！点击拳头按钮出拳。',
  '2-2.start.0': '摩天楼在燃烧。从一个屋顶跳到另一个屋顶。', '2-2.start.1': '好高啊！',
  '2-2.smoke.0': '咳咳……好多烟！在旁边待太久会窒息的……', '2-2.smoke.1': '别待在烟里，兄弟。它会让你变慢！',
  '2-3.start.0': '又是烟……得快点通过。', '2-3.start.1': '快到城堡了！',
  '2-4.start.0': '这座城堡是一座塔。你得一路爬到顶。', '2-4.start.1': '还要找到守护队长的钥匙。',
  '2-4.boss.0': '你是怎么上来的？！', '2-4.boss.1': '这座城属于帝国主义者大人！', '2-4.boss.2': '以后不是了！',
  '2-4.bossEnd.0': '拿去吧……城市的钥匙……嘿嘿嘿……', '2-4.bossEnd.1': '丘林获得了电击手枪！（用⟳切换）', '2-4.bossEnd.2': '电击手枪！',
  '2-4.cutkey.0': '钥匙断成两半了！', '2-4.cutkey.1': '要不要用泡泡糖粘起来？', '2-4.cutkey.2': '我有更好的主意……用电击手枪打它！',
  '2-4.keyElec.0': '电流把它焊上了！现在能用了！', '2-4.keyElec.1': '哇……快拿着！',
  '2-4.free.0': '手铐打开了！这座城自由了！', '2-4.free.1': '我们成功了！',
  '2-5.start.0': '全城都在庆祝！好好享受吧，丘林。', '2-5.start.1': '到处都是金币！',
  '2-5.npc1.0': '谢谢你解放了我们！金币想拿多少就拿多少。',
  '2-5.npc2.0': '丘林万岁！', '2-5.npc2.1': '那我呢？没人喊"墨西哥诺万岁"吗？',
  '2-5.ambush.0': '士兵们！攻击丘林！', '2-5.ambush.1': '什么？！你们为什么攻击我？！', '2-5.ambush.2': '这是个陷阱！',
  '2-5.test.0': '哈哈哈，冷静，丘林。这是个考验。', '2-5.test.1': '我们想看看你是否真的有资格帮助我们。你通过了！',
  '2-5.test.2': '……考验？', '2-5.test.3': '嘿嘿！这家伙我带走了！', '2-5.test.4': '啊啊啊！救命！', '2-5.test.5': '将军！快追！',
  '2-6.start.0': '他把将军从水上带走了！', '2-6.start.1': '你一定要抓住他，兄弟！',
  '2-6.kidnap.0': '你永远抓不到我！食人鱼，进攻！', '2-6.kidnap.1': '丘林，救救我！',
  '2-6.piranha.0': '看啊，兄弟！用电击手枪打水，食人鱼就被烤焦了。抓住一条就能得到电击护盾！',
  '2-6.end.0': '你又救了我！你真的很有资格。', '2-6.end.1': '他们要把大家带到哪里去？', '2-6.end.2': '大海那边是卡西奥内斯瓦卡岛。爪牙们正往那里去。',
  '3-1.start.0': '卡西奥内斯瓦卡岛：小岛、阳光，到处都是水。', '3-1.start.1': '度假啦！……才怪。',
  '3-1.npc1.0': '欢迎来到卡西奥内斯瓦卡岛，朋友！', '3-1.npc1.1': '小心：水里全是水中爪牙。',
  '3-1.npc2.0': '有着火的食人鱼！', '3-1.npc2.1': '听说电和水合不来……对爪牙来说是这样。',
  '3-1.npc3.0': '用电击手枪打水试试看。这是岛上最古老的诀窍。',
  '3-2.start.0': '会飞的爪牙？！', '3-2.start.1': '他们背着火箭背包！往上瞄准！',
  '3-2.npc1.0': '他们在整个海滩上放了锯子……连日光浴都没法晒了。',
  '3-3.start.0': '珊瑚礁。快到岛上的城堡了。', '3-3.start.1': '走吧。',

  'story2.1': '하지만 도착해 보니 고층 빌딩은 불타고 있었고, 주민들은 수갑을 차고 있었어요.',
  'story3.title': '월드 3: 카시오네스바카 섬',
  'story3.0': '물 위에서 부하들을 쫓던 출린은 작은 섬들로 이루어진 카시오네스바카 섬에 도착했어요.',
  'story3.1': '그곳에는 더 많은 수중 부하들... 그리고 새로운 종류, 날아다니는 부하가 나타났어요.',
  'story4.title': '월드 4: 술루 시티',
  'story4.0': '수백만 개의 성이 하늘을 날아 가장 중요한 도시, 술루 시티로 향하고 있었어요.',
  'story4.1': '이제 그곳은 온통 성뿐이에요. 출린은 더 이상 스테이지를 깨지 않아요. 성과 훔쳐 온 도시 조각들을 탐험하고... 황금 전기 크리스털을 찾아야 해요.',
  'ending.title': '에필로그',
  'ending.0': '임페리얼리스트가 쓰러지자, 성들이 마른 나뭇잎처럼 하늘에서 떨어지기 시작했어요.',
  'ending.1': '모든 마을의 주민이 풀려나 집으로 돌아갔어요. 태양 마을로, 고위 군인의 도시로, 카시오네스바카 섬으로.',
  'ending.2': '출린은 다시 평소의 모습으로 돌아왔어요. 날아다니는 부하는 잘못을 뉘우치고 착한 편에 서기로 했어요.',
  'ending.3': '그런데 출린이 가장 친한 친구와 축하하려고 돌아봤을 때... 멕시카노는 없었어요. 어디로 간 걸까요? 다음 이야기에 계속...',
  'crystal.0': '전기 크리스털이다! 엄청난... 힘이 느껴져.', 'crystal.1': '성마다 하나씩 있다더라, 친구.', 'crystal.2': '챙겨 둘게. 왠지 꼭 필요할 것 같아.',
  '1-1.start.0': '태양 마을을 산책하기 딱 좋은 날이야!', '1-1.start.1': '이웃들한테 인사하러 가야지.',
  '1-1.smoke.0': '어? 연기?', '1-1.smoke.1': '마을에 불이 났다고?!',
  '1-1.who.0': '저건 누구지? 저런 컨트리볼은 처음 봐...', '1-1.who.1': '빨간 눈에 파란 권총! 마을을 공격하고 있어!',
  '1-1.guard.0': '멈춰라! 임페리얼리스트 님의 명령은 아무도 방해할 수 없다.', '1-1.guard.1': '임페리... 뭐? 우리 이웃들 건드리지 마!', '1-1.guard.2': '헤헤... 이미 늦었어.',
  '1-1.guardEnd.0': '휴... 다른 녀석들은 어디 갔지?', '1-1.guardEnd.1': '아무도 없어... 주민들을 데려갔어.',
  '1-1.villager.0': '출린! 무사해서 다행이야!', '1-1.villager.1': '여기서 무슨 일이 있었어요? 저 녀석들은 누구죠?',
  '1-1.villager.2': '"부하"라고 불리는 놈들이야... 집을 불태우고 많은 사람을 끌고 갔어.', '1-1.villager.3': '세상을 지배하려는 임페리얼리스트라는 자가 있대.',
  '1-1.villager.4': '그럼 내가 막을게요. 조사하러 가겠어요!',
  '1-2.start.0': '출린! 드디어 찾았다, 친구!', '1-2.start.1': '멕시카노! 괜찮아?', '1-2.start.2': '부하들이 왔을 때 숨어 있었어. 사람들을 어디로 데려갔는지 봤지.',
  '1-2.start.3': '자, 소총 가져왔어. 진짜처럼 쏠 수 있다고! 같이 가자!', '1-2.start.4': '바로 그거야!', '1-2.start.5': '멕시카노가 동료가 됐어요! 이제 플레이할 수 있는 캐릭터예요.',
  '1-2.npc1.0': '불 때문에 나무가 다 말라 버렸어...', '1-2.npc1.1': '조심해. 가시랑 지뢰랑 폭탄을 여기저기 두고 갔어.',
  '1-2.giant.0': '다 태워 버려라!!', '1-2.giant.1': '저 부하 엄청 커! 게다가 화염 방사기까지!', '1-2.giant.2': '덩치가 클수록 더 세게 넘어지는 법이지!',
  '1-2.giantEnd.0': '진짜 덩치 컸다!', '1-2.giantEnd.1': '계속 가자. 다른 사람들을 찾아야 해.',
  '1-3.start.0': '날아다니는 플랫폼? 부하들의 기술이야...', '1-3.start.1': '떨어지면 어떡해?', '1-3.start.2': '음... 안 떨어지면 되지.',
  '1-3.mayor.0': '출린! 나를 구해 줬구나!', '1-3.mayor.1': '촌장님! 괜찮으세요?', '1-3.mayor.2': '부하들이 마을 끝에 성을 지었어. 놈들의 대장이 거기 있지.',
  '1-3.mayor.3': '내가 길을 알아. 같이 가자!', '1-3.mayor.4': '저 성으로 가자!',
  '1-4.start.0': '여기가 성이야. 조심해. 가짜 길, 용암, 톱날이 있어.', '1-4.start.1': '어디로 보낼지 모르는 포털도 있고...', '1-4.start.2': '난 무서운 거 없어. 전진!',
  '1-4.portal.0': '벽이잖아? 이제 어디로 가지?', '1-4.portal.1': '저 포털... 어디로든 갈 수 있어. 모험을 걸어 보자!',
  '1-4.boss.0': '나는 이 구역의 작전 대장이다.', '1-4.boss.1': '임페리얼리스트 님은 실패를 용납하지 않으신다... 그러니 난 지지 않아!', '1-4.boss.2': '주민들을 돌려줘!', '1-4.boss.3': '혼내 줘, 친구!',
  '1-4.bossEnd.0': '마, 말도 안 돼... 임페리얼리스트 님이 아시면...', '1-4.bossEnd.1': '태양 마을이 다시 자유를 찾았어!',
  '1-5.start.0': '마을이 원래대로 돌아왔어요. 모두 축제 중이에요!', '1-5.start.1': '코인을 최대한 많이 모으세요!',
  '1-5.npc1.0': '출린, 넌 영웅이야!', '1-5.npc1.1': '당연한 일을 했을 뿐이에요.',
  '1-5.npc2.0': '우리 집이 더 이상 안 불타! 고마워, 고마워, 고마워!',
  '1-5.npc3.0': '멕시카노, 너도 영웅이야!', '1-5.npc3.1': '알아! 아니... 고마워.',
  '1-5.mayor.0': '우리를 구해 줘서 고맙다, 출린!', '1-5.mayor.1': '하지만 부하들은 바다에서 왔어... 그리고 사람들을 고위 군인의 도시 쪽으로 데려갔지.',
  '1-5.mayor.2': '그들은 모든 마을 중 가장 강했어. 그들이 공격당했다면 아주 심각한 일이야.', '1-5.mayor.3': '그럼 그리로 가요.', '1-5.mayor.4': '배를 준비해 주세요, 촌장님!',
  '1-6.start.0': '모두 승선! 이 배가 고위 군인의 도시로 데려다줄 거야.', '1-6.start.1': '바다로!', '1-6.start.2': '배멀미 안 했으면 좋겠다...',
  '1-6.ambush.0': '배 위에 부하들이 있어!', '1-6.ambush.1': '우릴 막을 순 없어!',
  '1-6.end.0': '저기가 고위 군인의 도시야... 그런데 연기가 엄청나.', '1-6.end.1': '뭔가 안 좋은 일이 생겼어. 가자.',
  '2-1.start.0': '도시가... 주민들이 수갑을 차고 있어!', '2-1.start.1': '고위 군인들까지 당하다니...',
  '2-1.npc1.0': '우리한테 수갑을 채웠어... 우리, 고위 군인들한테!', '2-1.npc1.1': '장군님을 찾아. 그분이라면 어떻게 할지 아실 거야.',
  '2-1.npc2.0': '내 초록 모자... 도시의 자랑이었는데... 흑흑...',
  '2-1.general.0': '네가 출린이냐? 태양 마을을 해방했다고 들었다.', '2-1.general.1': '네. 여기서 무슨 일이 있었나요?',
  '2-1.general.2': '부하들이 고층 빌딩에 불을 질렀다. 도시를 해방해라. 빌딩을 올라 놈들의 성으로 가는 거다.',
  '2-1.general.3': '하지만 여기선 총만으론 부족해. 근접 격투를 가르쳐 주마!', '2-1.general.4': '근접 공격을 배웠어요! 주먹 버튼을 터치해서 때리세요.',
  '2-2.start.0': '고층 빌딩이 불타고 있어. 지붕에서 지붕으로 뛰어.', '2-2.start.1': '엄청 높다!',
  '2-2.smoke.0': '콜록콜록! 연기가 너무 많아! 오래 있으면 숨이 막힐 거야...', '2-2.smoke.1': '연기 속에 있지 마, 친구. 느려진다고!',
  '2-3.start.0': '또 연기야... 빨리 지나가자.', '2-3.start.1': '성이 거의 다 왔어!',
  '2-4.start.0': '이 성은 탑이야. 꼭대기까지 다 올라가야 해.', '2-4.start.1': '그리고 대장을 지키는 열쇠도 찾아야 해.',
  '2-4.boss.0': '여기까지 어떻게 올라왔지?!', '2-4.boss.1': '이 도시는 임페리얼리스트 님의 것이다!', '2-4.boss.2': '이제는 아니야!',
  '2-4.bossEnd.0': '옜다... 도시의 열쇠다... 헤헤헤...', '2-4.bossEnd.1': '출린이 전기 권총을 얻었어요! (⟳로 교체)', '2-4.bossEnd.2': '전기 권총이다!',
  '2-4.cutkey.0': '열쇠가 두 동강 났어!', '2-4.cutkey.1': '풍선껌으로 붙여 볼까?', '2-4.cutkey.2': '더 좋은 생각이 있어... 전기 권총으로 쏴 보자!',
  '2-4.keyElec.0': '전기로 붙었어! 이제 쓸 수 있어!', '2-4.keyElec.1': '와... 얼른 잡아!',
  '2-4.free.0': '수갑이 풀렸어! 도시가 자유를 찾았어!', '2-4.free.1': '해냈다!',
  '2-5.start.0': '도시가 축제 분위기야! 즐겨, 출린.', '2-5.start.1': '코인이 사방에 있어!',
  '2-5.npc1.0': '해방해 줘서 고마워! 코인은 마음껏 가져가.',
  '2-5.npc2.0': '출린 만세!', '2-5.npc2.1': '나는? "멕시카노 만세"는 없어?',
  '2-5.ambush.0': '병사들이여! 출린을 공격하라!', '2-5.ambush.1': '뭐?! 왜 나를 공격해요?!', '2-5.ambush.2': '함정이었어!',
  '2-5.test.0': '하하하, 진정해라, 출린. 시험이었다.', '2-5.test.1': '네가 정말 우리를 도울 자격이 있는지 보고 싶었다. 합격이다!',
  '2-5.test.2': '...시험이요?', '2-5.test.3': '헤헤! 이 녀석은 내가 데려간다!', '2-5.test.4': '으아악! 살려 줘!', '2-5.test.5': '장군님! 쫓아가자!',
  '2-6.start.0': '물 위로 장군님을 끌고 가고 있어!', '2-6.start.1': '꼭 잡아야 해, 친구!',
  '2-6.kidnap.0': '날 절대 못 잡을걸! 피라냐들아, 공격해라!', '2-6.kidnap.1': '출린, 도와줘!',
  '2-6.piranha.0': '봐, 친구! 전기 권총으로 물을 쏘면 피라냐가 바삭하게 익어. 한 마리 잡으면 전기 방패를 얻을 수 있어!',
  '2-6.end.0': '또 나를 구했구나! 넌 정말 자격이 있어.', '2-6.end.1': '사람들을 어디로 데려가려던 거죠?', '2-6.end.2': '바다 건너에 카시오네스바카 섬이 있다. 부하들이 그쪽으로 가고 있어.',
  '3-1.start.0': '카시오네스바카 섬: 작은 섬들, 햇살, 그리고 사방이 물.', '3-1.start.1': '휴가다! ...는 아니지.',
  '3-1.npc1.0': '카시오네스바카 섬에 온 걸 환영해, 친구!', '3-1.npc1.1': '조심해. 물속에 수중 부하들이 가득해.',
  '3-1.npc2.0': '불붙은 피라냐가 있어!', '3-1.npc2.1': '전기와 물은 상극이래... 부하들한테는 말이야.',
  '3-1.npc3.0': '전기 권총으로 물을 쏴 봐. 섬에서 제일 오래된 비법이야.',
  '3-2.start.0': '부하가 날아다닌다고?!', '3-2.start.1': '로켓 배낭을 멨어! 위를 노려!',
  '3-2.npc1.0': '해변 곳곳에 톱날을 설치했어... 이젠 일광욕도 못 해.',
  '3-3.start.0': '산호초야. 섬의 성이 거의 다 왔어.', '3-3.start.1': '가자.',
  '3-4.start.0': '섬의 성... 왜 저렇게 큰 사슬이 달려 있지?', '3-4.start.1': '느낌이 아주 안 좋아.',
  '3-4.boss.0': '늦었다, 출린!', '3-4.boss.1': '임페리얼리스트 님의 계획은 이미 시작됐다...', '3-4.boss.2': '내가 막겠어!',
  '3-4.bossEnd.0': '헤헤헤... 위를 봐라.', '3-4.bossEnd.1': '이게 무슨 소리지?',
  '3-4.lift.0': '성은 거대한 사슬에 묶여 있었어요... 그리고 어마어마하게 큰 비행선이 성을 끌고 가기 시작했어요!', '3-4.lift.1': '하늘을 봐! 수백만 개의 성이 날고 있어!',
  '3-4.lift.2': '전부 같은 곳으로 가고 있어...', '3-4.lift.3': '술루 시티. 가장 중요한 도시야.', '3-4.lift.4': '그럼 쫓아가자!',
  '3-5.start.0': '하늘에서 성들을 따라가야 해.', '3-5.start.1': '아래 보지 마, 아래 보지 마...',
  '3-5.end.0': '여기가... 술루 시티.', '3-5.end.1': '온통 성이야... 저 주민들 좀 봐...', '3-5.end.2': '노예로 끌려온 거야. 이제 끝이다, 임페리얼리스트!',
  '4-1.start.0': '모든 마을에서 노예로 끌려온 주민들. 훔쳐 온 도시 조각들. 어디를 봐도 성.', '4-1.start.1': '여기선 모두가 작전 대장이야...', '4-1.start.2': '그리고 우리는 출린과 멕시카노지. 가자!',
  '4-1.npc1.0': '태양 마을에서 끌려왔어... 밤낮없이 일하고 있어...', '4-1.npc1.1': '임페리얼리스트는 맨 꼭대기에 있대.',
  '4-1.npc2.0': '황금 부하를 조심해! 다른 녀석들보다 훨씬 잘 날아.',
  '4-1.npc3.0': '작전 장군이 황금 전기 크리스털을 지키고 있어.', '4-1.npc3.1': '그럼 그 크리스털이 열쇠구나.',
  '4-1.militar.0': '나는 작전 장군이다. 대장보다 세 배나 크지!', '4-1.militar.1': '엄청 커!', '4-1.militar.2': '크기 따윈 상관없어!',
  '4-1.transform.0': '이 힘... 굉장해...', '4-1.transform.1': '이제 됐어, 임페리얼리스트. 지금 간다.',
  '4-2.start.0': '가장 높은 성. 놈은 저 위에 있어.',
  '4-3.start.0': '길은 여기서 끝이야.',
  '4-3.boss.0': '그러니까 네 녀석이 내 작전을 모조리 망친 놈이군.', '4-3.boss.1': '나는 지배하는 게 정말 좋다! 온 세상을 지배하겠다!', '4-3.boss.2': '끝났어, 임페리얼리스트.', '4-3.boss.3': '그건 두고 봐야 알지.',

<script>/* js/input.js */
// Entrada: pantalla táctil (botones virtuales) + teclado (para probar en PC).
'use strict';

const Input = {
  keys: {},           // acción -> tecla presionada
  just: {},           // acción -> presionada este cuadro
  pointers: new Map(),
  taps: [],           // toques para menús {x,y}
  touchUsed: false,
  showControls: false, // el juego lo activa durante los niveles
  avail: { melee: false, swap: false },
  aimMode: 'drag',    // 'drag' = arrastrar el botón de disparo, 'stick' = joystick extra
  scale: 1,
  canvas: null,

  KEYMAP: {
    ArrowLeft: 'left', KeyA: 'left',
    ArrowRight: 'right', KeyD: 'right',
    ArrowUp: 'up', KeyW: 'up',
    ArrowDown: 'down', KeyS: 'down',
    Space: 'jump', KeyZ: 'jump',
    KeyX: 'shoot', KeyJ: 'shoot',
    KeyC: 'melee', KeyK: 'melee',
    KeyV: 'swap', KeyL: 'swap', KeyQ: 'swap',
    Escape: 'pause', KeyP: 'pause',
    Enter: 'confirm',
  },

  init(canvas) {
    this.canvas = canvas;
    window.addEventListener('keydown', (e) => {
      const a = this.KEYMAP[e.code];
      if (!a) return;
      e.preventDefault();
      if (!this.keys[a]) this.just[a] = true;
      this.keys[a] = true;
      if (a === 'jump' || a === 'confirm') this.just.any = true;
    });
    window.addEventListener('keyup', (e) => {
      const a = this.KEYMAP[e.code];
      if (a) this.keys[a] = false;
    });
    const opts = { passive: false };
    canvas.addEventListener('pointerdown', (e) => this.onDown(e), opts);
    canvas.addEventListener('pointermove', (e) => this.onMove(e), opts);
    canvas.addEventListener('pointerup', (e) => this.onUp(e), opts);
    canvas.addEventListener('pointercancel', (e) => this.onUp(e), opts);
    canvas.addEventListener('pointerleave', (e) => this.onUp(e), opts);
    canvas.addEventListener('contextmenu', (e) => e.preventDefault());
    window.addEventListener('blur', () => { this.keys = {}; this.pointers.clear(); });
  },

  toLogical(e) {
    const r = this.canvas.getBoundingClientRect();
    return { x: (e.clientX - r.left) * (VW / r.width), y: (e.clientY - r.top) * (VH / r.height) };
  },

  layout() {
    return {
      jump: { x: VW - 82, y: VH - 82, r: 54 },
      shoot: { x: VW - 205, y: VH - 58, r: 44 },
      melee: { x: VW - 196, y: VH - 172, r: 37 },
      swap: { x: VW - 70, y: VH - 200, r: 31 },
      left: { x: 72, y: VH - 70, r: 50 },
      right: { x: 190, y: VH - 70, r: 50 },
      pause: { x: VW - 36, y: 34, r: 26 },
      aim: { x: VW - 335, y: VH - 82, r: 52 },
    };
  },

  hitButton(p) {
    if (!this.showControls) return null;
    const L = this.layout();
    if (dist(p.x, p.y, L.pause.x, L.pause.y) < L.pause.r + 10) return 'pause';
    // Cruceta: toda la zona inferior izquierda
    if (p.x < 300 && p.y > VH * 0.42) return p.x < (L.left.x + L.right.x) / 2 ? 'left' : 'right';
    let best = null, bd = 1e9;
    for (const id of ['jump', 'shoot', 'melee', 'swap', 'aim']) {
      if ((id === 'melee' || id === 'swap') && !this.avail[id]) continue;
      if (id === 'aim' && this.aimMode !== 'stick') continue;
      const b = L[id];
      const d = dist(p.x, p.y, b.x, b.y);
      if (d < b.r * 1.45 && d / b.r < bd) { bd = d / b.r; best = id; }
    }
    return best;
  },

  onDown(e) {
    e.preventDefault();
    if (e.pointerType === 'touch') this.touchUsed = true;
    const p = this.toLogical(e);
    const btn = this.hitButton(p);
    const L = this.layout();
    const c = btn === 'shoot' || btn === 'aim' ? L[btn] : null;
    this.pointers.set(e.pointerId, { x: p.x, y: p.y, btn, cx: c ? c.x : p.x, cy: c ? c.y : p.y });
    if (btn) this.just[btn] = true;
    this.taps.push({ x: p.x, y: p.y, btn });
    this.just.any = true;
    if (typeof Sfx !== 'undefined') Sfx.unlock();
  },
  onMove(e) {
    const ptr = this.pointers.get(e.pointerId);
    if (!ptr) return;
    e.preventDefault();
    const p = this.toLogical(e);
    ptr.x = p.x; ptr.y = p.y;
    const btn = this.hitButton(p);
    if (ptr.btn === 'shoot' || ptr.btn === 'aim') return; // el dedo que apunta no cambia de botón
    if (btn !== ptr.btn) {
      // Permite deslizar el dedo entre izquierda/derecha
      if (btn === 'left' || btn === 'right' || ptr.btn === 'left' || ptr.btn === 'right') {
        if (btn && btn !== 'pause') this.just[btn] = true;
        ptr.btn = btn === 'pause' ? null : btn;
      }
    }
  },
  onUp(e) {
    this.pointers.delete(e.pointerId);
  },

  // Dirección de apuntado (vector unitario) o null. fire = disparar automáticamente (joystick extra).
  getAim() {
    for (const p of this.pointers.values()) {
      if (p.btn !== 'shoot' && p.btn !== 'aim') continue;
      if (p.btn === 'shoot' && this.aimMode !== 'drag') continue;
      const dx = p.x - p.cx, dy = p.y - p.cy, d = Math.hypot(dx, dy);
      if (d < 16) return p.btn === 'aim' ? { x: 0, y: 0, fire: false, idle: true } : null;
      return { x: dx / d, y: dy / d, fire: p.btn === 'aim', mag: Math.min(1, d / 52) };
    }
    if (this.keys.up) return { x: 0.7, y: -0.7, kb: true };
    if (this.keys.down) return { x: 0.7, y: 0.7, kb: true };
    return null;
  },
  down(a) {
    if (this.keys[a]) return true;
    for (const p of this.pointers.values()) if (p.btn === a) return true;
    return false;
  },
  pressed(a) { return !!this.just[a]; },
  consumeTaps() { const t = this.taps; this.taps = []; return t; },
  endFrame() { this.just = {}; this.taps.length = 0; },

  drawControls(ctx) {
    if (!this.showControls || !this.touchUsed) return;
    const L = this.layout();
    const btn = (b, id, draw) => {
      const on = this.down(id);
      ctx.save();
      ctx.globalAlpha = on ? 0.6 : 0.32;
      ctx.fillStyle = on ? '#fff' : '#000';
      ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, TAU); ctx.fill();
      ctx.globalAlpha = 0.85;
      ctx.lineWidth = 3; ctx.strokeStyle = '#fff'; ctx.stroke();
      ctx.translate(b.x, b.y);
      ctx.fillStyle = '#fff'; ctx.strokeStyle = '#fff';
      draw(b.r);
      ctx.restore();
    };
    const tri = (r, dir) => {
      ctx.beginPath();
      ctx.moveTo(dir * r * 0.45, 0); ctx.lineTo(-dir * r * 0.3, -r * 0.4); ctx.lineTo(-dir * r * 0.3, r * 0.4);
      ctx.closePath(); ctx.fill();
    };
    btn(L.left, 'left', (r) => tri(r, -1));
    btn(L.right, 'right', (r) => tri(r, 1));
    btn(L.jump, 'jump', (r) => {
      ctx.beginPath(); ctx.moveTo(0, -r * 0.5); ctx.lineTo(r * 0.42, 0); ctx.lineTo(r * 0.15, 0);
      ctx.lineTo(r * 0.15, r * 0.45); ctx.lineTo(-r * 0.15, r * 0.45); ctx.lineTo(-r * 0.15, 0); ctx.lineTo(-r * 0.42, 0);
      ctx.closePath(); ctx.fill();
    });
    btn(L.shoot, 'shoot', (r) => {
      ctx.fillRect(-r * 0.45, -r * 0.22, r * 0.8, r * 0.26);
      ctx.fillRect(-r * 0.45, -r * 0.05, r * 0.25, r * 0.45);
      ctx.beginPath(); ctx.arc(r * 0.55, -r * 0.09, r * 0.09, 0, TAU); ctx.fill();
    });
    if (this.avail.melee) btn(L.melee, 'melee', (r) => {
      ctx.beginPath(); roundRect(ctx, -r * 0.4, -r * 0.35, r * 0.8, r * 0.7, r * 0.2); ctx.fill();
      ctx.fillStyle = '#000'; ctx.globalAlpha = 0.5;
      for (let i = 0; i < 3; i++) ctx.fillRect(-r * 0.3 + i * r * 0.22, -r * 0.35, 2, r * 0.3);
    });
    if (this.avail.swap) btn(L.swap, 'swap', (r) => {
      ctx.lineWidth = 3.5;
      ctx.beginPath(); ctx.arc(0, 0, r * 0.45, -2.6, 1.6); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(r * 0.2, r * 0.25); ctx.lineTo(r * 0.0, r * 0.55); ctx.lineTo(-r * 0.05, r * 0.18); ctx.fill();
    });
    if (this.aimMode === 'stick') {
      const b = L.aim;
      ctx.save();
      ctx.globalAlpha = 0.3; ctx.fillStyle = '#000'; ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, TAU); ctx.fill();
      ctx.globalAlpha = 0.85; ctx.strokeStyle = '#fff'; ctx.lineWidth = 3; ctx.stroke();
      ctx.setLineDash([4, 5]); ctx.beginPath(); ctx.arc(b.x, b.y, b.r * 0.6, 0, TAU); ctx.stroke(); ctx.setLineDash([]);
      const a = this.getAim();
      const kx = a && !a.kb && !a.idle ? b.x + a.x * b.r * 0.6 * a.mag : b.x, ky = a && !a.kb && !a.idle ? b.y + a.y * b.r * 0.6 * a.mag : b.y;
      ctx.globalAlpha = 0.75; ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(kx, ky, b.r * 0.38, 0, TAU); ctx.fill();
      ctx.strokeStyle = '#ff5a5a'; ctx.lineWidth = 2.5;
      ctx.beginPath(); ctx.arc(kx, ky, 9, 0, TAU); ctx.moveTo(kx - 14, ky); ctx.lineTo(kx + 14, ky); ctx.moveTo(kx, ky - 14); ctx.lineTo(kx, ky + 14); ctx.stroke();
      ctx.restore();
    } else {
      const a = this.getAim();
      if (a && !a.kb) {
        const b = L.shoot;
        ctx.save(); ctx.globalAlpha = 0.8; ctx.fillStyle = '#fff';
        ctx.beginPath(); ctx.arc(b.x + a.x * b.r * 0.8, b.y + a.y * b.r * 0.8, 10, 0, TAU); ctx.fill(); ctx.restore();
      }
    }
    btn(L.pause, 'pause', (r) => {
      ctx.fillRect(-r * 0.32, -r * 0.4, r * 0.22, r * 0.8);
      ctx.fillRect(r * 0.1, -r * 0.4, r * 0.22, r * 0.8);
    });
  },
};

<script>/* js/audio.js */
// Sonido: efectos y música chiptune generados en tiempo real con WebAudio (sin archivos).
'use strict';

const Sfx = {
  ctx: null, master: null, sfxGain: null, musGain: null, noiseBuf: null,
  unlocked: false, current: null, timer: null, step: 0, nextTime: 0,
  musicOn: true, soundOn: true,

  unlock() {
    if (!this.ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      this.ctx = new AC();
      this.master = this.ctx.createGain(); this.master.gain.value = 0.8; this.master.connect(this.ctx.destination);
      this.sfxGain = this.ctx.createGain(); this.sfxGain.gain.value = 0.5; this.sfxGain.connect(this.master);
      this.musGain = this.ctx.createGain(); this.musGain.gain.value = 0.22; this.musGain.connect(this.master);
      const len = this.ctx.sampleRate;
      this.noiseBuf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
      const d = this.noiseBuf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    }
    if (this.ctx.state === 'suspended') this.ctx.resume();
    if (!this.unlocked) {
      this.unlocked = true;
      if (this.wanted) this.music(this.wanted, true);
    }
  },
  setOptions(sound, music) {
    this.soundOn = sound; this.musicOn = music;
    if (this.musGain) this.musGain.gain.value = music ? 0.22 : 0;
  },
  suspend() { if (this.ctx) this.ctx.suspend(); },
  resume() { if (this.ctx && this.unlocked) this.ctx.resume(); },

  tone(type, f0, f1, dur, vol = 0.5, when = 0, dest = null) {
    const c = this.ctx, t = c.currentTime + when;
    const o = c.createOscillator(), g = c.createGain();
    o.type = type;
    o.frequency.setValueAtTime(f0, t);
    if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g); g.connect(dest || this.sfxGain);
    o.start(t); o.stop(t + dur + 0.02);
  },
  noise(dur, vol = 0.5, freq = 2000, when = 0, type = 'lowpass', dest = null, f1 = null) {
    const c = this.ctx, t = c.currentTime + when;
    const s = c.createBufferSource(); s.buffer = this.noiseBuf;
    const f = c.createBiquadFilter(); f.type = type; f.frequency.setValueAtTime(freq, t);
    if (f1) f.frequency.exponentialRampToValueAtTime(f1, t + dur);
    const g = c.createGain();
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    s.connect(f); f.connect(g); g.connect(dest || this.sfxGain);
    s.start(t, Math.random() * 0.5); s.stop(t + dur + 0.02);
  },

  play(name) {
    if (!this.ctx || !this.soundOn || this.ctx.state !== 'running') return;
    switch (name) {
      case 'jump': this.tone('square', 260, 560, 0.13, 0.22); break;
      case 'djump': this.tone('square', 420, 900, 0.12, 0.2); this.tone('triangle', 620, 1200, 0.1, 0.15, 0.03); break;
      case 'walljump': this.tone('square', 330, 700, 0.1, 0.2); break;
      case 'shoot': this.tone('square', 980, 220, 0.08, 0.18); break;
      case 'rifle': this.tone('sawtooth', 700, 150, 0.07, 0.15); this.noise(0.05, 0.2, 3000); break;
      case 'eshoot': this.tone('square', 500, 160, 0.1, 0.12); break;
      case 'elec':
        for (let i = 0; i < 4; i++) this.tone('sawtooth', rand(600, 1800), rand(200, 900), 0.06, 0.12, i * 0.03);
        break;
      case 'melee': this.noise(0.12, 0.35, 900, 0, 'bandpass', null, 3000); break;
      case 'hit': this.noise(0.08, 0.4, 2500); this.tone('square', 300, 120, 0.08, 0.15); break;
      case 'stomp': this.tone('square', 600, 150, 0.12, 0.25); break;
      case 'hurt': this.tone('square', 420, 90, 0.35, 0.3); break;
      case 'die': this.tone('square', 520, 60, 0.8, 0.3); this.tone('triangle', 260, 40, 0.8, 0.3, 0.1); break;
      case 'coin': this.tone('square', 988, 988, 0.07, 0.18); this.tone('square', 1319, 1319, 0.18, 0.18, 0.07); break;
      case 'heart': [523, 659, 784, 1047].forEach((f, i) => this.tone('triangle', f, f, 0.12, 0.25, i * 0.06)); break;
      case 'power': [392, 523, 659, 784, 1047, 1319].forEach((f, i) => this.tone('square', f, f, 0.12, 0.16, i * 0.07)); break;
      case 'explode': this.noise(0.6, 0.7, 1200, 0, 'lowpass', null, 80); this.tone('sine', 120, 30, 0.5, 0.5); break;
      case 'fire': this.noise(0.25, 0.25, 600, 0, 'bandpass', null, 1500); break;
      case 'portal': this.tone('sine', 200, 1400, 0.3, 0.3); this.tone('sine', 1400, 200, 0.3, 0.2, 0.15); break;
      case 'check': [660, 880, 1100].forEach((f, i) => this.tone('triangle', f, f, 0.12, 0.25, i * 0.08)); break;
      case 'select': this.tone('square', 660, 990, 0.08, 0.15); break;
      case 'back': this.tone('square', 600, 300, 0.08, 0.15); break;
      case 'talk': this.tone('square', rand(380, 520), rand(380, 520), 0.03, 0.06); break;
      case 'bosshit': this.noise(0.12, 0.5, 1500); this.tone('square', 200, 80, 0.12, 0.25); break;
      case 'roar': this.tone('sawtooth', 160, 60, 0.8, 0.35); this.noise(0.8, 0.3, 400); break;
      case 'shield': this.tone('sine', 300, 1200, 0.3, 0.3); this.tone('sawtooth', 1200, 600, 0.2, 0.08, 0.1); break;
      case 'splash': this.noise(0.25, 0.35, 1800, 0, 'bandpass', null, 400); break;
      case 'key': [784, 988, 1175, 1568].forEach((f, i) => this.tone('square', f, f, 0.1, 0.18, i * 0.05)); break;
      case 'clear': [523, 659, 784, 1047, 784, 1047, 1319].forEach((f, i) => this.tone('square', f, f, 0.16, 0.2, i * 0.1)); break;
      case 'transform':
        for (let i = 0; i < 16; i++) this.tone('sawtooth', 200 + i * 80, 400 + i * 120, 0.12, 0.12, i * 0.06);
        this.noise(1.2, 0.3, 300, 0.4, 'highpass', null, 6000);
        break;
    }
  },

  // ---------------- Música ----------------
  music(name, force = false) {
    this.wanted = name;
    if (!this.ctx || !this.unlocked) return;
    if (!force && this.current && this.current.name === name) return;
    this.stopMusic();
    const tr = MUSIC[name];
    if (!tr) return;
    this.current = buildTrack(name, tr);
    this.step = 0;
    this.nextTime = this.ctx.currentTime + 0.08;
    this.timer = setInterval(() => this.schedule(), 40);
  },
  stopMusic() {
    if (this.timer) clearInterval(this.timer);
    this.timer = null; this.current = null;
  },
  schedule() {
    const tr = this.current; if (!tr || !this.ctx) return;
    const stepDur = 60 / tr.bpm / 2;
    while (this.nextTime < this.ctx.currentTime + 0.25) {
      const i = this.step % tr.len;
      const t = this.nextTime - this.ctx.currentTime;
      const n = tr.lead[i];
      if (n) this.mnote(tr.leadWave, n.m, t, n.d * stepDur * 0.92, 0.32);
      const b = tr.bass[i];
      if (b) this.mnote('triangle', b, t, stepDur * 1.8, 0.55);
      const a = tr.arp[i];
      if (a) this.mnote('square', a, t, stepDur * 0.5, 0.08);
      const d = tr.drum[i];
      if (d === 'k') { this.tone('sine', 150, 40, 0.15, 0.6, t, this.musGain); }
      else if (d === 's') { this.noise(0.12, 0.35, 2500, t, 'highpass', this.musGain); }
      if (tr.hats && i % 2 === 1) this.noise(0.03, 0.12, 8000, t, 'highpass', this.musGain);
      this.nextTime += stepDur;
      this.step++;
    }
  },
  mnote(wave, midi, when, dur, vol) {
    const f = 440 * Math.pow(2, (midi - 69) / 12);
    const c = this.ctx, t = c.currentTime + when;
    const o = c.createOscillator(), g = c.createGain();
    o.type = wave; o.frequency.setValueAtTime(f, t);
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(vol, t + 0.01);
    g.gain.setValueAtTime(vol, t + dur * 0.6);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g); g.connect(this.musGain);
    o.start(t); o.stop(t + dur + 0.02);
  },
};

// Escalas y armado de canciones: progresión de acordes + motivos con semilla.
const SCALES = { major: [0, 2, 4, 5, 7, 9, 11], minor: [0, 2, 3, 5, 7, 8, 10], harm: [0, 2, 3, 5, 7, 8, 11], dor: [0, 2, 3, 5, 7, 9, 10] };

const MUSIC = {
  title:   { bpm: 132, root: 60, scale: 'major', prog: [0, 5, 3, 4, 0, 5, 3, 4], seed: 11, form: 'AABA', drums: 'rock', wave: 'square' },
  village: { bpm: 120, root: 62, scale: 'major', prog: [0, 3, 4, 0, 5, 3, 4, 4], seed: 3, form: 'AABB', drums: 'light', wave: 'square' },

};

function buildTrack(name, cfg) {
  const sc = SCALES[cfg.scale];
  const deg = (d) => cfg.root + sc[((d % 7) + 7) % 7] + 12 * Math.floor(d / 7);
  const bars = cfg.prog.length;      // 8 compases de 8 corcheas
  const L = bars * 8;
  const lead = new Array(L).fill(null), bass = new Array(L).fill(0), arp = new Array(L).fill(0), drum = new Array(L).fill(null);
  // Motivos: frase A y B de 2 compases cada una
  const mkPhrase = (seed) => {
    const r = mulberry32(seed);
    const rhythm = [];
    let pos = 0;
    while (pos < 16) {
      const d = pick2(r, pos % 4 === 0 ? [2, 2, 1, 3, 4] : [1, 1, 2, 2]);
      rhythm.push({ pos, d: Math.min(d, 16 - pos), rest: r() < 0.12 && pos % 4 !== 0, step: Math.floor(r() * 5) - 2 });
      pos += d;
    }
    return rhythm;
  };
  const phrases = { A: mkPhrase(cfg.seed), B: mkPhrase(cfg.seed * 7 + 3) };
  for (let pi = 0; pi < 4; pi++) {
    const ph = phrases[cfg.form[pi]];
    let cur = 7 + (cfg.form[pi] === 'B' ? 2 : 0);
    for (const n of ph) {
      const gi = pi * 16 + n.pos;
      const chord = cfg.prog[Math.floor(gi / 8)];
      if (n.rest) continue;
      if (n.pos % 4 === 0) {
        // nota del acorde más cercana
        const opts = [chord, chord + 2, chord + 4, chord + 7, chord + 9];
        cur = opts.reduce((a, b) => (Math.abs(b - cur) < Math.abs(a - cur) ? b : a));
      } else cur = clamp(cur + n.step, 3, 13);
      lead[gi] = { m: deg(cur), d: n.d };
    }
  }
  for (let b = 0; b < bars; b++) {
    const c = cfg.prog[b];
    for (let s = 0; s < 8; s++) {
      const i = b * 8 + s;
      if (s % 2 === 0) bass[i] = deg(c) - 24 + (s === 4 || s === 6 ? (s === 6 ? 12 : 7) : 0) * (cfg.drums === 'light' ? 0 : 1);
      arp[i] = deg(c + [0, 2, 4, 7][s % 4]) - 12;
      const style = cfg.drums;
      if (style === 'rock') drum[i] = s % 4 === 0 ? 'k' : s % 4 === 2 ? 's' : null;
      else if (style === 'march') drum[i] = s === 0 || s === 4 ? 'k' : s === 2 || s === 6 || s === 7 ? 's' : null;
      else if (style === 'latin') drum[i] = s === 0 || s === 3 || s === 6 ? 'k' : s === 4 ? 's' : null;
      else drum[i] = s === 0 ? 'k' : s === 4 ? 's' : null;
    }
  }
  return { name, bpm: cfg.bpm, len: L, lead, bass, arp, drum, leadWave: cfg.wave, hats: cfg.drums !== 'light' };
}
function pick2(r, arr) { return arr[Math.floor(r() * arr.length)]; }

// Guardado del progreso en el almacenamiento local del celular.
'use strict';

const SAVE_KEY = 'chulins_adventure_v1';

const Save = {
  data: null,
  defaults() {
    return {
      done: {},          // id de nivel -> true
      best: {},          // id -> mejor tiempo (segundos usados)
      coins: {},         // id -> monedas máximas obtenidas
      chars: { chulin: true },
      sel: 'chulin',
      abil: { wall: false, melee: false, elec: false },
      crystals: {},      // color -> true
      seen: {},          // personajes vistos (enciclopedia)
      sound: true, music: true,
      beaten: false,
      deaths: 0,
      wallet: 0,
      owned: { skins: { clasico: 1 }, hats: { tophat: 1, none: 1 }, faces: { none: 1 }, weapons: { pistol: 1 } },
      skin: 'clasico', hat: 'tophat', face: 'none', weapon: 'pistol',
      lang: null,
      // Play Games
      ach: {}, talked: {}, kills: 0, coinsEver: null, bossBest: 0,
    };
  },
  load() {
    let d = null;
    try { d = JSON.parse(localStorage.getItem(SAVE_KEY)); } catch (e) { d = null; }
    this.data = Object.assign(this.defaults(), d || {});
    for (const k of ['done', 'best', 'coins', 'chars', 'abil', 'crystals', 'seen', 'owned', 'ach', 'talked'])
      this.data[k] = Object.assign(this.defaults()[k], this.data[k] || {});
    for (const k of ['skins', 'hats', 'faces', 'weapons']) this.data.owned[k] = Object.assign({}, this.defaults().owned[k], this.data.owned[k] || {});
    if (this.data.coinsEver == null) this.data.coinsEver = this.totalCoins();
    return this.data;
  },
  write() {
    try { localStorage.setItem(SAVE_KEY, JSON.stringify(this.data)); } catch (e) { /* sin espacio */ }
  },
  reset() { this.data = this.defaults(); this.write(); },
  totalCoins() { return Object.values(this.data.coins).reduce((a, b) => a + b, 0); },
  isUnlocked(id) {
    const i = LEVEL_ORDER.indexOf(id);
    if (i <= 0) return true;
    return !!this.data.done[LEVEL_ORDER[i - 1]];
  },
  see(kind) { if (!this.data.seen[kind]) { this.data.seen[kind] = true; this.write(); } },
};

</script>
<script>/* js/playgames.js */
// Google Play Games: logros y tablas de clasificación.
// En Android, MainActivity expone el puente `PlayGamesNative`; en el navegador no existe y todo se ignora.
// Lo conseguido se guarda en Save.data, así que si no hay sesión iniciada se envía después (sync).
'use strict';

const PG_ACH = {
  welcome: 'CgkI3-WUjdsUEAIQAQ', friend: 'CgkI3-WUjdsUEAIQAg', wall: 'CgkI3-WUjdsUEAIQAw', castle1: 'CgkI3-WUjdsUEAIQBA',
  world1: 'CgkI3-WUjdsUEAIQBQ', melee: 'CgkI3-WUjdsUEAIQBg', freshair: 'CgkI3-WUjdsUEAIQBw', elecgun: 'CgkI3-WUjdsUEAIQCA',
  worthy: 'CgkI3-WUjdsUEAIQCQ', gotcha: 'CgkI3-WUjdsUEAIQCg', fried: 'CgkI3-WUjdsUEAIQCw', shield: 'CgkI3-WUjdsUEAIQDA',
  world3: 'CgkI3-WUjdsUEAIQDQ', crystals: 'CgkI3-WUjdsUEAIQDg', transform: 'CgkI3-WUjdsUEAIQDw', final: 'CgkI3-WUjdsUEAIQEA',
  untouchable: 'CgkI3-WUjdsUEAIQEQ', coins: 'CgkI3-WUjdsUEAIQEg', hunter: 'CgkI3-WUjdsUEAIQEw', nevergiveup: 'CgkI3-WUjdsUEAIQFA',
  fashionista: 'CgkI3-WUjdsUEAIQFQ', wardrobe: 'CgkI3-WUjdsUEAIQFg', golden: 'CgkI3-WUjdsUEAIQFw', speedrunner: 'CgkI3-WUjdsUEAIQGA',
  treasure: 'CgkI3-WUjdsUEAIQGQ', chatterbox: 'CgkI3-WUjdsUEAIQGg',
};
// Logros incrementales: pasos totales en Play Console
const PG_STEPS = { coins: 1000, hunter: 500, nevergiveup: 50, chatterbox: 15 };
// Tablas de clasificación (vacías = todavía no se envían puntajes)
const PG_LB = { lb_coins: '', lb_kills: '', lb_speedrun: '', lb_boss: '' };

const PG = {
  native() { return window.PlayGamesNative || null; },
  available() { return !!this.native(); },

  // Logro conseguido en el juego: se guarda y se envía
  unlock(key) {
    const d = Save.data;
    if (!d.ach[key]) { d.ach[key] = true; Save.write(); }
    const n = this.native();
    if (n && PG_ACH[key]) n.unlock(PG_ACH[key]);
  },
  steps(key, value) {
    const n = this.native();
    if (n && PG_ACH[key]) n.setSteps(PG_ACH[key], Math.min(PG_STEPS[key], Math.floor(value)));
  },
  score(key, value) {
    const n = this.native();
    if (n && PG_LB[key] && value > 0) n.submitScore(PG_LB[key], Math.floor(value));
  },

  // Revisa todo el progreso guardado y envía lo que corresponda (se puede llamar las veces que sea)
  sync() {
    if (!this.available()) return;
    const d = Save.data;
    const has = {
      welcome: d.done['1-1'], friend: d.chars.mexicano, castle1: d.done['1-4'], world1: d.done['1-6'],
      melee: d.abil.melee, elecgun: d.abil.elec, worthy: d.done['2-5'], gotcha: d.done['2-6'], world3: d.done['3-5'],
      crystals: ['red', 'green', 'blue', 'gold'].every((c) => d.crystals[c]), transform: d.crystals.gold || d.chars.electrico,
      final: d.beaten, golden: d.chars.dorado,
      fashionista: PG.boughtCount() > 0,
      wardrobe: Object.keys(SKINS).every((k) => d.owned.skins[k]),
    };
    for (const k in has) if (has[k]) d.ach[k] = true;
    Save.write();
    for (const k in d.ach) if (d.ach[k]) this.unlock(k);
    this.steps('coins', d.coinsEver);
    this.steps('hunter', d.kills);
    this.steps('nevergiveup', d.deaths);
    this.steps('chatterbox', Object.keys(d.talked).length);
    this.score('lb_coins', d.coinsEver);
    this.score('lb_kills', d.kills);
    if (d.beaten && LEVEL_ORDER.every((id) => d.best[id])) this.score('lb_speedrun', LEVEL_ORDER.reduce((a, id) => a + d.best[id], 0) * 1000);
    if (d.bossBest) this.score('lb_boss', d.bossBest * 1000);
  },
  boughtCount() {
    const o = Save.data.owned, def = Save.defaults().owned;
    let n = 0;
    for (const cat in o) for (const k in o[cat]) if (o[cat][k] && !def[cat][k]) n++;
    return n;
  },

  showAchievements() { const n = this.native(); if (n) n.showAchievements(); },
  showLeaderboards() { const n = this.native(); if (n) n.showLeaderboards(); },
};

// Android avisa cuando el jugador inicia sesión en Play Games
window.onPlayGamesSignIn = () => PG.sync();

</script>
<script>/* js/art.js */
// Arte: countryballs dibujados como esferas que giran (frente, lados, espalda),
// expresiones de ojos, accesorios, bloques del escenario y fondos con parallax.
'use strict';

const HALF_PI = Math.PI / 2;
const wrapAng = (a) => { a = (a + Math.PI) % TAU; if (a < 0) a += TAU; return a - Math.PI; };

// Proyecta un punto (longitud, latitud) de la esfera girada `phi`.
// Los puntos ocultos se "pegan" al borde visible.
function sphP(lon, lat, r, phi) {
  let l = wrapAng(lon + phi);
  const z = Math.cos(lat) * Math.cos(l);
  if (l > HALF_PI) l = HALF_PI; else if (l < -HALF_PI) l = -HALF_PI;
  return [r * Math.cos(lat) * Math.sin(l), -r * Math.sin(lat), z];
}
function polyLL(ctx, pts, r, phi, lonc = 0) {
  // Longitudes relativas al centro de la figura, para que no "salten" al otro lado.
  const lc = wrapAng(lonc + phi);
  let anyVis = false;
  ctx.beginPath();
  for (let i = 0; i < pts.length; i++) {
    let l = lc + (pts[i][0] - lonc);
    const lat = pts[i][1];
    if (l > HALF_PI) l = HALF_PI; else if (l < -HALF_PI) l = -HALF_PI; else anyVis = true;
    const x = r * Math.cos(lat) * Math.sin(l), y = -r * Math.sin(lat);
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  }
  ctx.closePath();
  return anyVis;
}
// Región entre dos meridianos (a < b), recortada a la cara visible.
function lonBand(ctx, a, b, r, phi) {
  ctx.beginPath();
  for (let k = -1; k <= 1; k++) {
    const lo = Math.max(a + phi + TAU * k, -HALF_PI), hi = Math.min(b + phi + TAU * k, HALF_PI);
    if (lo >= hi) continue;
    for (let i = 0; i <= 16; i++) { const lat = HALF_PI - (i / 16) * Math.PI; const x = r * Math.cos(lat) * Math.sin(lo), y = -r * Math.sin(lat); i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }
    for (let i = 16; i >= 0; i--) { const lat = HALF_PI - (i / 16) * Math.PI; ctx.lineTo(r * Math.cos(lat) * Math.sin(hi), -r * Math.sin(lat)); }
    ctx.closePath();
  }
}
// Subdivide un polígono en (lon,lat) para que se curve bien sobre la esfera.
function subdiv(pts, n = 4) {
  const out = [];
  for (let i = 0; i < pts.length; i++) {
    const a = pts[i], b = pts[(i + 1) % pts.length];
    for (let k = 0; k < n; k++) out.push([lerp(a[0], b[0], k / n), lerp(a[1], b[1], k / n)]);
  }
  return out;
}
function meridian(lon, lat0, lat1, n = 16) {
  const out = [];
  for (let i = 0; i <= n; i++) out.push([lon, lerp(lat0, lat1, i / n)]);
  return out;
}

// --------- Patrones de las banderas ---------
const CHULIN_DASHES = (() => {
  const r = mulberry32(1234);
  const cols = ['#ff0010', '#ff0010', '#22e022', '#1a1aff', '#ff0010', '#22e022', '#1a1aff'];
  const out = [];
  for (let i = 0; i < 34; i++) {
    const lat = (r() * 2 - 1) * 1.15;
    const lon = -Math.PI + (i / 34) * TAU + r() * 0.2;
    out.push({ lon, lat, len: 0.3 + r() * 0.45, tilt: (r() - 0.5) * 0.25, c: cols[i % cols.length] });
  }
  return out;
})();

const STAR_PTS = (() => {
  const pts = [];
  for (let i = 0; i < 10; i++) {
    const a = -HALF_PI + (i * Math.PI) / 5;
    const rr = i % 2 === 0 ? 0.78 : 0.3;
    pts.push([Math.cos(a) * rr, -Math.sin(a) * rr]);
  }
  return pts;
})();

const MEX_ZIG = (() => {
  const left = [], right = [];
  const n = 7;
  for (let i = 0; i <= n; i++) {
    const lat = 1.57 - (i / n) * 3.14;
    left.push([-0.08 - (i % 2 ? 0.26 : 0.0), lat]);
    right.push([0.22 - (i % 2 ? 0.0 : 0.24), lat]);
  }

})();

// --------- Expresiones de ojos (coordenadas unitarias, lado interior = +x) ---------
const EYE_SHAPES = {
  neutral(c) { c.ellipse(0, 0, 1, 1, 0, 0, TAU); },

  },
