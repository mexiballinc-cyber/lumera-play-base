// --------- Definición visual de cada tipo de countryball ---------
const BALLS = {
  chulin:   { base: '#0098ff', pattern: 'dashes', eyes: ['#ffffff', 'gold'], hat: 'tophat' },
  dorado:   { base: '#ffc928', pattern: 'dashes', dashCols: ['#fff3b0', '#e08a00', '#ffffff'], eyes: ['#ffffff', 'gold'], hat: 'tophat' },
  electrico:{ base: '#29d3ff', pattern: 'dashes', dashCols: ['#fffb7a', '#ffffff', '#00e5ff'], eyes: ['#ffffff', 'elec'], hat: 'tophat', glow: '#7ff8ff' },
  mexicano: { base: '#adff6a', pattern: 'mexico', eyes: ['patch', '#ffffff'] },
  secuaz:   { base: '#363636', pattern: 'star', eyes: ['#5e0000', '#5e0000'] },
  sdorado:  { base: '#c99a1a', pattern: 'star', starCol: '#ff2a00', eyes: ['#5e0000', '#5e0000'] },
  aldeano:  { base: '#f4f4f4', pattern: 'none', eyes: ['#ffffff', '#ffffff'] },
};

const Art = {
  // Dibuja un countryball. o = { phi, expr, blink, sq (aplastar), acc:[], gun, dir, flash, t }
  ball(ctx, x, y, r, type, o = {}) {
    let B = BALLS[type] || BALLS.aldeano;
    if (o.skin) B = Object.assign({}, B, { base: o.skin.base, dashCols: o.skin.dashCols || B.dashCols });
    const phi = o.phi || 0;
    const lw = Math.max(1.6, r * 0.075);
    ctx.save();
    ctx.translate(x, y);
    if (o.rot) ctx.rotate(o.rot);
    const sq = o.sq || 0;
    ctx.scale(1 + sq, 1 - sq);
    if (o.alpha != null) ctx.globalAlpha *= o.alpha;
    const acc = o.acc || [];

    // Aura (Chulin eléctrico)
    if (B.glow) {
      const g = ctx.createRadialGradient(0, 0, r * 0.8, 0, 0, r * 1.7);
      g.addColorStop(0, 'rgba(127,248,255,0.55)'); g.addColorStop(1, 'rgba(127,248,255,0)');
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, r * 1.7, 0, TAU); ctx.fill();
    }
    // Accesorios que van detrás
    for (const a of acc) this.accessory(ctx, a, r, phi, o, true);
    if (o.gun && Math.cos(phi) < -0.2) this.gun(ctx, o.gun, r, o.dir || 1, o);

    // Cuerpo
    ctx.save();
    ctx.beginPath(); ctx.arc(0, 0, r, 0, TAU); ctx.clip();
    ctx.fillStyle = B.base; ctx.fillRect(-r, -r, r * 2, r * 2);
    this.pattern(ctx, B, r, phi, o.t || 0);
    if (acc.includes('mayor')) {
      // banda de alcalde, por la parte baja (debajo de ojos y bigote)
      ctx.strokeStyle = '#d41f1f'; ctx.lineWidth = r * 0.2;
      const s0 = Math.sin(phi) * r * 0.4;
      ctx.beginPath(); ctx.moveTo(-r + s0, r * 0.35); ctx.lineTo(r + s0, r * 0.95); ctx.stroke();
    }
    // Sombreado suave para dar volumen
    const sh = ctx.createRadialGradient(-r * 0.35, -r * 0.4, r * 0.1, 0, 0, r * 1.05);
    sh.addColorStop(0, 'rgba(255,255,255,0.22)'); sh.addColorStop(0.55, 'rgba(255,255,255,0)'); sh.addColorStop(1, 'rgba(0,0,0,0.22)');
    ctx.fillStyle = sh; ctx.fillRect(-r, -r, r * 2, r * 2);
    // Ojos
    this.eyes(ctx, B, r, phi, o, lw, type);
    if (o.flash) { ctx.fillStyle = `rgba(255,255,255,${o.flash})`; ctx.fillRect(-r, -r, r * 2, r * 2); }
    ctx.restore();

    ctx.lineWidth = lw; ctx.strokeStyle = '#000';
    ctx.beginPath(); ctx.arc(0, 0, r, 0, TAU); ctx.stroke();

    for (const a of acc) this.accessory(ctx, a, r, phi, o, false);
    if (o.face && o.face !== 'none') this.face(ctx, o.face, r, phi, lw);
    const hat = o.hat || B.hat;
    if (hat === 'tophat' && !o.noHat) this.tophat(ctx, r, phi, type);
    else if (hat && hat !== 'none' && !o.noHat) this.hat(ctx, hat, r, phi, lw, o.t || 0);
    if (o.gun && Math.cos(phi) >= -0.2) this.gun(ctx, o.gun, r, o.dir || 1, o);
    if (o.expr === 'scared' && Math.cos(phi) > 0.3) {
      ctx.strokeStyle = '#7fd8ff'; ctx.lineWidth = lw * 0.9;
      ctx.beginPath(); ctx.arc(r * 0.95, -r * 0.55, r * 0.18, Math.PI * 0.6, Math.PI * 1.5); ctx.stroke();
    }
    if (B.glow) this.sparks(ctx, r, o.t || 0);
    ctx.restore();
  },

  pattern(ctx, B, r, phi, t) {
    if (B.pattern === 'dashes') {
      ctx.lineCap = 'round';
      ctx.lineWidth = r * 0.1;
      const cols = B.dashCols;
      for (let i = 0; i < CHULIN_DASHES.length; i++) {
        const d = CHULIN_DASHES[i];
        ctx.strokeStyle = cols ? cols[i % cols.length] : d.c;
        ctx.beginPath();
        let started = false;
        for (let k = 0; k <= 4; k++) {
          const lon = d.lon + (d.len * k) / 4, lat = d.lat + d.tilt * (k / 4);
          const p = sphP(lon, lat, r, phi);
          if (p[2] <= 0.02) { started = false; continue; }
          if (!started) { ctx.moveTo(p[0], p[1]); started = true; } else ctx.lineTo(p[0], p[1]);
        }
        ctx.stroke();
      }
      if (B.glow) {
        ctx.strokeStyle = 'rgba(255,255,255,0.8)'; ctx.lineWidth = r * 0.05;
        for (let i = 0; i < 3; i++) {
          const lon0 = ((t * 1.3 + i * 2.1) % TAU) - Math.PI;
          ctx.beginPath();
          for (let k = 0; k < 6; k++) {
            const p = sphP(lon0 + k * 0.12, -0.6 + k * 0.25 + (k % 2) * 0.15, r, phi);
            if (k === 0) ctx.moveTo(p[0], p[1]); else ctx.lineTo(p[0], p[1]);
          }
          ctx.stroke();
        }
      }
    } else if (B.pattern === 'mexico') {
      ctx.fillStyle = '#a80008';
      lonBand(ctx, -Math.PI, 0, r, phi);
      ctx.fill();
      ctx.fillStyle = '#ffffff';
      if (polyLL(ctx, subdiv(MEX_ZIG, 3), r, phi)) ctx.fill();
      // Escudo: círculo marrón en el centro
      {
        const ring = [];
        for (let i = 0; i < 20; i++) { const a = (i / 20) * TAU; ring.push([0.04 + Math.cos(a) * 0.22, -0.02 + Math.sin(a) * 0.24]); }
        if (polyLL(ctx, ring, r, phi)) {
          ctx.fillStyle = '#8b4a1c'; ctx.fill();
          ctx.strokeStyle = '#5a2e0e'; ctx.lineWidth = r * 0.05; ctx.stroke();
        }
      }
      // Ojo pintado en la espalda (para que "piensen que los está viendo")
      const pe = sphP(Math.PI - 0.25, 0.05, r, phi);
      if (pe[2] > 0.1) {
        ctx.save(); ctx.translate(pe[0], pe[1]); ctx.scale(r * 0.3 * (0.35 + 0.65 * pe[2]), r * 0.24);
        ctx.beginPath();
        ctx.moveTo(-1, 0); ctx.bezierCurveTo(-1, -0.9, -0.2, -0.7, 0.3, -0.9); ctx.bezierCurveTo(1.1, -0.8, 1.1, 0.7, 0.4, 0.8);
        ctx.bezierCurveTo(-0.3, 1.1, -1.1, 0.8, -1, 0);
        ctx.restore();
        ctx.fillStyle = '#fff'; ctx.fill();
      }
      // Correa del parche (círculo máximo inclinado)
      ctx.strokeStyle = '#000'; ctx.lineWidth = r * 0.09; ctx.lineCap = 'round';
      ctx.beginPath();
      let st = false;
      for (let k = 0; k <= 48; k++) {
        const tt = (k / 48) * TAU;
        // círculo máximo que pasa por el parche (lon -0.42) inclinado
        const px = Math.cos(tt), py = Math.sin(tt);
        const u = [Math.sin(-0.42), 0.1, Math.cos(-0.42)];
        const v = [0.42, 0.9, -0.1];
        const P3 = [u[0] * px + v[0] * py, u[1] * px + v[1] * py, u[2] * px + v[2] * py];
        const lon = Math.atan2(P3[0], P3[2]), lat = Math.asin(clamp(P3[1] / Math.hypot(...P3), -1, 1));
        const p = sphP(lon, lat, r, phi);
        if (p[2] < 0) { st = false; continue; }
        if (!st) { ctx.moveTo(p[0], p[1]); st = true; } else ctx.lineTo(p[0], p[1]);
      }
      ctx.stroke();
    } else if (B.pattern === 'star') {
      const pts = subdiv(STAR_PTS.map(([a, b]) => [a, b]), 3);
      ctx.fillStyle = B.starCol || '#ff0000';
      if (polyLL(ctx, pts, r, phi)) {
        ctx.fill();
        ctx.strokeStyle = '#000'; ctx.lineWidth = r * 0.06; ctx.lineJoin = 'round'; ctx.stroke();
        const inner = [];
        for (let i = 1; i < 10; i += 2) inner.push(STAR_PTS[i]);
        ctx.fillStyle = '#000'; polyLL(ctx, subdiv(inner, 3), r, phi); ctx.fill();
      }
    }
  },

  eyes(ctx, B, r, phi, o, lw, type) {
    const expr = o.blink ? 'blink' : (o.expr || 'neutral');
    const shape = EYE_SHAPES[expr] || EYE_SHAPES.neutral;
    const ew = r * 0.3, eh = r * 0.32;
    const pos = [[-0.42, 0.06], [0.42, 0.06]];
    for (let i = 0; i < 2; i++) {
      const col = B.eyes[i];
      const p = sphP(pos[i][0], pos[i][1], r, phi);
      if (p[2] < 0.06) continue;
      const fs = 0.38 + 0.62 * p[2];
      const mirror = i === 0 ? 1 : -1;
      if (col === 'patch') {
        // Parche de Mexicano
        ctx.save(); ctx.translate(p[0], p[1]); ctx.scale(ew * 1.25 * fs, eh * 1.2);
        ctx.beginPath(); ctx.ellipse(0, 0.05, 1, 0.95, 0, 0, TAU); ctx.restore();
        ctx.fillStyle = '#050505'; ctx.fill();
        continue;
      }
      ctx.save(); ctx.translate(p[0], p[1]); ctx.scale(ew * fs * mirror, eh);
      ctx.beginPath(); shape(ctx, i);
      ctx.restore();
      const eyePath = () => { ctx.save(); ctx.translate(p[0], p[1]); ctx.scale(ew * fs * mirror, eh); ctx.beginPath(); shape(ctx, i); ctx.restore(); };
      ctx.fillStyle = col === 'gold' ? '#ffe680' : col === 'elec' ? '#fffb7a' : col;
      ctx.fill();
      if ((col === 'gold' || col === 'elec') && expr !== 'blink' && expr !== 'idiot') {
        ctx.save(); ctx.clip();
        ctx.strokeStyle = col === 'elec' ? '#ffffff' : '#fff7c7'; ctx.lineWidth = r * 0.05;
        for (let k = -1; k <= 1; k++) {
          ctx.beginPath(); ctx.moveTo(p[0] + k * ew * 0.6 - ew * 0.3, p[1] + eh); ctx.lineTo(p[0] + k * ew * 0.6 + ew * 0.5, p[1] - eh); ctx.stroke();
        }
        ctx.restore();
        eyePath();
      }
      ctx.lineWidth = lw * 0.95; ctx.strokeStyle = '#000'; ctx.lineJoin = 'round'; ctx.stroke();
    }
  },

  tophat(ctx, r, phi, type) {
    const col = type === 'dorado' ? '#3a2a00' : type === 'electrico' ? '#10303a' : '#2e2e2e';
    const lw = Math.max(1.5, r * 0.07);
    ctx.save();
    ctx.translate(Math.sin(phi) * r * 0.08, -r * 0.82);
    ctx.rotate(-0.08);
    ctx.fillStyle = col; ctx.strokeStyle = '#000'; ctx.lineWidth = lw; ctx.lineJoin = 'round';
    // ala
    ctx.beginPath(); roundRect(ctx, -r * 0.72, -r * 0.18, r * 1.44, r * 0.3, r * 0.08); ctx.fill(); ctx.stroke();
    // copa
    ctx.beginPath(); roundRect(ctx, -r * 0.42, -r * 0.92, r * 0.84, r * 0.78, r * 0.06); ctx.fill(); ctx.stroke();
    // cinta roja con la C
    ctx.strokeStyle = type === 'electrico' ? '#7ff8ff' : '#ff1020'; ctx.lineWidth = r * 0.09;
    ctx.beginPath(); ctx.moveTo(-r * 0.4, -r * 0.24); ctx.lineTo(r * 0.4, -r * 0.24); ctx.stroke();
    const c = Math.cos(phi);
    if (c > 0.15) {
      ctx.save(); ctx.translate(Math.sin(phi) * r * 0.25, -r * 0.48); ctx.scale(c, 1);
      ctx.beginPath(); ctx.arc(0, 0, r * 0.2, -0.9 - Math.PI * 0.05, Math.PI * 0.9 + 0.3, true); ctx.stroke();
      ctx.restore();
    }
    ctx.restore();
  },

  gun(ctx, kind, r, dir, o) {
    ctx.save();
    ctx.translate(dir * r * 0.92, r * 0.28);
    ctx.scale(dir, 1);
    if (o.aimUp) ctx.rotate(-0.5);
    if (o.aimAng) { ctx.translate(-r * 0.3, 0); ctx.rotate(o.aimAng); ctx.translate(r * 0.3, 0); }
    const lw = Math.max(1.4, r * 0.06);
    ctx.lineWidth = lw; ctx.strokeStyle = '#000'; ctx.lineJoin = 'round';
    const col = { pistol: '#ffdd00', blue: '#006aff', elec: '#2ad4ff', rifle: '#6b6b6b', gold: '#ffc300', flame: '#c0392b',
      water: '#3fb8ff', confetti: '#ff5ad0', laser: '#d0d0e0', snow: '#e8f6ff', boomerang: '#c98a3a' }[kind] || '#ffdd00';
    ctx.fillStyle = col;
    if (kind === 'boomerang') {
      ctx.beginPath(); ctx.moveTo(-r * 0.1, r * 0.2); ctx.lineTo(r * 0.3, -r * 0.35); ctx.lineTo(r * 0.45, -r * 0.25); ctx.lineTo(r * 0.12, r * 0.12);
      ctx.lineTo(r * 0.55, r * 0.3); ctx.lineTo(r * 0.45, r * 0.42); ctx.closePath(); ctx.fill(); ctx.stroke();
    } else if (kind === 'water' || kind === 'snow') {
      ctx.beginPath(); roundRect(ctx, -r * 0.3, -r * 0.24, r * 0.85, r * 0.28, r * 0.1); ctx.fill(); ctx.stroke();
      ctx.fillStyle = kind === 'water' ? '#ff8a1f' : '#7fc8ff';
      ctx.beginPath(); ctx.arc(-r * 0.05, -r * 0.38, r * 0.17, 0, TAU); ctx.fill(); ctx.stroke();
      ctx.fillStyle = col; ctx.beginPath(); ctx.rect(-r * 0.2, 0, r * 0.18, r * 0.3); ctx.fill(); ctx.stroke();
    } else if (kind === 'confetti') {
      ctx.beginPath(); ctx.moveTo(-r * 0.2, -r * 0.05); ctx.lineTo(r * 0.55, -r * 0.3); ctx.lineTo(r * 0.55, r * 0.2); ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#ffe14d'; ctx.fillRect(r * 0.05, -r * 0.1, r * 0.1, r * 0.1); ctx.fillStyle = '#4ad3ff'; ctx.fillRect(r * 0.3, -r * 0.02, r * 0.1, r * 0.1);
    } else if (kind === 'laser') {
      ctx.beginPath(); ctx.moveTo(-r * 0.25, -r * 0.25); ctx.lineTo(r * 0.5, -r * 0.18); ctx.lineTo(r * 0.7, -r * 0.08); ctx.lineTo(r * 0.5, r * 0.02);
      ctx.lineTo(r * 0.05, r * 0.02); ctx.lineTo(0, r * 0.32); ctx.lineTo(-r * 0.22, r * 0.32); ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#ff3bd0'; ctx.fillRect(r * 0.1, -r * 0.16, r * 0.35, r * 0.07);
    } else if (kind === 'rifle' || kind === 'gold') {
      ctx.beginPath(); ctx.rect(-r * 0.25, -r * 0.18, r * 1.1, r * 0.2); ctx.fill(); ctx.stroke();
      ctx.fillStyle = kind === 'gold' ? '#a87b00' : '#7a4a22';
      ctx.beginPath(); ctx.rect(-r * 0.45, -r * 0.16, r * 0.3, r * 0.34); ctx.fill(); ctx.stroke();
      ctx.beginPath(); ctx.rect(r * 0.05, 0, r * 0.12, r * 0.25); ctx.fill(); ctx.stroke();
    } else if (kind === 'flame') {
      ctx.beginPath(); ctx.rect(-r * 0.3, -r * 0.2, r * 0.95, r * 0.26); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#555'; ctx.beginPath(); ctx.rect(r * 0.6, -r * 0.25, r * 0.22, r * 0.36); ctx.fill(); ctx.stroke();
    } else {
      ctx.beginPath(); ctx.moveTo(-r * 0.2, -r * 0.2); ctx.lineTo(r * 0.55, -r * 0.2); ctx.lineTo(r * 0.55, r * 0.02);
      ctx.lineTo(r * 0.05, r * 0.02); ctx.lineTo(r * 0.02, r * 0.32); ctx.lineTo(-r * 0.2, r * 0.32); ctx.closePath();
      ctx.fill(); ctx.stroke();
      if (kind === 'elec') {
        ctx.strokeStyle = '#fffb7a'; ctx.lineWidth = lw * 0.9;
        ctx.beginPath(); ctx.moveTo(r * 0.05, -r * 0.16); ctx.lineTo(r * 0.2, -r * 0.05); ctx.lineTo(r * 0.3, -r * 0.15); ctx.lineTo(r * 0.45, -r * 0.03); ctx.stroke();
      }
    }
    ctx.restore();
  },

  accessory(ctx, a, r, phi, o, behind) {
    const lw = Math.max(1.4, r * 0.07);
    ctx.lineWidth = lw; ctx.strokeStyle = '#000'; ctx.lineJoin = 'round';
    if (a === 'jetpack' || a === 'goldpack') {
      const pts = [-0.55, 0.55].map((d) => sphP(Math.PI + d, -0.1, r * 1.05, phi));
      for (const p of pts) {
        const isBehind = p[2] < 0.05;
        if (isBehind !== behind) continue;
        const x = isBehind ? p[0] * 0.92 : p[0];
        ctx.save(); ctx.translate(x, p[1]);
        // llamas
        const fl = 0.7 + Math.sin((o.t || 0) * 40 + x) * 0.25;
        ctx.fillStyle = '#ff9500';
        ctx.beginPath(); ctx.moveTo(-r * 0.14, r * 0.4); ctx.quadraticCurveTo(0, r * (0.4 + fl * 0.7), r * 0.14, r * 0.4); ctx.fill();
        ctx.fillStyle = '#ffe14d';
        ctx.beginPath(); ctx.moveTo(-r * 0.07, r * 0.4); ctx.quadraticCurveTo(0, r * (0.4 + fl * 0.4), r * 0.07, r * 0.4); ctx.fill();
        ctx.fillStyle = a === 'goldpack' ? '#e0a800' : '#8e8e8e';
        ctx.beginPath(); ctx.moveTo(0, -r * 0.5); ctx.quadraticCurveTo(r * 0.22, -r * 0.3, r * 0.2, r * 0.4); ctx.lineTo(-r * 0.2, r * 0.4); ctx.quadraticCurveTo(-r * 0.22, -r * 0.3, 0, -r * 0.5);
        ctx.fill(); ctx.stroke();
        ctx.restore();
      }
      return;
    }
    if (behind) return;
    const c = Math.cos(phi), s = Math.sin(phi);
    if (a === 'crown') {
      ctx.save(); ctx.translate(s * r * 0.1, -r * 0.88);
      ctx.fillStyle = '#ffc300';
      ctx.beginPath(); ctx.moveTo(-r * 0.6, r * 0.12); ctx.lineTo(-r * 0.66, -r * 0.5); ctx.lineTo(-r * 0.3, -r * 0.15); ctx.lineTo(0, -r * 0.62);
      ctx.lineTo(r * 0.3, -r * 0.15); ctx.lineTo(r * 0.66, -r * 0.5); ctx.lineTo(r * 0.6, r * 0.12); ctx.closePath();
      ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#ff0000';
      for (const sx of [-0.45, 0, 0.45]) { this.star(ctx, sx * r + s * r * 0.15, -r * 0.05, r * 0.1); }
      ctx.restore();
    } else if (a === 'police') {
      // Gorra de plato de policía: copa ancha azul marino, banda negra, visera brillante y placa dorada
      ctx.save(); ctx.translate(s * r * 0.06, -r * 0.8);
      ctx.fillStyle = '#16233f';
      ctx.beginPath();
      ctx.moveTo(-r * 0.52, -r * 0.02); ctx.lineTo(-r * 0.8, -r * 0.42);
      ctx.quadraticCurveTo(-r * 0.2, -r * 0.72, r * 0.8, -r * 0.42);
      ctx.lineTo(r * 0.52, -r * 0.02); ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#0b0b0b';
      ctx.beginPath(); ctx.rect(-r * 0.54, -r * 0.2, r * 1.08, r * 0.22); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#111';
      ctx.beginPath(); ctx.ellipse(s * r * 0.42, r * 0.04, r * (0.36 + 0.22 * Math.abs(s)), r * 0.11, 0, 0, Math.PI); ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.fillStyle = 'rgba(255,255,255,0.35)'; ctx.fillRect(s * r * 0.42 - r * 0.2, r * 0.05, r * 0.25, r * 0.03);
      if (c > 0.15) {
        ctx.save(); ctx.translate(s * r * 0.35, -r * 0.42); ctx.scale(c, 1);
        ctx.fillStyle = '#ffd23a'; ctx.beginPath();
        ctx.moveTo(0, -r * 0.16); ctx.lineTo(r * 0.12, -r * 0.06); ctx.lineTo(r * 0.08, r * 0.12); ctx.lineTo(-r * 0.08, r * 0.12); ctx.lineTo(-r * 0.12, -r * 0.06); ctx.closePath();
        ctx.fill(); ctx.lineWidth = lw * 0.6; ctx.stroke();
        if (r >= 20 && c > 0.7) {
          setFont(ctx, r * 0.15, 900); ctx.fillStyle = '#ffffff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
          ctx.fillText('POLICE', 0, r * 0.33);
        }
        ctx.restore();
      }
      ctx.restore();
    } else if (a === 'military' || a === 'general') {
      const col = a === 'general' ? '#2f5d1e' : '#3c8a2a';
      ctx.save(); ctx.translate(0, -r * 0.78);
      ctx.fillStyle = col;
      ctx.beginPath(); ctx.moveTo(-r * 0.62, r * 0.12); ctx.quadraticCurveTo(-r * 0.62, -r * 0.5, 0, -r * 0.52); ctx.quadraticCurveTo(r * 0.62, -r * 0.5, r * 0.62, r * 0.12); ctx.closePath();
      ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#1a1a1a';
      ctx.beginPath(); ctx.ellipse(s * r * 0.45, r * 0.1, r * (0.35 + 0.25 * Math.abs(s)), r * 0.1, 0, 0, TAU); ctx.fill(); ctx.stroke();
      if (a === 'general' && c > 0.2) { ctx.fillStyle = '#ffd700'; this.star(ctx, s * r * 0.25, -r * 0.25, r * 0.13); }
      ctx.restore();
    } else if (a === 'goggles' || a === 'sunglasses') {
      const P = [-0.42, 0.42].map((l) => sphP(l, 0.08, r, phi));
      if (a === 'goggles') {
        ctx.strokeStyle = '#222'; ctx.lineWidth = r * 0.12;
        ctx.beginPath(); ctx.moveTo(-r, P[0][1] - r * 0.02); ctx.lineTo(r, P[1][1] - r * 0.02); ctx.stroke();
      }
      for (const p of P) {
        if (p[2] < 0.1) continue;
        ctx.save(); ctx.translate(p[0], p[1]); ctx.scale(0.4 + 0.6 * p[2], 1);
        ctx.fillStyle = a === 'goggles' ? 'rgba(160,230,255,0.75)' : '#111';
        ctx.lineWidth = lw;
        ctx.strokeStyle = '#000';
        ctx.beginPath();
        if (a === 'goggles') ctx.arc(0, 0, r * 0.36, 0, TAU);
        else roundRect(ctx, -r * 0.34, -r * 0.2, r * 0.68, r * 0.42, r * 0.15);
        ctx.fill(); ctx.stroke();
        if (a === 'sunglasses') { ctx.fillStyle = 'rgba(255,255,255,0.5)'; ctx.fillRect(-r * 0.2, -r * 0.12, r * 0.12, r * 0.08); }
        ctx.restore();
      }
      if (a === 'sunglasses' && P[0][2] > 0.1 && P[1][2] > 0.1) {
        ctx.beginPath(); ctx.moveTo(P[0][0] + r * 0.2, P[0][1] - r * 0.1); ctx.lineTo(P[1][0] - r * 0.2, P[1][1] - r * 0.1); ctx.stroke();
      }
    } else if (a === 'cuffs') {
      if (c < 0) return;
      ctx.strokeStyle = '#9a9a9a'; ctx.lineWidth = r * 0.1;
      ctx.beginPath(); ctx.arc(-r * 0.3 + s * r * 0.3, r * 0.65, r * 0.16, 0, TAU); ctx.stroke();
      ctx.beginPath(); ctx.arc(r * 0.3 + s * r * 0.3, r * 0.65, r * 0.16, 0, TAU); ctx.stroke();
      ctx.lineWidth = r * 0.05; ctx.beginPath(); ctx.moveTo(-r * 0.14 + s * r * 0.3, r * 0.65); ctx.lineTo(r * 0.14 + s * r * 0.3, r * 0.65); ctx.stroke();
    } else if (a === 'mayor') {
      ctx.save(); ctx.translate(s * r * 0.1, -r * 0.85);
      ctx.fillStyle = '#222';
      ctx.beginPath(); roundRect(ctx, -r * 0.5, -r * 0.08, r, r * 0.18, r * 0.05); ctx.fill(); ctx.stroke();
      ctx.beginPath(); roundRect(ctx, -r * 0.3, -r * 0.55, r * 0.6, r * 0.5, r * 0.05); ctx.fill(); ctx.stroke();
      ctx.restore();
      if (c > 0.1) {
        // bigote
        ctx.fillStyle = '#5a3a1a';
        ctx.save(); ctx.translate(s * r * 0.5, r * 0.4); ctx.scale(0.5 + 0.5 * c, 1);
        ctx.beginPath(); ctx.ellipse(-r * 0.2, 0, r * 0.22, r * 0.09, 0.3, 0, TAU); ctx.ellipse(r * 0.2, 0, r * 0.22, r * 0.09, -0.3, 0, TAU); ctx.fill();
        ctx.restore();
      }

  },

  hat(ctx, kind, r, phi, lw, t) {
    const s = Math.sin(phi), c = Math.cos(phi);
    ctx.save(); ctx.lineWidth = lw; ctx.strokeStyle = '#000'; ctx.lineJoin = 'round';
    ctx.translate(s * r * 0.08, -r * 0.82);
    if (kind === 'gorra') {
      ctx.fillStyle = '#e8262a';
      ctx.beginPath(); ctx.moveTo(-r * 0.62, r * 0.14); ctx.quadraticCurveTo(-r * 0.6, -r * 0.5, 0, -r * 0.5); ctx.quadraticCurveTo(r * 0.6, -r * 0.5, r * 0.62, r * 0.14); ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.beginPath(); ctx.ellipse(s * r * 0.5, r * 0.12, r * (0.3 + 0.3 * Math.abs(s)), r * 0.1, 0, 0, TAU); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(0, -r * 0.5, r * 0.07, 0, TAU); ctx.fill();
    } else if (kind === 'sombrero') {
      ctx.fillStyle = '#e8c15a';
      ctx.beginPath(); ctx.ellipse(0, r * 0.08, r * 1.15, r * 0.24, 0, 0, TAU); ctx.fill(); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(-r * 0.42, r * 0.05); ctx.quadraticCurveTo(-r * 0.35, -r * 0.75, 0, -r * 0.78); ctx.quadraticCurveTo(r * 0.35, -r * 0.75, r * 0.42, r * 0.05); ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.strokeStyle = '#c0392b'; ctx.lineWidth = r * 0.1; ctx.beginPath(); ctx.moveTo(-r * 0.4, -r * 0.08); ctx.lineTo(r * 0.4, -r * 0.08); ctx.stroke();
      ctx.strokeStyle = '#27ae60'; ctx.beginPath(); ctx.moveTo(-r * 0.95, r * 0.1); ctx.quadraticCurveTo(0, r * 0.32, r * 0.95, r * 0.1); ctx.stroke();
    } else if (kind === 'corona') {
      ctx.fillStyle = '#ffd23a';
      ctx.beginPath(); ctx.moveTo(-r * 0.55, r * 0.12); ctx.lineTo(-r * 0.6, -r * 0.45); ctx.lineTo(-r * 0.28, -r * 0.15); ctx.lineTo(0, -r * 0.55);
      ctx.lineTo(r * 0.28, -r * 0.15); ctx.lineTo(r * 0.6, -r * 0.45); ctx.lineTo(r * 0.55, r * 0.12); ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#2a9df4'; ctx.beginPath(); ctx.arc(s * r * 0.2, -r * 0.05, r * 0.09, 0, TAU); ctx.fill();
      ctx.fillStyle = '#e8262a'; ctx.beginPath(); ctx.arc(s * r * 0.2 - r * 0.3, -r * 0.02, r * 0.07, 0, TAU); ctx.arc(s * r * 0.2 + r * 0.3, -r * 0.02, r * 0.07, 0, TAU); ctx.fill();
    } else if (kind === 'vikingo') {
      ctx.fillStyle = '#f2f2e0';
      for (const d of [-1, 1]) { ctx.beginPath(); ctx.moveTo(d * r * 0.45, -r * 0.05); ctx.quadraticCurveTo(d * r * 0.95, -r * 0.2, d * r * 0.85, -r * 0.75); ctx.quadraticCurveTo(d * r * 0.7, -r * 0.3, d * r * 0.35, -r * 0.3); ctx.closePath(); ctx.fill(); ctx.stroke(); }
      ctx.fillStyle = '#9aa0a8';
      ctx.beginPath(); ctx.moveTo(-r * 0.6, r * 0.15); ctx.quadraticCurveTo(-r * 0.6, -r * 0.55, 0, -r * 0.55); ctx.quadraticCurveTo(r * 0.6, -r * 0.55, r * 0.6, r * 0.15); ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#c9a227'; ctx.fillRect(-r * 0.6, r * 0.02, r * 1.2, r * 0.13); ctx.strokeRect(-r * 0.6, r * 0.02, r * 1.2, r * 0.13);
    } else if (kind === 'fiesta') {
      ctx.fillStyle = '#9b5bff';
      ctx.beginPath(); ctx.moveTo(-r * 0.4, r * 0.12); ctx.lineTo(s * r * 0.1, -r * 0.95); ctx.lineTo(r * 0.4, r * 0.12); ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#ffe14d'; ctx.beginPath(); ctx.arc(s * r * 0.1, -r * 0.98, r * 0.13, 0, TAU); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#4ad3ff'; ctx.beginPath(); ctx.arc(-r * 0.1, -r * 0.2, r * 0.07, 0, TAU); ctx.arc(r * 0.12, -r * 0.5, r * 0.06, 0, TAU); ctx.fill();
    } else if (kind === 'audifonos') {
      ctx.translate(0, r * 0.8);
      ctx.strokeStyle = '#222'; ctx.lineWidth = r * 0.12;
      ctx.beginPath(); ctx.arc(0, 0, r * 1.02, Math.PI * 1.08, Math.PI * 1.92); ctx.stroke();
      ctx.fillStyle = '#e8262a'; ctx.lineWidth = lw;
      for (const d of [-1, 1]) {
        const x = d * r * 0.95 * Math.abs(c) + s * r * 0.0;
        if (Math.abs(c) < 0.3 && d !== Math.sign(-s)) continue;
        ctx.beginPath(); roundRect(ctx, x - r * 0.15, -r * 0.3, r * 0.3, r * 0.48, r * 0.12); ctx.fill(); ctx.strokeStyle = '#000'; ctx.stroke();
      }
    } else if (kind === 'mono') {
      ctx.translate(s * r * 0.4 + r * 0.25, r * 0.15);
      ctx.fillStyle = '#ff5ab4';
      ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(-r * 0.4, -r * 0.25); ctx.lineTo(-r * 0.4, r * 0.25); ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(r * 0.4, -r * 0.25); ctx.lineTo(r * 0.4, r * 0.25); ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.beginPath(); ctx.arc(0, 0, r * 0.1, 0, TAU); ctx.fill(); ctx.stroke();
    } else if (kind === 'chef') {
      ctx.fillStyle = '#ffffff';
      ctx.beginPath(); ctx.rect(-r * 0.42, -r * 0.25, r * 0.84, r * 0.38); ctx.fill(); ctx.stroke();
      ctx.beginPath(); ctx.arc(-r * 0.3, -r * 0.45, r * 0.28, 0, TAU); ctx.arc(r * 0.3, -r * 0.45, r * 0.28, 0, TAU); ctx.arc(0, -r * 0.65, r * 0.32, 0, TAU); ctx.fill();
      ctx.beginPath(); ctx.arc(-r * 0.3, -r * 0.45, r * 0.28, Math.PI * 0.6, Math.PI * 1.6); ctx.stroke();
      ctx.beginPath(); ctx.arc(r * 0.3, -r * 0.45, r * 0.28, -Math.PI * 0.6, Math.PI * 0.4); ctx.stroke();
      ctx.beginPath(); ctx.arc(0, -r * 0.65, r * 0.32, Math.PI * 1.1, Math.PI * 1.9); ctx.stroke();
    } else if (kind === 'gorro') {
      ctx.fillStyle = '#2bb673';
      ctx.beginPath(); ctx.moveTo(-r * 0.62, r * 0.15); ctx.quadraticCurveTo(-r * 0.62, -r * 0.62, 0, -r * 0.62); ctx.quadraticCurveTo(r * 0.62, -r * 0.62, r * 0.62, r * 0.15); ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#ffffff'; ctx.fillRect(-r * 0.64, 0, r * 1.28, r * 0.17); ctx.strokeRect(-r * 0.64, 0, r * 1.28, r * 0.17);

    ctx.restore();
  },

  face(ctx, kind, r, phi, lw) {
    const P = [-0.42, 0.42].map((l) => sphP(l, 0.08, r, phi));
    ctx.save(); ctx.lineWidth = lw; ctx.strokeStyle = '#000';
    if (kind === 'gafas' || kind === 'gafas3d') {
      for (let i = 0; i < 2; i++) {
        const p = P[i]; if (p[2] < 0.1) continue;
        ctx.save(); ctx.translate(p[0], p[1]); ctx.scale(0.4 + 0.6 * p[2], 1);
        ctx.fillStyle = kind === 'gafas' ? '#111' : (i === 0 ? 'rgba(255,40,40,0.8)' : 'rgba(40,200,255,0.8)');
        ctx.beginPath(); roundRect(ctx, -r * 0.34, -r * 0.22, r * 0.68, r * 0.44, r * 0.12); ctx.fill(); ctx.stroke();
        ctx.restore();
      }
      if (P[0][2] > 0.1 && P[1][2] > 0.1) { ctx.beginPath(); ctx.moveTo(P[0][0] + r * 0.2, P[0][1] - r * 0.12); ctx.lineTo(P[1][0] - r * 0.2, P[1][1] - r * 0.12); ctx.stroke(); }
    } else if (kind === 'monoculo') {
      const p = P[1]; if (p[2] > 0.1) {
        ctx.strokeStyle = '#d4a017'; ctx.lineWidth = lw * 1.1;
        ctx.beginPath(); ctx.ellipse(p[0], p[1], r * 0.36 * (0.4 + 0.6 * p[2]), r * 0.38, 0, 0, TAU); ctx.stroke();
        ctx.lineWidth = lw * 0.6; ctx.beginPath(); ctx.moveTo(p[0], p[1] + r * 0.38); ctx.quadraticCurveTo(p[0] + r * 0.2, p[1] + r * 0.7, p[0] - r * 0.1, p[1] + r * 0.9); ctx.stroke();
      }
    } else if (kind === 'bigote') {
      const p = sphP(0, -0.45, r, phi);
      if (p[2] > 0.15) {
        ctx.fillStyle = '#3a2412';
        ctx.save(); ctx.translate(p[0], p[1]); ctx.scale(p[2], 1);
        ctx.beginPath(); ctx.ellipse(-r * 0.2, 0, r * 0.24, r * 0.1, 0.35, 0, TAU); ctx.ellipse(r * 0.2, 0, r * 0.24, r * 0.1, -0.35, 0, TAU); ctx.fill();
        ctx.restore();
      }
    }
    ctx.restore();
  },

  star(ctx, x, y, rr) {
    ctx.beginPath();
    for (let i = 0; i < 10; i++) {
      const a = -HALF_PI + (i * Math.PI) / 5, q = i % 2 === 0 ? rr : rr * 0.45;
      ctx.lineTo(x + Math.cos(a) * q, y + Math.sin(a) * q);
    }
    ctx.closePath(); ctx.fill();
  },

  sparks(ctx, r, t) {
    ctx.strokeStyle = '#fffb7a'; ctx.lineWidth = Math.max(1.2, r * 0.05);
    for (let i = 0; i < 3; i++) {
      const a = t * 3 + i * 2.1 + Math.sin(t * 17 + i) * 0.3;
      const x0 = Math.cos(a) * r * 1.15, y0 = Math.sin(a) * r * 1.15;
      ctx.beginPath(); ctx.moveTo(x0, y0);
      ctx.lineTo(x0 + Math.cos(a + 1) * r * 0.2, y0 + Math.sin(a + 1) * r * 0.2);
      ctx.lineTo(x0 + Math.cos(a) * r * 0.35, y0 + Math.sin(a) * r * 0.35);
      ctx.stroke();
    }
  },

  // Moneda del sol
  coin(ctx, x, y, t, r = 10) {
    const w = Math.abs(Math.cos(t * 3));
    ctx.save(); ctx.translate(x, y); ctx.scale(Math.max(0.15, w), 1);
    ctx.fillStyle = '#ffcf1a'; ctx.strokeStyle = '#000'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(0, 0, r, 0, TAU); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#ffef8a'; ctx.beginPath(); ctx.arc(0, 0, r * 0.55, 0, TAU); ctx.fill();
    ctx.strokeStyle = '#e09000'; ctx.lineWidth = 1.5;
    for (let i = 0; i < 8; i++) {
      const a = (i / 8) * TAU;
      ctx.beginPath(); ctx.moveTo(Math.cos(a) * r * 0.62, Math.sin(a) * r * 0.62); ctx.lineTo(Math.cos(a) * r * 0.85, Math.sin(a) * r * 0.85); ctx.stroke();
    }
    ctx.restore();
  },
  heart(ctx, x, y, s, fill = '#ff2d55', stroke = '#000') {
    ctx.save(); ctx.translate(x, y); ctx.scale(s / 20, s / 20);
    ctx.beginPath();
    ctx.moveTo(0, 7); ctx.bezierCurveTo(-14, -2, -9, -14, 0, -6); ctx.bezierCurveTo(9, -14, 14, -2, 0, 7);
    ctx.closePath();
    ctx.fillStyle = fill; ctx.fill(); ctx.lineWidth = 2.4; ctx.strokeStyle = stroke; ctx.stroke();
    ctx.restore();
  },
  crystal(ctx, x, y, col, t, s = 1) {
    ctx.save(); ctx.translate(x, y + Math.sin(t * 2.5) * 3); ctx.scale(s, s);
    const g = ctx.createRadialGradient(0, 0, 2, 0, 0, 30);
    g.addColorStop(0, col + 'aa'); g.addColorStop(1, col + '00');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, 30, 0, TAU); ctx.fill();
    ctx.fillStyle = col; ctx.strokeStyle = '#000'; ctx.lineWidth = 2.2; ctx.lineJoin = 'round';
    ctx.beginPath(); ctx.moveTo(0, -18); ctx.lineTo(10, -4); ctx.lineTo(6, 16); ctx.lineTo(-6, 16); ctx.lineTo(-10, -4); ctx.closePath();
    ctx.fill(); ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,0.6)';
    ctx.beginPath(); ctx.moveTo(0, -14); ctx.lineTo(4, -4); ctx.lineTo(1, 12); ctx.lineTo(-2, -4); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = '#fffb7a'; ctx.lineWidth = 1.6;
    const a = t * 5;
    ctx.beginPath(); ctx.moveTo(Math.cos(a) * 14, Math.sin(a) * 14); ctx.lineTo(Math.cos(a + 0.4) * 20, Math.sin(a + 0.4) * 17); ctx.lineTo(Math.cos(a + 0.2) * 25, Math.sin(a + 0.2) * 23); ctx.stroke();
    ctx.restore();
  },
};

// Genera (y guarda) las imágenes de bloques para un tema a cierta escala.
const TileCache = {
  cache: {},
  get(themeName, S) {
    const key = themeName + '@' + S.toFixed(3);
    if (this.cache[key]) return this.cache[key];
    const th = THEMES[themeName];
    const px = Math.ceil(TILE * S);
    const mk = (fn) => {
      const c = document.createElement('canvas'); c.width = px; c.height = px;
      const g = c.getContext('2d'); g.scale(px / TILE, px / TILE); fn(g); return c;
    };
    const rnd = mulberry32(themeName.length * 99);
    const speckles = (g, col, n, a = 0.35) => {
      g.fillStyle = col; g.globalAlpha = a;
      for (let i = 0; i < n; i++) { g.fillRect(rnd() * 30, 6 + rnd() * 24, 2 + rnd() * 3, 2 + rnd() * 2); }
      g.globalAlpha = 1;
    };
    const T = {};
    T.fill = mk((g) => {
      g.fillStyle = th.ground[1]; g.fillRect(0, 0, TILE, TILE);
      if (th.brick) { this.bricks(g, th.ground[1], th.ground[2]); }
      else if (th.concrete) { g.fillStyle = th.ground[2]; g.fillRect(0, 15, TILE, 2); g.fillRect(15, 0, 2, 15); }
      else speckles(g, th.ground[2], 7, 0.6);
    });
    T.top = mk((g) => {
      g.drawImage(T.fill, 0, 0, TILE, TILE);
      g.fillStyle = th.ground[0];
      g.beginPath(); g.moveTo(0, 0); g.lineTo(TILE, 0); g.lineTo(TILE, 9);
      for (let x = TILE; x >= 0; x -= 4) g.lineTo(x, 9 + ((x / 4) % 2 ? 3 : 0));
      g.closePath(); g.fill();
      g.fillStyle = 'rgba(255,255,255,0.25)'; g.fillRect(0, 0, TILE, 2.5);
      if (th.sand) { g.fillStyle = '#ffe9ad'; g.fillRect(0, 0, TILE, 2); }
    });
    T.block = mk((g) => {
      g.fillStyle = th.block; g.fillRect(0, 0, TILE, TILE);
      if (th.brick) this.bricks(g, th.block, shade(th.block, -0.25));
      else if (th.concrete) {
        g.fillStyle = shade(th.block, -0.2); g.fillRect(0, 0, TILE, 3);
        g.fillStyle = '#ffd86b'; g.globalAlpha = 0.85; g.fillRect(7, 9, 7, 10); g.fillRect(19, 9, 7, 10); g.globalAlpha = 1;
        g.strokeStyle = shade(th.block, -0.35); g.lineWidth = 1.5; g.strokeRect(7, 9, 7, 10); g.strokeRect(19, 9, 7, 10);
      } else if (th.tech) {
        g.fillStyle = shade(th.block, 0.15); g.fillRect(2, 2, TILE - 4, TILE - 4);
        g.strokeStyle = '#40e0ff'; g.lineWidth = 2; g.strokeRect(5, 5, TILE - 10, TILE - 10);
      } else {
        // caja de madera
        g.strokeStyle = shade(th.block, -0.35); g.lineWidth = 2.5;
        g.strokeRect(3, 3, TILE - 6, TILE - 6);
        g.beginPath(); g.moveTo(4, 4); g.lineTo(TILE - 4, TILE - 4); g.moveTo(TILE - 4, 4); g.lineTo(4, TILE - 4); g.stroke();
      }
    });
    T.deck = mk((g) => {
      g.fillStyle = '#9c6432'; g.fillRect(0, 0, TILE, TILE);
      g.fillStyle = '#7a4b22'; for (let y = 0; y < TILE; y += 8) g.fillRect(0, y, TILE, 1.5);
      g.fillStyle = '#5b3416'; g.fillRect(14, 2, 2, 2); g.fillRect(14, 18, 2, 2);
    });
    T.plat = mk((g) => {
      g.fillStyle = th.plat; g.fillRect(0, 0, TILE, 11);
      g.fillStyle = 'rgba(255,255,255,0.35)'; g.fillRect(0, 0, TILE, 3);
      g.fillStyle = 'rgba(0,0,0,0.3)'; g.fillRect(0, 9, TILE, 2);
      g.strokeStyle = '#000'; g.lineWidth = 2; g.strokeRect(1, 1, TILE - 2, 10);
      if (th.tech) { g.fillStyle = '#ffffff'; g.globalAlpha = 0.8; g.fillRect(12, 4, 8, 3); g.globalAlpha = 1; }
    });
    T.spikes = mk((g) => {
      g.fillStyle = '#d8d8e0'; g.strokeStyle = '#000'; g.lineWidth = 2; g.lineJoin = 'round';
      for (let i = 0; i < 3; i++) {
        g.beginPath(); g.moveTo(i * 10.67 + 1, TILE); g.lineTo(i * 10.67 + 5.33, 12); g.lineTo(i * 10.67 + 9.67, TILE); g.closePath(); g.fill(); g.stroke();
      }
    });
    T.door = mk((g) => {
      g.fillStyle = '#7a4a1a'; g.fillRect(2, 0, TILE - 4, TILE);
      g.strokeStyle = '#000'; g.lineWidth = 2; g.strokeRect(2, 0, TILE - 4, TILE);
      g.fillStyle = '#ffd23a'; g.beginPath(); g.arc(TILE / 2, TILE / 2, 6, 0, TAU); g.fill(); g.stroke();
      g.fillStyle = '#000'; g.fillRect(TILE / 2 - 1.5, TILE / 2 - 2, 3, 7);
    });
    this.cache[key] = T;
    return T;
  },
  bricks(g, a, b) {
    g.fillStyle = a; g.fillRect(0, 0, TILE, TILE);
    g.fillStyle = b;
    g.fillRect(0, 0, TILE, 2); g.fillRect(0, 15, TILE, 2);
    g.fillRect(15, 0, 2, 15); g.fillRect(6, 16, 2, 16); g.fillRect(24, 16, 2, 16);
  },
};

function shade(hex, amt) {
  const n = parseInt(hex.slice(1), 16);
  let r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  const f = (c) => clamp(Math.round(amt < 0 ? c * (1 + amt) : c + (255 - c) * amt), 0, 255);
  return '#' + ((1 << 24) + (f(r) << 16) + (f(g) << 8) + f(b)).toString(16).slice(1);
}

// ======================= Fondos =======================
const BG = {
  draw(ctx, themeName, camX, camY, t, levelH) {
    const th = THEMES[themeName];
    const g = ctx.createLinearGradient(0, 0, 0, VH);
    g.addColorStop(0, th.sky[0]); g.addColorStop(1, th.sky[1]);
    ctx.fillStyle = g; ctx.fillRect(0, 0, VW, VH);
    const yOff = -camY * 0.1;
    if (th.sun) {
      ctx.fillStyle = th.sun; ctx.globalAlpha = 0.9;
      ctx.beginPath(); ctx.arc(VW * 0.78, 90 + yOff, 46, 0, TAU); ctx.fill();
      ctx.globalAlpha = 0.25; ctx.beginPath(); ctx.arc(VW * 0.78, 90 + yOff, 70, 0, TAU); ctx.fill();
      ctx.globalAlpha = 1;
    }
    if (this[th.far]) this[th.far](ctx, camX * 0.12, yOff, t, 0);
    if (this[th.mid]) this[th.mid](ctx, camX * 0.35, -camY * 0.25, t, 1);
  },
  // repite elementos según la posición de la cámara (parallax)
  each(px, spacing, fn) {
    const i0 = Math.floor(px / spacing) - 1, i1 = Math.ceil((px + VW) / spacing) + 1;
    for (let i = i0; i <= i1; i++) fn(i * spacing - px, i);
  },
  hills(ctx, px, yo) {
    ctx.fillStyle = '#7fd67f';
    this.each(px, 260, (x, i) => { const h = 90 + hash1(i) * 70; ctx.beginPath(); ctx.ellipse(x, VH - 90 + yo, 200, h, 0, Math.PI, TAU); ctx.fill(); });
    ctx.fillStyle = '#5cbf5c';
    this.each(px * 1.4, 200, (x, i) => { const h = 60 + hash1(i + 9) * 50; ctx.beginPath(); ctx.ellipse(x, VH - 60 + yo, 150, h, 0, Math.PI, TAU); ctx.fill(); });
  },
  hillsDark(ctx, px, yo, t) {
    ctx.fillStyle = '#5a1d14';
    this.each(px, 260, (x, i) => { const h = 90 + hash1(i) * 70; ctx.beginPath(); ctx.ellipse(x, VH - 90 + yo, 200, h, 0, Math.PI, TAU); ctx.fill(); });
    // columnas de humo
    ctx.fillStyle = 'rgba(30,20,20,0.35)';
    this.each(px, 330, (x, i) => {
      for (let k = 0; k < 6; k++) {
        const yy = VH - 160 - k * 50 - ((t * 20) % 50);
        ctx.beginPath(); ctx.arc(x + Math.sin(t + k + i) * 10 + k * 8, yy + yo, 26 + k * 6, 0, TAU); ctx.fill();
      }
    });
  },
  house(ctx, x, base, w, h, wall, roof, fire, t, i) {
    ctx.fillStyle = wall; ctx.fillRect(x, base - h, w, h);
    ctx.fillStyle = roof;
    ctx.beginPath(); ctx.moveTo(x - 8, base - h); ctx.lineTo(x + w / 2, base - h - w * 0.5); ctx.lineTo(x + w + 8, base - h); ctx.closePath(); ctx.fill();
    ctx.fillStyle = fire ? '#ffb347' : '#ffe9a0';
    ctx.fillRect(x + w * 0.2, base - h * 0.7, w * 0.22, h * 0.25);
    ctx.fillRect(x + w * 0.58, base - h * 0.7, w * 0.22, h * 0.25);
    ctx.fillStyle = fire ? '#2a1208' : '#7a4a22'; ctx.fillRect(x + w * 0.4, base - h * 0.45, w * 0.2, h * 0.45);
    if (fire) this.flames(ctx, x + w / 2, base - h - w * 0.35, w * 0.7, 40 + hash1(i) * 30, t + i);
  },
  flames(ctx, x, y, w, h, t) {
    for (let k = 0; k < 3; k++) {
      const col = ['#ff3b1f', '#ff8a1f', '#ffe14d'][k];
      const s = 1 - k * 0.28;
      ctx.fillStyle = col;
      ctx.beginPath();
      ctx.moveTo(x - (w / 2) * s, y + 6);
      for (let j = 0; j <= 4; j++) {
        const fx = x - (w / 2) * s + (w * s * j) / 4;
        const fh = h * s * (0.6 + 0.4 * Math.sin(t * 9 + j * 1.7 + k));
        ctx.quadraticCurveTo(fx - (w * s) / 8, y - fh * 0.5, fx, y - fh * (j % 2 ? 0.6 : 1));
      }
      ctx.lineTo(x + (w / 2) * s, y + 6); ctx.closePath(); ctx.fill();
    }
  },
  houses(ctx, px, yo, t) {
    const base = VH - 30 + yo;
    this.each(px, 230, (x, i) => {
      const w = 90 + hash1(i) * 40, h = 70 + hash1(i + 3) * 40;
      this.house(ctx, x, base, w, h, ['#f2d7a6', '#e8c4a0', '#f0e0c0'][i & 1 ? 1 : 0], ['#c0392b', '#a0522d', '#d35400'][Math.abs(i) % 3], false, t, i);
    });
  },
  burningHouses(ctx, px, yo, t) {
    const base = VH - 30 + yo;
    this.each(px, 230, (x, i) => {
      const w = 90 + hash1(i) * 40, h = 70 + hash1(i + 3) * 40;
      this.house(ctx, x, base, w, h, '#4a2a1e', '#2a1510', true, t, i);
    });
  },
  clouds(ctx, px, yo, t) {
    ctx.fillStyle = 'rgba(255,255,255,0.85)';
    this.each(px + t * 8, 300, (x, i) => {
      const y = 80 + hash1(i) * 220 + yo;
      ctx.beginPath(); ctx.arc(x, y, 30, 0, TAU); ctx.arc(x + 35, y - 10, 38, 0, TAU); ctx.arc(x + 75, y, 28, 0, TAU); ctx.fill();
    });
  },
  clouds2(ctx, px, yo, t) {
    ctx.fillStyle = 'rgba(255,240,230,0.7)';
    this.each(px + t * 20, 380, (x, i) => {
      const y = 260 + hash1(i) * 160 + yo;
      ctx.beginPath(); ctx.arc(x, y, 40, 0, TAU); ctx.arc(x + 45, y - 15, 50, 0, TAU); ctx.arc(x + 100, y, 36, 0, TAU); ctx.fill();
    });
  },
  floatIslands(ctx, px, yo, t) {
    this.each(px, 420, (x, i) => {
      const y = 200 + hash1(i) * 150 + Math.sin(t + i) * 8 + yo;
      ctx.fillStyle = '#6f7f9a';
      ctx.beginPath(); ctx.moveTo(x - 60, y); ctx.lineTo(x + 60, y); ctx.lineTo(x + 10, y + 60); ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#40e0ff'; ctx.fillRect(x - 60, y - 6, 120, 6);
      ctx.fillStyle = 'rgba(64,224,255,0.4)'; ctx.fillRect(x - 6, y + 50, 12, 20 + Math.sin(t * 10 + i) * 6);
    });
  },
  castleWall(ctx, px, yo, t) {
    ctx.fillStyle = '#1e1430';
    this.each(px, 64, (x, i) => { ctx.fillRect(x, 60 + yo, 60, VH); ctx.fillRect(x + 8, 40 + yo, 20, 20); });
    // ventanas con antorchas
    this.each(px, 256, (x, i) => {
      ctx.fillStyle = '#0a0612'; ctx.beginPath(); ctx.moveTo(x + 40, 260 + yo); ctx.lineTo(x + 40, 190 + yo); ctx.arc(x + 60, 190 + yo, 20, Math.PI, 0); ctx.lineTo(x + 80, 260 + yo); ctx.fill();
      this.flames(ctx, x + 140, 230 + yo, 14, 22, t * 1.3 + i);
      ctx.fillStyle = '#3a2a1a'; ctx.fillRect(x + 136, 230 + yo, 8, 18);
    });
  },
  pillars(ctx, px, yo) {
    ctx.fillStyle = 'rgba(20,10,35,0.7)';
    this.each(px, 360, (x) => { ctx.fillRect(x, 0, 46, VH); ctx.fillRect(x - 10, 120 + yo, 66, 16); });
  },
  ocean(ctx, px, yo, t) {
    ctx.fillStyle = '#1a8ad4'; ctx.fillRect(0, 300 + yo, VW, VH);
    ctx.fillStyle = 'rgba(255,255,255,0.5)';
    this.each(px * 2, 90, (x, i) => { ctx.fillRect(x + Math.sin(t + i) * 10, 320 + (i % 5) * 26 + yo, 30, 3); });
  },
  oceanIsles(ctx, px, yo, t) {
    this.ocean(ctx, px, yo, t);
    this.each(px, 500, (x, i) => {
      ctx.fillStyle = '#f0d48a'; ctx.beginPath(); ctx.ellipse(x, 302 + yo, 90, 20, 0, Math.PI, TAU); ctx.fill();
      ctx.fillStyle = '#2fa84f'; ctx.beginPath(); ctx.ellipse(x - 10, 290 + yo, 50, 16, 0, Math.PI, TAU); ctx.fill();
    });
  },
  palms(ctx, px, yo, t) {
    this.each(px, 340, (x, i) => {
      const b = VH - 20 + yo, h = 150 + hash1(i) * 60;
      ctx.strokeStyle = '#8a5a2b'; ctx.lineWidth = 12;
      ctx.beginPath(); ctx.moveTo(x, b); ctx.quadraticCurveTo(x + 30, b - h / 2, x + 15, b - h); ctx.stroke();
      ctx.fillStyle = '#2fbf4f';
      for (let k = 0; k < 5; k++) {
        const a = -Math.PI + k * 0.75 + Math.sin(t + i) * 0.05;
        ctx.beginPath(); ctx.ellipse(x + 15 + Math.cos(a) * 40, b - h + Math.sin(a) * 15 + 12, 45, 10, a, 0, TAU); ctx.fill();
      }
    });
  },
  skyline(ctx, px, yo) {
    ctx.fillStyle = '#9aa8b4';
    this.each(px, 90, (x, i) => { const h = 150 + hash1(i) * 230; ctx.fillRect(x, VH - h + yo, 80, h); });
  },
  skylineFire(ctx, px, yo, t) {
    this.each(px, 90, (x, i) => {
      const h = 150 + hash1(i) * 230;
      ctx.fillStyle = '#2a1a22'; ctx.fillRect(x, VH - h + yo, 80, h);
      if (hash1(i + 5) > 0.6) this.flames(ctx, x + 40, VH - h + yo, 60, 40, t + i);
    });
    ctx.fillStyle = 'rgba(40,20,20,0.3)'; ctx.fillRect(0, 0, VW, VH);
  },
  buildings(ctx, px, yo) {
    this.each(px, 170, (x, i) => {
      const h = 120 + hash1(i * 3) * 160, w = 120;
      ctx.fillStyle = '#6f7d8c'; ctx.fillRect(x, VH - h + yo, w, h);
      ctx.fillStyle = '#c9e3ff';
      for (let yy = VH - h + 14; yy < VH - 20; yy += 26) for (let xx = 12; xx < w - 12; xx += 26) ctx.fillRect(x + xx, yy + yo, 14, 16);
    });
  },
  buildingsFire(ctx, px, yo, t) {
    this.each(px, 170, (x, i) => {
      const h = 120 + hash1(i * 3) * 160, w = 120;
      ctx.fillStyle = '#3a3440'; ctx.fillRect(x, VH - h + yo, w, h);
      for (let yy = VH - h + 14; yy < VH - 20; yy += 26) for (let xx = 12; xx < w - 12; xx += 26) {
        ctx.fillStyle = hash1(i * 31 + yy * 7 + xx) > 0.6 ? '#ff8a1f' : '#1c1820';
        ctx.fillRect(x + xx, yy + yo, 14, 16);
      }
    });
  },
  flyingCastles(ctx, px, yo, t) {
    this.each(px + t * 15, 260, (x, i) => {
      const y = 70 + hash1(i) * 200 + Math.sin(t * 0.8 + i) * 6 + yo, s = 0.5 + hash1(i + 2) * 0.6;
      this.miniCastle(ctx, x, y, s, '#5a4a6a');
      ctx.strokeStyle = '#333'; ctx.lineWidth = 2 * s; ctx.setLineDash([4 * s, 3 * s]);
      ctx.beginPath(); ctx.moveTo(x, y - 40 * s); ctx.lineTo(x + 30 * s, -10); ctx.stroke(); ctx.setLineDash([]);
    });
  },
  miniCastle(ctx, x, y, s, col) {
    ctx.fillStyle = col;
    ctx.fillRect(x - 40 * s, y - 40 * s, 80 * s, 40 * s);
    ctx.fillRect(x - 50 * s, y - 70 * s, 20 * s, 70 * s); ctx.fillRect(x + 30 * s, y - 70 * s, 20 * s, 70 * s);
    ctx.fillRect(x - 12 * s, y - 85 * s, 24 * s, 45 * s);
    ctx.beginPath(); ctx.moveTo(x - 40 * s, y); ctx.lineTo(x, y + 40 * s); ctx.lineTo(x + 40 * s, y); ctx.fill();
    ctx.fillStyle = '#ff3b3b'; ctx.fillRect(x - 2 * s, y - 100 * s, 2 * s, 16 * s); ctx.fillRect(x, y - 100 * s, 12 * s, 7 * s);
  },
  castleCity(ctx, px, yo, t) {
    this.each(px, 150, (x, i) => {
      const h = 140 + hash1(i) * 200;
      ctx.fillStyle = '#2a1840';
      ctx.fillRect(x, VH - h + yo, 70, h);
      for (let k = 0; k < 4; k++) ctx.fillRect(x + k * 20, VH - h - 12 + yo, 12, 12);
      ctx.fillStyle = '#ffcf5a'; ctx.globalAlpha = 0.6;
      ctx.fillRect(x + 28, VH - h + 30 + yo, 12, 18); ctx.globalAlpha = 1;
    });
  },
  castleTowers(ctx, px, yo, t) {
    this.each(px, 300, (x, i) => {
      const h = 220 + hash1(i * 5) * 120;
      ctx.fillStyle = '#3a2856'; ctx.fillRect(x, VH - h + yo, 90, h + 200);
      ctx.fillStyle = '#c9a227'; ctx.beginPath(); ctx.moveTo(x - 10, VH - h + yo); ctx.lineTo(x + 45, VH - h - 70 + yo); ctx.lineTo(x + 100, VH - h + yo); ctx.fill();
      ctx.fillStyle = '#ffd27a'; ctx.fillRect(x + 38, VH - h + 40 + yo, 14, 22);
    });
  },
  storm(ctx, px, yo, t) {
    const f = Math.sin(t * 0.7) > 0.97 ? 1 : 0;
    if (f) { ctx.fillStyle = 'rgba(200,200,255,0.4)'; ctx.fillRect(0, 0, VW, VH); }
    ctx.fillStyle = 'rgba(60,40,90,0.7)';
    this.each(px + t * 30, 260, (x, i) => {
      const y = 40 + hash1(i) * 120 + yo;
      ctx.beginPath(); ctx.arc(x, y, 50, 0, TAU); ctx.arc(x + 60, y - 10, 60, 0, TAU); ctx.arc(x + 120, y, 45, 0, TAU); ctx.fill();
    });
    this.castleCity(ctx, px * 1.5, yo + 140, t);
  },
};
