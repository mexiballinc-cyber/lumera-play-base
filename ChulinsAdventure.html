<script>/* js/game.js */
// Núcleo del juego: mapa, colisiones, cámara, diálogos, guiones, HUD.
'use strict';

let G = null; // nivel actual
const ZOOM = 1.18; // acercamiento de la cámara en los niveles

const SOLID = { '#': 1, 'B': 1, 'D': 1, 'k': 1, 'X': 1 };

// ======================= Constructor de niveles =======================
// Se trabaja con un "cursor" que avanza de izquierda a derecha.
// Las alturas se cuentan en bloques desde abajo.
class LB {
  constructor(H = 17) { this.H = H; this.cols = []; this.x = 0; this.g = 3; this.ents = []; this.gch = '#'; }
  col(x) { while (this.cols.length <= x) this.cols.push(new Array(this.H).fill(' ')); return this.cols[x]; }
  put(x, yb, ch) { const y = this.H - 1 - yb; if (y < 0 || y >= this.H || x < 0) return this; this.col(x)[y] = ch; return this; }
  get(x, yb) { const y = this.H - 1 - yb; if (x < 0 || x >= this.cols.length || y < 0 || y >= this.H) return ' '; return this.cols[x][y]; }
  fillCol(x, h, ch = this.gch) { this.col(x); for (let i = 0; i < h; i++) this.put(x, i, ch); return this; }
  // terreno plano de n columnas a la altura actual
  flat(n) { for (let i = 0; i < n; i++) this.fillCol(this.x + i, this.g); this.x += n; return this; }
  step(d) { this.g += d; return this; }
  at(g) { this.g = g; return this; }
  gap(n) { for (let i = 0; i < n; i++) this.col(this.x + i); this.x += n; return this; }
  // foso con algo al fondo: '^' pinchos, 'L' lava, 'W' agua
  pit(n, ch = '^', depth = 1) {
    for (let i = 0; i < n; i++) {
      const x = this.x + i;
      if (ch === '^') { this.fillCol(x, 1); this.put(x, 1, '^'); }
      else if (ch === 'W') { this.fillCol(x, 1); for (let k = 1; k <= depth; k++) this.put(x, k, 'W'); }
      else for (let k = 0; k < depth; k++) this.put(x, k, ch);
    }
    this.x += n; return this;
  }
  // relleno de agua sobre el terreno ya puesto (de la columna x0 a x1), hasta la altura h
  water(x0, x1, h) { for (let x = x0; x < x1; x++) for (let y = 0; y < h; y++) if (this.get(x, y) === ' ') this.put(x, y, 'W'); return this; }
  rect(dx, yb, w, h, ch = 'B') { for (let i = 0; i < w; i++) for (let j = 0; j < h; j++) this.put(this.x + dx + i, yb + j, ch); return this; }
  rectAbs(x, yb, w, h, ch = 'B') { for (let i = 0; i < w; i++) for (let j = 0; j < h; j++) this.put(x + i, yb + j, ch); return this; }
  plat(dx, h, w, ch = '=') { for (let i = 0; i < w; i++) this.put(this.x + dx + i, h, ch); return this; }
  // entidad en la columna (cursor+dx), a la altura h (bloques desde abajo). Sin h: sobre el suelo.
  e(dx, type, props = {}, h = null) {
    const hh = h == null ? this.g : h;
    this.ents.push(Object.assign({ type, tx: this.x + dx, ty: this.H - 1 - hh }, props));
    return this;
  }
  coins(dx, h, n, dy = 0) { for (let i = 0; i < n; i++) this.e(dx + i, 'coin', {}, h + (dy ? Math.round(Math.sin((i / Math.max(1, n - 1)) * Math.PI) * dy) : 0)); return this; }
  done() { this.col(this.x + 1); return { H: this.H, w: this.cols.length, cols: this.cols, ents: this.ents }; }
}

// ======================= Nivel =======================
class Level {
  constructor(def, opts = {}) {
    G = this;
    this.def = def; this.preview = !!opts.preview;
    const b = new LB(def.H || 17); b.gch = def.gch || '#';
    def.build(b);
    const L = b.done();
    this.w = L.w; this.h = L.H;
    this.tiles = [];
    for (let y = 0; y < this.h; y++) { const row = []; for (let x = 0; x < this.w; x++) row.push(L.cols[x][y]); this.tiles.push(row); }
    this.theme = def.theme;
    this.abil = Object.assign({}, Save.data.abil, def.abil || {});
    this.ents = []; this.parts = []; this.coins = 0; this.kills = 0; this.deaths = 0; this.t = 0;
    this.time = def.time || 400; this.state = 'play'; this.toasts = []; this.scripts = [];
    this.vw = VW / ZOOM; this.vh = VH / ZOOM;
    this.cam = { x: 0, y: 0 }; this.shakeA = 0; this.flash = 0; this.elec = new Map(); this.hasKey = false;
    this.bosses = []; this.bossActive = null; this.arena = null; this.dialog = null; this.titleT = this.preview ? 0 : 3;
    this.portalCool = 0;
    let start = { x: 3 * TILE, y: 0 };
    for (const d of L.ents) {
      if (d.type === 'start') { start = { x: d.tx * TILE + TILE / 2, y: (d.ty + 1) * TILE - 14 }; continue; }
      if (this.preview && !['deco', 'mplat'].includes(d.type)) continue;
      const e = this.spawn(d);
      if (e) this.add(e);
    }
    this.coinTotal = this.ents.filter((e) => e instanceof Coin).map((c) => { c.placed = true; return c; }).length;
    let charId = def.force || Save.data.sel;
    const transformed = def.electricAfter && Save.data.crystals[def.electricAfter];
    if (transformed) charId = 'electrico';
    if (!Save.data.chars[charId] && charId !== 'electrico') charId = 'chulin';
    this.player = new Player(start.x, start.y, charId);
    if (def.companion && !this.preview && !transformed) {
      const cid = charId === 'mexicano' ? 'chulin' : 'mexicano';
      this.companion = new Companion(start.x - 40, start.y, cid);
    }
    this.cam.x = this.w * TILE < this.vw ? (this.w * TILE - this.vw) / 2 : clamp(this.player.x - this.vw / 2, 0, this.w * TILE - this.vw);
    this.cam.y = this.camYFor(this.player.y);
    if (!this.preview) {
      Sfx.music(def.music);
      for (const k of (def.see || [])) Save.see(k);
      if (def.start) this.say(def.start);
      if (def.onStart) def.onStart(this);
    }
  }

  spawn(d) {
    const cx = d.tx * TILE + TILE / 2, cy = d.ty * TILE + TILE / 2, by = (d.ty + 1) * TILE;
    const ground = (e) => { e.y = by - e.hh; return e; };
    switch (d.type) {
      case 'coin': return new Coin(cx, cy);
      case 'heart': return new Heart(cx, cy);
      case 'crystal': return new Crystal(cx, cy, d.color);
      case 'key': return new Key(cx, cy);
      case 'cutkey': return new CutKey(cx, cy);
      case 'check': return new Checkpoint(cx, by - 30 + 16);
      case 'goal': return new Goal(cx, by - 48 + 32);
      case 'popspike': return new PopSpike(cx, by - 16, d.phase || 0);
      case 'mine': return new Mine(cx, by - 16);
      case 'bomb': return new Bomb(cx, by - 15);
      case 'saw': return new Saw(cx, cy, d.axis, d.range, d.speed);
      case 'jumper': return new FireJumper(cx, cy, d.delay || 0);
      case 'cannon': return new Cannon(cx, by - 14, d.dir || -1, d.rate || 2.2);
      case 'portal': return new Portal(cx, by - 22 + 8, d.group || 0);
      case 'mplat': return new MPlat(cx, cy, d.w || 3, d.axis || 'x', d.range || 4, d.speed || 1, d.style || this.def.platStyle || 'tech');
      case 'npc': return ground(new NPC(cx, 0, d));
      case 'sign': return ground(new Sign(cx, 0, d.key));
      case 'trigger': return new Trigger(cx, cy, d);
      case 'deco': return new Deco(cx, by - 16, d.kind);
      case 'piranha': return new Piranha(cx, cy, 90, 0, true);
      case 'enemy': {
        const C = ENEMY_TYPES[d.kind];
        const e = new C(cx, cy, d);
        if (!(e instanceof Volador) && !(e instanceof Acuatico)) e.y = by - e.hh;
        if (d.kind === 'volador' || d.kind === 'dorado') { e.ox = cx; e.oy = cy; }
        return e;
      }
      case 'boss': {
        const C = ENEMY_TYPES[d.kind];
        const e = new C(cx, cy, Object.assign({ boss: true }, d));
        if (d.kind !== 'imperialista' && d.kind !== 'kidnapper') e.y = by - e.hh;
        e.active = false; e.arena = d.arena; e.intro = d.intro; e.outro = d.outro; e.ev = d.ev; e.trig = d.trig; e.seal = d.seal;
        this.bosses.push(e);
        return e;
      }
    }
    return null;
  }
  add(e) { this.ents.push(e); return e; }

  // ----------- consultas del mapa -----------
  tile(tx, ty) { if (ty < 0 || ty >= this.h || tx < 0 || tx >= this.w) return ' '; return this.tiles[ty][tx]; }
  setTile(tx, ty, c) { if (ty >= 0 && ty < this.h && tx >= 0 && tx < this.w) this.tiles[ty][tx] = c; }
  isSolid(tx, ty) {
    if (tx < 0 || tx >= this.w) return true;
    if (ty < 0 || ty >= this.h) return false;
    return SOLID[this.tiles[ty][tx]] === 1;
  }
  isSolidPx(x, y) { return this.isSolid(Math.floor(x / TILE), Math.floor(y / TILE)); }
  isGroundPx(x, y) {
    const tx = Math.floor(x / TILE), ty = Math.floor(y / TILE);
    if (this.isSolid(tx, ty) || this.tile(tx, ty) === '=') return true;
    for (const e of this.ents) if (e.platform && Math.abs(e.x - x) < e.hw && Math.abs(e.y - y) < 14) return true;
    return false;
  }
  solidCol(x, y0, y1) {
    const tx = Math.floor(x / TILE);
    for (let ty = Math.floor(y0 / TILE); ty <= Math.floor(y1 / TILE); ty++) if (this.isSolid(tx, ty)) return true;
    return false;
  }
  waterAt(x, y) { return this.tile(Math.floor(x / TILE), Math.floor(y / TILE)) === 'W'; }
  elecAt(x, y) { const tx = Math.floor(x / TILE), ty = Math.floor(y / TILE); return this.elec.has(ty * this.w + tx); }
  waterSurfaceBelow(x, y) {
    const tx = Math.floor(x / TILE);
    for (let ty = Math.max(0, Math.floor(y / TILE) - 2); ty < this.h; ty++) {
      if (this.tile(tx, ty) === 'W' && this.tile(tx, ty - 1) !== 'W') return ty * TILE + 6;
      if (this.isSolid(tx, ty)) return null;
    }
    return null;
  }
  camYFor(py) {
    const maxY = this.h * TILE - this.vh;
    if (maxY <= 0) return maxY;
    return clamp(py - this.vh * 0.55, 0, maxY);
  }

  // Movimiento con colisiones contra bloques y plataformas
  moveBody(e, dt) {
    e.x += e.vx * dt;
    e.hitWall = 0;
    const top = e.y - e.hh + 1, bot = e.y + e.hh - 1;
    const ty0 = Math.floor(top / TILE), ty1 = Math.floor(bot / TILE);
    if (e.vx > 0) {
      const tx = Math.floor((e.x + e.hw) / TILE);
      for (let ty = ty0; ty <= ty1; ty++) if (this.isSolid(tx, ty)) { e.x = tx * TILE - e.hw - 0.01; e.vx = 0; e.hitWall = 1; break; }
    } else if (e.vx < 0) {
      const tx = Math.floor((e.x - e.hw) / TILE);
      for (let ty = ty0; ty <= ty1; ty++) if (this.isSolid(tx, ty)) { e.x = (tx + 1) * TILE + e.hw + 0.01; e.vx = 0; e.hitWall = -1; break; }
    }
    const prevBottom = e.y + e.hh;
    e.y += e.vy * dt;
    e.onGround = false; e.ride = null;
    const tx0 = Math.floor((e.x - e.hw + 1) / TILE), tx1 = Math.floor((e.x + e.hw - 1) / TILE);
    if (e.vy >= 0) {
      const ty = Math.floor((e.y + e.hh) / TILE);
      for (let tx = tx0; tx <= tx1; tx++) {
        const c = this.tile(tx, ty);
        if (this.isSolid(tx, ty) || (c === '=' && prevBottom <= ty * TILE + 1 && !e.dropping)) {
          e.y = ty * TILE - e.hh; e.vy = 0; e.onGround = true; break;
        }
      }
      if (!e.onGround) {
        for (const p of this.ents) {
          if (!p.platform || p.fallen > 0) continue;
          const ptop = p.y - p.hh;
          if (Math.abs(e.x - p.x) < p.hw + e.hw - 4 && prevBottom <= ptop - p.dy + 2 && e.y + e.hh >= ptop) {
            e.y = ptop - e.hh; e.vy = 0; e.onGround = true; e.ride = p; break;
          }
        }
      }
    } else {
      const ty = Math.floor((e.y - e.hh) / TILE);
      for (let tx = tx0; tx <= tx1; tx++) if (this.isSolid(tx, ty)) { e.y = (ty + 1) * TILE + e.hh; e.vy = 0; e.hitCeil = true; break; }
    }
  }

  // ----------- efectos -----------
  puff(x, y, col, n = 6, sp = 100) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * TAU, s = Math.random() * sp;
      this.parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 30, life: 0.4 + Math.random() * 0.4, max: 0.8, col, size: 3 + Math.random() * 4, g: 200 });
    }
  }
  dust(x, y) { this.puff(x, y, 'rgba(230,220,200,0.9)', 3, 50); }
  sparkle(x, y, col, n = 10) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * TAU, s = 60 + Math.random() * 140;
      this.parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 0.6, max: 0.6, col, size: 3, g: 0, star: true });
    }
  }
  splash(x, y) { for (let i = 0; i < 10; i++) this.parts.push({ x: x + rand(-10, 10), y, vx: rand(-80, 80), vy: rand(-320, -120), life: 0.6, max: 0.6, col: '#bfe9ff', size: 3, g: 900 }); }
  zap(x, y) {
    for (let i = 0; i < 6; i++) this.parts.push({ x, y, vx: rand(-200, 200), vy: rand(-200, 200), life: 0.25, max: 0.25, col: '#fffb7a', size: 2, g: 0, bolt: true });
  }
  explode(x, y, r, hurtsPlayer) {
    Sfx.play('explode'); this.shake(8);
    for (let i = 0; i < 22; i++) {
      const a = Math.random() * TAU, s = Math.random() * r * 4;
      this.parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 0.5 + Math.random() * 0.3, max: 0.8, col: pick(['#ff3b1f', '#ff8a1f', '#ffe14d', '#555']), size: 5 + Math.random() * 8, g: -50 });
    }
    const p = this.player;
    if (hurtsPlayer && dist(p.x, p.y, x, y) < r) p.hurt(1, x);
    for (const e of this.ents) if (e.isEnemy && !e.dead && dist(e.x, e.y, x, y) < r + (e.r || 10)) e.hurt(2, null);
  }
  shake(a) { this.shakeA = Math.max(this.shakeA, a); }
  toast(text) { this.toasts.push({ text, t: 2.2 }); if (this.toasts.length > 3) this.toasts.shift(); }
  electrify(tx, ty) {
    const seen = new Set(); const stack = [[tx, ty]];
    while (stack.length && seen.size < 900) {
      const [x, y] = stack.pop(); const k = y * this.w + x;
      if (seen.has(k) || this.tile(x, y) !== 'W') continue;
      seen.add(k); this.elec.set(k, 1.2);
      stack.push([x + 1, y], [x - 1, y], [x, y + 1], [x, y - 1]);
    }
    Sfx.play('elec'); this.flash = Math.max(this.flash, 0.15);
    if (!this.elecTold) { this.elecTold = true; this.event('water_electrified'); }
  }

  // ----------- diálogos y guiones -----------
  say(key, cb) {
    const lines = typeof key === 'string' ? DLG[key] : key;
    if (!lines) { if (cb) cb(); return; }
    const L = lines.map((l, i) => ({ who: l[0], expr: l[1] || 'neutral', text: T(l[2] || `${key}.${i}`) }));
    if (this.dialog) { this.dialog.lines.push(...L); const old = this.dialog.cb; this.dialog.cb = () => { if (old) old(); if (cb) cb(); }; return; }
    this.dialog = { lines: L, i: 0, n: 0, cb };
  }
  updateDialog(dt) {
    const d = this.dialog;
    const line = d.lines[d.i];
    const before = Math.floor(d.n);
    d.n = Math.min(line.text.length, d.n + dt * 48);
    if (Math.floor(d.n) !== before && Math.floor(d.n) % 3 === 0) Sfx.play('talk');
    let adv = Input.pressed('jump') || Input.pressed('confirm') || Input.pressed('shoot');
    for (const tp of Input.taps) if (tp.btn !== 'pause') adv = true;
    if (adv) {
      if (d.n < line.text.length) d.n = line.text.length;
      else {
        d.i++; d.n = 0;
        if (d.i >= d.lines.length) {
          this.dialog = null;
          if (d.cb) d.cb();
        }
      }
    }
  }
  run(genFn) { this.scripts.push({ gen: genFn(this), wait: 0 }); }
  stepScripts(dt) {
    for (const s of this.scripts) {
      if (s.done) continue;
      if (s.wait > 0) { s.wait -= dt; continue; }
      if (s.dlgWait) { if (this.dialog) continue; s.dlgWait = false; }
      if (s.until) { if (!s.until()) continue; s.until = null; }
      const r = s.gen.next();
      if (r.done) { s.done = true; continue; }
      const v = r.value;
      if (typeof v === 'number') s.wait = v;
      else if (v && v.dlg) { this.say(v.dlg); s.dlgWait = true; }
      else if (v && v.until) s.until = v.until;
    }
    this.scripts = this.scripts.filter((s) => !s.done);
  }
  event(name) {
    const evs = this.def.events || {};
    if (name === 'boss') { const b = this.bosses.find((x) => !x.dead && !x.active); if (b && !this.bossActive) this.startBoss(b); return; }
    if (evs[name]) evs[name](this);
    else if (name.startsWith('crystal_')) this.say('crystal');
    else if (name === 'water_electrified' && this.def.id >= '2-6') this.toast(T('t_elecwater'));
  }

  // ----------- jefes -----------
  startBoss(b) {
    this.bossActive = b;
    if (b.arena) {
      this.arena = { x0: b.arena[0], x1: b.arena[1] };
      for (const x of [b.arena[0], b.arena[1]]) for (let y = 0; y < this.h; y++) if (this.tile(x, y) === ' ') this.setTile(x, y, 'X');
    }
    Sfx.music(this.def.bossMusic || 'boss');
    Save.see(b.nameKey);
    b.homeX = b.x; b.homeY = b.y;
    if (b.seal) { const [sx, syb, sw] = b.seal; for (let i = 0; i < sw; i++) this.setTile(sx + i, this.h - 1 - syb, 'B'); }
    // Si mueres durante la pelea, reapareces dentro y la pelea se reinicia
    if (!b.noReset) {
      const p = this.player;
      if (b.arena) { p.checkX = (b.arena[0] + 3) * TILE + 16; p.checkY = p.y - 4; }
      else { p.checkX = p.x; p.checkY = p.y - 4; }
    }
    this.bossHurt = false; this.bossT = 0;
    const go = () => { b.active = true; };
    if (b.intro) this.say(b.intro, go); else go();
  }
  resetBoss() {
    const b = this.bossActive;
    if (!b || b.noReset) return;
    b.hp = b.maxHp; b.x = b.homeX; b.y = b.homeY; b.vx = b.vy = 0; b.flash = 0; b.frozen = 0; b.inv = 1;
    if (b.state) { b.state = b instanceof Imperialista ? 'float' : 'idle'; b.st = 1.5; b.diveT = 0; }
    if (b.lasers) b.lasers = [];
    this.bossHurt = false; this.bossT = 0;
    for (const e of this.ents) {
      if (e.isEnemy && !e.boss) e.dead = true;
      if ((e instanceof Bullet && e.enemy) || e instanceof Shockwave || e instanceof Piranha) e.dead = true;
    }
    this.toast(T('t_bossRetry'));
  }
  endBoss(b) {
    this.bossActive = null;
    if (!this.bossHurt) PG.unlock('untouchable');
    if (b instanceof Imperialista) { const s = Math.max(1, Math.round(this.bossT)); if (!Save.data.bossBest || s < Save.data.bossBest) Save.data.bossBest = s; Save.write(); }
    if (b.arena) for (let y = 0; y < this.h; y++) for (let x = 0; x < this.w; x++) if (this.tiles[y][x] === 'X') this.tiles[y][x] = ' ';
    this.arena = null;
    for (let i = 0; i < 5; i++) setTimeout(() => this.explode(b.x + rand(-b.r, b.r), b.y + rand(-b.r, b.r), 30, false), i * 150);
    for (const e of this.ents) if (e.isEnemy && !e.boss) e.hurt(99);
    for (const e of this.ents) if (e instanceof Bullet && e.enemy) e.dead = true;
    Sfx.music(this.def.music);
    const after = () => { if (b.ev) this.event(b.ev); };
    if (b.outro) this.say(b.outro, after); else after();
  }

  reachGoal(goal) {
    if (this.state !== 'play') return;
    this.state = 'clear';
    this.player.goalAnim = 0.01; this.player.x = goal.x; this.player.vx = 0;
    Sfx.stopMusic(); Sfx.play('clear');
    const finish = () => { if (this.onFinish) this.onFinish(this.result()); };
    setTimeout(() => {
      if (this.def.outro) this.say(this.def.outro, finish);
      else finish();
    }, 1400);
  }
  finish() {
    if (this.state === 'clear') return;
    this.state = 'clear'; Sfx.stopMusic(); Sfx.play('clear');
    setTimeout(() => { if (this.onFinish) this.onFinish(this.result()); }, 1200);
  }
  result() {
    const allCoins = this.coinTotal > 0 && !this.ents.some((e) => e instanceof Coin && e.placed && !e.dead);
    return { id: this.def.id, coins: this.coins, coinTotal: this.coinTotal, allCoins, choked: !!this.chokedOnce, time: Math.ceil((this.def.time || 400) - this.time), deaths: this.deaths, kills: this.kills };
  }

  // ----------- actualización -----------
  update(dt) {
    this.t += dt;
    if (this.titleT > 0 && !this.dialog) this.titleT -= dt;
    this.vw = VW / (this.preview ? 1 : ZOOM); this.vh = VH / (this.preview ? 1 : ZOOM);
    if (this.preview) {
      this.cam.x += 60 * dt;
      if (this.cam.x > this.w * TILE - this.vw) this.cam.x = 0;
      this.cam.y = Math.max(0, this.h * TILE - this.vh);
      for (const e of this.ents) e.update(dt);
      return;
    }
    this.stepScripts(dt);
    if (this.dialog) { this.updateDialog(dt); this.updateParts(dt); return; }
    if (this.state === 'play') {
      this.time -= dt;
      if (this.bossActive && this.bossActive.active) this.bossT += dt;
      if (this.time <= 0) { this.time = 0; this.state = 'timeup'; Sfx.stopMusic(); Sfx.play('die'); setTimeout(() => this.onRestart && this.onRestart(), 2200); }
    }
    if (this.portalCool > 0) this.portalCool -= dt;
    for (const e of this.ents) if (e.platform) e.update(dt);
    this.player.update(dt);
    // Durante una pelea de jefe nadie sale de la arena (ni escalando la barrera)
    if (this.arena && this.bossActive) {
      const lo = (this.arena.x0 + 1) * TILE, hi = this.arena.x1 * TILE;
      const p = this.player;
      if (!p.dying) { if (p.x < lo + p.hw) { p.x = lo + p.hw; p.vx = Math.max(0, p.vx); } if (p.x > hi - p.hw) { p.x = hi - p.hw; p.vx = Math.min(0, p.vx); } }
      const b = this.bossActive;
      if (!(b instanceof Imperialista)) b.x = clamp(b.x, lo + b.hw, hi - b.hw);
    }
    if (this.companion) this.companion.update(dt);
    const cx = this.cam.x + this.vw / 2;
    for (let i = 0; i < this.ents.length; i++) {
      const e = this.ents[i];
      if (e.platform || e.dead) continue;
      if (!e.boss && !(e instanceof Bullet) && !(e instanceof Piranha) && Math.abs(e.x - cx) > this.vw * 1.2) continue;
      e.update(dt);
    }
    this.ents = this.ents.filter((e) => !e.dead || (e.boss && e === this.bossActive));
    // puertas con llave
    if (this.hasKey) {
      const p = this.player, tx = Math.floor(p.x / TILE), ty = Math.floor(p.y / TILE);
      for (let dx = -1; dx <= 1; dx++) for (let dy = -1; dy <= 1; dy++) if (this.tile(tx + dx, ty + dy) === 'k') this.openDoor(tx + dx, ty + dy);
    }
    // jefes
    for (const b of this.bosses) {
      if (!b.dead && !b.active && !this.bossActive && b.arena && !b.trig && this.player.x > (b.arena[0] + 2) * TILE && this.player.x < b.arena[1] * TILE) this.startBoss(b);
      if (!b.dead && !b.active && !b.arena && !b.trig && !this.bossActive && Math.abs(this.player.x - b.x) < 450) this.startBoss(b);
    }
    if (this.bossActive && this.bossActive.dead) { const b = this.bossActive; this.ents = this.ents.filter((e) => e !== b); this.endBoss(b); }
    // agua electrificada
    for (const [k, v] of this.elec) { if (v - dt <= 0) this.elec.delete(k); else this.elec.set(k, v - dt); }
    this.updateParts(dt);
    for (const t of this.toasts) t.t -= dt;
    this.toasts = this.toasts.filter((t) => t.t > 0);
    if (this.flash > 0) this.flash -= dt;
    this.updateCam(dt);
  }
  openDoor(tx, ty) {
    const stack = [[tx, ty]];
    while (stack.length) {
      const [x, y] = stack.pop();
      if (this.tile(x, y) !== 'k') continue;
      this.setTile(x, y, ' '); this.puff(x * TILE + 16, y * TILE + 16, '#c9a227', 5, 80);
      stack.push([x + 1, y], [x - 1, y], [x, y + 1], [x, y - 1]);
    }
    Sfx.play('key'); this.hasKey = false;
  }
  updateParts(dt) {
    for (const p of this.parts) { p.life -= dt; p.vy += p.g * dt; p.x += p.vx * dt; p.y += p.vy * dt; }
    this.parts = this.parts.filter((p) => p.life > 0);
    if (this.parts.length > 600) this.parts.splice(0, this.parts.length - 600);
  }
  updateCam(dt) {
    const p = this.player;
    const vw = this.vw;
    let tx = p.x - vw / 2 + p.dir * 50, ty = this.camYFor(p.y);
    let minX = 0, maxX = this.w * TILE - vw;
    if (this.arena) {
      const ax0 = this.arena.x0 * TILE, ax1 = (this.arena.x1 + 1) * TILE;
      if (ax1 - ax0 <= vw) { minX = maxX = (ax0 + ax1) / 2 - vw / 2; } else { minX = ax0; maxX = ax1 - vw; }
    }
    tx = clamp(tx, minX, Math.max(minX, maxX));
    if (this.w * TILE < vw) tx = (this.w * TILE - vw) / 2;
    const k = 1 - Math.exp(-dt * 7);
    this.cam.x = lerp(this.cam.x, tx, k);
    this.cam.y = lerp(this.cam.y, ty, 1 - Math.exp(-dt * 5));
    if (this.shakeA > 0) this.shakeA = Math.max(0, this.shakeA - dt * 30);
  }

  // ----------- dibujo -----------
  draw(ctx, S) {
    const cam = this.cam;
    const sx = this.shakeA ? rand(-this.shakeA, this.shakeA) : 0, sy = this.shakeA ? rand(-this.shakeA, this.shakeA) : 0;
    const blur = !this.preview && this.player.choked;
    BG.draw(ctx, this.theme, cam.x, cam.y, this.t, this.h);
    ctx.save();
    const z = this.preview ? 1 : ZOOM;
    ctx.scale(z, z);
    ctx.translate(-cam.x + sx, -cam.y + sy);
    for (const e of this.ents) if (e.back) e.draw(ctx);
    this.drawTiles(ctx, S * z, false);
    for (const e of this.ents) if (!e.back && !(e instanceof Bullet)) e.draw(ctx);
    if (!this.preview) {
      if (this.companion) this.companion.draw(ctx);
      this.player.draw(ctx);
    }
    for (const e of this.ents) if (e instanceof Bullet) e.draw(ctx);
    this.drawParts(ctx);
    this.drawTiles(ctx, S * z, true);
    ctx.restore();
    if (this.player && this.player.smoke > 0.5 && !this.preview) {
      // niebla gris (barata) + bordes oscuros cuando te ahogas; sin filtros de desenfoque
      ctx.fillStyle = `rgba(60,60,60,${Math.min(0.4, this.player.smoke * 0.1)})`; ctx.fillRect(0, 0, VW, VH);
      if (blur) {
        if (!this.vign || this.vign.w !== VW) {
          const g = ctx.createRadialGradient(VW / 2, VH / 2, VH * 0.25, VW / 2, VH / 2, VW * 0.65);
          g.addColorStop(0, 'rgba(30,30,30,0)'); g.addColorStop(1, 'rgba(30,30,30,0.85)');
          this.vign = { g, w: VW };
        }
        ctx.fillStyle = this.vign.g; ctx.fillRect(0, 0, VW, VH);
      }
    }
    if (this.flash > 0) { ctx.fillStyle = `rgba(255,255,255,${Math.min(0.8, this.flash * 2)})`; ctx.fillRect(0, 0, VW, VH); }
  }
  drawTiles(ctx, S, overlay) {
    const T = TileCache.get(this.theme, S);
    const x0 = Math.max(0, Math.floor(this.cam.x / TILE) - 1), x1 = Math.min(this.w - 1, Math.ceil((this.cam.x + this.vw) / TILE) + 1);
    const y0 = Math.max(0, Math.floor(this.cam.y / TILE) - 1), y1 = Math.min(this.h - 1, Math.ceil((this.cam.y + this.vh) / TILE) + 1);
    const th = THEMES[this.theme];
    if (!overlay) {
      ctx.beginPath();
      const edges = [];
      for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) {
        const c = this.tiles[y][x];
        if (c === ' ') continue;
        const px = x * TILE, py = y * TILE;
        switch (c) {
          case '#': ctx.drawImage(SOLID[this.tile(x, y - 1)] || y === 0 ? T.fill : T.top, px, py, TILE, TILE); break;
          case 'B': ctx.drawImage(T.block, px, py, TILE, TILE); break;
          case 'F': ctx.drawImage(SOLID[this.tile(x, y - 1)] ? T.fill : T.top, px, py, TILE, TILE); break;
          case 'D': ctx.drawImage(T.deck, px, py, TILE, TILE); break;
          case '=': ctx.drawImage(T.plat, px, py, TILE, TILE); break;
          case '^': ctx.drawImage(T.spikes, px, py, TILE, TILE); break;
          case 'k': ctx.drawImage(T.door, px, py, TILE, TILE); break;
          case '*': BG.flames(ctx, px + 16, py + TILE, 30, 30, this.t + x); break;
          case 'L': {
            ctx.fillStyle = '#e8401c'; ctx.fillRect(px, py, TILE, TILE);
            if (this.tile(x, y - 1) !== 'L') {
              ctx.fillStyle = '#ffb030';
              ctx.beginPath(); ctx.moveTo(px, py + 8);
              for (let i = 0; i <= 4; i++) ctx.lineTo(px + i * 8, py + 5 + Math.sin(this.t * 4 + x * 1.3 + i) * 3);
              ctx.lineTo(px + TILE, py + 12); ctx.lineTo(px, py + 12); ctx.fill();
              if (hash1(x * 7 + Math.floor(this.t * 2)) > 0.8) { ctx.fillStyle = '#ffe14d'; ctx.beginPath(); ctx.arc(px + 16, py + 10 - ((this.t * 20) % 10), 3, 0, TAU); ctx.fill(); }
            }
            break;
          }
          case 'X': {
            ctx.fillStyle = `rgba(255,40,80,${0.35 + Math.sin(this.t * 8 + y) * 0.15})`; ctx.fillRect(px + 8, py, 16, TILE);
            ctx.strokeStyle = '#ff6a8a'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(px + 16 + Math.sin(this.t * 20 + y) * 5, py); ctx.lineTo(px + 16 - Math.sin(this.t * 20 + y) * 5, py + TILE); ctx.stroke();
            break;
          }
        }
        if (SOLID[c] && c !== 'X') edges.push(x, y);
      }
      // contorno negro estilo caricatura
      ctx.strokeStyle = 'rgba(0,0,0,0.85)'; ctx.lineWidth = 2;
      ctx.beginPath();
      for (let i = 0; i < edges.length; i += 2) {
        const x = edges[i], y = edges[i + 1], px = x * TILE, py = y * TILE;
        const s = (dx, dy) => { const c = this.tile(x + dx, y + dy); return (SOLID[c] && c !== 'X') || c === 'F'; };
        if (!s(0, -1)) { ctx.moveTo(px, py + 1); ctx.lineTo(px + TILE, py + 1); }
        if (!s(0, 1) && y < this.h - 1) { ctx.moveTo(px, py + TILE - 1); ctx.lineTo(px + TILE, py + TILE - 1); }
        if (!s(-1, 0) && x > 0) { ctx.moveTo(px + 1, py); ctx.lineTo(px + 1, py + TILE); }
        if (!s(1, 0) && x < this.w - 1) { ctx.moveTo(px + TILE - 1, py); ctx.lineTo(px + TILE - 1, py + TILE); }
      }
      ctx.stroke();
    } else {
      for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) {
        const c = this.tiles[y][x];
        const px = x * TILE, py = y * TILE;
        if (c === 'W') {
          const el = this.elec.has(y * this.w + x);
          ctx.fillStyle = el ? `rgba(200,255,255,${0.5 + Math.random() * 0.3})` : th.water;
          const top = this.tile(x, y - 1) !== 'W';
          const wy = top ? py + 6 + Math.sin(this.t * 3 + x * 0.8) * 2 : py;
          ctx.fillRect(px, wy, TILE, py + TILE - wy);
          if (top) { ctx.fillStyle = 'rgba(255,255,255,0.6)'; ctx.fillRect(px, wy, TILE, 2); }
          if (el && Math.random() < 0.25) { ctx.strokeStyle = '#fffb7a'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(px + rand(0, 32), py + rand(0, 32)); ctx.lineTo(px + rand(0, 32), py + rand(0, 32)); ctx.stroke(); }
        } else if (c === 'Z' && (x + y) % 2 === 0) {
          ctx.fillStyle = 'rgba(70,70,75,0.4)';
          const k = ((x * 13 + y * 7) % 10) / 10;
          ctx.beginPath(); ctx.arc(px + 16 + Math.sin(this.t + k * 6) * 8, py + 16 + Math.cos(this.t * 0.7 + k * 6) * 6, 22 + k * 8, 0, TAU); ctx.fill();
        }
      }
    }
  }
  drawParts(ctx) {
    for (const p of this.parts) {
      ctx.globalAlpha = clamp(p.life / p.max, 0, 1);
      ctx.fillStyle = p.col;
      if (p.bolt) { ctx.strokeStyle = p.col; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x - p.vx * 0.04, p.y - p.vy * 0.04); ctx.stroke(); }
      else if (p.star) Art.star(ctx, p.x, p.y, p.size + 1);
      else { ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, TAU); ctx.fill(); }
    }
    ctx.globalAlpha = 1;
  }

  drawHUD(ctx) {
    if (this.preview) return;
    const p = this.player;
    // corazones
    for (let i = 0; i < p.maxHp; i++) Art.heart(ctx, 26 + i * 30, 28, 24, i < p.hp ? '#ff2d55' : 'rgba(0,0,0,0.35)', '#000');
    // monedas
    Art.coin(ctx, 30, 62, 0, 11);
    outlinedText(ctx, `${this.coins}/${this.coinTotal}`, 48, 63, 18, '#fff', '#000', 'left');
    // arma
    const W = WEAPONS[p.weapon];
    ctx.save(); ctx.translate(18, 92); Art.gun(ctx, W.gun, 22, 1, {}); ctx.restore();
    outlinedText(ctx, T('w_' + p.weapon), 48, 96, 13, '#fff', '#000', 'left', 700);
    let yy = 120;
    if (p.shield > 0) { outlinedText(ctx, `${T('t_shieldShort')} ${Math.ceil(p.shield)}`, 14, yy, 14, '#7ff8ff', '#000', 'left'); yy += 22; }
    if (this.hasKey) { drawKey(ctx, 26, yy, '#ffd23a'); yy += 24; }
    if (p.st.fly && !p.onGround && p.fuel < 1) {
      ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fillRect(14, yy, 100, 10);
      ctx.fillStyle = p.charId === 'electrico' ? '#7ff8ff' : '#ff9500'; ctx.fillRect(14, yy, Math.max(0, p.fuel) * 100, 10);
      outlinedText(ctx, T('t_fly'), 120, yy + 5, 12, '#ddd', '#000', 'left', 700); yy += 18;
    }
    if (p.smoke > 0.2) {
      ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fillRect(14, yy, 100, 10);
      ctx.fillStyle = p.choked ? '#ff4d4d' : '#9a9a9a'; ctx.fillRect(14, yy, Math.min(100, (p.smoke / 2.6) * 100), 10);
      outlinedText(ctx, T('t_smoke'), 120, yy + 5, 12, '#ddd', '#000', 'left', 700);
    }
    // tiempo
    const low = this.time < 60;
    outlinedText(ctx, `⏱ ${fmtTime(this.time)}`, VW / 2, 26, 22, low && Math.floor(this.t * 4) % 2 ? '#ff4d4d' : '#fff');
    // jefe
    const b = this.bossActive;
    if (b && b.active) {
      const w = Math.min(420, VW * 0.5), x = VW / 2 - w / 2, y = 52;
      ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(x - 3, y - 3, w + 6, 18);
      ctx.fillStyle = '#ff2d55'; ctx.fillRect(x, y, w * Math.max(0, b.hp / b.maxHp), 12);
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.strokeRect(x - 3, y - 3, w + 6, 18);
      outlinedText(ctx, T('n_' + b.nameKey), VW / 2, y + 30, 15, '#fff');
    }
    // nombre del nivel al empezar
    if (this.titleT > 0 && !this.dialog) {
      ctx.globalAlpha = Math.min(1, this.titleT);
      outlinedText(ctx, `${this.def.id}  ·  ${T('lv_' + this.def.id)}`, VW / 2, VH * 0.3, 34, '#ffe14d');
      ctx.globalAlpha = 1;
    }
    // avisos
    this.toasts.forEach((t, i) => { ctx.globalAlpha = Math.min(1, t.t * 2); outlinedText(ctx, t.text, VW / 2, 92 + i * 28, 18, '#fff'); });
    ctx.globalAlpha = 1;
    if (this.state === 'timeup') { ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fillRect(0, 0, VW, VH); outlinedText(ctx, T('t_timeup'), VW / 2, VH / 2, 48, '#ff4d4d'); }
    if (this.dialog) this.drawDialog(ctx);
  }
  drawDialog(ctx) {
    const d = this.dialog, line = d.lines[d.i];
    const w = Math.min(VW - 40, 760), h = 124, x = (VW - w) / 2, y = VH - h - 16;
    ctx.save();
    ctx.fillStyle = 'rgba(10,14,30,0.92)'; ctx.strokeStyle = '#fff'; ctx.lineWidth = 3;
    roundRect(ctx, x, y, w, h, 14); ctx.fill(); ctx.stroke();
    const P = PORTRAITS[line.who];
    let tx = x + 20;
    if (P) {
      ctx.fillStyle = 'rgba(255,255,255,0.08)'; ctx.beginPath(); ctx.arc(x + 62, y + h / 2, 46, 0, TAU); ctx.fill();
      Art.ball(ctx, x + 62, y + h / 2 + 6, 34, P[0], { expr: line.expr, acc: P[1], t: this.t, phi: 0.25, blink: (this.t % 3.5) < 0.1 });
      tx = x + 122;
    }
    outlinedText(ctx, T('n_' + line.who), tx, y + 20, 17, P ? P[2] : '#ffe14d', '#000', 'left');
    setFont(ctx, 17, 600); ctx.fillStyle = '#fff'; ctx.textAlign = 'left'; ctx.textBaseline = 'top';
    const lines = wrapText(ctx, line.text.slice(0, Math.floor(d.n)), x + w - tx - 20);
    lines.slice(0, 4).forEach((l, i) => ctx.fillText(l, tx, y + 38 + i * 21));
    if (d.n >= line.text.length) { outlinedText(ctx, '▼', x + w - 24, y + h - 18 + Math.sin(this.t * 6) * 3, 14, '#ffe14d'); }
    ctx.restore();
  }
}

// Retratos para los diálogos: [tipo de bola, accesorios, color del nombre]
const PORTRAITS = {
  chulin: ['chulin', [], '#4fb8ff'], electrico: ['electrico', [], '#7ff8ff'], mexicano: ['mexicano', [], '#adff6a'],
  secuaz: ['secuaz', [], '#ff6a6a'], guard: ['secuaz', [], '#ff6a6a'], gigante: ['secuaz', [], '#ff6a6a'],
  jefe: ['secuaz', ['police'], '#ff6a6a'], militarOp: ['secuaz', ['general'], '#ff6a6a'], acuatico: ['secuaz', ['goggles'], '#ff6a6a'],
  volador: ['secuaz', ['jetpack'], '#ff6a6a'], imperialista: ['secuaz', ['crown'], '#ffc300'],
  aldeano: ['aldeano', [], '#ffffff'], alcalde: ['aldeano', ['mayor'], '#ffe14d'], militar: ['aldeano', ['military', 'cuffs'], '#8fdc7a'],
  general: ['aldeano', ['general'], '#8fdc7a'], militarLibre: ['aldeano', ['military'], '#8fdc7a'], playista: ['aldeano', ['sunglasses'], '#ffd27a'], esclavo: ['aldeano', ['cuffs'], '#dddddd'],
  narrador: null,
};

</script>
<script>/* js/entities.js */
// Entidades: jugador, compañero, objetos, trampas, plataformas, NPCs.
'use strict';

const GRAV = 1900, MAXFALL = 820;

class Ent {
  constructor(x, y, hw, hh) {
    this.x = x; this.y = y; this.hw = hw; this.hh = hh;
    this.vx = 0; this.vy = 0; this.dead = false; this.t = 0;
    this.onGround = false; this.hitWall = 0;
  }
  update(dt) { this.t += dt; }
  draw(ctx) {}
  near(e, d) { return Math.abs(e.x - this.x) < d && Math.abs(e.y - this.y) < d; }
}

// ======================= Jugador =======================
class Player extends Ent {
  constructor(x, y, charId) {
    super(x, y, 12, 14);
    this.setChar(charId);
    this.dir = 1; this.phi = 1.15; this.idle = 0;
    this.jbuf = 0; this.coyote = 0; this.jumps = 0; this.lock = 0;
    this.inv = 0; this.cd = 0; this.melee = 0; this.meleeCd = 0;
    this.smoke = 0; this.choked = false; this.shield = 0; this.fuel = 1;
    this.sq = 0; this.spin = 0; this.shootT = 0; this.hurtT = 0; this.blinkT = 2;
    this.dying = 0; this.ride = null; this.wall = 0; this.goalAnim = 0; this.happyT = 0;
    this.checkX = x; this.checkY = y;
  }
  setChar(id) {
    this.charId = id;
    this.st = PLAYABLE[id];
    this.maxHp = this.st.hp; this.hp = this.maxHp;
    this.hw = this.st.hw || 12; this.hh = this.st.hh || 14;
    this.weapons = [this.st.weapon];
    const sw = Save.data.weapon || 'pistol';
    if (sw !== 'pistol' && !this.weapons.includes(sw)) this.weapons.push(sw);
    if (this.st.family && G && G.abil.elec && !this.weapons.includes('elec')) this.weapons.push('elec');
    this.wi = 0;
  }
  get weapon() { return this.weapons[this.wi % this.weapons.length]; }
  get r() { return this.st.r || 15; }

  dyingRot() { return (1.6 - this.dying) * 9; }
  hurt(dmg, fromX) {
    if (this.inv > 0 || this.dying || G.state !== 'play') return false;
    if (this.shield > 0) { Sfx.play('shield'); this.inv = 0.4; return false; }
    this.hp -= Math.max(1, Math.round(dmg));
    this.inv = 1.3; this.hurtT = 0.6; G.bossHurt = true;
    this.vy = -360; this.vx = (this.x < (fromX ?? this.x - this.dir) ? -1 : 1) * 260; this.lock = 0.18;
    Sfx.play('hurt'); G.shake(5);
    if (this.hp <= 0) this.die();
    return true;
  }
  die() {
    if (this.dying) return;
    this.dying = 1.6; this.hp = 0; this.vy = -560; this.vx = 0;
    Sfx.play('die'); G.deaths++; Save.data.deaths++;
  }
  respawn() {
    this.dying = 0; this.hp = this.maxHp; this.inv = 1.5; this.spin = 0; this.sq = 0; this.goalAnim = 0;
    this.x = this.checkX; this.y = this.checkY; this.vx = this.vy = 0;
    if (G.bossActive) G.resetBoss();
    this.smoke = 0; this.choked = false;
    if (G.companion) { G.companion.x = this.x - 30; G.companion.y = this.y; }
  }

  update(dt) {
    this.t += dt;
    const I = Input;
    if (this.dying) {
      this.dying -= dt; this.vy += GRAV * dt; this.y += this.vy * dt;
      if (this.dying <= 0) this.respawn();
      return;
    }
    if (this.goalAnim) { this.goalAnim += dt; this.vx = 0; this.vy += GRAV * dt; G.moveBody(this, dt); return; }
    const ctl = G.state === 'play';
    if (this.ride && !this.ride.dead) { this.x += this.ride.dx; this.y += this.ride.dy; }
    const inWater = G.waterAt(this.x, this.y + 4);
    if (inWater && !this.wasWater && this.vy > 200) { Sfx.play('splash'); G.splash(this.x, this.y); }
    this.wasWater = inWater;

    let L = ctl && I.down('left'), R = ctl && I.down('right');
    if (this.lock > 0) { this.lock -= dt; L = R = false; }
    const want = (R ? 1 : 0) - (L ? 1 : 0);
    const maxV = this.st.speed * (this.choked ? 0.55 : 1) * (inWater ? 0.62 : 1);
    if (want) {
      this.dir = want;
      this.vx = approach(this.vx, want * maxV, (this.onGround ? 2600 : 1700) * dt);
    } else this.vx = approach(this.vx, 0, (this.onGround ? 2800 : 900) * dt);

    if (ctl && I.pressed('jump')) this.jbuf = 0.13; else this.jbuf -= dt;
    this.coyote = this.onGround ? 0.1 : this.coyote - dt;
    if (this.onGround) { this.wjN = 0; this.jumps = this.st.air; this.fuel = Math.min(1, this.fuel + dt * 2); }

    // Paredes
    this.wall = 0;
    if (G.abil.wall && !this.onGround && !inWater) {
      if (G.solidCol(this.x + this.hw + 2, this.y - this.hh + 5, this.y + this.hh - 5)) this.wall = 1;
      else if (G.solidCol(this.x - this.hw - 2, this.y - this.hh + 5, this.y + this.hh - 5)) this.wall = -1;
    }
    const sliding = this.wall && want === this.wall && this.vy > 0;

    let g = GRAV;
    if (inWater) g = 560;
    else if (this.vy < 0 && !(ctl && I.down('jump'))) g *= 2.3;
    this.vy += g * dt;
    if (sliding) { this.vy = Math.min(this.vy, 90); if (Math.random() < 0.3) G.dust(this.x + this.wall * this.hw, this.y + 8); }
    this.vy = Math.min(this.vy, inWater ? 170 : MAXFALL);

    if (this.jbuf > 0) {
      if (inWater) { this.vy = G.waterAt(this.x, this.y - 22) ? -380 : -600; this.jbuf = 0; Sfx.play('splash'); }
      else if (this.coyote > 0) {
        this.vy = -this.st.jump; this.jbuf = 0; this.coyote = 0; this.jumps = this.st.air;
        this.sq = -0.2; Sfx.play('jump'); G.dust(this.x, this.y + this.hh);
      } else if (this.wall) {
        this.vy = -600; this.vx = -this.wall * 310; this.dir = -this.wall; this.lock = 0.13; this.jbuf = 0;
        this.jumps = this.st.air; Sfx.play('walljump'); if (++this.wjN >= 2) PG.unlock('wall'); G.dust(this.x + this.wall * this.hw, this.y);
      } else if (this.jumps > 0) {
        this.vy = -this.st.jump2; this.jumps--; this.jbuf = 0; this.spin = 1; Sfx.play('djump');
        G.puff(this.x, this.y + this.hh, '#ffffff', 6, 80);
      } else if (this.st.fly && this.fuel > 0.05) this.jbuf = 0;
    }
    // Mochila cohete (Secuaz Volador)
    this.flying = false;
    if (this.st.fly && ctl && I.down('jump') && !this.onGround && this.jumps === 0 && this.vy > -100 && this.fuel > 0) {
      this.vy = Math.max(this.vy - 3300 * dt, this.st.flyMax || -240); this.fuel -= dt * (this.st.flyDrain || 0.55); this.flying = true;
      if (Math.random() < 0.5) G.puff(this.x, this.y + this.hh, this.charId === 'electrico' ? '#7ff8ff' : '#ff9500', 1, 40);
    }

    const wasGround = this.onGround;
    G.moveBody(this, dt);
    if (this.onGround && !wasGround) { this.sq = 0.22; }
    this.sq = approach(this.sq, 0, dt * 1.6);
    if (this.spin > 0) this.spin = Math.max(0, this.spin - dt * 3.5);

    // Disparo
    this.cd -= dt; this.shootT -= dt;
    if (ctl && I.pressed('swap') && this.weapons.length > 1) { this.wi = (this.wi + 1) % this.weapons.length; Sfx.play('select'); G.toast(T('w_' + this.weapon)); }
    // Apuntar: con el botón arrastrado, el joystick extra o ↑/↓ en teclado
    const aim = ctl ? I.getAim() : null;
    if (aim && !aim.idle) {
      if (aim.kb) { this.aimX = this.dir * 0.7; this.aimY = aim.y; }
      else { this.aimX = aim.x; this.aimY = aim.y; if (Math.abs(aim.x) > 0.2) this.dir = sign(aim.x); }
    } else { this.aimX = this.dir; this.aimY = 0; }
    this.aiming = !!(aim && !aim.idle);
    if (ctl && (I.down('shoot') || (aim && aim.fire)) && this.cd <= 0) this.fire();
    // Cuerpo a cuerpo
    this.meleeCd -= dt;
    if (this.melee > 0) {
      this.melee -= dt;
      const hb = { x: this.x + this.dir * 26, y: this.y, hw: 22, hh: 18 };
      for (const e of G.ents) {
        if (e.isEnemy && !e.dead && overlap(hb, e) && !this.meleeHit.has(e)) { this.meleeHit.add(e); e.hurt(3, this); }
        if (e instanceof Bullet && e.enemy && overlap(hb, e)) { e.dead = true; G.puff(e.x, e.y, '#fff', 4, 60); }
      }
    }
    if (ctl && G.abil.melee && I.pressed('melee') && this.meleeCd <= 0) {
      this.melee = 0.2; this.meleeCd = 0.38; this.meleeHit = new Set();
      this.vx += this.dir * 170; Sfx.play('melee');
    }

    if (this.inv > 0) this.inv -= dt;
    if (this.hurtT > 0) this.hurtT -= dt;
    if (this.shield > 0) this.shield -= dt;
    if (this.happyT > 0) this.happyT -= dt;
    this.hazards(dt, inWater);

    // Animación: hacia dónde mira
    if (Math.abs(this.vx) > 15 || !this.onGround || this.shootT > 0) this.idle = 0; else this.idle += dt;
    let target = this.dir * 1.15;
    if (this.idle > 0.9) target = 0;
    if (sliding) target = this.wall * 1.15;
    this.phi = approach(this.phi, target, dt * 9);
    this.blinkT -= dt; if (this.blinkT < -0.12) this.blinkT = 2 + Math.random() * 3;
    if (this.y > G.h * TILE + 80) this.die();
  }

  fire() {
    const W = WEAPONS[this.weapon];
    this.cd = W.cd; this.shootT = 0.35;
    const base = Math.atan2(this.aimY || 0, this.aimX || this.dir);
    const x = this.x + Math.cos(base) * (this.r + 6), y = this.y + 4 + Math.sin(base) * (this.r + 2);
    const mk = (ang) => {
      const a = base + ang;
      const b = new Bullet(x, y, Math.cos(a) * W.speed, Math.sin(a) * W.speed, false, W);
      b.owner = this; G.add(b);
    };
    if (W.spread3) { mk(-0.18); mk(0); mk(0.18); }
    else mk(W.spread ? rand(-W.spread, W.spread) : 0);
    Sfx.play(W.sfx);
    if (this.weapon === 'rifle') this.vx -= Math.cos(base) * 20;
  }

  hazards(dt, inWater) {
    const x0 = Math.floor((this.x - this.hw + 2) / TILE), x1 = Math.floor((this.x + this.hw - 2) / TILE);
    const y0 = Math.floor((this.y - this.hh + 2) / TILE), y1 = Math.floor((this.y + this.hh - 1) / TILE);
    let smoke = false;
    for (let ty = y0; ty <= y1; ty++) for (let tx = x0; tx <= x1; tx++) {
      const c = G.tile(tx, ty);
      if (c === '^') { if (this.y + this.hh > ty * TILE + 14) { this.hurt(1, tx * TILE + 16); this.vy = -520; } }
      else if (c === 'L') { if (this.y + this.hh > ty * TILE + 8) { this.hurt(1, this.x - this.dir); this.vy = -780; G.puff(this.x, this.y + 10, '#ff6a00', 10, 160); Sfx.play('fire'); } }
      else if (c === '*') this.hurt(1, tx * TILE + 16);
      else if (c === 'Z') smoke = true;
    }
    if (inWater && G.elecAt(this.x, this.y) && this.charId !== 'electrico') this.hurt(1, this.x);
    if (smoke) this.smoke += dt; else this.smoke = Math.max(0, this.smoke - dt * 0.8);
    if (this.smoke > 2.6) { if (!this.choked) G.toast(T('t_choke')); this.choked = true; G.chokedOnce = true; }
    if (this.smoke < 1) this.choked = false;
  }

  draw(ctx) {
    if (this.inv > 0 && !this.dying && Math.floor(this.t * 20) % 2 === 0) return;
    let expr = 'neutral';
    if (this.dying) expr = 'verysad';
    else if (this.hurtT > 0) expr = 'scared';
    else if (this.choked) expr = 'sad';
    else if (this.happyT > 0 || this.goalAnim) expr = 'happy';
    else if (this.shootT > 0 || this.melee > 0) expr = 'angry';
    else if (this.wall && !this.onGround) expr = 'serious';
    const fam = this.st.family;
    const o = {
      phi: this.goalAnim ? Math.PI : this.phi, expr, blink: this.blinkT < 0 && expr === 'neutral',
      sq: this.sq + (this.onGround && Math.abs(this.vx) > 30 && !this.dying ? Math.sin(this.t * 18) * 0.035 : 0),
      rot: this.dying ? this.dyingRot() : this.spin * TAU * this.dir, t: this.t,
      gun: this.dying ? null : WEAPONS[this.weapon].gun, dir: this.dir, acc: this.st.acc,
      aimAng: this.aiming ? Math.atan2(this.aimY, Math.abs(this.aimX)) : 0,
      skin: fam && this.charId === 'chulin' ? SKINS[Save.data.skin || 'clasico'] : null,
      hat: fam ? (Save.data.hat || 'tophat') : null, face: Save.data.face || 'none',
    };
    if (this.aiming && !this.dying) {
      // línea punteada de mira
      ctx.save(); ctx.strokeStyle = 'rgba(255,255,255,0.7)'; ctx.lineWidth = 2; ctx.setLineDash([5, 6]);
      ctx.beginPath(); ctx.moveTo(this.x + this.aimX * (this.r + 8), this.y + this.aimY * (this.r + 8));
      ctx.lineTo(this.x + this.aimX * 110, this.y + this.aimY * 110); ctx.stroke(); ctx.restore();
    }
    if (this.shield > 0) {
      ctx.save(); ctx.globalAlpha = 0.35 + Math.sin(this.t * 12) * 0.15;
      ctx.strokeStyle = '#7ff8ff'; ctx.lineWidth = 3; ctx.fillStyle = 'rgba(127,248,255,0.25)';
      ctx.beginPath(); ctx.arc(this.x, this.y, 24, 0, TAU); ctx.fill(); ctx.stroke(); ctx.restore();
    }
    Art.ball(ctx, this.x, this.y + this.hh - this.r + 1, this.r, PLAYABLE[this.charId].ball, o);
    if (this.melee > 0) {
      ctx.save(); ctx.strokeStyle = 'rgba(255,255,255,0.9)'; ctx.lineWidth = 4;
      ctx.beginPath(); ctx.arc(this.x + this.dir * 12, this.y, 30, -0.9, 0.9); if (this.dir < 0) { ctx.beginPath(); ctx.arc(this.x - 12, this.y, 30, Math.PI - 0.9, Math.PI + 0.9); }
      ctx.stroke(); ctx.restore();
    }
    if (this.choked) {
      ctx.fillStyle = 'rgba(80,80,80,0.6)';
      for (let i = 0; i < 3; i++) { ctx.beginPath(); ctx.arc(this.x + Math.sin(this.t * 3 + i) * 8, this.y - 26 - ((this.t * 30 + i * 10) % 30), 4 + i, 0, TAU); ctx.fill(); }
    }
  }
}

class Companion extends Ent {
  constructor(x, y, charId) {
    super(x, y, 12, 14);
    this.charId = charId; this.dir = 1; this.phi = 1.15; this.cd = 1; this.talkT = 8 + Math.random() * 6; this.bubble = null;
  }
  update(dt) {
    this.t += dt;
    const p = G.player;
    if (p.dying || G.state !== 'play') { this.vx = 0; }
    const tx = p.x - p.dir * 46;
    const dx = tx - this.x;
    this.vx = Math.abs(dx) > 14 ? sign(dx) * Math.min(260, Math.abs(dx) * 4) : approach(this.vx, 0, 900 * dt);
    if (Math.abs(this.vx) > 10) this.dir = sign(this.vx);
    const inWater = G.waterAt(this.x, this.y);
    this.vy += (inWater ? 560 : GRAV) * dt; this.vy = Math.min(this.vy, inWater ? 170 : MAXFALL);
    if ((this.onGround || inWater) && (p.y < this.y - 50 || (this.hitWall && Math.abs(dx) > 20))) this.vy = inWater ? -360 : -640;
    G.moveBody(this, dt);
    if (dist(this.x, this.y, p.x, p.y) > 380 || this.y > G.h * TILE) {
      this.x = p.x - p.dir * 30; this.y = p.y - 10; this.vx = this.vy = 0;
      G.puff(this.x, this.y, '#ffffff', 8, 90);
    }
    // Dispara al enemigo más cercano
    this.cd -= dt;
    if (this.cd <= 0 && G.state === 'play') {
      let best = null, bd = 360;
      for (const e of G.ents) if (e.isEnemy && !e.dead && e.active !== false) { const d = dist(this.x, this.y, e.x, e.y); if (d < bd && Math.abs(e.y - this.y) < 160) { bd = d; best = e; } }
      if (best) {
        this.dir = sign(best.x - this.x) || 1;
        const a = Math.atan2(best.y - this.y, best.x - this.x);
        const W = WEAPONS[this.charId === 'mexicano' ? 'rifle' : 'pistol'];
        const b = new Bullet(this.x + this.dir * 18, this.y + 4, Math.cos(a) * W.speed, Math.sin(a) * W.speed, false, W);
        b.dmgMul = 0.6; G.add(b); Sfx.play(W.sfx);
        this.cd = 0.75; this.shootT = 0.3;
      } else this.cd = 0.25;
    }
    if (this.shootT > 0) this.shootT -= dt;
    // Comentarios
    this.talkT -= dt;
    if (this.talkT <= 0) {
      this.talkT = 14 + Math.random() * 12;
      const n = this.charId === 'mexicano' ? 10 : 6;
      this.bubble = { text: T((this.charId === 'mexicano' ? 'mx_' : 'ch_') + Math.floor(Math.random() * n)), t: 3.2 };
    }
    if (this.bubble) { this.bubble.t -= dt; if (this.bubble.t <= 0) this.bubble = null; }
    this.phi = approach(this.phi, Math.abs(this.vx) > 10 || !this.onGround ? this.dir * 1.15 : 0, dt * 8);
  }
  draw(ctx) {
    const st = PLAYABLE[this.charId];
    Art.ball(ctx, this.x, this.y + 1, 15, st.ball, {
      sq: this.onGround && Math.abs(this.vx) > 30 ? Math.sin(this.t * 18) * 0.035 : 0,
      phi: this.phi, expr: this.shootT > 0 ? 'angry' : 'happy', gun: WEAPONS[st.weapon].gun, dir: this.dir, t: this.t,
    });
    if (this.bubble) drawBubble(ctx, this.x, this.y - 34, this.bubble.text);
  }
}

function drawBubble(ctx, x, y, text, maxW = 200) {
  setFont(ctx, 13, 700);
  const lines = wrapText(ctx, text, maxW);
  const w = Math.min(maxW, Math.max(...lines.map((l) => ctx.measureText(l).width))) + 16, h = lines.length * 16 + 10;
  ctx.save();
  ctx.fillStyle = '#fff'; ctx.strokeStyle = '#000'; ctx.lineWidth = 2;
  roundRect(ctx, x - w / 2, y - h, w, h, 8); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x - 6, y - 1); ctx.lineTo(x, y + 8); ctx.lineTo(x + 6, y - 1); ctx.fill();
  ctx.beginPath(); ctx.moveTo(x - 6, y); ctx.lineTo(x, y + 8); ctx.lineTo(x + 6, y); ctx.stroke();
  ctx.fillStyle = '#111'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  lines.forEach((l, i) => ctx.fillText(l, x, y - h + 13 + i * 16));
  ctx.restore();
}

// ======================= Proyectiles =======================
class Bullet extends Ent {
  constructor(x, y, vx, vy, enemy, W) {
    super(x, y, W.r || 5, W.r || 5);
    this.vx = vx; this.vy = vy; this.enemy = enemy; this.W = W;
    this.dmg = W.dmg; this.life = W.life || 1.4; this.grav = W.grav || 0; this.hits = new Set(); this.dmgMul = 1;
  }
  update(dt) {
    this.t += dt; this.life -= dt;
    if (this.W.boomerang) {
      if (this.t > 0.35) { const p = this.owner || G.player; const a = Math.atan2(p.y - this.y, p.x - this.x); this.vx = lerp(this.vx, Math.cos(a) * 640, dt * 6); this.vy = lerp(this.vy, Math.sin(a) * 640, dt * 6); if (this.t > 0.5 && dist(this.x, this.y, p.x, p.y) < 20) this.dead = true; }
    }
    this.vy += this.grav * dt;
    this.x += this.vx * dt; this.y += this.vy * dt;
    if (this.life <= 0) { this.dead = true; return; }
    const tx = Math.floor(this.x / TILE), ty = Math.floor(this.y / TILE);
    const c = G.tile(tx, ty);
    if (this.W.elec && c === 'W') { G.electrify(tx, ty); this.dead = true; G.zap(this.x, this.y); return; }
    if (!this.W.boomerang && G.isSolid(tx, ty)) {
      this.dead = true; G.puff(this.x, this.y, this.W.col, 4, 70);
      if (this.W.elec) G.zap(this.x, this.y);
      if (this.W.explode) G.explode(this.x, this.y, this.W.explode, this.enemy);
      return;
    }
    if (this.enemy) {
      const p = G.player;
      if (!p.dying && overlap(this, p)) { this.dead = true; p.hurt(this.dmg, this.x); }
    } else {
      for (const e of G.ents) {
        if (!e.isEnemy || e.dead || this.hits.has(e) || e.active === false) continue;
        if (overlap(this, e)) {
          this.hits.add(e);
          const hit = e.hurt(this.dmg * this.dmgMul, this);
          if (hit !== false) {
            if (this.W.freeze) e.frozen = this.W.freeze;
            if (this.W.knock && !e.boss) e.vx += sign(this.vx) * this.W.knock;
            if (this.W.elec) G.zap(this.x, this.y);
          }
          if (!this.W.pierce && !this.W.boomerang) { this.dead = true; break; }
        }
      }
      // objetos que reaccionan a disparos (llave cortada)
      for (const e of G.ents) if (e.onShot && !e.dead && overlap(this, e)) { e.onShot(this); this.dead = true; }
    }
  }
  draw(ctx) {
    const W = this.W;
    ctx.save(); ctx.translate(this.x, this.y);
    if (W.kind === 'fireball' || W.kind === 'purple') {
      const col = W.kind === 'purple' ? ['#b04dff', '#e6b3ff'] : ['#ff5a00', '#ffe14d'];
      ctx.fillStyle = col[0]; ctx.beginPath(); ctx.arc(0, 0, this.hw + 2, 0, TAU); ctx.fill();
      ctx.fillStyle = col[1]; ctx.beginPath(); ctx.arc(0, 0, this.hw * 0.55, 0, TAU); ctx.fill();
      if (Math.random() < 0.4) G.puff(this.x, this.y, col[0], 1, 20);
    } else if (W.boomerang) {
      ctx.rotate(this.t * 18); ctx.fillStyle = W.col; ctx.strokeStyle = '#000'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(-9, 6); ctx.lineTo(0, -8); ctx.lineTo(9, 6); ctx.lineTo(4, 7); ctx.lineTo(0, -1); ctx.lineTo(-4, 7); ctx.closePath(); ctx.fill(); ctx.stroke();
    } else if (W.elec) {
      ctx.strokeStyle = '#fffb7a'; ctx.lineWidth = 3; ctx.beginPath();
      for (let i = 0; i < 5; i++) ctx.lineTo(-sign(this.vx) * i * 5, (Math.random() - 0.5) * 10);
      ctx.stroke(); ctx.fillStyle = '#7ff8ff'; ctx.beginPath(); ctx.arc(0, 0, 6, 0, TAU); ctx.fill();
      ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(0, 0, 3, 0, TAU); ctx.fill();
    } else if (W.gun === 'laser') {
      ctx.rotate(Math.atan2(this.vy, this.vx)); ctx.fillStyle = W.col; ctx.fillRect(-14, -2.5, 28, 5); ctx.fillStyle = '#fff'; ctx.fillRect(-12, -1, 24, 2);
    } else if (W.gun === 'confetti') {
      ctx.rotate(this.t * 10); ctx.fillStyle = ['#ff5ad0', '#ffe14d', '#4ad3ff', '#6bff6b'][Math.floor(this.x) % 4]; ctx.fillRect(-4, -3, 8, 6);
    } else {
      ctx.fillStyle = '#000'; ctx.beginPath(); ctx.arc(0, 0, this.hw + 1.5, 0, TAU); ctx.fill();
      ctx.fillStyle = W.col; ctx.beginPath(); ctx.arc(0, 0, this.hw, 0, TAU); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.7)'; ctx.beginPath(); ctx.arc(-this.hw * 0.3, -this.hw * 0.3, this.hw * 0.35, 0, TAU); ctx.fill();
    }
    ctx.restore();
  }
}
const EBULLET = { dmg: 1, r: 5, col: '#3aa0ff', life: 3 };

// Plataforma móvil (se puede pisar desde arriba)
class MPlat extends Ent {
  constructor(x, y, w = 3, axis = 'x', range = 4, speed = 1, style = 'tech') {
    super(x + (w * TILE) / 2 - TILE / 2, y - TILE / 2 + 6, (w * TILE) / 2, 6);
    this.ox = this.x; this.oy = this.y; this.axis = axis; this.range = range * TILE; this.speed = speed; this.style = style;
    this.dx = 0; this.dy = 0; this.platform = true; this.ph = 0;
    this.fall = false; this.fallT = 0; this.fallen = 0;
  }
  update(dt) {
    this.t += dt;
    const px = this.x, py = this.y;
    if (this.axis === 'fall') {
      if (this.fallen > 0) { this.fallen -= dt; if (this.fallen <= 0) { this.x = this.ox; this.y = this.oy; this.vy = 0; this.fallT = 0; } }
      else if (this.fallT > 0) { this.fallT += dt; if (this.fallT > 0.5) { this.vy += 1200 * dt; this.y += this.vy * dt; if (this.y > G.h * TILE + 100) this.fallen = 2.5; } }
      else if (G.player.ride === this) this.fallT = 0.001;
    } else if (this.axis !== 'none') {
      const o = Math.sin(this.t * this.speed + this.ph) * this.range / 2;
      if (this.axis === 'x') this.x = this.ox + o; else this.y = this.oy + o;
    }
    this.dx = this.x - px; this.dy = this.y - py;
  }
  draw(ctx) {
    if (this.fallen > 0) return;
    const x0 = this.x - this.hw, y0 = this.y - this.hh, sh = this.fallT > 0 ? Math.sin(this.t * 60) * 1.5 : 0;
    ctx.save(); ctx.translate(sh, 0);
    if (this.style === 'tech') {
      ctx.fillStyle = '#5a6a88'; ctx.strokeStyle = '#000'; ctx.lineWidth = 2;
      ctx.beginPath(); roundRect(ctx, x0, y0, this.hw * 2, 14, 5); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#40e0ff'; ctx.fillRect(x0 + 6, y0 + 4, this.hw * 2 - 12, 3);
      ctx.fillStyle = 'rgba(64,224,255,0.5)';
      for (let i = 0; i < 2; i++) { const fx = x0 + 12 + i * (this.hw * 2 - 24); ctx.beginPath(); ctx.moveTo(fx - 5, y0 + 14); ctx.lineTo(fx, y0 + 26 + Math.sin(this.t * 20 + i) * 4); ctx.lineTo(fx + 5, y0 + 14); ctx.fill(); }
    } else {
      ctx.fillStyle = this.style === 'stone' ? '#6a6080' : '#9a6a3a'; ctx.strokeStyle = '#000'; ctx.lineWidth = 2;
      ctx.beginPath(); roundRect(ctx, x0, y0, this.hw * 2, 14, 3); ctx.fill(); ctx.stroke();
      ctx.fillStyle = 'rgba(255,255,255,0.25)'; ctx.fillRect(x0 + 2, y0 + 2, this.hw * 2 - 4, 3);
    }
    ctx.restore();
  }
}

const NPC_LOOK = {
  aldeano: ['aldeano', []], militar: ['aldeano', ['military', 'cuffs']], militarLibre: ['aldeano', ['military']],
  playista: ['aldeano', ['sunglasses']], alcalde: ['aldeano', ['mayor']], general: ['aldeano', ['general']],
  mexicano: ['mexicano', []], esclavo: ['aldeano', ['cuffs']],
};
class NPC extends Ent {
  constructor(x, y, o = {}) {
    super(x, y, 13, 15);
    this.kind = o.kind || 'aldeano'; this.dlg = o.dlg; this.auto = o.auto !== false; this.talked = false;
    this.expr = o.expr || 'neutral'; this.caged = !!o.caged; this.dir = o.dir || -1; this.hop = Math.random() * 6;
    this.r = o.r || 15; this.oneShot = o.once;
  }
  update(dt) {
    this.t += dt;
    const p = G.player;
    const close = Math.abs(p.x - this.x) < 70 && Math.abs(p.y - this.y) < 60 && !p.dying;
    this.dir = p.x < this.x ? -1 : 1;
    if (this.caged) {
      if (close && G.state === 'play') { this.caged = false; Sfx.play('key'); G.puff(this.x, this.y, '#ccc', 12, 120); this.talk(); }
      return;
    }
    if (close && G.state === 'play' && this.dlg) {
      if (!this.talked && this.auto) this.talk();
      else if (Input.pressed('down')) this.talk();
    }
    for (const tp of Input.taps) {
      const wx = tp.x / ZOOM + G.cam.x, wy = tp.y / ZOOM + G.cam.y;
      if (!tp.btn && this.dlg && dist(wx, wy, this.x, this.y) < 32 && close && G.state === 'play') this.talk();
    }
  }
  talk() {
    if (!this.dlg) return;
    this.talked = true;
    Save.data.talked[G.def.id + ':' + Math.round(this.x / TILE)] = 1;
    G.say(this.dlg);
    if (this.oneShot) this.dlg = null;
  }
  draw(ctx) {
    const [type, acc] = NPC_LOOK[this.kind] || NPC_LOOK.aldeano;
    const bob = this.expr === 'happy' ? Math.abs(Math.sin(this.t * 5 + this.hop)) * 6 : 0;
    Art.ball(ctx, this.x, this.y + 1 - bob, this.r, type, { phi: this.dir * 0.6, expr: this.caged ? 'scared' : this.expr, acc, t: this.t, blink: (this.t + this.hop) % 4 < 0.12 });
    if (this.caged) {
      ctx.strokeStyle = '#333'; ctx.lineWidth = 3;
      ctx.strokeRect(this.x - 22, this.y - 28, 44, 44);
      for (let i = 1; i < 4; i++) { ctx.beginPath(); ctx.moveTo(this.x - 22 + i * 11, this.y - 28); ctx.lineTo(this.x - 22 + i * 11, this.y + 16); ctx.stroke(); }
      ctx.fillStyle = '#555'; ctx.fillRect(this.x - 24, this.y - 32, 48, 6);
    } else if (this.dlg) {
      const p = G.player;
      const close = Math.abs(p.x - this.x) < 70 && Math.abs(p.y - this.y) < 60;
      const y = this.y - this.r - 16 + Math.sin(this.t * 4) * 2;
      ctx.fillStyle = this.talked ? '#fff' : '#ffd23a'; ctx.strokeStyle = '#000'; ctx.lineWidth = 2;
      ctx.beginPath(); roundRect(ctx, this.x - 10, y - 10, 20, 18, 5); ctx.fill(); ctx.stroke();
      outlinedText(ctx, this.talked ? '…' : '!', this.x, y - 1, 14, '#000', '#fff');
      if (close && this.talked) { setFont(ctx, 11, 700); ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.fillText(T('t_tap'), this.x, this.y + 26); }
    }
  }
}

        else { ctx.strokeStyle = '#4a2e1a'; ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(x, b - 50); ctx.lineTo(x - 20, b - 80); ctx.moveTo(x, b - 45); ctx.lineTo(x + 22, b - 75); ctx.moveTo(x, b - 60); ctx.lineTo(x + 4, b - 92); ctx.stroke(); BG.flames(ctx, x, b - 80, 30, 24, t + x); }

        ctx.strokeStyle = '#8a5a2b'; ctx.lineWidth = 9; ctx.beginPath(); ctx.moveTo(x, b); ctx.quadraticCurveTo(x + 20, b - h / 2, x + 10, b - h); ctx.stroke();
