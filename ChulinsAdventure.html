        break;
      }
      case 'lamp': ctx.fillStyle = '#333'; ctx.fillRect(x - 2, b - 70, 4, 70); ctx.fillStyle = '#ffe9a0'; ctx.beginPath(); ctx.arc(x, b - 72, 7, 0, TAU); ctx.fill(); break;
      case 'flower': for (let i = 0; i < 3; i++) { ctx.fillStyle = ['#ff5a8a', '#ffe14d', '#b05aff'][i]; ctx.beginPath(); ctx.arc(x - 10 + i * 10, b - 8 - (i % 2) * 4, 4, 0, TAU); ctx.fill(); } break;
      case 'barrel': ctx.fillStyle = '#8a5a2b'; ctx.strokeStyle = '#000'; ctx.lineWidth = 2; ctx.beginPath(); roundRect(ctx, x - 12, b - 30, 24, 30, 5); ctx.fill(); ctx.stroke(); ctx.fillStyle = '#555'; ctx.fillRect(x - 12, b - 22, 24, 3); ctx.fillRect(x - 12, b - 10, 24, 3); break;
      case 'banner': ctx.fillStyle = '#363636'; ctx.fillRect(x - 14, b - 90, 28, 50); ctx.fillStyle = '#ff0000'; Art.star(ctx, x, b - 66, 10); break;
      case 'chain': ctx.strokeStyle = '#555'; ctx.lineWidth = 5; ctx.setLineDash([8, 5]); ctx.beginPath(); ctx.moveTo(x, b); ctx.lineTo(x + 40, b - 500); ctx.stroke(); ctx.setLineDash([]); break;
      case 'mast': ctx.fillStyle = '#6b4226'; ctx.fillRect(x - 5, b - 200, 10, 200); ctx.fillStyle = '#f5f0e0'; ctx.strokeStyle = '#000'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(x + 6, b - 190); ctx.quadraticCurveTo(x + 90 + Math.sin(t) * 6, b - 130, x + 6, b - 60); ctx.closePath(); ctx.fill(); ctx.stroke(); break;
    }
  }
}

</script>
<script>/* js/enemies.js */
// Enemigos (Secuaces) y jefes.
'use strict';

class Enemy extends Ent {
  constructor(x, y, r, hp) {
    super(x, y, r * 0.8, r * 0.92);
    this.r = r; this.hp = hp; this.maxHp = hp; this.isEnemy = true;
    this.dir = -1; this.phi = -1.15; this.flash = 0; this.frozen = 0; this.cd = 1 + Math.random();
    this.stompable = true; this.contact = 1; this.type = 'secuaz'; this.acc = []; this.gun = 'blue'; this.expr = 'angry';
    this.coinDrop = 1; this.score = 1;
  }
  hurt(dmg, src) {
    if (this.dead || this.inv > 0) return false;
    this.hp -= dmg; this.flash = 1;
    Sfx.play(this.boss ? 'bosshit' : 'hit');
    if (this.hp <= 0) this.kill();
    return true;
  }
  kill() {
    this.dead = true;
    G.puff(this.x, this.y, '#363636', 12, 160); G.puff(this.x, this.y, '#ff0000', 6, 120);
    for (let i = 0; i < this.coinDrop; i++) { const c = new Coin(this.x, this.y - 10); c.vy = -300 - Math.random() * 200; c.x += rand(-10, 10); G.add(c); }
    if (Math.random() < 0.12 && !this.boss) G.add(new Heart(this.x, this.y - 10));
    G.kills++; if (!this.boss) Save.data.kills++;
  }
  playerContact() {
    const p = G.player;
    if (p.dying || !overlap(this, p)) return;
    if (p.shield > 0) { this.hurt(2, p); p.vx = sign(p.x - this.x) * 300; return; }
    if (this.stompable && p.vy > 60 && p.y < this.y - this.hh * 0.35) {
      this.hurt(this.boss ? 2 : 2, p); p.vy = -500; p.jumps = p.st.air; Sfx.play('stomp');
      G.puff(p.x, p.y + 14, '#fff', 6, 80);
    } else p.hurt(this.contact, this.x);
  }
  facePlayer() { this.dir = G.player.x < this.x ? -1 : 1; }
  baseUpdate(dt) {
    this.t += dt;
    if (this.flash > 0) this.flash = Math.max(0, this.flash - dt * 6);
    if (this.inv > 0) this.inv -= dt;
    if (this.frozen > 0) { this.frozen -= dt; this.vx = 0; this.vy += GRAV * dt; G.moveBody(this, dt); this.playerContact(); return true; }
    return false;
  }
  canSee(range = 340) {
    const p = G.player;
    return !p.dying && Math.abs(p.x - this.x) < range && Math.abs(p.y - this.y) < 110;
  }
  draw(ctx) {
    const walk = this.onGround && Math.abs(this.vx) > 20 ? Math.sin(this.t * 14) * 0.035 : 0;
    const o = { phi: this.phi, expr: this.frozen > 0 ? 'scared' : this.expr, acc: this.acc, gun: this.gun, dir: this.dir, flash: this.flash * 0.8, t: this.t, sq: (this.sq || 0) + walk };
    Art.ball(ctx, this.x, this.y + this.hh - this.r + 1, this.r, this.type, o);
    if (this.frozen > 0) {
      ctx.fillStyle = 'rgba(200,240,255,0.45)'; ctx.strokeStyle = '#fff'; ctx.lineWidth = 2;
      ctx.beginPath(); roundRect(ctx, this.x - this.r - 3, this.y - this.r - 3, this.r * 2 + 6, this.r * 2 + 6, 6); ctx.fill(); ctx.stroke();
    }
  }
}

// Secuaz común: patrulla y dispara con su pistola azul
class Comun extends Enemy {
  constructor(x, y, o = {}) { super(x, y, o.r || 16, o.hp || 2); this.speed = 60; this.kindName = 'comun'; }
  update(dt) {
    if (this.baseUpdate(dt)) return;
    const see = this.canSee(this.range || 330);
    if (see) {
      this.facePlayer(); this.vx = approach(this.vx, 0, 600 * dt);
      this.cd -= dt;
      if (this.cd <= 0) { this.cd = 1.5 + Math.random() * 0.5; enemyShot(this.x + this.dir * 18, this.y + 4, this.x + this.dir * 100, this.y + 4, 300); Sfx.play('eshoot'); this.shootT = 0.3; }
    } else {
      this.vx = this.dir * this.speed;
      const ahead = this.x + this.dir * (this.hw + 4);
      if (this.onGround && (!G.isGroundPx(ahead, this.y + this.hh + 6) || this.hitWall)) { this.dir *= -1; this.vx = this.dir * this.speed; }
    }
    this.vy += GRAV * dt; this.vy = Math.min(this.vy, MAXFALL);
    G.moveBody(this, dt);
    if (this.y > G.h * TILE + 100) this.dead = true;
    this.phi = approach(this.phi, this.dir * 1.15, dt * 8);
    this.playerContact();
  }
}

// Guardia (jefe del 1-1): un Secuaz común más fuerte
class Guard extends Comun {
  constructor(x, y) { super(x, y, { r: 21, hp: 10 }); this.boss = true; this.nameKey = 'guard'; this.coinDrop = 5; this.jumpT = 2; }
  update(dt) {
    if (!this.active) { this.facePlayer(); this.phi = approach(this.phi, this.dir * 1.15, dt * 6); this.vy += GRAV * dt; G.moveBody(this, dt); return; }
    if (this.baseUpdate(dt)) return;
    this.facePlayer();
    this.cd -= dt; this.jumpT -= dt;
    if (this.cd <= 0) {
      this.cd = 1.6;
      for (let i = 0; i < 3; i++) setTimeout(() => { if (!this.dead && G.state === 'play') { enemyShot(this.x + this.dir * 22, this.y + 4, G.player.x, G.player.y, 330); Sfx.play('eshoot'); } }, i * 150);
    }
    if (this.jumpT <= 0 && this.onGround) { this.jumpT = 2.2 + Math.random(); this.vy = -560; this.vx = this.dir * 150; }
    if (this.onGround) this.vx = approach(this.vx, this.dir * 40, 400 * dt);
    this.vy += GRAV * dt; G.moveBody(this, dt);
    this.phi = approach(this.phi, this.dir * 1.15, dt * 8);
    this.playerContact();
  }
}

// Secuaz Gigante con lanzallamas
class Gigante extends Enemy {
  constructor(x, y, o = {}) {
    super(x, y, o.r || 42, o.hp || 14);
    this.boss = !!o.boss; this.nameKey = 'gigante'; this.gun = 'flame'; this.flame = 0; this.speed = 70; this.coinDrop = this.boss ? 8 : 4;
    this.jumpT = 3; this.contact = 1;
  }
  update(dt) {
    if (this.boss && !this.active) { this.facePlayer(); this.phi = approach(this.phi, this.dir * 1.15, dt * 6); this.vy += GRAV * dt; G.moveBody(this, dt); return; }
    if (this.baseUpdate(dt)) return;
    const p = G.player;
    const d = Math.abs(p.x - this.x);
    if (this.flame > 0) {
      this.flame -= dt; this.vx = 0;
      if (Math.random() < 0.9) {
        const b = new Bullet(this.x + this.dir * this.r * 1.3, this.y + this.r * 0.2, this.dir * rand(280, 380), rand(-50, 30), true, { dmg: 1, r: 9, kind: 'fireball', life: 0.55 });
        G.add(b);
      }
      if (Math.random() < 0.2) Sfx.play('fire');
    } else if (d < 330 || this.boss) {
      this.facePlayer();
      this.cd -= dt;
      if (this.cd <= 0 && d < 220) { this.flame = 1.3; this.cd = 2.2; }
      this.vx = approach(this.vx, d > 120 ? this.dir * this.speed : 0, 300 * dt);
      this.jumpT -= dt;
      if (this.boss && this.jumpT <= 0 && this.onGround) { this.jumpT = 3.5; this.vy = -620; this.vx = this.dir * 160; this.jumping = true; }
    } else {
      this.vx = this.dir * this.speed * 0.6;
      if (this.onGround && (!G.isGroundPx(this.x + this.dir * (this.hw + 4), this.y + this.hh + 6) || this.hitWall)) this.dir *= -1;
    }
    this.vy += GRAV * dt; this.vy = Math.min(this.vy, MAXFALL);
    const was = this.onGround;
    G.moveBody(this, dt);
    if (this.onGround && !was && this.jumping) {
      this.jumping = false; G.shake(10); Sfx.play('explode');
      G.add(new Shockwave(this.x - this.r, this.y + this.hh, -1)); G.add(new Shockwave(this.x + this.r, this.y + this.hh, 1));
    }
    this.phi = approach(this.phi, this.dir * 1.15, dt * 5);
    this.playerContact();
  }
}

// Secuaz Acuático: nada en el agua y lanza pirañas en llamas
class Acuatico extends Enemy {
  constructor(x, y) { super(x, y, 16, 2); this.acc = ['goggles']; this.gun = null; this.kindName = 'acuatico'; this.cd = 2 + Math.random() * 2; this.home = y; this.speed = 70; }
  update(dt) {
    if (this.baseUpdate(dt)) return;
    const inW = G.waterAt(this.x, this.y);
    if (inW && G.elecAt(this.x, this.y)) { this.hurt(99); return; }
    if (inW) {
      this.vy = approach(this.vy, Math.sin(this.t * 2) * 30, 400 * dt);
      this.vx = this.dir * this.speed;
      if (this.hitWall || !G.waterAt(this.x + this.dir * 24, this.y)) this.dir *= -1;
      this.cd -= dt;
      if (this.cd <= 0 && this.canSee(420)) {
        this.cd = 2.6; this.facePlayer();
        this.vy = -520; // salta fuera del agua
        const p = G.player;
        const t = 0.9, vx = (p.x - this.x) / t, vy = (p.y - this.y - 0.5 * 900 * t * t) / t;
        const b = new Piranha(this.x, this.y - 12, vx, clamp(vy, -700, -200));
        G.add(b); Sfx.play('splash');
      }
    } else {
      this.vy += GRAV * dt;
      if (!this.leftWater) this.vx *= 0.98;
    }
    G.moveBody(this, dt);
    this.phi = approach(this.phi, this.dir * 1.15, dt * 8);
    this.playerContact();
  }
}
// Piraña: proyectil en llamas (y también nadadora en el agua)
class Piranha extends Ent {
  constructor(x, y, vx, vy, swimmer = false) {
    super(x, y, 10, 7); this.vx = vx; this.vy = vy; this.swimmer = swimmer; this.isEnemy = swimmer; this.hp = 1; this.dir = sign(vx) || 1;
    this.home = y; this.life = swimmer ? 1e9 : 3;
  }
  hurt() { this.dead = true; G.puff(this.x, this.y, '#c0392b', 6, 80); return true; }
  update(dt) {
    this.t += dt; this.life -= dt; if (this.life <= 0) this.dead = true;
    const inW = G.waterAt(this.x, this.y);
    if (inW && G.elecAt(this.x, this.y)) { this.dead = true; G.add(new DeadPiranha(this.x, this.y)); PG.unlock('fried'); return; }
    if (this.swimmer) {
      if (inW) {
        this.vx = this.dir * 90; this.vy = Math.sin(this.t * 3) * 30;
        if (!G.waterAt(this.x + this.dir * 16, this.y) || G.isSolidPx(this.x + this.dir * 14, this.y)) this.dir *= -1;
        const p = G.player;
        if (Math.random() < dt * 0.4 && Math.abs(p.x - this.x) < 120 && p.y < this.y) this.vy = -560;
      } else this.vy += 900 * dt;
      if (this.vy < -100 && !inW) this.vy += 900 * dt;
    } else {
      this.vy += 900 * dt;
      if (inW && this.vy > 0) { this.swimmer = true; this.isEnemy = true; this.life = 1e9; this.dir = sign(this.vx) || 1; }
      if (G.isSolidPx(this.x, this.y + 6)) { this.dead = true; G.puff(this.x, this.y, '#ff8a1f', 8, 100); }
    }
    this.x += this.vx * dt; this.y += this.vy * dt;
    if (this.swimmer && !inW && this.vy > 0 && G.waterAt(this.x, this.y + 10)) this.vy *= 0.5;
    const p = G.player;
    if (!p.dying && overlap(this, p)) p.hurt(1, this.x);
  }
  draw(ctx) { drawPiranha(ctx, this.x, this.y, sign(this.vx) || this.dir, this.t, false); }
}

// Secuaz Volador: mochila cohete
class Volador extends Enemy {
  constructor(x, y) { super(x, y, 16, 2); this.acc = ['jetpack']; this.kindName = 'volador'; this.ox = x; this.oy = y; this.cd = 1.5 + Math.random(); }
  update(dt) {
    if (this.baseUpdate(dt)) return;
    const p = G.player;
    const near = Math.abs(p.x - this.x) < 520;
    let tx = this.ox + Math.sin(this.t * 0.8) * 70, ty = this.oy + Math.sin(this.t * 2) * 16;
    if (near) { tx = p.x + (this.x < p.x ? -150 : 150); ty = p.y - 120 + Math.sin(this.t * 2) * 20; }
    this.vx = approach(this.vx, clamp((tx - this.x) * 2, -150, 150), 300 * dt);
    this.vy = approach(this.vy, clamp((ty - this.y) * 2, -150, 150), 300 * dt);
    this.x += this.vx * dt; this.y += this.vy * dt;
    if (near) {
      this.facePlayer(); this.cd -= dt;
      if (this.cd <= 0) { this.cd = 1.8; enemyShot(this.x + this.dir * 16, this.y + 6, p.x, p.y, 280); Sfx.play('eshoot'); }
    } else this.dir = sign(this.vx) || this.dir;
    this.phi = approach(this.phi, this.dir * 1.15, dt * 8);
    this.playerContact();
  }
}
// Secuaz Dorado: vuela mejor, con rifle
class Dorado extends Volador {
  constructor(x, y) { super(x, y); this.type = 'sdorado'; this.acc = ['goldpack']; this.gun = 'gold'; this.hp = this.maxHp = 4; this.kindName = 'dorado'; this.coinDrop = 2; }
  update(dt) {
    if (this.baseUpdate(dt)) return;
    const p = G.player;
    const near = Math.abs(p.x - this.x) < 560;
    let tx = this.ox, ty = this.oy;
    if (near) { const a = this.t * 1.3; tx = p.x + Math.cos(a) * 170; ty = p.y - 110 + Math.sin(a * 2) * 40; }
    this.vx = approach(this.vx, clamp((tx - this.x) * 3, -260, 260), 700 * dt);
    this.vy = approach(this.vy, clamp((ty - this.y) * 3, -260, 260), 700 * dt);
    this.x += this.vx * dt; this.y += this.vy * dt;
    if (near) {
      this.facePlayer(); this.cd -= dt;
      if (this.cd <= 0) {
        this.cd = 2;
        for (let i = 0; i < 3; i++) setTimeout(() => { if (!this.dead && G.state === 'play') { enemyShot(this.x + this.dir * 16, this.y + 6, G.player.x, G.player.y, 360, EBULLET_GOLD); Sfx.play('rifle'); } }, i * 110);
      }
    }
    this.phi = approach(this.phi, this.dir * 1.15, dt * 8);
    this.playerContact();
  }
}

// ======================= Jefes =======================
// Jefe de Operaciones (y Militar de Operaciones en Ciudad Sulu)
class Jefe extends Enemy {
  constructor(x, y, o = {}) {
    const v = o.v || 1;
    const big = v === 'militar';
    super(x, y, big ? 74 : 56, big ? 46 : v === 3 ? 48 : v === 2 ? 42 : 34);
    this.v = v; this.boss = true; this.acc = [big ? 'general' : 'police']; if (v === 3) this.acc.push('goggles');
    this.nameKey = big ? 'militarOp' : 'jefe'; this.coinDrop = 10; this.state = 'idle'; this.st = 1.2; this.contact = 1;
  }
  update(dt) {
    if (!this.active) { this.facePlayer(); this.phi = approach(this.phi, this.dir * 1.15, dt * 6); this.vy += GRAV * dt; G.moveBody(this, dt); return; }
    if (this.baseUpdate(dt)) return;
    const p = G.player;
    this.st -= dt;
    const rage = this.hp < this.maxHp * 0.4 ? 1.35 : 1;
    switch (this.state) {
      case 'idle':
        this.facePlayer(); this.vx = approach(this.vx, 0, 800 * dt); this.expr = 'angry';
        if (this.st <= 0) {
          const opts = ['jump', 'fan', 'jump'];
          if (this.v !== 1 || this.hp < this.maxHp * 0.7) opts.push('summon');
          if (this.v === 2 || this.v === 'militar' || this.v === 3) opts.push('charge', 'rain');
          if (this.v === 3) opts.push('summonFly');
          this.state = pick(opts); this.st = 0;
          if (this.state === 'jump') { this.vy = -820; this.vx = clamp((p.x - this.x) / 1.0, -420, 420); this.state = 'air'; this.sq = -0.15; }
          if (this.state === 'charge') { this.st = 0.6; this.expr = 'serious'; }
        }
        break;
      case 'air':
        if (this.onGround && this.vy >= 0) {
          G.shake(12); Sfx.play('explode'); this.sq = 0.2;
          G.add(new Shockwave(this.x - this.r, this.y + this.hh, -1, 340 * rage)); G.add(new Shockwave(this.x + this.r, this.y + this.hh, 1, 340 * rage));
          this.state = 'idle'; this.st = 1.0 / rage; this.vx = 0;
        }
        break;
      case 'fan': {
        const n = this.v === 'militar' ? 7 : 5;
        const base = Math.atan2(p.y - this.y, p.x - this.x);
        for (let i = 0; i < n; i++) {
          const a = base + (i - (n - 1) / 2) * 0.22;
          G.add(new Bullet(this.x + Math.cos(a) * this.r, this.y + Math.sin(a) * this.r, Math.cos(a) * 300 * rage, Math.sin(a) * 300 * rage, true, EBULLET));
        }
        Sfx.play('eshoot'); this.state = 'idle'; this.st = 1.3 / rage; break;
      }
      case 'summon': {
        const alive = G.ents.filter((e) => e instanceof Comun && !e.dead).length;
        if (alive < 3) for (const d of [-1, 1]) { const c = new Comun(this.x + d * 90, this.y - 60); c.vy = -300; G.add(c); }
        Sfx.play('roar'); this.expr = 'happy'; this.state = 'idle'; this.st = 1.4; break;
      }
      case 'summonFly': {
        const alive = G.ents.filter((e) => e instanceof Volador && !e.dead).length;
        if (alive < 2) G.add(new Volador(this.x, this.y - 150));
        this.state = 'idle'; this.st = 1.2; break;
      }
      case 'charge':
        if (this.st > 0) { this.vx = -this.dir * 40; break; }
        this.vx = this.dir * 430 * rage;
        if (this.hitWall) { this.state = 'idle'; this.st = 1.4; G.shake(10); Sfx.play('explode'); this.vx = 0; this.expr = 'verysad'; }
        break;
      case 'rain':
        for (let i = 0; i < 6; i++) {
          const x = p.x + (i - 2.5) * 70 + rand(-20, 20);
          const b = new Bullet(x, G.cam.y - 20 - i * 40, 0, 260, true, FIREBALL); b.life = 4; G.add(b);
        }
        Sfx.play('roar'); this.state = 'idle'; this.st = 1.6; break;
    }
    this.vy += GRAV * dt; this.vy = Math.min(this.vy, MAXFALL);
    G.moveBody(this, dt);
    this.sq = approach(this.sq || 0, 0, dt);
    this.phi = approach(this.phi, this.dir * 1.15, dt * 6);
    this.playerContact();
  }
}

// Persecución en el agua (2-6): un Secuaz Acuático se lleva al Alcalde
class Kidnapper extends Enemy {
  constructor(x, y) {
    super(x, y, 18, 14); this.boss = true; this.acc = ['goggles']; this.gun = null; this.nameKey = 'acuatico'; this.coinDrop = 10;
    this.stompable = true; this.cd = 2; this.endX = 0; this.runDir = 1; this.noReset = true; this.chaseT = 0;
  }
  update(dt) {
    if (this.baseUpdate(dt)) return;
    if (!this.endX) { this.endX = (G.w - 6) * TILE; this.startX = 8 * TILE; }
    const p = G.player;
    // Persecución infinita: al llegar a un extremo da la vuelta. Cada golpe y el tiempo lo cansan.
    if (this.x > this.endX) this.runDir = -1; else if (this.x < this.startX) this.runDir = 1;
    if (G.state === 'play') this.chaseT += dt;
    const tired = Math.max(0.35, 1 - (this.maxHp - this.hp) * 0.05 - this.chaseT / 300);
    const ahead = (this.x - p.x) * this.runDir;
    let spd = 0;
    if (G.state === 'play') spd = (ahead < 0 ? 330 : ahead < 260 ? 300 : ahead > 520 ? 90 : 205) * tired;
    this.vx = approach(this.vx, spd * this.runDir, 700 * dt);
    // flota sobre el agua; sobre los muelles se queda encima del suelo (nunca se hunde)
    let ty = G.waterSurfaceBelow(this.x, this.y - 40);
    if (ty == null) {
      const tx = Math.floor(this.x / TILE);
      for (let yy = Math.max(0, Math.floor((this.y - 60) / TILE)); yy < G.h; yy++) if (G.isSolid(tx, yy) || G.tile(tx, yy) === 'W') { ty = yy * TILE; break; }
    }
    ty = ty == null ? this.y : ty - 12;
    this.vy = approach(this.vy, clamp((ty - this.y) * 6, -320, 400), 1800 * dt);
    this.x += this.vx * dt; this.y += this.vy * dt;
    this.y = Math.min(this.y, (G.h - 2) * TILE);
    this.cd -= dt;
    if (this.cd <= 0 && G.state === 'play') {
      this.cd = this.hp < 7 ? 1.3 : 1.9;
      const t = 0.9, vx = (p.x - this.x) / t, vy = (p.y - this.y - 0.5 * 900 * t * t) / t;
      G.add(new Piranha(this.x, this.y - 14, vx, clamp(vy, -700, -200))); Sfx.play('splash');
    }
    this.dir = this.runDir; this.phi = approach(this.phi, Math.sin(this.t * 2) > 0.3 ? -this.runDir * 1.15 : this.runDir * 1.15, dt * 5);
    this.playerContact();
  }
  draw(ctx) {
    // moto acuática
    ctx.save(); ctx.translate(this.x, this.y + 14); ctx.scale(this.runDir, 1);
    ctx.fillStyle = '#363636'; ctx.strokeStyle = '#000'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(-34, -4); ctx.lineTo(30, -4); ctx.quadraticCurveTo(44, 0, 34, 10); ctx.lineTo(-30, 10); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#ff0000'; Art.star(ctx, 0, 3, 6);
    if (Math.abs(this.vx) > 20) { ctx.fillStyle = 'rgba(255,255,255,0.8)'; for (let i = 0; i < 3; i++) { ctx.beginPath(); ctx.arc(-38 - i * 9, 8 - Math.random() * 8, 4 - i, 0, TAU); ctx.fill(); } }
    ctx.restore();
    Art.ball(ctx, this.x - 16 * this.runDir, this.y - 4, 13, 'aldeano', { acc: ['general'], expr: 'scared', phi: 0.4 * this.runDir, t: this.t });

  }
}

// El Imperialista (jefe final)
class Imperialista extends Enemy {
  constructor(x, y) {
    super(x, y, 50, 110); this.boss = true; this.acc = ['crown']; this.gun = null; this.nameKey = 'imperialista';
    this.state = 'float'; this.st = 2; this.ox = x; this.oy = y - 80; this.stompable = true; this.coinDrop = 30; this.lasers = [];
  }
  get phase() { return this.hp > this.maxHp * 0.66 ? 1 : this.hp > this.maxHp * 0.33 ? 2 : 3; }
  // Cae un corazón cerca del jugador, sobre el suelo de la arena
  dropHeart() {
    const p = G.player;
    const lo = G.arena ? (G.arena.x0 + 2) * TILE : p.x - 200, hi = G.arena ? (G.arena.x1 - 1) * TILE : p.x + 200;
    const x = clamp(p.x + rand(-160, 160), lo, hi);
    const tx = Math.floor(x / TILE);
    let ty = Math.floor(p.y / TILE);
    while (ty < G.h - 1 && !G.isSolid(tx, ty + 1) && G.tile(tx, ty + 1) !== '=') ty++;
    const h = new Heart(tx * TILE + 16, ty * TILE + 12);
    G.add(h); G.sparkle(h.x, h.y, '#ff2d55', 12); Sfx.play('heart');
  }
  hurt(d, s) {
    const before = this.hp;
    const ph = this.phase; const r = super.hurt(d, s);
    // cada 10% de vida que le quitas aparece un corazón
    const step = this.maxHp * 0.1;
    if (r && !this.dead && Math.floor(before / step) > Math.floor(this.hp / step)) this.dropHeart();
    if (this.phase !== ph && !this.dead) { this.inv = 1.5; G.shake(14); Sfx.play('roar'); G.event('imp_phase' + this.phase); }
    return r;
  }
  update(dt) {
    if (!this.active) { this.facePlayer(); this.phi = approach(this.phi, 0, dt * 6); this.y = lerp(this.y, this.oy, dt * 2); return; }
    if (this.baseUpdate(dt)) return;
    const p = G.player, ph = this.phase;
    // y cada 20 segundos, si te falta vida
    this.heartT = (this.heartT || 0) + dt;
    if (this.heartT >= 20) { this.heartT = 0; if (p.hp < p.maxHp && !G.ents.some((e) => e instanceof Heart && !e.dead)) this.dropHeart(); }
    this.st -= dt;
    const ax = G.arena ? G.arena.x0 * TILE + 120 : this.ox - 300, bx = G.arena ? G.arena.x1 * TILE - 120 : this.ox + 300;
    if (this.state === 'float') {
      this.x = lerp(ax, bx, 0.5 + 0.5 * Math.sin(this.t * (0.6 + ph * 0.15)));
      this.y = this.oy + Math.sin(this.t * 2) * 30;
      this.facePlayer(); this.expr = ph === 3 ? 'angry' : 'serious';
      this.cd -= dt;
      if (this.cd <= 0) {
        this.cd = ph === 1 ? 1.4 : ph === 2 ? 1.1 : 0.9;
        const n = ph === 1 ? 8 : 12, off = this.t;
        for (let i = 0; i < n; i++) { const a = off + (i / n) * TAU; G.add(new Bullet(this.x, this.y, Math.cos(a) * 210, Math.sin(a) * 210, true, STARSHOT)); }
        Sfx.play('eshoot');
      }
      if (this.st <= 0) {
        const opts = ['dive', 'aim'];
        if (ph >= 2) opts.push('summon', 'crown');
        if (ph >= 3) opts.push('laser', 'laser');
        this.state = pick(opts); this.st = 0;
      }
    } else if (this.state === 'aim') {
      for (let i = -1; i <= 1; i++) { const a = Math.atan2(p.y - this.y, p.x - this.x) + i * 0.15; G.add(new Bullet(this.x, this.y, Math.cos(a) * 380, Math.sin(a) * 380, true, STARSHOT)); }
      Sfx.play('eshoot'); this.state = 'float'; this.st = 1.5;
    } else if (this.state === 'dive') {
      if (!this.diveT) { this.diveT = 0.7; this.tx = p.x; this.expr = 'angry'; }
      this.diveT -= dt;
      if (this.diveT > 0) { this.y = lerp(this.y, this.oy - 60, dt * 5); this.x = lerp(this.x, this.tx, dt * 3); }
      else {
        this.vy += 2600 * dt; this.y += this.vy * dt;
        if (G.isSolidPx(this.x, this.y + this.r)) {
          this.y = Math.floor((this.y + this.r) / TILE) * TILE - this.r; G.shake(14); Sfx.play('explode');
          G.add(new Shockwave(this.x - this.r, this.y + this.r, -1, 380)); G.add(new Shockwave(this.x + this.r, this.y + this.r, 1, 380));
          this.vy = 0; this.diveT = 0; this.state = 'rise'; this.st = 1.1; this.expr = 'idiot';
        }
      }
    } else if (this.state === 'rise') {
      if (this.st <= 0) { this.y = lerp(this.y, this.oy, dt * 3); if (Math.abs(this.y - this.oy) < 6) { this.state = 'float'; this.st = 2; } }
    } else if (this.state === 'summon') {
      const alive = G.ents.filter((e) => e instanceof Dorado && !e.dead).length;
      if (alive < 2) { G.add(new Dorado(this.x - 120, this.y - 40)); G.add(new Dorado(this.x + 120, this.y - 40)); }
      Sfx.play('roar'); this.state = 'float'; this.st = 2.5; this.expr = 'happy';
    } else if (this.state === 'crown') {
      for (const d of [-1, 1]) {
        const b = new Bullet(this.x, this.y - this.r, d * 420, -120, true, { dmg: 1, r: 12, col: '#ffc300', life: 2.6, boomerang: true });
        b.owner = this; b.crown = true; G.add(b);
      }
      this.state = 'float'; this.st = 2.2;
    } else if (this.state === 'laser') {
      const n = 3;
      for (let i = 0; i < n; i++) this.lasers.push({ x: p.x + (i - 1) * 140 + rand(-30, 30), t: 0 });
      Sfx.play('elec'); this.state = 'float'; this.st = 2.4;
    }
    // Rayos verticales: primero aviso, luego daño
    for (const L of this.lasers) {
      L.t += dt;
      if (L.t > 0.9 && L.t < 1.4 && Math.abs(p.x - L.x) < 18 && !p.dying) p.hurt(1, L.x);
    }
    this.lasers = this.lasers.filter((L) => L.t < 1.4);
    this.phi = approach(this.phi, this.state === 'float' ? this.dir * 0.5 : 0, dt * 6);
    this.playerContact();
  }
  draw(ctx) {
    for (const L of this.lasers) {
      const top = G.cam.y - 10, h = G.vh + 20;
      if (L.t < 0.9) { ctx.fillStyle = `rgba(255,40,40,${0.15 + 0.25 * Math.sin(L.t * 30) ** 2})`; ctx.fillRect(L.x - 14, top, 28, h); }
      else { ctx.fillStyle = 'rgba(255,60,60,0.85)'; ctx.fillRect(L.x - 18, top, 36, h); ctx.fillStyle = '#fff'; ctx.fillRect(L.x - 6, top, 12, h); }
    }
    // capa
    ctx.save(); ctx.fillStyle = '#7a0a1a'; ctx.strokeStyle = '#000'; ctx.lineWidth = 3;
    const w = Math.sin(this.t * 3) * 8;
    ctx.beginPath(); ctx.moveTo(this.x - this.r * 0.8, this.y - this.r * 0.3); ctx.quadraticCurveTo(this.x - this.r * 1.5, this.y + this.r, this.x - this.r * 1.2 + w, this.y + this.r * 1.6);
    ctx.lineTo(this.x + this.r * 1.2 - w, this.y + this.r * 1.6); ctx.quadraticCurveTo(this.x + this.r * 1.5, this.y + this.r, this.x + this.r * 0.8, this.y - this.r * 0.3); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.restore();
    super.draw(ctx);
  }
}

const ENEMY_TYPES = { comun: Comun, guard: Guard, gigante: Gigante, acuatico: Acuatico, volador: Volador, dorado: Dorado, jefe: Jefe, kidnapper: Kidnapper, imperialista: Imperialista };

<script>/* js/ui.js */
// Pantallas y menús: título, niveles, personajes, tienda, opciones, pausa, resultados, historia, final.
'use strict';

const UI = {
  taps: [], t: 0,
  // Botón: dibuja y devuelve true si se tocó este cuadro
  btn(ctx, x, y, w, h, label, o = {}) {
    let hit = false;
    for (const tp of this.taps) if (tp.x >= x && tp.x <= x + w && tp.y >= y && tp.y <= y + h) { hit = true; tp.used = true; }
    if (o.disabled) hit = false;
    ctx.save();
    ctx.fillStyle = o.disabled ? '#555' : (o.color || '#ffcf1a');
    ctx.strokeStyle = '#000'; ctx.lineWidth = 3;
    roundRect(ctx, x, y + 4, w, h, Math.min(14, h / 3)); ctx.fillStyle = 'rgba(0,0,0,0.35)'; ctx.fill();
    ctx.fillStyle = o.disabled ? '#666' : (o.color || '#ffcf1a');
    roundRect(ctx, x, y, w, h, Math.min(14, h / 3)); ctx.fill(); ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,0.25)'; roundRect(ctx, x + 4, y + 3, w - 8, h * 0.35, Math.min(10, h / 4)); ctx.fill();
    if (label) outlinedText(ctx, label, x + w / 2, y + h / 2 + 1, o.size || Math.min(22, h * 0.45), o.textCol || '#fff', '#000');
    ctx.restore();
    if (hit) Sfx.play('select');
    return hit;
  },
  back(ctx) { return this.btn(ctx, 12, 10, 52, 44, '←', { color: '#ff6a4d', size: 24 }) || Input.pressed('pause'); },
  panel(ctx, x, y, w, h, col = 'rgba(12,16,36,0.88)') {
    ctx.save(); ctx.fillStyle = col; ctx.strokeStyle = '#fff'; ctx.lineWidth = 3;
    roundRect(ctx, x, y, w, h, 16); ctx.fill(); ctx.stroke(); ctx.restore();
  },
  title(ctx, text, y = 32) { outlinedText(ctx, text, VW / 2, y, 30, '#ffe14d', '#000'); },
  wallet(ctx) {
    Art.coin(ctx, VW - 120, 32, 0, 13);
    outlinedText(ctx, String(Save.data.wallet), VW - 100, 33, 22, '#fff', '#000', 'left');
  },
};

// ======================= Fondo de menú (nivel aleatorio sin enemigos) =======================
let menuBg = null;
function ensureMenuBg() {
  if (!menuBg) {
    const ids = ['1-1', '1-3', '1-5', '2-1', '2-2', '3-1', '3-2', '1-4', '3-5', '4-1'];
    const id = pick(ids);
    menuBg = new Level(LEVELS[id], { preview: true });
    menuBg.cam.x = rand(0, Math.max(0, menuBg.w * TILE - VW));
  }
  return menuBg;
}
function drawMenuBg(ctx, dt, S, dim = 0.35) {
  const bg = ensureMenuBg();
  const saved = G; G = bg;

    const play = CHAR_INFO.find((c) => c[0] === key)[4];

  },
  draw(ctx, dt, S) {
    drawMenuBg(ctx, dt, S, 0.6);
    UI.title(ctx, T('ui_chars'));
    if (UI.back(ctx)) return setScreen('title');
    const per = 6, pages = Math.ceil(CHAR_INFO.length / per);
    const list = CHAR_INFO.slice(this.page * per, this.page * per + per);
    const lw = Math.min(380, VW * 0.42), x0 = 20, y0 = 66;
    // tarjetas a la izquierda

    list.forEach((c, i) => {
      const idx = this.page * per + i;
      const x = x0 + (i % 2) * (cw + 10), y = y0 + Math.floor(i / 2) * (ch + 8);
      const known = this.known(c[0]);
      const selected = idx === this.sel;
      UI.panel(ctx, x, y, cw, ch, selected ? 'rgba(60,90,160,0.9)' : 'rgba(12,16,36,0.85)');
      for (const tp of UI.taps) if (tp.x > x && tp.x < x + cw && tp.y > y && tp.y < y + ch) { this.sel = idx; Sfx.play('select'); }
      if (known) Art.ball(ctx, x + cw / 2, y + 48, 30, c[1], { acc: c[2], phi: Math.sin(UI.t + i) * 0.8, expr: 'neutral', t: UI.t, blink: (UI.t + i) % 4 < 0.1 });
      else { ctx.fillStyle = '#222'; ctx.beginPath(); ctx.arc(x + cw / 2, y + 48, 30, 0, TAU); ctx.fill(); outlinedText(ctx, '?', x + cw / 2, y + 48, 30, '#888', '#000'); }
      outlinedText(ctx, known ? T('n_' + c[0]) : '???', x + cw / 2, y + ch - 16, 13, c[4] ? '#ffe14d' : '#fff', '#000');
      if (c[4] && Save.data.sel === c[4]) outlinedText(ctx, '✔', x + cw - 16, y + 16, 18, '#2ecc71', '#000');
    });
    if (pages > 1) {
      if (UI.btn(ctx, x0, VH - 54, 60, 42, '◀', { color: '#4fb8ff' })) this.page = (this.page + pages - 1) % pages;
      outlinedText(ctx, `${this.page + 1}/${pages}`, x0 + lw / 2, VH - 33, 16, '#fff');
      if (UI.btn(ctx, x0 + lw - 60, VH - 54, 60, 42, '▶', { color: '#4fb8ff' })) this.page = (this.page + 1) % pages;
    }
    // detalle a la derecha
    const c = CHAR_INFO[this.sel];
    const dx = x0 + lw + 20, dw = VW - dx - 20;
    UI.panel(ctx, dx, y0, dw, VH - y0 - 14);

    if (c[4]) {
      const owned = Save.data.chars[c[4]];
      const bx = dx + 150, by = y0 + 92;
      if (owned) {

    else if (this.tab === 'faces') { items = Object.keys(FACES); key = 'face'; priceOf = (k) => FACES[k]; draw = (k, x, y) => Art.ball(ctx, x, y, 26, 'chulin', { face: k, hat: 'none', skin: SKINS[d.skin], t: UI.t }); }
    else { items = Object.keys(SHOP_WEAPONS); key = 'weapon'; priceOf = (k) => SHOP_WEAPONS[k]; draw = (k, x, y) => { ctx.save(); ctx.translate(x - 16, y); Art.gun(ctx, WEAPONS[k].gun, 34, 1, {}); ctx.restore(); }; }

    if (UI.btn(ctx, VW / 2 - 85 - bw / 2, y, bw, 48, T('ui_retry'))) startLevel(r.id, true);
    if (UI.btn(ctx, VW / 2 - 245, y + 6, 70, 40, '⌂', { color: '#9a9aa8', size: 22 })) setScreen('title');
    if (Input.pressed('confirm') && nxt) startLevel(nxt);
  },
  backAction() { setScreen('levels'); return true; },
};

// ======================= Historia entre mundos =======================
const ScreenStory = {
  key: null, then: null, n: 0, page: 0,
  draw(ctx, dt, S) {
    drawMenuBg(ctx, dt, S, 0.75);
    const pages = STORY[this.key];
    const k = pages[this.page];
    const text = T(k);
    this.n = Math.min(text.length, this.n + dt * 45);
    outlinedText(ctx, T(this.key + '.title'), VW / 2, 70, 30, '#ffe14d');
    UI.panel(ctx, VW / 2 - 330, 110, 660, 250);
    setFont(ctx, 18, 600); ctx.fillStyle = '#fff'; ctx.textAlign = 'left'; ctx.textBaseline = 'top';
    wrapText(ctx, text.slice(0, Math.floor(this.n)), 620).forEach((l, i) => ctx.fillText(l, VW / 2 - 310, 130 + i * 26));
    outlinedText(ctx, `${this.page + 1}/${pages.length}  ▶`, VW / 2 + 300, 380, 15, '#ffe14d', '#000', 'right');
    outlinedText(ctx, T('ui_tap'), VW / 2, VH - 40, 15, '#ccc');
    let adv = Input.pressed('jump') || Input.pressed('confirm');
    for (const tp of UI.taps) adv = true;
    if (adv) {
      if (this.n < text.length) this.n = text.length;
      else { this.page++; this.n = 0; if (this.page >= pages.length) this.then(); }
    }
  },
  backAction() { this.then(); return true; },
};
const STORY = {
  story1: ['story1.0', 'story1.1', 'story1.2'],
  story2: ['story2.0', 'story2.1'],
  story3: ['story3.0', 'story3.1'],
  story4: ['story4.0', 'story4.1'],
  ending: ['ending.0', 'ending.1', 'ending.2', 'ending.3'],
};

// ======================= Final =======================
const ScreenEnding = {
  t: 0,
  draw(ctx, dt, S) {
    this.t += dt;
    drawMenuBg(ctx, dt, S, 0.7);
    const y = VH - this.t * 30;
    outlinedText(ctx, T('end_title'), VW / 2, y, 40, '#ffe14d');
    const balls = [['chulin', []], ['mexicano', []], ['aldeano', ['mayor']], ['aldeano', ['general']], ['aldeano', ['sunglasses']], ['aldeano', []]];
    balls.forEach(([b, a], i) => Art.ball(ctx, VW / 2 - 250 + i * 100, y + 90 + Math.abs(Math.sin(this.t * 3 + i)) * -14, 28, b, { acc: a, expr: 'happy', t: this.t, phi: Math.sin(this.t + i) * 0.6 }));
    drawCredits(ctx, y + 150);
    outlinedText(ctx, T('end_unlock'), VW / 2, y + 540, 17, '#2ecc71');
    outlinedText(ctx, T('end_thanks'), VW / 2, y + 600, 26, '#fff');
    if (this.t > 4) for (const tp of UI.taps) setScreen('title');
    if (y + 640 < 0) setScreen('title');
  },
  backAction() { setScreen('title'); return true; },
};

</script>
<script>/* js/main.js */
// Arranque, bucle principal, pantallas y progreso.
'use strict';

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let S = 1, screen = 'title', paused = false, lastT = 0, acc = 0;

function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const w = window.innerWidth, h = window.innerHeight;
  canvas.style.width = w + 'px'; canvas.style.height = h + 'px';
  canvas.width = Math.round(w * dpr); canvas.height = Math.round(h * dpr);
  VW = Math.max(640, Math.round(VH * (w / h)));
  S = canvas.height / VH;
}
window.addEventListener('resize', resize);

const SCREENS = { title: ScreenTitle, levels: ScreenLevels, chars: ScreenChars, shop: ScreenShop, options: ScreenOptions, result: ScreenResult, story: ScreenStory, ending: ScreenEnding };

function setScreen(name) {
  screen = name; paused = false; Input.showControls = false;
  if (name !== 'play' && name !== 'result') { Sfx.music('title'); }
  if (name === 'title') menuBg = null;
}

function startLevel(id, skipStory = false) {
  const def = LEVELS[id];
  const w = WORLDS.find((x) => x.levels.includes(id));
  const storyKey = 'story' + w.id;
  if (!skipStory && w.levels[0] === id && !Save.data.seen[storyKey]) {
    Save.see(storyKey);
    ScreenStory.key = storyKey; ScreenStory.page = 0; ScreenStory.n = 0;
    ScreenStory.then = () => startLevel(id, true);
    screen = 'story'; Sfx.music(def.music);
    return;
  }
  const lv = new Level(def);
  lv.onFinish = (r) => finishLevel(lv, r);
  lv.onRestart = () => startLevel(id, true);
  screen = 'play'; paused = false;
  Input.showControls = true;
}

function finishLevel(lv, r) {
  const d = Save.data, id = r.id, def = LEVELS[id];
  const first = !d.done[id];
  const unlocks = [];
  d.done[id] = true;
  if (!d.best[id] || r.time < d.best[id]) d.best[id] = r.time;
  d.coins[id] = Math.max(d.coins[id] || 0, r.coins);
  d.coinsEver += r.coins;
  if (id === '2-2' && !r.choked) d.ach.freshair = true;
  if (r.time < 60) d.ach.speedrunner = true;
  if (r.allCoins) d.ach.treasure = true;
  r.reward = r.coins + (first ? 25 : 5);
  d.wallet += r.reward;
  if (def.unlock) {
    for (const c of def.unlock.chars || []) if (!d.chars[c]) { d.chars[c] = true; unlocks.push(T('res_unlockChar') + ' ' + T('n_' + c)); }
    for (const a of def.unlock.abil || []) if (!d.abil[a]) { d.abil[a] = true; unlocks.push(T('res_unlockAbil_' + a)); }
  }
  if (id === '2-4' && !d.abil.elec) { d.abil.elec = true; }
  if (!d.chars.dorado && Save.totalCoins() >= 200) { d.chars.dorado = true; unlocks.push(T('res_unlockChar') + ' ' + T('n_dorado')); }
  const idx = LEVEL_ORDER.indexOf(id);
  if (LEVEL_ORDER[idx + 1] && first) unlocks.push(T('res_unlockLevel') + ' ' + LEVEL_ORDER[idx + 1]);
  Save.write();
  if (def.final) {
    const firstWin = !d.beaten;
    d.beaten = true; d.chars.volador = true; d.chars.electrico = true; Save.write(); PG.sync();
    ScreenStory.key = 'ending'; ScreenStory.page = 0; ScreenStory.n = 0;
    ScreenStory.then = () => { ScreenEnding.t = 0; screen = 'ending'; Sfx.music('ending'); };
    screen = 'story'; Sfx.music('ending'); Input.showControls = false;
    return;
  }
  PG.sync();
  ScreenResult.r = r; ScreenResult.unlocks = unlocks;
  screen = 'result'; Input.showControls = false;
  Sfx.music('title');
}

function frame(now) {
  requestAnimationFrame(frame);
  const dtReal = Math.min(0.1, (now - lastT) / 1000 || 0.016);
  lastT = now;
  ctx.setTransform(S, 0, 0, S, 0, 0);
  ctx.imageSmoothingEnabled = true;
  UI.taps = Input.consumeTaps().slice();
  Input.taps = UI.taps; // los NPC leen los toques
  UI.t += dtReal;
  if (screen === 'play' && G) {
    if (!paused) {
      if (Input.pressed('pause')) { paused = true; Sfx.suspend(); }
      acc += dtReal;
      let steps = 0;
      while (acc >= 1 / 60 && steps < 5) { G.update(1 / 60); acc -= 1 / 60; steps++; if (steps === 1) { Input.just = {}; Input.taps = []; } }
      if (acc > 0.1) acc = 0;
      if (steps === 0) { Input.taps = []; return; } // conserva lo presionado para el siguiente cuadro
    }
    ctx.setTransform(S, 0, 0, S, 0, 0);
    G.draw(ctx, S);
    G.drawHUD(ctx);
    Input.avail.melee = G.abil.melee; Input.avail.swap = G.player.weapons.length > 1;
    if (!paused && !G.dialog && G.state === 'play') Input.drawControls(ctx);
    if (paused) { Input.taps = []; ScreenPause.draw(ctx); }
  } else {
    const sc = SCREENS[screen];
    sc.draw(ctx, dtReal, S);
  }
  // aviso de girar el teléfono
  if (window.innerHeight > window.innerWidth * 1.05) {
    ctx.setTransform(S, 0, 0, S, 0, 0);
    ctx.fillStyle = 'rgba(0,0,0,0.85)'; ctx.fillRect(0, 0, VW, VH);
    outlinedText(ctx, '⟳', VW / 2, VH / 2 - 40, 60, '#ffe14d');
    outlinedText(ctx, T('ui_rotate'), VW / 2, VH / 2 + 30, 24, '#fff');
  }
  Input.endFrame();
}

// Integración con Android
window.onBackButton = function () {
  if (screen === 'play') { if (paused) { paused = false; Sfx.resume(); } else { paused = true; Sfx.suspend(); } return true; }
  const sc = SCREENS[screen];
  return sc && sc.backAction ? sc.backAction() : false;
};
window.onAppPause = function () { if (screen === 'play') paused = true; Sfx.suspend(); };
window.onAppResume = function () { if (screen !== 'play' || !paused) Sfx.resume(); };
document.addEventListener('visibilitychange', () => { if (document.hidden) window.onAppPause(); else window.onAppResume(); });

function boot() {
  Save.load();
  PG.sync();
  setLang(Save.data.lang || detectLang());
  Sfx.setOptions(Save.data.sound, Save.data.music);
  Input.aimMode = Save.data.aim || 'drag';
  resize();
  Input.init(canvas);
  Sfx.music('title');
  // modo prueba: index.html?level=1-2
  const q = new URLSearchParams(location.search);
  if (q.get('level')) startLevel(q.get('level'), true);
  requestAnimationFrame(frame);
}
boot();

</script>
