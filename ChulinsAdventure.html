<script>/* js/util.js */
// Utilidades generales y constantes del juego.
'use strict';

const TILE = 32;      // tamaño de un bloque en unidades lógicas
const VH = 480;       // alto lógico de la pantalla (el ancho depende del celular)
let VW = 854;         // se recalcula en main.js según la proporción de la pantalla

const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const approach = (v, t, d) => (v < t ? Math.min(v + d, t) : Math.max(v - d, t));
const rand = (a, b) => a + Math.random() * (b - a);
const randi = (a, b) => Math.floor(rand(a, b + 1));
const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
const sign = (v) => (v < 0 ? -1 : v > 0 ? 1 : 0);
const dist = (ax, ay, bx, by) => Math.hypot(bx - ax, by - ay);
const TAU = Math.PI * 2;

// Generador pseudoaleatorio con semilla (para dibujos que deben verse siempre igual).
function mulberry32(seed) {
  let a = seed >>> 0;
  return function () {
    a |= 0; a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
// Hash entero -> [0,1)
function hash1(n) {
  let x = Math.sin(n * 127.1 + 311.7) * 43758.5453;
  return x - Math.floor(x);
}

function overlap(a, b) {
  return Math.abs(a.x - b.x) < a.hw + b.hw && Math.abs(a.y - b.y) < a.hh + b.hh;
}

function easeOutBack(t) {
  const c1 = 1.70158, c3 = c1 + 1;
  return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2);
}

function fmtTime(s) {
  s = Math.max(0, Math.ceil(s));
  return String(s);
}

// Texto con contorno (estilo caricatura)
function outlinedText(ctx, text, x, y, size, fill = '#fff', stroke = '#000', align = 'center', weight = 900) {
  ctx.font = `${weight} ${size}px "Trebuchet MS", "Segoe UI", Roboto, Arial, sans-serif`;
  ctx.textAlign = align;
  ctx.textBaseline = 'middle';
  ctx.lineJoin = 'round';
  ctx.lineWidth = Math.max(2, size * 0.18);
  ctx.strokeStyle = stroke;
  ctx.strokeText(text, x, y);
  ctx.fillStyle = fill;
  ctx.fillText(text, x, y);
}

function setFont(ctx, size, weight = 700) {
  ctx.font = `${weight} ${size}px "Trebuchet MS", "Segoe UI", Roboto, Arial, sans-serif`;
}

// Parte un texto en líneas que caben en un ancho dado.
function wrapText(ctx, text, maxW) {
  // Corta por palabras; si una "palabra" no cabe (japonés, chino...), corta por letras.
  const lines = [];
  let line = '';
  const push = (piece, sep) => {
    const test = line ? line + sep + piece : piece;
    if (ctx.measureText(test).width > maxW && line) { lines.push(line.trimEnd()); line = piece; }
    else line = test;
  };
  for (const w of text.split(' ')) {
    if (ctx.measureText(w).width > maxW) {
      for (const ch of w) push(ch, '');
      line += ' ';
    } else push(w, line && !line.endsWith(' ') ? ' ' : '');
  }
  if (line.trim()) lines.push(line.trim());
  return lines;
}

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

};
const STR = {};
let LANG = 'es';

function T(k) {
  const a = STR[LANG];
  if (a && a[k] != null) return a[k];
  if (STR.en && STR.en[k] != null) return STR.en[k];
  if (STR.es && STR.es[k] != null) return STR.es[k];
  return k;
}
function setLang(c) { if (LANGS[c]) LANG = c; document.documentElement.lang = LANG; }
function detectLang() {
  const list = (navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || 'es']);
  for (const l of list) { const c = String(l).toLowerCase().slice(0, 2); if (LANGS[c]) return c; }
  return 'en';
}

  desc_chulin: 'Chulin es el protagonista principal del juego: es valiente, se preocupa por los demás y es muy amable. Todos lo aman. Su mejor amigo es Mexicano. Se le salió un ojo en una aventura y se lo reemplazaron por uno de oro que le regalaron. Usa una pequeña pistola amarilla.',
  desc_mexicano: 'Mexicano es el mejor amigo de Chulin. En la misma aventura en la que Chulin perdió el ojo izquierdo, él perdió el derecho, pero a él no le regalaron nada, así que solo usa un parche. Se dibujó un ojo en la espalda para que "los demás piensen que los está viendo por todos lados", sin saber que está demasiado deforme. Usa rifles de verdad.',
  desc_dorado: 'Una versión dorada y brillante de Chulin. Tiene un corazón extra. Se desbloquea al juntar 200 monedas en total (contando el récord de cada nivel).',
  desc_volador: 'Un Secuaz con mochila cohete. Después de la derrota del Imperialista decidió cambiar de bando. Mantén ⤒ en el aire para volar un rato.',
  desc_aldeano: 'Los aldeanos de Villa del Sol: countryballs blancos, tranquilos y amables. Muchos fueron secuestrados por los Secuaces.',
  desc_alcalde: 'El alcalde de Villa del Sol. Fue encerrado en una jaula por los Secuaces, pero Chulin lo rescató y lo acompaña en su aventura.',
  desc_militar: 'Los aldeanos de la Ciudad de Altos Militares llevan gorra verde. Eran los más poderosos de todas las villas... hasta que los esposaron.',
  desc_general: 'El líder de la Ciudad de Altos Militares. Le da las órdenes a Chulin para liberar la ciudad. Le gusta poner a prueba a los demás.',
  desc_playista: 'Los aldeanos de Isla Cacionesvaca siempre llevan anteojos de sol. Saben muchos secretos del mar.',
  desc_esclavo: 'Aldeanos de todos los pueblos, llevados como esclavos a Ciudad Sulu para servir al Imperialista.',
  desc_comun: 'Countryballs nunca antes vistos, de ojos rojos, con una estrella roja y una pistola azul. Aman reinar.',
  desc_guard: 'El primer Secuaz que Chulin enfrentó: un guardia que cuidaba a los demás mientras quemaban Villa del Sol.',
  desc_gigante: 'Un Secuaz enorme con lanzallamas. ¡No te le acerques mucho!',
  desc_jefe: 'Jefe de Operaciones: más grande que un gigante y con gorra de policía. Cuida cada castillo del Imperialista.',
  desc_acuatico: 'Secuaces con goggles que nadan y lanzan pirañas en llamas. Dicen que la electricidad y el agua no se llevan bien...',
  desc_dorado_s: 'Secuaces de élite de Ciudad Sulu. Vuelan mucho mejor y más controlado que los voladores, y llevan rifles.',
  desc_militarOp: 'En Ciudad Sulu, los Jefes de Operaciones ascienden a Militares de Operaciones: ¡el triple de grandes!',
  desc_imperialista: 'El líder de los Secuaces. Lleva una corona dorada y quiere apoderarse del mundo entero. Ama reinar.',

  // ---- Historia entre mundos ----
  'story1.title': 'Mundo 1: Villa del Sol',
  'story1.0': 'Era un día como cualquier otro. Chulin salió a pasear por su comunidad, Villa del Sol, con su pequeña pistola amarilla de siempre.',
  'story1.1': 'Pero algo raro había en el aire... olía a humo.',
  'story1.2': 'Sin saberlo, Chulin estaba a punto de comenzar la aventura más grande de su vida.',
  'story2.title': 'Mundo 2: Ciudad de Altos Militares',
  'story2.0': 'Tras liberar Villa del Sol, Chulin y Mexicano zarparon hacia la siguiente aldea: la Ciudad de Altos Militares, los más poderosos de todas las villas.',
  'story2.1': 'Pero al llegar, los rascacielos ardían y los aldeanos estaban esposados.',
  'story3.title': 'Mundo 3: Isla Cacionesvaca',
  'story3.0': 'Persiguiendo a los Secuaces por el agua, Chulin llegó a Isla Cacionesvaca, formada por pequeñas islas.',
  'story3.1': 'Ahí aparecieron más Secuaces Acuáticos... y un nuevo tipo: el Secuaz Volador.',
  'story4.title': 'Mundo 4: Ciudad Sulu',
  'story4.0': 'Millones de castillos volaban por el cielo, todos hacia Ciudad Sulu, la ciudad más importante.',
  'story4.1': 'Ahora todo ahí es castillo. Chulin ya no enfrenta niveles: debe explorar los castillos, los fragmentos de ciudades robadas... y encontrar el Cristal Eléctrico Dorado.',
  'ending.title': 'Epílogo',
  'ending.0': 'Con el Imperialista derrotado, los castillos comenzaron a caer del cielo como hojas secas.',
  'ending.1': 'Los aldeanos de todos los pueblos fueron liberados y regresaron a sus hogares: Villa del Sol, la Ciudad de Altos Militares e Isla Cacionesvaca.',
  'ending.2': 'Chulin volvió a ser el de siempre. El Secuaz Volador, arrepentido, decidió unirse a los buenos.',
  'ending.3': 'Pero cuando Chulin volteó para celebrar con su mejor amigo... Mexicano no estaba. ¿A dónde habrá ido? Continuará...',

  // ---- Diálogos ----
  'crystal.0': '¡Un Cristal Eléctrico! Se siente... poderoso.', 'crystal.1': 'Dicen que hay uno en cada castillo, compa.', 'crystal.2': 'Lo guardaré. Algo me dice que lo vamos a necesitar.',

  '1-1.guard.0': '¡Alto ahí! Nadie interrumpe las órdenes del Imperialista.', '1-1.guard.1': '¿Imperia-qué? ¡Deja a mis vecinos en paz!', '1-1.guard.2': 'Jeje... ya es demasiado tarde.',

  '1-2.start.3': 'Toma, traje rifles. ¡Funcionan como unos de verdad! ¡Vamos juntos!', '1-2.start.4': '¡Así se habla!', '1-2.start.5': '¡Mexicano se unió! Ahora es un personaje jugable.',
  '1-2.npc1.0': 'Los árboles se secaron por el fuego...', '1-2.npc1.1': 'Ten cuidado, dejaron pinchos, minas y bombas por todos lados.',
  '1-2.giant.0': '¡¡A QUEMAAAR!!', '1-2.giant.1': '¡Ese Secuaz es GIGANTE! ¡Y trae lanzallamas!', '1-2.giant.2': '¡Más grande es la caída!',
  '1-2.giantEnd.0': '¡Ese sí estaba grandote!', '1-2.giantEnd.1': 'Sigamos. Tenemos que encontrar a los demás.',
  '1-3.start.0': '¿Plataformas voladoras? Esto es tecnología de los Secuaces...', '1-3.start.1': '¿Y si nos caemos?', '1-3.start.2': 'Pues... no nos caigamos.',
  '1-3.mayor.0': '¡Chulin! ¡Me rescataste!', '1-3.mayor.1': '¡Alcalde! ¿Está bien?', '1-3.mayor.2': 'Los Secuaces construyeron un castillo al final de la aldea. Ahí tienen a su jefe.',
  '1-3.mayor.3': 'Yo conozco el camino. ¡Te acompaño!', '1-3.mayor.4': '¡Vamos por ese castillo!',

  '1-4.boss.0': 'Soy el Jefe de Operaciones de esta zona.', '1-4.boss.1': 'El Imperialista no tolera fracasos... ¡así que no fallaré!', '1-4.boss.2': '¡Devuelve a los aldeanos!', '1-4.boss.3': '¡A él, compa!',
  '1-4.bossEnd.0': 'N-no puede ser... el Imperialista se enterará de esto...', '1-4.bossEnd.1': '¡Villa del Sol es libre otra vez!',
  '1-5.start.0': 'La aldea volvió a la normalidad. ¡Todos están de fiesta!', '1-5.start.1': '¡Junta todas las monedas que puedas!',

  '1-5.mayor.0': '¡Gracias por salvarnos, Chulin!', '1-5.mayor.1': 'Pero los Secuaces vinieron del mar... y se llevaron gente hacia la Ciudad de Altos Militares.',

  '1-6.start.0': '¡Todos a bordo! El barco nos llevará a la Ciudad de Altos Militares.', '1-6.start.1': '¡Al mar!', '1-6.start.2': 'Ojalá no me maree...',
  '1-6.ambush.0': '¡Secuaces en los barcos!', '1-6.ambush.1': '¡No nos van a detener!',

  desc_chulin: "Chulin is the main hero of the game: he's brave, cares about others and is very kind. Everyone loves him. His best friend is Mexicano. He lost an eye in an adventure and it was replaced by a golden one he was given as a gift. He uses a small yellow pistol.",
  desc_mexicano: 'Mexicano is Chulin\'s best friend. In the same adventure where Chulin lost his left eye, he lost his right one, but nobody gave him anything, so he just wears an eyepatch. He drew an eye on his back so that "others think he\'s watching them from everywhere", not knowing it came out way too deformed. He uses real rifles.',
  desc_dorado: 'A shiny golden version of Chulin. He has one extra heart. Unlocked by collecting 200 coins in total (counting the record of each level).',
  desc_volador: "A Henchman with a jetpack. After the Imperialist's defeat he decided to switch sides. Hold ⤒ in the air to fly for a while.",
  desc_aldeano: 'The villagers of Sun Village: white countryballs, calm and kind. Many were kidnapped by the Henchmen.',
  desc_alcalde: 'The mayor of Sun Village. The Henchmen locked him in a cage, but Chulin rescued him and he joins him on his adventure.',
  desc_militar: 'The villagers of High Military City wear green caps. They were the most powerful of all the villages... until they got handcuffed.',
  desc_general: 'The leader of High Military City. He gives Chulin orders to free the city. He likes putting others to the test.',
  desc_playista: 'The villagers of Cacionesvaca Island always wear sunglasses. They know many secrets of the sea.',
  desc_esclavo: 'Villagers from every town, taken as slaves to Sulu City to serve the Imperialist.',
  desc_comun: 'Never-before-seen countryballs with red eyes, a red star and a blue pistol. They love to rule.',
  desc_guard: 'The first Henchman Chulin ever faced: a guard watching over the others while they burned Sun Village.',
  desc_gigante: "A huge Henchman with a flamethrower. Don't get too close!",
  desc_jefe: "Chief of Operations: bigger than a giant and wearing a police cap. He guards each of the Imperialist's castles.",
  desc_acuatico: "Henchmen with goggles who swim and throw flaming piranhas. They say electricity and water don't mix...",
  desc_dorado_s: 'Elite Henchmen of Sulu City. They fly much better and with more control than the flying ones, and carry rifles.',
  desc_militarOp: 'In Sulu City, Chiefs of Operations get promoted to Military of Operations: three times as big!',
  desc_imperialista: 'The leader of the Henchmen. He wears a golden crown and wants to take over the whole world. He loves to rule.',

  'story1.title': 'World 1: Sun Village',
  'story1.0': 'It was a day like any other. Chulin went out for a walk around his community, Sun Village, with his trusty little yellow pistol.',
  'story1.1': 'But there was something strange in the air... it smelled like smoke.',
  'story1.2': 'Without knowing it, Chulin was about to begin the greatest adventure of his life.',
  'story2.title': 'World 2: High Military City',
  'story2.0': 'After freeing Sun Village, Chulin and Mexicano set sail for the next town: High Military City, home of the most powerful of all the villages.',
  'story2.1': 'But when they arrived, the skyscrapers were burning and the villagers were in handcuffs.',
  'story3.title': 'World 3: Cacionesvaca Island',
  'story3.0': 'Chasing the Henchmen across the water, Chulin reached Cacionesvaca Island, made of tiny islands.',
  'story3.1': 'More Aquatic Henchmen showed up there... and a new kind: the Flying Henchman.',
  'story4.title': 'World 4: Sulu City',
  'story4.0': 'Millions of castles were flying across the sky, all heading to Sulu City, the most important city of all.',
  'story4.1': "Now everything there is castles. Chulin doesn't face levels anymore: he must explore the castles, the pieces of stolen cities... and find the Golden Electric Crystal.",
  'ending.title': 'Epilogue',
  'ending.0': 'With the Imperialist defeated, the castles began to fall from the sky like dry leaves.',
  'ending.1': 'The villagers of every town were freed and went back home: Sun Village, High Military City and Cacionesvaca Island.',
  'ending.2': 'Chulin went back to being his usual self. The Flying Henchman, sorry for what he did, decided to join the good guys.',
  'ending.3': 'But when Chulin turned around to celebrate with his best friend... Mexicano was gone. Where could he be? To be continued...',

  'crystal.0': 'An Electric Crystal! It feels... powerful.', 'crystal.1': "They say there's one in every castle, buddy.", 'crystal.2': "I'll keep it. Something tells me we're going to need it.",
  '1-1.start.0': 'What a great day for a walk around Sun Village!', '1-1.start.1': "I'll go say hi to the neighbors.",
  '1-1.smoke.0': 'Huh? Smoke?', '1-1.smoke.1': 'The village is on fire?!',
  '1-1.who.0': "Who are they? I've never seen countryballs like that...", '1-1.who.1': "Red eyes and blue pistols! They're attacking the village!",
  '1-1.guard.0': 'Halt! Nobody interrupts the orders of the Imperialist.', '1-1.guard.1': 'Imperia-what? Leave my neighbors alone!', '1-1.guard.2': "Heh... it's already too late.",
  '1-1.guardEnd.0': 'Phew... where did the others go?', '1-1.guardEnd.1': "There's nobody left... they took the villagers.",
  '1-1.villager.0': "Chulin! Thank goodness you're okay!", '1-1.villager.1': 'What happened here? Who were they?',
  '1-1.villager.2': 'They call them Henchmen... they burned the houses and took a lot of people.', '1-1.villager.3': "They say there's an Imperialist who wants to take over the world.",
  '1-1.villager.4': "Then I'll have to stop him. I'm going to investigate!",
  '1-2.start.0': 'CHULIN! Finally, I found you, buddy!', '1-2.start.1': 'Mexicano! Are you okay?', '1-2.start.2': 'I hid when the Henchmen came. I saw where they took everyone.',
  '1-2.start.3': "Here, I brought rifles. They work like real ones! Let's go together!", '1-2.start.4': "That's the spirit!", '1-2.start.5': 'Mexicano joined you! He is now a playable character.',
  '1-2.npc1.0': 'The trees dried up from the fire...', '1-2.npc1.1': 'Be careful, they left spikes, mines and bombs everywhere.',
  '1-2.giant.0': 'BUUUURN!!', '1-2.giant.1': "That Henchman is GIANT! And he's got a flamethrower!", '1-2.giant.2': 'The bigger they are, the harder they fall!',
  '1-2.giantEnd.0': 'That one was HUGE!', '1-2.giantEnd.1': "Let's keep going. We have to find the others.",
  '1-3.start.0': 'Flying platforms? This is Henchman technology...', '1-3.start.1': 'What if we fall?', '1-3.start.2': "Well... let's not fall.",
  '1-3.mayor.0': 'Chulin! You rescued me!', '1-3.mayor.1': 'Mayor! Are you okay?', '1-3.mayor.2': 'The Henchmen built a castle at the end of the village. Their boss is there.',
  '1-3.mayor.3': "I know the way. I'll come with you!", '1-3.mayor.4': "Let's go get that castle!",
  '1-4.start.0': 'This is the castle. Careful: there are fake paths, lava and saws.', '1-4.start.1': 'And portals that take you to random places...', '1-4.start.2': "I'm not afraid of anything. Forward!",
  '1-4.portal.0': 'A wall? Which way now?', '1-4.portal.1': 'That portal... it could take us anywhere. We have to risk it!',
  '1-4.boss.0': "I'm the Chief of Operations of this area.", '1-4.boss.1': "The Imperialist doesn't tolerate failure... so I won't fail!", '1-4.boss.2': 'Give the villagers back!', '1-4.boss.3': 'Get him, buddy!',
  '1-4.bossEnd.0': "N-no way... the Imperialist will hear about this...", '1-4.bossEnd.1': 'Sun Village is free again!',
  '1-5.start.0': "The village is back to normal. Everyone's partying!", '1-5.start.1': 'Collect as many coins as you can!',
  '1-5.npc1.0': "Chulin, you're a hero!", '1-5.npc1.1': 'I just did the right thing.',
  '1-5.npc2.0': 'My house is no longer on fire! Thank you, thank you, thank you!',
  '1-5.npc3.0': "Mexicano, you're a hero too!", '1-5.npc3.1': 'I know! Well... thanks.',
  '1-5.mayor.0': 'Thank you for saving us, Chulin!', '1-5.mayor.1': 'But the Henchmen came from the sea... and they took people towards High Military City.',
  '1-5.mayor.2': 'They were the most powerful of all the villages. If they got attacked, this is very serious.', '1-5.mayor.3': "Then we'll go there.", '1-5.mayor.4': 'Get the ship ready, Mayor!',
  '1-6.start.0': 'All aboard! The ship will take us to High Military City.', '1-6.start.1': 'To the sea!', '1-6.start.2': "I hope I don't get seasick...",
  '1-6.ambush.0': 'Henchmen on the ships!', '1-6.ambush.1': "They won't stop us!",
  '1-6.end.0': "There's High Military City... but there's a lot of smoke.", '1-6.end.1': "Something bad happened. Let's go.",
  '2-1.start.0': 'The city... the villagers are handcuffed!', '2-1.start.1': 'They even beat the High Military...',
  '2-1.npc1.0': 'They handcuffed us... us, the High Military!', '2-1.npc1.1': 'Find the General. He will know what to do.',
  '2-1.npc2.0': 'My green cap... it was the pride of the city... waaah...',
  '2-1.general.0': "You're Chulin? I heard you freed Sun Village.", '2-1.general.1': 'Yes. What happened here?',
  '2-1.general.2': 'The Henchmen set the skyscrapers on fire. Free the city: climb the buildings and reach their castle.',
  '2-1.general.3': "But shooting isn't enough here. I'll teach you to fight up close!", '2-1.general.4': 'You learned Melee! Tap the fist button to punch.',
  '2-2.start.0': 'The skyscrapers are on fire. Jump from roof to roof.', '2-2.start.1': "It's so high!",
  '2-2.smoke.0': "*cough cough* So much smoke! If I stay close for too long, I'll choke...", '2-2.smoke.1': "Don't stay in the smoke, buddy. It makes you slow!",
  '2-3.start.0': "More smoke... we have to go through fast.", '2-3.start.1': "We're almost at the castle!",
  '2-4.start.0': "This castle is a tower. You'll have to climb all of it.", '2-4.start.1': 'And find the key that protects the Chief.',
  '2-4.boss.0': 'How did you get up here?!', '2-4.boss.1': 'This city belongs to the Imperialist!', '2-4.boss.2': 'Not anymore!',
  '2-4.bossEnd.0': "Take it... the city's key... heh heh...", '2-4.bossEnd.1': 'Chulin got the ELECTRIC PISTOL! (switch with ⟳)', '2-4.bossEnd.2': 'An electric pistol!',
  '2-4.cutkey.0': 'The key is cut in two!', '2-4.cutkey.1': 'What if we glue it with bubblegum?', '2-4.cutkey.2': 'I have a better idea... shoot it with the electric pistol!',
  '2-4.keyElec.0': 'The electricity fused it! Now it works!', '2-4.keyElec.1': 'Whoa... grab it!',
  '2-4.free.0': 'The handcuffs opened! The city is free!', '2-4.free.1': 'We did it!',
  '2-5.start.0': 'The city is celebrating! Enjoy, Chulin.', '2-5.start.1': 'Coins everywhere!',
  '2-5.npc1.0': 'Thanks for freeing us! Take all the coins you want.',
  '2-5.npc2.0': 'Long live Chulin!', '2-5.npc2.1': 'What about me? Nobody says "long live Mexicano"?',
  '2-5.ambush.0': 'SOLDIERS! ATTACK CHULIN!', '2-5.ambush.1': 'What?! Why are you attacking me?!', '2-5.ambush.2': 'It was a trap!',
  '2-5.test.0': 'Hahaha, relax, Chulin. It was a test.', '2-5.test.1': 'We wanted to see if you were truly worthy of helping us. And you are!',
  '2-5.test.2': '...a test?', '2-5.test.3': "Heh! This one's coming with me!", '2-5.test.4': 'AAAH! HELP!', '2-5.test.5': 'GENERAL! After him!',
  '2-6.start.0': "He's taking him across the water!", '2-6.start.1': 'You have to catch him, buddy!',
  '2-6.kidnap.0': "You'll never catch me! Piranhas, attack!", '2-6.kidnap.1': 'Chulin, help me!',
  '2-6.piranha.0': 'Look, buddy! Shooting the water with the electric pistol fries the piranhas. Catch one and you get an electric shield!',
  '2-6.end.0': 'You saved me again! You truly are worthy.', '2-6.end.1': 'Where were they taking everyone?', '2-6.end.2': "Past the sea lies Cacionesvaca Island. The Henchmen are heading there.",
  '3-1.start.0': 'Cacionesvaca Island: tiny islands, sun and water everywhere.', '3-1.start.1': 'Vacation! ...well, no.',
  '3-1.npc1.0': 'Welcome to Cacionesvaca Island, friend!', '3-1.npc1.1': 'Be careful: the water is full of Aquatic Henchmen.',
  '3-1.npc2.0': 'There are flaming piranhas!', '3-1.npc2.1': "They say electricity and water don't mix... for the Henchmen.",
  '3-1.npc3.0': "Shoot the water with the electric pistol and you'll see. It's the oldest trick on the island.",
  '3-2.start.0': 'Flying Henchmen?!', '3-2.start.1': "They've got jetpacks! Aim up!",
  '3-2.npc1.0': "They put saws all over the beach... you can't even sunbathe anymore.",
  '3-3.start.0': "The reef. We're almost at the island's castle.", '3-3.start.1': "Let's go.",
  '3-4.start.0': "The island's castle... why does it have such a huge chain?", '3-4.start.1': "I don't like this at all.",
  '3-4.boss.0': "You're too late, Chulin!", '3-4.boss.1': "The Imperialist's plan has already begun...", '3-4.boss.2': "I'll stop it!",
  '3-4.bossEnd.0': 'Heh heh... look up.', '3-4.bossEnd.1': "What's that noise?",
  '3-4.lift.0': 'The castle was attached to a giant chain... and a HUGE airship started carrying it away!', '3-4.lift.1': 'Look at the sky! There are millions of flying castles!',
  '3-4.lift.2': "They're all going to the same place...", '3-4.lift.3': 'Sulu City. The most important city.', '3-4.lift.4': "Then let's go after them!",
  '3-5.start.0': 'We have to follow the castles through the sky.', '3-5.start.1': "Don't look down, don't look down...",
  '3-5.end.0': 'This is... Sulu City.', '3-5.end.1': "It's all castles... and look at all those villagers...", '3-5.end.2': "They brought them as slaves. It's over, Imperialist!",
  '4-1.start.0': 'Villagers from every town, taken as slaves. Pieces of stolen cities. Castles everywhere.', '4-1.start.1': "Here everyone's a Chief of Operations...", '4-1.start.2': "And we're Chulin and Mexicano. Let's go!",
  '4-1.npc1.0': 'They brought us from Sun Village... we work day and night...', '4-1.npc1.1': 'They say the Imperialist is at the very top.',
  '4-1.npc2.0': 'Watch out for the Golden Henchmen! They fly way better than the others.',
  '4-1.npc3.0': 'A Military of Operations guards the Golden Electric Crystal.', '4-1.npc3.1': 'Then that crystal is the key.',
  '4-1.militar.0': "I'm a MILITARY of Operations. Three times bigger than a Chief!", '4-1.militar.1': "He's enormous!", '4-1.militar.2': "I don't care how big he is!",
  '4-1.transform.0': 'This energy... is incredible...', '4-1.transform.1': "Now, Imperialist. I'm coming for you.",
  '4-2.start.0': "The tallest castle. He's up there.",
  '4-3.start.0': 'This is the end of the road.',
  '4-3.boss.0': "So you're the one who ruined all my operations.", '4-3.boss.1': 'I love to rule! And I will rule the whole world!', '4-3.boss.2': "It's over, Imperialist.", '4-3.boss.3': "We'll see about that.",
  '4-3.phase2.0': 'GOLDEN HENCHMEN! PROTECT YOUR KING!',
  '4-3.phase3.0': 'No... how is this possible?!', '4-3.phase3.1': 'Give up!',
  '4-3.end.0': 'My... kingdom...', '4-3.end.1': "The villagers are free. And you won't rule over anyone anymore.",
  '4-3.end.2': 'The airships fell. The chains broke.', '4-3.end.3': 'The castles started to crumble...', '4-3.end.4': 'Chulin saved the world!',
  cr_by: 'Created by', cr_studio: 'Studio', cr_owned: 'Part of', cr_rights: 'Character rights', t_bossRetry: 'The boss fight restarts. Try again!',
  opt_aim: 'Aim', aim_drag: 'drag the shoot button', aim_stick: 'extra joystick', t_fly: 'Flight',
  desc_electrico: 'Chulin after touching the Golden Electric Crystal. He becomes a supreme being: bigger, faster, with 6 hearts, a short flight (hold ⤒ in the air) and electric bolts.',

  mx_0: 'Vamos, parceiro!', mx_1: 'Eu te cubro!', mx_2: 'Esse Imperialista não sabe com quem se meteu.', mx_3: 'Viu o olho nas minhas costas? Estou te vendo.', mx_4: 'Estou com fome... tem tacos por aqui?',

  desc_chulin: 'Chulin é o protagonista do jogo: é corajoso, se preocupa com os outros e é muito gentil. Todos o amam. Seu melhor amigo é o Mexicano. Ele perdeu um olho numa aventura e ganhou de presente um olho de ouro. Usa uma pequena pistola amarela.',
  desc_mexicano: 'Mexicano é o melhor amigo do Chulin. Na mesma aventura em que Chulin perdeu o olho esquerdo, ele perdeu o direito, mas ninguém lhe deu nada, então ele só usa um tapa-olho. Desenhou um olho nas costas para que "os outros pensem que ele está vendo tudo", sem saber que ficou deformado demais. Usa rifles de verdade.',
  desc_dorado: 'Uma versão dourada e brilhante do Chulin. Tem um coração extra. Desbloqueado ao juntar 200 moedas no total (contando o recorde de cada fase).',
  desc_volador: 'Um Capanga com mochila a jato. Depois da derrota do Imperialista, decidiu mudar de lado. Segure ⤒ no ar para voar um pouco.',
  desc_aldeano: 'Os aldeões da Vila do Sol: countryballs brancas, calmas e gentis. Muitos foram sequestrados pelos Capangas.',
  desc_alcalde: 'O prefeito da Vila do Sol. Foi preso numa jaula pelos Capangas, mas Chulin o resgatou e ele o acompanha na aventura.',
  desc_militar: 'Os aldeões da Cidade dos Altos Militares usam boné verde. Eram os mais poderosos de todas as vilas... até serem algemados.',
  desc_general: 'O líder da Cidade dos Altos Militares. Dá as ordens ao Chulin para libertar a cidade. Gosta de testar os outros.',
  desc_playista: 'Os aldeões da Ilha Cacionesvaca sempre usam óculos escuros. Conhecem muitos segredos do mar.',
  desc_esclavo: 'Aldeões de todas as vilas, levados como escravos para a Cidade Sulu para servir o Imperialista.',
  desc_comun: 'Countryballs nunca vistas antes, de olhos vermelhos, com uma estrela vermelha e uma pistola azul. Adoram reinar.',
  desc_guard: 'O primeiro Capanga que Chulin enfrentou: um guarda que vigiava os outros enquanto queimavam a Vila do Sol.',
  desc_gigante: 'Um Capanga enorme com lança-chamas. Não chegue muito perto!',
  desc_jefe: 'Chefe de Operações: maior que um gigante e com boné de policial. Protege cada castelo do Imperialista.',
  desc_acuatico: 'Capangas de óculos de natação que nadam e lançam piranhas em chamas. Dizem que eletricidade e água não combinam...',
  desc_dorado_s: 'Capangas de elite da Cidade Sulu. Voam muito melhor e com mais controle que os voadores, e carregam rifles.',
  desc_militarOp: 'Na Cidade Sulu, os Chefes de Operações viram Militares de Operações: três vezes maiores!',
  desc_imperialista: 'O líder dos Capangas. Usa uma coroa dourada e quer dominar o mundo inteiro. Adora reinar.',
  lock_chulin: '', lock_mexicano: 'Desbloqueado na fase 1-2.', lock_dorado: 'Junte 200 moedas no total (recorde de cada fase).', lock_electrico: 'Termine o jogo.', lock_volador: 'Termine o jogo.',
  'story1.title': 'Mundo 1: Vila do Sol',
  'story1.0': 'Era um dia como qualquer outro. Chulin saiu para passear pela sua comunidade, a Vila do Sol, com sua pequena pistola amarela de sempre.',
  'story1.1': 'Mas havia algo estranho no ar... cheirava a fumaça.',
  'story1.2': 'Sem saber, Chulin estava prestes a começar a maior aventura da sua vida.',
  'story2.title': 'Mundo 2: Cidade dos Altos Militares',
  'story2.0': 'Depois de libertar a Vila do Sol, Chulin e Mexicano navegaram até a próxima vila: a Cidade dos Altos Militares, os mais poderosos de todas as vilas.',
  'story2.1': 'Mas ao chegar, os arranha-céus ardiam e os aldeões estavam algemados.',
  'story3.title': 'Mundo 3: Ilha Cacionesvaca',
  'story3.0': 'Perseguindo os Capangas pela água, Chulin chegou à Ilha Cacionesvaca, formada por pequenas ilhas.',
  'story3.1': 'Lá apareceram mais Capangas Aquáticos... e um novo tipo: o Capanga Voador.',
  'story4.title': 'Mundo 4: Cidade Sulu',
  'story4.0': 'Milhões de castelos voavam pelo céu, todos rumo à Cidade Sulu, a cidade mais importante.',
  'story4.1': 'Agora tudo ali é castelo. Chulin não enfrenta mais fases: precisa explorar os castelos, os pedaços de cidades roubadas... e encontrar o Cristal Elétrico Dourado.',
  'ending.title': 'Epílogo',
  'ending.0': 'Com o Imperialista derrotado, os castelos começaram a cair do céu como folhas secas.',
  'ending.1': 'Os aldeões de todas as vilas foram libertados e voltaram para casa: a Vila do Sol, a Cidade dos Altos Militares e a Ilha Cacionesvaca.',
  'ending.2': 'Chulin voltou a ser o de sempre. O Capanga Voador, arrependido, decidiu se juntar aos mocinhos.',
  'ending.3': 'Mas quando Chulin se virou para comemorar com seu melhor amigo... Mexicano não estava lá. Para onde ele terá ido? Continua...',
  'crystal.0': 'Um Cristal Elétrico! Parece... poderoso.', 'crystal.1': 'Dizem que há um em cada castelo, parceiro.', 'crystal.2': 'Vou guardar. Algo me diz que vamos precisar dele.',
  '1-1.start.0': 'Que dia lindo para passear pela Vila do Sol!', '1-1.start.1': 'Vou cumprimentar os vizinhos.',
  '1-1.smoke.0': 'Hã? Fumaça?', '1-1.smoke.1': 'A aldeia está pegando fogo?!',
  '1-1.who.0': 'Quem são esses? Nunca vi countryballs assim...', '1-1.who.1': 'Olhos vermelhos e pistolas azuis! Estão atacando a aldeia!',
  '1-1.guard.0': 'Alto lá! Ninguém interrompe as ordens do Imperialista.', '1-1.guard.1': 'Imperia-o-quê? Deixe meus vizinhos em paz!', '1-1.guard.2': 'Hehe... já é tarde demais.',
  '1-1.guardEnd.0': 'Ufa... para onde foram os outros?', '1-1.guardEnd.1': 'Não sobrou ninguém... levaram os aldeões.',
  '1-1.villager.0': 'Chulin! Graças aos céus você está bem!', '1-1.villager.1': 'O que aconteceu aqui? Quem eram aqueles?',
  '1-1.villager.2': 'Chamam eles de Capangas... queimaram as casas e levaram muita gente.', '1-1.villager.3': 'Dizem que há um Imperialista que quer dominar o mundo.',
  '1-1.villager.4': 'Então vou ter que detê-lo. Vou investigar!',
  '1-2.start.0': 'CHULIN! Finalmente te achei, parceiro!', '1-2.start.1': 'Mexicano! Você está bem?', '1-2.start.2': 'Me escondi quando os Capangas chegaram. Vi para onde levaram o pessoal.',
  '1-2.start.3': 'Toma, trouxe rifles. Funcionam como de verdade! Vamos juntos!', '1-2.start.4': 'É assim que se fala!', '1-2.start.5': 'Mexicano se juntou a você! Agora ele é um personagem jogável.',
  '1-2.npc1.0': 'As árvores secaram por causa do fogo...', '1-2.npc1.1': 'Cuidado, deixaram espinhos, minas e bombas por toda parte.',
  '1-2.giant.0': 'QUEIMAAAR!!', '1-2.giant.1': 'Esse Capanga é GIGANTE! E tem um lança-chamas!', '1-2.giant.2': 'Quanto maior, maior a queda!',
  '1-2.giantEnd.0': 'Esse era grandão mesmo!', '1-2.giantEnd.1': 'Vamos. Temos que encontrar os outros.',
  '1-3.start.0': 'Plataformas voadoras? Isso é tecnologia dos Capangas...', '1-3.start.1': 'E se a gente cair?', '1-3.start.2': 'Bom... vamos não cair.',
  '1-3.mayor.0': 'Chulin! Você me salvou!', '1-3.mayor.1': 'Prefeito! O senhor está bem?', '1-3.mayor.2': 'Os Capangas construíram um castelo no fim da aldeia. O chefe deles está lá.',
  '1-3.mayor.3': 'Eu conheço o caminho. Vou com você!', '1-3.mayor.4': 'Vamos para esse castelo!',
  '1-4.start.0': 'Este é o castelo. Cuidado: há caminhos falsos, lava e serras.', '1-4.start.1': 'E portais que levam a lugares aleatórios...', '1-4.start.2': 'Não tenho medo de nada. Em frente!',
  '1-4.portal.0': 'Uma parede? E agora, por onde?', '1-4.portal.1': 'Esse portal... pode nos levar a qualquer lugar. Temos que arriscar!',
  '1-4.boss.0': 'Sou o Chefe de Operações desta área.', '1-4.boss.1': 'O Imperialista não tolera fracassos... então não vou falhar!', '1-4.boss.2': 'Devolva os aldeões!', '1-4.boss.3': 'Pega ele, parceiro!',
  '1-4.bossEnd.0': 'N-não pode ser... o Imperialista vai saber disso...', '1-4.bossEnd.1': 'A Vila do Sol está livre de novo!',
  '1-5.start.0': 'A aldeia voltou ao normal. Todos estão em festa!', '1-5.start.1': 'Junte todas as moedas que puder!',
  '1-5.npc1.0': 'Chulin, você é um herói!', '1-5.npc1.1': 'Só fiz o que era certo.',
  '1-5.npc2.0': 'Minha casa não está mais pegando fogo! Obrigado, obrigado, obrigado!',
  '1-5.npc3.0': 'Mexicano, você também é um herói!', '1-5.npc3.1': 'Eu sei! Bom... obrigado.',
  '1-5.mayor.0': 'Obrigado por nos salvar, Chulin!', '1-5.mayor.1': 'Mas os Capangas vieram do mar... e levaram gente para a Cidade dos Altos Militares.',
  '1-5.mayor.2': 'Eles eram os mais poderosos de todas as vilas. Se foram atacados, isso é muito sério.', '1-5.mayor.3': 'Então vamos para lá.', '1-5.mayor.4': 'Prepare o barco, Prefeito!',
  '1-6.start.0': 'Todos a bordo! O barco vai nos levar à Cidade dos Altos Militares.', '1-6.start.1': 'Ao mar!', '1-6.start.2': 'Tomara que eu não enjoe...',
  '1-6.ambush.0': 'Capangas nos barcos!', '1-6.ambush.1': 'Eles não vão nos parar!',
  '1-6.end.0': 'Lá está a Cidade dos Altos Militares... mas tem muita fumaça.', '1-6.end.1': 'Algo ruim aconteceu. Vamos.',
  '2-1.start.0': 'A cidade... os aldeões estão algemados!', '2-1.start.1': 'Até os Altos Militares foram derrotados...',
  '2-1.npc1.0': 'Nos algemaram... a nós, os Altos Militares!', '2-1.npc1.1': 'Procure o General. Ele vai saber o que fazer.',
  '2-1.npc2.0': 'Meu boné verde... era o orgulho da cidade... buáá...',
  '2-1.general.0': 'Você é o Chulin? Ouvi dizer que libertou a Vila do Sol.', '2-1.general.1': 'Sim. O que aconteceu aqui?',
  '2-1.general.2': 'Os Capangas incendiaram os arranha-céus. Liberte a cidade: escale os prédios e chegue ao castelo deles.',
  '2-1.general.3': 'Mas aqui não basta atirar. Vou te ensinar a lutar corpo a corpo!', '2-1.general.4': 'Você aprendeu Corpo a Corpo! Toque no botão do punho para golpear.',
  '2-2.start.0': 'Os arranha-céus estão pegando fogo. Pule de telhado em telhado.', '2-2.start.1': 'Que alto!',
  '2-2.smoke.0': '*cof cof* Muita fumaça! Se eu ficar perto por muito tempo, vou sufocar...', '2-2.smoke.1': 'Não fique na fumaça, parceiro. Ela te deixa lento!',
  '2-3.start.0': 'Mais fumaça... temos que passar rápido.', '2-3.start.1': 'Estamos quase no castelo!',
  '2-4.start.0': 'Este castelo é uma torre. Você vai ter que escalar tudo.', '2-4.start.1': 'E encontrar a chave que protege o Chefe.',
  '2-4.boss.0': 'Como você chegou até aqui?!', '2-4.boss.1': 'Esta cidade pertence ao Imperialista!', '2-4.boss.2': 'Não mais!',
  '2-4.bossEnd.0': 'Toma... a chave da cidade... hehehe...', '2-4.bossEnd.1': 'Chulin conseguiu a PISTOLA ELÉTRICA! (troque com ⟳)', '2-4.bossEnd.2': 'Uma pistola elétrica!',
  '2-4.cutkey.0': 'A chave está partida em duas!', '2-4.cutkey.1': 'E se a gente colar com chiclete?', '2-4.cutkey.2': 'Tenho uma ideia melhor... atire nela com a pistola elétrica!',
  '2-4.keyElec.0': 'A eletricidade a uniu! Agora funciona!', '2-4.keyElec.1': 'Uau... pega ela!',
  '2-4.free.0': 'As algemas se abriram! A cidade está livre!', '2-4.free.1': 'Conseguimos!',
  '2-5.start.0': 'A cidade está em festa! Aproveite, Chulin.', '2-5.start.1': 'Moedas por todo lado!',
  '2-5.npc1.0': 'Obrigado por nos libertar! Pegue todas as moedas que quiser.',
  '2-5.npc2.0': 'Viva o Chulin!', '2-5.npc2.1': 'E eu? Ninguém diz "viva o Mexicano"?',
  '2-5.ambush.0': 'SOLDADOS! ATAQUEM O CHULIN!', '2-5.ambush.1': 'O quê?! Por que estão me atacando?!', '2-5.ambush.2': 'Era uma armadilha!',
  '2-5.test.0': 'Hahaha, calma, Chulin. Era um teste.', '2-5.test.1': 'Queríamos ver se você era mesmo digno de nos ajudar. E você é!',
  '2-5.test.2': '...um teste?', '2-5.test.3': 'Hehe! Este vem comigo!', '2-5.test.4': 'AAAH! SOCORRO!', '2-5.test.5': 'GENERAL! Atrás dele!',
  '2-6.start.0': 'Ele está levando o General pela água!', '2-6.start.1': 'Você tem que pegá-lo, parceiro!',
  '2-6.kidnap.0': 'Você nunca vai me pegar! Piranhas, ao ataque!', '2-6.kidnap.1': 'Chulin, me ajude!',
  '2-6.piranha.0': 'Olha, parceiro! Atirar na água com a pistola elétrica frita as piranhas. Pegue uma e você ganha um escudo elétrico!',
  '2-6.end.0': 'Você me salvou de novo! Você é digno de verdade.', '2-6.end.1': 'Para onde estavam levando as pessoas?', '2-6.end.2': 'Depois do mar fica a Ilha Cacionesvaca. Os Capangas estão indo para lá.',
  '3-1.start.0': 'Ilha Cacionesvaca: pequenas ilhas, sol e água por todo lado.', '3-1.start.1': 'Férias! ...bom, não.',
  '3-1.npc1.0': 'Bem-vindo à Ilha Cacionesvaca, amigo!', '3-1.npc1.1': 'Cuidado: a água está cheia de Capangas Aquáticos.',
  '3-1.npc2.0': 'Tem piranhas em chamas!', '3-1.npc2.1': 'Dizem que eletricidade e água não combinam... para os Capangas.',
  '3-1.npc3.0': 'Atire na água com a pistola elétrica e você vai ver. É o truque mais antigo da ilha.',
  '3-2.start.0': 'Capangas voando?!', '3-2.start.1': 'Eles têm mochilas a jato! Mire para cima!',
  '3-2.npc1.0': 'Colocaram serras por toda a praia... nem dá mais para tomar sol.',
  '3-3.start.0': 'O recife. Estamos quase no castelo da ilha.', '3-3.start.1': 'Vamos.',

  desc_chulin: 'Chulin est le héros du jeu : il est courageux, se soucie des autres et est très gentil. Tout le monde l\'aime. Son meilleur ami est Mexicano. Il a perdu un œil lors d\'une aventure et on lui a offert un œil en or pour le remplacer. Il utilise un petit pistolet jaune.',

  'story1.title': 'Monde 1 : Village du Soleil',

  '1-1.who.0': 'Qui sont-ils ? Je n\'ai jamais vu de countryballs comme ça...', '1-1.who.1': 'Des yeux rouges et des pistolets bleus ! Ils attaquent le village !',
  '1-1.guard.0': 'Halte ! Personne n\'interrompt les ordres de l\'Impérialiste.', '1-1.guard.1': 'L\'Impéria-quoi ? Laisse mes voisins tranquilles !', '1-1.guard.2': 'Héhé... c\'est déjà trop tard.',

  '1-1.villager.0': 'Chulin ! Dieu merci, tu vas bien !', '1-1.villager.1': 'Que s\'est-il passé ? Qui étaient-ils ?',

  '1-2.start.0': 'CHULIN ! Enfin je te trouve, mon pote !', '1-2.start.1': 'Mexicano ! Tu vas bien ?', '1-2.start.2': 'Je me suis caché quand les Sbires sont arrivés. J\'ai vu où ils ont emmené les gens.',

  '1-3.mayor.0': 'Chulin ! Tu m\'as sauvé !', '1-3.mayor.1': 'Monsieur le Maire ! Ça va ?', '1-3.mayor.2': 'Les Sbires ont construit un château au bout du village. Leur chef y est.',

  '1-4.bossEnd.0': 'N-non... l\'Impérialiste va l\'apprendre...', '1-4.bossEnd.1': 'Le Village du Soleil est de nouveau libre !',

  '2-1.npc1.0': 'Ils nous ont menottés... nous, les Hauts Militaires !', '2-1.npc1.1': 'Trouve le Général. Il saura quoi faire.',
  '2-1.npc2.0': 'Ma casquette verte... c\'était la fierté de la ville... ouiiin...',
  '2-1.general.0': 'Tu es Chulin ? J\'ai entendu dire que tu as libéré le Village du Soleil.', '2-1.general.1': 'Oui. Que s\'est-il passé ici ?',
  '2-1.general.2': 'Les Sbires ont incendié les gratte-ciel. Libère la ville : escalade les immeubles et atteins leur château.',
  '2-1.general.3': 'Mais ici, tirer ne suffit pas. Je vais t\'apprendre à te battre au corps à corps !', '2-1.general.4': 'Tu as appris le Corps à corps ! Touche le bouton du poing pour frapper.',
  '2-2.start.0': 'Les gratte-ciel sont en feu. Saute de toit en toit.', '2-2.start.1': 'C\'est haut !',
  '2-2.smoke.0': '*tousse tousse* Que de fumée ! Si je reste trop près, je vais étouffer...', '2-2.smoke.1': 'Ne reste pas dans la fumée, mon pote. Ça te ralentit !',
  '2-3.start.0': 'Encore de la fumée... il faut passer vite.', '2-3.start.1': 'On arrive presque au château !',
  '2-4.start.0': 'Ce château est une tour. Tu vas devoir l\'escalader entièrement.', '2-4.start.1': 'Et trouver la clé qui protège le Chef.',
  '2-4.boss.0': 'Comment es-tu arrivé jusqu\'ici ?!', '2-4.boss.1': 'Cette ville appartient à l\'Impérialiste !', '2-4.boss.2': 'Plus maintenant !',
  '2-4.bossEnd.0': 'Tiens... la clé de la ville... héhéhé...', '2-4.bossEnd.1': 'Chulin a obtenu le PISTOLET ÉLECTRIQUE ! (change avec ⟳)', '2-4.bossEnd.2': 'Un pistolet électrique !',
  '2-4.cutkey.0': 'La clé est coupée en deux !', '2-4.cutkey.1': 'Et si on la recollait avec du chewing-gum ?', '2-4.cutkey.2': 'J\'ai une meilleure idée... tire dessus avec le pistolet électrique !',
  '2-4.keyElec.0': 'L\'électricité l\'a ressoudée ! Maintenant elle marche !', '2-4.keyElec.1': 'Waouh... attrape-la !',
  '2-4.free.0': 'Les menottes se sont ouvertes ! La ville est libre !', '2-4.free.1': 'On a réussi !',
  '2-5.start.0': 'La ville fait la fête ! Profite, Chulin.', '2-5.start.1': 'Des pièces partout !',
  '2-5.npc1.0': 'Merci de nous avoir libérés ! Prends toutes les pièces que tu veux.',
  '2-5.npc2.0': 'Vive Chulin !', '2-5.npc2.1': 'Et moi ? Personne ne dit « vive Mexicano » ?',
  '2-5.ambush.0': 'SOLDATS ! ATTAQUEZ CHULIN !', '2-5.ambush.1': 'Quoi ?! Pourquoi vous m\'attaquez ?!', '2-5.ambush.2': 'C\'était un piège !',
  '2-5.test.0': 'Hahaha, du calme, Chulin. C\'était un test.', '2-5.test.1': 'On voulait voir si tu étais vraiment digne de nous aider. Et tu l\'es !',

  '3-1.npc1.0': 'Bienvenue sur l\'Île Cacionesvaca, l\'ami !', '3-1.npc1.1': 'Attention : l\'eau est pleine de Sbires Aquatiques.',
  '3-1.npc2.0': 'Il y a des piranhas enflammés !', '3-1.npc2.1': 'On dit que l\'électricité et l\'eau ne font pas bon ménage... pour les Sbires.',

  '3-2.npc1.0': 'Ils ont mis des scies partout sur la plage... on ne peut même plus bronzer.',
  '3-3.start.0': 'Le récif. On arrive presque au château de l\'île.', '3-3.start.1': 'Allons-y.',
  '3-4.start.0': 'Le château de l\'île... pourquoi a-t-il une chaîne aussi énorme ?', '3-4.start.1': 'Ça ne me plaît pas du tout.',

  '3-4.bossEnd.0': 'Héhéhé... regarde en haut.', '3-4.bossEnd.1': 'C\'est quoi ce bruit ?',
  '3-4.lift.0': 'Le château était relié à une chaîne géante... et un vaisseau ÉNORME a commencé à l\'emporter !', '3-4.lift.1': 'Regarde le ciel ! Il y a des millions de châteaux volants !',
  '3-4.lift.2': 'Ils vont tous au même endroit...', '3-4.lift.3': 'La Cité Sulu. La ville la plus importante.', '3-4.lift.4': 'Alors suivons-les !',

  '3-5.end.0': 'Voici... la Cité Sulu.', '3-5.end.1': 'Tout n\'est que château... et regarde tous ces villageois...', '3-5.end.2': 'Ils les ont amenés comme esclaves. C\'est fini, Impérialiste !',
  '4-1.start.0': 'Des villageois de toutes les villes, emmenés comme esclaves. Des morceaux de villes volées. Des châteaux partout.', '4-1.start.1': 'Ici, tout le monde est Chef des Opérations...', '4-1.start.2': 'Et nous, on est Chulin et Mexicano. Allons-y !',

  '4-1.npc3.0': 'Un Militaire des Opérations garde le Cristal Électrique Doré.', '4-1.npc3.1': 'Alors ce cristal est la clé.',
  '4-1.militar.0': 'Je suis un MILITAIRE des Opérations. Trois fois plus grand qu\'un Chef !', '4-1.militar.1': 'Il est énorme !', '4-1.militar.2': 'Je me fiche de sa taille !',
  '4-1.transform.0': 'Cette énergie... c\'est incroyable...', '4-1.transform.1': 'Cette fois, Impérialiste, j\'arrive.',
  '4-2.start.0': 'Le plus haut château. Il est là-haut.',
  '4-3.start.0': 'C\'est la fin du chemin.',
  '4-3.boss.0': 'Alors c\'est toi qui as ruiné toutes mes opérations.', '4-3.boss.1': 'J\'adore régner ! Et je régnerai sur le monde entier !', '4-3.boss.2': 'C\'est fini, Impérialiste.', '4-3.boss.3': 'C\'est ce qu\'on va voir.',
  '4-3.phase2.0': 'SBIRES DORÉS ! PROTÉGEZ VOTRE ROI !',
  '4-3.phase3.0': 'Non... comment est-ce possible ?!', '4-3.phase3.1': 'Rends-toi !',
  '4-3.end.0': 'Mon... royaume...', '4-3.end.1': 'Les villageois sont libres. Et tu ne régneras plus sur personne.',
  '4-3.end.2': 'Les vaisseaux sont tombés. Les chaînes se sont brisées.', '4-3.end.3': 'Les châteaux ont commencé à s\'effondrer...', '4-3.end.4': 'Chulin a sauvé le monde !',

  desc_chulin: 'Chulin ist der Held des Spiels: Er ist mutig, kümmert sich um andere und ist sehr freundlich. Alle lieben ihn. Sein bester Freund ist Mexicano. Bei einem Abenteuer verlor er ein Auge und bekam ein goldenes geschenkt. Er benutzt eine kleine gelbe Pistole.',
  desc_mexicano: 'Mexicano ist Chulins bester Freund. Bei demselben Abenteuer, bei dem Chulin sein linkes Auge verlor, verlor er sein rechtes – aber ihm schenkte niemand etwas, also trägt er nur eine Augenklappe. Er hat sich ein Auge auf den Rücken gemalt, damit „die anderen denken, er sieht sie überall“, ohne zu wissen, dass es viel zu schief geraten ist. Er benutzt echte Gewehre.',

  desc_alcalde: 'Der Bürgermeister des Sonnendorfs. Die Handlanger sperrten ihn in einen Käfig, aber Chulin rettete ihn, und er begleitet ihn auf seinem Abenteuer.',

  desc_guard: 'Der erste Handlanger, gegen den Chulin kämpfte: ein Wächter, der auf die anderen aufpasste, während sie das Sonnendorf niederbrannten.',
  desc_gigante: 'Ein riesiger Handlanger mit Flammenwerfer. Komm ihm nicht zu nahe!',
  desc_jefe: 'Einsatzleiter: größer als ein Riese und mit Polizeimütze. Er bewacht jede Burg des Imperialisten.',
  desc_acuatico: 'Handlanger mit Taucherbrille, die schwimmen und brennende Piranhas werfen. Man sagt, Strom und Wasser vertragen sich nicht...',
  desc_dorado_s: 'Elite-Handlanger aus Sulu-Stadt. Sie fliegen viel besser und kontrollierter als die fliegenden Handlanger und tragen Gewehre.',
  desc_militarOp: 'In Sulu-Stadt werden Einsatzleiter zu Einsatzmilitärs befördert: dreimal so groß!',
  desc_imperialista: 'Der Anführer der Handlanger. Er trägt eine goldene Krone und will die ganze Welt erobern. Er liebt es zu herrschen.',

  'story1.title': 'Welt 1: Sonnendorf',

  'story2.title': 'Welt 2: Stadt der Hohen Militärs',
  'story2.0': 'Nachdem sie das Sonnendorf befreit hatten, segelten Chulin und Mexicano zum nächsten Ort: der Stadt der Hohen Militärs, den Mächtigsten aller Dörfer.',
  'story2.1': 'Doch als sie ankamen, brannten die Wolkenkratzer und die Bewohner trugen Handschellen.',
  'story3.title': 'Welt 3: Insel Cacionesvaca',
  'story3.0': 'Auf der Jagd nach den Handlangern übers Wasser erreichte Chulin die Insel Cacionesvaca, die aus vielen kleinen Inseln besteht.',

  'story4.title': 'Welt 4: Sulu-Stadt',

  'ending.0': 'Mit dem besiegten Imperialisten begannen die Burgen wie trockene Blätter vom Himmel zu fallen.',

  '1-1.smoke.0': 'Hä? Rauch?', '1-1.smoke.1': 'Das Dorf brennt?!',
  '1-1.who.0': 'Wer sind die? Solche Countryballs habe ich noch nie gesehen...', '1-1.who.1': 'Rote Augen und blaue Pistolen! Sie greifen das Dorf an!',
  '1-1.guard.0': 'Halt! Niemand stört die Befehle des Imperialisten.', '1-1.guard.1': 'Imperia-was? Lass meine Nachbarn in Ruhe!', '1-1.guard.2': 'Hehe... es ist schon zu spät.',
  '1-1.guardEnd.0': 'Puh... wo sind die anderen hin?', '1-1.guardEnd.1': 'Keiner mehr da... sie haben die Dorfbewohner mitgenommen.',
  '1-1.villager.0': 'Chulin! Gott sei Dank, dir geht es gut!', '1-1.villager.1': 'Was ist hier passiert? Wer waren die?',
  '1-1.villager.2': 'Man nennt sie Handlanger... sie haben die Häuser angezündet und viele mitgenommen.', '1-1.villager.3': 'Es heißt, ein Imperialist will die Welt erobern.',
  '1-1.villager.4': 'Dann muss ich ihn aufhalten. Ich gehe der Sache nach!',
  '1-2.start.0': 'CHULIN! Endlich finde ich dich, Kumpel!', '1-2.start.1': 'Mexicano! Geht es dir gut?', '1-2.start.2': 'Ich habe mich versteckt, als die Handlanger kamen. Ich habe gesehen, wohin sie die Leute gebracht haben.',
  '1-2.start.3': 'Hier, ich habe Gewehre mitgebracht. Die funktionieren wie echte! Gehen wir zusammen!', '1-2.start.4': 'So gefällt mir das!', '1-2.start.5': 'Mexicano ist dabei! Er ist jetzt spielbar.',
  '1-2.npc1.0': 'Die Bäume sind vom Feuer vertrocknet...', '1-2.npc1.1': 'Pass auf, sie haben überall Stacheln, Minen und Bomben hinterlassen.',
  '1-2.giant.0': 'VERBRENNT ALLES!!', '1-2.giant.1': 'Dieser Handlanger ist RIESIG! Und er hat einen Flammenwerfer!', '1-2.giant.2': 'Je größer sie sind, desto tiefer fallen sie!',
  '1-2.giantEnd.0': 'Der war echt riesig!', '1-2.giantEnd.1': 'Weiter. Wir müssen die anderen finden.',
  '1-3.start.0': 'Fliegende Plattformen? Das ist Technik der Handlanger...', '1-3.start.1': 'Und wenn wir runterfallen?', '1-3.start.2': 'Na ja... dann fallen wir eben nicht.',
  '1-3.mayor.0': 'Chulin! Du hast mich gerettet!', '1-3.mayor.1': 'Herr Bürgermeister! Alles in Ordnung?', '1-3.mayor.2': 'Die Handlanger haben am Ende des Dorfes eine Burg gebaut. Dort ist ihr Anführer.',
  '1-3.mayor.3': 'Ich kenne den Weg. Ich komme mit!', '1-3.mayor.4': 'Auf zur Burg!',
  '1-4.start.0': 'Das ist die Burg. Vorsicht: Es gibt falsche Wege, Lava und Sägen.', '1-4.start.1': 'Und Portale, die an zufällige Orte führen...', '1-4.start.2': 'Ich habe vor nichts Angst. Vorwärts!',
  '1-4.portal.0': 'Eine Wand? Und wo jetzt lang?', '1-4.portal.1': 'Dieses Portal... kann uns überallhin bringen. Wir müssen es wagen!',
  '1-4.boss.0': 'Ich bin der Einsatzleiter dieses Gebiets.', '1-4.boss.1': 'Der Imperialist duldet kein Versagen... also werde ich nicht versagen!', '1-4.boss.2': 'Gib die Dorfbewohner zurück!', '1-4.boss.3': 'Schnapp ihn dir, Kumpel!',
  '1-4.bossEnd.0': 'U-unmöglich... der Imperialist wird davon erfahren...', '1-4.bossEnd.1': 'Das Sonnendorf ist wieder frei!',
  '1-5.start.0': 'Im Dorf ist wieder alles normal. Alle feiern!', '1-5.start.1': 'Sammle so viele Münzen wie möglich!',
  '1-5.npc1.0': 'Chulin, du bist ein Held!', '1-5.npc1.1': 'Ich habe nur das Richtige getan.',
  '1-5.npc2.0': 'Mein Haus brennt nicht mehr! Danke, danke, danke!',
  '1-5.npc3.0': 'Mexicano, du bist auch ein Held!', '1-5.npc3.1': 'Ich weiß! Also... danke.',
  '1-5.mayor.0': 'Danke, dass du uns gerettet hast, Chulin!', '1-5.mayor.1': 'Aber die Handlanger kamen vom Meer... und sie haben Leute in die Stadt der Hohen Militärs gebracht.',
  '1-5.mayor.2': 'Sie waren die Mächtigsten aller Dörfer. Wenn sie angegriffen wurden, ist das sehr ernst.', '1-5.mayor.3': 'Dann gehen wir dorthin.', '1-5.mayor.4': 'Mach das Schiff bereit, Herr Bürgermeister!',
  '1-6.start.0': 'Alle an Bord! Das Schiff bringt uns zur Stadt der Hohen Militärs.', '1-6.start.1': 'Ab aufs Meer!', '1-6.start.2': 'Hoffentlich werde ich nicht seekrank...',
  '1-6.ambush.0': 'Handlanger auf den Schiffen!', '1-6.ambush.1': 'Die halten uns nicht auf!',
  '1-6.end.0': 'Da ist die Stadt der Hohen Militärs... aber da ist viel Rauch.', '1-6.end.1': 'Da ist etwas Schlimmes passiert. Los.',
  '2-1.start.0': 'Die Stadt... die Bewohner tragen Handschellen!', '2-1.start.1': 'Sogar die Hohen Militärs wurden besiegt...',
  '2-1.npc1.0': 'Sie haben uns Handschellen angelegt... uns, den Hohen Militärs!', '2-1.npc1.1': 'Such den General. Er weiß, was zu tun ist.',
  '2-1.npc2.0': 'Meine grüne Kappe... sie war der Stolz der Stadt... buhuu...',
  '2-1.general.0': 'Du bist Chulin? Ich habe gehört, du hast das Sonnendorf befreit.', '2-1.general.1': 'Ja. Was ist hier passiert?',
  '2-1.general.2': 'Die Handlanger haben die Wolkenkratzer angezündet. Befreie die Stadt: Klettere die Gebäude hoch und erreiche ihre Burg.',
  '2-1.general.3': 'Aber hier reicht Schießen nicht. Ich bringe dir den Nahkampf bei!', '2-1.general.4': 'Du hast Nahkampf gelernt! Tippe auf die Faust-Taste zum Zuschlagen.',
  '2-2.start.0': 'Die Wolkenkratzer brennen. Spring von Dach zu Dach.', '2-2.start.1': 'Wie hoch!',
  '2-2.smoke.0': '*hust hust* So viel Rauch! Wenn ich zu lange in der Nähe bleibe, ersticke ich...', '2-2.smoke.1': 'Bleib nicht im Rauch, Kumpel. Er macht dich langsam!',
  '2-3.start.0': 'Noch mehr Rauch... wir müssen schnell durch.', '2-3.start.1': 'Wir sind fast an der Burg!',
  '2-4.start.0': 'Diese Burg ist ein Turm. Du musst sie ganz hochklettern.', '2-4.start.1': 'Und den Schlüssel finden, der den Anführer schützt.',
  '2-4.boss.0': 'Wie bist du hier heraufgekommen?!', '2-4.boss.1': 'Diese Stadt gehört dem Imperialisten!', '2-4.boss.2': 'Nicht mehr lange!',
  '2-4.bossEnd.0': 'Hier... der Schlüssel der Stadt... hehehe...', '2-4.bossEnd.1': 'Chulin hat die ELEKTRO-PISTOLE bekommen! (wechseln mit ⟳)', '2-4.bossEnd.2': 'Eine Elektro-Pistole!',
  '2-4.cutkey.0': 'Der Schlüssel ist in zwei Teile zerbrochen!', '2-4.cutkey.1': 'Und wenn wir ihn mit Kaugummi kleben?', '2-4.cutkey.2': 'Ich habe eine bessere Idee... schieß mit der Elektro-Pistole drauf!',
  '2-4.keyElec.0': 'Der Strom hat ihn verschweißt! Jetzt funktioniert er!', '2-4.keyElec.1': 'Wow... schnapp ihn dir!',
  '2-4.free.0': 'Die Handschellen sind offen! Die Stadt ist frei!', '2-4.free.1': 'Wir haben es geschafft!',
  '2-5.start.0': 'Die Stadt feiert! Genieß es, Chulin.', '2-5.start.1': 'Überall Münzen!',
  '2-5.npc1.0': 'Danke, dass du uns befreit hast! Nimm so viele Münzen, wie du willst.',
  '2-5.npc2.0': 'Hoch lebe Chulin!', '2-5.npc2.1': 'Und ich? Sagt keiner „Hoch lebe Mexicano“?',
  '2-5.ambush.0': 'SOLDATEN! GREIFT CHULIN AN!', '2-5.ambush.1': 'Was?! Warum greift ihr mich an?!', '2-5.ambush.2': 'Das war eine Falle!',
  '2-5.test.0': 'Hahaha, ruhig, Chulin. Das war ein Test.', '2-5.test.1': 'Wir wollten sehen, ob du wirklich würdig bist, uns zu helfen. Und das bist du!',
  '2-5.test.2': '...ein Test?', '2-5.test.3': 'Hehe! Der kommt mit mir!', '2-5.test.4': 'AAAH! HILFE!', '2-5.test.5': 'GENERAL! Hinterher!',
  '2-6.start.0': 'Er entführt ihn übers Wasser!', '2-6.start.1': 'Du musst ihn erwischen, Kumpel!',
  '2-6.kidnap.0': 'Du kriegst mich nie! Piranhas, Angriff!', '2-6.kidnap.1': 'Chulin, hilf mir!',
  '2-6.piranha.0': 'Schau, Kumpel! Wenn du mit der Elektro-Pistole ins Wasser schießt, werden die Piranhas gegrillt. Fang einen und du bekommst einen Elektroschild!',
  '2-6.end.0': 'Du hast mich schon wieder gerettet! Du bist wirklich würdig.', '2-6.end.1': 'Wohin haben sie die Leute gebracht?', '2-6.end.2': 'Hinter dem Meer liegt die Insel Cacionesvaca. Die Handlanger fahren dorthin.',
  '3-1.start.0': 'Insel Cacionesvaca: kleine Inseln, Sonne und überall Wasser.', '3-1.start.1': 'Urlaub! ...na ja, nicht ganz.',
  '3-1.npc1.0': 'Willkommen auf der Insel Cacionesvaca, Freund!', '3-1.npc1.1': 'Vorsicht: Das Wasser ist voller Wasser-Handlanger.',
  '3-1.npc2.0': 'Es gibt brennende Piranhas!', '3-1.npc2.1': 'Man sagt, Strom und Wasser vertragen sich nicht... jedenfalls nicht für die Handlanger.',
  '3-1.npc3.0': 'Schieß mit der Elektro-Pistole ins Wasser, dann siehst du es. Der älteste Trick der Insel.',
  '3-2.start.0': 'Fliegende Handlanger?!', '3-2.start.1': 'Die haben Raketenrucksäcke! Ziel nach oben!',
  '3-2.npc1.0': 'Sie haben überall am Strand Sägen aufgestellt... man kann sich nicht mal mehr sonnen.',
  '3-3.start.0': 'Das Riff. Wir sind fast an der Burg der Insel.', '3-3.start.1': 'Los.',
  '3-4.start.0': 'Die Burg der Insel... warum hat sie so eine riesige Kette?', '3-4.start.1': 'Das gefällt mir gar nicht.',
  '3-4.boss.0': 'Du kommst zu spät, Chulin!', '3-4.boss.1': 'Der Plan des Imperialisten hat schon begonnen...', '3-4.boss.2': 'Ich halte ihn auf!',
  '3-4.bossEnd.0': 'Hehehe... schau nach oben.', '3-4.bossEnd.1': 'Was ist das für ein Geräusch?',
  '3-4.lift.0': 'Die Burg hing an einer riesigen Kette... und ein GEWALTIGES Luftschiff begann, sie fortzutragen!', '3-4.lift.1': 'Schau in den Himmel! Da fliegen Millionen Burgen!',
  '3-4.lift.2': 'Alle fliegen zum selben Ort...', '3-4.lift.3': 'Sulu-Stadt. Die wichtigste Stadt.', '3-4.lift.4': 'Dann hinterher!',
  '3-5.start.0': 'Wir müssen den Burgen durch den Himmel folgen.', '3-5.start.1': 'Nicht nach unten schauen, nicht nach unten schauen...',
  '3-5.end.0': 'Das ist... Sulu-Stadt.', '3-5.end.1': 'Alles ist Burg... und sieh dir all die Dorfbewohner an...', '3-5.end.2': 'Sie wurden als Sklaven hergebracht. Jetzt ist Schluss, Imperialist!',
  '4-1.start.0': 'Dorfbewohner aus allen Orten, als Sklaven verschleppt. Stücke gestohlener Städte. Überall Burgen.', '4-1.start.1': 'Hier sind alle Einsatzleiter...', '4-1.start.2': 'Und wir sind Chulin und Mexicano. Los!',
  '4-1.npc1.0': 'Sie haben uns aus dem Sonnendorf hergebracht... wir arbeiten Tag und Nacht...', '4-1.npc1.1': 'Man sagt, der Imperialist ist ganz oben.',
  '4-1.npc2.0': 'Vorsicht vor den Goldenen Handlangern! Sie fliegen viel besser als die anderen.',
  '4-1.npc3.0': 'Ein Einsatzmilitär bewacht den Goldenen Elektrokristall.', '4-1.npc3.1': 'Dann ist dieser Kristall der Schlüssel.',
  '4-1.militar.0': 'Ich bin ein EINSATZMILITÄR. Dreimal so groß wie ein Einsatzleiter!', '4-1.militar.1': 'Der ist riesig!', '4-1.militar.2': 'Mir egal, wie groß er ist!',
  '4-1.transform.0': 'Diese Energie... ist unglaublich...', '4-1.transform.1': 'Jetzt, Imperialist. Ich komme dich holen.',
  '4-2.start.0': 'Die höchste Burg. Er ist da oben.',
  '4-3.start.0': 'Hier endet der Weg.',
  '4-3.boss.0': 'Du bist also der, der all meine Einsätze ruiniert hat.', '4-3.boss.1': 'Ich liebe es zu herrschen! Und ich werde über die ganze Welt herrschen!', '4-3.boss.2': 'Es ist vorbei, Imperialist.', '4-3.boss.3': 'Das werden wir ja sehen.',
  '4-3.phase2.0': 'GOLDENE HANDLANGER! BESCHÜTZT EUREN KÖNIG!',
  '4-3.phase3.0': 'Nein... wie ist das möglich?!', '4-3.phase3.1': 'Gib auf!',
  '4-3.end.0': 'Mein... Königreich...', '4-3.end.1': 'Die Dorfbewohner sind frei. Und du wirst über niemanden mehr herrschen.',
  '4-3.end.2': 'Die Luftschiffe stürzten ab. Die Ketten zerrissen.', '4-3.end.3': 'Die Burgen begannen zu zerfallen...', '4-3.end.4': 'Chulin hat die Welt gerettet!',
  cr_by: 'Erschaffen von', cr_studio: 'Studio', cr_owned: 'Gehört zu', cr_rights: 'Figurenrechte', t_bossRetry: 'Der Bosskampf beginnt von vorn. Versuch es nochmal!',
  opt_aim: 'Zielen', aim_drag: 'Schuss-Taste ziehen', aim_stick: 'Extra-Joystick', t_fly: 'Flug',
  desc_electrico: 'Chulin, nachdem er den Goldenen Elektrokristall berührt hat. Er wird zu einem höheren Wesen: größer, schneller, mit 6 Herzen, einem kurzen Flug (halte ⤒ in der Luft) und Blitzen.',

  desc_chulin: "Chulin è il protagonista del gioco: è coraggioso, si preoccupa per gli altri ed è molto gentile. Tutti gli vogliono bene. Il suo migliore amico è Mexicano. In un'avventura ha perso un occhio e gliel'hanno sostituito con uno d'oro che gli hanno regalato. Usa una piccola pistola gialla.",
  desc_mexicano: "Mexicano è il migliore amico di Chulin. Nella stessa avventura in cui Chulin ha perso l'occhio sinistro, lui ha perso il destro, ma a lui non hanno regalato niente, così porta solo una benda. Si è disegnato un occhio sulla schiena perché \"gli altri pensino che li stia guardando ovunque\", senza sapere che è venuto troppo deforme. Usa fucili veri.",
  desc_dorado: "Una versione dorata e brillante di Chulin. Ha un cuore in più. Si sblocca raccogliendo 200 monete in totale (record di ogni livello).",
  desc_volador: "Uno Scagnozzo con lo zaino a razzo. Dopo la sconfitta dell'Imperialista ha deciso di cambiare schieramento. Tieni premuto ⤒ in aria per volare un po'.",
  desc_aldeano: 'Gli abitanti del Villaggio del Sole: countryball bianche, tranquille e gentili. Molti sono stati rapiti dagli Scagnozzi.',
  desc_alcalde: "Il sindaco del Villaggio del Sole. Gli Scagnozzi l'hanno chiuso in una gabbia, ma Chulin l'ha salvato e lui lo accompagna nell'avventura.",
  desc_militar: 'Gli abitanti della Città degli Alti Militari portano un cappellino verde. Erano i più potenti di tutti i villaggi... finché non li hanno ammanettati.',
  desc_general: 'Il capo della Città degli Alti Militari. Dà gli ordini a Chulin per liberare la città. Gli piace mettere alla prova gli altri.',
  desc_playista: "Gli abitanti dell'Isola Cacionesvaca portano sempre gli occhiali da sole. Conoscono molti segreti del mare.",
  desc_esclavo: "Abitanti di tutti i paesi, portati come schiavi nella Città Sulu per servire l'Imperialista.",
  desc_comun: 'Countryball mai viste prima, con gli occhi rossi, una stella rossa e una pistola blu. Adorano regnare.',
  desc_guard: 'Il primo Scagnozzo affrontato da Chulin: una guardia che sorvegliava gli altri mentre bruciavano il Villaggio del Sole.',
  desc_gigante: 'Uno Scagnozzo enorme con un lanciafiamme. Non avvicinarti troppo!',
  desc_jefe: "Capo delle Operazioni: più grande di un gigante e con il cappello da poliziotto. Sorveglia ogni castello dell'Imperialista.",
  desc_acuatico: "Scagnozzi con gli occhialini che nuotano e lanciano piranha infuocati. Dicono che l'elettricità e l'acqua non vadano d'accordo...",
  desc_dorado_s: 'Scagnozzi d\'élite della Città Sulu. Volano molto meglio e in modo più controllato di quelli volanti, e portano fucili.',
  desc_militarOp: 'Nella Città Sulu, i Capi delle Operazioni diventano Militari delle Operazioni: tre volte più grandi!',
  desc_imperialista: 'Il capo degli Scagnozzi. Porta una corona d\'oro e vuole conquistare il mondo intero. Adora regnare.',
  lock_chulin: '', lock_mexicano: 'Si sblocca nel livello 1-2.', lock_dorado: 'Raccogli 200 monete in totale (record di ogni livello).', lock_electrico: 'Finisci il gioco.', lock_volador: 'Finisci il gioco.',
  'story1.title': 'Mondo 1: Villaggio del Sole',
  'story1.0': 'Era un giorno come tanti. Chulin era uscito a passeggiare per la sua comunità, il Villaggio del Sole, con la sua solita piccola pistola gialla.',
  'story1.1': "Ma c'era qualcosa di strano nell'aria... odore di fumo.",
  'story1.2': "Senza saperlo, Chulin stava per iniziare l'avventura più grande della sua vita.",
  'story2.title': 'Mondo 2: Città degli Alti Militari',
  'story2.0': 'Dopo aver liberato il Villaggio del Sole, Chulin e Mexicano salparono verso il villaggio successivo: la Città degli Alti Militari, i più potenti di tutti i villaggi.',
  'story2.1': 'Ma al loro arrivo, i grattacieli bruciavano e gli abitanti erano in manette.',
  'story3.title': 'Mondo 3: Isola Cacionesvaca',
  'story3.0': "Inseguendo gli Scagnozzi sull'acqua, Chulin arrivò all'Isola Cacionesvaca, formata da tante piccole isole.",
  'story3.1': 'Lì apparvero altri Scagnozzi Acquatici... e un nuovo tipo: lo Scagnozzo Volante.',
  'story4.title': 'Mondo 4: Città Sulu',
  'story4.0': 'Milioni di castelli volavano nel cielo, tutti diretti alla Città Sulu, la città più importante.',
  'story4.1': 'Ora lì è tutto castello. Chulin non affronta più livelli: deve esplorare i castelli, i pezzi di città rubate... e trovare il Cristallo Elettrico Dorato.',
  'ending.title': 'Epilogo',
  'ending.0': "Sconfitto l'Imperialista, i castelli iniziarono a cadere dal cielo come foglie secche.",
  'ending.1': "Gli abitanti di tutti i paesi furono liberati e tornarono a casa: il Villaggio del Sole, la Città degli Alti Militari e l'Isola Cacionesvaca.",
  'ending.2': 'Chulin tornò quello di sempre. Lo Scagnozzo Volante, pentito, decise di unirsi ai buoni.',
  'ending.3': 'Ma quando Chulin si voltò per festeggiare con il suo migliore amico... Mexicano non c\'era più. Dove sarà finito? Continua...',
  'crystal.0': 'Un Cristallo Elettrico! Sembra... potente.', 'crystal.1': "Dicono che ce ne sia uno in ogni castello, amico.", 'crystal.2': "Lo tengo io. Qualcosa mi dice che ci servirà.",
  '1-1.start.0': 'Che bella giornata per una passeggiata nel Villaggio del Sole!', '1-1.start.1': 'Vado a salutare i vicini.',
  '1-1.smoke.0': 'Eh? Fumo?', '1-1.smoke.1': 'Il villaggio va a fuoco?!',
  '1-1.who.0': 'Chi sono quelli? Non ho mai visto countryball così...', '1-1.who.1': 'Occhi rossi e pistole blu! Stanno attaccando il villaggio!',
  '1-1.guard.0': "Alt! Nessuno interrompe gli ordini dell'Imperialista.", '1-1.guard.1': 'Imperia-chi? Lascia in pace i miei vicini!', '1-1.guard.2': 'Ehehe... ormai è troppo tardi.',
  '1-1.guardEnd.0': 'Uff... dove sono finiti gli altri?', '1-1.guardEnd.1': 'Non è rimasto nessuno... hanno portato via gli abitanti.',
  '1-1.villager.0': 'Chulin! Grazie al cielo stai bene!', '1-1.villager.1': 'Cosa è successo? Chi erano quelli?',
  '1-1.villager.2': 'Li chiamano Scagnozzi... hanno bruciato le case e portato via tanta gente.', '1-1.villager.3': "Dicono che ci sia un Imperialista che vuole conquistare il mondo.",
  '1-1.villager.4': 'Allora dovrò fermarlo. Vado a indagare!',
  '1-2.start.0': 'CHULIN! Finalmente ti ho trovato, amico!', '1-2.start.1': 'Mexicano! Stai bene?', '1-2.start.2': 'Mi sono nascosto quando sono arrivati gli Scagnozzi. Ho visto dove hanno portato la gente.',
  '1-2.start.3': 'Tieni, ho portato dei fucili. Funzionano come quelli veri! Andiamo insieme!', '1-2.start.4': 'Così si parla!', '1-2.start.5': 'Mexicano si è unito a te! Ora è un personaggio giocabile.',
  '1-2.npc1.0': 'Gli alberi si sono seccati per il fuoco...', '1-2.npc1.1': 'Stai attento, hanno lasciato punte, mine e bombe ovunque.',
  '1-2.giant.0': 'BRUCIAAATE!!', '1-2.giant.1': 'Quello Scagnozzo è GIGANTE! E ha un lanciafiamme!', '1-2.giant.2': 'Più sono grossi, più fanno rumore quando cadono!',
  '1-2.giantEnd.0': 'Quello sì che era grosso!', '1-2.giantEnd.1': 'Andiamo avanti. Dobbiamo trovare gli altri.',
  '1-3.start.0': 'Piattaforme volanti? Questa è tecnologia degli Scagnozzi...', '1-3.start.1': 'E se cadiamo?', '1-3.start.2': 'Beh... non cadiamo.',
  '1-3.mayor.0': 'Chulin! Mi hai salvato!', '1-3.mayor.1': 'Sindaco! Sta bene?', '1-3.mayor.2': 'Gli Scagnozzi hanno costruito un castello in fondo al villaggio. Lì c\'è il loro capo.',
  '1-3.mayor.3': 'Conosco la strada. Ti accompagno!', '1-3.mayor.4': 'Andiamo a quel castello!',
  '1-4.start.0': 'Questo è il castello. Attenzione: ci sono percorsi finti, lava e seghe.', '1-4.start.1': 'E portali che portano in posti a caso...', '1-4.start.2': 'Non ho paura di niente. Avanti!',
  '1-4.portal.0': 'Un muro? E ora da che parte?', '1-4.portal.1': 'Quel portale... può portarci ovunque. Dobbiamo rischiare!',
  '1-4.boss.0': 'Sono il Capo delle Operazioni di questa zona.', '1-4.boss.1': "L'Imperialista non tollera i fallimenti... quindi non fallirò!", '1-4.boss.2': 'Restituisci gli abitanti!', '1-4.boss.3': 'Dagli addosso, amico!',
  '1-4.bossEnd.0': "N-non può essere... l'Imperialista lo verrà a sapere...", '1-4.bossEnd.1': 'Il Villaggio del Sole è di nuovo libero!',
  '1-5.start.0': 'Il villaggio è tornato alla normalità. Sono tutti in festa!', '1-5.start.1': 'Raccogli tutte le monete che puoi!',
  '1-5.npc1.0': 'Chulin, sei un eroe!', '1-5.npc1.1': 'Ho solo fatto la cosa giusta.',
  '1-5.npc2.0': 'La mia casa non brucia più! Grazie, grazie, grazie!',
  '1-5.npc3.0': 'Mexicano, anche tu sei un eroe!', '1-5.npc3.1': 'Lo so! Cioè... grazie.',
  '1-5.mayor.0': 'Grazie per averci salvati, Chulin!', '1-5.mayor.1': 'Ma gli Scagnozzi sono arrivati dal mare... e hanno portato gente verso la Città degli Alti Militari.',
  '1-5.mayor.2': 'Erano i più potenti di tutti i villaggi. Se li hanno attaccati, è una cosa molto seria.', '1-5.mayor.3': 'Allora andremo lì.', '1-5.mayor.4': 'Prepari la nave, Sindaco!',
  '1-6.start.0': 'Tutti a bordo! La nave ci porterà alla Città degli Alti Militari.', '1-6.start.1': 'Prendiamo il largo!', '1-6.start.2': 'Speriamo di non avere il mal di mare...',
  '1-6.ambush.0': 'Scagnozzi sulle navi!', '1-6.ambush.1': 'Non ci fermeranno!',
  '1-6.end.0': "Ecco la Città degli Alti Militari... ma c'è tanto fumo.", '1-6.end.1': 'È successo qualcosa di brutto. Andiamo.',
  '2-1.start.0': 'La città... gli abitanti sono ammanettati!', '2-1.start.1': 'Hanno battuto persino gli Alti Militari...',
  '2-1.npc1.0': 'Ci hanno ammanettati... noi, gli Alti Militari!', '2-1.npc1.1': 'Cerca il Generale. Lui saprà cosa fare.',
  '2-1.npc2.0': "Il mio cappellino verde... era l'orgoglio della città... uèèè...",
  '2-1.general.0': 'Tu sei Chulin? Ho sentito che hai liberato il Villaggio del Sole.', '2-1.general.1': 'Sì. Cosa è successo qui?',
  '2-1.general.2': 'Gli Scagnozzi hanno incendiato i grattacieli. Libera la città: arrampicati sugli edifici e raggiungi il loro castello.',
  '2-1.general.3': 'Ma qui sparare non basta. Ti insegnerò a combattere corpo a corpo!', '2-1.general.4': 'Hai imparato il Corpo a corpo! Tocca il tasto del pugno per colpire.',
  '2-2.start.0': 'I grattacieli sono in fiamme. Salta da un tetto all\'altro.', '2-2.start.1': 'Che altezza!',
  '2-2.smoke.0': '*coff coff* Quanto fumo! Se resto vicino troppo a lungo, soffoco...', '2-2.smoke.1': 'Non stare nel fumo, amico. Ti rallenta!',
  '2-3.start.0': 'Altro fumo... dobbiamo passare in fretta.', '2-3.start.1': 'Siamo quasi al castello!',
  '2-4.start.0': 'Questo castello è una torre. Dovrai scalarla tutta.', '2-4.start.1': 'E trovare la chiave che protegge il Capo.',
  '2-4.boss.0': 'Come sei arrivato fin qui?!', '2-4.boss.1': "Questa città appartiene all'Imperialista!", '2-4.boss.2': 'Non più!',
  '2-4.bossEnd.0': 'Tieni... la chiave della città... ehehe...', '2-4.bossEnd.1': 'Chulin ha ottenuto la PISTOLA ELETTRICA! (cambiala con ⟳)', '2-4.bossEnd.2': 'Una pistola elettrica!',
  '2-4.cutkey.0': 'La chiave è spezzata in due!', '2-4.cutkey.1': 'E se la incolliamo con la gomma da masticare?', '2-4.cutkey.2': 'Ho un\'idea migliore... sparale con la pistola elettrica!',
  '2-4.keyElec.0': "L'elettricità l'ha saldata! Ora funziona!", '2-4.keyElec.1': 'Wow... prendila!',
  '2-4.free.0': 'Le manette si sono aperte! La città è libera!', '2-4.free.1': 'Ce l\'abbiamo fatta!',
  '2-5.start.0': 'La città è in festa! Divertiti, Chulin.', '2-5.start.1': 'Monete dappertutto!',
  '2-5.npc1.0': 'Grazie per averci liberati! Prendi tutte le monete che vuoi.',
  '2-5.npc2.0': 'Viva Chulin!', '2-5.npc2.1': 'E io? Nessuno dice "viva Mexicano"?',
  '2-5.ambush.0': 'SOLDATI! ATTACCATE CHULIN!', '2-5.ambush.1': 'Cosa?! Perché mi attaccate?!', '2-5.ambush.2': 'Era una trappola!',

  '3-1.start.0': 'Isola Cacionesvaca: piccole isole, sole e acqua ovunque.', '3-1.start.1': 'Vacanze! ...beh, no.',
  '3-1.npc1.0': "Benvenuto sull'Isola Cacionesvaca, amico!", '3-1.npc1.1': "Attento: l'acqua è piena di Scagnozzi Acquatici.",

  '3-3.start.0': "La barriera corallina. Siamo quasi al castello dell'isola.", '3-3.start.1': 'Andiamo.',

  '3-4.bossEnd.0': 'Ehehe... guarda in alto.', '3-4.bossEnd.1': "Cos'è questo rumore?",
  '3-4.lift.0': 'Il castello era legato a una catena gigante... e un\'astronave ENORME ha iniziato a portarlo via!', '3-4.lift.1': 'Guarda il cielo! Ci sono milioni di castelli volanti!',

  '4-1.npc1.0': 'Ci hanno portati dal Villaggio del Sole... lavoriamo giorno e notte...', '4-1.npc1.1': "Dicono che l'Imperialista sia in cima a tutto.",
  '4-1.npc2.0': 'Attento agli Scagnozzi Dorati! Volano molto meglio degli altri.',
  '4-1.npc3.0': 'Un Militare delle Operazioni sorveglia il Cristallo Elettrico Dorato.', '4-1.npc3.1': 'Allora quel cristallo è la chiave.',
  '4-1.militar.0': 'Sono un MILITARE delle Operazioni. Tre volte più grande di un Capo!', '4-1.militar.1': 'È enorme!', '4-1.militar.2': 'Non mi importa quanto è grande!',
  '4-1.transform.0': 'Questa energia... è incredibile...', '4-1.transform.1': 'Adesso sì, Imperialista. Sto venendo a prenderti.',
  '4-2.start.0': 'Il castello più alto. Lui è lassù.',
  '4-3.start.0': 'La strada finisce qui.',
  '4-3.boss.0': 'Quindi sei tu quello che ha rovinato tutte le mie operazioni.', '4-3.boss.1': 'Adoro regnare! E regnerò sul mondo intero!', '4-3.boss.2': 'È finita, Imperialista.', '4-3.boss.3': 'Questo lo vedremo.',
  '4-3.phase2.0': 'SCAGNOZZI DORATI! PROTEGGETE IL VOSTRO RE!',
  '4-3.phase3.0': 'No... com\'è possibile?!', '4-3.phase3.1': 'Arrenditi!',
  '4-3.end.0': 'Il mio... regno...', '4-3.end.1': 'Gli abitanti sono liberi. E tu non regnerai più su nessuno.',
  '4-3.end.2': 'Le astronavi sono cadute. Le catene si sono spezzate.', '4-3.end.3': 'I castelli hanno iniziato a crollare...', '4-3.end.4': 'Chulin ha salvato il mondo!',
  cr_by: 'Creato da', cr_studio: 'Studio', cr_owned: 'Appartenente a', cr_rights: 'Diritti dei personaggi', t_bossRetry: 'Lo scontro col boss ricomincia. Riprova!',

  mx_0: 'Вперёд, дружище!', mx_1: 'Я тебя прикрою!', mx_2: 'Этот Империалист не знает, с кем связался.', mx_3: 'Видишь глаз у меня на спине? Я за тобой слежу.', mx_4: 'Я голодный... тут есть тако?',
