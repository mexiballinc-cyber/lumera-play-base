<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lumera Play</title>
    <link rel="icon" type="image/png" href="https://i.imgur.com/XSYJlMB.png">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="theme-dark-gold">

    <!-- PANTALLA DE REGISTRO / LOGIN (OBLIGATORIA) -->
    <div id="authScreen" class="auth-container">
        <div class="auth-card glassmorphism">
            <img src="https://i.imgur.com/8puFuwf.png" alt="Lumera Play" class="auth-logo">
            <div id="authFormTitle" class="auth-title" data-i18n="welcome">Bienvenido a Lumera</div>
            
            <input type="email" id="authEmail" placeholder="Correo electrónico" required>
            <input type="password" id="authPass" placeholder="Contraseña" required>
            
            <div class="auth-btns">
                <button id="btnLogin" class="btn btn-primary" data-i18n="login">Iniciar Sesión</button>
                <button id="btnRegister" class="btn btn-secondary" data-i18n="register">Registrarse</button>
            </div>
        </div>
    </div>

    <!-- APLICACIÓN PRINCIPAL (OCULTA HASTA LOGUEARSE) -->
    <div id="appScreen" style="display: none;">

        <!-- NAVBAR PRINCIPAL -->
        <header class="navbar glassmorphism">
            <button class="icon-btn menu-btn" id="btnToggleMenu" aria-label="Menú">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h18M3 6h18M3 18h18"/></svg>
            </button>
            
            <img src="https://i.imgur.com/8puFuwf.png" alt="Lumera" class="nav-logo" id="navLogo">

            <div class="nav-right">
                <!-- BOTÓN MAESTRO LÁPIZ (SOLO VISIBLE PARA TU CORREO) -->
                <button id="btnAdminPencil" class="admin-pencil-btn" style="display: none;" title="Panel Administrador">✏️</button>
                
                <button class="icon-btn" id="btnOpenSearch">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
                </button>
                
                <div class="user-avatar-small" id="navAvatar" title="Perfil"></div>
            </div>
        </header>

        <!-- MENÚ LATERAL DRAWER (GLASSMORPHISM) -->
        <aside id="sideMenu" class="drawer-menu glassmorphism">
            <div class="drawer-header">
                <img src="https://i.imgur.com/8puFuwf.png" alt="Lumera" class="drawer-logo">
            </div>
            <nav class="drawer-nav">
                <a class="nav-item active" data-page="home">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
                    <span data-i18n="nav_home">Inicio</span>
                </a>
                <a class="nav-item" data-page="spark">
                    <img src="https://i.imgur.com/459e7dz.png" class="spark-icon-nav" alt="Spark">
                    <span>Spark</span>
                </a>
                <a class="nav-item" data-page="series">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect width="20" height="15" x="2" y="5" rx="2"/><path d="M12 19v3M8 22h8"/></svg>
                    <span data-i18n="nav_series">Series</span>
                </a>
                <a class="nav-item" data-page="movies">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M7 3v18M17 3v18M3 7.5h18M3 12h18M3 16.5h18"/></svg>
                    <span data-i18n="nav_movies">Películas</span>
                </a>
                <a class="nav-item" data-page="kids">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M8 14s1.5 2 4 2 4-2 4-2M9 9h.01M15 9h.01"/></svg>
                    <span data-i18n="nav_kids">Kids</span>
                </a>
                <a class="nav-item" data-page="profiles">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                    <span data-i18n="nav_profiles">Perfiles</span>
                </a>
            </nav>
            <button id="btnLogout" class="btn-logout" data-i18n="logout">Cerrar Sesión</button>
        </aside>
        <div id="drawerOverlay" class="drawer-overlay"></div>

        <!-- SECCIONES DE LA APLICACIÓN (SPA) -->
        <main class="content-area">

            <!-- PÁGINA: SELECCIÓN DE PERFILES -->
            <section id="page-profiles" class="spa-page active">
                <div class="profiles-wrapper">
                    <h1 data-i18n="who_is_watching">¿Quién está viendo ahora?</h1>
                    <div class="profiles-grid" id="profilesContainer"></div>
                    
                    <!-- BOTÓN CONFIGURACIÓN Y IDIOMA/TEMA -->
                    <button id="btnOpenSettings" class="btn-settings-glass">
                        ⚙️ <span data-i18n="settings">Configuración</span>
                    </button>
                </div>
            </section>

            <!-- PÁGINA: INICIO -->
            <section id="page-home" class="spa-page">
                <div class="hero-banner" id="heroBanner">
                    <div class="hero-overlay">
                        <h1 id="heroTitle">Cargando...</h1>
                        <p id="heroDesc"></p>
                        <div class="hero-actions">
                            <button class="btn btn-primary" id="btnHeroPlay">▶ <span data-i18n="play">Reproducir</span></button>
                        </div>
                    </div>
                </div>
                <div class="dynamic-rows" id="homeRowsContainer"></div>
            </section>

            <!-- PÁGINA: SERIES -->
            <section id="page-series" class="spa-page">
                <h2 class="page-title" data-i18n="nav_series">Series</h2>
                <div class="dynamic-rows" id="seriesRowsContainer"></div>
            </section>

            <!-- PÁGINA: PELÍCULAS -->
            <section id="page-movies" class="spa-page">
                <h2 class="page-title" data-i18n="nav_movies">Películas</h2>
                <div class="dynamic-rows" id="moviesRowsContainer"></div>
            </section>

            <!-- PÁGINA: KIDS -->
            <section id="page-kids" class="spa-page">
                <h2 class="page-title">Zona Kids</h2>
                <div class="dynamic-rows" id="kidsRowsContainer"></div>
            </section>

            <!-- PÁGINA: SPARK (TIKTOK ALGORÍTMICO) -->
            <section id="page-spark" class="spa-page">
                <div class="spark-feed" id="sparkFeed">
                    <!-- Cards verticales de Spark -->
                </div>
            </section>

        </main>

        <!-- MODAL: AJUSTES Y PREFERENCIAS (IDIOMA / TEMAS) -->
        <div id="settingsModal" class="modal-overlay">
            <div class="modal-card glassmorphism">
                <div class="modal-header">
                    <h2 data-i18n="settings">Configuración</h2>
                    <span class="modal-close" id="btnCloseSettings">✕</span>
                </div>
                <div class="modal-body">
                    <label data-i18n="language">Idioma de la Plataforma:</label>
                    <select id="settingLanguage">
                        <option value="es">Español</option>
                        <option value="en">English</option>
                    </select>

                    <label data-i18n="theme">Tema Visual:</label>
                    <select id="settingTheme">
                        <option value="theme-dark-gold">Lumera Dorado / Negro</option>
                        <option value="theme-disney-blue">Disney Azul / Blanco</option>
                        <option value="theme-cyberpunk">Neon Cyberpunk</option>
                        <option value="theme-obsidian">Obsidian Rojo</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- PANEL MAESTRO DE ADMINISTRADOR (LÁPIZ ✏️) -->
        <div id="adminModal" class="modal-overlay">
            <div class="modal-card admin-modal-card glassmorphism">
                <div class="modal-header">
                    <h2>PANEL MAESTRO LUMERA</h2>
                    <span class="modal-close" id="btnCloseAdmin">✕</span>
                </div>
                
                <div class="admin-actions-bar">
                    <button class="btn btn-primary" id="btnAdminAddContent">+ Contenido</button>
                    <button class="btn btn-secondary" id="btnAdminAddCategory">+ Categoría</button>
                    <button class="btn btn-secondary" id="btnAdminHero">Hero Banner</button>
                    <button class="btn btn-secondary" id="btnAdminSpark">Spark TikTok</button>
                </div>

                <div class="admin-tab-body" id="adminTabBody">
                    <!-- Formularios inyectados dinámicamente -->
                </div>
            </div>
        </div>

        <!-- REPRODUCTOR PRO CUSTOM -->
        <div id="lumeraPlayer" class="player-container">
            <video id="mainVideo" playsinline></video>
            <div class="player-controls" id="playerControls">
                <div class="p-top">
                    <button id="btnClosePlayer" class="p-btn">✕</button>
                    <button id="btnCC" class="p-btn">CC</button>
                </div>
                <div class="p-center">
                    <button id="btnPlayPause" class="p-btn-play">▶</button>
                </div>
                <div class="p-bottom">
                    <input type="range" id="seekSlider" value="0" min="0" max="100">
                </div>
            </div>
        </div>

    </div>

    <!-- SCRIPT PRINCIPAL (SISTEMA DE MÓDULOS) -->
    <script type="module" src="app.js"></script>
</body>
</html>
