<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lumera</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- NAVBAR PRINCIPAL (Sin logo central) -->
  <header class="navbar">
    <button id="btnOpenDrawer" class="icon-btn" aria-label="Menú">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2">
        <line x1="3" y1="12" x2="21" y2="12"></line>
        <line x1="3" y1="6" x2="21" y2="6"></line>
        <line x1="3" y1="18" x2="21" y2="18"></line>
      </svg>
    </button>

    <div class="nav-right">
      <select id="langSelector" class="lang-dropdown">
        <option value="es">ES</option>
        <option value="en">EN</option>
        <option value="pt">PT</option>
        <option value="fr">FR</option>
        <option value="de">DE</option>
        <option value="ja">JA</option>
      </select>
    </div>
  </header>

  <!-- DRAWER / MENÚ LATERAL -->
  <div id="drawerOverlay" class="drawer-overlay"></div>
  <aside id="sideDrawer" class="side-drawer">
    <div class="drawer-header">
      <img src="https://i.imgur.com/9W9C2TC.png" alt="Lumera Logo" class="drawer-logo">
      <button id="btnCloseDrawer" class="icon-btn">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </div>
    
    <nav class="drawer-nav">
      <button class="nav-item" data-view="home" data-i18n="movies">Películas</button>
      <button class="nav-item kids-nav-btn" data-view="kids">
        <img src="https://i.imgur.com/9rDtCyZ.png" alt="Kids Logo" class="kids-nav-logo">
        <span data-i18n="kids">Kids</span>
      </button>
      <button class="nav-item" data-view="admin" data-i18n="settings">Panel Maestro</button>
    </nav>
  </aside>

  <!-- CONTENEDOR PRINCIPAL REACTIVO -->
  <main id="appContainer" class="main-content"></main>

  <script type="module" src="app.js"></script>
</body>
</html>
