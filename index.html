<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lumera</title>
  <link rel="icon" href="https://i.imgur.com/9rarmsD.png" type="image/png">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- BARRA DE NAVEGACIÓN PRINCIPAL (HEADER) -->
  <header class="glass-nav">
    <div class="nav-left">
      <button id="btnMenu" class="svg-btn" aria-label="Abrir Menú">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M3 12h18M3 6h18M3 18h18"/>
        </svg>
      </button>
      <img src="https://i.imgur.com/kTrXlnu.png" alt="Lumera Logo" class="top-logo">
    </div>
    
    <div class="nav-right">
      <!-- SELECTOR DE IDIOMAS INTEGRADO -->
      <select id="langSelect" style="background: rgba(255,255,255,0.1); color: white; border: 1px solid rgba(212,175,55,0.4); padding: 6px 10px; border-radius: 8px; font-weight: bold; cursor: pointer; outline: none;">
        <option value="es" style="background: #111; color: white;">ES</option>
        <option value="en" style="background: #111; color: white;">EN</option>
        <option value="ja" style="background: #111; color: white;">JA</option>
        <option value="fr" style="background: #111; color: white;">FR</option>
        <option value="pt" style="background: #111; color: white;">PT</option>
        <option value="de" style="background: #111; color: white;">DE</option>
      </select>
    </div>
  </header>

  <!-- MENÚ LATERAL (DRAWER Y OVERLAY) -->
  <div id="drawerOverlay" class="overlay"></div>
  <aside id="mainDrawer" class="glass-drawer">
    <div class="drawer-header" style="display: flex; justify-content: space-between; align-items: center;">
      <img src="https://i.imgur.com/9rarmsD.png" alt="Lumera Drawer Logo" class="drawer-logo">
      <button id="btnCloseDrawer" style="background: none; border: none; color: white; font-size: 24px; cursor: pointer;">✕</button>
    </div>
    <nav class="drawer-links">
      <a href="#" class="nav-item">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg> 
        <span data-i18n="catalogHome">Inicio</span>
      </a>
      <a href="#" class="nav-item">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="7" width="20" height="15" rx="2" ry="2"/><polyline points="17 2 12 7 7 2"/></svg> 
        <span data-i18n="series">Series</span>
      </a>
      <a href="#" class="nav-item">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="2" width="20" height="20" rx="2.18" ry="2.18"/><line x1="7" y1="2" x2="7" y2="22"/><line x1="17" y1="2" x2="17" y2="22"/><line x1="2" y1="12" x2="22" y2="12"/><line x1="2" y1="7" x2="7" y2="7"/><line x1="2" y1="17" x2="7" y2="17"/><line x1="17" y1="17" x2="22" y2="17"/><line x1="17" y1="7" x2="22" y2="7"/></svg> 
        <span data-i18n="movies">Películas</span>
      </a>
      <a href="#" class="nav-item">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/><line x1="9" y1="9" x2="9.01" y2="9"/><line x1="15" y1="9" x2="15.01" y2="9"/></svg> 
        <span data-i18n="catalogKids">Niños</span>
      </a>
      <a href="#" class="nav-item">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg> 
        <span data-i18n="profiles">Perfiles</span>
      </a>
    </nav>
  </aside>

  <!-- CONTENEDOR PRINCIPAL DINÁMICO DE LA APLICACIÓN -->
  <main id="appContainer"></main>

  <!-- MÓDULOS DE NAVEGACIÓN Y AUTENTICACIÓN -->
  <script type="module" src="app.js"></script>
  <script type="module" src="auth.js"></script>
</body>
</html>
