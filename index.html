<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lumera</title>
  <link rel="icon" href="https://i.imgur.com/cGjy69f.png" type="image/png">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- BARRA SUPERIOR (NAVBAR) -->
  <header class="glass-header">
    <div class="header-left">
      <button id="btnOpenDrawer" class="icon-btn">☰</button>
      <img src="https://i.imgur.com/YMTYgCS.png" alt="Lumera Logo" class="brand-logo">
    </div>
    
    <div class="header-right">
      <button id="btnSearch" class="icon-btn">🔍</button>
      <button id="btnLang" class="icon-btn">🌐</button>
      <button id="btnSettings" class="icon-btn">⚙️</button>
      <div id="activeProfileAvatar" class="mini-avatar hidden"></div>
    </div>
  </header>

  <!-- MENÚ LATERAL (DRAWER) -->
  <aside id="drawerMenu" class="drawer glass-panel">
    <div class="drawer-header">
      <img src="https://i.imgur.com/cGjy69f.png" alt="Lumera Icon" class="drawer-logo">
      <button id="btnCloseDrawer" class="icon-btn">✕</button>
    </div>
    <nav class="drawer-links">
      <a href="#" id="navHome" class="nav-item">Inicio</a>
      <a href="#" id="navSeries" class="nav-item">Series</a>
      <a href="#" id="navMovies" class="nav-item">Películas</a>
      <a href="#" id="navKids" class="nav-item rainbow-border-text">Kids</a>
      <a href="#" id="navSparks" class="nav-item">Spark Shorts</a>
      <a href="#" id="navProfiles" class="nav-item">Perfiles</a>
      <a href="#" id="navAdmin" class="nav-item hidden">Panel Admin</a>
    </nav>
  </aside>
  <div id="drawerOverlay" class="overlay"></div>

  <!-- CONTENEDOR PRINCIPAL -->
  <main id="appContainer" class="main-content"></main>

  <!-- MODAL DE IDIOMAS (i18n) -->
  <div id="langModal" class="modal glass-modal hidden">
    <div class="modal-content glass-panel">
      <h3 id="txtLangTitle">Seleccionar Idioma</h3>
      <div id="langOptions" class="lang-grid"></div>
      <button id="btnCloseLang" class="btn-secondary">Cerrar</button>
    </div>
  </div>

  <!-- MODAL DE AUTENTICACIÓN / PERFILES -->
  <div id="authModal" class="modal glass-modal hidden">
    <div class="modal-content glass-panel" id="authModalBody"></div>
  </div>

  <!-- SCRIPT PRINCIPAL -->
  <script type="module" src="app.js"></script>
</body>
</html>
