    if (!this.vuln) return false;
    this.flash = 1; this.bossRef.hurt(1, this); this.toIdle(); return true;
  }
  kill() {}
  playerContact() {
    const p = G.player;
    if (p.dying || !overlap(this, p)) return;
    if (p.vy > 60 && p.y < this.y - this.hh * 0.3 && this.vuln) { this.hurt(1, p); p.vy = -660; p.jumps = p.airJumps(); Sfx.play('stomp'); G.puff(p.x, p.y + 12, '#fff', 6, 80); return; }
    if (this.harm) p.hurt(1, this.x);
  }
  update(dt) {
    this.baseUpdate(dt);
    const b = this.bossRef, p = G.player, gy = b.gy(), x0 = b.ax0(), x1 = b.ax1();
    if (b.dead) { this.dead = true; return; }
    this.st -= dt;
    const goTo = (tx, ty, k) => { this.x = lerp(this.x, tx, Math.min(1, dt * k)); this.y = lerp(this.y, ty, Math.min(1, dt * k)); };
    if (this.state === 'idle') { const [hx, hy] = this.home(); goTo(hx, hy + Math.sin(this.t * 2 + this.side) * 10, 3); }
    else if (this.state === 'slam') {
      if (this.sub === 'prep') { goTo(clamp(p.x, x0 + 30, x1 - 30), gy - 240, 6); if (this.st <= 0) { this.sub = 'drop'; this.vy = 200; this.warn = false; this.harm = true; } }
      else if (this.sub === 'drop') {
        this.vy += 4200 * dt; this.y += this.vy * dt;
        if (this.y + this.hh >= gy) { this.y = gy - this.hh; G.shake(10); Sfx.play('explode'); G.dust(this.x, gy); if (b.waves) { G.add(new Shockwave(this.x - this.hw, gy, -1, 330)).bossHazard = true; G.add(new Shockwave(this.x + this.hw, gy, 1, 330)).bossHazard = true; } this.sub = 'rest'; this.st = 1.8 - (b.speedUp || 0); this.harm = false; this.vuln = true; }
      } else if (this.st <= 0) this.toIdle();
    } else if (this.state === 'sweep') {
      const y = gy - this.hh, sx = this.from > 0 ? x1 - 10 : x0 + 10;
      if (this.sub === 'prep') { goTo(sx, y, 7); if (this.st <= 0) { this.sub = 'go'; this.warn = false; this.harm = true; } }
      else if (this.sub === 'go') { this.x += -this.from * 520 * dt; this.y = y; if ((this.from > 0 && this.x < x0 + 10) || (this.from < 0 && this.x > x1 - 10)) { this.sub = 'rest'; this.st = 1.4 - (b.speedUp || 0); this.harm = false; this.vuln = true; } }
      else if (this.st <= 0) this.toIdle();
    }
    this.playerContact();
  }
  draw(ctx) {
    const gy = this.bossRef.gy();
    if (this.state === 'slam' && this.sub !== 'rest') { ctx.fillStyle = `rgba(0,0,0,${this.sub === 'prep' ? 0.25 + 0.15 * Math.sin(this.t * 20) : 0.4})`; ctx.beginPath(); ctx.ellipse(this.x, gy - 2, 30, 7, 0, 0, TAU); ctx.fill(); }
    const rot = this.state === 'sweep' ? -this.from * 1.4 : 0;
    Art.bigUtensil(ctx, this.x, this.y - 10, 0.7, this.kind, { rot, vuln: this.vuln, warn: this.warn && Math.sin(this.t * 24) > 0, t: this.t, eyes: this.bossRef.handEyes, expr: this.vuln ? 'idiot' : 'angry' });
    if (this.flash > 0) { ctx.save(); ctx.globalAlpha = this.flash * 0.6; ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(this.x, this.y, 30, 0, TAU); ctx.fill(); ctx.restore(); }
  }
}

// ======================= Nivel 18: Los Cubiertos Reales =======================
class Cubiertos extends Ent {
  constructor(x, y) { super(x, y, 1, 1); this.r = 60; this.boss = true; this.nameKey = 'cubiertos'; this.hp = this.maxHp = 8; this.active = false; this.noClamp = true; this.st = 2; this.hands = null; this.handEyes = true; this.waves = true; this.ownRetryMsg = false; }
  gy() { return (G.h - 3) * TILE; } ax0() { return (G.arena.x0 + 1) * TILE; } ax1() { return G.arena.x1 * TILE; }
  hx() { return G.cam.x + G.vw / 2; } hy() { return G.cam.y + G.vh * 0.32; }
  aimX() { const h = this.hands && this.hands.find((q) => q.vuln); return h ? h.x : this.hx(); } aimY() { const h = this.hands && this.hands.find((q) => q.vuln); return h ? h.y : this.hy(); }
  ensureHands() { if (this.hands) return; this.hands = [new CutleryHand(this, -1, 'fork'), new CutleryHand(this, 1, 'knife')]; for (const h of this.hands) { [h.x, h.y] = h.home(); G.add(h); } }
  reset() { this.st = 2; if (this.hands) for (const h of this.hands) h.toIdle(); }
  hurt(d) { if (this.dead) return false; this.hp -= d; Sfx.play('bosshit'); this.speedUp = this.hp <= 4 ? 0.2 : 0; if (this.hp <= 0) { this.hp = 0; this.dead = true; for (const h of this.hands || []) h.dead = true; } return true; }
  update(dt) {
    this.t += dt;
    if (!this.active) return;
    this.ensureHands();
    this.st -= dt;
    if (this.st <= 0) {
      const p = G.player, free = this.hands.filter((h) => h.state === 'idle');
      if (free.length) {
        const h = pick(free);
        if (Math.random() < 0.5) h.start('slam'); else h.start('sweep', { from: p.x < (this.ax0() + this.ax1()) / 2 ? 1 : -1 });
        if (this.hp <= 4 && free.length > 1 && Math.random() < 0.5) { const o = free.find((q) => q !== h); o.start('slam'); o.st += 0.8; }
      }
      this.st = this.hp <= 4 ? 1.8 : 2.4;
    }
  }
  drawBack(ctx) {
    if (!this.active) return;
    ctx.save(); ctx.translate(this.hx(), this.hy() - 30); ctx.fillStyle = '#ffd23a'; ctx.strokeStyle = '#000'; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.moveTo(-50, 16); ctx.lineTo(-56, -30); ctx.lineTo(-24, -8); ctx.lineTo(0, -40); ctx.lineTo(24, -8); ctx.lineTo(56, -30); ctx.lineTo(50, 16); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.restore();
  }
}

// ======================= Nivel 20: EL COCINERO =======================
// Fase 1: manos con tenedor y cuchillo. Fase 2: el Gran Apetito muerde la arena. Fase 3: depende de Panchita
// (si la salvaste te ayuda desde su avión; si la dejaste caer, el Cocinero la tiene adentro: Panchita.EXE).
class Cocinero extends Ent {
  constructor(x, y) { super(x, y, 90, 80); this.r = 80; this.boss = true; this.isEnemy = false; this.nameKey = 'cocinero'; this.hp = this.maxHp = 12; this.active = false; this.noClamp = true; this.st = 2.5; this.hands = null; this.phaseN = 0; this.flash = 0; this.biteT = 3; this.helpT = 6; this.waves = false; this.ownRetryMsg = true; }
  gy() { return (G.h - 3) * TILE; } ax0() { return (G.arena.x0 + 1) * TILE; } ax1() { return G.arena.x1 * TILE; }
  hx() { return G.cam.x + G.vw / 2 + Math.sin(this.t * 0.5) * 40; } hy() { return G.cam.y + G.vh * 0.42 + Math.sin(this.t) * 8; }
  aimX() { const h = this.hands && this.hands.find((q) => q.vuln); return h ? h.x : this.hx(); } aimY() { const h = this.hands && this.hands.find((q) => q.vuln); return h ? h.y : this.hy(); }
  ensureHands() { if (this.hands) return; this.hands = [new CutleryHand(this, -1, 'fork'), new CutleryHand(this, 1, 'knife')]; for (const h of this.hands) { [h.x, h.y] = h.home(); G.add(h); } }
  clearHazards() { for (const e of G.ents) if (e.bossHazard || (e.isEnemy && !e.boss) || e instanceof VoidBite) e.dead = true; if (this.hands) for (const h of this.hands) h.toIdle(); }
  reset() { this.hp = this.maxHp - this.phaseN * 4; this.st = 2.5; this.clearHazards(); G.toast(T('t_pxCheckpoint')); }
  hurt(d) {
    if (this.dead || this.finale) return false;
    this.hp -= d; this.flash = 1; Sfx.play('bosshit');
    if (this.hp <= 0) { this.hp = 0; this.finale = true; this.clearHazards(); G.event('cocineroDown'); return true; }
    const ph = Math.min(2, Math.floor((this.maxHp - this.hp) / 4));
    if (ph !== this.phaseN && this.hp === Math.ceil(this.hp)) {
      this.phaseN = ph; this.clearHazards(); this.st = 3; G.flash = 0.5; G.shake(12); Sfx.play('glitch');
      this.waves = ph >= 1; this.speedUp = ph * 0.15;
      G.add(new Pickle((this.ax0() + this.ax1()) / 2, this.gy() - 220, true));
      G.event('cocineroP' + ph);
    }
    return true;
  }
  update(dt) {
    this.t += dt;
    if (this.flash > 0) this.flash = Math.max(0, this.flash - dt * 4);
    this.x = this.hx(); this.y = this.hy();
    if (!this.active || this.finale) return;
    this.ensureHands();
    const p = G.player, x0 = this.ax0(), x1 = this.ax1(), gy = this.gy();
    this.st -= dt;
    if (this.st <= 0) {
      const free = this.hands.filter((h) => h.state === 'idle');
      if (free.length) {
        const h = pick(free);
        if (Math.random() < 0.55) h.start('slam'); else h.start('sweep', { from: p.x < (x0 + x1) / 2 ? 1 : -1 });
      }
      // ayudantes del Cocinero
      if (Math.random() < 0.35 && G.ents.filter((e) => e.isEnemy && !e.boss && !e.dead).length < 3) { const e = new (this.phaseN >= 1 ? Migaja : pick([Cucharita, Tenedor]))(clamp(p.x + pick([-160, 160]), x0 + 30, x1 - 30), this.phaseN >= 1 ? gy - 120 : G.cam.y - 20); if (!e.flying) e.vy = 100; e.bossHazard = true; G.add(e); }
      this.st = [2.4, 2.1, 1.8][this.phaseN];
    }
    // fase 2+: el Gran Apetito muerde la arena
    if (this.phaseN >= 1) {
      this.biteT -= dt;
      if (this.biteT <= 0) { this.biteT = this.phaseN >= 2 ? 3.2 : 4.2; const b = new VoidBite(clamp(p.x + rand(-60, 60), x0 + 40, x1 - 40), gy - rand(10, 100), { r: 1.6, every: 99, delay: 0.01 }); b.bossHazard = true; G.add(b); }
    }
    // fase 3: Panchita
    if (this.phaseN >= 2) {
      this.helpT -= dt;
      if (this.helpT <= 0) {
        if (Save.data.choice === 'save') {
          // desde su avión: escudo para Pancho y aviones de papel al Cocinero
          this.helpT = 7; G.add(new PowerCapsule(clamp(p.x + rand(-100, 100), x0 + 40, x1 - 40), gy - 60, 'protegido', false)).bossHazard = true;
          for (const h of this.hands) if (h.state === 'idle') { h.start('slam'); break; }
          Sfx.play('lasso');
        } else {
          // Panchita.EXE: palillos glitcheados
          this.helpT = 3.5; for (let i = 0; i < 5; i++) G.add(new SkyFall(clamp(p.x + (i - 2) * 70 + rand(-15, 15), x0 + 10, x1 - 10), 'palillo', i * 0.1, gy)); Sfx.play('glitch');
        }
      }
    }
  }
  drawBack(ctx) {
    if (!this.active && !this.show) return;
    const exe = this.phaseN >= 2 && Save.data.choice !== 'save';
    Art.cocinero(ctx, this.x, this.y, 0.7, { t: this.t, expr: this.flash > 0 ? 'scared' : this.finale ? 'verysad' : this.phaseN >= 2 ? 'angry' : 'serious', flash: this.flash * 0.6, dark: this.phaseN >= 1 || exe });
    if (exe) { ctx.save(); ctx.globalAlpha = 0.85; Art.food(ctx, this.x, this.y - 110, 14, 'panchita', { expr: 'verysad', t: this.t, glitch: true }); ctx.restore(); }
    // Panchita ayudando desde su avión (si la salvaste)
    if (this.phaseN >= 2 && Save.data.choice === 'save') {
      const px = G.cam.x + 120 + Math.sin(this.t * 0.8) * 60, py = G.cam.y + 70 + Math.sin(this.t * 1.7) * 10;
      ctx.save(); ctx.translate(px, py + 18); ctx.fillStyle = '#fff'; ctx.strokeStyle = '#000'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(60, 0); ctx.lineTo(-50, -18); ctx.lineTo(-28, 0); ctx.lineTo(-50, 18); ctx.closePath(); ctx.fill(); ctx.stroke(); ctx.restore();
      Art.food(ctx, px - 4, py, 12, 'panchita', { expr: 'angry', t: this.t, phi: 0.6 });
    }
  }
}

SPAWNERS.panchitaRunner = (lv, d, cx, cy, by) => { const r = new PanchitaRunner(cx, by - 20); r.endX = (d.end || 0) * TILE; lv.runner = r; return r; };
ENEMY_TYPES.panchita = PanchitaBoss;
ENEMY_TYPES.freidora = Freidora;
ENEMY_TYPES.santy = SantyBoss;
ENEMY_TYPES.cubiertos = Cubiertos;
ENEMY_TYPES.cocinero = Cocinero;

</script>
<script>/* js/levels1.js */
// Niveles e historia de Pancho (parte 1): mundos, mapa, ayudas de guion, el prólogo y los niveles 1 a 5.
// Cada nivel se construye con el "cursor" de LB (ver game.js).
// Los textos de los diálogos están en lang/*.js con la clave "<diálogo>.<número de línea>".
'use strict';

// ---------- Diálogos: [quién habla, expresión] ----------
const DLG = {
  // Prólogo: el Fooworld
  'P.start': [['pancho', 'serious'], ['pancho', 'neutral']],
  'P.papas': [['papas', 'happy'], ['pancho', 'angry'], ['papas', 'neutral']],
  'P.dona': [['dona', 'happy'], ['pancho', 'serious']],
  'P.meet': [['hamburguer', 'happy'], ['pancho', 'angry'], ['hamburguer', 'happy'], ['pancho', 'serious'], ['hamburguer', 'neutral'], ['pancho', 'happy']],
  'P.hbprick': [['hamburguer', 'idiot']],
  'P.taken': [['pancho', 'scared'], ['pancho', 'angry']],
  'P.end': [['narrador', 'neutral'], ['narrador', 'neutral']],
  // Nivel 1
  '1.wake': [['pancho', 'idiot'], ['pancho', 'scared'], ['pancho', 'scared']],
  '1.tutor': [['tutor', 'happy'], ['pancho', 'angry'], ['tutor', 'happy'], ['tutor', 'neutral']],
  '1.nm_normal': [['tutor', 'happy']],
  '1.nm_joshua': [['tutor', 'angry'], ['tutor', 'serious']],
  '1.nm_hamburguer': [['tutor', 'serious'], ['tutor', 'neutral']],
  '1.nm_manda': [['tutor', 'scared'], ['tutor', 'sad']],
  '1.nm_stupid': [['tutor', 'angry'], ['tutor', 'angry']],
  '1.nm_bad': [['tutor', 'scared'], ['tutor', 'serious']],
  '1.nm_carlitos': [['tutor', 'happy'], ['tutor', 'happy']],
  '1.nm_elver': [['tutor', 'happy'], ['tutor', 'neutral']],
  '1.after': [['pancho', 'angry'], ['tutor', 'happy'], ['pancho', 'angry'], ['tutor', 'happy'], ['pancho', 'serious'], ['tutor', 'neutral'], ['pancho', 'verysad']],
  '1.again': [['tutor', 'happy'], ['pancho', 'angry']],
  '1.caps': [['tutor', 'happy'], ['tutor', 'neutral']],
  '1.jump': [['pancho', 'happy']],
  '1.end': [['tutor', 'happy'], ['pancho', 'angry'], ['tutor', 'neutral'], ['tutor', 'serious'], ['pancho', 'verysad']],
  // Nivel 2
  '2.start': [['tutor', 'neutral'], ['pancho', 'scared'], ['tutor', 'happy']],
  '2.mid': [['tutor', 'neutral'], ['pancho', 'serious'], ['tutor', 'sad'], ['pancho', 'sad']],
  // Nivel 3
  '3.start': [['tutor', 'happy'], ['pancho', 'angry']],
  '3.mid': [['tutor', 'neutral'], ['pancho', 'neutral'], ['tutor', 'sad'], ['pancho', 'serious']],
  // Nivel 4
  '4.start': [['tutor', 'happy'], ['tutor', 'neutral'], ['pancho', 'scared']],
  '4.swap': [['clonbot', 'happy'], ['pancho', 'scared']],
  '4.boss': [['tutor', 'scared']],
  '4.bossEnd': [['pancho', 'happy'], ['tutor', 'happy']],
  // Nivel 5
  '5.start': [['tutor', 'serious'], ['pancho', 'serious']],
  '5.santy': [['santy', 'happy'], ['pancho', 'scared'], ['santy', 'happy'], ['santy', 'angry'], ['tutor', 'scared']],
  '5.escape': [['santy', 'sad'], ['santy', 'verysad'], ['pancho', 'happy'], ['pancho', 'serious'], ['tutor', 'happy']],
};

const en = (kind, extra = {}) => Object.assign({ kind }, extra);

// ---------- Mundos ----------
const WORLDS = [
  { id: 0, levels: ['P'] },
  { id: 1, levels: ['1', '2', '3', '4', '5'] },
  { id: 2, levels: ['6', '7', '8', '9', '10'] },
  { id: 3, levels: ['11', '12', '13', '14', '15'] },
  { id: 4, levels: ['16', '17', '18', '19', '20'] },
];
const LEVEL_ORDER = WORLDS.flatMap((w) => w.levels);
// Mapa del mundo: zonas (de 0 a 1 en x)
const MAP_ZONES = [
  { w: 0, x0: 0, x1: 0.07, col: '#ffb36b' },
  { w: 1, x0: 0.07, x1: 0.31, col: '#7fe07a' },
  { w: 2, x0: 0.31, x1: 0.54, col: '#c9a2ff' },
  { w: 3, x0: 0.54, x1: 0.77, col: '#a2526a' },
  { w: 4, x0: 0.77, x1: 1, col: '#3a5a8a' },
];

// Ayudas para guiones: congela a Pancho y pone las franjas de cine
function cutOn(lv) { lv.cut = true; lv.player.frozenCut = true; lv.player.vx = 0; }
function cutOff(lv) { lv.cut = false; lv.player.frozenCut = false; lv.player.forceExpr = null; lv.player.lookPhi = null; }
function* fadeOut(lv, d = 1) { for (let i = 0; i < 30; i++) { lv.fade = i / 30; yield d / 30; } lv.fade = 1; }
function* fadeIn(lv, d = 1) { for (let i = 30; i >= 0; i--) { lv.fade = i / 30; yield d / 30; } lv.fade = 0; }
function npcById(lv, id) { return lv.ents.find((e) => e instanceof NPC && e.id === id); }
// diálogo según lo que elegiste con Panchita (las claves con "d" son de cuando la dejaste caer)
function cKey(key) { return Save.data.choice === 'drop' && DLG[key + 'd'] ? key + 'd' : key; }

// ---------- Entidades para las escenas ----------
// Cuerda que baja del cielo (como un vaquero atrapando algo)
class CutRope extends Ent {
  constructor(x, ty) { super(x, 0, 4, 4); this.ty = ty; this.len = 0; this.state = 'down'; this.always = true; this.front = true; }
  update(dt) {
    this.t += dt;
    if (this.state === 'down') { this.len = Math.min(1, this.len + dt * 1.3); if (this.len >= 1) { this.state = 'hold'; this.st = 0.7; Sfx.play('lasso'); } }
    else if (this.state === 'hold') { this.st -= dt; if (this.st <= 0) this.state = 'up'; }
    else this.len -= dt * 0.55;
    if (this.len < -0.2) this.dead = true;
    this.endY = lerp(G.cam.y - 40, this.ty, this.len);
    if (this.grab && this.state !== 'down') { this.grab.y = this.endY + 18; this.grab.x = this.x + Math.sin(this.t * 3) * 4; }
  }
  draw(ctx) {
    const top = G.cam.y - 40;
    ctx.strokeStyle = '#000'; ctx.lineWidth = 6; ctx.beginPath(); ctx.moveTo(this.x + Math.sin(this.t * 2) * 3, top); ctx.lineTo(this.x, this.endY); ctx.stroke();
    ctx.strokeStyle = '#c98a3a'; ctx.lineWidth = 4; ctx.stroke();
    ctx.lineWidth = 5; ctx.beginPath(); ctx.ellipse(this.x, this.endY + 12, 26, 10, 0, 0, TAU); ctx.stroke();
  }
}
// Palillo que vuela hacia Pancho (el pinchazo)
class CutDart extends Ent {
  constructor(x, y, tx, ty, ev) { super(x, y, 6, 6); this.tx = tx; this.ty = ty; this.ev = ev; this.always = true; this.front = true; }
  update(dt) {
    this.t += dt;
    const a = Math.atan2(this.ty - this.y, this.tx - this.x); this.ang = a;
    this.x += Math.cos(a) * 900 * dt; this.y += Math.sin(a) * 900 * dt;
    if (dist(this.x, this.y, this.tx, this.ty) < 18) { this.dead = true; Sfx.play('prick'); if (this.ev) G.event(this.ev); }
  }
  draw(ctx) { ctx.save(); ctx.translate(this.x, this.y); ctx.rotate(this.ang || 0); ctx.strokeStyle = '#000'; ctx.lineWidth = 6; ctx.beginPath(); ctx.moveTo(-14, 0); ctx.lineTo(14, 0); ctx.stroke(); ctx.strokeStyle = '#f0d49a'; ctx.lineWidth = 3.5; ctx.stroke(); ctx.restore(); }
}
// Avión de papel en el fondo, con una figura que nadie conoce (nivel 6)
class PaperPlaneBG extends Ent {
  constructor(x, y) { super(x, y, 1, 1); this.always = true; this.go = false; this.px = 1.2; }
  update(dt) { this.t += dt; if (this.go) this.px -= dt * 0.11; if (this.px < -0.3) { this.go = false; this.px = 1.2; } }
  drawBack(ctx) {
    if (!this.go) return;
    const x = G.cam.x + G.vw * this.px, y = G.cam.y + G.vh * 0.22 + Math.sin(this.t * 1.5) * 12;
    ctx.save(); ctx.globalAlpha = 0.85; ctx.translate(x, y);
    ctx.fillStyle = '#ffffff'; ctx.strokeStyle = 'rgba(0,0,0,0.5)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(-60, 0); ctx.lineTo(50, -18); ctx.lineTo(28, 0); ctx.lineTo(50, 18); ctx.closePath(); ctx.fill(); ctx.stroke();
    // la figura misteriosa: una silueta
    ctx.fillStyle = '#1a1020'; ctx.beginPath(); roundRect(ctx, -6, -40, 16, 26, 4); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.ellipse(-1, -32, 2, 2.5, 0, 0, TAU); ctx.ellipse(5, -32, 2, 2.5, 0, 0, TAU); ctx.fill();
    ctx.restore();
  }
}
// Puente levadizo que se cierra detrás de Pancho (nivel 5)
class Drawbridge extends Ent {
  constructor(x, y, tx, tyTop, h) { super(x, y, 16, 10); this.tx = tx; this.tyTop = tyTop; this.h = h; this.closed = false; this.always = true; }
  close() { if (this.closed) return; this.closed = true; for (let i = 0; i < this.h; i++) G.setTile(this.tx, this.tyTop + i, 'g'); Sfx.play('explode'); G.shake(8); }
}

const LEVELS = {
  // =========================== PRÓLOGO: el Fooworld ===========================
  P: {
    theme: 'fooworld', music: 'home', noTutor: true, start: 'P.start', see: ['pancho', 'vecinos'], noResult: true, storyAfter: 'toFoogame',
    events: {
      meet(lv) {
        lv.run(function* () {
          cutOn(lv);
          const p = lv.player, hb = npcById(lv, 'hb');
          p.lookPhi = 1.15;
          yield 0.4;
          Save.see('hamburguer');
          yield { dlg: 'P.meet' };
          // primero un pinchazo a Hamburguer...
          const dart = lv.add(new CutDart(hb.x + 420, hb.y - 140, hb.x + 4, hb.y - 4));
          yield { until: () => dart.dead };
          hb.expr = 'scared'; lv.puff(hb.x, hb.y - 10, '#fff', 6, 80); lv.shake(2);
          yield 0.4;
          yield { dlg: 'P.hbprick' };
          hb.expr = 'blink';
          yield 0.5;
          // ...y después una cuerda baja del cielo y se lo lleva
          const rope = lv.add(new CutRope(hb.x, hb.y - 18));
          yield { until: () => rope.state !== 'down' };
          rope.grab = hb; hb.expr = 'idiot'; lv.shake(4);
          yield 1.6;
          yield { dlg: 'P.taken' };
          // un pinchazo...
          lv.add(new CutDart(p.x + 420, p.y - 120, p.x + 6, p.y - 4, 'prick'));
        });
      },
      prick(lv) {
        lv.run(function* () {
          const p = lv.player;
          p.forceExpr = 'scared'; lv.flash = 0.2; lv.shake(3);
          yield 0.5;
          p.forceExpr = 'idiot';
          yield 0.6;
          p.forceExpr = 'blink'; p.spin = 0;
          yield* fadeOut(lv, 1.4);
          yield { dlg: 'P.end' };
          lv.finish();
        });
      },
    },
    build(b) {
      b.e(4, 'start'); b.e(6, 'deco', { kind: 'panchoHouse' }); b.flat(16);
      b.e(3, 'sign', { key: 'sg_move' }); b.e(9, 'npc', { kind: 'papas', dlg: 'P.papas', once: false }); b.e(13, 'deco', { kind: 'tree' }); b.flat(16);
      b.e(3, 'sign', { key: 'sg_jump' }); b.flat(6);

      b.at(14).flat(8); b.e(3, 'enemy', en('tenedor')); b.coins(2, 16, 4); b.flat(2); b.gap(2); b.flat(4); b.at(3).flat(4);
      b.e(2, 'saw', { axis: 'y', range: 4, speed: 1.5 }, 6); b.flat(5); b.e(1, 'enemy', en('cuchillo')); b.flat(7);
      b.e(1, 'check'); b.e(4, 'power', { kind: 'protegido' }, b.g + 1); b.flat(8);
      // la sala del trono: SantyTG11
      b.e(0, 'trigger', { ev: 'santy' }); b.e(-14, 'santy'); b.flat(14);

      b.flat(16); b.gap(3); b.flat(14); b.step(1).flat(10).step(1).flat(10).step(-2).flat(12);

SPAWNERS.drawbridge = (lv, d) => new Drawbridge(d.tx * TILE, d.ty * TILE, d.tx, d.tyTop, d.h);

<script>/* js/levels2.js */
// Niveles 6 a 10: el Mundo Minero, las Cavernas UV, el ClonBot rebelde, Panchita y el borde del mapa.

// ---------- Entidades del nivel 9 ----------
// El ClonBot convertido en nave
class ShipBot extends Ent {
  constructor(x, y) { super(x, y, 40, 14); this.platform = true; this.dx = 0; this.dy = 0; this.go = 0; this.always = true; }
  update(dt) {
    this.t += dt;
    const px = this.x, py = this.y;
    this.x += this.go * dt; this.y = this.baseY == null ? (this.baseY = this.y) : this.baseY + Math.sin(this.t * 2) * 6;
    this.dx = this.x - px; this.dy = this.y - py;
  }
  draw(ctx) {
    BG.flames(ctx, this.x - 46, this.y + 4, 18, 30, this.t * 2);
    ctx.save(); ctx.translate(this.x - 50, this.y + 4); ctx.rotate(-Math.PI / 2); ctx.restore();
    Art.food(ctx, this.x, this.y + 18, 30, 'robot', { phi: 1.0, expr: 'happy', t: this.t });
  }
}
// Hamburguer cayendo de un nivel que se rompe
class FallingBurger extends Ent {
  constructor(ship) { super(ship.x, G.cam.y - 60, 14, 14); this.ship = ship; this.vy = 0; this.always = true; this.front = true; }
  update(dt) {
    this.t += dt; this.x = lerp(this.x, this.ship.x + 20, dt * 3);
    this.vy += 1400 * dt; this.y += this.vy * dt;
    if (this.y >= this.ship.y - this.ship.hh - 14) { this.dead = true; Sfx.play('boing'); G.event('landed'); }
  }
  draw(ctx) { Art.food(ctx, this.x, this.y, 14.5, 'hamburguer', { expr: 'scared', t: this.t, rot: this.t * 6 }); }
}

  // =========================== NIVEL 6: El Mundo Minero (Minero) ===========================

      outlinedText(ctx, `${lv.ores.palo}/2`, 108, y, 15, '#e0b07a', '#000', 'left');

// El vacío que sube por la Torre del Apetito
class VoidRise extends Ent {
  constructor(y) { super(0, y, 1, 1); this.always = true; this.front = true; this.yTop = y; this.speed = 38; this.on = false; }
  update(dt) {
    this.t += dt;
    const p = G.player;
    if (!this.on || G.cut || G.state !== 'play') return;
    this.yTop = Math.min(this.yTop - this.speed * dt, p.y + 380);
    if (!p.dying && p.y + p.hh > this.yTop + 8) { G.glitchFx(p.x, p.y, 14); Sfx.play('bite'); p.inv = 0; p.shield = 0; p.hp = 1; p.hurt(9, p.x); }
  }
  draw(ctx) {
    const x0 = G.cam.x - 20, w = G.vw + 40, top = this.yTop, bot = Math.max(top, G.h * TILE + 40);
    if (top > G.cam.y + G.vh + 40) return;
    ctx.fillStyle = '#07000c'; ctx.beginPath(); ctx.moveTo(x0, bot);
    for (let i = 0; i <= 40; i++) { const x = x0 + (w * i) / 40; ctx.lineTo(x, top + Math.sin(this.t * 4 + i * 1.3) * 7 + (i % 2) * 6); }
    ctx.lineTo(x0 + w, bot); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = '#ff00d4'; ctx.lineWidth = 3; ctx.beginPath();
    for (let i = 0; i <= 40; i++) { const x = x0 + (w * i) / 40; const y = top + Math.sin(this.t * 4 + i * 1.3) * 7 + (i % 2) * 6; i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }
    ctx.stroke();
    if (Math.random() < 0.3) G.glitchFx(x0 + Math.random() * w, top, 1);
  }
}
// La Llave Raíz (en la oficina de MaJo)
class RootKey extends Ent {
  constructor(x, y) { super(x, y, 16, 16); }
  update(dt) {
    this.t += dt;
    const p = G.player;
    if (overlap(this, p) && !p.dying && G.state === 'play') { this.dead = true; Sfx.play('key'); G.sparkle(this.x, this.y, '#ffd23a', 30); G.event('rootkey'); }
  }
  draw(ctx) {
    const y = this.y + Math.sin(this.t * 3) * 4;
    ctx.save(); ctx.globalAlpha = 0.4 + Math.sin(this.t * 5) * 0.2; ctx.fillStyle = '#fff7b0'; ctx.beginPath(); ctx.arc(this.x, y, 30, 0, TAU); ctx.fill(); ctx.restore();
    ctx.save(); ctx.translate(this.x, y); ctx.rotate(-0.5); ctx.fillStyle = '#ffd23a'; ctx.strokeStyle = '#000'; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.moveTo(-12, -12); ctx.lineTo(0, -24); ctx.lineTo(12, -12); ctx.lineTo(0, 0); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#04a0ff'; ctx.beginPath(); ctx.arc(0, -12, 4, 0, TAU); ctx.fill();
    ctx.fillStyle = '#ffd23a'; ctx.fillRect(-3, 0, 6, 22); ctx.strokeRect(-3, 0, 6, 22); ctx.fillRect(3, 12, 7, 4); ctx.strokeRect(3, 12, 7, 4); ctx.fillRect(3, 18, 5, 4); ctx.strokeRect(3, 18, 5, 4);
    ctx.restore();
  }
}

// pone el borde de arriba del suelo como cinta transportadora (>, <) o parrilla (G)
function topRow(b, n, ch) { for (let i = 0; i < n; i++) { b.fillCol(b.x + i, b.g); b.put(b.x + i, b.g - 1, ch); } b.x += n; return b; }

<script>/* js/ui.js */
// Pantallas y menús: título, nombre, mapa, álbum, tienda del Hombre Tutor, opciones, pausa, resultados, historia y final.
'use strict';

const VERSION = 'v1.0.4';

const UI = {
  taps: [], t: 0,
  // Botón: dibuja y devuelve true si se tocó este cuadro. Estilo "tecla": borde inferior grueso.
  btn(ctx, x, y, w, h, label, o = {}) {
    let hit = false;
    for (const tp of this.taps) if (tp.x >= x && tp.x <= x + w && tp.y >= y && tp.y <= y + h) { hit = true; tp.used = true; }
    if (o.disabled) hit = false;
    const col = o.disabled ? '#5a5a66' : (o.color || '#e8762a');
    const r = h / 2;
    ctx.save();
    ctx.fillStyle = shade(col, -0.45); roundRect(ctx, x, y + 5, w, h, r); ctx.fill();
    ctx.fillStyle = col; roundRect(ctx, x, y, w, h, r); ctx.fill();
    ctx.strokeStyle = '#000'; ctx.lineWidth = 3; roundRect(ctx, x, y, w, h + 5, r); ctx.stroke();
    // chorrito de mostaza (o de mayonesa, si el botón es amarillo) arriba
    if (!o.disabled && w > 60) {
      ctx.strokeStyle = col === '#ffd23a' ? '#fff8e0' : '#ffd23a'; ctx.lineWidth = 3; ctx.lineCap = 'round'; ctx.beginPath();
      const x0 = x + r * 0.9, x1 = x + w - r * 0.9, n = Math.max(4, Math.round((x1 - x0) / 16));
      for (let i = 0; i <= n; i++) ctx.lineTo(x0 + (x1 - x0) * i / n, y + 7 + (i % 2 ? -2.5 : 2.5));
      ctx.stroke();
    } else { ctx.fillStyle = 'rgba(255,255,255,0.2)'; ctx.fillRect(x + r, y + 4, w - r * 2, 3); }
    if (label) outlinedText(ctx, label, x + w / 2, y + h / 2 + 1, o.size || Math.min(22, h * 0.45), o.textCol || '#fff', '#000');
    ctx.restore();
    if (hit) Sfx.play('select');
    return hit;
  },
  back(ctx) { return this.btn(ctx, 12, 10, 52, 42, '←', { color: '#c8442c', size: 24 }) || Input.pressed('pause'); },
  panel(ctx, x, y, w, h, col = 'rgba(40,20,8,0.88)') {
    ctx.save(); ctx.fillStyle = col; ctx.strokeStyle = '#ffc061'; ctx.lineWidth = 3;
    roundRect(ctx, x, y, w, h, 14); ctx.fill(); ctx.stroke(); ctx.restore();
  },
  title(ctx, text, y = 32) { outlinedText(ctx, text, VW / 2, y, 30, '#ffc061', '#000'); },
  wallet(ctx) {
    Art.coin(ctx, VW - 120, 32, 0, 13);
    outlinedText(ctx, String(Save.data.wallet), VW - 100, 33, 22, '#fff', '#000', 'left');

};

// ======================= Fondo de menú (nivel sin enemigos que se desplaza) =======================
let menuBg = null;
function ensureMenuBg() {

    menuBg = new Level(LEVELS[id], { preview: true });

}
function drawMenuBg(ctx, dt, S, dim = 0.35) {

  const saved = G; G = bg;
  bg.update(dt); bg.draw(ctx, S);
  G = saved;
  ctx.fillStyle = `rgba(30,12,4,${dim})`; ctx.fillRect(0, 0, VW, VH);
}

// ======================= Título =======================
const ScreenTitle = {
  draw(ctx, dt, S) {
    drawMenuBg(ctx, dt, S, 0.3);
    const t = UI.t;
    // logo: PANCHO con una mostaza en zigzag
    ctx.save(); ctx.translate(VW / 2, 86); ctx.rotate(Math.sin(t * 1.3) * 0.015);
    ctx.fillStyle = '#c8442c'; ctx.strokeStyle = '#000'; ctx.lineWidth = 5;
    capsule(ctx, -190, -44, 190, 44); ctx.fill(); ctx.stroke();
    ctx.strokeStyle = '#ffd400'; ctx.lineWidth = 6; ctx.beginPath(); for (let i = 0; i <= 18; i++) ctx.lineTo(-170 + i * 19, -30 + (i % 2 ? -6 : 6)); ctx.stroke();
    outlinedText(ctx, 'PANCHO', 0, 8, 64, '#fff3c8', '#000');
    ctx.restore();
    // Pancho y Hamburguer
    const bounce = Math.abs(Math.sin(t * 2.4)) * 16;
    Art.food(ctx, VW / 2 - 290, 210 - bounce, 34, 'pancho', { phi: Math.sin(t * 0.8) * 1.0, expr: 'happy', t, sq: bounce < 3 ? 0.1 : 0, hat: Save.data.hat });
    const b2 = Math.abs(Math.sin(t * 2.4 + 1)) * 12;
    if (Save.data.done['9']) Art.food(ctx, VW / 2 + 290, 205 - b2, 30, 'hamburguer', { phi: -0.5 + Math.sin(t) * 0.3, expr: 'happy', t });
    else Art.ball(ctx, VW / 2 + 290, 205 - b2, 32, 'tutor', { phi: -0.5 + Math.sin(t) * 0.3, expr: 'happy', t });
    const bw = 240, bh = 48, x = VW / 2 - bw / 2;
    let y = 160;
    if (UI.btn(ctx, x, y, bw, bh, Save.data.done.P ? T('ui_continue') : T('ui_play'), { color: '#2ecc71' })) {
      if (!Save.data.done.P) startLevel('P'); else setScreen('map');
    }
    y += 62;
    if (UI.btn(ctx, x, y, bw, bh, T('ui_map'))) setScreen('map');
    y += 62;
    if (UI.btn(ctx, x - 128, y, bw, bh, T('ui_chars'), { color: '#3aa0ff' })) setScreen('chars');
    if (UI.btn(ctx, x + 128, y, bw, bh, T('ui_shop'), { color: '#b04dff' })) setScreen('shop');
    y += 62;
    if (UI.btn(ctx, x, y, bw, bh - 6, T('ui_options'), { color: '#6a6a80', size: 18 })) setScreen('options');
    UI.wallet(ctx);
    setFont(ctx, 11, 600); ctx.fillStyle = 'rgba(255,255,255,0.7)'; ctx.textAlign = 'left'; ctx.fillText(VERSION, 10, VH - 10);
  },
  backAction() { return false; },
};

// ======================= Nombre (el Hombre Tutor te pregunta cómo te llamas) =======================
// Easter eggs: Pancho (ocupado), Joshua (asco), Hamburguer (no va con tu comida), MmManda (lo recuerda),
// SixSeven / Quiero Queque / Verity (Jugador Estupido), palabras feas (Carlitos), Carlitos El Más Capito, Elver Galarga.
const BAD_SUB = ['puta', 'puto', 'mierda', 'verga', 'pija', 'pendej', 'cabron', 'culiao', 'culero', 'joder', 'follar', 'chingad', 'maric', 'pene', 'vagina', 'porno', 'sexo', 'fuck', 'shit', 'bitch', 'dick', 'cock', 'pussy', 'nigg', 'negrata', 'hitler', 'nazi', 'penis', 'boob', 'tetas', 'caca', 'idiota', 'estupid', 'imbecil', 'mamaguevo', 'malparid', 'gonorrea', 'cunt', 'whore', 'slut', 'bastard', 'retard', 'merde', 'cazzo', 'scheisse', 'kurwa', 'porra', 'caralho', 'buceta', 'pinche', 'mamon', 'huevon', 'weon', 'conchetumare', 'ctm', 'hdp', 'pelotudo', 'boludo', 'forro', 'trolo', 'chupa', 'semen', 'nalga', 'cagar', 'mear'];
const BAD_WORD = ['ass', 'sex', 'culo', 'tit', 'cum', 'anal', 'rape', 'violar', 'orto', 'ojete', 'paja', 'pajero', 'perra', 'zorra', 'puta', 'fag', 'kys', 'kill', 'pito', 'poto', 'teta', 'cola', 'gil', 'tonto', 'tonta', 'feo', 'fea'];
function normName(s) {
  s = String(s).toLowerCase().replace(/0/g, 'o').replace(/1/g, 'i').replace(/3/g, 'e').replace(/4/g, 'a').replace(/5/g, 's').replace(/@/g, 'a').replace(/\$/g, 's');
  return s.normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9ñ]/g, '');
}
function nameReaction(v) {
  const raw = String(v).trim().slice(0, 18);
  const n = normName(raw), digits = raw.replace(/\s/g, '');
  const tokens = raw.toLowerCase().split(/[^a-zA-Z0-9áéíóúñü@$]+/).map(normName).filter(Boolean);
  if (n === 'pancho') return { type: 'taken' };
  if (n === 'joshua') return { type: 'joshua', name: raw };
  if (['hamburguer', 'hamburguesa', 'hamburger', 'hamburgesa', 'hamburguers'].includes(n)) return { type: 'hamburguer', name: raw };
  if (n === 'mmmanda' || n === 'manda') return { type: 'manda', name: raw };
  if (['sixseven', 'sixsevenn', 'quieroqueque', 'verity'].includes(n) || digits === '67') return { type: 'stupid', name: T('nm_stupidName'), orig: raw };
  if (n === 'carlitoselmascapito') return { type: 'carlitos', name: 'Carlitos' };
  if (n === 'elvergalarga') return { type: 'elver', name: 'Elver' };
  if (BAD_SUB.some((w) => n.includes(w)) || tokens.some((w) => BAD_WORD.includes(w))) return { type: 'bad', name: 'Carlitos' };
  return { type: 'normal', name: raw };
}
const ScreenName = {
  el: null, err: null, t: 0,
  start(then) {
    this.then = then; this.err = null; this.t = 0; screen = 'name'; Input.showControls = false;
    if (!this.el) {
      const el = document.createElement('input');
      el.type = 'text'; el.maxLength = 18; el.autocomplete = 'off'; el.spellcheck = false;
      el.setAttribute('autocapitalize', 'words');
      Object.assign(el.style, { position: 'fixed', zIndex: 5, border: '3px solid #000', borderRadius: '10px', background: '#fff8e8', color: '#2a1606', fontWeight: '800', textAlign: 'center', outline: 'none', padding: '0 8px', boxSizing: 'border-box', fontFamily: '"Trebuchet MS", Roboto, Arial, sans-serif' });
      el.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); this.submit(); } });
      document.body.appendChild(el);
      this.el = el;
    }
    this.el.value = ''; this.el.placeholder = T('nm_placeholder'); this.el.style.display = 'block';
    setTimeout(() => { try { this.el.focus(); } catch (e) { /* nada */ } }, 50);
  },
  place(x, y, w, h) {
    const r = canvas.getBoundingClientRect(), k = r.width / VW;
    Object.assign(this.el.style, { left: (r.left + x * k) + 'px', top: (r.top + y * k) + 'px', width: (w * k) + 'px', height: (h * k) + 'px', fontSize: Math.round(22 * k) + 'px' });
  },
  submit() {
    const v = this.el.value.trim();
    if (!v) { Sfx.play('back'); return; }
    const r = nameReaction(v);
    if (r.type === 'taken') { this.err = T('nm_taken'); Sfx.play('back'); this.el.value = ''; return; }
    this.el.style.display = 'none'; this.el.blur();
    Save.data.name = r.name; Save.write();
    screen = 'play'; Input.showControls = true;
    const cb = this.then; this.then = null;
    if (cb) cb(r);
  },
  draw(ctx, dt, S) {
    this.t += dt;
    if (G) G.draw(ctx, S);
    ctx.fillStyle = 'rgba(20,8,2,0.6)'; ctx.fillRect(0, 0, VW, VH);
    const w = Math.min(560, VW - 40), x = VW / 2 - w / 2, y = 60;
    UI.panel(ctx, x, y, w, 300);
    Art.ball(ctx, x + 70, y + 80, 38, 'tutor', { phi: 0.3, expr: 'happy', t: this.t, blink: this.t % 3 < 0.1 });
    outlinedText(ctx, T('n_tutor'), x + 70, y + 136, 14, '#00ffaa', '#000');
    setFont(ctx, 18, 700); ctx.fillStyle = '#fff'; ctx.textAlign = 'left'; ctx.textBaseline = 'top';
    wrapText(ctx, T('nm_ask'), w - 160).forEach((l, i) => ctx.fillText(l, x + 130, y + 40 + i * 24));
    this.place(x + 130, y + 150, w - 160, 50);
    if (this.err) outlinedText(ctx, this.err, VW / 2 + 50, y + 222, 18, '#ff3030', '#000');
    if (UI.btn(ctx, x + w / 2 - 70 + 50, y + 240, 140, 44, T('ui_ok'), { color: '#2ecc71' }) || Input.pressed('confirm')) this.submit();
  },
  backAction() { return true; },
};

// ======================= Mapa del mundo =======================
const ScreenMap = {
  jx: null, jy: null, walk: 0,
  pos(id) {
    const w = WORLDS.find((x) => x.levels.includes(id)), z = MAP_ZONES.find((q) => q.w === w.id);
    const i = w.levels.indexOf(id), n = w.levels.length;
    const fx = z.x0 + ((i + 0.5) / n) * (z.x1 - z.x0);
    const fy = n === 1 ? 0.55 : [0.66, 0.34, 0.6, 0.26, 0.72][i % 5];
    return [fx * VW, 80 + fy * (VH - 170)];
  },
  draw(ctx, dt, S) {
    const t = UI.t;
    for (const z of MAP_ZONES) {
      ctx.fillStyle = z.col; ctx.fillRect(z.x0 * VW, 0, (z.x1 - z.x0) * VW + 1, VH);
      ctx.fillStyle = 'rgba(0,0,0,0.08)';
      for (let i = 0; i < 14; i++) { const hx = z.x0 * VW + hash1(i + z.w * 31) * (z.x1 - z.x0) * VW, hy = 90 + hash1(i * 7 + z.w) * (VH - 180); ctx.beginPath(); ctx.arc(hx, hy, 6 + hash1(i + 3) * 10, 0, TAU); ctx.fill(); }
    }
    ctx.strokeStyle = 'rgba(0,0,0,0.35)'; ctx.lineWidth = 3; ctx.setLineDash([8, 8]);
    for (const z of MAP_ZONES.slice(1)) { ctx.beginPath(); ctx.moveTo(z.x0 * VW, 60); ctx.lineTo(z.x0 * VW, VH); ctx.stroke(); }

    outlinedText(ctx, T('ui_paused'), VW / 2, 80, 40, '#ffc061');
    const bw = 260, x = VW / 2 - bw / 2;
    if (UI.btn(ctx, x, 130, bw, 48, T('ui_resume'), { color: '#2ecc71' }) || Input.pressed('pause')) { paused = false; Sfx.resume(); }
    if (UI.btn(ctx, x, 192, bw, 48, T('ui_restart'))) { paused = false; Sfx.resume(); startLevel(G.def.id, true); }
    if (UI.btn(ctx, x, 254, bw, 48, T('ui_map'), { color: '#3aa0ff' })) { paused = false; Sfx.resume(); setScreen('map'); }
    if (UI.btn(ctx, x, 316, bw, 48, T('ui_menu'), { color: '#6a6a80' })) { paused = false; Sfx.resume(); setScreen('title'); }
    const d = Save.data;
    if (UI.btn(ctx, x, 386, bw / 2 - 5, 40, `♪ ${d.music ? T('opt_on') : T('opt_off')}`, { color: '#6a4a2a', size: 15 })) { d.music = !d.music; Sfx.setOptions(d.sound, d.music); Save.write(); }
    if (UI.btn(ctx, x + bw / 2 + 5, 386, bw / 2 - 5, 40, `🔊 ${d.sound ? T('opt_on') : T('opt_off')}`, { color: '#6a4a2a', size: 15 })) { d.sound = !d.sound; Sfx.setOptions(d.sound, d.music); Save.write(); }
    // ayuda del poder actual
    if (G && G.player.power) {
      UI.panel(ctx, 20, VH - 92, Math.min(360, VW * 0.4), 76);
      Art.powerIcon(ctx, 48, VH - 54, G.player.power, 0.9);
      setFont(ctx, 12, 600); ctx.fillStyle = '#fff'; ctx.textAlign = 'left'; ctx.textBaseline = 'top';
      wrapText(ctx, T('pwd_' + G.player.power), Math.min(360, VW * 0.4) - 70).slice(0, 4).forEach((l, i) => ctx.fillText(l, 76, VH - 84 + i * 15));
    }
  },
};

// ======================= Final y créditos =======================
function playEnding() {
  const d = Save.data;
  const good = d.choice === 'save';
  d.endings[good ? 'good' : 'bad'] = true; Save.write();
  playStory(good ? 'endGood' : 'endBad', () => { ScreenEnding.t = 0; ScreenEnding.good = good; screen = 'ending'; Sfx.music('ending'); });
}
const ScreenEnding = {
  t: 0,
  draw(ctx, dt, S) {
    this.t += dt;
    ctx.fillStyle = '#1a0c04'; ctx.fillRect(0, 0, VW, VH);
    const y = VH - this.t * 32;
    outlinedText(ctx, T(this.good ? 'end_good' : 'end_bad'), VW / 2, y, 40, '#ffc061');
    const cast = [['pancho', 'food'], ['hamburguer', 'food'], ['panchita', 'food'], ['tutor', 'ball'], ['robot', 'food']];
    cast.forEach(([k, kind], i) => {
      if (k === 'panchita' && !this.good) return;
      const x = VW / 2 - 240 + i * 120, yy = y + 90 - Math.abs(Math.sin(this.t * 3 + i)) * 14;
      if (kind === 'ball') Art.ball(ctx, x, yy, 26, k, { expr: 'happy', t: this.t, phi: Math.sin(this.t + i) * 0.6 });
      else Art.food(ctx, x, yy, k === 'panchita' ? 20 : 22, k, { expr: 'happy', t: this.t, phi: Math.sin(this.t + i) * 0.6 });
    });
    Art.santy(ctx, VW / 2 - 120, y + 250, 0.9, { t: this.t, expr: 'happy' });
    Art.ball(ctx, VW / 2 + 40, y + 205, 28, 'manda', { expr: 'happy', t: this.t });
    Art.ball(ctx, VW / 2 + 110, y + 205, 28, 'joshua', { expr: 'happy', t: this.t });
    Art.ball(ctx, VW / 2 + 180, y + 205, 28, 'nicole', { expr: this.good ? 'happy' : 'sad', acc: ['foxEars', 'foxTail'], t: this.t });
    drawCredits(ctx, y + 290);
    outlinedText(ctx, T('end_thanks'), VW / 2, y + 680, 26, '#fff');
    if (!this.good) outlinedText(ctx, T('end_hint'), VW / 2, y + 730, 15, '#ff8ab0');
    if (this.t > 4) for (const tp of UI.taps) return this.done();
    if (y + 760 < 0) this.done();
  },
  done() { setScreen('map'); },
  backAction() { this.done(); return true; },
};
const ScreenResult = {
  r: null, unlocks: [],
  draw(ctx, dt, S) {
    if (G) { G.update(dt * 0.3); G.draw(ctx, S); }
    ctx.fillStyle = 'rgba(30,12,4,0.65)'; ctx.fillRect(0, 0, VW, VH);
    const r = this.r;
    UI.panel(ctx, VW / 2 - 260, 40, 520, VH - 60);
    outlinedText(ctx, T('res_clear'), VW / 2, 78, 34, '#ffc061');
    outlinedText(ctx, levelLabel(r.id), VW / 2, 114, 17, '#fff');
    const rows = [[T('res_coins'), `${r.coins} / ${r.coinTotal}`], [T('res_time'), `${r.time} s`], [T('res_deaths'), String(r.deaths)], [T('res_reward'), `+${r.reward} ●`]];
    rows.forEach(([a, b], i) => {
      outlinedText(ctx, a, VW / 2 - 200, 156 + i * 32, 17, '#9fd3ff', '#000', 'left');
      outlinedText(ctx, b, VW / 2 + 200, 156 + i * 32, 17, '#fff', '#000', 'right');
    });
    this.unlocks.forEach((u, i) => outlinedText(ctx, u, VW / 2, 296 + i * 24, 16, '#2ecc71'));
    const y = VH - 82, bw = 150;
    const idx = LEVEL_ORDER.indexOf(r.id);
    const nxt = r.next || LEVEL_ORDER[idx + 1];
    if (nxt && UI.btn(ctx, VW / 2 + 85 - bw / 2, y, bw, 46, T('ui_next'), { color: '#2ecc71' })) startLevel(nxt);
    if (UI.btn(ctx, VW / 2 - 85 - bw / 2, y, bw, 46, T('ui_retry'))) startLevel(r.id, true);
    if (UI.btn(ctx, VW / 2 - 245, y + 4, 70, 40, '⌂', { color: '#6a6a80', size: 22 })) setScreen('map');
    if (Input.pressed('confirm') && nxt) startLevel(nxt);
  },
  backAction() { setScreen('map'); return true; },
};

// ======================= Historia (pantallas de texto con dibujo) =======================
const ScreenStory = {
  key: null, then: null, n: 0, page: 0, t: 0,
  draw(ctx, dt, S) {
    this.t += dt;
    ctx.fillStyle = '#140a04'; ctx.fillRect(0, 0, VW, VH);
    const pages = STORY[this.key];
    const k = pages[this.page];
    const text = T(k);
    this.n = Math.min(text.length, this.n + dt * 45);
    outlinedText(ctx, T(this.key + '.title'), VW / 2, 50, 28, '#ffc061');
    // dibujito de la página (si tiene)
    const pic = STORY_PICS[k];
    const top = pic ? 200 : 100;
    if (pic) { ctx.save(); pic(ctx, VW / 2, 135, this.t); ctx.restore(); }
    UI.panel(ctx, VW / 2 - 330, top, 660, VH - top - 70);
    setFont(ctx, 18, 600); ctx.fillStyle = '#fff'; ctx.textAlign = 'left'; ctx.textBaseline = 'top';
    wrapText(ctx, text.slice(0, Math.floor(this.n)), 620).slice(0, Math.floor((VH - top - 90) / 26)).forEach((l, i) => ctx.fillText(l, VW / 2 - 310, top + 18 + i * 26));
    outlinedText(ctx, `${this.page + 1}/${pages.length}  ▶`, VW / 2 + 300, VH - 50, 15, '#ffc061', '#000', 'right');
    outlinedText(ctx, T('ui_tap'), VW / 2, VH - 26, 13, '#ccc');
    let adv = Input.pressed('jump') || Input.pressed('confirm');
    for (const tp of UI.taps) adv = true;
    if (adv) {
      if (this.n < text.length) this.n = text.length;
      else { this.page++; this.n = 0; if (this.page >= pages.length) this.then(); }
    }
  },
  backAction() { this.then(); return true; },
};

</script>
<script>/* js/main.js */
// Arranque, bucle principal, pantallas y progreso.
'use strict';

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let S = 1, screen = 'title', paused = false, lastT = 0, acc = 0;

function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const w = window.innerWidth, h = window.innerHeight;
  canvas.style.width = w + 'px'; canvas.style.height = h + 'px';
  canvas.width = Math.round(w * dpr); canvas.height = Math.round(h * dpr);
  VW = Math.max(640, Math.round(VH * (w / h)));
  S = canvas.height / VH;
}
window.addEventListener('resize', resize);

const SCREENS = { controls: ScreenControls, ending: ScreenEnding, title: ScreenTitle, map: ScreenMap, chars: ScreenChars, shop: ScreenShop, options: ScreenOptions, result: ScreenResult, story: ScreenStory, name: ScreenName };

function setScreen(name) {
  screen = name; paused = false; Input.showControls = false;
  if (name !== 'play' && name !== 'result') Sfx.music(name === 'map' ? 'map' : 'title');
  if (name === 'title') menuBg = null;
}

function startLevel(id) {
  const def = LEVELS[id];
  if (LEVEL_ORDER.includes(id)) { Save.data.node = id; Save.write(); }
  // historia antes del nivel (solo la primera vez)
  if (def.storyBefore && !Save.data.seen['sb_' + id]) { Save.see('sb_' + id); return playStory(def.storyBefore, () => startLevel(id)); }
  const lv = new Level(def);
  lv.onFinish = (r) => finishLevel(lv, r);
  lv.onRestart = () => startLevel(id);
  screen = 'play'; paused = false;
  Input.showControls = true;
}

function finishLevel(lv, r) {
  const d = Save.data, id = r.id, def = LEVELS[id];
  const first = !d.done[id];
  const unlocks = [];
  d.done[id] = true;
  if (!d.best[id] || r.time < d.best[id]) d.best[id] = r.time;
  d.coins[id] = Math.max(d.coins[id] || 0, r.coins);
  r.reward = r.coins + (first ? 25 : 5);
  d.wallet += r.reward;
  const idx = LEVEL_ORDER.indexOf(id);
  const nxt = LEVEL_ORDER[idx + 1];
  if (nxt && first && !def.noResult) unlocks.push(T('res_unlockLevel') + ' ' + nxt);
  if (nxt && first) d.node = nxt;
  if (def.unlockMsg && first) unlocks.push(T(def.unlockMsg));
  Save.write();
  if (def.final) return playStory(def.storyAfter || [], () => playEnding());
  if (def.noResult) {
    if (def.storyAfter && first) return playStory(def.storyAfter, () => startLevel(def.next || nxt));
    return startLevel(def.next || nxt);
  }
  const showResult = () => { ScreenResult.r = r; ScreenResult.unlocks = unlocks; screen = 'result'; Input.showControls = false; Sfx.music('title'); };
  const after = typeof def.storyAfter === 'function' ? def.storyAfter() : def.storyAfter;
  if (after && (first || def.alwaysStory)) return playStory(after, showResult);
  showResult();
}

// Muestra una historia de texto (STORY) y luego sigue
function playStory(key, then) {
  Input.showControls = false;
  if (Array.isArray(key)) { if (!key.length) return then(); const [k, ...rest] = key; return playStory(k, rest.length ? () => playStory(rest, then) : then); }
  ScreenStory.key = key; ScreenStory.page = 0; ScreenStory.n = 0; ScreenStory.t = 0; ScreenStory.then = then;
  screen = 'story'; Sfx.music(STORY_MUSIC[key] || 'title');
}

function frame(now) {
  requestAnimationFrame(frame);
  Input.pollPads();
  const dtReal = Math.min(0.1, (now - lastT) / 1000 || 0.016);
  lastT = now;
  ctx.setTransform(S, 0, 0, S, 0, 0);
  ctx.imageSmoothingEnabled = true;
  UI.taps = Input.consumeTaps().slice();
  Input.taps = UI.taps; // los NPC leen los toques
  UI.t += dtReal;
  if (screen === 'play' && G) {
    if (!paused) {
      if (Input.pressed('pause')) { paused = true; Sfx.suspend(); }
      acc += dtReal;
      let steps = 0;
      while (acc >= 1 / 60 && steps < 5) { G.update(1 / 60); acc -= 1 / 60; steps++; if (steps === 1) { Input.just = {}; Input.taps = []; } }
      if (acc > 0.1) acc = 0;
      if (steps === 0) { Input.taps = []; return; } // conserva lo presionado para el siguiente cuadro
    }
    ctx.setTransform(S, 0, 0, S, 0, 0);
    G.draw(ctx, S);
    G.drawHUD(ctx);
    G.drawBite(ctx);
    Input.avail.action = !!G.player.pico;
    if (!paused && !G.dialog && !G.choice && !G.cut && G.state === 'play') Input.drawControls(ctx);
    if (paused) { Input.taps = []; ScreenPause.draw(ctx); }
  } else {
    const sc = SCREENS[screen];
    sc.draw(ctx, dtReal, S);
  }
  // aviso de girar el teléfono
  if (window.innerHeight > window.innerWidth * 1.05 && screen !== 'name' && Input.lastDevice === 'touch') {
    ctx.setTransform(S, 0, 0, S, 0, 0);
    ctx.fillStyle = 'rgba(0,0,0,0.85)'; ctx.fillRect(0, 0, VW, VH);
    outlinedText(ctx, '⟳', VW / 2, VH / 2 - 40, 60, '#ffe14d');
    outlinedText(ctx, T('ui_rotate'), VW / 2, VH / 2 + 30, 24, '#fff');
  }
  Input.endFrame();
}

// Integración con Android
window.onBackButton = function () {
  if (screen === 'play') { if (paused) { paused = false; Sfx.resume(); } else { paused = true; Sfx.suspend(); } return true; }
  const sc = SCREENS[screen];
  return sc && sc.backAction ? sc.backAction() : false;
};
window.onAppPause = function () { if (screen === 'play') paused = true; Sfx.suspend(); };
window.onAppResume = function () { if (screen !== 'play' || !paused) Sfx.resume(); };
document.addEventListener('visibilitychange', () => { if (document.hidden) window.onAppPause(); else window.onAppResume(); });

function boot() {
  for (const id in LEVELS) LEVELS[id].id = id;
  Save.load();
  setLang(Save.data.lang || detectLang());
  Sfx.setOptions(Save.data.sound, Save.data.music);
  resize();
  Input.init(canvas);
  Sfx.music('title');
  // modo prueba: index.html?level=5
  const q = new URLSearchParams(location.search);
  if (q.get('level')) startLevel(q.get('level'));
  requestAnimationFrame(frame);
}
boot();

</script>
