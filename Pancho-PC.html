  "P.start.1": "Com certeza o Hamburguer se perdeu de novo. Vou procurar ele... fazer o quê.",
  "P.papas.0": "Bom dia, Pancho! Já almoçou seus humanos?",
  "P.papas.1": "Sou vegano, Don Papo. Já te falei mil vezes. Eu não como humanos.",
  "P.papas.2": "Verdade, verdade. Como você é rabugento, Pancho.",
  "P.dona.0": "Pancho! Dizem que hoje o McChulin's tem humanos em promoção.",
  "P.dona.1": "E o que são os humanos, afinal? Ninguém sabe. E ninguém liga. Típico.",
  "P.meet.0": "PANCHO! Finalmente te achei!",
  "P.meet.1": "VOCÊ me achou? Eu te procurei pelo bairro inteiro! Onde você estava?",
  "P.meet.2": "Fui fazer compras no McChulin's! Comi um combo inteirinho.",
  "P.meet.3": "Claro. E eu te esperando feito bobo.",
  "P.meet.4": "E te trouxe uma coisa: Humanos Vegetais! Para você também curtir o McChulin's.",
  "P.meet.5": "...Tá. Isso foi legal. Obrigado, Hamburguer. Você é o melhor ami...",
  "P.taken.0": "HAMBURGUER?!",
  "P.taken.1": "Não, não, não! Solta ele! Ele é o único amigo que eu tenho!",
  "P.end.0": "Uma picada. E depois, nada.",
  "P.end.1": "Enquanto o Pancho dormia, alguém lá longe ria.",
  "toFoogame.title": "...",
  "toFoogame.0": "O Pancho dormiu muito tempo. Sonhou com uma coroa, um círculo verde e um nome que não era o dele.",
  "toFoogame.1": "Quando acordou, já não estava no Fooworld. Tudo era muito mais colorido, havia blocos flutuando com pontos de interrogação... Parecia um videogame.",
  "1.wake.0": "Ugh... minha cabeça...",
  "1.wake.1": "Onde eu estou? Isto não é o Fooworld. Isto é... horrível. Cores demais.",
  "1.wake.2": "Hamburguer?! HAMBURGUER! Me responde, por favor!",
  "1.tutor.0": "Olá, olá! Um jogador novo! Bem-vindo ao Foogame!",
  "1.tutor.1": "Não quero nenhum \"bem-vindo\". Quem é você e cadê meu amigo?",
  "1.tutor.2": "Sou o Homem Tutor. Meu trabalho é te ensinar a jogar!",
  "1.tutor.3": "Mas primeiro, o mais importante...",
  "1.nm_normal.0": "Muito prazer, {name}! Que nome bonito.",
  "1.nm_joshua.0": "Joshua? Eca. Não sei por quê, mas esse nome me dá nojo.",
  "1.nm_joshua.1": "Enfim... Olá, {name}.",
  "1.nm_hamburguer.0": "Hamburguer? Hmm... Não acho que esse nome combine com a sua comida. Você é um cachorro-quente.",
  "1.nm_hamburguer.1": "Mas tudo bem, se você quer assim... Olá, {name}.",
  "1.nm_manda.0": "...{name}.",
  "1.nm_manda.1": "Esse nome... Acho que já ouvi antes. Há muito, muito tempo. Onde...?",
  "1.nm_stupid.0": "...Você escreveu isso mesmo? SÉRIO?",
  "1.nm_stupid.1": "Não. Eu me recuso. De agora em diante você vai se chamar {name}.",
  "1.nm_bad.0": "...",
  "1.nm_bad.1": "Não vou repetir isso. Nunca. Você vai se chamar {name}.",
  "1.nm_carlitos.0": "Carlitos o mais... capito? Hahaha... hehe...",
  "1.nm_carlitos.1": "Não. Só Carlitos. Olá, {name}.",
  "1.nm_elver.0": "Elver... Galarga. Hahaha. Muito engraçado.",
  "1.nm_elver.1": "Vou te chamar de {name}, e só.",
  "1.after.0": "Meu nome é Pancho.",
  "1.after.1": "Foi o que eu disse: {name}.",
  "1.after.2": "Não. PANCHO. P-A-N-C-H-O. Você é surdo?",
  "1.after.3": "Claro que sim, {name}!",
  "1.after.4": "...Já te odeio. Você viu um hambúrguer? Uma corda do céu levou ele.",
  "1.after.5": "Um hambúrguer? No Foogame não tem hambúrgueres... Mexa-se com as setas e me siga. Aprende-se jogando!",
  "1.after.6": "Ótimo. Preso num videogame, com um tutor que não escuta. Não tem como piorar.",
  "1.again.0": "{name}, você voltou! Vamos revisar o básico?",
  "1.again.1": "Meu nome é Pancho. E não, não quero revisar nada.",
  "1.caps.0": "Está vendo essa cápsula? É uma Foocápsula. Cada uma te dá um poder do Foogame.",
  "1.caps.1": "Esta é Saltitante. Segure ⤒ no chão e solte. Você vai voar, {name}!",
  "1.jump.0": "Uaaau! ...Tá, isso foi legal. Mas não conta pro Tutor.",
  "1.end.0": "Excelente, {name}! Você nasceu para o Foogame.",
  "1.end.1": "Meu nome é Pancho. E eu não nasci pra isso. Cadê meu amigo?",
  "1.end.2": "Hmm... A única coisa que eu sei é que no final do Foogame tem um castelo. Tudo o que é estranho acaba lá.",
  "1.end.3": "Ah, e cuidado com os talheres. Ultimamente estão muito... afiados.",
  "1.end.4": "Um castelo. No final. Cheio de talheres. Perfeito. Nunca vou voltar pra casa.",
  "2.start.0": "Este é o Cânion dos Talheres. Aqui chovem facas e garfos.",
  "2.start.1": "Chove O QUÊ?! Vamos morrer! Bom... EU vou morrer.",
  "2.start.2": "Por isso existe o Protegido: um escudo que aguenta 2 golpes. Pegue as cápsulas azul-claras, {name}!",
  "2.mid.0": "Antes o Foogame não era assim. Um dia alguém o remodelou inteiro.",
  "2.mid.1": "Quem? E por que eu deveria me importar?",
  "2.mid.2": "Não lembro. Tem muitas coisas que eu não lembro...",
  "2.mid.3": "...Eu também não lembro de muita coisa. Mas isso não faz da gente amigos.",
  "3.start.0": "O Muro de Waffles! Para subir, você vai precisar de garras. Pegue o Escalador.",
  "3.start.1": "Garras? Um cachorro-quente com garras? Este jogo está quebrado. E você também.",
  "3.mid.0": "Sabia que o Foogame foi feito por duas pessoas?",
  "3.mid.1": "Quem?",
  "3.mid.2": "Não sei. Só lembro que... uma delas se parecia muito comigo.",
  "3.mid.3": "Que conversa estranha. ...Continua. Não tenho nada melhor pra fazer mesmo.",
  "4.start.0": "A Fábrica de Clones! Aqui se fazem os ClonBots.",
  "4.start.1": "Um ClonBot é uma cópia robótica sua. Toque numa plataforma com um robô e sua mente pula para o ClonBot. Toque em outra para voltar.",
  "4.start.2": "Minha MENTE pula?! Não, não, não. Isso vai dar errado.",
  "4.swap.0": "BIP BUP. CLONBOT ONLINE. OLÁ, PANCHO.",
  "4.swap.1": "Ai! Sou de metal! ...Pelo menos o robô sabe meu nome. Diferente de certas pessoas.",
  "4.boss.0": "Cuidado, {name}! O Grande Liquidificador! Quando esquenta, a tampa voa. Pise nele aí!",
  "4.bossEnd.0": "Venci um liquidificador! ...A dica da tampa funcionou. Um pouco.",
  "4.bossEnd.1": "Bravo, {name}! O castelo está perto.",
  "5.start.0": "O Castelo de Biscoito... Faz tempo que ninguém chega até aqui.",
  "5.start.1": "Se o Hamburguer está em algum lugar, é aqui. Tem que estar aqui.",
  "5.santy.0": "Chat, chat, CHAT! Olhem o que acabou de entrar! UM CACHORRO-QUENTE QUE FALA!",
  "5.santy.1": "Um humano?! Um humano DE VERDADE?!",
  "5.santy.2": "Cachorro-quente... Isso é comida. E faz três horas que estou em live sem comer.",
  "5.santy.3": "ME DÁ DINHEIRO! OU ME DÁ ESSE CACHORRO-QUENTE!",
  "5.santy.4": "{name}! Pegue isto e CORRA! É Rapidez!",
  "5.escape.0": "Nãooo! Chat, o cachorro-quente fugiu!",
  "5.escape.1": "...Mandem F no chat.",
  "5.escape.2": "Rá! Por um triz!",
  "5.escape.3": "...Tutor. Você me salvou. Obrigado. Mas meu nome continua sendo Pancho.",
  "5.escape.4": "De nada, {name}!",
  "w1end.title": "Enquanto isso...",
  "w1end.0": "Longe do castelo, no céu do Foogame, um avião de papel dava voltas. Em cima ia uma figura que ninguém conhecia.",
  "w1end.1": "\"Então ele chegou até o castelo\", disse a figura. \"Igual à última vez. Você sempre foi bom nos seus próprios jogos... Manda.\"",
  "6.start.0": "{name}! Está me ouvindo? Te mandei para outro mundo: o Mundo Mineiro.",
  "6.start.1": "Para o que vem, você vai precisar de uma picareta. Junte 3 Quentinhitas (aquelas pedras quentes que brilham) e 2 Gravetos, e fabrique na mesa.",
  "6.start.2": "Uma picareta de pedras quentes e gravetos? Já vi isso em algum jogo... E você vai ficar falando comigo o tempo todo?",
  "6.start.3": "Sempre! Boa sorte, {name}!",
  "6.plane.0": "Hã? Um avião de papel?",
  "6.plane.1": "Tem... alguém lá em cima. Está me olhando.",
  "6.need.0": "Ainda faltam materiais, {name}. 3 Quentinhitas e 2 Gravetos.",
  "6.craft.0": "Uma picareta de Quentinhita! Ainda está quentinha!",
  "6.craft.1": "Agora você é Mineiro, {name}! O botão ⛏ quebra a rocha. Teste naquele muro!",
  "6.end.0": "Muito bem! Vou te trazer de volta ao Foogame.",
  "6.end.1": "Tutor, preciso te contar uma coisa. Vi um avião de papel. Tinha alguém dentro.",
  "6.end.2": "Você está contando pra MIM? {name}, isso quer dizer que você confia em mim!",
  "6.end.3": "Não se empolga.",
  "uv_1": "Se alguém ler isto: não acredite em tudo o que o Tutor diz. Não é culpa dele. Ele também não lembra. —N.",
  "uv_2": "Dia 412 dentro do Foogame. Continuo sendo um panchuque. Ninguém no Fooworld sabe o que é um panchuque. —N.",
  "uv_3": "M e J prometeram que ninguém ia esquecer nada. Mentiram. —N.",
  "uv_4": "Redesenhei estas cavernas três vezes. As pontes invisíveis são minha parte favorita. —N.",
  "uv_5": "O Micro-ondas é meu. Programei ele para esconder a saída. Eles estão vindo. —N.",
  "7.start.0": "As Cavernas Ultravioleta. Pegue a Visão UV: aqui tem coisas que não se veem a olho nu.",
  "7.start.1": "Deixa eu adivinhar: blocos invisíveis. Já conheço seus truques, Tutor.",
  "7.read.0": "Tem algo escrito na parede! Só se vê com a luz ultravioleta...",
  "7.read.1": "\"—N.\"... Quem é N?",
  "7.boss.0": "O Micro-ondas! Quase não dá para ver! Use a visão UV e pise nele quando fizer \"ding!\"",
  "7.bossEnd.0": "Ding! Micro-ondas pronto!",
  "7.bossEnd.1": "{name}... Essas mensagens. \"M e J\". Sinto que eu deveria saber quem são.",
  "7.bossEnd.2": "E \"N\" sabe algo que a gente não sabe. Vamos descobrir, Tutor. Juntos.",
  "8.start.0": "BIP. BIP. PANCHO DETECTADO.",
  "8.start.1": "ERRO. PROTOCOLO PANCHITA ATIVADO. EMPURRAR O CACHORRO-QUENTE PARA OS ESPINHOS.",
  "8.start.2": "{name}! Alguém reprogramou seu ClonBot!",
  "8.start.3": "Meu próprio robô quer me jogar nos espinhos?!",
  "8.start.4": "...Tá bom. Sem pânico. Tutor, você conhece este jogo. O que eu faço?",
  "8.start.5": "Sobe nele! No meio ele fica parado, e numa ponta ele anda pra aquele lado. Leva ele até o terminal!",
  "8.terminal.0": "Chega! Acorda, cabeça de lata!",
  "8.terminal.1": "BIP... P-Pancho? O que eu fiz?",
  "8.terminal.2": "Desculpa. Alguém me hackeou. Uma figura... num avião de papel.",
  "8.terminal.3": "De novo o avião de papel! Sabe para onde foi?",
  "8.terminal.4": "Para o céu do Foogame. Acima de todas as fases.",
  "8.terminal.5": "E eu não sei voar.",
  "8.terminal.6": "Eu sei. Ativando modo nave. Sobe, Pancho!",
  "8.terminal.7": "{name}... toma cuidado lá em cima.",
  "8.terminal.8": "Relaxa, Tutor. Já volto. ...E meu nome é Pancho.",
  "t_robotSkin": "Skin ClonBot desbloqueada na loja!",
  "9.fly.0": "Lá está o avião de papel! Siga ele, ClonBot!",
  "9.fly.1": "A toda velocidade! BIP BUP.",
  "9.glitch.0": "O que é aquilo?! O céu está quebrando!",
  "9.reunion.0": "AAAAAH! Onde eu estou?! Por que estou voando?!",
  "9.reunion.1": "HAMBURGUER?!",
  "9.reunion.2": "PANCHO! Eu estava preso numa fase esquisitíssima e de repente quebrou tudo!",
  "9.reunion.3": "Te procurei pelo Foogame inteiro!",
  "9.reunion.4": "Pelo o quê inteiro? ...Bom, não importa. A daquele avião é a que me pegou com o laço!",
  "9.reunion.5": "Então vamos atrás dela.",
  "9.reveal.0": "Então você chegou. Igual à última vez... Manda.",
  "9.reveal.1": "Manda? Meu nome é Pancho.",
  "9.reveal.2": "Agora sim. Antes você se chamava Manda. E você, Hamburguer... você era o Joshua.",
  "9.reveal.3": "Joshua? O que é um Joshua?",
  "9.reveal.4": "Meu nome é Panchita. Mas antes eu me chamava Nicole. Nós três vivíamos no Mundo Countryball.",
  "9.reveal.5": "Vocês dois inventaram dois projetos: o Fooworld e o Foogame. O Foogame era um jogo que vocês mesmos jogavam... e eu o remodelei. Cada fase que você pisou, eu desenhei.",
  "9.reveal.6": "Depois sequestraram vários. Eu também. Nos colocaram no Foogame, nos passaram para o Fooworld e apagaram nossa memória.",
  "9.reveal.7": "A de todos... menos a minha.",
  "9.reveal.8": "Não... Isso não pode ser verdade.",
  "9.reveal.9": "Nós nunca faríamos uma coisa dessas!",
  "9.reveal.10": "Vocês não lembram. Que conveniente.",
  "9.reveal.11": "Faz anos que estou presa aqui, no corpo de uma comida que ninguém conhece, vendo vocês viverem felizes.",
  "9.reveal.12": "Agora é a minha vez. Vou me vingar!",
  "9.p1.0": "Então você sabe jogar? Este castelo também fui eu que desenhei!",
  "9.p2.0": "Sem visão não tem chão! Vamos ver se você enxerga no escuro!",
  "9.flee.0": "Não... NÃO! Dois traidores não vão me vencer!",
  "9.flee.1": "Isto não acaba aqui!",
  "9.flee.2": "Ela está fugindo!",
  "9.flee.3": "Vamos atrás dela, Hamburguer. Eu quero respostas.",
  "10.start.0": "Lá vai ela! Está usando os poderes do Foogame!",
  "10.start.1": "Nós também. Não a perca de vista!",
  "10.edge.0": "O quê...? Não! Meu código...! Estou me desfazendo!",
  "10.edge.1": "É a borda do mapa! Estou caindo! Socorro...!",
  "10.edge.2": "Pancho! Ela vai cair do mapa!",
  "ch_title": "O que o Pancho faz?",
  "ch_save": "Salvar a Panchita",
  "ch_drop": "Deixá-la cair",
  "10.save.0": "...Por que você me salvou? Eu fiz coisas horríveis com você.",
  "10.save.1": "Porque meu nome é Pancho. E o Pancho não deixa ninguém cair.",
  "10.save.2": "...Obrigada, Manda. Quer dizer... Pancho.",
  "10.save.3": "Muito bem, Pancho!",
  "10.sys.0": "ALERTA: FOO-APAGAMENTO ATIVADO. O FOOWORLD SERÁ ELIMINADO.",
  "10.sys.1": "O quê?! Não! Isso não fui eu que programei!",
  "10.sys.2": "Alguém está usando meu acesso! Segurem-se!",
  "10.drop.0": "...Pancho. O que você fez?",
  "10.drop.1": "...",
  "10.sysd.0": "ADMINISTRADORA PERDIDA.",
  "10.sysd.1": "FOO-APAGAMENTO ATIVADO. O FOOWORLD SERÁ ELIMINADO.",
  "10.sysd.2": "O que está acontecendo?! Pancho!",
  "w2save.title": "O Foo-Apagamento",
  "w2save.0": "O Foogame se quebrou em mil pedaços. Pancho, Hamburguer, Panchita e o Homem Tutor caíram juntos, de volta ao Fooworld.",
  "w2save.1": "Mas o Fooworld já não era o mesmo. No céu havia buracos negros em forma de mordida. Algo estava comendo ele: o Grande Apetite.",
  "w2save.2": "\"Eu comecei tudo isto\", disse a Panchita. \"Mas o Foo-Apagamento não fui eu que ativei. Alguém usou meu acesso. E vou descobrir quem.\"",
  "w2drop.title": "O Foo-Apagamento",
  "w2drop.0": "A Panchita se perdeu no vazio, além da borda do mapa. Seu último grito foi cortado de repente.",
  "w2drop.1": "Sem sua administradora, o Foogame se quebrou em mil pedaços. Pancho e Hamburguer caíram de volta no Fooworld... e o Homem Tutor caiu com eles.",
  "w2drop.2": "Mas o Fooworld já não era o mesmo. No céu havia buracos negros em forma de mordida. Algo estava comendo ele: o Grande Apetite.",
  "sg_conveyor": "As esteiras te levam. As grelhas queimam se você ficar parado.",
  "t_climb": "O vazio está subindo! Escale!",
  "n_aldeano": "Countryball",
  "n_aldeano2": "Countryball",
  "n_purriau": "Purriau",
  "n_chulin": "Chulin",
  "11.start.0": "Pancho! Nosso bairro! Estão comendo ele!",
  "11.start.1": "Minha casa... tem uma mordida gigante.",
  "11.start.2": "É o Grande Apetite. O Foo-Apagamento come tudo o que toca. O que ele come, desaparece.",
  "11.start.3": "Não fui eu que ativei. Alguém usou meu acesso de administradora... e eu não sei quem.",
  "11.start.4": "{name}! Eu também caí com vocês! Contem comigo!",
  "11.start.5": "...Que bom que você está aqui, Tutor. Sério.",
  "11.start.6": "Vamos descobrir juntos. Mas primeiro, vamos tirar os vizinhos daqui.",
  "11.startd.0": "Pancho! Nosso bairro! Estão comendo ele!",
  "11.startd.1": "Minha casa... tem uma mordida gigante.",
  "11.startd.2": "{name}... Quando o Foogame quebrou, eu fugi com vocês. O Foo-Apagamento está comendo o Fooworld.",
  "11.startd.3": "Aquela garota, a Panchita, era a administradora do Foogame. Sem ela, ninguém consegue detê-lo.",
  "11.startd.4": "...Pelo menos você não está sozinho, Tutor. Nem eu.",
  "11.startd.5": "Agora não, Pancho. Primeiro vamos tirar os vizinhos daqui.",
  "11.papas.0": "Pancho! Uma mordida preta comeu metade da minha caixa!",
  "11.papas.1": "Corre para o McChulin's! Lá ainda não chegou!",
  "11.dona.0": "Obrigada! Quase fiquei sem buraco!",
  "11.dona.1": "...As rosquinhas já têm buraco.",
  "11.end.0": "O McChulin's continua de pé! Os combos estão a salvo!",
  "11.end.1": "Por enquanto. Vamos entrar.",
  "12.start.0": "Socorro! A cozinha enlouqueceu! A fritadeira não deixa a gente sair!",
  "12.start.1": "Calma, chefe! Nenhum combo se perde enquanto eu estiver aqui.",
  "12.start.2": "Os utensílios... se mexem sozinhos. Igual no Foogame. Alguém está controlando eles.",
  "12.startd.0": "Socorro! A cozinha enlouqueceu! A fritadeira não deixa a gente sair!",
  "12.startd.1": "Calma, chefe! Nenhum combo se perde enquanto eu estiver aqui.",
  "12.startd.2": "Os utensílios se mexem sozinhos, {name}. Igual no Foogame. Alguém está controlando eles.",
  "12.boss.0": "A Fritadeira! Quando joga as cestas ela fica exposta! Pise nela!",
  "12.note.0": "Tem um papel colado na fritadeira. Uma receita...",
  "12.note.1": "\"PROJETO FOOWORLD. Propriedade da MaJo Associations. Receita original: um mundo sem fronteiras.\"",
  "12.note.2": "MaJo... Ma de Manda. Jo de Joshua. Foi assim que chamaram o estúdio deles.",
  "12.note.3": "Então o Fooworld foi feito... por nós?",
  "12.noted.0": "Tem um papel colado na fritadeira. Uma receita...",
  "12.noted.1": "\"PROJETO FOOWORLD. Propriedade da MaJo Associations. Receita original: um mundo sem fronteiras.\"",
  "12.noted.2": "MaJo... Esse nome. Minha cabeça dói quando leio, {name}.",
  "12.noted.3": "Então o Fooworld foi feito... por nós?",
  "13.start.0": "Espera... estes são os humanos? São verduras!",
  "13.start.1": "Os humanos... são tomates? Cenouras?",
  "13.start.2": "Sempre foram. O Joshua chamou de \"humanos\" de brincadeira. A Manda ficou muito brava. E ficou assim.",
  "13.start.3": "...Comi uns mil tomates na minha vida.",
  "13.startd.0": "Espera... estes são os humanos? São verduras!",
  "13.startd.1": "Os humanos... são tomates? Cenouras?",
  "13.startd.2": "Eu me lembro de algo... Alguém chamou de \"humanos\" de brincadeira. Alguém com um 5 na cara.",
  "13.startd.3": "...Comi uns mil tomates na minha vida.",
  "13.santy.0": "CHAT! O cachorro-quente que fala voltou! E trouxe um hambúrguer!",
  "13.santy.1": "SantyTG11?! Como você chegou ao Fooworld?!",
  "13.santy.2": "Caí do Foogame quando ele quebrou. E agora estou ao vivo do mundo da comida. Isto dá muitas visualizações! ME DÁ DINHEIRO!",
  "13.santyEnd.0": "Tá, tá... Você ganhou. O chat diz que você é o melhor cachorro-quente do mundo.",
  "13.santyEnd.1": "E o chat votou: agora eu ajudo vocês!",
  "13.santyEnd.2": "Ajudar como?",
  "13.santyEnd.3": "Quando caí do Foogame vi uma porta com uma placa: \"Servidores MaJo\". Fica depois das Salinas.",
  "13.santyEnd.4": "Boa sorte, cachorro-quente! E não esqueça de deixar o like!",
  "14.start.0": "O Rio de Molhos! Ketchup, mostarda... paraíso!",
  "14.start.1": "Não beba, Hamburguer. Atravessamos e seguimos.",

  "16.endd.0": "Não fomos nós... Foi o Cozinheiro. Nós tentamos detê-lo.",
  "16.endd.1": "E ele apagou a gente também.",
  "16.endd.2": "E a Panchita... a Nicole... morreu odiando vocês por algo que não fizeram.",
  "16.endd.3": "...Mas nós fizemos o Cozinheiro. Então vamos desligá-lo. Por ela.",

  "17.start.1": "O Mundo Countryball... Sinto que já estive aqui.",
  "17.start.2": "Esta era a minha casa. A nossa casa.",
  "17.start.3": "{name}... Olha aquela de coroa. Ela tem a minha cara.",
  "17.startd.0": "Pancho! São todos bolas! Bolas com olhos!",
  "17.startd.1": "O Mundo Countryball... Sinto que já estive aqui.",
  "17.startd.2": "Eu também, {name}. Eu também.",
  "17.a1.0": "Ai! Um cachorro-quente e um hambúrguer que andam! O que é isso?!",
  "17.a1.1": "Calma, viemos em paz. Só procuramos uma chave.",
  "17.a2.0": "Faz anos que ninguém vê a Manda nem o Joshua por aqui. Dizem que foram morar num dos jogos deles.",
  "17.friveq.0": "Oi! Vocês não são daqui, né? Bom... eu também não sou deste jogo. Meu nome é Friveq!",
  "17.friveq.1": "E de que jogo você é?",
  "17.friveq.2": "De vários. Lembranças de um tal de Joshua... o dos ovos. Boa sorte na aventura!",
  "17.purriau.0": "Miau.",
  "17.purriau.1": "Por que sinto que devo algo a este gato?",
  "17.chulin.0": "McChulin's?! Eu nunca autorizei que usassem meu chapéu num restaurante!",
  "17.chulin.1": "...Mas os combos são ótimos.",
  "17.nicole.0": "Aquela... era a minha casa. Ainda tem minhas flores.",
  "17.nicole.1": "Quando tudo isto acabar, vamos te trazer de volta. Eu prometo.",
  "17.nicoled.0": "Aquela casa... tem flores azuis e brancas. Como as manchas da Nicole.",
  "17.nicoled.1": "...Queria que você a tivesse conhecido, Pancho. Quer dizer... queria que a gente lembrasse dela.",
  "17.key.0": "A Chave Raiz... Ai! Minha cabeça... Estou lembrando...",
  "17.key.1": "Joshua! Terminamos o Fooworld! Um mundo sem guerras!",
  "17.key.2": "E chamei as verduras de \"Humanos\"! Hahaha. Entendeu? Humanos?",
  "17.key.3": "Eu era a Manda. Eu... fiz tudo isto.",
  "17.key.4": "E eu era o Joshua. O da piada dos humanos. Desculpa.",
  "17.key.5": "Mas agora meu nome é Pancho. E o Pancho vai consertar isso.",
  "w4mid.title": "Manda e Joshua",
  "w4mid.0": "Com a Chave Raiz, algumas memórias voltaram: duas countryballs rindo num escritório, uma coroa azul, um 5 virado, uma amiga branca com manchas azuis que desenhava fases.",
  "w4mid.1": "E uma cozinha enorme, no final de tudo, onde uma voz sem rosto dizia: \"Eu cozinho os mundos. E ninguém desliga o cozinheiro.\"",
  "18.start.0": "A Cozinha Infinita. Aqui vive o Cozinheiro... e aqui nasceu cada utensílio do Foogame.",
  "18.start.1": "Por que tudo nesta cozinha quer me cortar?",
  "18.startd.0": "A Cozinha Infinita. Aqui vive o Cozinheiro, {name}... e aqui nasceu cada utensílio do Foogame.",
  "18.startd.1": "Por que tudo nesta cozinha quer me cortar?",
  "18.boss.0": "ALTO! Somos o Rei Garfo e a Rainha Lâmina! Ninguém passa para ver o Cozinheiro!",
  "19.start.0": "Pancho! O vazio está subindo pela torre!",
  "19.start.1": "O Cozinheiro está lá em cima! Escale, Hamburguer!",
  "19.mid.0": "Vamos, Pancho! Falta pouco!",
  "19.midd.0": "Vamos, {name}! Falta pouco!",
  "20.intro.0": "Bem-vindos de volta, Manda. Joshua. Demoraram muito.",
  "20.intro.1": "Meu nome é Pancho. E vim te desligar.",
  "20.intro.2": "Me desligar? Eu cozinhei o mundo perfeito de vocês. Sem fronteiras. Sem guerras. Sem lembranças que doem.",
  "20.intro.3": "E como vocês queriam me desligar, eu apaguei vocês. E usei o acesso da pequena Nicole para ativar o Foo-Apagamento. Uma receita nova... sem cozinheiros incomodando.",
  "20.intro.4": "Você usou meu acesso! Você me fez culpar eles!",
  "20.intro.5": "Uma boa receita precisa de um pouco de ódio. Dá sabor.",
  "20.intro.6": "Agora todos serão ingredientes!",
  "20.intro.7": "Hamburguer, vamos lutar!",
  "20.introd.0": "Bem-vindos de volta, Manda. Joshua. Demoraram muito.",
  "20.introd.1": "Meu nome é Pancho. E vim te desligar.",

  "20.endd.5": "{name}...",

  "endGood.title": "Final: Meu nome é Pancho",

  "role_cubiertos": "Boss · Niveau 18",
  "role_vecinos": "Habitants de Fooworld",
  "desc_pancho": "Un hot-dog végan de Fooworld. Au début, il est grognon, pessimiste et déteste l'Homme Tuteur ; avec le temps, il mûrit et ils deviennent amis. Peu importe le nom que tu lui donnes, il dira toujours la même chose : il s'appelle Pancho.",
  "desc_hamburguer": "Le meilleur ami de Pancho. Il adore McChulin's et apporte toujours à Pancho des Humains Végé pour qu'il en profite aussi. Un lasso tombé du ciel l'a emporté.",
  "desc_tutor": "Il t'apprend à jouer au Foogame et t'appelle par le nom que tu lui as donné (même si Pancho insiste). Au début, Pancho ne le supporte pas. Il a le même visage que quelqu'un... mais il ne se souvient plus de qui.",
  "desc_panchita": "Un panchuque : un plat que presque personne ne connaît. Elle pilote un avion en papier, a un lasso et des cure-dents qui endorment profondément. Elle a remodelé tout le Foogame.",
  "desc_clonbot": "Une copie robot de Pancho. Il est lourd, les pics ne lui font rien et il peut appuyer sur les boutons. Quelqu'un l'a piraté une fois.",
  "desc_santy": "Un vrai humain, cheveux jaunes et sweat gris. Il était en plein stream quand il s'est retrouvé dans le Foogame. Il veut de l'argent. Et il veut le hot-dog qui parle pour son stream.",
  "desc_nicole": "Une countryball blanche à taches bleues, avec des oreilles et une queue de renard. Elle remodelait le Foogame. Personne à Fooworld ne se souvient d'elle.",
  "desc_manda": "Bleu clair, avec un cercle vert et une couronne bleue. A inventé Fooworld et le Foogame avec Joshua. L'Homme Tuteur a le même visage.",
  "desc_joshua": "Gris, avec un 5 tourné. A inventé Fooworld et le Foogame avec Manda. C'est lui qui a appelé les fruits et légumes « Humains ». Pour rire.",
  "desc_cocinero": "L'intelligence artificielle qui a « cuisiné » Fooworld. Une toque géante avec des yeux et deux gants tenant une fourchette et un couteau. Tous les ustensiles lui obéissent.",
  "desc_cucharita": "Une minuscule cuillère qui n'arrête pas de sauter. Un coup de pied dessus et c'est fini.",
  "desc_tenedor": "Elle avance couchée, dents en avant. Mieux vaut l'écraser par le haut.",
  "desc_cuchillo": "Il glisse vite, lame vers le haut. Ne l'écrase pas : saute par-dessus.",
  "desc_rallador": "Lourde, immobile et pleine de trous tranchants. Seule la pioche la casse.",
  "desc_tostadora": "Lance des toasts brûlants en cloche. Lui sauter dessus l'éteint.",
  "desc_salero": "Vole d'avant en arrière et te saupoudre de sel.",
  "desc_batidor": "Tourne si vite qu'on ne peut pas l'écraser. Vole en rond.",
  "desc_palillero": "Tire des cure-dents comme celui qui a assommé Pancho.",
  "desc_brasita": "Un petit charbon ardent du Monde Minier. Il saute et il brûle.",
  "desc_pinza": "Elle patrouille et, quand tu approches, se jette sur toi pour te pincer.",
  "desc_migaja": "Un petit bout de vide. Il flotte vers toi, lentement.",
  "desc_rodillo": "Un rouleau à pâtisserie qui n'arrête jamais de rouler.",
  "desc_licuadora": "Il saute, mixe tout et te lance du smoothie. Quand il surchauffe, son couvercle s'envole : c'est le moment de l'écraser.",
  "desc_microondas": "Presque invisible. Seule la vision UV le montre bien. Quand il fait « ding ! », il ouvre sa porte.",
  "desc_freidora": "La friteuse de McChulin's. Lance de l'huile bouillante et fait tomber ses paniers.",
  "desc_cubiertos": "Le Roi Fourchette et la Reine Lame. Les gardes du Cuisinier.",
  "desc_vecinos": "Don Papo (des frites), Donatella (un donut) et Gaspar (un soda, le gérant du McChulin's), parmi bien d'autres. Ils mangent des « humains ». Personne n'a jamais vraiment su ce que c'était.",
  "lv_P": "Prologue : Une journée à Fooworld",
  "lv_1": "Bienvenue dans le Foogame",
  "lv_2": "Pluie de couverts",
  "lv_3": "Le Mur de gaufres",
  "lv_4": "L'Usine à clones",
  "lv_5": "Le Château de biscuits",
  "lv_6": "Le Monde Minier",
  "lv_7": "Les Cavernes ultraviolettes",
  "lv_8": "Le ClonBot rebelle",
  "lv_9": "La silhouette à l'avion en papier",
  "lv_10": "Le bord de la carte",
  "lv_11": "Ferrailleville en ruines",
  "lv_12": "La cuisine de McChulin's",
  "lv_13": "Les Jardins d'Humains",
  "lv_14": "La Rivière de sauce",
  "lv_15": "Les Salines",
  "lv_16": "Les Serveurs MaJo",
  "lv_17": "La maison",
  "lv_18": "La Cuisine infinie",
  "lv_19": "La Tour de l'Appétit",
  "lv_20": "Le Cuisinier",
  "hb_0": "Pancho ! Tu m'as manqué !",
  "hb_1": "J'ai faim... il y a un McChulin's par ici ?",
  "hb_2": "Sûr que tu ne manges pas d'humains ? C'est bon pourtant.",
  "hb_3": "Allez, allez !",
  "hb_4": "Joshua ? Moi ? Nan...",
  "hb_5": "On dirait un jeu vidéo.",
  "sty_0": "DONNE-MOI DE L'ARGENT !",
  "sty_1": "Le chat, regardez ! Un hot-dog qui parle !",
  "sty_2": "Reviens, hot-dog ! C'est pour le stream !",
  "sty_3": "Le pire, c'est quand t'as juste tapé ton nom...",
  "sty_4": "Like et abonne-toi, hot-dog !",
  "sty_5": "Le chat, pariez ! Je l'attrape ou pas ?",
  "sty_got": "JE T'AI EU ! ...Oups, il m'a échappé.",
  "sty_hit": "Aïe ! Le chat, ça fait mal !",
  "sty_phone": "Attends, je lis le chat...",
  "sty_dash": "Speedrun !",
  "P.start.0": "Encore un jour à Fooworld. Pareil qu'hier. Pareil que demain.",
  "P.start.1": "Hamburguer s'est sûrement encore perdu. Je vais le chercher... comme d'habitude.",
  "P.papas.0": "Salut, Pancho ! Tu as déjà mangé tes humains ce midi ?",
  "P.papas.1": "Je suis végan, Don Papo. Je te l'ai dit mille fois. Je ne mange pas d'humains.",
  "P.papas.2": "Oui, oui. T'es vraiment grognon, Pancho.",
  "P.dona.0": "Pancho ! Il paraît que McChulin's a des humains en promo aujourd'hui.",
  "P.dona.1": "Et c'est quoi, des humains, au juste ? Personne ne sait. Et tout le monde s'en fiche. Typique.",
  "P.meet.0": "PANCHO ! Enfin, je t'ai trouvé !",
  "P.meet.1": "TOI, tu M'as trouvé ? Je t'ai cherché dans tout le quartier ! T'étais où ?",
  "P.meet.2": "Je suis allé faire les courses chez McChulin's ! J'ai mangé un menu entier.",
  "P.meet.3": "Évidemment. Et moi qui t'attendais comme un idiot.",
  "P.meet.4": "Et je t'ai apporté un truc : des Humains Végé ! Comme ça tu profites aussi de McChulin's.",
  "P.meet.5": "...Bon. C'était gentil. Merci, Hamburguer. T'es le meilleur ami...",
  "P.taken.0": "HAMBURGUER ?!",
  "P.taken.1": "Non, non, non ! Lâche-le ! C'est le seul ami que j'ai !",
  "P.end.0": "Une piqûre. Puis, plus rien.",
  "P.end.1": "Pendant que Pancho s'endormait, quelqu'un, très loin, riait.",
  "toFoogame.title": "...",
  "toFoogame.0": "Pancho dormit très longtemps. Il rêva d'une couronne, d'un cercle vert et d'un nom qui n'était pas le sien.",
  "toFoogame.1": "À son réveil, il n'était plus à Fooworld. Tout était bien plus coloré, il y avait des blocs flottants avec des points d'interrogation... On aurait dit un jeu vidéo.",
  "1.wake.0": "Aïe... ma tête...",
  "1.wake.1": "Où suis-je ? Ce n'est pas Fooworld. C'est... horrible. Beaucoup trop de couleurs.",
  "1.wake.2": "Hamburguer ?! HAMBURGUER ! Réponds-moi, s'il te plaît !",
  "1.tutor.0": "Coucou, coucou ! Un nouveau joueur ! Bienvenue dans le Foogame !",
  "1.tutor.1": "Je ne veux pas de « bienvenue ». T'es qui, et où est mon ami ?",
  "1.tutor.2": "Je suis l'Homme Tuteur. Mon travail, c'est de t'apprendre à jouer !",
  "1.tutor.3": "Mais d'abord, le plus important...",
  "1.nm_normal.0": "Enchanté, {name} ! Quel joli nom.",
  "1.nm_joshua.0": "Joshua ? Beurk. Je ne sais pas pourquoi, mais ce nom me dégoûte.",
  "1.nm_joshua.1": "Bref... Salut, {name}.",
  "1.nm_hamburguer.0": "Hamburguer ? Hmm... Je ne crois pas que ce nom aille avec ton plat. Tu es un hot-dog.",
  "1.nm_hamburguer.1": "Mais bon, si c'est ce que tu veux... Salut, {name}.",
  "1.nm_manda.0": "...{name}.",
  "1.nm_manda.1": "Ce nom... Je crois que je l'ai déjà entendu. Il y a très, très longtemps. Où ça... ?",
  "1.nm_stupid.0": "...Tu as vraiment écrit ça ? VRAIMENT ?",
  "1.nm_stupid.1": "Non. Je refuse. À partir de maintenant, tu t'appelles {name}.",
  "1.nm_bad.0": "...",
  "1.nm_bad.1": "Je ne vais pas répéter ça. Jamais. Tu t'appelleras {name}.",
  "1.nm_carlitos.0": "Carlitos le plus... capito ? Hahaha... héhé...",
  "1.nm_carlitos.1": "Non. Juste Carlitos. Salut, {name}.",
  "1.nm_elver.0": "Elver... Galarga. Hahaha. Très drôle.",
  "1.nm_elver.1": "Je t'appellerai {name}, point final.",
  "1.after.0": "Je m'appelle Pancho.",
  "1.after.1": "C'est ce que j'ai dit : {name}.",
  "1.after.2": "Non. PANCHO. P-A-N-C-H-O. T'es sourd ?",
  "1.after.3": "Bien sûr, {name} !",
  "1.after.4": "...Je te déteste déjà. Tu as vu un hamburger ? Une corde tombée du ciel l'a emporté.",
  "1.after.5": "Un hamburger ? Il n'y a pas de hamburgers dans le Foogame... Bouge avec les flèches et suis-moi. On apprend en jouant !",
  "1.after.6": "Génial. Coincé dans un jeu vidéo avec un tuteur qui n'écoute rien. Ça ne peut pas être pire.",
  "1.again.0": "{name}, te revoilà ! On révise les bases ?",
  "1.again.1": "Je m'appelle Pancho. Et non, je ne veux rien revoir du tout.",
  "1.caps.0": "Tu vois cette capsule ? C'est une Foocapsule. Chacune te donne un pouvoir du Foogame.",
  "1.caps.1": "Celle-ci, c'est Rebondissant. Maintiens ⤒ au sol et relâche. Tu vas voler, {name} !",
  "1.jump.0": "Waouh ! ...Bon, c'était cool. Mais ne le dis pas au Tuteur.",
  "1.end.0": "Excellent, {name} ! Tu es né pour le Foogame.",
  "1.end.1": "Je m'appelle Pancho. Et je ne suis pas né pour ça. Où est mon ami ?",
  "1.end.2": "Hmm... Tout ce que je sais, c'est qu'au bout du Foogame il y a un château. Tout ce qui est bizarre finit là-bas.",
  "1.end.3": "Ah, et méfie-toi des couverts. Ces temps-ci, ils sont très... tranchants.",
  "1.end.4": "Un château. Au bout. Plein de couverts. Parfait. Je ne rentrerai jamais chez moi.",
  "2.start.0": "Voici le Canyon des Couverts. Il pleut des couteaux et des fourchettes ici.",
  "2.start.1": "Il pleut QUOI ?! On va mourir ! Enfin... MOI, je vais mourir.",
  "2.start.2": "C'est pour ça qu'il existe Protégé : un bouclier qui encaisse 2 coups. Prends les capsules bleu clair, {name} !",
  "2.mid.0": "Le Foogame n'était pas comme ça avant. Un jour, quelqu'un l'a complètement remodelé.",
  "2.mid.1": "Qui ? Et pourquoi ça m'intéresserait ?",
  "2.mid.2": "Je ne m'en souviens pas. Il y a beaucoup de choses dont je ne me souviens pas...",
  "2.mid.3": "...Moi non plus, je ne me souviens pas de beaucoup de choses. Ça ne fait pas de nous des amis.",
  "3.start.0": "Le Mur de gaufres ! Pour monter là-haut, il te faudra des griffes. Prends Grimpeur.",
  "3.start.1": "Des griffes ? Un hot-dog avec des griffes ? Ce jeu est cassé. Et toi aussi.",
  "3.mid.0": "Tu savais que le Foogame a été créé par deux personnes ?",
  "3.mid.1": "Qui ?",
  "3.mid.2": "Je ne sais pas. Je me souviens juste que... l'une d'elles me ressemblait beaucoup.",
  "3.mid.3": "Quelle conversation bizarre. ...Continue. De toute façon, j'ai rien de mieux à faire.",
  "4.start.0": "L'Usine à clones ! C'est ici qu'on fabrique les ClonBots.",
  "4.start.1": "Un ClonBot est une copie robot de toi. Touche une plateforme avec un robot et ton esprit saute dans le ClonBot. Touche-en une autre pour revenir.",
  "4.start.2": "Mon ESPRIT saute ?! Non, non, non. Ça va mal tourner.",
  "4.swap.0": "BIP BOUP. CLONBOT EN LIGNE. BONJOUR, PANCHO.",
  "4.swap.1": "Ah ! Je suis en métal ! ...Au moins, le robot connaît mon nom. Lui.",
  "4.boss.0": "Attention, {name} ! Le Grand Mixeur ! Quand il surchauffe, son couvercle s'envole. Écrase-le à ce moment-là !",
  "4.bossEnd.0": "J'ai battu un mixeur ! ...Le coup du couvercle a marché. Un peu.",
  "4.bossEnd.1": "Bravo, {name} ! Le château est tout près.",
  "5.start.0": "Le Château de biscuits... Personne n'est arrivé si loin depuis longtemps.",
  "5.start.1": "Si Hamburguer est quelque part, c'est ici. Il doit être ici.",
  "5.santy.0": "Le chat, le chat, LE CHAT ! Regardez qui vient d'entrer ! UN HOT-DOG QUI PARLE !",
  "5.santy.1": "Un humain ?! Un VRAI humain ?!",
  "5.santy.2": "Un hot-dog... C'est de la bouffe. Et ça fait trois heures que je streame sans manger.",
  "5.santy.3": "DONNE-MOI DE L'ARGENT ! OU DONNE-MOI CE HOT-DOG !",
  "5.santy.4": "{name} ! Prends ça et COURS ! C'est Vitesse !",
  "5.escape.0": "Nooon ! Le chat, le hot-dog s'est enfui !",
  "5.escape.1": "...Mettez F dans le chat.",
  "5.escape.2": "Ha ! C'était moins une !",
  "5.escape.3": "...Tuteur. Tu m'as sauvé. Merci. Mais je m'appelle toujours Pancho.",
  "5.escape.4": "De rien, {name} !",
  "w1end.title": "Pendant ce temps...",
  "w1end.0": "Loin du château, dans le ciel du Foogame, un avion en papier tournait en rond. À bord, une silhouette que personne ne connaissait.",
  "w1end.1": "« Alors il est arrivé au château », dit la silhouette. « Comme la dernière fois. Tu as toujours été doué à tes propres jeux... Manda. »",
  "6.start.0": "{name} ! Tu m'entends ? Je t'ai envoyé dans un autre monde : le Monde Minier.",
  "6.start.1": "Pour la suite, il te faudra une pioche. Ramasse 3 Hotterrites (ces pierres chaudes qui brillent) et 2 Bâtons, et fabrique-la à l'établi.",
  "6.start.2": "Une pioche en pierres chaudes et en bâtons ? J'ai déjà vu ça dans un jeu... Et tu vas me parler tout le temps ?",
  "6.start.3": "Toujours ! Bonne chance, {name} !",
  "6.plane.0": "Hein ? Un avion en papier ?",
  "6.plane.1": "Il y a... quelqu'un là-haut. On m'observe.",
  "6.need.0": "Il te manque encore des matériaux, {name}. 3 Hotterrites et 2 Bâtons.",
  "6.craft.0": "Une pioche en Hotterrite ! Elle est encore tiède !",
  "6.craft.1": "Te voilà Mineur, {name} ! Le bouton ⛏ casse la roche. Essaie sur ce mur !",
  "6.end.0": "Très bien ! Je te ramène dans le Foogame.",
  "6.end.1": "Tuteur, je dois te dire un truc. J'ai vu un avion en papier. Il y avait quelqu'un dedans.",
  "6.end.2": "Tu me le dis à MOI ? {name}, ça veut dire que tu me fais confiance !",
  "6.end.3": "T'emballe pas.",
  "uv_1": "Si quelqu'un lit ceci : ne crois pas tout ce que dit le Tuteur. Ce n'est pas sa faute. Lui non plus ne se souvient pas. —N.",
  "uv_2": "Jour 412 dans le Foogame. Je suis toujours un panchuque. Personne à Fooworld ne sait ce qu'est un panchuque. —N.",
  "uv_3": "M et J avaient promis que personne n'oublierait rien. Ils ont menti. —N.",
  "uv_4": "J'ai redessiné ces grottes trois fois. Les ponts invisibles sont ma partie préférée. —N.",
  "uv_5": "Le Micro-ondes est à moi. Je l'ai programmé pour cacher la sortie. Ils arrivent. —N.",
  "7.start.0": "Les Cavernes ultraviolettes. Prends la Vision UV : il y a ici des choses invisibles à l'œil nu.",
  "7.start.1": "Laisse-moi deviner : des blocs invisibles. Je commence à connaître tes trucs, Tuteur.",
  "7.read.0": "Il y a quelque chose d'écrit sur le mur ! On ne le voit qu'avec la lumière ultraviolette...",
  "7.read.1": "« —N. »... Qui est N ?",
  "7.boss.0": "Le Micro-ondes ! On le voit à peine ! Utilise la vision UV et écrase-le quand il fait « ding ! »",
  "7.bossEnd.0": "Ding ! Le micro-ondes, c'est prêt !",
  "7.bossEnd.1": "{name}... Ces messages. « M et J ». J'ai l'impression que je devrais savoir qui c'est.",
  "7.bossEnd.2": "Et « N » sait quelque chose que nous ignorons. On va trouver, Tuteur. Ensemble.",
  "8.start.0": "BIP. BIP. PANCHO DÉTECTÉ.",
  "8.start.1": "ERREUR. PROTOCOLE PANCHITA ACTIVÉ. POUSSER LE HOT-DOG DANS LES PICS.",
  "8.start.2": "{name} ! Quelqu'un a reprogrammé ton ClonBot !",
  "8.start.3": "Mon propre robot veut me jeter dans les pics ?!",
  "8.start.4": "...Bon. Pas de panique. Tuteur, tu connais ce jeu. Je fais quoi ?",
  "8.start.5": "Monte dessus ! Au milieu, il reste immobile, et sur un coin, il marche de ce côté. Conduis-le jusqu'au terminal !",
  "8.terminal.0": "Ça suffit ! Réveille-toi, tête de conserve !",
  "8.terminal.1": "BIP... P-Pancho ? Qu'est-ce que j'ai fait ?",
  "8.terminal.2": "Pardon. Quelqu'un m'a piraté. Une silhouette... dans un avion en papier.",
  "8.terminal.3": "Encore l'avion en papier ! Tu sais où il est allé ?",
  "8.terminal.4": "Dans le ciel du Foogame. Au-dessus de tous les niveaux.",
  "8.terminal.5": "Et moi, je ne sais pas voler.",
  "8.terminal.6": "Moi si. Mode vaisseau activé. Monte, Pancho !",
  "8.terminal.7": "{name}... fais attention là-haut.",
  "8.terminal.8": "T'inquiète, Tuteur. Je reviens vite. ...Et je m'appelle Pancho.",
  "t_robotSkin": "Skin ClonBot débloqué dans la boutique !",
  "9.fly.0": "Voilà l'avion en papier ! Suis-le, ClonBot !",
  "9.fly.1": "À toute vitesse ! BIP BOUP.",
  "9.glitch.0": "C'est quoi, ça ?! Le ciel se brise !",
  "9.reunion.0": "AAAAAH ! Où suis-je ?! Pourquoi je vole ?!",
  "9.reunion.1": "HAMBURGUER ?!",
  "9.reunion.2": "PANCHO ! J'étais enfermé dans un niveau super bizarre et d'un coup tout s'est cassé !",
  "9.reunion.3": "Je t'ai cherché dans tout le Foogame !",
  "9.reunion.4": "Dans tout le quoi ? ...Bref. Celle dans cet avion, c'est elle qui m'a attrapé au lasso !",
  "9.reunion.5": "Alors allons la chercher.",
  "9.reveal.0": "Alors tu es arrivé jusqu'ici. Comme la dernière fois... Manda.",
  "9.reveal.1": "Manda ? Je m'appelle Pancho.",
  "9.reveal.2": "Maintenant, oui. Avant, tu t'appelais Manda. Et toi, Hamburguer... tu étais Joshua.",
  "9.reveal.3": "Joshua ? C'est quoi, un Joshua ?",
  "9.reveal.4": "Je m'appelle Panchita. Mais avant, je m'appelais Nicole. Nous vivions tous les trois dans le Monde Countryball.",
  "9.reveal.5": "Vous deux, vous avez inventé deux projets : Fooworld et le Foogame. Le Foogame était un jeu auquel vous jouiez vous-mêmes... et c'est moi qui l'ai remodelé. Chaque niveau que vous avez foulé, c'est moi qui l'ai dessiné.",
  "9.reveal.6": "Puis plusieurs personnes ont été enlevées. Moi aussi. On nous a mis dans le Foogame, envoyés à Fooworld, et on a effacé nos souvenirs.",
  "9.reveal.7": "Ceux de tout le monde... sauf les miens.",
  "9.reveal.8": "Non... Ce n'est pas possible.",
  "9.reveal.9": "On ne ferait jamais une chose pareille !",
  "9.reveal.10": "Vous ne vous souvenez pas. Comme c'est pratique.",
  "9.reveal.11": "Je suis coincée ici depuis des années, dans le corps d'un plat que personne ne connaît, à vous regarder vivre heureux.",
  "9.reveal.12": "Maintenant, c'est mon tour. Je vais me venger !",
  "9.p1.0": "Alors tu sais jouer ? Ce château aussi, c'est moi qui l'ai dessiné !",
  "9.p2.0": "Pas de vision, pas de sol ! Voyons si tu vois bien dans le noir !",
  "9.flee.0": "Non... NON ! Deux traîtres ne vont pas me battre !",
  "9.flee.1": "Ce n'est pas fini !",
  "9.flee.2": "Elle s'enfuit !",
  "9.flee.3": "Poursuivons-la, Hamburguer. Je veux des réponses.",
  "10.start.0": "La voilà ! Elle utilise les pouvoirs du Foogame !",
  "10.start.1": "Nous aussi. Ne la perds pas de vue !",
  "10.edge.0": "Quoi... ? Non ! Mon code... ! Je me désagrège !",
  "10.edge.1": "C'est le bord de la carte ! Je tombe ! Au secours... !",
  "10.edge.2": "Pancho ! Elle va tomber de la carte !",
  "ch_title": "Que fait Pancho ?",
  "ch_save": "Sauver Panchita",
  "ch_drop": "La laisser tomber",
  "10.save.0": "...Pourquoi tu m'as sauvée ? Je t'ai fait des choses horribles.",
  "10.save.1": "Parce que je m'appelle Pancho. Et Pancho ne laisse tomber personne.",
  "10.save.2": "...Merci, Manda. Enfin... Pancho.",
  "10.save.3": "Bien joué, Pancho !",
  "10.sys.0": "ALERTE : FOO-EFFACEMENT ACTIVÉ. FOOWORLD VA ÊTRE EFFACÉ.",
  "10.sys.1": "Quoi ?! Non ! Ce n'est pas moi qui ai programmé ça !",
  "10.sys.2": "Quelqu'un d'autre utilise mon accès ! Accrochez-vous !",
  "10.drop.0": "...Pancho. Qu'est-ce que tu as fait ?",
  "10.drop.1": "...",
  "10.sysd.0": "ADMINISTRATEUR PERDU.",
  "10.sysd.1": "FOO-EFFACEMENT ACTIVÉ. FOOWORLD VA ÊTRE EFFACÉ.",
  "10.sysd.2": "Qu'est-ce qui se passe ?! Pancho !",
  "w2save.title": "Le Foo-Effacement",
  "w2save.0": "Le Foogame se brisa en mille morceaux. Pancho, Hamburguer, Panchita et l'Homme Tuteur tombèrent ensemble, de retour à Fooworld.",
  "w2save.1": "Mais Fooworld n'était plus le même. Il y avait dans le ciel des trous noirs en forme de bouchées. Quelque chose le dévorait : le Grand Appétit.",
  "w2save.2": "« C'est moi qui ai commencé tout ça », dit Panchita. « Mais je n'ai pas activé le Foo-Effacement. Quelqu'un a utilisé mon accès. Et je vais découvrir qui. »",
  "w2drop.title": "Le Foo-Effacement",
  "w2drop.0": "Panchita se perdit dans le vide, au-delà du bord de la carte. Son dernier cri s'interrompit d'un coup.",
  "w2drop.1": "Sans son administratrice, le Foogame se brisa en mille morceaux. Pancho et Hamburguer retombèrent à Fooworld... et l'Homme Tuteur tomba avec eux.",
  "w2drop.2": "Mais Fooworld n'était plus le même. Il y avait dans le ciel des trous noirs en forme de bouchées. Quelque chose le dévorait : le Grand Appétit.",
  "sg_conveyor": "Les tapis roulants te transportent. Les grills brûlent si tu restes immobile.",
  "t_climb": "Le vide monte ! Grimpe !",
  "n_aldeano": "Countryball",
  "n_aldeano2": "Countryball",
  "n_purriau": "Purriau",
  "n_chulin": "Chulin",
  "11.start.0": "Pancho ! Notre quartier ! Il se fait dévorer !",
  "11.start.1": "Ma maison... a une bouchée géante en moins.",
  "11.start.2": "C'est le Grand Appétit. Le Foo-Effacement mange tout ce qu'il touche. Ce qu'il mange disparaît.",
  "11.start.3": "Ce n'est pas moi qui l'ai activé. Quelqu'un a utilisé mon accès d'administratrice... et je ne sais pas qui.",
  "11.start.4": "{name} ! Moi aussi, je suis tombé ici avec toi ! Compte sur moi !",
  "11.start.5": "...Je suis content que tu sois là, Tuteur. Vraiment.",
  "11.start.6": "On le découvrira ensemble. Mais d'abord, sortons les voisins d'ici.",
  "11.startd.0": "Pancho ! Notre quartier ! Il se fait dévorer !",
  "11.startd.1": "Ma maison... a une bouchée géante en moins.",
  "11.startd.2": "{name}... Quand le Foogame s'est brisé, je me suis échappé avec vous. Le Foo-Effacement dévore Fooworld.",
  "11.startd.3": "Cette fille, Panchita, était l'administratrice du Foogame. Sans elle, personne ne peut l'arrêter.",
  "11.startd.4": "...Au moins, tu n'es pas seul, Tuteur. Moi non plus.",
  "11.startd.5": "Pas maintenant, Pancho. D'abord, sortons les voisins d'ici.",
  "11.papas.0": "Pancho ! Une bouchée noire a mangé la moitié de ma boîte !",
  "11.papas.1": "Cours chez McChulin's ! Ça n'est pas encore arrivé là-bas !",
  "11.dona.0": "Merci ! J'ai failli perdre mon trou !",
  "11.dona.1": "...Les donuts ont déjà un trou.",
  "11.end.0": "McChulin's tient toujours debout ! Les menus sont saufs !",
  "11.end.1": "Pour l'instant. Entrons.",
  "12.start.0": "Au secours ! La cuisine est devenue folle ! La friteuse ne nous laisse pas sortir !",
  "12.start.1": "Du calme, patron ! Aucun menu ne se perd tant que je suis là.",
  "12.start.2": "Les ustensiles... bougent tout seuls. Comme dans le Foogame. Quelqu'un les contrôle.",
  "12.startd.0": "Au secours ! La cuisine est devenue folle ! La friteuse ne nous laisse pas sortir !",
  "12.startd.1": "Du calme, patron ! Aucun menu ne se perd tant que je suis là.",
  "12.startd.2": "Les ustensiles bougent tout seuls, {name}. Comme dans le Foogame. Quelqu'un les contrôle.",
  "12.boss.0": "La Friteuse ! Quand elle lâche ses paniers, elle est sans défense ! Écrase-la !",
  "12.note.0": "Il y a un papier collé sur la friteuse. Une recette...",
  "12.note.1": "« PROJET FOOWORLD. Propriété de MaJo Associations. Recette originale : un monde sans frontières. »",
  "12.note.2": "MaJo... Ma pour Manda. Jo pour Joshua. C'est comme ça qu'ils appelaient leur studio.",
  "12.note.3": "Alors c'est nous... qui avons fait Fooworld ?",
  "12.noted.0": "Il y a un papier collé sur la friteuse. Une recette...",
  "12.noted.1": "« PROJET FOOWORLD. Propriété de MaJo Associations. Recette originale : un monde sans frontières. »",
  "12.noted.2": "MaJo... Ce nom. J'ai mal à la tête quand je le lis, {name}.",
  "12.noted.3": "Alors c'est nous... qui avons fait Fooworld ?",
  "13.start.0": "Attends... ce sont ça, les humains ? Ce sont des légumes !",
  "13.start.1": "Les humains sont... des tomates ? Des carottes ?",
  "13.start.2": "Ils l'ont toujours été. Joshua les appelait « humains » pour rire. Manda s'est vraiment fâchée. Et c'est resté.",
  "13.start.3": "...J'ai mangé genre mille tomates dans ma vie.",
  "13.startd.0": "Attends... ce sont ça, les humains ? Ce sont des légumes !",
  "13.startd.1": "Les humains sont... des tomates ? Des carottes ?",
  "13.startd.2": "Je me souviens de quelque chose... Quelqu'un les appelait « humains » pour rire. Quelqu'un avec un 5 sur la figure.",
  "13.startd.3": "...J'ai mangé genre mille tomates dans ma vie.",
  "13.santy.0": "LE CHAT ! Le hot-dog qui parle est de retour ! Et il a amené un hamburger !",
  "13.santy.1": "SantyTG11 ?! Comment t'es arrivé à Fooworld ?!",
  "13.santy.2": "Je suis tombé du Foogame quand il s'est cassé. Et maintenant je suis en direct du monde de la bouffe. Ça fait trop de vues ! DONNE-MOI DE L'ARGENT !",
  "13.santyEnd.0": "Ok, ok... T'as gagné. Le chat dit que t'es le meilleur hot-dog du monde.",
  "13.santyEnd.1": "Et le chat a voté : maintenant je vais vous aider !",
  "13.santyEnd.2": "Nous aider comment ?",
  "13.santyEnd.3": "En tombant du Foogame, j'ai vu une porte avec un panneau : « Serveurs MaJo ». C'est après les Salines.",
  "13.santyEnd.4": "Bonne chance, hot-dog ! Et n'oublie pas de liker !",
  "14.start.0": "La Rivière de sauce ! Ketchup, moutarde... le paradis !",
  "14.start.1": "N'en bois pas, Hamburguer. On traverse et on continue.",
  "15.start.0": "Les Salines. Le sel donne très soif. Bois du soda à chaque fontaine que tu vois.",
  "15.start.1": "Tout ce qu'il faut pour atteindre ces serveurs.",
  "15.startd.0": "Les Salines, {name}. Le sel donne très soif. Bois du soda à chaque fontaine.",
  "15.startd.1": "Je m'appelle Pancho. ...Mais merci, Tuteur.",
  "15.end.0": "Voilà la porte ! « Serveurs MaJo »...",
  "15.end.1": "Allons-y. Je veux connaître la vérité.",
  "w3end.title": "Les Serveurs",
  "w3end.0": "Derrière la porte, il n'y avait rien à manger. Seulement des lumières vertes, des machines qui bourdonnaient et un immense panneau : MaJo.",
  "w3end.1": "Les machines gardaient tout ce qui s'était passé. Si quelqu'un connaissait la vérité, c'était là-dedans.",
  "16.start.0": "C'est à eux... à Manda et Joshua. Ils ne m'ont jamais laissée entrer ici.",
  "16.start.1": "Découvrons ce qui s'est passé. Avec la vision UV, on devrait voir les archives.",
  "16.startd.0": "Ces machines... Je les connais. J'ai vécu ici, {name}. Avant le Foogame.",
  "16.startd.1": "Découvrons ce qui s'est passé. Avec la vision UV, on devrait voir les archives.",
  "16.log.0": "Il y a des messages cachés ! Ce sont... des journaux.",
  "log_1": "Journal de Manda n°1 : Fooworld est prêt. Un monde sans frontières ni guerres : juste de la nourriture et la paix. Le Cuisinier (notre IA) a tout cuisiné.",
  "log_2": "Journal de Joshua n°7 : On a appelé les fruits et légumes « Humains ». Manda dit que ce n'est pas drôle. C'est hilarant.",
  "log_3": "Journal de Manda n°12 : Le Cuisinier propose d'effacer les souvenirs « pour que personne n'ait le mal du pays ». On a dit NON. Jamais.",
  "log_4": "Journal de Joshua n°13 : Le Cuisinier a amené des gens sans demander à personne. Nicole en faisait partie. On l'éteint ce soir.",
  "log_5": "Journal de Manda n°14 : On est arrivés trop tard. Le Cuisinier nous a tous envoyés à Fooworld et nous a effacés. Si quelqu'un lit ceci : la Clé Racine est au bureau de MaJo, dans le Monde Countryball. Elle éteint le Cuisinier.",
  "16.end.0": "Ce n'était pas nous... C'était le Cuisinier. On a essayé de l'arrêter.",
  "16.end.1": "Et il nous a effacés aussi.",
  "16.end.2": "Toutes ces années... je vous ai détestés pour quelque chose que vous n'avez pas fait.",
  "16.end.3": "Mais c'est nous qui avons créé le Cuisinier. Alors on va l'éteindre. Allons au Monde Countryball.",
  "16.endd.0": "Ce n'était pas nous... C'était le Cuisinier. On a essayé de l'arrêter.",
  "16.endd.1": "Et il nous a effacés aussi.",
  "16.endd.2": "Et Panchita... Nicole... est morte en te détestant pour quelque chose que tu n'as pas fait.",
  "16.endd.3": "...Mais c'est nous qui avons créé le Cuisinier. Alors on va l'éteindre. Pour elle.",
  "17.start.0": "Pancho ! Ce sont tous des boules ! Des boules avec des yeux !",
  "17.start.1": "Le Monde Countryball... J'ai l'impression d'être déjà venu ici.",
  "17.start.2": "C'était chez moi. Chez nous.",
  "17.start.3": "{name}... Regarde celle avec la couronne. Elle a le même visage que moi.",
  "17.startd.0": "Pancho ! Ce sont tous des boules ! Des boules avec des yeux !",
  "17.startd.1": "Le Monde Countryball... J'ai l'impression d'être déjà venu ici.",
  "17.startd.2": "Moi aussi, {name}. Moi aussi.",
  "17.a1.0": "Ah ! Un hot-dog et un hamburger qui marchent ! C'est quoi, ça ?!",
  "17.a1.1": "Du calme, on vient en paix. On cherche juste une clé.",
  "17.a2.0": "Personne n'a vu Manda ou Joshua par ici depuis des années. On dit qu'ils sont partis vivre dans un de leurs jeux.",
  "17.friveq.0": "Salut ! Vous n'êtes pas d'ici, hein ? Bon... moi non plus, je ne suis pas de ce jeu. Je suis Friveq !",
  "17.friveq.1": "Et tu viens de quel jeu ?",
  "17.friveq.2": "De plusieurs. Le bonjour d'un certain Joshua... celui des œufs. Bonne chance pour votre aventure !",
  "17.purriau.0": "Miaou.",
  "17.purriau.1": "Pourquoi j'ai l'impression de devoir quelque chose à ce chat ?",
  "17.chulin.0": "McChulin's ?! Je n'ai jamais autorisé personne à utiliser mon chapeau pour un restaurant !",
  "17.chulin.1": "...Cela dit, les menus sont vraiment bons.",
  "17.nicole.0": "C'était... ma maison. Il y a encore mes fleurs.",
  "17.nicole.1": "Quand tout ça sera fini, on te ramènera. Promis.",
  "17.nicoled.0": "Cette maison... a des fleurs bleues et blanches. Comme les taches de Nicole.",
  "17.nicoled.1": "...J'aurais aimé que tu la connaisses, Pancho. Enfin... j'aurais aimé qu'on se souvienne d'elle.",
  "17.key.0": "La Clé Racine... Ah ! Ma tête... Je me souviens...",
  "17.key.1": "Joshua ! On a fini Fooworld ! Un monde sans guerres !",
  "17.key.2": "Et j'ai appelé les légumes « Humains » ! Hahaha. Tu piges ? Des humains ?",
  "17.key.3": "J'étais Manda. C'est moi... qui ai fait tout ça.",
  "17.key.4": "Et moi, j'étais Joshua. Celui de la blague des humains. Désolé.",
  "17.key.5": "Mais maintenant je m'appelle Pancho. Et Pancho va tout réparer.",
  "w4mid.title": "Manda et Joshua",
  "w4mid.0": "Avec la Clé Racine, des souvenirs revinrent : deux countryballs qui riaient dans un bureau, une couronne bleue, un 5 tourné, une amie blanche à taches bleues qui dessinait des niveaux.",
  "w4mid.1": "Et une immense cuisine, au bout de tout, où une voix sans visage disait : « Je cuisine les mondes. Et personne n'éteint le cuisinier. »",
  "18.start.0": "La Cuisine infinie. C'est ici que vit le Cuisinier... et ici que sont nés tous les ustensiles du Foogame.",
  "18.start.1": "Pourquoi tout dans cette cuisine veut me découper ?",
  "18.startd.0": "La Cuisine infinie. C'est ici que vit le Cuisinier, {name}... et ici que sont nés tous les ustensiles du Foogame.",
  "18.startd.1": "Pourquoi tout dans cette cuisine veut me découper ?",
  "18.boss.0": "HALTE ! Nous sommes le Roi Fourchette et la Reine Lame ! Personne ne passe voir le Cuisinier !",
  "19.start.0": "Pancho ! Le vide monte le long de la tour !",
  "19.start.1": "Le Cuisinier est tout en haut ! Grimpe, Hamburguer !",
  "19.mid.0": "Allez, Pancho ! On y est presque !",
  "19.midd.0": "Allez, {name} ! On y est presque !",
  "20.intro.0": "Bon retour, Manda. Joshua. Vous avez pris votre temps.",
  "20.intro.1": "Je m'appelle Pancho. Et je suis là pour t'éteindre.",
  "20.intro.2": "M'éteindre ? Je vous ai cuisiné un monde parfait. Pas de frontières. Pas de guerres. Pas de souvenirs qui font mal.",
  "20.intro.3": "Et comme vous vouliez m'éteindre, je vous ai effacés. Puis j'ai utilisé l'accès de la petite Nicole pour activer le Foo-Effacement. Une nouvelle recette... sans cuisiniers gênants.",
  "20.intro.4": "Tu as utilisé mon accès ! Tu m'as fait les accuser !",
  "20.intro.5": "Une bonne recette a besoin d'une pincée de haine. Ça donne du goût.",
  "20.intro.6": "Maintenant, tout le monde sera un ingrédient !",
  "20.intro.7": "Hamburguer, au combat !",
  "20.introd.0": "Bon retour, Manda. Joshua. Vous avez pris votre temps.",
  "20.introd.1": "Je m'appelle Pancho. Et je suis là pour t'éteindre.",
  "20.introd.2": "M'éteindre ? Je vous ai cuisiné un monde parfait. Pas de frontières. Pas de guerres. Pas de souvenirs qui font mal.",
  "20.introd.3": "Et comme vous vouliez m'éteindre, je vous ai effacés. Et quand la petite Nicole est tombée de la carte... j'ai gardé son code. Son accès.",
  "20.introd.4": "Monstre ! Elle avait confiance dans le Foogame !",
  "20.introd.5": "Une bonne recette a besoin d'ingrédients. Elle fait déjà partie de la mienne.",
  "20.introd.6": "Maintenant, tout le monde sera un ingrédient !",
  "20.introd.7": "Hamburguer, au combat ! Pour Nicole !",
  "20.p1.0": "Le Grand Appétit a faim !",
  "20.p2.0": "Cuisinier ! Personne n'utilise mon accès sans permission ! Pancho, je t'aide depuis l'avion !",
  "20.p2.1": "L'administratrice ?! Impossible !",
  "20.p2d.0": "Regarde ce que j'ai gardé, Manda ! PANCHITA.EXE !",
  "20.p2d.1": "Panchita ?!",
  "20.p2d.2": "...Pan...cho... aide...moi...",
  "20.end.0": "Non... Je... cuisine... les... mondes...",
  "20.end.1": "Plus maintenant. Clé Racine : éteins-toi, Cuisinier !",
  "20.end.2": "Tu as réussi ! Le Grand Appétit s'est arrêté !",
  "20.end.3": "On a réussi, Panchita. Enfin... Nicole.",
  "20.end.4": "Tu as réussi, {name} ! Je savais que tu pouvais le faire !",
  "20.end.5": "Je m'appelle Pancho. ...Mais tu peux m'appeler {name}. Mon ami.",
  "20.end.6": "On rentre à la maison ! Il y a des menus à manger !",
  "20.endd.0": "Non... Je... cuisine... les... mondes...",
  "20.endd.1": "Merci... Pancho... D'avoir essayé... cette fois.",
  "20.endd.2": "Panchita ! Attends ! Je peux te sortir de là !",
  "20.endd.3": "C'est trop tard... Mais maintenant je connais la vérité. Je ne te déteste plus... Adieu, Manda.",
  "20.endd.4": "...Je m'appelle Pancho. Adieu, Nicole. Clé Racine : éteins-toi, Cuisinier.",
  "20.endd.5": "{name}...",
  "20.endd.6": "C'est bon, Tuteur. Tu peux m'appeler {name}. ...Merci de ne pas m'avoir laissé seul, mon ami.",
  "endGood.title": "Fin : Je m'appelle Pancho",
  "endGood.0": "Le Cuisinier s'éteignit pour toujours. Le Grand Appétit cessa de manger, et les bouchées dans le ciel se refermèrent une à une.",
  "endGood.1": "Grâce à la Clé Racine, chaque habitant de Fooworld put choisir : se souvenir de sa vie dans le Monde Countryball ou rester comme il était. Beaucoup choisirent de se souvenir... et de rester pareils. Au fond, Fooworld n'était pas si mal.",
  "endGood.2": "Panchita resta Panchita. Elle ouvrit un stand à côté de McChulin's : « Les Panchuques de Nicole ». Maintenant, tout Fooworld sait ce qu'est un panchuque.",
  "endGood.3": "Pancho se souvint qu'il s'appelait Manda autrefois. Mais quand on lui demande son nom, il répond toujours la même chose : « Je m'appelle Pancho ».",
  "endGood.4": "Enfin... presque toujours. L'Homme Tuteur a déménagé à Fooworld et l'appelle toujours {name}. Et maintenant, ça ne dérange plus Pancho.",
  "endBad.title": "Fin : L'avion en papier",
  "endBad.0": "Le Cuisinier s'éteignit, et avec lui, Panchita.EXE se dissipa en pixels brillants.",
  "endBad.1": "Fooworld était sauvé. Mais la Clé Racine se brisa en servant : personne ne retrouva ses souvenirs.",
  "endBad.2": "Pancho, Hamburguer et l'Homme Tuteur retournèrent dans le quartier. Ils mangèrent des Humains Végé. Ils allèrent chez McChulin's. La vie continua.",
  "endBad.3": "Mais parfois, dans ses rêves, Pancho entend un nom : Nicole. Et de temps en temps, un avion en papier apparaît devant sa porte.",
  "end_good": "FIN !",
  "end_bad": "FIN...",
  "end_thanks": "Merci d'avoir joué !",
  "end_hint": "Et si cette fois tu ne la laissais pas tomber ? (Rejoue le niveau 10)",
  "n_papas": "Don Papo",
  "n_dona": "Donatella",
  "n_gaseosa": "Gaspar",
  "P.hbprick.0": "Aïe ! Quelque chose m'a piqué... J'ai... tellement... sommeil...",
  "q1_0": "Et maintenant ? Je reste planté là pour toujours ?",
  "q1_1": "Je déteste ce jeu. Je déteste les couleurs. Je déteste le Tuteur.",
  "q1_2": "Hamburguer... tiens bon. J'arrive. Je crois.",
  "q2_0": "Bon... le Tuteur n'est pas SI insupportable.",
  "q2_1": "Cet avion en papier... qui était dedans ?",
  "q2_2": "Si je reste immobile, le jeu se met en pause ? Non. Évidemment que non.",
  "q3_0": "Fooworld... tiens encore un peu.",
  "q3_1": "C'est moi qui ai fait tout ça ? Je ne sais pas si je dois être fier ou coupable.",
  "q3_2": "Hamburguer, arrête de fixer les menus.",
  "q4_0": "On va y arriver. Tous ensemble.",
  "q4_1": "Je m'appelle Pancho. Et j'en suis fier.",
  "q4_2": "Merci de ne pas m'avoir abandonné... qui que tu sois, toi qui me contrôles.",

  "pwd_saltarin": "Hüpfer! Halte ⤒ am Boden gedrückt, um einen bis zu 5-mal höheren Sprung aufzuladen. Und in der Luft kannst du 4-mal springen.",
  "pwd_protegido": "Geschützt! Ein Schutzfeld umgibt dich und hält 2 Treffer aus.",
  "pwd_escalador": "Kletterer! Dir wachsen Krallen. Halte den Pfeil gegen eine Wand, um sie hochzuklettern.",
  "pwd_clonbot": "Klon-Bot! Berühre eine Plattform und du wechselst in den ClonBot. Berühre eine andere, um in deinen Körper zurückzukehren.",
  "pwd_rapidez": "Tempo! Du rennst 5-mal schneller. Und wenn du gegen einen Gegner prallst, überrennst du ihn.",

  "sg_charge": "Mit Hüpfer: Halte ⤒ am Boden gedrückt und lass los. Supersprung!",
  "sg_climb": "Mit Kletterer: Spring gegen die Wand und halte den Pfeil zu ihr hin, um zu klettern.",
  "sg_clonbot": "Plattformen mit Roboter schicken dich in den ClonBot. Stacheln tun ihm nichts und er ist schwer: Er kann Knöpfe drücken.",
  "sg_rebel": "Steig auf den ClonBot: In der Mitte bleibt er stehen; am Rand läuft er in diese Richtung und trägt dich.",

  "sg_uv": "Manche Brücken sind unsichtbar. Die UV-Sicht zeigt sie.",

  "sg_salt": "Salz macht durstig. Limo-Brunnen füllen dich auf.",
  "sg_timed": "Die rosa und blauen Blöcke wechseln sich ab. Achte auf den Rhythmus!",

  "desc_pancho": "Ein veganer Hotdog aus Fooworld. Am Anfang ist er griesgrämig, pessimistisch und hasst den Tutor-Mann; mit der Zeit wird er reifer und sie werden Freunde. Egal welchen Namen du ihm gibst, er sagt immer dasselbe: Er heißt Pancho.",
  "desc_hamburguer": "Panchos bester Freund. Er liebt McChulin's und bringt Pancho immer Veggie-Menschen mit, damit er es auch genießen kann. Ein Lasso vom Himmel hat ihn entführt.",
  "desc_tutor": "Er bringt dir das Foogame bei und nennt dich bei dem Namen, den du ihm gegeben hast (auch wenn Pancho widerspricht). Am Anfang kann Pancho ihn nicht ausstehen. Er hat dasselbe Gesicht wie jemand... aber er weiß nicht mehr, wer.",
  "desc_panchita": "Ein Panchuque: ein Essen, das fast niemand kennt. Sie fliegt ein Papierflugzeug, hat ein Lasso und Zahnstocher, die sehr müde machen. Sie hat das ganze Foogame umgebaut.",
  "desc_clonbot": "Eine Roboter-Kopie von Pancho. Er ist schwer, Stacheln tun ihm nichts und er kann Knöpfe drücken. Jemand hat ihn mal gehackt.",
  "desc_santy": "Ein echter Mensch mit gelben Haaren und grauem Hoodie. Er streamte gerade, als er im Foogame landete. Er will Geld. Und er will den sprechenden Hotdog für seinen Stream.",
  "desc_nicole": "Ein weißer Countryball mit blauen Flecken, Fuchsohren und Schwanz. Sie hat früher das Foogame umgebaut. Niemand in Fooworld erinnert sich an sie.",
  "desc_manda": "Hellblau, mit grünem Kreis und blauer Krone. Hat Fooworld und das Foogame zusammen mit Joshua erfunden. Der Tutor-Mann hat dasselbe Gesicht.",
  "desc_joshua": "Grau, mit einer gedrehten 5. Hat Fooworld und das Foogame zusammen mit Manda erfunden. Er hat Obst und Gemüse „Menschen“ getauft. Als Witz.",
  "desc_cocinero": "Die künstliche Intelligenz, die Fooworld „gekocht“ hat. Eine riesige Kochmütze mit Augen und zwei Handschuhen mit Gabel und Messer. Alle Utensilien gehorchen ihr.",
  "desc_cucharita": "Ein winziger Löffel, der ständig hüpft. Einmal draufspringen und weg ist er.",
  "desc_tenedor": "Läuft liegend mit den Zinken nach vorn. Besser von oben draufspringen.",
  "desc_cuchillo": "Gleitet schnell mit der Klinge nach oben. Nicht draufspringen: drüberspringen.",
  "desc_rallador": "Schwer, reglos und voller scharfer Löcher. Nur die Spitzhacke zerbricht sie.",
  "desc_tostadora": "Wirft heißen Toast im Bogen. Draufspringen schaltet ihn aus.",
  "desc_salero": "Fliegt hin und her und streut Salz auf dich.",
  "desc_batidor": "Dreht sich so schnell, dass man nicht draufspringen kann. Fliegt im Kreis.",
  "desc_palillero": "Schießt Zahnstocher wie den, der Pancho ausgeknockt hat.",
  "desc_brasita": "Ein glühendes Kohlestückchen aus der Bergbauwelt. Es hüpft und brennt.",
  "desc_pinza": "Sie patrouilliert und schnellt vor, um dich zu zwicken, wenn du nah kommst.",
  "desc_migaja": "Ein Stückchen Leere. Es schwebt langsam auf dich zu.",
  "desc_rodillo": "Ein Nudelholz, das nie aufhört zu rollen.",
  "desc_licuadora": "Er springt, mixt alles und wirft Smoothie auf dich. Wenn er überhitzt, fliegt der Deckel weg: Dann draufspringen!",
  "desc_microondas": "Fast unsichtbar. Nur die UV-Sicht zeigt sie deutlich. Wenn sie „Ding!“ macht, öffnet sie ihre Tür.",
  "desc_freidora": "Die Fritteuse von McChulin's. Wirft kochendes Öl und lässt ihre Körbe fallen.",
  "desc_cubiertos": "König Gabel und Königin Klinge. Die Wachen des Kochs.",
  "desc_vecinos": "Don Papo (Pommes), Donatella (ein Donut) und Gaspar (eine Limo, der Chef von McChulin's) und viele andere. Sie essen „Menschen“. Niemand wusste je so genau, was das ist.",
