  joshua: (ctx, n, o) => Art.ball(ctx, n.x, n.y - 2, 16, 'joshua', o),
  friveq: (ctx, n, o) => Art.ball(ctx, n.x, n.y - 2, 16, 'friveq', Object.assign({ acc: ['friveqHair'] }, o)),
  purriau: (ctx, n, o) => Art.ball(ctx, n.x, n.y + 2, 12, 'purriau', Object.assign({ acc: ['catEars'] }, o)),
  chulin: (ctx, n, o) => Art.ball(ctx, n.x, n.y - 2, 16, 'chulin', o),
  aldeano: (ctx, n, o) => Art.ball(ctx, n.x, n.y - 2, 15, 'aldeano', o),
  aldeano2: (ctx, n, o) => Art.ball(ctx, n.x, n.y - 2, 15, 'aldeano2', o),
  aldeano3: (ctx, n, o) => Art.ball(ctx, n.x, n.y - 2, 15, 'aldeano3', o),
  hamburguer: (ctx, n, o) => Art.food(ctx, n.x, n.y - 2, 14.5, 'hamburguer', o),
  panchita: (ctx, n, o) => Art.food(ctx, n.x, n.y - 8, 13, 'panchita', o),
  robot: (ctx, n, o) => Art.food(ctx, n.x, n.y + 2, 15, 'robot', o),
  papas: (ctx, n, o) => Art.vecino(ctx, n.x, n.y - 2, 13, 'papas', o),
  pizza: (ctx, n, o) => Art.vecino(ctx, n.x, n.y - 2, 14, 'pizza', o),
  dona: (ctx, n, o) => Art.vecino(ctx, n.x, n.y, 14, 'dona', o),
  gaseosa: (ctx, n, o) => Art.vecino(ctx, n.x, n.y - 2, 13, 'gaseosa', o),
};
class NPC extends Ent {
  constructor(x, y, o = {}) {
    super(x, y, 14, 16);
    this.kind = o.kind || 'tutor'; this.dlg = o.dlg; this.auto = o.auto !== false; this.talked = false;
    this.expr = o.expr || 'neutral'; this.caged = !!o.caged; this.dir = o.dir || -1; this.hop = Math.random() * 6;
    this.oneShot = o.once; this.id = o.id; this.ev = o.ev; this.fixedDir = !!o.fixedDir;
  }
  update(dt) {
    this.t += dt;
    if (this.walkTo != null) { const d = this.walkTo - this.x; if (Math.abs(d) > 4) { this.x += sign(d) * Math.min(Math.abs(d), (this.walkSpeed || 160) * dt); this.dir = sign(d); this.walking = true; } else { this.walkTo = null; this.walking = false; } }
    const p = G.player;
    const close = Math.abs(p.x - this.x) < 70 && Math.abs(p.y - this.y) < 60 && !p.dying;
    if (this.walkTo == null && !this.fixedDir) this.dir = p.x < this.x ? -1 : 1;
    if (this.caged) {
      if (close && G.state === 'play') { this.caged = false; Sfx.play('key'); G.puff(this.x, this.y, '#ccc', 12, 120); this.expr = 'happy'; this.talk(); if (this.ev) G.event(this.ev); }
      return;
    }
    if (close && G.state === 'play' && this.dlg) {
      if (!this.talked && this.auto) this.talk();
      else if (Input.pressed('down')) this.talk();
    }
    for (const tp of Input.taps) {
      const wx = tp.x / ZOOM + G.cam.x, wy = tp.y / ZOOM + G.cam.y;
      if (!tp.btn && this.dlg && dist(wx, wy, this.x, this.y) < 32 && close && G.state === 'play') this.talk();
    }
  }
  talk() {
    if (!this.dlg) return;
    this.talked = true;
    G.say(this.dlg);
    if (this.oneShot) this.dlg = null;
  }
  draw(ctx) {
    if (this.hidden) return;
    const f = NPC_LOOK[this.kind] || NPC_LOOK.tutor;
    const flies = this.kind === 'tutor';
    if (flies) drawHoverShadow(ctx, this.x, this.y + this.hh, this.t);
    const bob = flies ? 22 + Math.sin(this.t * 2.6 + this.hop) * 4 : this.expr === 'happy' || this.walking ? Math.abs(Math.sin(this.t * 7 + this.hop)) * 5 : 0;
    const save = this.y; this.y -= bob;
    if (flies && this.walking) drawFlyTrail(ctx, this.x - this.dir * 18, this.y, this.t);
    f(ctx, this, { phi: this.phi != null ? this.phi : this.dir * 0.6, expr: this.caged ? 'scared' : this.expr, t: this.t, blink: (this.t + this.hop) % 4 < 0.12 });
    this.y = save;
    if (this.caged) {
      ctx.strokeStyle = '#333'; ctx.lineWidth = 3;
      ctx.strokeRect(this.x - 24, this.y - 30, 48, 46);
      for (let i = 1; i < 4; i++) { ctx.beginPath(); ctx.moveTo(this.x - 24 + i * 12, this.y - 30); ctx.lineTo(this.x - 24 + i * 12, this.y + 16); ctx.stroke(); }
      ctx.fillStyle = '#555'; ctx.fillRect(this.x - 26, this.y - 34, 52, 6);
    } else if (this.dlg) {
      const p = G.player;
      const close = Math.abs(p.x - this.x) < 70 && Math.abs(p.y - this.y) < 60;
      const y = this.y - 34 + Math.sin(this.t * 4) * 2;
      ctx.fillStyle = this.talked ? '#fff' : '#ffd23a'; ctx.strokeStyle = '#000'; ctx.lineWidth = 2;
      ctx.beginPath(); roundRect(ctx, this.x - 10, y - 10, 20, 18, 5); ctx.fill(); ctx.stroke();
      outlinedText(ctx, this.talked ? '…' : '!', this.x, y - 1, 14, '#000', '#fff');
      if (close && this.talked) { setFont(ctx, 11, 700); ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.fillText(T('t_tap'), this.x, this.y + 28); }
    }
  }
}

// Cartel con consejo (no detiene el juego)
class Sign extends Ent {
  constructor(x, y, key, o = {}) { super(x, y, 14, 16); this.key = key; this.dlg = o.dlg; this.always = true; }
  update(dt) {
    this.t += dt;
    // en el Foogame (y después) no hay carteles: los consejos los da el Hombre Tutor volando
    if (!this.checked) { this.checked = true; if (!G.def.noTutor && !G.preview) { this.guided = true; if (!G.guide) G.guide = G.add(new TutorGuide()); } }
  }
  draw(ctx) {
    if (this.guided) return;
    const b = this.y + 16;
    ctx.fillStyle = '#8a5a2b'; ctx.strokeStyle = '#000'; ctx.lineWidth = 2;
    ctx.fillRect(this.x - 3, b - 26, 6, 26); ctx.strokeRect(this.x - 3, b - 26, 6, 26);
    ctx.fillStyle = '#ffd690'; ctx.beginPath(); roundRect(ctx, this.x - 16, b - 42, 32, 22, 3); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#c8442c'; ctx.fillRect(this.x - 10, b - 36, 20, 2); ctx.fillRect(this.x - 10, b - 31, 14, 2); ctx.fillRect(this.x - 10, b - 26, 17, 2);
    const p = G.player;
    if (Math.abs(p.x - this.x) < 90 && Math.abs(p.y - this.y) < 90) drawBubble(ctx, this.x, b - 50, T(this.key), 230);
  }
}

// El Hombre Tutor que vuela hasta cada consejo y lo dice en un globo.
// Si ya hay un Hombre Tutor en pantalla (en una escena o como acompañante), toma su lugar.
class TutorGuide extends Ent {
  constructor() { super(-999, -999, 14, 16); this.always = true; this.front = true; this.state = 'away'; this.dir = 1; this.expr = 'happy'; }
  nextSign() {
    const p = G.player;
    let best = null;
    for (const s of G.ents) {
      if (!(s instanceof Sign) || !s.guided || s.done) continue;
      if (p.x > s.x + 260 || (s.dlg && s.said && p.x > s.x + 40)) { s.done = true; continue; }
      if (s.x - p.x < 560 && (!best || s.x < best.x)) best = s;
    }
    return best;
  }
  update(dt) {
    this.t += dt;
    const p = G.player, free = G.state === 'play' && !G.cut && !G.dialog;
    const s = free ? this.nextSign() : this.target;
    if (s && free && this.state === 'away') {
      // aparece: si hay otro Tutor a la vista, se lleva su lugar; si no, baja volando desde el cielo
      const other = G.ents.find((e) => e instanceof NPC && e.kind === 'tutor' && !e.hidden && Math.abs(e.x - (G.cam.x + G.vw / 2)) < G.vw / 2 + 40);
      if (other) { this.x = other.x; this.y = other.y - 22; other.hidden = true; }
      else { this.x = s.x - 160; this.y = G.cam.y - 60; }
      this.state = 'fly';
    }
    this.target = s;
    let tx, ty;
    if (s && this.state !== 'away') { tx = s.x; ty = s.y - 38; this.state = dist(this.x, this.y, tx, ty) < 8 ? 'hover' : 'fly'; }
    else if (this.state !== 'away') { tx = this.x + 400; ty = G.cam.y - 120; this.state = 'leave'; if (this.y < G.cam.y - 80) this.state = 'away'; }
    if (tx != null && this.state !== 'away') {
      const d = dist(this.x, this.y, tx, ty), sp = Math.min(d, Math.max(200, d * 3) * dt);
      if (d > 0.5) { const a = Math.atan2(ty - this.y, tx - this.x); this.x += Math.cos(a) * sp; this.y += Math.sin(a) * sp; if (Math.abs(tx - this.x) > 4) this.dir = sign(tx - this.x); }
    }
    if (this.state === 'hover') this.dir = p.x < this.x ? -1 : 1;
    this.expr = this.state === 'hover' ? 'happy' : 'neutral';
    // consejo con diálogo (p. ej. la primera Foocápsula)
    if (s && s.dlg && !s.said && this.state === 'hover' && free && Math.abs(p.x - s.x) < 90) { s.said = true; G.say(s.dlg); }
  }
  draw(ctx) {
    if (this.state === 'away') return;
    const y = this.y + Math.sin(this.t * 2.6) * 4;
    if (this.state !== 'hover') drawFlyTrail(ctx, this.x - this.dir * 18, y, this.t);
    Art.ball(ctx, this.x, y, 17, 'tutor', { phi: this.dir * 0.6, expr: this.expr, t: this.t, blink: this.t % 4 < 0.12 });
    const s = this.target, p = G.player;
    if (s && !s.dlg && this.state === 'hover' && Math.abs(p.x - s.x) < 300 && Math.abs(p.y - s.y) < 220) drawBubble(ctx, this.x, y - 24, T(s.key), 240);
  }
}
// sombra en el suelo de alguien que flota
function drawHoverShadow(ctx, x, gy, t) {
  ctx.save(); ctx.globalAlpha = 0.22; ctx.fillStyle = '#000';
  ctx.beginPath(); ctx.ellipse(x, gy - 1, 13 + Math.sin(t * 2.6) * 1.5, 3.5, 0, 0, TAU); ctx.fill(); ctx.restore();
}
// estelita de chispas detrás de alguien que vuela
function drawFlyTrail(ctx, x, y, t) {
  ctx.save();
  for (let i = 0; i < 4; i++) {
    const k = (t * 3 + i * 0.25) % 1;
    ctx.globalAlpha = 0.6 * (1 - k); ctx.fillStyle = i % 2 ? '#00ffaa' : '#fff';
    ctx.beginPath(); ctx.arc(x + (i % 2 ? 4 : -4) * k, y + 6 + k * 14, 3 * (1 - k) + 1, 0, TAU); ctx.fill();
  }
  ctx.restore();
}

// Zona invisible que dispara un diálogo o evento al pasar
class Trigger extends Ent {
  constructor(x, y, o) { super(x, y, (o.w || 1) * TILE / 2, (o.h || 20) * TILE / 2); this.o = o; this.x = x + this.hw - TILE / 2; this.y = y - this.hh + TILE / 2; }
  update() {
    if (this.dead || G.state !== 'play') return;
    const p = G.player;
    if (overlap(this, p) && !p.dying && (!p.st.robot || this.o.robot)) {
      this.dead = true;
      if (this.o.dlg) G.say(this.o.dlg);
      if (this.o.ev) G.event(this.o.ev);
    }
  }
}

        for (let i = 0; i < 3; i++) { ctx.fillStyle = 'rgba(255,255,255,0.4)'; ctx.beginPath(); ctx.arc(x - 20 + i * 20, b - 60 - ((t * 25 + i * 15) % 40), 6, 0, TAU); ctx.fill(); }
        break;
      }
      case 'paperplane': {
        ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.moveTo(x + 40, b - 30); ctx.lineTo(x - 30, b - 50); ctx.lineTo(x - 14, b - 30); ctx.lineTo(x - 30, b - 10); ctx.closePath(); ctx.fill(); ctx.stroke();
        break;
      }
    }
  }
}

<script>/* js/enemies.js */
// Enemigos: los utensilios de cocina del Foogame (el ejército del Cocinero), las Brasitas del Mundo Minero
// y las Migajas del Vacío. Todos tienen ojos de countryball (huecos, sin boca).
'use strict';

class Enemy extends Ent {
  constructor(x, y, r, hp) {
    super(x, y, r * 0.8, r * 0.95);
    this.r = r; this.hp = hp; this.maxHp = hp; this.isEnemy = true;
    this.dir = -1; this.flash = 0; this.cd = 1 + Math.random();
    this.stompable = true; this.contact = 1; this.kind = 'cucharita'; this.expr = 'angry';
    this.coinDrop = 1; this.cureChance = 0.18;
  }
  hurt(dmg, src) {
    if (this.dead || this.inv > 0) return false;
    this.hp -= dmg; this.flash = 1;
    Sfx.play(this.boss ? 'bosshit' : 'hit');
    if (this.hp <= 0) this.kill();
    return true;
  }
  kill() {
    this.dead = true;
    G.puff(this.x, this.y, '#d8d8e0', 10, 170); G.puff(this.x, this.y, '#ffc21a', 6, 110);
    Sfx.play('stomp');
    for (let i = 0; i < this.coinDrop; i++) { const c = new Coin(this.x, this.y - 10); c.vy = -300 - Math.random() * 200; c.x += rand(-10, 10); G.add(c); }
    const chance = this.cureChance * (Save.data.upg.pepinillos ? 1.7 : 1);
    if (Math.random() < chance) G.add(new Pickle(this.x, this.y - 10, true));
    G.kills++;
    if (this.onKill) this.onKill();
  }
  playerContact() {
    const p = G.player;
    if (p.dying || !overlap(this, p) || p.sleeping) return;
    // con Rapidez, Pancho los atropella
    if (p.power === 'rapidez' && Math.abs(p.vx) > 520 && !this.boss) { this.hurt(99, p); G.shake(4); return; }
    if (this.stompable && p.vy > 60 && p.y < this.y - this.hh * 0.35) {
      this.hurt(2, p); p.vy = -500; p.jumps = p.airJumps(); Sfx.play('stomp');
      G.puff(p.x, p.y + 12, '#fff', 6, 80);
    } else p.hurt(this.contact, this.x);
  }
  facePlayer() { this.dir = G.player.x < this.x ? -1 : 1; }
  baseUpdate(dt) {
    this.t += dt;
    if (this.flash > 0) this.flash = Math.max(0, this.flash - dt * 6);
    if (this.inv > 0) this.inv -= dt;
    return false;
  }
  canSee(range = 340) {
    const p = G.player;
    return !p.dying && Math.abs(p.x - this.x) < range && Math.abs(p.y - this.y) < 120;
  }
  patrol(dt, speed) {
    this.vx = this.dir * speed;
    const ahead = this.x + this.dir * (this.hw + 4);
    if (this.onGround && (!G.isGroundPx(ahead, this.y + this.hh + 6) || this.hitWall)) { this.dir *= -1; this.vx = this.dir * speed; }
  }
  fall(dt) {
    this.vy += GRAV * dt; this.vy = Math.min(this.vy, MAXFALL);
    G.moveBody(this, dt);
    if (this.y > G.h * TILE + 100) this.dead = true;
  }
  draw(ctx) {
    const walk = this.onGround && Math.abs(this.vx) > 20 ? Math.sin(this.t * 14) * 0.05 : 0;
    Art.utensil(ctx, this.x, this.y + this.hh - this.r, this.r, this.kind, {
      dir: this.dir, expr: this.expr, flash: this.flash * 0.8, t: this.t, sq: (this.sq || 0) + walk, blink: (this.t + this.r) % 4 < 0.1, state: this.state,
    });
  }
}

// ---------- Arte de los utensilios ----------
// (x, y) = centro; r = tamaño
Object.assign(Art, {
  utensil(ctx, x, y, r, kind, o = {}) {
    const t = o.t || 0, dir = o.dir ?? 1, sdir = dir < 0 ? -1 : 1, lw = Math.max(1.6, r * 0.11);
    ctx.save(); ctx.translate(x, y);
    if (o.rot) ctx.rotate(o.rot);
    const sq = o.sq || 0; ctx.scale(1 + sq, 1 - sq);
    ctx.strokeStyle = '#000'; ctx.lineWidth = lw; ctx.lineJoin = 'round'; ctx.lineCap = 'round';
    const metal = '#c9d2dc', metalDk = '#8a94a3';
    let ey = 0, sep = r * 0.34, es = 1;
    switch (kind) {
      case 'cucharita': {
        ctx.fillStyle = metal; ctx.fillRect(-r * 0.14, r * 0.3, r * 0.28, r * 0.7); ctx.strokeRect(-r * 0.14, r * 0.3, r * 0.28, r * 0.7);
        ctx.beginPath(); ctx.ellipse(0, -r * 0.1, r * 0.8, r * 0.62, 0, 0, TAU); ctx.fill(); ctx.stroke();
        ctx.fillStyle = 'rgba(255,255,255,0.6)'; ctx.beginPath(); ctx.ellipse(-r * 0.35, -r * 0.35, r * 0.2, r * 0.12, -0.5, 0, TAU); ctx.fill();
        ey = -r * 0.1; break;
      }
      case 'tenedor': {
        // tenedor acostado: los dientes apuntan hacia donde camina
        ctx.save(); ctx.scale(sdir, 1);
        ctx.fillStyle = metal;
        ctx.beginPath(); roundRect(ctx, -r * 1.2, -r * 0.18, r * 1.0, r * 0.36, r * 0.15); ctx.fill(); ctx.stroke();
        ctx.beginPath(); roundRect(ctx, -r * 0.3, -r * 0.6, r * 0.75, r * 1.2, r * 0.25); ctx.fill(); ctx.stroke();
        for (let i = 0; i < 4; i++) { ctx.beginPath(); roundRect(ctx, r * 0.4, -r * 0.55 + i * r * 0.31, r * 0.75, r * 0.18, r * 0.08); ctx.fill(); ctx.stroke(); }
        ctx.restore();
        ey = -r * 0.05; sep = r * 0.2; es = 0.8; break;
      }
      case 'cuchillo': {
        // cuchillo parado con la hoja para arriba (no se puede pisar)
        ctx.fillStyle = '#3a2a1a'; ctx.beginPath(); roundRect(ctx, -r * 0.4, r * 0.1, r * 0.8, r * 0.9, r * 0.2); ctx.fill(); ctx.stroke();
        ctx.fillStyle = '#e8eef5'; ctx.beginPath(); ctx.moveTo(-r * 0.45, r * 0.1); ctx.lineTo(-r * 0.45, -r * 0.7); ctx.quadraticCurveTo(r * 0.1, -r * 1.5, r * 0.45, -r * 1.2); ctx.lineTo(r * 0.45, r * 0.1); ctx.closePath(); ctx.fill(); ctx.stroke();
        ctx.fillStyle = '#ffffff'; ctx.fillRect(r * 0.2, -r * 1.0, r * 0.12, r * 1.0);
        ey = -r * 0.35; sep = r * 0.2; es = 0.8; break;
      }
      case 'rallador': {
        ctx.fillStyle = metal; ctx.beginPath(); ctx.moveTo(-r * 0.6, -r); ctx.lineTo(r * 0.6, -r); ctx.lineTo(r * 0.9, r); ctx.lineTo(-r * 0.9, r); ctx.closePath(); ctx.fill(); ctx.stroke();
        ctx.fillStyle = '#2a2a2a'; ctx.beginPath(); roundRect(ctx, -r * 0.25, -r * 1.35, r * 0.5, r * 0.4, r * 0.1); ctx.fill(); ctx.stroke();
        ctx.fillStyle = metalDk; for (let i = 0; i < 4; i++) for (let j = 0; j < 3; j++) { ctx.beginPath(); ctx.ellipse(-r * 0.45 + j * r * 0.45, r * 0.15 + i * r * 0.22, r * 0.09, r * 0.05, 0, 0, TAU); ctx.fill(); }
        ey = -r * 0.4; sep = r * 0.3; break;
      }
      case 'tostadora': {
        ctx.fillStyle = '#e8262a'; ctx.beginPath(); roundRect(ctx, -r, -r * 0.7, r * 2, r * 1.6, r * 0.45); ctx.fill(); ctx.stroke();
        ctx.fillStyle = metal; ctx.beginPath(); roundRect(ctx, -r * 0.9, r * 0.55, r * 1.8, r * 0.3, r * 0.1); ctx.fill(); ctx.stroke();
        ctx.fillStyle = '#2a2a2a'; ctx.fillRect(-r * 0.6, -r * 0.72, r * 0.45, r * 0.14); ctx.fillRect(r * 0.15, -r * 0.72, r * 0.45, r * 0.14);
        if (o.state === 'pop') { ctx.fillStyle = '#d9963a'; ctx.beginPath(); roundRect(ctx, -r * 0.55, -r * 1.2, r * 0.35, r * 0.6, r * 0.1); ctx.fill(); ctx.stroke(); }
        ctx.fillStyle = metalDk; ctx.fillRect(r * 0.95, -r * 0.2, r * 0.18, r * 0.4);
        ey = -r * 0.05; sep = r * 0.4; break;
      }
      case 'salero': {
        ctx.fillStyle = 'rgba(230,240,255,0.95)'; ctx.beginPath(); roundRect(ctx, -r * 0.6, -r * 0.55, r * 1.2, r * 1.45, r * 0.25); ctx.fill(); ctx.stroke();
        ctx.fillStyle = '#ffffff'; ctx.fillRect(-r * 0.5, r * 0.25, r, r * 0.55);
        ctx.fillStyle = metal; ctx.beginPath(); ctx.moveTo(-r * 0.62, -r * 0.55); ctx.quadraticCurveTo(0, -r * 1.25, r * 0.62, -r * 0.55); ctx.closePath(); ctx.fill(); ctx.stroke();
        ctx.fillStyle = '#2a2a2a'; for (const dx of [-0.2, 0, 0.2]) { ctx.beginPath(); ctx.arc(dx * r, -r * 0.82, r * 0.05, 0, TAU); ctx.fill(); }
        ey = -r * 0.1; sep = r * 0.28; es = 0.9; break;
      }
      case 'batidor': {
        ctx.save(); ctx.rotate(Math.sin(t * 12) * 0.25);
        ctx.strokeStyle = '#000'; ctx.lineWidth = lw * 2.2;
        for (let i = 0; i < 3; i++) { const w = r * (0.25 + i * 0.25); ctx.beginPath(); ctx.ellipse(0, -r * 0.3, w, r * 0.8, 0, 0, TAU); ctx.stroke(); }
        ctx.strokeStyle = metal; ctx.lineWidth = lw;
        for (let i = 0; i < 3; i++) { const w = r * (0.25 + i * 0.25); ctx.beginPath(); ctx.ellipse(0, -r * 0.3, w, r * 0.8, 0, 0, TAU); ctx.stroke(); }
        ctx.restore();
        ctx.fillStyle = '#ff8ac0'; ctx.strokeStyle = '#000'; ctx.lineWidth = lw; ctx.beginPath(); roundRect(ctx, -r * 0.28, r * 0.35, r * 0.56, r * 0.8, r * 0.2); ctx.fill(); ctx.stroke();
        ey = r * 0.6; sep = r * 0.13; es = 0.55; break;
      }
      case 'brasita': {
        BG.flames(ctx, 0, -r * 0.5, r * 1.3, r * 1.0, t * 1.5);
        ctx.fillStyle = '#3a2a2a'; ctx.beginPath();
        for (let i = 0; i <= 12; i++) { const a = (i / 12) * TAU, q = r * (0.85 + (i % 2) * 0.12); ctx.lineTo(Math.cos(a) * q, Math.sin(a) * q * 0.85); }
        ctx.closePath(); ctx.fill(); ctx.stroke();
        ctx.fillStyle = '#ff6a1f'; for (const [dx, dy] of [[-0.4, 0.3], [0.35, 0.35], [0.1, 0.55]]) { ctx.beginPath(); ctx.arc(dx * r, dy * r, r * 0.1, 0, TAU); ctx.fill(); }
        ey = -r * 0.05; break;
      }
      case 'pinza': {
        const open = o.state === 'snap' ? 0.05 : 0.35 + Math.sin(t * 3) * 0.08;
        ctx.save(); ctx.scale(sdir, 1);
        ctx.fillStyle = metal;
        for (const s of [-1, 1]) { ctx.save(); ctx.rotate(s * open); ctx.beginPath(); roundRect(ctx, -r * 0.6, -r * 0.15 + s * r * 0.05, r * 1.7, r * 0.3, r * 0.12); ctx.fill(); ctx.stroke(); ctx.restore(); }
        ctx.beginPath(); ctx.arc(-r * 0.55, 0, r * 0.4, 0, TAU); ctx.fill(); ctx.stroke();
        ctx.restore();
        ey = 0; sep = r * 0.17; es = 0.6; ctx.translate(-sdir * r * 0.55, 0); break;
      }
      case 'migaja': {
        // migaja del vacío: negra, con bordes que fallan
        ctx.fillStyle = '#0a0010'; ctx.beginPath();
        for (let i = 0; i <= 14; i++) { const a = (i / 14) * TAU, q = r * (0.8 + hash1(i * 3 + Math.floor(t * 8)) * 0.3); ctx.lineTo(Math.cos(a) * q, Math.sin(a) * q); }
        ctx.closePath(); ctx.fill(); ctx.strokeStyle = '#ff00d4'; ctx.stroke(); ctx.strokeStyle = '#000';
        break;
      }
      case 'palillero': {
        ctx.fillStyle = '#c08a4a'; ctx.beginPath(); roundRect(ctx, -r * 0.8, -r * 0.6, r * 1.6, r * 1.5, r * 0.3); ctx.fill(); ctx.stroke();
        ctx.fillStyle = '#f0d49a'; for (let i = 0; i < 5; i++) { ctx.fillRect(-r * 0.6 + i * r * 0.28, -r * 1.2 - (i % 2) * r * 0.15, r * 0.1, r * 0.7); }
        ctx.save(); ctx.scale(sdir, 1); ctx.fillStyle = '#5a3a1a'; ctx.beginPath(); roundRect(ctx, r * 0.6, -r * 0.15, r * 0.5, r * 0.3, r * 0.1); ctx.fill(); ctx.stroke(); ctx.restore();
        ey = r * 0.1; break;
      }
      case 'rodillo': {
        ctx.save(); ctx.rotate(t * 8 * dir);
        ctx.fillStyle = '#e6c08a'; ctx.beginPath(); ctx.arc(0, 0, r * 0.85, 0, TAU); ctx.fill(); ctx.stroke();
        ctx.strokeStyle = '#c89a5a'; ctx.beginPath(); ctx.moveTo(-r * 0.6, 0); ctx.lineTo(r * 0.6, 0); ctx.stroke();
        ctx.restore();
        ctx.fillStyle = '#8a5a2b'; ctx.fillRect(-r * 1.4, -r * 0.15, r * 0.5, r * 0.3); ctx.fillRect(r * 0.9, -r * 0.15, r * 0.5, r * 0.3);
        ey = -r * 0.1; sep = r * 0.3; break;
      }
    }
    // ojos (miran hacia donde camina)
    if (!o.back) {
      const expr = o.blink ? 'blink' : (o.expr || 'angry');
      const ex = dir * r * 0.18;
      for (let i = 0; i < 2; i++) drawEye(ctx, ex + (i ? 1 : -1) * sep, ey, r * 0.24 * es, r * 0.27 * es, expr, i, lw * 0.85);
    }
    if (o.flash) { ctx.globalCompositeOperation = 'source-atop'; ctx.fillStyle = `rgba(255,255,255,${o.flash})`; ctx.fillRect(-r * 2, -r * 2, r * 4, r * 4); ctx.globalCompositeOperation = 'source-over'; }
    ctx.restore();
  },
});

// Cucharita: chiquita y saltarina
class Cucharita extends Enemy {
  constructor(x, y) { super(x, y, 12, 1); this.kind = 'cucharita'; this.jumpT = 0.5 + Math.random(); this.cureChance = 0.12; }
  update(dt) {
    this.baseUpdate(dt);
    this.jumpT -= dt;
    if (this.onGround) {
      this.vx = approach(this.vx, 0, 900 * dt);
      if (this.jumpT <= 0) {
        if (this.canSee(300)) this.facePlayer();
        else if (this.hitWall || !G.isGroundPx(this.x + this.dir * 40, this.y + this.hh + 6)) this.dir *= -1;
        this.vy = -430 - Math.random() * 120; this.vx = this.dir * 120; this.jumpT = 0.7 + Math.random() * 0.6; this.sq = -0.2;
        Sfx.play('hop');
      }
    }
    this.sq = approach(this.sq || 0, 0, dt * 2);
    const was = this.onGround;
    this.fall(dt);
    if (this.onGround && !was) this.sq = 0.2;
    this.playerContact();
  }
}
// Tenedor: patrulla con los dientes para adelante
class Tenedor extends Enemy {
  constructor(x, y) { super(x, y, 16, 2); this.kind = 'tenedor'; this.speed = 60 + Math.random() * 20; this.hw = 18; this.hh = 11; }
  update(dt) { this.baseUpdate(dt); this.patrol(dt, this.speed); this.fall(dt); this.playerContact(); }
}
// Cuchillo: se desliza rápido. La hoja corta: no se puede pisar.
class Cuchillo extends Enemy {
  constructor(x, y) { super(x, y, 15, 3); this.kind = 'cuchillo'; this.stompable = false; this.expr = 'serious'; this.hh = 18; }
  update(dt) {
    this.baseUpdate(dt);
    const sp = this.canSee(260) ? 230 : 110;
    if (this.canSee(260)) this.expr = 'angry'; else this.expr = 'serious';
    this.patrol(dt, sp); this.fall(dt);
    const p = G.player;
    if (!p.dying && overlap(this, p)) { p.hurt(1, this.x); if (p.y < this.y - this.hh * 0.4) p.vy = -480; }
  }
}
// Rallador: pesado y quieto, no se puede pisar. El pico lo rompe.
class Rallador extends Enemy {
  constructor(x, y) { super(x, y, 22, 6); this.kind = 'rallador'; this.stompable = false; this.coinDrop = 3; this.cureChance = 1; this.expr = 'serious'; }
  update(dt) {
    this.baseUpdate(dt);
    this.vx = 0; this.fall(dt);
    if (this.canSee(200)) this.facePlayer();
    this.expr = this.flash > 0.3 ? 'angry' : 'serious';
    const p = G.player;
    if (!p.dying && overlap(this, p)) { p.hurt(1, this.x); if (p.y < this.y - this.hh * 0.4) { p.vy = -520; Sfx.play('boing'); } }
  }
}
// Tostadora: tira tostadas en arco
class Tostadora extends Enemy {
  constructor(x, y) { super(x, y, 17, 2); this.kind = 'tostadora'; this.cd = 1 + Math.random(); this.state = 'idle'; }
  update(dt) {
    this.baseUpdate(dt);
    this.vx = 0; this.fall(dt);
    if (this.canSee(420)) {
      this.facePlayer(); this.cd -= dt;
      if (this.cd < 0.35) this.state = 'pop';
      if (this.cd <= 0) {
        this.cd = 2.2; this.state = 'idle';
        const p = G.player, tt = 0.9, vx = clamp((p.x - this.x) / tt, -320, 320), vy = (p.y - this.y - 0.5 * TOAST.grav * tt * tt) / tt;
        G.add(new Bullet(this.x, this.y - this.r, vx, clamp(vy, -760, -200), true, TOAST)); Sfx.play('hop');
      }
    }
    this.playerContact();
  }
}
// Salero: vuela y tira sal cuando pasa por encima
class Salero extends Enemy {
  constructor(x, y, o = {}) { super(x, y, 14, 1); this.kind = 'salero'; this.flying = true; this.ox = x; this.oy = y; this.range = (o.range || 4) * TILE; this.cd = 0.8; }
  update(dt) {
    this.baseUpdate(dt);
    this.x = this.ox + Math.sin(this.t * 0.9) * this.range; this.y = this.oy + Math.sin(this.t * 2.3) * 8;
    this.dir = Math.cos(this.t * 0.9) > 0 ? 1 : -1;
    const p = G.player; this.cd -= dt;
    if (this.cd <= 0 && Math.abs(p.x - this.x) < 80 && p.y > this.y) { this.cd = 0.9; for (let i = 0; i < 3; i++) G.add(new Bullet(this.x + rand(-6, 6), this.y + 12, rand(-40, 40), 60, true, SALT)); Sfx.play('sand'); }
    this.playerContact();
  }
}
// Batidor: vuela dando vueltas; gira tan rápido que no se puede pisar
class Batidor extends Enemy {
  constructor(x, y, o = {}) { super(x, y, 14, 2); this.kind = 'batidor'; this.flying = true; this.stompable = false; this.ox = x; this.oy = y; this.rx = (o.rx || 3) * TILE; this.ry = (o.ry || 2) * TILE; this.sp = o.speed || 1.6; }
  update(dt) {
    this.baseUpdate(dt);
    this.x = this.ox + Math.cos(this.t * this.sp) * this.rx; this.y = this.oy + Math.sin(this.t * this.sp * 2) * this.ry;
    this.dir = -Math.sin(this.t * this.sp) > 0 ? 1 : -1;
    const p = G.player;
    if (!p.dying && overlap(this, p)) p.hurt(1, this.x);
  }
}
// Brasita (Mundo Minero): salta y quema
class Brasita extends Enemy {
  constructor(x, y) { super(x, y, 12, 1); this.kind = 'brasita'; this.jumpT = Math.random(); }
  update(dt) {
    this.baseUpdate(dt); this.jumpT -= dt;
    if (this.onGround) { this.vx = approach(this.vx, 0, 800 * dt); if (this.jumpT <= 0) { if (this.canSee(320)) this.facePlayer(); else if (this.hitWall) this.dir *= -1; this.vy = -560; this.vx = this.dir * 90; this.jumpT = 1.1; } }
    this.fall(dt);
    if (Math.random() < 0.2) G.puff(this.x, this.y - 8, '#ff8a1f', 1, 30);
    this.playerContact();
  }
}
// Pinza: patrulla y se lanza a pellizcar cuando estás cerca
class Pinza extends Enemy {
  constructor(x, y) { super(x, y, 15, 2); this.kind = 'pinza'; this.state = 'walk'; this.st = 0; this.hw = 18; this.hh = 11; }
  update(dt) {
    this.baseUpdate(dt); this.st -= dt;
    if (this.state === 'walk') { this.patrol(dt, 55); if (this.canSee(140) && this.onGround) { this.facePlayer(); this.state = 'snap'; this.st = 0.4; this.vx = this.dir * 330; this.vy = -200; Sfx.play('crack'); } }
    else if (this.st <= 0 && this.onGround) this.state = 'walk';
    this.fall(dt); this.playerContact();
  }
}
// Migaja del Vacío: flota hacia Pancho, despacio
class Migaja extends Enemy {
  constructor(x, y) { super(x, y, 12, 1); this.kind = 'migaja'; this.flying = true; this.cureChance = 0.25; }
  update(dt) {
    this.baseUpdate(dt);
    const p = G.player;
    if (this.canSee(360)) { const a = Math.atan2(p.y - this.y, p.x - this.x); this.vx = lerp(this.vx, Math.cos(a) * 75, dt * 2); this.vy = lerp(this.vy, Math.sin(a) * 75, dt * 2); this.facePlayer(); }
    else { this.vx *= 0.95; this.vy = Math.sin(this.t * 2) * 20; }
    this.x += this.vx * dt; this.y += this.vy * dt;
    if (Math.random() < 0.1) G.glitchFx(this.x, this.y, 1);
    this.playerContact();
  }
}
// Lanzapalillos: dispara palillos (como el que durmió a Pancho)
class Palillero extends Enemy {
  constructor(x, y, o = {}) { super(x, y, 15, 2); this.kind = 'palillero'; this.cd = 1 + Math.random(); this.fixed = o.dir; this.rate = o.rate || 2; }
  update(dt) {
    this.baseUpdate(dt); this.vx = 0; this.fall(dt);
    if (this.fixed) this.dir = this.fixed; else if (this.canSee(500)) this.facePlayer();

// ======================= Nivel 4: La Gran Licuadora =======================
// Salta y hace ondas, licúa (te chupa hacia ella y tira licuado) y después se recalienta:
// la tapa sale volando y ahí hay que pisarla.
class Licuadora extends Enemy {
  constructor(x, y) {
    super(x, y, 40, 6); this.boss = true; this.nameKey = 'licuadora'; this.stompable = false; this.hw = 40; this.hh = 62;
    this.state = 'idle'; this.st = 1.5; this.coinDrop = 10; this.cureChance = 0; this.cycle = 0;
  }
  reset() { this.state = 'idle'; this.st = 1.5; }
  hurt(d, src) {
    if (this.state !== 'tired' || this.inv > 0) { if (src instanceof Bullet) G.puff(src.x, src.y, '#fff', 3, 60); return false; }
    this.hp -= 1; this.flash = 1; this.inv = 0.6; Sfx.play('bosshit');
    this.state = 'idle'; this.st = 1.0;
    if (this.hp <= 0) this.kill();
    return true;
  }
  update(dt) {
    this.baseUpdate(dt);
    if (!this.active) { this.fall(dt); return; }
    const p = G.player, angry = this.hp <= 3;
    this.st -= dt;
    if (this.state === 'idle') {
      this.vx = approach(this.vx, 0, 600 * dt);
      if (this.st <= 0) { this.cycle++; this.state = this.cycle % 3 === 0 ? 'spin' : 'hop'; this.st = this.state === 'spin' ? 2.8 : 0.5; this.hops = angry ? 3 : 2; if (this.state === 'spin') Sfx.play('blend'); }
    } else if (this.state === 'hop') {
      if (this.onGround && this.st <= 0) {
        if (this.hops-- <= 0) { this.state = 'idle'; this.st = 0.8; }
        else { this.facePlayer(); this.vy = -720; this.vx = clamp((p.x - this.x) * 1.4, -300, 300); this.st = 0.3; this.air = true; }
      }
    } else if (this.state === 'spin') {
      // licúa: chupa a Pancho y tira licuado
      this.vx = 0;
      if (!p.dying && Math.abs(p.x - this.x) < 360) p.x += sign(this.x - p.x) * (angry ? 150 : 110) * dt;
      this.shotT = (this.shotT || 0) - dt;
      if (this.shotT <= 0) { this.shotT = angry ? 0.45 : 0.65; const vx = rand(-260, 260); G.add(new Bullet(this.x, this.y - 60, vx, -520 - Math.random() * 200, true, SMOOTHIE)); }
      if (this.st <= 0) { this.state = 'tired'; this.st = angry ? 2.0 : 2.6; Sfx.play('explode'); G.toast(T('t_stompLid')); }
    } else if (this.state === 'tired') {
      this.vx = 0;
      if (this.st <= 0) { this.state = 'idle'; this.st = 1.0; }
    }
    const was = this.onGround;
    this.fall(dt);
    if (this.onGround && !was && this.air) {
      this.air = false; G.shake(9); Sfx.play('explode'); G.dust(this.x, this.y + this.hh);
      G.add(new Shockwave(this.x - this.hw, this.y + this.hh, -1, 320, '#ff8ac0')); G.add(new Shockwave(this.x + this.hw, this.y + this.hh, 1, 320, '#ff8ac0'));
    }
    // pisar la licuadora sin tapa
    if (!p.dying && overlap(this, p)) {
      if (this.state === 'tired' && p.vy > 0 && p.y < this.y - this.hh * 0.5) { this.hurt(1, p); p.vy = -620; p.jumps = p.airJumps(); Sfx.play('stomp'); }
      // pisarla sin estar sobrecalentada: rebota sin daño
      else if (p.vy > 0 && p.y < this.y - this.hh * 0.5) { p.vy = -540; p.jumps = p.airJumps(); Sfx.play('boing'); }
      else p.hurt(1, this.x);
    }
  }
  draw(ctx) {
    Art.licuadora(ctx, this.x, this.y - 10, 0.85, { t: this.t, spin: this.state === 'spin', lidOff: this.state === 'tired', expr: this.state === 'tired' ? 'idiot' : this.flash > 0 ? 'scared' : 'angry', flash: this.flash * 0.7, dir: this.dir });
  }
}

    this.t += dt;
    const p = G.player;
    if (this.chasing && G.state === 'play' && !p.dying) {
      const gap = p.x - this.x;
      // si estás lejos acelera; si estás cerca va un poquito más lento que tú con Rapidez
      const fast = p.power === 'rapidez';
      const spd = gap > 700 ? (fast ? 1250 : 520) : gap > 380 ? (fast ? 900 : 300) : (fast ? 640 : 205);
      this.vx = approach(this.vx, spd, 1400 * dt);
      this.run = 1;
      if (dist(p.x, p.y, this.x + 10, this.y - 40) < 50 && !G.cut) { this.vx = 0; p.die(); Sfx.play('roar'); this.say = { k: 'sty_got', t: 2 }; }
    } else { this.vx = approach(this.vx, 0, 1200 * dt); this.run = approach(this.run, 0, dt * 3); }
    this.x += this.vx * dt;
    // los pies siguen el piso que está abajo de Pancho (es enorme: pasa por encima de todo)
    const ty = p.y + p.hh;
    this.y = lerp(this.y, ty, 1 - Math.exp(-dt * 5));
    if (this.chasing) {
      this.sayT -= dt;
      if (this.sayT <= 0) { this.sayT = 3 + Math.random() * 2; this.say = { k: 'sty_' + (this.n++ % 6), t: 2.2 }; Sfx.play('chat'); }
    }
    if (this.say) { this.say.t -= dt; if (this.say.t <= 0) this.say = null; }
  }
  draw(ctx) {
    Art.santy(ctx, this.x, this.y, 0.95, { t: this.t, run: this.run, expr: this.chasing ? 'angry' : this.expr || 'neutral', dir: 1, blink: this.t % 4 < 0.1, phone: !this.chasing && !this.noPhone });
    if (this.say) drawBubble(ctx, this.x + 10, this.y - 160, T(this.say.k), 220);
  }
}

// ======================= Nivel 7: El Microondas invisible =======================
// Sin visión UV casi no se ve. Se teletransporta, tira ondas y cuando suena "¡ding!" abre la puerta:
// ahí hay que pisarlo.
class Microondas extends Enemy {
  constructor(x, y) {
    super(x, y, 40, 6); this.boss = true; this.nameKey = 'microondas'; this.flying = true; this.stompable = false; this.hw = 52; this.hh = 36;
    this.state = 'idle'; this.st = 2; this.spots = null; this.open = 0; this.coinDrop = 10; this.cureChance = 0;
  }
  reset() { this.state = 'idle'; this.st = 2; this.open = 0; }
  hurt(d, src) {
    if (this.state !== 'ding' || this.inv > 0) return false;
    this.hp -= 1; this.flash = 1; this.inv = 0.6; Sfx.play('bosshit'); this.state = 'tele'; this.st = 0.5;
    if (this.hp <= 0) this.kill();
    return true;
  }
  update(dt) {
    this.baseUpdate(dt);
    if (!this.active) return;
    if (!this.spots) { const a = G.arena; const gy = this.homeY; this.spots = [[(a.x0 + 5) * TILE, gy], [(a.x1 - 5) * TILE, gy], [(a.x0 + a.x1) / 2 * TILE, gy - 90], [(a.x0 + 9) * TILE, gy - 40], [(a.x1 - 9) * TILE, gy - 40]]; }
    const p = G.player, angry = this.hp <= 3;
    this.st -= dt;
    this.open = approach(this.open, this.state === 'ding' ? 1 : 0, dt * 4);
    if (this.state === 'idle' && this.st <= 0) {
      // tira una ronda de ondas
      const n = angry ? 3 : 2;
      for (let i = 0; i < n; i++) setTimeout(() => { if (!this.dead && G.bossActive === this) { enemyShot(this.x, this.y, G.player.x, G.player.y, 230, WAVE); Sfx.play('uv'); } }, i * 350);
      this.state = 'charge'; this.st = 1.4;
    } else if (this.state === 'charge' && this.st <= 0) { this.state = 'ding'; this.st = angry ? 1.7 : 2.3; Sfx.play('check'); G.toast(T('t_ding')); }
    else if (this.state === 'ding' && this.st <= 0) { this.state = 'tele'; this.st = 0.5; }
    else if (this.state === 'tele' && this.st <= 0) {
      G.glitchFx(this.x, this.y, 10);
      let sp; do sp = pick(this.spots); while (dist(sp[0], sp[1], this.x, this.y) < 10);
      this.x = sp[0]; this.y = sp[1]; Sfx.play('portal'); this.state = 'idle'; this.st = angry ? 0.9 : 1.4;
    }
    if (!p.dying && overlap(this, p)) {
      if (this.state === 'ding' && p.vy > 0 && p.y < this.y - this.hh * 0.4) { this.hurt(1, p); p.vy = -620; p.jumps = p.airJumps(); Sfx.play('stomp'); }
      else if (p.vy > 0 && p.y < this.y - this.hh * 0.4) { p.vy = -540; p.jumps = p.airJumps(); Sfx.play('boing'); }
      else if (this.state !== 'ding') p.hurt(1, this.x);
    }
  }
  draw(ctx) {
    const seen = G.uv || this.state === 'ding' || this.flash > 0;
    ctx.save(); ctx.globalAlpha = seen ? 1 : 0.07 + (this.state === 'charge' ? 0.05 : 0);
    Art.microondas(ctx, this.x, this.y, 0.85, { t: this.t, open: this.open, expr: this.state === 'ding' ? 'scared' : 'angry', flash: this.flash * 0.7 });
    ctx.restore();
  }
}

// ======================= Nivel 8: el ClonBot rebelde =======================
// No hace daño: te sigue y te empuja (¡cuidado con los pinchos!). Si te subes arriba se queda quieto;
// si te paras en una esquina camina hacia ese lado llevándote. Los pinchos no le hacen nada.
class RebelBot extends Ent {
  constructor(x, y) { super(x, y, 34, 22); this.platform = true; this.dx = 0; this.dy = 0; this.dir = -1; this.phi = -1; this.always = true; this.calm = false; this.pushT = 0; }
  update(dt) {
    this.t += dt;
    const px = this.x, py = this.y, p = G.player;
    const riding = p.ride === this && !p.dying;
    if (this.frozen) this.vx = 0;
    else if (riding) {
      const off = p.x - this.x;
      if (Math.abs(off) < this.hw * 0.45) this.vx = approach(this.vx, 0, 900 * dt);
      else { this.dir = sign(off); this.vx = approach(this.vx, this.dir * 175, 600 * dt); }
    } else if (!p.dying && G.state === 'play' && !G.cut) {
      const dx = p.x - this.x;
      this.dir = sign(dx) || this.dir;
      this.vx = Math.abs(dx) > 30 ? approach(this.vx, this.dir * 140, 500 * dt) : approach(this.vx, 0, 900 * dt);
      // empuja a Pancho (sin hacerle daño)
      if (Math.abs(dx) < this.hw + p.hw + 2 && Math.abs(p.y - this.y) < this.hh + p.hh - 6 && this.pushT <= 0) {
        p.vx = this.dir * 520; p.vy = Math.min(p.vy, -240); p.lock = 0.25; this.pushT = 0.6; Sfx.play('robot'); G.dust(p.x, p.y + 8);
      }
    } else this.vx = approach(this.vx, 0, 900 * dt);
    this.pushT -= dt;
    this.vy += GRAV * dt; this.vy = Math.min(this.vy, MAXFALL);
    const wasX = this.x;
    G.moveBody(this, dt);
    // sube escalones de un bloque solo
    if (this.hitWall && this.onGround && Math.abs(this.vx) < 1) { this.vy = -560; }
    if (this.y > G.h * TILE + 60) { this.x = p.x - p.dir * 160; this.y = p.y - 120; this.vy = 0; G.glitchFx(this.x, this.y, 10); }
    this.dx = this.x - px; this.dy = this.y - py;
    this.phi = approach(this.phi, Math.abs(this.x - wasX) > 0.5 ? this.dir * 1.15 : 0, dt * 6);
  }
  draw(ctx) {
    ctx.save(); ctx.translate(this.x, this.y + 2);
    Art.food(ctx, 0, 0, 28, 'robot', { phi: this.phi, expr: this.calm ? 'happy' : 'angry', t: this.t, rebel: !this.calm, blink: this.t % 4 < 0.1 });
    ctx.restore();
    // flechas de ayuda cuando Pancho va arriba
    const p = G.player;
    if (p.ride === this && !this.frozen) { const off = p.x - this.x; if (Math.abs(off) >= this.hw * 0.45) outlinedText(ctx, off > 0 ? '▶' : '◀', this.x + sign(off) * 50, this.y - 6, 16, '#ff5a5a', '#000'); }
  }
}
SPAWNERS.rebelbot = (lv, d, cx, cy, by) => { const b = new RebelBot(cx, by - 22); lv.rebel = b; return b; };
SPAWNERS.santy = (lv, d, cx, cy, by) => { const s = new SantyChaser(cx, by); lv.santy = s; return s; };
ENEMY_TYPES.licuadora = Licuadora;
ENEMY_TYPES.microondas = Microondas;

</script>
<script>/* js/bosses2.js */
// Jefes (parte 2): Panchita (nivel 9, parecida a MEGAKRITEX pero más fácil), la persecución de Panchita (nivel 10),
// la Freidora (nivel 12), SantyTG11 en vivo (nivel 13), los Cubiertos Reales (nivel 18) y el Cocinero (nivel 20).
'use strict';

// ---------- Peligros compartidos ----------
// Cosas que caen del cielo con aviso: palillos, cuchillos, canastas
class SkyFall extends Ent {
  constructor(x, kind, delay = 0, gy) {
    super(x, 0, kind === 'basket' ? 24 : 7, kind === 'basket' ? 20 : 16); this.kind = kind; this.bossHazard = true;
    this.warnT = 0.85 + delay; this.state = 'warn'; this.gy = gy; this.alpha = 1;
  }
  update(dt) {
    this.t += dt;
    const p = G.player;
    if (this.state === 'warn') { this.y = G.cam.y - 40; if (this.t >= this.warnT) { this.state = 'fall'; this.vy = 200; } }
    else if (this.state === 'fall') {
      this.vy += GRAV * 1.1 * dt; this.y += this.vy * dt;
      if (!p.dying && overlap(this, p)) p.hurt(1, this.x);
      if (this.y + this.hh >= this.gy) { this.y = this.gy - this.hh; this.state = 'down'; this.st = this.kind === 'basket' ? 1.6 : 0.6; G.shake(this.kind === 'basket' ? 8 : 2); Sfx.play(this.kind === 'basket' ? 'explode' : 'crack'); }
    } else { this.st -= dt; this.alpha = clamp(this.st * 2, 0, 1); if (this.st <= 0) this.dead = true; if (this.kind === 'basket' && !p.dying && overlap(this, p) && this.st > 1.2) p.hurt(1, this.x); }
  }
  draw(ctx) {
    if (this.state === 'warn') {
      ctx.fillStyle = `rgba(0,0,0,${0.2 + 0.2 * Math.sin(this.t * 18) ** 2})`; ctx.beginPath(); ctx.ellipse(this.x, this.gy - 2, this.hw * 1.8, 6, 0, 0, TAU); ctx.fill();
      outlinedText(ctx, '!', this.x, this.gy - 34, 20, '#ff3b3b', '#000'); return;
    }
    ctx.save(); ctx.globalAlpha = this.alpha; ctx.translate(this.x, this.y); ctx.strokeStyle = '#000'; ctx.lineWidth = 2;
    if (this.kind === 'palillo') { ctx.lineWidth = 6; ctx.beginPath(); ctx.moveTo(0, -16); ctx.lineTo(0, 16); ctx.stroke(); ctx.strokeStyle = '#f0d49a'; ctx.lineWidth = 3.5; ctx.stroke(); }
    else if (this.kind === 'basket') { ctx.fillStyle = '#3a3a3a'; ctx.beginPath(); roundRect(ctx, -24, -20, 48, 40, 6); ctx.fill(); ctx.stroke(); ctx.strokeStyle = '#777'; for (let i = -16; i <= 16; i += 8) { ctx.beginPath(); ctx.moveTo(i, -18); ctx.lineTo(i, 18); ctx.stroke(); } ctx.fillStyle = '#ffd23a'; for (let i = 0; i < 4; i++) ctx.fillRect(-16 + i * 9, -26, 5, 12); }
    else { ctx.fillStyle = '#e8eef5'; ctx.beginPath(); ctx.moveTo(-6, -2); ctx.lineTo(6, -2); ctx.lineTo(0, 18); ctx.closePath(); ctx.fill(); ctx.stroke(); ctx.fillStyle = '#3a2a1a'; ctx.fillRect(-5, -20, 10, 18); ctx.strokeRect(-5, -20, 10, 18); }
    ctx.restore();
  }
}
// Muro con un hueco que cruza la arena (hay que pasar por el hueco)
class SlideWall extends Ent {
  constructor(dir, x0, x1, gy, speed = 170, col = '#e9ae55') {
    super(0, 0, TILE, 10); this.dir = dir; this.bossHazard = true; this.warnT = 1.2; this.speed = speed; this.x0 = x0; this.x1 = x1; this.gy = gy; this.col = col;
    this.x = dir > 0 ? x0 - TILE : x1 + TILE; this.gapYb = pick([0, 0, 4]); this.gapH = 3;
  }
  update(dt) {
    this.t += dt;
    if (this.t < this.warnT) return;
    this.x += this.dir * this.speed * dt;
    const p = G.player, gapBot = this.gy - this.gapYb * TILE, gapTop = gapBot - this.gapH * TILE;
    const inGap = p.y - p.hh >= gapTop - 2 && p.y + p.hh <= gapBot + 2;
    if (!p.dying && Math.abs(p.x - this.x) < this.hw + p.hw && !inGap && p.y + p.hh > this.gy - 12 * TILE) { p.x = this.x + this.dir * (this.hw + p.hw + 1); p.hurt(1, this.x); }
    if ((this.dir > 0 && this.x > this.x1 + TILE) || (this.dir < 0 && this.x < this.x0 - TILE)) this.dead = true;
  }
  draw(ctx) {
    if (this.t < this.warnT) { const x = this.dir > 0 ? G.cam.x + 40 : G.cam.x + G.vw - 40; if (Math.sin(this.t * 16) > -0.3) outlinedText(ctx, this.dir > 0 ? '▶▶' : '◀◀', x, this.gy - 60, 26, '#ffcf6a', '#000'); return; }
    const gapBot = this.gy - this.gapYb * TILE, gapTop = gapBot - this.gapH * TILE, top = this.gy - 12 * TILE;
    ctx.fillStyle = this.col; ctx.strokeStyle = '#000'; ctx.lineWidth = 3;
    const seg = (a, b) => { if (b - a < 2) return; ctx.fillRect(this.x - this.hw, a, this.hw * 2, b - a); ctx.strokeRect(this.x - this.hw, a, this.hw * 2, b - a); };
    seg(top, gapTop); seg(gapBot, this.gy);
    ctx.fillStyle = 'rgba(0,0,0,0.2)'; for (let y = top; y < this.gy; y += 16) if (y < gapTop || y >= gapBot) ctx.fillRect(this.x - this.hw, y, this.hw * 2, 2);
  }
}
// Lazo que cae sobre Pancho (así se llevó Panchita a Hamburguer)
class Lasso extends Ent {
  constructor(x, gy) { super(x, 0, 26, 20); this.gy = gy; this.st = 0.9; this.state = 'warn'; this.bossHazard = true; this.ly = 0; }
  update(dt) {
    this.t += dt; this.st -= dt;
    const p = G.player;
    if (this.state === 'warn') { this.x = lerp(this.x, p.x, dt * 2.5); if (this.st <= 0) { this.state = 'drop'; Sfx.play('lasso'); } }
    else if (this.state === 'drop') {
      this.ly = Math.min(1, this.ly + dt * 3.2);
      if (this.ly >= 1) { this.state = 'up'; this.st = 0.5; if (!p.dying && Math.abs(p.x - this.x) < 30 && p.y > this.gy - 90) { p.hurt(1, this.x); } }
    } else { this.ly -= dt * 3; if (this.ly <= 0) this.dead = true; }
  }
  draw(ctx) {
    if (this.state === 'warn') { ctx.strokeStyle = `rgba(255,90,140,${0.4 + 0.4 * Math.sin(this.t * 20)})`; ctx.lineWidth = 3; ctx.setLineDash([6, 5]); ctx.beginPath(); ctx.ellipse(this.x, this.gy - 4, 30, 8, 0, 0, TAU); ctx.stroke(); ctx.setLineDash([]); return; }
    const top = G.cam.y - 10, ly = lerp(top, this.gy - 20, this.ly);
    ctx.strokeStyle = '#c98a3a'; ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(this.x, top); ctx.lineTo(this.x, ly - 16); ctx.stroke();
    ctx.lineWidth = 5; ctx.beginPath(); ctx.ellipse(this.x, ly, 30, 14, 0, 0, TAU); ctx.stroke();
  }
}
// Orbe de código: tocarlo le hace daño al jefe
class CodeOrb extends Ent {
  constructor(x, y, boss, dmg = 10, col = '#ff8ab0') { super(x, y, 16, 16); this.boss = false; this.bossRef = boss; this.dmg = dmg; this.col = col; this.bossHazard = true; this.oy = y; }
  update(dt) {
    this.t += dt; this.y = this.oy + Math.sin(this.t * 3) * 8;
    const p = G.player;
    if (!p.dying && overlap(this, p)) { this.dead = true; Sfx.play('power'); G.sparkle(this.x, this.y, this.col, 20); this.bossRef.hurt(this.dmg, this); G.shake(4); }
    if (this.t > 9) this.dead = true;
  }
  draw(ctx) {
    ctx.save(); ctx.globalAlpha = this.t > 7.5 && Math.floor(this.t * 8) % 2 ? 0.4 : 1;
    ctx.fillStyle = this.col; ctx.strokeStyle = '#000'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(this.x, this.y, 14, 0, TAU); ctx.fill(); ctx.stroke();
    setFont(ctx, 12, 900); ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('</>', this.x, this.y + 1);
    ctx.restore();
  }
}

// ======================= Nivel 9: PANCHITA =======================
// Como MEGAKRITEX pero más fácil: Panchita vuela en su avión de papel gigante, en el fondo, y cambia el nivel.
// Daño: tocar los orbes de código, pisarla cuando baja a la arena (Saltarín) y los pepinillos de Hamburguer.
const PX_PHASES = [
  { theme: 'valle', plats: [[4, 6, 4], [12, 8, 4], [20, 6, 4]], atk: ['palillos', 'planes', 'lasso', 'minions'] },
  { theme: 'castillo', plats: [[3, 6, 3], [10, 9, 3], [17, 6, 3], [23, 8, 2]], atk: ['palillos', 'planes', 'lasso', 'slam', 'wall', 'slam'] },
  { theme: 'uv', plats: [[4, 6, 4], [12, 9, 4], [20, 6, 4]], invis: true, atk: ['planes', 'lasso', 'slam', 'wall', 'floor', 'minions', 'slam'] },
];
const PX_PHASE_HP = 40;
const PX_WAIT = [2.7, 2.4, 2.1];
class PanchitaBoss extends Ent {
  constructor(x, y) {
    super(x, y, 60, 50); this.r = 40; this.boss = true; this.isEnemy = true; this.nameKey = 'panchita'; this.hp = this.maxHp = PX_PHASE_HP * 3; this.active = false;
    this.st = 3; this.phaseN = 0; this.flash = 0; this.noClamp = true; this.flying = true; this.orbCd = 2; this.ownRetryMsg = true; this.mode = 'sky'; this.chunk = null;
  }
  gy() { return (G.h - 3) * TILE; }
  ax0() { return (G.arena.x0 + 1) * TILE; }
  ax1() { return G.arena.x1 * TILE; }
  skyX() { return G.cam.x + G.vw / 2 + Math.sin(this.t * 0.6) * 60; }
  skyY() { return G.cam.y + G.vh * 0.26 + Math.sin(this.t * 1.3) * 10; }
  aimX() { return this.x; } aimY() { return this.y; }
  clearHazards() { for (const e of G.ents) if (e.bossHazard || (e.isEnemy && !e.boss)) e.dead = true; this.endChunk(); }
  reset() { this.hp = this.maxHp - this.phaseN * PX_PHASE_HP; this.st = 3; this.mode = 'sky'; this.clearHazards(); this.setPhase(this.phaseN, true); G.toast(T('t_pxCheckpoint')); }
  hurt(d, src) {
    if (this.dead || this.fled) return false;
    if (src instanceof Bullet) d = 1;
    this.hp -= d; this.flash = 1; Sfx.play('bosshit');
    // a punto de perder, Panchita huye
    if (this.hp <= 10) { this.hp = 10; this.fled = true; this.clearHazards(); G.event('flee'); return true; }
    const ph = Math.min(2, Math.floor((this.maxHp - this.hp) / PX_PHASE_HP));
    if (ph !== this.phaseN) {
      this.hp = this.maxHp - ph * PX_PHASE_HP; this.clearHazards(); this.mode = 'sky'; this.setPhase(ph); this.st = 3;
      G.add(new Pickle((this.ax0() + this.ax1()) / 2, this.gy() - 220, true));
    }
    return true;
  }
  setPhase(n, quiet) {
    this.phaseN = n;
    const P = PX_PHASES[n], A = G.arena;
    G.theme = P.theme;
    for (let x = A.x0 + 1; x < A.x1; x++) for (let y = 0; y < G.h - 3; y++) if ('=U'.includes(G.tiles[y][x])) G.tiles[y][x] = ' ';
    for (const [dx, yb, w] of P.plats) for (let i = 0; i < w; i++) G.setTile(A.x0 + dx + i, G.h - 1 - yb, P.invis ? 'U' : '=');
    if (P.invis && !this.uvCap) this.uvCap = G.add(new PowerCapsule((this.ax0() + this.ax1()) / 2, this.gy() - 40, 'uv'));
    if (!quiet && n > 0) { G.flash = 0.6; G.shake(12); Sfx.play('glitch'); G.say('9.p' + n); }
  }
  attack(a) {
    const p = G.player, x0 = this.ax0(), x1 = this.ax1(), gy = this.gy(), ph = this.phaseN;
    const busy = G.ents.filter((e) => e.isEnemy && !e.boss && !e.dead).length;
    switch (a) {
      case 'palillos': { const n = 4 + ph; for (let i = 0; i < n; i++) G.add(new SkyFall(clamp(p.x + (i - (n - 1) / 2) * 80 + rand(-20, 20), x0 + 10, x1 - 10), 'palillo', i * 0.12, gy)); Sfx.play('prick'); return true; }
      case 'planes': { for (let i = 0; i < 3; i++) setTimeout(() => { if (!this.dead && G.bossActive === this && this.mode === 'sky') enemyShot(this.x, this.y + 30, G.player.x, G.player.y, 240, PAPER); }, i * 280); Sfx.play('lasso'); return true; }
      case 'lasso': G.add(new Lasso(p.x, gy)); return true;
      case 'minions': { if (busy > 3) return false; for (const dx of [-140, 140]) { const e = new (pick([Cucharita, Tenedor]))(clamp(p.x + dx, x0 + 30, x1 - 30), G.cam.y - 20); e.vy = 100; G.add(e); } return true; }
      case 'slam': { this.mode = 'drop'; this.tx = clamp(p.x, x0 + 40, x1 - 40); this.st2 = 0.9; Sfx.play('superjump'); return true; }
      case 'wall': { if (G.ents.some((e) => e instanceof SlideWall && !e.dead)) return false; G.add(new SlideWall(p.x < (x0 + x1) / 2 ? 1 : -1, x0, x1, gy, 170, '#ffffff')); return true; }
      case 'floor': { if (this.chunk) return false; this.startChunk(); return true; }
    }
    return false;
  }
  startChunk() {
    const A = G.arena, pl = G.player, ptx = Math.floor(pl.x / TILE), c = { t: 0, warn: 1.4, dur: 5.5, set: false, tiles: [], blocks: [] };
    for (let x = A.x0 + 2, k = 0; x < A.x1 - 1; x += 4, k++) {
      const yb = k % 2 ? 6 : 4;
      for (let i = 0; i < 2; i++) { const tx = x + i, ty = G.h - 1 - yb; if (G.tiles[ty][tx] === ' ' && !(Math.abs(tx - ptx) <= 1 && Math.abs(ty * TILE - pl.y) < 48)) c.blocks.push([tx, ty]); }
    }

// ======================= Nivel 10: la persecución de Panchita =======================
// Panchita corre adelante usando todos los poderes del Foogame; Pancho la sigue con las Foocápsulas del camino.
class PanchitaRunner extends Ent {
  constructor(x, y) { super(x, y, 12, 20); this.always = true; this.running = false; this.pose = 'run'; this.shotT = 3; this.phi = 1.15; }
  surfaceY(x) {
    const tx = Math.floor(x / TILE);
    for (let ty = 1; ty < G.h; ty++) if (G.isSolid(tx, ty) && !G.isSolid(tx, ty - 1) && G.tile(tx, ty) !== 'U') return ty * TILE;
    for (let ty = 1; ty < G.h; ty++) if (G.tile(tx, ty) === '=') return ty * TILE;
    return null;
  }
  update(dt) {
    this.t += dt;
    if (this.falling || this.hiddenFall) return;
    const p = G.player;
    if (this.running && G.state === 'play' && !G.cut) {
      const gap = this.x - p.x;
      const fast = p.power === 'rapidez';
      const want = gap < 220 ? (fast ? 1250 : 420) : gap > 520 ? 40 : (fast ? 900 : 230);
      this.vx = approach(this.vx, want, 1200 * dt);
      if (this.x >= this.endX) { this.x = this.endX; this.vx = 0; this.running = false; G.event('edge'); }
      // le tira palillos a Pancho
      this.shotT -= dt;
      if (this.shotT <= 0 && gap < 600) { this.shotT = 2.6 + Math.random(); G.add(new Bullet(this.x - 14, this.y - 4, -380, -40, true, PALILLO)); Sfx.play('prick'); }
    } else this.vx = approach(this.vx, 0, 1200 * dt);
    this.x += this.vx * dt;
    const sy = G.cut ? null : this.surfaceY(this.x);
    if (sy != null) {
      const ty = sy - this.hh;
      this.pose = this.vx > 700 ? 'dash' : ty < this.y - 60 ? 'climb' : this.y < ty - 50 ? 'jump' : 'run';
      this.y = lerp(this.y, ty, 1 - Math.exp(-dt * (this.pose === 'climb' ? 4 : 7)));
    }
    for (const z of (G.def.pxZones || [])) if (this.x >= z[0] * TILE && this.x < z[1] * TILE && this.pose === 'run') this.pose = z[2];
    if (Math.random() < 0.3 && this.vx > 50) G.puff(this.x - 10, this.y + 18, this.pose === 'dash' ? '#ffe14d' : '#fff', 1, 30);
  }
  draw(ctx) {
    if (this.hiddenFall) return;
    const pose = this.pose;
    if (pose === 'shield') { ctx.save(); ctx.globalAlpha = 0.4; ctx.strokeStyle = '#3ad7ff'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(this.x, this.y, 28, 0, TAU); ctx.stroke(); ctx.restore(); }
    if (pose === 'dash') { ctx.save(); ctx.strokeStyle = 'rgba(255,225,77,0.7)'; ctx.lineWidth = 3; for (let i = 0; i < 4; i++) { ctx.beginPath(); ctx.moveTo(this.x - 18, this.y - 10 + i * 7); ctx.lineTo(this.x - 50 - Math.random() * 20, this.y - 10 + i * 7); ctx.stroke(); } ctx.restore(); }
    const glitch = this.glitch || pose === 'glitch';
    Art.food(ctx, this.x, this.y, 12, 'panchita', { phi: this.phiOverride ?? this.phi, expr: this.expr || (this.running ? 'angry' : 'scared'), t: this.t, glitch, sq: pose === 'jump' ? -0.1 : 0, blink: this.t % 4 < 0.1 });
    if (pose === 'climb') { ctx.fillStyle = '#fff'; for (const d of [-1, 1]) { ctx.beginPath(); ctx.moveTo(this.x + d * 12, this.y); ctx.lineTo(this.x + d * 18, this.y + 4); ctx.lineTo(this.x + d * 12, this.y + 7); ctx.fill(); } }
    if (this.bubble) drawBubble(ctx, this.x, this.y - 32, T(this.bubble));
  }
}

// ======================= Nivel 12: La Freidora =======================
class Freidora extends Enemy {
  constructor(x, y) {
    super(x, y, 50, 6); this.boss = true; this.nameKey = 'freidora'; this.stompable = false; this.hw = 55; this.hh = 46;
    this.state = 'idle'; this.st = 1.5; this.baskets = [0, 0]; this.coinDrop = 10; this.cureChance = 0; this.cycle = 0;
  }
  reset() { this.state = 'idle'; this.st = 1.5; this.baskets = [0, 0]; }
  hurt(d, src) {
    if (this.state !== 'stuck' || this.inv > 0) return false;
    this.hp -= 1; this.flash = 1; this.inv = 0.6; Sfx.play('bosshit'); this.state = 'idle'; this.st = 1.2;
    if (this.hp <= 0) this.kill();
    return true;
  }
  update(dt) {
    this.baseUpdate(dt);
    if (!this.active) { this.fall(dt); return; }
    const p = G.player, angry = this.hp <= 3, gy = this.y + this.hh;
    this.st -= dt;
    if (this.state === 'idle' && this.st <= 0) { this.cycle++; this.state = this.cycle % 2 ? 'splash' : 'plunge'; this.st = this.state === 'splash' ? 1.6 : 0.4; this.n = angry ? 5 : 3; Sfx.play('fry'); }
    else if (this.state === 'splash') {
      this.shotT = (this.shotT || 0) - dt;
      if (this.shotT <= 0 && this.n > 0) { this.n--; this.shotT = 0.25; const tt = 1.0, vx = clamp((p.x + rand(-80, 80) - this.x) / tt, -380, 380); G.add(new Bullet(this.x, this.y - 50, vx, -620, true, OIL)); }
      if (this.st <= 0) { this.state = 'idle'; this.st = 0.8; }
    } else if (this.state === 'plunge') {
      this.baskets = this.baskets.map((b) => approach(b, -40, dt * 120));
      if (this.st <= 0) {
        // las canastas caen sobre Pancho y después quedan pegadas: la freidora queda expuesta
        for (let i = 0; i < (angry ? 3 : 2); i++) G.add(new SkyFall(clamp(p.x + (i - 0.5) * 120, (G.arena.x0 + 2) * TILE, (G.arena.x1 - 1) * TILE), 'basket', i * 0.3, gy));
        this.state = 'wait'; this.st = 1.6;
      }
    } else if (this.state === 'wait' && this.st <= 0) { this.state = 'stuck'; this.st = angry ? 2.0 : 2.6; Sfx.play('explode'); G.toast(T('t_stompLid')); }
    else if (this.state === 'stuck') { this.baskets = this.baskets.map((b) => approach(b, 30, dt * 120)); if (this.st <= 0) { this.state = 'idle'; this.st = 1.0; } }
    if (this.state !== 'plunge' && this.state !== 'stuck') this.baskets = this.baskets.map((b) => approach(b, 0, dt * 80));
    this.fall(dt);
    if (!p.dying && overlap(this, p)) {
      if (this.state === 'stuck' && p.vy > 0 && p.y < this.y - this.hh * 0.5) { this.hurt(1, p); p.vy = -640; p.jumps = p.airJumps(); Sfx.play('stomp'); }
      else if (p.vy > 0 && p.y < this.y - this.hh * 0.5) { p.vy = -540; p.jumps = p.airJumps(); Sfx.play('boing'); }
      else p.hurt(1, this.x);
    }
  }
  draw(ctx) { Art.freidora(ctx, this.x, this.y - 4, 0.85, { t: this.t, baskets: this.baskets, expr: this.state === 'stuck' ? 'verysad' : this.flash > 0 ? 'scared' : 'angry', hot: this.state === 'splash', flash: this.flash * 0.7 }); }
}

// ======================= Nivel 13: SantyTG11 en vivo =======================
// Tira "donaciones" (monedas) y mensajes del chat, hace ondas y embiste. Cuando se pone a leer el chat
// en el celular, agacha la cabeza: ahí hay que pisarlo.
class SantyBoss extends Ent {
  constructor(x, y) {
    super(x, y, 24, 60); this.r = 40; this.boss = true; this.isEnemy = true; this.nameKey = 'santy'; this.hp = this.maxHp = 6; this.active = false;
    this.state = 'idle'; this.st = 1.5; this.dir = -1; this.flash = 0; this.cycle = 0; this.say = null;
  }
  feet() { return this.y + this.hh; }
  aimX() { return this.x; } aimY() { return this.y - 30; }
  reset() { this.state = 'idle'; this.st = 1.5; }
  hurt(d, src) {
    if (src instanceof Bullet) { G.puff(src.x, src.y, '#fff', 3, 50); return false; }
    if (this.state !== 'phone' || this.inv > 0) return false;
    this.hp -= 1; this.flash = 1; this.inv = 0.6; Sfx.play('bosshit'); this.state = 'idle'; this.st = 1.0; this.say = { k: 'sty_hit', t: 1.8 };
    if (this.hp <= 0) { this.dead = true; }
    return true;
  }
  update(dt) {
    this.t += dt;
    if (this.flash > 0) this.flash = Math.max(0, this.flash - dt * 4);
    if (this.inv > 0) this.inv -= dt;
    if (this.say) { this.say.t -= dt; if (this.say.t <= 0) this.say = null; }
    this.vy += GRAV * dt; G.moveBody(this, dt);
    if (!this.active) return;
    const p = G.player, angry = this.hp <= 3;
    this.st -= dt;
    if (this.state === 'idle') {
      this.dir = sign(p.x - this.x) || this.dir; this.vx = this.dir * 70;
      if (this.st <= 0) {
        this.cycle++;
        this.state = this.cycle % 4 === 0 ? 'phone' : pick(['coins', 'chat', 'dash', 'stomp']);
        this.st = { phone: angry ? 2.0 : 2.6, coins: 1.2, chat: 1.4, dash: 0.8, stomp: 0.3 }[this.state];
        this.n = 0; this.vx = 0;
        if (this.state === 'phone') { this.say = { k: 'sty_phone', t: 2 }; Sfx.play('chat'); }
        if (this.state === 'dash') this.say = { k: 'sty_dash', t: 1.5 };
      }
    } else if (this.state === 'coins') {
      this.shotT = (this.shotT || 0) - dt;
      if (this.shotT <= 0 && this.n < (angry ? 6 : 4)) { this.n++; this.shotT = 0.2; const tt = 0.9; G.add(new Bullet(this.x, this.y - 40, clamp((p.x + rand(-60, 60) - this.x) / tt, -420, 420), -560, true, COINSHOT)); Sfx.play('coin'); }
      if (this.st <= 0) { this.state = 'idle'; this.st = 1.2; }
    } else if (this.state === 'chat') {

        const b = G.add(new Bullet(this.x + this.dir * 30, this.feet() - [20, 60, 100][this.n - 1], this.dir * 300, 0, true, Object.assign({}, CHAT, { col: pick(['#9146ff', '#ff5a8a', '#2ecc71', '#3aa0ff']) })));
        b.txt = pick(['xD', 'F', 'GG', 'lol', '67', ':v', 'W']); Sfx.play('chat');
      }
      if (this.st <= 0) { this.state = 'idle'; this.st = 1.0; }
    } else if (this.state === 'dash') {

      else { this.vx = this.dir * (angry ? 520 : 420); if (this.hitWall) { this.state = 'idle'; this.st = 1.0; this.vx = 0; G.shake(6); } }

    } else if (this.state === 'phone') {

      if (this.st <= 0) { this.state = 'idle'; this.st = 1.2; }

// ======================= Manos con cubiertos (Cubiertos Reales y el Cocinero) =======================
class CutleryHand extends Enemy {
  constructor(boss, side, kind) {

  hurt(d, src) {
