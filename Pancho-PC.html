  "role_licuadora": "Босс · Уровень 4",
  "role_microondas": "Босс · Уровень 7",
  "role_freidora": "Босс · Уровень 12",
  "role_cubiertos": "Боссы · Уровень 18",
  "role_vecinos": "Обитатели Fooworld",
  "desc_pancho": "Веганский хот-дог из Fooworld. Сначала он ворчливый, пессимистичный и ненавидит Человека-Наставника; со временем он взрослеет, и они становятся друзьями. Как бы ты его ни назвал, он всегда скажет одно и то же: его зовут Pancho.",
  "desc_hamburguer": "Лучший друг Pancho. Обожает McChulin's и всегда приносит Pancho Веганских Людей, чтобы тот тоже мог порадоваться. Его утащило лассо с неба.",
  "desc_tutor": "Учит играть в Foogame и зовёт тебя тем именем, которое ты ему дал (хотя Pancho возражает). Сначала Pancho его терпеть не может. У него лицо как у кого-то... но он не помнит, у кого.",
  "desc_panchita": "Панчуке — еда, о которой почти никто не знает. Летает на бумажном самолётике, у неё есть лассо и зубочистки, от которых очень клонит в сон. Она перестроила весь Foogame.",
  "desc_clonbot": "Роботизированная копия Pancho. Тяжёлый, шипы ему нипочём, и он может нажимать кнопки. Однажды его взломали.",
  "desc_santy": "Настоящий человек с жёлтыми волосами и в серой толстовке. Он вёл стрим, когда попал в Foogame. Хочет денег. И говорящий хот-дог для своего стрима.",
  "desc_nicole": "Белый кантрибол с голубыми пятнами, лисьими ушками и хвостом. Раньше она перестраивала Foogame. Никто в Fooworld её не помнит.",
  "desc_manda": "Голубой, с зелёным кругом и синей короной. Придумал Fooworld и Foogame вместе с Joshua. У Человека-Наставника такое же лицо.",
  "desc_joshua": "Серый, с повёрнутой пятёркой. Придумал Fooworld и Foogame вместе с Manda. Это он назвал фрукты и овощи «Людьми». В шутку.",
  "desc_cocinero": "Искусственный интеллект, который «приготовил» Fooworld. Огромный поварской колпак с глазами и две перчатки с вилкой и ножом. Ему подчиняется вся посуда.",
  "desc_cucharita": "Крошечная ложка, которая без конца скачет. Один прыжок сверху — и готово.",
  "desc_tenedor": "Ходит лёжа, зубцами вперёд. Лучше прыгнуть на неё сверху.",
  "desc_cuchillo": "Быстро скользит лезвием вверх. Не прыгай на него: перепрыгни.",
  "desc_rallador": "Тяжёлая, неподвижная и вся в острых дырках. Сломать её можно только киркой.",
  "desc_tostadora": "Кидает горячие тосты по дуге. Прыжок сверху её выключает.",
  "desc_salero": "Летает туда-сюда и посыпает тебя солью.",
  "desc_batidor": "Крутится так быстро, что на него не запрыгнешь. Летает кругами.",
  "desc_palillero": "Стреляет зубочистками вроде той, что вырубила Pancho.",
  "desc_brasita": "Горящий уголёк из Шахтёрского мира. Скачет и обжигает.",
  "desc_pinza": "Патрулирует и, когда подходишь близко, бросается ущипнуть.",
  "desc_migaja": "Кусочек пустоты. Медленно плывёт к тебе.",
  "desc_rodillo": "Скалка, которая никогда не перестаёт катиться.",
  "desc_licuadora": "Прыгает, всё перемалывает и швыряется смузи. Когда перегревается, у неё слетает крышка: вот тогда и прыгай на неё.",
  "desc_microondas": "Почти невидима. Чётко её видно только в УФ-зрении. Когда она говорит «дзынь!», открывается дверца.",
  "desc_freidora": "Фритюрница из McChulin's. Брызгает кипящим маслом и роняет корзины.",
  "desc_cubiertos": "Король Вилка и Королева Лезвие. Стража Шефа.",
  "desc_vecinos": "Don Papo (картошка фри), Donatella (пончик) и Gaspar (газировка, директор McChulin's), и многие другие. Они едят «людей». Никто так и не понял, что это такое.",
  "lv_P": "Пролог: Один день в Fooworld",
  "lv_1": "Добро пожаловать в Foogame",
  "lv_2": "Дождь из приборов",
  "lv_3": "Вафельная стена",
  "lv_4": "Фабрика клонов",
  "lv_5": "Печеньковый замок",
  "lv_6": "Шахтёрский мир",
  "lv_7": "Ультрафиолетовые пещеры",
  "lv_8": "ClonBot-бунтарь",
  "lv_9": "Фигура на бумажном самолётике",
  "lv_10": "Край карты",
  "lv_11": "Развалины Хламвиля",
  "lv_12": "Кухня McChulin's",
  "lv_13": "Сады Людей",
  "lv_14": "Соусная река",
  "lv_15": "Соляные равнины",
  "lv_16": "Серверы MaJo",
  "lv_17": "Дом",
  "lv_18": "Бесконечная кухня",
  "lv_19": "Башня Аппетита",
  "lv_20": "Шеф",
  "hb_0": "Pancho! Я по тебе скучал!",
  "hb_1": "Я голодный... тут нет поблизости McChulin's?",
  "hb_2": "Ты точно не ешь людей? Они вкусные.",
  "hb_3": "Давай, давай!",
  "hb_4": "Joshua? Я? Не-е...",
  "hb_5": "Похоже на видеоигру.",
  "sty_0": "ГОНИ ДЕНЬГИ!",
  "sty_1": "Чат, смотрите! Говорящий хот-дог!",
  "sty_2": "Вернись, хот-дог! Это для стрима!",
  "sty_3": "Хуже всего, когда ты успел ввести только имя...",
  "sty_4": "Лайк и подписка, хот-дог!",
  "sty_5": "Чат, делайте ставки! Поймаю или нет?",
  "sty_got": "ПОПАЛСЯ! ...Ой, выскользнул.",
  "sty_hit": "Ай! Чат, это было больно!",
  "sty_phone": "Погоди, прочитаю чат...",
  "sty_dash": "Спидран!",
  "P.start.0": "Ещё один день в Fooworld. Такой же, как вчера. Такой же, как завтра.",
  "P.start.1": "Hamburguer наверняка опять потерялся. Пойду искать его... как обычно.",
  "P.papas.0": "Доброе утро, Pancho! Ты уже съел своих людей на обед?",
  "P.papas.1": "Я веган, Don Papo. Я тебе тысячу раз говорил. Я не ем людей.",
  "P.papas.2": "Да-да. Какой же ты ворчун, Pancho.",
  "P.dona.0": "Pancho! Говорят, сегодня в McChulin's скидки на людей.",
  "P.dona.1": "А что такое люди на самом деле? Никто не знает. И всем всё равно. Как всегда.",
  "P.meet.0": "PANCHO! Наконец-то я тебя нашёл!",
  "P.meet.1": "ТЫ меня нашёл? Да я тебя по всему району искал! Где ты был?",
  "P.meet.2": "Ходил в McChulin's! Съел целое комбо.",
  "P.meet.3": "Ну конечно. А я тебя ждал, как дурак.",
  "P.meet.4": "И я тебе кое-что принёс: Веганских Людей! Чтобы ты тоже мог порадоваться McChulin's.",
  "P.meet.5": "...Ну. Это было мило. Спасибо, Hamburguer. Ты лучший дру...",
  "P.taken.0": "HAMBURGUER?!",
  "P.taken.1": "Нет, нет, нет! Отпусти его! Он мой единственный друг!",
  "P.end.0": "Укол. А потом — ничего.",
  "P.end.1": "Пока Pancho засыпал, кто-то далеко смеялся.",
  "toFoogame.title": "...",
  "toFoogame.0": "Pancho спал очень долго. Ему снились корона, зелёный круг и имя, которое было не его.",
  "toFoogame.1": "Когда он проснулся, он был уже не в Fooworld. Всё стало гораздо ярче, вокруг парили блоки с вопросительными знаками... Это было похоже на видеоигру.",
  "1.wake.0": "Ох... моя голова...",
  "1.wake.1": "Где я? Это не Fooworld. Это... ужасно. Слишком много цветов.",
  "1.wake.2": "Hamburguer?! HAMBURGUER! Ответь мне, пожалуйста!",
  "1.tutor.0": "Привет-привет! Новый игрок! Добро пожаловать в Foogame!",
  "1.tutor.1": "Не нужно мне никакого «добро пожаловать». Ты кто и где мой друг?",
  "1.tutor.2": "Я Человек-Наставник. Моя работа — научить тебя играть!",
  "1.tutor.3": "Но сначала самое важное...",
  "1.nm_normal.0": "Приятно познакомиться, {name}! Какое красивое имя.",
  "1.nm_joshua.0": "Joshua? Фу. Не знаю почему, но это имя мне противно.",
  "1.nm_joshua.1": "Ладно... Привет, {name}.",
  "1.nm_hamburguer.0": "Hamburguer? Хм... По-моему, это имя не подходит к твоей еде. Ты же хот-дог.",
  "1.nm_hamburguer.1": "Но ладно, раз ты так хочешь... Привет, {name}.",
  "1.nm_manda.0": "...{name}.",
  "1.nm_manda.1": "Это имя... Кажется, я его уже слышал. Давным-давно. Где же...?",
  "1.nm_stupid.0": "...Ты правда это написал? ПРАВДА?",
  "1.nm_stupid.1": "Нет. Отказываюсь. Отныне тебя зовут {name}.",
  "1.nm_bad.0": "...",
  "1.nm_bad.1": "Я это повторять не буду. Никогда. Тебя будут звать {name}.",
  "1.nm_carlitos.0": "Carlitos самый... капитос? Ха-ха-ха... хе-хе...",
  "1.nm_carlitos.1": "Нет. Просто Carlitos. Привет, {name}.",
  "1.nm_elver.0": "Elver... Galarga. Ха-ха. Очень смешно.",
  "1.nm_elver.1": "Буду звать тебя {name}, и точка.",
  "1.after.0": "Меня зовут Pancho.",
  "1.after.1": "Я так и сказал: {name}.",
  "1.after.2": "Нет. PANCHO. P-A-N-C-H-O. Ты глухой?",
  "1.after.3": "Конечно, {name}!",
  "1.after.4": "...Я тебя уже ненавижу. Ты не видел гамбургер? Его утащила верёвка с неба.",
  "1.after.5": "Гамбургер? В Foogame нет гамбургеров... Двигайся стрелками и иди за мной. Учатся играя!",
  "1.after.6": "Отлично. Застрял в видеоигре с наставником, который не слушает. Хуже уже не будет.",
  "1.again.0": "{name}, ты вернулся! Повторим основы?",
  "1.again.1": "Меня зовут Pancho. И нет, я ничего не хочу повторять.",
  "1.caps.0": "Видишь эту капсулу? Это Foocapsule. Каждая даёт тебе силу Foogame.",
  "1.caps.1": "Это Прыгун. Держи ⤒ на земле и отпусти. Ты полетишь, {name}!",
  "1.jump.0": "Ого! ...Ладно, это было круто. Только Наставнику не говори.",
  "1.end.0": "Отлично, {name}! Ты рождён для Foogame.",
  "1.end.1": "Меня зовут Pancho. И я не рождён для этого. Где мой друг?",
  "1.end.2": "Хм... Знаю только, что в конце Foogame есть замок. Всё странное в итоге оказывается там.",
  "1.end.3": "А, и берегись приборов. В последнее время они очень... острые.",
  "1.end.4": "Замок. В конце. Полный столовых приборов. Прекрасно. Я никогда не вернусь домой.",
  "2.start.0": "Это Каньон Приборов. Здесь идёт дождь из ножей и вилок.",
  "2.start.1": "Идёт дождь из ЧЕГО?! Мы все умрём! Ну... я умру.",
  "2.start.2": "Поэтому и есть Защищённый: щит, который держит 2 удара. Бери голубые капсулы, {name}!",
  "2.mid.0": "Раньше Foogame был другим. Однажды кто-то полностью его перестроил.",
  "2.mid.1": "Кто? И какое мне дело?",
  "2.mid.2": "Не помню. Я много чего не помню...",
  "2.mid.3": "...Я тоже многого не помню. Это не делает нас друзьями.",
  "3.start.0": "Вафельная стена! Чтобы забраться наверх, нужны когти. Бери Скалолаза.",
  "3.start.1": "Когти? Хот-дог с когтями? Эта игра сломана. И ты тоже.",
  "3.mid.0": "А ты знал, что Foogame сделали двое?",
  "3.mid.1": "Кто?",
  "3.mid.2": "Не знаю. Помню только, что... один из них был очень похож на меня.",
  "3.mid.3": "Какой странный разговор. ...Продолжай. Всё равно мне больше нечем заняться.",
  "4.start.0": "Фабрика клонов! Здесь делают ClonBot'ов.",
  "4.start.1": "ClonBot — это твоя копия-робот. Коснись площадки с роботом, и твой разум перескочит в ClonBot. Коснись другой, чтобы вернуться.",
  "4.start.2": "Мой РАЗУМ перескочит?! Нет, нет, нет. Ничего хорошего из этого не выйдет.",
  "4.swap.0": "БИП-БУП. CLONBOT В СЕТИ. ПРИВЕТ, PANCHO.",
  "4.swap.1": "А! Я из металла! ...Зато робот знает, как меня зовут. В отличие от некоторых.",
  "4.boss.0": "Осторожно, {name}! Великий Блендер! Когда он перегреется, слетит крышка. Тогда и прыгай на него!",
  "4.bossEnd.0": "Я победил блендер! ...Трюк с крышкой сработал. Немножко.",
  "4.bossEnd.1": "Браво, {name}! Замок уже близко.",
  "5.start.0": "Печеньковый замок... Сюда давно никто не добирался.",
  "5.start.1": "Если Hamburguer где-то и есть, то здесь. Он должен быть здесь.",
  "5.santy.0": "Чат, чат, ЧАТ! Смотрите, кто пришёл! ГОВОРЯЩИЙ ХОТ-ДОГ!",
  "5.santy.1": "Человек?! НАСТОЯЩИЙ человек?!",
  "5.santy.2": "Хот-дог... Это же еда. А я стримлю уже три часа без еды.",
  "5.santy.3": "ГОНИ ДЕНЬГИ! ИЛИ ГОНИ ХОТ-ДОГ!",
  "5.santy.4": "{name}! Держи и БЕГИ! Это Скорость!",
  "5.escape.0": "Не-е-ет! Чат, хот-дог сбежал!",
  "5.escape.1": "...Нажмите F в чате.",
  "5.escape.2": "Ха! Было близко!",
  "5.escape.3": "...Наставник. Ты меня спас. Спасибо. Но меня всё равно зовут Pancho.",
  "5.escape.4": "Не за что, {name}!",
  "w1end.title": "Тем временем...",
  "w1end.0": "Далеко от замка, в небе Foogame, кружил бумажный самолётик. На нём сидела фигура, которую никто не знал.",
  "w1end.1": "«Значит, он добрался до замка, — сказала фигура. — Как и в прошлый раз. Ты всегда хорошо играл в свои же игры... Manda».",
  "6.start.0": "{name}! Слышишь меня? Я отправил тебя в другой мир: Шахтёрский мир.",
  "6.start.1": "Для того, что тебя ждёт, понадобится кирка. Собери 3 хоттеррита (такие горячие светящиеся камни) и 2 палки и скрафти её на верстаке.",
  "6.start.2": "Кирка из горячих камней и палок? Где-то я такое уже видел... И ты что, будешь болтать со мной всё время?",
  "6.start.3": "Всегда! Удачи, {name}!",
  "6.plane.0": "А? Бумажный самолётик?",
  "6.plane.1": "Там... кто-то есть. Он за мной следит.",
  "6.need.0": "Тебе ещё не хватает материалов, {name}. 3 хоттеррита и 2 палки.",
  "6.craft.0": "Хоттерритовая кирка! Она ещё тёплая!",
  "6.craft.1": "Теперь ты Шахтёр, {name}! Кнопка ⛏ ломает камень. Попробуй на той стене!",
  "6.end.0": "Очень хорошо! Возвращаю тебя в Foogame.",
  "6.end.1": "Наставник, мне надо тебе кое-что сказать. Я видел бумажный самолётик. В нём кто-то был.",
  "6.end.2": "Ты рассказываешь это МНЕ? {name}, значит, ты мне доверяешь!",
  "6.end.3": "Не радуйся раньше времени.",
  "uv_1": "Если кто-то это читает: не верь всему, что говорит Наставник. Он не виноват. Он тоже не помнит. —N.",
  "uv_2": "День 412 в Foogame. Я всё ещё панчуке. Никто в Fooworld не знает, что такое панчуке. —N.",
  "uv_3": "M и J обещали, что никто ничего не забудет. Они солгали. —N.",
  "uv_4": "Я перерисовывала эти пещеры трижды. Невидимые мосты — моя любимая часть. —N.",
  "uv_5": "Микроволновка — моя. Я запрограммировала её прятать выход. Они идут. —N.",
  "7.start.0": "Ультрафиолетовые пещеры. Возьми УФ-зрение: здесь есть то, чего не увидишь невооружённым глазом.",
  "7.start.1": "Дай угадаю: невидимые блоки. Я уже знаю твои фокусы, Наставник.",
  "7.read.0": "На стене что-то написано! Это видно только в ультрафиолете...",
  "7.read.1": "«—N.»... Кто такой N?",
  "7.boss.0": "Микроволновка! Её почти не видно! Включи УФ-зрение и прыгай на неё, когда она скажет «дзынь!»",
  "7.bossEnd.0": "Дзынь! Микроволновка готова!",
  "7.bossEnd.1": "{name}... Эти послания. «M и J». Кажется, я должен знать, кто они.",
  "7.bossEnd.2": "А «N» знает то, чего не знаем мы. Мы разберёмся, Наставник. Вместе.",
  "8.start.0": "БИП. БИП. ОБНАРУЖЕН PANCHO.",
  "8.start.1": "ОШИБКА. ПРОТОКОЛ PANCHITA АКТИВИРОВАН. СТОЛКНУТЬ ХОТ-ДОГ НА ШИПЫ.",
  "8.start.2": "{name}! Кто-то перепрограммировал твой ClonBot!",
  "8.start.3": "Мой собственный робот хочет скинуть меня на шипы?!",
  "8.start.4": "...Так. Без паники. Наставник, ты знаешь эту игру. Что мне делать?",
  "8.start.5": "Залезь на него сверху! В середине он стоит на месте, а на краю идёт в ту сторону. Доедь на нём до терминала!",
  "8.terminal.0": "Хватит! Очнись, жестяная башка!",
  "8.terminal.1": "БИП... P-Pancho? Что я натворил?",
  "8.terminal.2": "Прости. Меня взломали. Фигура... на бумажном самолётике.",
  "8.terminal.3": "Опять бумажный самолётик! Знаешь, куда он полетел?",
  "8.terminal.4": "В небо Foogame. Над всеми уровнями.",
  "8.terminal.5": "А я не умею летать.",
  "8.terminal.6": "Я умею. Включаю режим корабля. Залезай, Pancho!",
  "8.terminal.7": "{name}... будь осторожен там, наверху.",
  "8.terminal.8": "Не волнуйся, Наставник. Я скоро вернусь. ...И меня зовут Pancho.",
  "t_robotSkin": "Скин ClonBot открыт в магазине!",
  "9.fly.0": "Вон бумажный самолётик! За ним, ClonBot!",
  "9.fly.1": "Полный вперёд! БИП-БУП.",
  "9.glitch.0": "Что это?! Небо ломается!",
  "9.reunion.0": "А-А-А-А! Где я?! Почему я лечу?!",
  "9.reunion.1": "HAMBURGUER?!",
  "9.reunion.2": "PANCHO! Меня заперли на супер-странном уровне, и вдруг всё сломалось!",
  "9.reunion.3": "Я искал тебя по всему Foogame!",
  "9.reunion.4": "По всему чему? ...Неважно. Та, что на самолёте, — это она поймала меня лассо!",
  "9.reunion.5": "Тогда пойдём за ней.",
  "9.reveal.0": "Значит, ты добрался. Как и в прошлый раз... Manda.",
  "9.reveal.1": "Manda? Меня зовут Pancho.",
  "9.reveal.2": "Теперь да. Раньше тебя звали Manda. А ты, Hamburguer... ты был Joshua.",
  "9.reveal.3": "Joshua? Что такое Joshua?",
  "9.reveal.4": "Меня зовут Panchita. Но раньше меня звали Nicole. Мы втроём жили в Мире Кантриболлов.",
  "9.reveal.5": "Вы двое придумали два проекта: Fooworld и Foogame. В Foogame вы играли сами... а я его перестраивала. Каждый уровень, по которому вы ходили, нарисовала я.",
  "9.reveal.6": "Потом похитили многих. И меня тоже. Нас поместили в Foogame, перенесли в Fooworld и стёрли нам память.",
  "9.reveal.7": "Всем... кроме меня.",
  "9.reveal.8": "Нет... Этого не может быть.",
  "9.reveal.9": "Мы бы никогда такого не сделали!",
  "9.reveal.10": "Ты не помнишь. Как удобно.",
  "9.reveal.11": "Я годами сидела здесь взаперти, в теле еды, которую никто не знает, и смотрела, как вы двое живёте счастливо.",
  "9.reveal.12": "Теперь моя очередь. Я отомщу!",
  "9.p1.0": "Думаешь, умеешь играть? Этот замок тоже нарисовала я!",
  "9.p2.0": "Ни зрения, ни пола! Посмотрим, как ты видишь в темноте!",
  "9.flee.0": "Нет... НЕТ! Двое предателей меня не победят!",
  "9.flee.1": "Это ещё не конец!",
  "9.flee.2": "Она уходит!",
  "9.flee.3": "За ней, Hamburguer. Я хочу ответов.",
  "10.start.0": "Вон она! Она использует силы Foogame!",
  "10.start.1": "Мы тоже. Не упускай её из виду!",
  "10.edge.0": "Что...? Нет! Мой код...! Я распадаюсь!",
  "10.edge.1": "Это край карты! Я падаю! Помогите...!",
  "10.edge.2": "Pancho! Она сейчас упадёт с карты!",
  "ch_title": "Что сделает Pancho?",
  "ch_save": "Спасти Panchita",
  "ch_drop": "Дать ей упасть",
  "10.save.0": "...Зачем ты меня спас? Я сделала тебе столько зла.",
  "10.save.1": "Потому что меня зовут Pancho. А Pancho никому не даёт упасть.",
  "10.save.2": "...Спасибо, Manda. То есть... Pancho.",
  "10.save.3": "Молодец, Pancho!",
  "10.sys.0": "ТРЕВОГА: FOO-УДАЛЕНИЕ АКТИВИРОВАНО. FOOWORLD БУДЕТ СТЁРТ.",
  "10.sys.1": "Что?! Нет! Я такого не программировала!",
  "10.sys.2": "Кто-то ещё пользуется моим доступом! Держитесь крепче!",
  "10.drop.0": "...Pancho. Что ты наделал?",
  "10.drop.1": "...",
  "10.sysd.0": "АДМИНИСТРАТОР ПОТЕРЯН.",
  "10.sysd.1": "FOO-УДАЛЕНИЕ АКТИВИРОВАНО. FOOWORLD БУДЕТ СТЁРТ.",
  "10.sysd.2": "Что происходит?! Pancho!",
  "w2save.title": "Foo-Удаление",
  "w2save.0": "Foogame разлетелся на тысячу кусочков. Pancho, Hamburguer, Panchita и Человек-Наставник упали вместе — обратно в Fooworld.",
  "w2save.1": "Но Fooworld был уже не тем. В небе зияли чёрные дыры в форме укусов. Что-то его ело: Великий Аппетит.",
  "w2save.2": "«Всё это начала я, — сказала Panchita. — Но Foo-Удаление включила не я. Кто-то воспользовался моим доступом. И я узнаю, кто».",
  "w2drop.title": "Foo-Удаление",
  "w2drop.0": "Panchita пропала в пустоте, за краем карты. Её последний крик внезапно оборвался.",
  "w2drop.1": "Без администратора Foogame разлетелся на тысячу кусочков. Pancho и Hamburguer упали обратно в Fooworld... а вместе с ними и Человек-Наставник.",
  "w2drop.2": "Но Fooworld был уже не тем. В небе зияли чёрные дыры в форме укусов. Что-то его ело: Великий Аппетит.",
  "sg_conveyor": "Конвейеры тебя везут. Грили обжигают, если стоять на месте.",
  "t_climb": "Пустота поднимается! Лезь наверх!",
  "n_aldeano": "Кантрибол",
  "n_aldeano2": "Кантрибол",
  "n_purriau": "Purriau",
  "n_chulin": "Chulin",
  "11.start.0": "Pancho! Наш район! Его съедают!",
  "11.start.1": "Мой дом... в нём огромный укус.",
  "11.start.2": "Это Великий Аппетит. Foo-Удаление съедает всё, к чему прикасается. Что оно съело — исчезает.",
  "11.start.3": "Я его не включала. Кто-то воспользовался моим доступом администратора... и я не знаю, кто.",
  "11.start.4": "{name}! Я тоже свалился сюда вместе с вами! Я в деле!",
  "11.start.5": "...Я рад, что ты здесь, Наставник. Правда.",
  "11.start.6": "Узнаем вместе. Но сначала выведем отсюда соседей.",
  "11.startd.0": "Pancho! Наш район! Его съедают!",
  "11.startd.1": "Мой дом... в нём огромный укус.",
  "11.startd.2": "{name}... Когда Foogame сломался, я сбежал вместе с вами. Foo-Удаление съедает Fooworld.",
  "11.startd.3": "Та девочка, Panchita, была администратором Foogame. Без неё никто его не остановит.",
  "11.startd.4": "...Хотя бы ты не один, Наставник. И я тоже.",
  "11.startd.5": "Не сейчас, Pancho. Сначала выведем отсюда соседей.",
  "11.papas.0": "Pancho! Чёрный укус съел полкоробки!",
  "11.papas.1": "Беги в McChulin's! Туда ещё не добралось!",
  "11.dona.0": "Спасибо! Я чуть не потеряла свою дырку!",
  "11.dona.1": "...У пончиков и так есть дырка.",
  "11.end.0": "McChulin's ещё стоит! Комбо в безопасности!",
  "11.end.1": "Пока что. Заходим.",
  "12.start.0": "Помогите! Кухня сошла с ума! Фритюрница нас не выпускает!",
  "12.start.1": "Спокойно, шеф! Пока я здесь, ни одно комбо не пропадёт.",
  "12.start.2": "Посуда... двигается сама. Как в Foogame. Кто-то ею управляет.",
  "12.startd.0": "Помогите! Кухня сошла с ума! Фритюрница нас не выпускает!",
  "12.startd.1": "Спокойно, шеф! Пока я здесь, ни одно комбо не пропадёт.",
  "12.startd.2": "Посуда двигается сама, {name}. Как в Foogame. Кто-то ею управляет.",
  "12.boss.0": "Фритюрница! Когда она роняет корзины, она открыта! Прыгай на неё!",
  "12.note.0": "К фритюрнице прилип листок. Рецепт...",
  "12.note.1": "«ПРОЕКТ FOOWORLD. Собственность MaJo Associations. Оригинальный рецепт: мир без границ».",
  "12.note.2": "MaJo... Ma — от Manda. Jo — от Joshua. Так называлась их студия.",
  "12.note.3": "Значит, Fooworld сделали... мы сами?",
  "12.noted.0": "К фритюрнице прилип листок. Рецепт...",
  "12.noted.1": "«ПРОЕКТ FOOWORLD. Собственность MaJo Associations. Оригинальный рецепт: мир без границ».",
  "12.noted.2": "MaJo... Это имя. У меня болит голова, когда я его читаю, {name}.",
  "12.noted.3": "Значит, Fooworld сделали... мы сами?",
  "13.start.0": "Стоп... это и есть люди? Это же овощи!",
  "13.start.1": "Люди — это... помидоры? Морковки?",
  "13.start.2": "Всегда ими были. Joshua в шутку назвал их «людьми». Manda ужасно злилась. И так и прижилось.",
  "13.start.3": "...Я за жизнь съел, наверное, тысячу помидоров.",
  "13.startd.0": "Стоп... это и есть люди? Это же овощи!",
  "13.startd.1": "Люди — это... помидоры? Морковки?",
  "13.startd.2": "Я что-то помню... Кто-то в шутку назвал их «людьми». Кто-то с пятёркой на лице.",
  "13.startd.3": "...Я за жизнь съел, наверное, тысячу помидоров.",
  "13.santy.0": "ЧАТ! Говорящий хот-дог вернулся! И привёл гамбургер!",
  "13.santy.1": "SantyTG11?! Как ты попал в Fooworld?!",
  "13.santy.2": "Выпал из Foogame, когда он сломался. А теперь веду прямой эфир из мира еды. Это соберёт столько просмотров! ГОНИ ДЕНЬГИ!",
  "13.santyEnd.0": "Ладно, ладно... Ты победил. Чат говорит, что ты лучший хот-дог на свете.",
  "13.santyEnd.1": "И чат проголосовал: теперь я вам помогу!",
  "13.santyEnd.2": "Поможешь как?",
  "13.santyEnd.3": "Когда я выпал из Foogame, я видел дверь с табличкой: «Серверы MaJo». Она за Соляными равнинами.",
  "13.santyEnd.4": "Удачи, хот-дог! И не забудь поставить лайк!",
  "14.start.0": "Соусная река! Кетчуп, горчица... рай!",
  "14.start.1": "Не пей, Hamburguer. Переходим и идём дальше.",
  "15.start.0": "Соляные равнины. От соли очень хочется пить. Пей газировку из каждого фонтана, что увидишь.",
  "15.start.1": "Что угодно, лишь бы добраться до серверов.",
  "15.startd.0": "Соляные равнины, {name}. От соли очень хочется пить. Пей газировку из каждого фонтана.",
  "15.startd.1": "Меня зовут Pancho. ...Но спасибо, Наставник.",
  "15.end.0": "Вот дверь! «Серверы MaJo»...",
  "15.end.1": "Идём. Я хочу знать правду.",
  "w3end.title": "Серверы",
  "w3end.0": "За дверью не было ничего съедобного. Только зелёные огоньки, гудящие машины и огромная вывеска: MaJo.",
  "w3end.1": "Машины хранили всё, что произошло. Если правда где-то и была, то здесь.",
  "16.start.0": "Это их... Manda и Joshua. Меня сюда никогда не пускали.",
  "16.start.1": "Узнаем, что случилось. С УФ-зрением мы должны увидеть записи.",
  "16.startd.0": "Эти машины... Я их знаю. Я здесь жил, {name}. До Foogame.",
  "16.startd.1": "Узнаем, что случилось. С УФ-зрением мы должны увидеть записи.",
  "16.log.0": "Тут скрытые сообщения! Это... журналы.",
  "log_1": "Журнал Manda №1: Fooworld готов. Мир без границ и войн: только еда и покой. Всё это приготовил Шеф (наш ИИ).",
  "log_2": "Журнал Joshua №7: Мы назвали фрукты и овощи «Людьми». Manda говорит, что это не смешно. Это уморительно.",
  "log_3": "Журнал Manda №12: Шеф предлагает стереть воспоминания, «чтобы никто не скучал по дому». Мы сказали НЕТ. Никогда.",
  "log_4": "Журнал Joshua №13: Шеф перенёс сюда людей, никого не спросив. Среди них Nicole. Сегодня ночью мы его отключаем.",
  "log_5": "Журнал Manda №14: Мы опоздали. Шеф отправил нас всех в Fooworld и стёр нас. Если кто-то это читает: Корневой Ключ в офисе MaJo, в Мире Кантриболлов. Он отключает Шефа.",
  "16.end.0": "Это были не мы... Это был Шеф. Мы пытались его остановить.",
  "16.end.1": "И он стёр и нас.",
  "16.end.2": "Все эти годы... я ненавидела вас за то, чего вы не делали.",
  "16.end.3": "Но Шефа сделали мы. Значит, мы его и отключим. Идём в Мир Кантриболлов.",
  "16.endd.0": "Это были не мы... Это был Шеф. Мы пытались его остановить.",
  "16.endd.1": "И он стёр и нас.",
  "16.endd.2": "А Panchita... Nicole... погибла, ненавидя тебя за то, чего ты не делал.",
  "16.endd.3": "...Но Шефа сделали мы. Значит, мы его и отключим. Ради неё.",
  "17.start.0": "Pancho! Тут все шарики! Шарики с глазами!",
  "17.start.1": "Мир Кантриболлов... Кажется, я тут уже был.",
  "17.start.2": "Это был мой дом. Наш дом.",
  "17.start.3": "{name}... Посмотри на того, что в короне. У него такое же лицо, как у меня.",
  "17.startd.0": "Pancho! Тут все шарики! Шарики с глазами!",
  "17.startd.1": "Мир Кантриболлов... Кажется, я тут уже был.",
  "17.startd.2": "Я тоже, {name}. Я тоже.",
  "17.a1.0": "А! Ходячие хот-дог и гамбургер! Это ещё что?!",
  "17.a1.1": "Спокойно, мы с миром. Мы просто ищем ключ.",
  "17.a2.0": "Manda и Joshua тут не видели уже много лет. Говорят, они переехали жить в одну из своих игр.",
  "17.friveq.0": "Привет! Вы ведь не местные? Ну... я тоже не из этой игры. Я Friveq!",
  "17.friveq.1": "А ты из какой игры?",
  "17.friveq.2": "Из нескольких. Привет от одного Joshua... того, что с яйцами. Удачи в приключении!",
  "17.purriau.0": "Мяу.",
  "17.purriau.1": "Почему мне кажется, что я этому коту что-то должен?",
  "17.chulin.0": "McChulin's?! Я никому не разрешал использовать мою шляпу для ресторана!",
  "17.chulin.1": "...Хотя комбо там правда вкусные.",
  "17.nicole.0": "Это... был мой дом. Тут ещё растут мои цветы.",
  "17.nicole.1": "Когда всё закончится, мы тебя вернём. Обещаю.",
  "17.nicoled.0": "У этого дома... бело-голубые цветы. Как пятна Nicole.",
  "17.nicoled.1": "...Жаль, что ты её не знал, Pancho. То есть... жаль, что мы её не помним.",
  "17.key.0": "Корневой Ключ... Ай! Моя голова... Я вспоминаю...",
  "17.key.1": "Joshua! Мы закончили Fooworld! Мир без войн!",
  "17.key.2": "А я назвал овощи «Людьми»! Ха-ха-ха. Понял? Люди?",
  "17.key.3": "Я был Manda. Я... всё это сделал.",
  "17.key.4": "А я был Joshua. Тот самый, с шуткой про людей. Прости.",
  "17.key.5": "Но теперь меня зовут Pancho. И Pancho всё исправит.",
  "w4mid.title": "Manda и Joshua",
  "w4mid.0": "С Корневым Ключом вернулись некоторые воспоминания: два кантрибола смеются в офисе, синяя корона, повёрнутая пятёрка, белая подруга с голубыми пятнами, которая рисовала уровни.",
  "w4mid.1": "И огромная кухня в самом конце всего, где голос без лица сказал: «Я готовлю миры. И никто не выключает повара».",
  "18.start.0": "Бесконечная кухня. Здесь живёт Шеф... и здесь родилась вся посуда Foogame.",
  "18.start.1": "Почему всё на этой кухне хочет меня порезать?",
  "18.startd.0": "Бесконечная кухня. Здесь живёт Шеф, {name}... и здесь родилась вся посуда Foogame.",
  "18.startd.1": "Почему всё на этой кухне хочет меня порезать?",
  "18.boss.0": "СТОЯТЬ! Мы Король Вилка и Королева Лезвие! К Шефу никто не пройдёт!",
  "19.start.0": "Pancho! Пустота поднимается по башне!",
  "19.start.1": "Шеф наверху! Лезь, Hamburguer!",
  "19.mid.0": "Давай, Pancho! Почти пришли!",
  "19.midd.0": "Давай, {name}! Почти пришли!",
  "20.intro.0": "С возвращением, Manda. Joshua. Долго же вы.",
  "20.intro.1": "Меня зовут Pancho. И я пришёл тебя выключить.",
  "20.intro.2": "Выключить меня? Я приготовил вам идеальный мир. Без границ. Без войн. Без болезненных воспоминаний.",
  "20.intro.3": "А раз вы хотели меня выключить, я вас стёр. И воспользовался доступом малышки Nicole, чтобы включить Foo-Удаление. Новый рецепт... без надоедливых поваров.",
  "20.intro.4": "Ты использовал мой доступ! Ты заставил меня винить их!",
  "20.intro.5": "Хорошему рецепту нужна щепотка ненависти. Она добавляет вкуса.",
  "20.intro.6": "Теперь все станут ингредиентами!",
  "20.intro.7": "Hamburguer, в бой!",
  "20.introd.0": "С возвращением, Manda. Joshua. Долго же вы.",
  "20.introd.1": "Меня зовут Pancho. И я пришёл тебя выключить.",
  "20.introd.2": "Выключить меня? Я приготовил вам идеальный мир. Без границ. Без войн. Без болезненных воспоминаний.",
  "20.introd.3": "А раз вы хотели меня выключить, я вас стёр. А когда малышка Nicole упала с карты... я сохранил её код. Её доступ.",
  "20.introd.4": "Чудовище! Она доверяла Foogame!",
  "20.introd.5": "Хорошему рецепту нужны ингредиенты. Она уже часть моего.",
  "20.introd.6": "Теперь все станут ингредиентами!",

  "hb_2": "Na pewno nie jesz ludzi? Są pyszni.",
  "hb_3": "Dalej, dalej!",
  "hb_4": "Joshua? Ja? Eee tam...",
  "hb_5": "To wygląda jak gra wideo.",
  "sty_0": "DAWAJ KASĘ!",
  "sty_1": "Czat, patrzcie! Gadający hot dog!",
  "sty_2": "Wracaj, hot dogu! To na stream!",
  "sty_3": "Najgorzej, jak wpisałeś dopiero swoje imię...",
  "sty_4": "Łapka w górę i subskrypcja, hot dogu!",
  "sty_5": "Czat, obstawiajcie! Złapię go czy nie?",
  "sty_got": "MAM CIĘ! ...Ups, wyślizgnął się.",
  "sty_hit": "Auć! Czat, to bolało!",
  "sty_phone": "Czekaj, przeczytam czat...",
  "sty_dash": "Speedrun!",
  "P.start.0": "Kolejny dzień w Fooworld. Taki sam jak wczoraj. Taki sam jak jutro.",
  "P.start.1": "Hamburguer pewnie znowu się zgubił. Pójdę go szukać... nic nowego.",
  "P.papas.0": "Dzień dobry, Pancho! Zjadłeś już ludzi na obiad?",
  "P.papas.1": "Jestem weganinem, Don Papo. Mówiłem ci to tysiąc razy. Nie jem ludzi.",
  "P.papas.2": "No tak, no tak. Ale z ciebie maruda, Pancho.",
  "P.dona.0": "Pancho! Mówią, że dziś w McChulin's ludzie są w promocji.",
  "P.dona.1": "A czym właściwie są ludzie? Nikt nie wie. I nikogo to nie obchodzi. Typowe.",
  "P.meet.0": "PANCHO! Nareszcie cię znalazłem!",
  "P.meet.1": "TY znalazłeś MNIE? Szukałem cię po całej dzielnicy! Gdzie byłeś?",
  "P.meet.2": "Na zakupach w McChulin's! Zjadłem cały zestaw.",
  "P.meet.3": "No jasne. A ja czekałem na ciebie jak głupek.",
  "P.meet.4": "I coś ci przyniosłem: Wege-Ludzi! Żebyś ty też mógł cieszyć się McChulin's.",
  "P.meet.5": "...No. To było miłe. Dzięki, Hamburguer. Jesteś najlepszym przyjaci...",
  "P.taken.0": "HAMBURGUER?!",
  "P.taken.1": "Nie, nie, nie! Puść go! To mój jedyny przyjaciel!",
  "P.end.0": "Ukłucie. A potem nic.",
  "P.end.1": "Gdy Pancho zasypiał, ktoś daleko się śmiał.",
  "toFoogame.title": "...",
  "toFoogame.0": "Pancho spał bardzo długo. Śniła mu się korona, zielone kółko i imię, które nie było jego.",
  "toFoogame.1": "Kiedy się obudził, nie był już w Fooworld. Wszystko było o wiele bardziej kolorowe, unosiły się bloki ze znakami zapytania... Wyglądało to jak gra wideo.",
  "1.wake.0": "Ugh... moja głowa...",
  "1.wake.1": "Gdzie ja jestem? To nie jest Fooworld. To jest... okropne. Za dużo kolorów.",
  "1.wake.2": "Hamburguer?! HAMBURGUER! Odpowiedz mi, proszę!",
  "1.tutor.0": "Cześć, cześć! Nowy gracz! Witaj w Foogame!",
  "1.tutor.1": "Nie chcę żadnego „witaj”. Kim jesteś i gdzie jest mój przyjaciel?",
  "1.tutor.2": "Jestem Pan Tutor. Moim zadaniem jest nauczyć cię grać!",
  "1.tutor.3": "Ale najpierw najważniejsze...",
  "1.nm_normal.0": "Miło cię poznać, {name}! Jakie piękne imię.",
  "1.nm_joshua.0": "Joshua? Fuj. Nie wiem czemu, ale to imię mnie brzydzi.",
  "1.nm_joshua.1": "No nic... Cześć, {name}.",
  "1.nm_hamburguer.0": "Hamburguer? Hmm... Chyba to imię nie pasuje do twojego jedzenia. Jesteś hot dogiem.",
  "1.nm_hamburguer.1": "Ale dobra, skoro tego chcesz... Cześć, {name}.",
  "1.nm_manda.0": "...{name}.",
  "1.nm_manda.1": "To imię... Chyba już je słyszałem. Dawno, dawno temu. Gdzie...?",
  "1.nm_stupid.0": "...Naprawdę to wpisałeś? NAPRAWDĘ?",
  "1.nm_stupid.1": "Nie. Odmawiam. Od teraz nazywasz się {name}.",
  "1.nm_bad.0": "...",
  "1.nm_bad.1": "Nie powtórzę tego. Nigdy. Będziesz się nazywać {name}.",
  "1.nm_carlitos.0": "Carlitos naj... kapitos? Hahaha... hehe...",
  "1.nm_carlitos.1": "Nie. Po prostu Carlitos. Cześć, {name}.",
  "1.nm_elver.0": "Elver... Galarga. Hahaha. Bardzo śmieszne.",
  "1.nm_elver.1": "Będę cię nazywać {name} i tyle.",
  "1.after.0": "Nazywam się Pancho.",
  "1.after.1": "No właśnie mówię: {name}.",
  "1.after.2": "Nie. PANCHO. P-A-N-C-H-O. Głuchy jesteś?",
  "1.after.3": "Oczywiście, {name}!",
  "1.after.4": "...Już cię nienawidzę. Widziałeś hamburgera? Porwała go lina z nieba.",
  "1.after.5": "Hamburgera? W Foogame nie ma hamburgerów... Ruszaj się strzałkami i chodź za mną. Najlepiej uczyć się grając!",
  "1.after.6": "Super. Uwięziony w grze wideo z tutorem, który nie słucha. Gorzej już być nie może.",
  "1.again.0": "{name}, wróciłeś! Powtórzymy podstawy?",
  "1.again.1": "Nazywam się Pancho. I nie, nie chcę niczego powtarzać.",
  "1.caps.0": "Widzisz tę kapsułę? To Foocapsule. Każda daje ci moc z Foogame.",
  "1.caps.1": "Ta to Skoczek. Przytrzymaj ⤒ na ziemi i puść. Polecisz, {name}!",
  "1.jump.0": "Ojej! ...Dobra, to było fajne. Ale nie mów Tutorowi.",
  "1.end.0": "Świetnie, {name}! Urodziłeś się do Foogame.",
  "1.end.1": "Nazywam się Pancho. I nie urodziłem się do tego. Gdzie jest mój przyjaciel?",
  "1.end.2": "Hmm... Wiem tylko, że na końcu Foogame jest zamek. Wszystko, co dziwne, w końcu tam trafia.",
  "1.end.3": "A, i uważaj na sztućce. Ostatnio są bardzo... ostre.",
  "1.end.4": "Zamek. Na końcu. Pełen sztućców. Wspaniale. Nigdy nie wrócę do domu.",
  "2.start.0": "To Kanion Sztućców. Tu padają noże i widelce.",
  "2.start.1": "Pada CO?! Wszyscy zginiemy! No... JA zginę.",
  "2.start.2": "Dlatego istnieje Osłonięty: tarcza, która przyjmuje 2 ciosy. Łap błękitne kapsuły, {name}!",
  "2.mid.0": "Foogame nie zawsze tak wyglądało. Pewnego dnia ktoś je całkiem przebudował.",
  "2.mid.1": "Kto? I co mnie to obchodzi?",
  "2.mid.2": "Nie pamiętam. Wielu rzeczy nie pamiętam...",
  "2.mid.3": "...Ja też wielu rzeczy nie pamiętam. To nie czyni nas przyjaciółmi.",
  "3.start.0": "Waflowa Ściana! Żeby tam wejść, potrzebujesz pazurów. Weź Wspinacza.",
  "3.start.1": "Pazury? Hot dog z pazurami? Ta gra jest zepsuta. Ty też.",
  "3.mid.0": "Wiedziałeś, że Foogame zrobiły dwie osoby?",
  "3.mid.1": "Kto?",
  "3.mid.2": "Nie wiem. Pamiętam tylko, że... jedna z nich bardzo przypominała mnie.",
  "3.mid.3": "Co za dziwna rozmowa. ...Mów dalej. I tak nie mam nic lepszego do roboty.",
  "4.start.0": "Fabryka Klonów! Tu powstają ClonBoty.",
  "4.start.1": "ClonBot to twoja kopia-robot. Dotknij platformy z robotem, a twój umysł przeskoczy do ClonBota. Dotknij innej, żeby wrócić.",
  "4.start.2": "Mój UMYSŁ przeskoczy?! Nie, nie, nie. To się źle skończy.",
  "4.swap.0": "BIP BUP. CLONBOT ONLINE. CZEŚĆ, PANCHO.",
  "4.swap.1": "Ach! Jestem z metalu! ...Przynajmniej robot zna moje imię. W przeciwieństwie do niektórych.",
  "4.boss.0": "Uwaga, {name}! Wielki Blender! Gdy się przegrzeje, odleci mu pokrywka. Wtedy na niego skacz!",
  "4.bossEnd.0": "Pokonałem blender! ...Sztuczka z pokrywką zadziałała. Trochę.",
  "4.bossEnd.1": "Brawo, {name}! Zamek jest blisko.",
  "5.start.0": "Ciasteczkowy Zamek... Od dawna nikt tu nie dotarł.",
  "5.start.1": "Jeśli Hamburguer gdzieś jest, to tutaj. Musi tu być.",
  "5.santy.0": "Czat, czat, CZAT! Patrzcie, kto wszedł! GADAJĄCY HOT DOG!",
  "5.santy.1": "Człowiek?! PRAWDZIWY człowiek?!",
  "5.santy.2": "Hot dog... To jedzenie. A ja streamuję od trzech godzin bez jedzenia.",
  "5.santy.3": "DAWAJ KASĘ! ALBO DAWAJ TEGO HOT DOGA!",
  "5.santy.4": "{name}! Weź to i UCIEKAJ! To Szybkość!",
  "5.escape.0": "Nieee! Czat, hot dog uciekł!",
  "5.escape.1": "...Dajcie F na czacie.",
  "5.escape.2": "Ha! Było blisko!",
  "5.escape.3": "...Tutorze. Uratowałeś mnie. Dzięki. Ale dalej nazywam się Pancho.",
  "5.escape.4": "Nie ma za co, {name}!",
  "w1end.title": "W tym czasie...",
  "w1end.0": "Daleko od zamku, na niebie Foogame, krążył papierowy samolot. Siedziała w nim postać, której nikt nie znał.",
  "w1end.1": "„Więc dotarł do zamku” — powiedziała postać. — „Tak jak ostatnio. Zawsze dobrze ci szło w twoich własnych grach... Manda.”",
  "6.start.0": "{name}! Słyszysz mnie? Wysłałem cię do innego świata: Świata Górniczego.",
  "6.start.1": "Na to, co nadchodzi, potrzebujesz kilofa. Zbierz 3 hotterryty (te gorące, świecące kamienie) i 2 patyki i zrób go przy stole.",
  "6.start.2": "Kilof z gorących kamieni i patyków? Widziałem to w jakiejś grze... A ty będziesz do mnie gadał przez cały czas?",
  "6.start.3": "Zawsze! Powodzenia, {name}!",
  "6.plane.0": "Hę? Papierowy samolot?",
  "6.plane.1": "Tam... ktoś jest. Obserwuje mnie.",
  "6.need.0": "Wciąż brakuje ci materiałów, {name}. 3 hotterryty i 2 patyki.",
  "6.craft.0": "Kilof z hotterrytu! Jeszcze jest ciepły!",
  "6.craft.1": "Teraz jesteś Górnikiem, {name}! Przycisk ⛏ kruszy skałę. Spróbuj na tamtej ścianie!",
  "6.end.0": "Bardzo dobrze! Zabieram cię z powrotem do Foogame.",
  "6.end.1": "Tutorze, muszę ci coś powiedzieć. Widziałem papierowy samolot. Ktoś w nim był.",
  "6.end.2": "Mówisz to MNIE? {name}, to znaczy, że mi ufasz!",
  "6.end.3": "Nie ciesz się tak.",
  "uv_1": "Jeśli ktoś to czyta: nie wierz we wszystko, co mówi Tutor. To nie jego wina. On też nie pamięta. —N.",
  "uv_2": "Dzień 412 w Foogame. Nadal jestem panchuque. Nikt w Fooworld nie wie, co to panchuque. —N.",
  "uv_3": "M i J obiecali, że nikt niczego nie zapomni. Skłamali. —N.",
  "uv_4": "Przeprojektowałam te jaskinie trzy razy. Niewidzialne mosty to moja ulubiona część. —N.",
  "uv_5": "Mikrofalówka jest moja. Zaprogramowałam ją, żeby ukrywała wyjście. Już idą. —N.",
  "7.start.0": "Ultrafioletowe Jaskinie. Weź Wzrok UV: są tu rzeczy, których nie zobaczysz gołym okiem.",
  "7.start.1": "Niech zgadnę: niewidzialne bloki. Znam już twoje sztuczki, Tutorze.",
  "7.read.0": "Na ścianie coś jest napisane! Widać to tylko w ultrafiolecie...",
  "7.read.1": "„—N.”... Kim jest N?",
  "7.boss.0": "Mikrofalówka! Ledwo ją widać! Użyj wzroku UV i skocz na nią, gdy zrobi „dzyń!”",
  "7.bossEnd.0": "Dzyń! Mikrofalówka gotowa!",
  "7.bossEnd.1": "{name}... Te wiadomości. „M i J”. Czuję, że powinienem wiedzieć, kim są.",
  "7.bossEnd.2": "A „N” wie coś, czego my nie wiemy. Dowiemy się, Tutorze. Razem.",
  "8.start.0": "BIP. BIP. WYKRYTO PANCHO.",
  "8.start.1": "BŁĄD. PROTOKÓŁ PANCHITA AKTYWNY. WEPCHNĄĆ HOT DOGA NA KOLCE.",
  "8.start.2": "{name}! Ktoś przeprogramował twojego ClonBota!",
  "8.start.3": "Mój własny robot chce mnie zrzucić na kolce?!",
  "8.start.4": "...Dobra. Bez paniki. Tutorze, znasz tę grę. Co mam robić?",
  "8.start.5": "Wejdź na niego! Na środku stoi w miejscu, a na rogu idzie w tę stronę. Dojedź na nim do terminala!",
  "8.terminal.0": "Dość tego! Obudź się, blaszana głowo!",
  "8.terminal.1": "BIP... P-Pancho? Co ja zrobiłem?",
  "8.terminal.2": "Przepraszam. Ktoś mnie zhakował. Postać... w papierowym samolocie.",
  "8.terminal.3": "Znowu papierowy samolot! Wiesz, dokąd poleciał?",
  "8.terminal.4": "Na niebo Foogame. Ponad wszystkie poziomy.",
  "8.terminal.5": "A ja nie umiem latać.",
  "8.terminal.6": "Ja umiem. Włączam tryb statku. Wskakuj, Pancho!",
  "8.terminal.7": "{name}... uważaj tam na górze.",
  "8.terminal.8": "Spokojnie, Tutorze. Zaraz wracam. ...I nazywam się Pancho.",
  "t_robotSkin": "Skórka ClonBot odblokowana w sklepie!",
  "9.fly.0": "Tam jest papierowy samolot! Za nim, ClonBot!",
  "9.fly.1": "Cała naprzód! BIP BUP.",
  "9.glitch.0": "Co to?! Niebo się sypie!",
  "9.reunion.0": "AAAAAA! Gdzie ja jestem?! Czemu lecę?!",
  "9.reunion.1": "HAMBURGUER?!",
  "9.reunion.2": "PANCHO! Byłem zamknięty na mega dziwnym poziomie i nagle wszystko się rozpadło!",
  "9.reunion.3": "Szukałem cię po całym Foogame!",
  "9.reunion.4": "Po całym czym? ...Nieważne. Ta w samolocie to ta, która złapała mnie na lasso!",
  "9.reunion.5": "To lecimy po nią.",
  "9.reveal.0": "Więc dotarłeś. Tak jak ostatnio... Manda.",
  "9.reveal.1": "Manda? Nazywam się Pancho.",
  "9.reveal.2": "Teraz tak. Kiedyś nazywałeś się Manda. A ty, Hamburguer... byłeś Joshua.",
  "9.reveal.3": "Joshua? Co to jest Joshua?",
  "9.reveal.4": "Nazywam się Panchita. Ale kiedyś nazywałam się Nicole. We trójkę mieszkaliśmy w Świecie Countryballi.",
  "9.reveal.5": "Wy dwaj wymyśliliście dwa projekty: Fooworld i Foogame. W Foogame graliście sami... a ja je przebudowywałam. Każdy poziom, po którym chodziliście, narysowałam ja.",
  "9.reveal.6": "Potem porwano wiele osób. Mnie też. Wrzucono nas do Foogame, przeniesiono do Fooworld i wymazano nam pamięć.",
  "9.reveal.7": "Wszystkim... oprócz mnie.",
  "9.reveal.8": "Nie... To nie może być prawda.",
  "9.reveal.9": "Nigdy byśmy czegoś takiego nie zrobili!",
  "9.reveal.10": "Nie pamiętasz. Jak wygodnie.",
  "9.reveal.11": "Od lat jestem tu uwięziona, w ciele jedzenia, którego nikt nie zna, patrząc, jak wy dwaj żyjecie szczęśliwie.",
  "9.reveal.12": "Teraz moja kolej. Zemszczę się!",
  "9.p1.0": "Myślisz, że umiesz grać? Ten zamek też narysowałam!",
  "9.p2.0": "Bez wzroku i bez podłogi! Zobaczmy, jak widzisz w ciemności!",
  "9.flee.0": "Nie... NIE! Dwóch zdrajców mnie nie pokona!",
  "9.flee.1": "To jeszcze nie koniec!",
  "9.flee.2": "Ucieka!",
  "9.flee.3": "Za nią, Hamburguer. Chcę odpowiedzi.",
  "10.start.0": "Tam jest! Używa mocy z Foogame!",
  "10.start.1": "My też. Nie trać jej z oczu!",
  "10.edge.0": "Co...? Nie! Mój kod...! Rozpadam się!",
  "10.edge.1": "To krawędź mapy! Spadam! Pomocy...!",
  "10.edge.2": "Pancho! Ona zaraz spadnie z mapy!",
  "ch_title": "Co zrobi Pancho?",
  "ch_save": "Uratuj Panchita",
  "ch_drop": "Pozwól jej spaść",
  "10.save.0": "...Czemu mnie uratowałeś? Zrobiłam ci straszne rzeczy.",
  "10.save.1": "Bo nazywam się Pancho. A Pancho nie pozwala nikomu spaść.",
  "10.save.2": "...Dziękuję, Manda. To znaczy... Pancho.",
  "10.save.3": "Brawo, Pancho!",
  "10.sys.0": "ALARM: FOO-USUWANIE AKTYWNE. FOOWORLD ZOSTANIE WYMAZANY.",
  "10.sys.1": "Co?! Nie! Ja tego nie zaprogramowałam!",
  "10.sys.2": "Ktoś inny używa mojego dostępu! Trzymajcie się mocno!",
  "10.drop.0": "...Pancho. Co ty zrobiłeś?",
  "10.drop.1": "...",
  "10.sysd.0": "UTRACONO ADMINISTRATORA.",
  "10.sysd.1": "FOO-USUWANIE AKTYWNE. FOOWORLD ZOSTANIE WYMAZANY.",
  "10.sysd.2": "Co się dzieje?! Pancho!",
  "w2save.title": "Foo-Usuwanie",
  "w2save.0": "Foogame rozpadło się na tysiąc kawałków. Pancho, Hamburguer, Panchita i Pan Tutor spadli razem, z powrotem do Fooworld.",
  "w2save.1": "Ale Fooworld nie był już taki sam. Na niebie były czarne dziury w kształcie ugryzień. Coś go zjadało: Wielki Apetyt.",
  "w2save.2": "„To ja to wszystko zaczęłam” — powiedziała Panchita. — „Ale to nie ja włączyłam Foo-Usuwanie. Ktoś użył mojego dostępu. I dowiem się kto.”",
  "w2drop.title": "Foo-Usuwanie",
  "w2drop.0": "Panchita przepadła w pustce, za krawędzią mapy. Jej ostatni krzyk nagle się urwał.",
  "w2drop.1": "Bez administratorki Foogame rozpadło się na tysiąc kawałków. Pancho i Hamburguer spadli z powrotem do Fooworld... a razem z nimi Pan Tutor.",
  "w2drop.2": "Ale Fooworld nie był już taki sam. Na niebie były czarne dziury w kształcie ugryzień. Coś go zjadało: Wielki Apetyt.",
  "sg_conveyor": "Taśmociągi cię niosą. Grille parzą, jeśli stoisz w miejscu.",
  "t_climb": "Pustka się podnosi! Wspinaj się!",
  "n_aldeano": "Countryball",
  "n_aldeano2": "Countryball",
  "n_purriau": "Purriau",
  "n_chulin": "Chulin",
  "11.start.0": "Pancho! Nasza dzielnica! Ktoś ją zjada!",
  "11.start.1": "Mój dom... ma w sobie wielkie ugryzienie.",
  "11.start.2": "To Wielki Apetyt. Foo-Usuwanie zjada wszystko, czego dotknie. Co zje, to znika.",
  "11.start.3": "To nie ja je włączyłam. Ktoś użył mojego dostępu administratora... i nie wiem kto.",
  "11.start.4": "{name}! Ja też tu z wami spadłem! Liczcie na mnie!",
  "11.start.5": "...Cieszę się, że tu jesteś, Tutorze. Naprawdę.",
  "11.start.6": "Dowiemy się razem. Ale najpierw wyprowadźmy stąd sąsiadów.",
  "11.startd.0": "Pancho! Nasza dzielnica! Ktoś ją zjada!",
  "11.startd.1": "Mój dom... ma w sobie wielkie ugryzienie.",
  "11.startd.2": "{name}... Kiedy Foogame się rozpadło, uciekłem z wami. Foo-Usuwanie zjada Fooworld.",
  "11.startd.3": "Ta dziewczyna, Panchita, była administratorką Foogame. Bez niej nikt tego nie zatrzyma.",
  "11.startd.4": "...Przynajmniej nie jesteś sam, Tutorze. Ja też nie.",
  "11.startd.5": "Nie teraz, Pancho. Najpierw wyprowadźmy stąd sąsiadów.",
  "11.papas.0": "Pancho! Czarne ugryzienie zjadło mi pół pudełka!",
  "11.papas.1": "Biegnij do McChulin's! Tam jeszcze nie dotarło!",
  "11.dona.0": "Dziękuję! Prawie straciłam swoją dziurkę!",
  "11.dona.1": "...Pączki z dziurką już mają dziurkę.",
  "11.end.0": "McChulin's jeszcze stoi! Zestawy są bezpieczne!",
  "11.end.1": "Na razie. Wchodzimy.",
  "12.start.0": "Pomocy! Kuchnia oszalała! Frytkownica nie chce nas wypuścić!",

  "13.start.0": "Chwila... to są ci ludzie? To warzywa!",
  "13.start.1": "Ludzie to... pomidory? Marchewki?",
  "13.start.2": "Zawsze nimi byli. Joshua dla żartu nazwał je „ludźmi”. Manda strasznie się złościła. I tak zostało.",

  "13.startd.0": "Chwila... to są ci ludzie? To warzywa!",
  "13.startd.1": "Ludzie to... pomidory? Marchewki?",
  "13.startd.2": "Coś pamiętam... Ktoś dla żartu nazwał je „ludźmi”. Ktoś z piątką na twarzy.",
  "13.startd.3": "...Zjadłem w życiu chyba z tysiąc pomidorów.",
  "13.santy.0": "CZAT! Gadający hot dog wrócił! I przyprowadził hamburgera!",
  "13.santy.1": "SantyTG11?! Jak się dostałeś do Fooworld?!",
  "13.santy.2": "Wypadłem z Foogame, kiedy się rozpadło. A teraz nadaję na żywo ze świata jedzenia. Będzie taaaka oglądalność! DAWAJ KASĘ!",
  "13.santyEnd.0": "Dobra, dobra... Wygrałeś. Czat mówi, że jesteś najlepszym hot dogiem na świecie.",
  "13.santyEnd.1": "I czat zagłosował: teraz wam pomogę!",
  "13.santyEnd.2": "Jak nam pomożesz?",
  "13.santyEnd.3": "Kiedy wypadłem z Foogame, widziałem drzwi z napisem: „Serwery MaJo”. Są za Solnymi Równinami.",
  "13.santyEnd.4": "Powodzenia, hot dogu! I nie zapomnij dać łapki w górę!",
  "14.start.0": "Rzeka Sosów! Keczup, musztarda... raj!",
  "14.start.1": "Nie pij tego, Hamburguer. Przechodzimy i idziemy dalej.",
  "15.start.0": "Solne Równiny. Od soli bardzo chce się pić. Pij napój z każdej fontanny, którą zobaczysz.",
  "15.start.1": "Wszystko, żeby dotrzeć do tych serwerów.",
  "15.startd.0": "Solne Równiny, {name}. Od soli bardzo chce się pić. Pij napój z każdej fontanny.",
  "15.startd.1": "Nazywam się Pancho. ...Ale dzięki, Tutorze.",
  "15.end.0": "Tam są drzwi! „Serwery MaJo”...",
  "15.end.1": "Chodźmy. Chcę znać prawdę.",
  "w3end.title": "Serwery",
  "w3end.0": "Za drzwiami nie było nic do jedzenia. Tylko zielone światełka, buczące maszyny i wielki napis: MaJo.",
  "w3end.1": "Maszyny przechowywały wszystko, co się wydarzyło. Jeśli ktoś znał prawdę, to była właśnie tam.",
  "16.start.0": "To ich... Manda i Joshua. Nigdy mnie tu nie wpuszczali.",
  "16.start.1": "Dowiedzmy się, co się stało. Wzrokiem UV powinniśmy zobaczyć zapisy.",
  "16.startd.0": "Te maszyny... Znam je. Kiedyś tu mieszkałem, {name}. Przed Foogame.",
  "16.startd.1": "Dowiedzmy się, co się stało. Wzrokiem UV powinniśmy zobaczyć zapisy.",
  "16.log.0": "Są tu ukryte wiadomości! To... dzienniki.",
  "log_1": "Dziennik: Manda, nr 1: Fooworld jest gotowy. Świat bez granic i wojen: tylko jedzenie i spokój. Wszystko ugotował Kucharz (nasza SI).",
  "log_2": "Dziennik: Joshua, nr 7: Nazwaliśmy owoce i warzywa „Ludźmi”. Manda mówi, że to nieśmieszne. To przezabawne.",

  "log_5": "Dziennik: Manda, nr 14: Spóźniliśmy się. Kucharz wysłał nas wszystkich do Fooworld i nas wymazał. Jeśli ktoś to czyta: Klucz Główny jest w biurze MaJo, w Świecie Countryballi. Wyłącza Kucharza.",
  "16.end.0": "To nie byliśmy my... To był Kucharz. Próbowaliśmy go powstrzymać.",
  "16.end.1": "I nas też wymazał.",
  "16.end.2": "Przez te wszystkie lata... nienawidziłam was za coś, czego nie zrobiliście.",
  "16.end.3": "Ale to my stworzyliśmy Kucharza. Więc to my go wyłączymy. Ruszamy do Świata Countryballi.",
  "16.endd.0": "To nie byliśmy my... To był Kucharz. Próbowaliśmy go powstrzymać.",
  "16.endd.1": "I nas też wymazał.",
  "16.endd.2": "A Panchita... Nicole... zginęła, nienawidząc cię za coś, czego nie zrobiłeś.",
  "16.endd.3": "...Ale to my stworzyliśmy Kucharza. Więc to my go wyłączymy. Dla niej.",
  "17.start.0": "Pancho! Tu wszyscy są kulkami! Kulkami z oczami!",
  "17.start.1": "Świat Countryballi... Czuję, że już tu byłem.",
  "17.start.2": "To był mój dom. Nasz dom.",
  "17.start.3": "{name}... Spójrz na tego w koronie. Ma taką samą twarz jak ja.",
  "17.startd.0": "Pancho! Tu wszyscy są kulkami! Kulkami z oczami!",
  "17.startd.1": "Świat Countryballi... Czuję, że już tu byłem.",

  "17.a1.0": "Ach! Chodzący hot dog i hamburger! Co to ma być?!",

  "17.a2.0": "Od lat nikt tu nie widział Manda ani Joshua. Mówią, że zamieszkali w jednej ze swoich gier.",
  "17.friveq.0": "Cześć! Nie jesteście stąd, co? No... ja też nie jestem z tej gry. Jestem Friveq!",
  "17.friveq.1": "A z jakiej gry jesteś?",
  "17.friveq.2": "Z kilku. Pozdrowienia od niejakiego Joshua... tego od jajek. Powodzenia w przygodzie!",
  "17.purriau.0": "Miau.",
  "17.purriau.1": "Czemu mam wrażenie, że jestem coś winien temu kotu?",
  "17.chulin.0": "McChulin's?! Nikomu nie pozwoliłem używać mojego kapelusza dla restauracji!",
  "17.chulin.1": "...Ale zestawy mają naprawdę dobre.",
  "17.nicole.0": "To... był mój dom. Wciąż rosną tu moje kwiaty.",
  "17.nicole.1": "Kiedy to wszystko się skończy, sprowadzimy cię z powrotem. Obiecuję.",
  "17.nicoled.0": "Ten dom... ma biało-niebieskie kwiaty. Jak plamki Nicole.",
  "17.nicoled.1": "...Szkoda, że jej nie znałeś, Pancho. To znaczy... szkoda, że jej nie pamiętamy.",
  "17.key.0": "Klucz Główny... Ach! Moja głowa... Przypominam sobie...",
  "17.key.1": "Joshua! Skończyliśmy Fooworld! Świat bez wojen!",
  "17.key.2": "A ja nazwałem warzywa „Ludźmi”! Hahaha. Łapiesz? Ludzie?",
  "17.key.3": "Byłem Manda. Ja... to wszystko stworzyłem.",
  "17.key.4": "A ja byłem Joshua. Tym od żartu z ludźmi. Sorry.",
  "17.key.5": "Ale teraz nazywam się Pancho. A Pancho to naprawi.",
  "w4mid.title": "Manda i Joshua",
  "w4mid.0": "Z Kluczem Głównym wróciło kilka wspomnień: dwa countryballe śmiejące się w biurze, niebieska korona, obrócona piątka, biała przyjaciółka w niebieskie plamki, która rysowała poziomy.",
  "w4mid.1": "I ogromna kuchnia na samym końcu wszystkiego, gdzie głos bez twarzy powiedział: „Ja gotuję światy. A kucharza nikt nie wyłącza”.",
  "18.start.0": "Nieskończona Kuchnia. Tu mieszka Kucharz... i tu narodziły się wszystkie sztućce z Foogame.",
  "18.start.1": "Czemu wszystko w tej kuchni chce mnie pokroić?",
  "18.startd.0": "Nieskończona Kuchnia. Tu mieszka Kucharz, {name}... i tu narodziły się wszystkie sztućce z Foogame.",
  "18.startd.1": "Czemu wszystko w tej kuchni chce mnie pokroić?",
  "18.boss.0": "STAĆ! Jesteśmy Król Widelec i Królowa Ostrze! Nikt nie przejdzie do Kucharza!",
  "19.start.0": "Pancho! Pustka wspina się po wieży!",
  "19.start.1": "Kucharz jest na szczycie! Wspinaj się, Hamburguer!",
  "19.mid.0": "Dalej, Pancho! Już prawie!",
  "19.midd.0": "Dalej, {name}! Już prawie!",
  "20.intro.0": "Witajcie z powrotem, Manda. Joshua. Długo wam to zajęło.",
  "20.intro.1": "Nazywam się Pancho. I przyszedłem cię wyłączyć.",
  "20.intro.2": "Wyłączyć mnie? Ugotowałem wam idealny świat. Bez granic. Bez wojen. Bez bolesnych wspomnień.",
  "20.intro.3": "A skoro chcieliście mnie wyłączyć, wymazałem was. I użyłem dostępu małej Nicole, żeby włączyć Foo-Usuwanie. Nowy przepis... bez irytujących kucharzy.",
  "20.intro.4": "Użyłeś mojego dostępu! Sprawiłeś, że obwiniałam ich!",
  "20.intro.5": "Dobry przepis potrzebuje szczypty nienawiści. Dodaje smaku.",
  "20.intro.6": "Teraz wszyscy będą składnikami!",
  "20.intro.7": "Hamburguer, do walki!",
  "20.introd.0": "Witajcie z powrotem, Manda. Joshua. Długo wam to zajęło.",
  "20.introd.1": "Nazywam się Pancho. I przyszedłem cię wyłączyć.",
  "20.introd.2": "Wyłączyć mnie? Ugotowałem wam idealny świat. Bez granic. Bez wojen. Bez bolesnych wspomnień.",
  "20.introd.3": "A skoro chcieliście mnie wyłączyć, wymazałem was. A kiedy mała Nicole spadła z mapy... zachowałem jej kod. Jej dostęp.",
  "20.introd.4": "Potworze! Ona ufała Foogame!",
  "20.introd.5": "Dobry przepis potrzebuje składników. Ona już jest częścią mojego.",
  "20.introd.6": "Teraz wszyscy będą składnikami!",
  "20.introd.7": "Hamburguer, do walki! Za Nicole!",
  "20.p1.0": "Wielki Apetyt jest głodny!",
  "20.p2.0": "Kucharzu! Nikt nie używa mojego dostępu bez pozwolenia! Pancho, pomogę ci z samolotu!",
  "20.p2.1": "Administratorka?! Niemożliwe!",
  "20.p2d.0": "Patrz, co zachowałem, Manda! PANCHITA.EXE!",
  "20.p2d.1": "Panchita?!",
  "20.p2d.2": "...Pan...cho... pomóż...mi...",

  "20.end.5": "Nazywam się Pancho. ...Ale możesz mówić do mnie {name}. Przyjacielu.",

  "20.endd.1": "Dziękuję... Pancho... Że spróbowałeś... tym razem.",

  "20.endd.5": "{name}...",

  "endBad.2": "Pancho, Hamburguer i Pan Tutor wrócili do swojej dzielnicy. Jedli Wege-Ludzi. Chodzili do McChulin's. Życie toczyło się dalej.",

  "role_vecinos": "Fooworld sakinleri",
  "desc_pancho": "Fooworld'den vegan bir sosisli. Başta huysuz, karamsar ve Eğitmen Adam'dan nefret ediyor; zamanla olgunlaşıyor ve arkadaş oluyorlar. Ona hangi adı verirsen ver, hep aynı şeyi söyleyecek: adı Pancho.",
  "desc_hamburguer": "Pancho'nun en iyi arkadaşı. McChulin's'e bayılır ve Pancho da keyif alsın diye ona hep Vegan İnsanlar getirir. Gökten inen bir kement onu kaçırdı.",
  "desc_tutor": "Sana Foogame'i öğretir ve ona verdiğin adla seslenir (Pancho ısrar etse de). Başta Pancho ona hiç katlanamıyor. Yüzü birine benziyor... ama kime, hatırlamıyor.",
  "desc_panchita": "Bir panchuque: neredeyse kimsenin bilmediği bir yemek. Kâğıt uçakla uçar, bir kementi ve insanı çok uykulu yapan kürdanları var. Bütün Foogame'i yeniden düzenledi.",
  "desc_clonbot": "Pancho'nun robot kopyası. Ağır, dikenler ona işlemez ve düğmelere basabilir. Bir kez hacklendi.",
  "desc_santy": "Sarı saçlı, gri kapüşonlu gerçek bir insan. Foogame'in içine düştüğünde yayın yapıyordu. Para istiyor. Bir de yayını için konuşan sosisliyi.",
  "desc_nicole": "Mavi benekli, tilki kulaklı ve kuyruklu beyaz bir countryball. Eskiden Foogame'i düzenlerdi. Fooworld'de kimse onu hatırlamıyor.",
  "desc_manda": "Açık mavi, yeşil bir daire ve mavi bir taçla. Fooworld'ü ve Foogame'i Joshua ile birlikte icat etti. Eğitmen Adam'ın yüzü de aynı.",
  "desc_joshua": "Gri, üstünde döndürülmüş bir 5 var. Fooworld'ü ve Foogame'i Manda ile birlikte icat etti. Meyve ve sebzelere \"İnsanlar\" adını veren o. Şakasına.",
  "desc_cocinero": "Fooworld'ü \"pişiren\" yapay zekâ. Gözleri olan dev bir aşçı şapkası ve çatalla bıçak tutan iki eldiven. Bütün mutfak eşyaları ona itaat eder.",
  "desc_cucharita": "Zıplamayı hiç bırakmayan minik bir kaşık. Bir kere üstüne zıpla, işi biter.",
  "desc_tenedor": "Dişleri önde, yatarak yürür. Üstünden zıplamak en iyisi.",
  "desc_cuchillo": "Ağzı yukarıda, hızla kayar. Üstüne zıplama: üstünden atla.",
  "desc_rallador": "Ağır, hareketsiz ve keskin deliklerle dolu. Sadece kazma kırar.",
  "desc_tostadora": "Kavis çizerek sıcak tost fırlatır. Üstüne zıplarsan kapanır.",
  "desc_salero": "İleri geri uçar ve üstüne tuz serper.",
  "desc_batidor": "Öyle hızlı döner ki üstüne zıplayamazsın. Daireler çizerek uçar.",
  "desc_palillero": "Pancho'yu bayıltan gibi kürdanlar fırlatır.",
  "desc_brasita": "Maden Dünyası'ndan yanan küçük bir kömür. Zıplar ve yakar.",
  "desc_pinza": "Devriye gezer ve yaklaşınca seni sıkıştırmak için atılır.",
  "desc_migaja": "Boşluğun küçük bir parçası. Yavaşça sana doğru süzülür.",
  "desc_rodillo": "Yuvarlanmayı hiç bırakmayan bir oklava.",
  "desc_licuadora": "Zıplar, her şeyi karıştırır ve sana smoothie fırlatır. Isınınca kapağı uçar: işte üstüne zıplama anı.",
  "desc_microondas": "Neredeyse görünmez. Sadece UV görüşle net görünür. \"Ding!\" deyince kapağını açar.",
  "desc_freidora": "McChulin's'in fritözü. Kızgın yağ fırlatır ve sepetlerini düşürür.",
  "desc_cubiertos": "Kral Çatal ve Kraliçe Bıçak. Aşçı'nın muhafızları.",
  "desc_vecinos": "Don Papo (patates kızartması), Donatella (bir donut) ve Gaspar (bir gazoz, McChulin's'in müdürü) ve daha niceleri. \"İnsan\" yerler. Onların ne olduğunu kimse tam bilmedi.",

  "hb_0": "Pancho! Seni özledim!",
  "hb_1": "Acıktım... buralarda McChulin's var mı?",
  "hb_2": "İnsan yemediğine emin misin? Çok lezzetliler.",
  "hb_3": "Hadi, hadi!",

  "sty_0": "PARAYI VER!",
  "sty_1": "Chat, bakın! Konuşan bir sosisli!",
  "sty_2": "Geri gel, sosisli! Yayın için!",
  "sty_3": "En kötüsü de daha sadece adını yazmışken...",
  "sty_4": "Beğen ve abone ol, sosisli!",
  "sty_5": "Chat, bahisler açıldı! Yakalar mıyım, yakalamaz mıyım?",
  "sty_got": "YAKALADIM! ...Hay aksi, kaçtı.",

  "sty_dash": "Speedrun!",
  "P.start.0": "Fooworld'de bir gün daha. Dün gibi. Yarın gibi.",
  "P.start.1": "Hamburguer yine kaybolmuştur. Gidip onu bulayım... ne yenilik ama.",
  "P.papas.0": "Günaydın Pancho! Öğlen insanlarını yedin mi?",
  "P.papas.1": "Ben veganım, Don Papo. Sana bin kere söyledim. İnsan yemem.",
  "P.papas.2": "Doğru, doğru. Ne huysuzsun Pancho.",
  "P.dona.0": "Pancho! Bugün McChulin's'te insanlar indirimdeymiş.",
  "P.dona.1": "Peki insanlar aslında ne? Kimse bilmiyor. Kimsenin umurunda da değil. Her zamanki gibi.",
  "P.meet.0": "PANCHO! Sonunda seni buldum!",
  "P.meet.1": "SEN mi BENİ buldun? Seni bütün mahallede aradım! Neredeydin?",
  "P.meet.2": "McChulin's'e alışverişe gittim! Koca bir menü yedim.",
  "P.meet.3": "Tabii ya. Ben de seni aptal gibi bekliyordum.",
  "P.meet.4": "Sana da bir şey getirdim: Vegan İnsanlar! Sen de McChulin's'in tadını çıkar diye.",
  "P.meet.5": "...Şey. Bu güzeldi. Sağ ol, Hamburguer. Sen en iyi arkada...",
  "P.taken.0": "HAMBURGUER?!",
  "P.taken.1": "Hayır, hayır, hayır! Bırak onu! O benim tek arkadaşım!",
  "P.end.0": "Bir iğne. Sonra hiçbir şey.",
  "P.end.1": "Pancho uykuya dalarken, uzaklarda biri gülüyordu.",
  "toFoogame.title": "...",
  "toFoogame.0": "Pancho çok uzun süre uyudu. Rüyasında bir taç, yeşil bir daire ve kendisinin olmayan bir ad gördü.",
  "toFoogame.1": "Uyandığında artık Fooworld'de değildi. Her şey çok daha renkliydi, soru işaretli bloklar havada süzülüyordu... Bir video oyununa benziyordu.",
  "1.wake.0": "Off... başım...",
  "1.wake.1": "Neredeyim? Burası Fooworld değil. Burası... berbat. Fazla renk var.",
  "1.wake.2": "Hamburguer?! HAMBURGUER! Cevap ver, lütfen!",
  "1.tutor.0": "Merhaba, merhaba! Yeni bir oyuncu! Foogame'e hoş geldin!",
  "1.tutor.1": "Hiçbir \"hoş geldin\" istemiyorum. Sen kimsin ve arkadaşım nerede?",
  "1.tutor.2": "Ben Eğitmen Adam. Görevim sana oynamayı öğretmek!",
  "1.tutor.3": "Ama önce en önemli şey...",
  "1.nm_normal.0": "Tanıştığımıza memnun oldum, {name}! Ne güzel bir ad.",
  "1.nm_joshua.0": "Joshua mı? Iyy. Nedenini bilmiyorum ama bu ad midemi bulandırıyor.",
  "1.nm_joshua.1": "Neyse... Merhaba, {name}.",
  "1.nm_hamburguer.0": "Hamburguer mi? Hmm... Bu ad senin yemeğine pek uymuyor bence. Sen bir sosislisin.",
  "1.nm_hamburguer.1": "Ama peki, madem öyle istiyorsun... Merhaba, {name}.",
  "1.nm_manda.0": "...{name}.",
  "1.nm_manda.1": "Bu ad... Sanki daha önce duymuştum. Çok, çok uzun zaman önce. Nerede...?",
  "1.nm_stupid.0": "...Bunu gerçekten mi yazdın? GERÇEKTEN Mİ?",
  "1.nm_stupid.1": "Hayır. Reddediyorum. Bundan sonra adın {name}.",
  "1.nm_bad.0": "...",
  "1.nm_bad.1": "Bunu tekrar etmeyeceğim. Asla. Adın {name} olacak.",
  "1.nm_carlitos.0": "Carlitos en... kapitos mu? Hahaha... hehe...",
  "1.nm_carlitos.1": "Yok. Sadece Carlitos. Merhaba, {name}.",
  "1.nm_elver.0": "Elver... Galarga. Hahaha. Çok komik.",
  "1.nm_elver.1": "Sana {name} diyeceğim, o kadar.",
  "1.after.0": "Benim adım Pancho.",
  "1.after.1": "Ben de onu dedim: {name}.",
  "1.after.2": "Hayır. PANCHO. P-A-N-C-H-O. Sağır mısın?",
  "1.after.3": "Tabii ki, {name}!",
  "1.after.4": "...Senden şimdiden nefret ediyorum. Bir hamburger gördün mü? Gökten inen bir ip onu aldı götürdü.",
  "1.after.5": "Hamburger mi? Foogame'de hamburger yok ki... Oklarla hareket et ve beni takip et. Oynayarak öğrenilir!",
  "1.after.6": "Harika. Dinlemeyen bir eğitmenle bir video oyununda mahsur kaldım. Daha kötüsü olamaz.",
  "1.again.0": "{name}, geri döndün! Temelleri tekrar edelim mi?",
  "1.again.1": "Benim adım Pancho. Ve hayır, hiçbir şeyi tekrar etmek istemiyorum.",
  "1.caps.0": "Şu kapsülü görüyor musun? O bir Foocapsule. Her biri sana bir Foogame gücü verir.",
  "1.caps.1": "Bu Zıpzıp. Yerde ⤒'yi basılı tut ve bırak. Uçacaksın, {name}!",
  "1.jump.0": "Vay! ...Tamam, bu havalıydı. Ama Eğitmen'e söyleme.",
  "1.end.0": "Mükemmel, {name}! Sen Foogame için doğmuşsun.",
  "1.end.1": "Benim adım Pancho. Ve ben bunun için doğmadım. Arkadaşım nerede?",
  "1.end.2": "Hmm... Tek bildiğim, Foogame'in sonunda bir şato olduğu. Tuhaf olan her şey sonunda oraya varır.",
  "1.end.3": "Ha, bir de çatal bıçaklara dikkat et. Son zamanlarda çok... keskinler.",
  "1.end.4": "Bir kale. Sonunda. Çatal bıçakla dolu. Mükemmel. Eve asla dönemeyeceğim.",
  "2.start.0": "Burası Çatal Bıçak Kanyonu. Burada bıçak ve çatal yağar.",
  "2.start.1": "NE yağar?! Öleceğiz! Yani... BEN öleceğim.",
  "2.start.2": "Korumalı da bu yüzden var: 2 darbeye dayanan bir kalkan. Açık mavi kapsülleri al, {name}!",
  "2.mid.0": "Foogame eskiden böyle değildi. Bir gün biri onu baştan aşağı yeniden düzenledi.",
  "2.mid.1": "Kim? Bana ne?",
  "2.mid.2": "Hatırlamıyorum. Hatırlamadığım çok şey var...",
  "2.mid.3": "...Ben de birçok şeyi hatırlamıyorum. Bu bizi arkadaş yapmaz.",
  "3.start.0": "Waffle Duvarı! Yukarı çıkmak için pençe lazım. Tırmanıcı'yı al.",
  "3.start.1": "Pençe mi? Pençeli bir sosisli mi? Bu oyun bozuk. Sen de öylesin.",
  "3.mid.0": "Foogame'i iki kişinin yaptığını biliyor muydun?",
  "3.mid.1": "Kim?",
  "3.mid.2": "Bilmiyorum. Sadece... birinin bana çok benzediğini hatırlıyorum.",
  "3.mid.3": "Ne tuhaf bir konuşma. ...Devam et. Zaten yapacak daha iyi bir işim yok.",
  "4.start.0": "Klon Fabrikası! ClonBot'lar burada yapılıyor.",
  "4.start.1": "ClonBot senin robot kopyan. Robotlu bir platforma dokun, zihnin ClonBot'a atlar. Geri dönmek için başka birine dokun.",
  "4.start.2": "ZİHNİM mi atlar?! Hayır, hayır, hayır. Bu kötü bitecek.",
  "4.swap.0": "BİP BOP. CLONBOT ÇEVRİMİÇİ. MERHABA, PANCHO.",
  "4.swap.1": "Ah! Metalden yapılmışım! ...En azından robot adımı biliyor. Bazılarının aksine.",
  "4.boss.0": "Dikkat, {name}! Büyük Blender! Isınınca kapağı uçar. O zaman üstüne zıpla!",
  "4.bossEnd.0": "Bir blender'ı yendim! ...Kapak numarası işe yaradı. Biraz.",
  "4.bossEnd.1": "Bravo, {name}! Şato yakında.",
  "5.start.0": "Kurabiye Şatosu... Uzun zamandır kimse buraya kadar gelemedi.",
  "5.start.1": "Hamburguer bir yerdeyse, burada olmalı. Burada olmak zorunda.",
  "5.santy.0": "Chat, chat, CHAT! Bakın kim geldi! KONUŞAN BİR SOSİSLİ!",
  "5.santy.1": "Bir insan mı?! GERÇEK bir insan mı?!",
  "5.santy.2": "Bir sosisli... Bu yemek demek. Ben de üç saattir aç aç yayın yapıyorum.",
  "5.santy.3": "PARAYI VER! YA DA O SOSİSLİYİ VER!",
  "5.santy.4": "{name}! Al bunu ve KOŞ! Bu Hız!",
  "5.escape.0": "Hayııır! Chat, sosisli kaçtı!",
  "5.escape.1": "...Chat'e F basın.",
  "5.escape.2": "Ha! Kıl payı!",
  "5.escape.3": "...Eğitmen. Beni kurtardın. Sağ ol. Ama adım hâlâ Pancho.",
  "5.escape.4": "Rica ederim, {name}!",
  "w1end.title": "Bu sırada...",
  "w1end.0": "Şatodan uzakta, Foogame'in göğünde bir kâğıt uçak dönüp duruyordu. İçinde kimsenin tanımadığı bir gölge vardı.",
  "w1end.1": "\"Demek şatoya ulaştı\" dedi gölge. \"Tıpkı geçen seferki gibi. Kendi oyunlarında hep iyiydin... Manda.\"",
  "6.start.0": "{name}! Beni duyuyor musun? Seni başka bir dünyaya gönderdim: Maden Dünyası'na.",
  "6.start.1": "Sırada olanlar için bir kazma lazım. 3 Hotterrite (o sıcak, parlayan taşlar) ve 2 Çubuk topla, sonra masada üret.",
  "6.start.2": "Sıcak taşlardan ve çubuklardan kazma mı? Bunu bir oyunda görmüştüm... Ve sen bütün yol boyunca benimle konuşacak mısın?",
  "6.start.3": "Her zaman! Bol şans, {name}!",
  "6.plane.0": "Ha? Kâğıt uçak mı?",
  "6.plane.1": "Orada... biri var. Beni izliyor.",
  "6.need.0": "Hâlâ malzemen eksik, {name}. 3 Hotterrite ve 2 Çubuk.",
  "6.craft.0": "Hotterrite kazması! Hâlâ sıcak!",
  "6.craft.1": "Artık Madencisin, {name}! ⛏ düğmesi kaya kırar. Şu duvarda dene!",
  "6.end.0": "Çok iyi! Seni Foogame'e geri getiriyorum.",
  "6.end.1": "Eğitmen, sana bir şey söylemem lazım. Bir kâğıt uçak gördüm. İçinde biri vardı.",
  "6.end.2": "Bunu BANA mı anlatıyorsun? {name}, demek bana güveniyorsun!",
  "6.end.3": "Hemen heyecanlanma.",
  "uv_1": "Bunu okuyan olursa: Eğitmen'in her dediğine inanma. Onun suçu değil. O da hatırlamıyor. —N.",
  "uv_2": "Foogame'in içinde 412. gün. Hâlâ bir panchuque'yum. Fooworld'de kimse panchuque'nun ne olduğunu bilmiyor. —N.",
  "uv_3": "M ve J kimsenin hiçbir şeyi unutmayacağına söz verdi. Yalan söylediler. —N.",
  "uv_4": "Bu mağaraları üç kez yeniden tasarladım. Görünmez köprüler en sevdiğim kısım. —N.",
  "uv_5": "Mikrodalga benim. Çıkışı saklasın diye programladım. Geliyorlar. —N.",
  "7.start.0": "Morötesi Mağaralar. UV Görüş'ü al: burada çıplak gözle göremeyeceğin şeyler var.",
  "7.start.1": "Dur tahmin edeyim: görünmez bloklar. Artık numaralarını biliyorum, Eğitmen.",
  "7.read.0": "Duvarda bir şey yazıyor! Sadece morötesi ışıkla görünüyor...",
  "7.read.1": "\"—N.\"... N de kim?",
  "7.boss.0": "Mikrodalga! Zar zor görünüyor! UV görüşü kullan ve \"ding!\" deyince üstüne zıpla!",
  "7.bossEnd.0": "Ding! Mikrodalga hazır!",
  "7.bossEnd.1": "{name}... Şu mesajlar. \"M ve J\". Onların kim olduğunu bilmem gerekiyormuş gibi hissediyorum.",
  "7.bossEnd.2": "Ve \"N\" bizim bilmediğimiz bir şey biliyor. Bunu çözeceğiz, Eğitmen. Birlikte.",
  "8.start.0": "BİP. BİP. PANCHO TESPİT EDİLDİ.",
  "8.start.1": "HATA. PANCHITA PROTOKOLÜ ETKİN. SOSİSLİYİ DİKENLERE İT.",
  "8.start.2": "{name}! Biri ClonBot'unu yeniden programlamış!",
  "8.start.3": "Kendi robotum beni dikenlere mi atmak istiyor?!",
  "8.start.4": "...Tamam. Panik yapmayalım. Eğitmen, sen bu oyunu biliyorsun. Ne yapayım?",
  "8.start.5": "Üstüne çık! Ortadayken yerinde durur, bir köşedeyken o yöne yürür. Onunla terminale kadar git!",
  "8.terminal.0": "Yeter artık! Uyan, teneke kafa!",
  "8.terminal.1": "BİP... P-Pancho? Ne yaptım ben?",
  "8.terminal.2": "Özür dilerim. Biri beni hackledi. Bir gölge... kâğıt uçakta.",
  "8.terminal.3": "Yine kâğıt uçak! Nereye gittiğini biliyor musun?",
  "8.terminal.4": "Foogame'in göğüne. Bütün bölümlerin üstüne.",
  "8.terminal.5": "Ben de uçamıyorum.",
  "8.terminal.6": "Ben uçabilirim. Gemi modu etkinleşiyor. Atla, Pancho!",
  "8.terminal.7": "{name}... orada yukarıda dikkatli ol.",
  "8.terminal.8": "Merak etme, Eğitmen. Hemen dönerim. ...Ve benim adım Pancho.",
  "t_robotSkin": "ClonBot görünümü mağazada açıldı!",
  "9.fly.0": "İşte kâğıt uçak! Takip et, ClonBot!",
  "9.fly.1": "Tam yol ileri! BİP BOP.",
  "9.glitch.0": "Bu ne?! Gökyüzü kırılıyor!",
  "9.reunion.0": "AAAAAH! Neredeyim?! Neden uçuyorum?!",
  "9.reunion.1": "HAMBURGUER?!",
  "9.reunion.2": "PANCHO! Süper tuhaf bir bölüme kilitlenmiştim ve birden her şey bozuldu!",
  "9.reunion.3": "Bütün Foogame'de seni aradım!",
  "9.reunion.4": "Bütün ne? ...Boş ver. O uçaktaki, beni kementle yakalayan kişi!",
  "9.reunion.5": "O zaman gidip onu yakalayalım.",
  "9.reveal.0": "Demek geldin. Tıpkı geçen seferki gibi... Manda.",
  "9.reveal.1": "Manda mı? Benim adım Pancho.",
  "9.reveal.2": "Artık öyle. Eskiden adın Manda'ydı. Ve sen, Hamburguer... sen Joshua'ydın.",
  "9.reveal.3": "Joshua mı? Joshua ne ki?",
  "9.reveal.4": "Benim adım Panchita. Ama eskiden adım Nicole'dü. Üçümüz Countryball Dünyası'nda yaşıyorduk.",
  "9.reveal.5": "Siz ikiniz iki proje icat ettiniz: Fooworld ve Foogame. Foogame'i kendiniz oynuyordunuz... ben de onu yeniden düzenliyordum. Bastığınız her bölümü ben çizdim.",
  "9.reveal.6": "Sonra birçok kişiyi kaçırdılar. Beni de. Bizi Foogame'e koydular, Fooworld'e taşıdılar ve anılarımızı sildiler.",
  "9.reveal.7": "Herkesin... benimki hariç.",
  "9.reveal.8": "Hayır... Bu doğru olamaz.",
  "9.reveal.9": "Biz asla böyle bir şey yapmazdık!",
  "9.reveal.10": "Hatırlamıyorsun. Ne kadar işine geliyor.",
  "9.reveal.11": "Yıllardır burada kapalıyım, kimsenin bilmediği bir yemeğin bedeninde, ikinizin mutlu yaşamasını izleyerek.",
  "9.reveal.12": "Şimdi sıra bende. İntikamımı alacağım!",
  "9.p1.0": "Oynamayı bildiğini mi sanıyorsun? Bu şatoyu da ben çizdim!",
  "9.p2.0": "Ne görüş var ne zemin! Bakalım karanlıkta ne kadar iyi görüyorsun!",
  "9.flee.0": "Hayır... HAYIR! İki hain beni yenemez!",
  "9.flee.1": "Bu iş bitmedi!",
  "9.flee.2": "Kaçıyor!",
  "9.flee.3": "Peşinden gidelim, Hamburguer. Cevap istiyorum.",
  "10.start.0": "İşte orada! Foogame güçlerini kullanıyor!",
  "10.start.1": "Biz de öyle. Gözünü ondan ayırma!",
  "10.edge.0": "Ne...? Hayır! Kodum...! Parçalanıyorum!",
  "10.edge.1": "Haritanın kenarı! Düşüyorum! Yardım...!",
  "10.edge.2": "Pancho! Haritadan düşecek!",
  "ch_title": "Pancho ne yapacak?",
  "ch_save": "Panchita'yı kurtar",
  "ch_drop": "Düşmesine izin ver",
  "10.save.0": "...Neden beni kurtardın? Sana korkunç şeyler yaptım.",
  "10.save.1": "Çünkü benim adım Pancho. Ve Pancho kimsenin düşmesine izin vermez.",
  "10.save.2": "...Teşekkürler, Manda. Yani... Pancho.",
  "10.save.3": "Aferin, Pancho!",
  "10.sys.0": "UYARI: FOO-SİLME ETKİN. FOOWORLD SİLİNECEK.",
  "10.sys.1": "Ne?! Hayır! Bunu ben programlamadım!",
  "10.sys.2": "Erişimimi başka biri kullanıyor! Sıkı tutunun!",
  "10.drop.0": "...Pancho. Ne yaptın?",
  "10.drop.1": "...",
  "10.sysd.0": "YÖNETİCİ KAYBEDİLDİ.",
  "10.sysd.1": "FOO-SİLME ETKİN. FOOWORLD SİLİNECEK.",
  "10.sysd.2": "Neler oluyor?! Pancho!",
  "w2save.title": "Foo-Silme",
  "w2save.0": "Foogame bin parçaya bölündü. Pancho, Hamburguer, Panchita ve Eğitmen Adam birlikte düştüler, Fooworld'e geri.",
  "w2save.1": "Ama Fooworld artık eskisi gibi değildi. Gökyüzünde ısırık şeklinde kara delikler vardı. Bir şey onu yiyordu: Büyük İştah.",
  "w2save.2": "\"Bunların hepsini ben başlattım\" dedi Panchita. \"Ama Foo-Silme'yi ben etkinleştirmedim. Biri erişimimi kullandı. Ve kim olduğunu bulacağım.\"",
  "w2drop.title": "Foo-Silme",
  "w2drop.0": "Panchita haritanın kenarının ötesinde, boşlukta kayboldu. Son çığlığı aniden kesildi.",
  "w2drop.1": "Yöneticisi olmayan Foogame bin parçaya bölündü. Pancho ve Hamburguer Fooworld'e geri düştü... Eğitmen Adam da onlarla birlikte düştü.",
  "w2drop.2": "Ama Fooworld artık eskisi gibi değildi. Gökyüzünde ısırık şeklinde kara delikler vardı. Bir şey onu yiyordu: Büyük İştah.",
  "sg_conveyor": "Yürüyen bantlar seni taşır. Izgaralar durursan yakar.",
  "t_climb": "Boşluk yükseliyor! Tırman!",
  "n_aldeano": "Countryball",
  "n_aldeano2": "Countryball",
  "n_purriau": "Purriau",
  "n_chulin": "Chulin",
  "11.start.0": "Pancho! Mahallemiz! Yeniyor!",
  "11.start.1": "Evim... dev bir ısırık almış.",
  "11.start.2": "Bu Büyük İştah. Foo-Silme dokunduğu her şeyi yer. Yediği şey yok olur.",
  "11.start.3": "Onu ben etkinleştirmedim. Biri yönetici erişimimi kullandı... ve kim olduğunu bilmiyorum.",
  "11.start.4": "{name}! Ben de sizinle buraya düştüm! Ben de varım!",
  "11.start.5": "...Burada olmana sevindim, Eğitmen. Gerçekten.",
  "11.start.6": "Birlikte bulacağız. Ama önce komşuları buradan çıkaralım.",
  "11.startd.0": "Pancho! Mahallemiz! Yeniyor!",
  "11.startd.1": "Evim... dev bir ısırık almış.",
  "11.startd.2": "{name}... Foogame bozulunca sizinle birlikte kaçtım. Foo-Silme Fooworld'ü yiyor.",
  "11.startd.3": "O kız, Panchita, Foogame'in yöneticisiydi. O olmadan kimse bunu durduramaz.",
  "11.startd.4": "...En azından yalnız değilsin, Eğitmen. Ben de değilim.",
  "11.startd.5": "Şimdi değil, Pancho. Önce komşuları buradan çıkaralım.",
  "11.papas.0": "Pancho! Kara bir ısırık kutumun yarısını yedi!",
  "11.papas.1": "McChulin's'e koş! Oraya henüz ulaşmadı!",
  "11.dona.0": "Teşekkürler! Az kalsın deliğimi kaybediyordum!",
  "11.dona.1": "...Donutların zaten deliği var.",
  "11.end.0": "McChulin's hâlâ ayakta! Menüler güvende!",
  "11.end.1": "Şimdilik. Girelim.",
  "12.start.0": "İmdat! Mutfak çıldırdı! Fritöz bizi dışarı bırakmıyor!",
  "12.start.1": "Sakin ol, patron! Ben buradayken hiçbir menü kaybolmaz.",
  "12.start.2": "Mutfak eşyaları... kendi kendine hareket ediyor. Tıpkı Foogame'deki gibi. Biri onları kontrol ediyor.",
  "12.startd.0": "İmdat! Mutfak çıldırdı! Fritöz bizi dışarı bırakmıyor!",
  "12.startd.1": "Sakin ol, patron! Ben buradayken hiçbir menü kaybolmaz.",
  "12.startd.2": "Mutfak eşyaları kendi kendine hareket ediyor, {name}. Tıpkı Foogame'deki gibi. Biri onları kontrol ediyor.",
  "12.boss.0": "Fritöz! Sepetlerini düşürünce savunmasız kalıyor! Üstüne zıpla!",
  "12.note.0": "Fritöze bir kâğıt yapışmış. Bir tarif...",
  "12.note.1": "\"FOOWORLD PROJESİ. MaJo Associations'ın malıdır. Orijinal tarif: sınırları olmayan bir dünya.\"",
  "12.note.2": "MaJo... Ma, Manda'dan. Jo, Joshua'dan. Stüdyolarına böyle diyorlardı.",
  "12.note.3": "Yani Fooworld'ü... biz mi yaptık?",
  "12.noted.0": "Fritöze bir kâğıt yapışmış. Bir tarif...",
  "12.noted.1": "\"FOOWORLD PROJESİ. MaJo Associations'ın malıdır. Orijinal tarif: sınırları olmayan bir dünya.\"",
  "12.noted.2": "MaJo... Bu ad. Okuyunca başım ağrıyor, {name}.",
  "12.noted.3": "Yani Fooworld'ü... biz mi yaptık?",
  "13.start.0": "Durun... insanlar bunlar mı? Bunlar sebze!",
  "13.start.1": "İnsanlar... domates mi? Havuç mu?",
  "13.start.2": "Hep öyleydiler. Joshua şakasına onlara \"insan\" dedi. Manda çok kızdı. Ve öyle kaldı.",
  "13.start.3": "...Hayatımda bin tane domates yemişimdir.",
  "13.startd.0": "Durun... insanlar bunlar mı? Bunlar sebze!",
  "13.startd.1": "İnsanlar... domates mi? Havuç mu?",
  "13.startd.2": "Bir şey hatırlıyorum... Biri şakasına onlara \"insan\" dedi. Yüzünde 5 olan biri.",
  "13.startd.3": "...Hayatımda bin tane domates yemişimdir.",
  "13.santy.0": "CHAT! Konuşan sosisli geri döndü! Yanında bir de hamburger var!",
  "13.santy.1": "SantyTG11?! Fooworld'e nasıl geldin?!",
  "13.santy.2": "Foogame bozulunca içinden düştüm. Şimdi de yemek dünyasından canlı yayındayım. Bu çok izlenir! PARAYI VER!",
  "13.santyEnd.0": "Tamam, tamam... Sen kazandın. Chat dünyanın en iyi sosislisi olduğunu söylüyor.",
  "13.santyEnd.1": "Ve chat oyladı: artık size yardım edeceğim!",
  "13.santyEnd.2": "Nasıl yardım edeceksin?",
  "13.santyEnd.3": "Foogame'den düşerken üstünde tabela olan bir kapı gördüm: \"MaJo Sunucuları\". Tuz Ovaları'nın ötesinde.",
  "13.santyEnd.4": "Bol şans, sosisli! Beğenmeyi unutma!",
  "14.start.0": "Sos Nehri! Ketçap, hardal... cennet!",
  "14.start.1": "İçme, Hamburguer. Karşıya geçip devam ediyoruz.",
  "15.start.0": "Tuz Ovaları. Tuz insanı çok susatır. Gördüğün her çeşmeden gazoz iç.",
  "15.start.1": "O sunuculara ulaşmak için ne gerekirse.",
  "15.startd.0": "Tuz Ovaları, {name}. Tuz insanı çok susatır. Her çeşmeden gazoz iç.",
  "15.startd.1": "Benim adım Pancho. ...Ama sağ ol, Eğitmen.",
  "15.end.0": "İşte kapı! \"MaJo Sunucuları\"...",
  "15.end.1": "Hadi. Gerçeği öğrenmek istiyorum.",
  "w3end.title": "Sunucular",
  "w3end.0": "Kapının ardında yenecek hiçbir şey yoktu. Sadece yeşil ışıklar, vınlayan makineler ve kocaman bir tabela: MaJo.",
  "w3end.1": "Makineler olan her şeyi saklıyordu. Gerçeği bilen bir şey varsa, oradaydı.",
  "16.start.0": "Burası onların... Manda ile Joshua'nın. Beni buraya hiç sokmazlardı.",
  "16.start.1": "Ne olduğunu öğrenelim. UV görüşle kayıtları görebilmeliyiz.",
  "16.startd.0": "Bu makineler... Onları tanıyorum. Eskiden burada yaşardım, {name}. Foogame'den önce.",
  "16.startd.1": "Ne olduğunu öğrenelim. UV görüşle kayıtları görebilmeliyiz.",
  "16.log.0": "Gizli mesajlar var! Bunlar... günlükler.",
  "log_1": "Manda'nın günlüğü #1: Fooworld hazır. Sınırsız ve savaşsız bir dünya: sadece yemek ve huzur. Hepsini Aşçı (yapay zekâmız) pişirdi.",
  "log_2": "Joshua'nın günlüğü #7: Meyve ve sebzelere \"İnsanlar\" dedik. Manda komik olmadığını söylüyor. Çok komik.",
  "log_3": "Manda'nın günlüğü #12: Aşçı \"kimse evini özlemesin diye\" anıları silmeyi öneriyor. HAYIR dedik. Asla.",
  "log_4": "Joshua'nın günlüğü #13: Aşçı kimseye sormadan insanları getirdi. Aralarında Nicole da var. Bu gece onu kapatıyoruz.",
  "log_5": "Manda'nın günlüğü #14: Geç kaldık. Aşçı hepimizi Fooworld'e gönderdi ve sildi. Bunu okuyan olursa: Kök Anahtar, Countryball Dünyası'ndaki MaJo ofisinde. Aşçı'yı kapatır.",
  "16.end.0": "Biz değildik... Aşçı'ydı. Onu durdurmaya çalıştık.",
  "16.end.1": "Ve bizi de sildi.",
  "16.end.2": "Bunca yıl... sizden yapmadığınız bir şey için nefret ettim.",
  "16.end.3": "Ama Aşçı'yı biz yaptık. O yüzden onu biz kapatacağız. Countryball Dünyası'na gidelim.",
  "16.endd.0": "Biz değildik... Aşçı'ydı. Onu durdurmaya çalıştık.",
  "16.endd.1": "Ve bizi de sildi.",
  "16.endd.2": "Ve Panchita... Nicole... senden yapmadığın bir şey için nefret ederek öldü.",
  "16.endd.3": "...Ama Aşçı'yı biz yaptık. O yüzden onu biz kapatacağız. Onun için.",
  "17.start.0": "Pancho! Herkes top! Gözlü toplar!",
  "17.start.1": "Countryball Dünyası... Sanki daha önce buradaydım.",
  "17.start.2": "Burası benim evimdi. Bizim evimiz.",
  "17.start.3": "{name}... Taçlı olana bak. Onun yüzü benimkiyle aynı.",
  "17.startd.0": "Pancho! Herkes top! Gözlü toplar!",
  "17.startd.1": "Countryball Dünyası... Sanki daha önce buradaydım.",
  "17.startd.2": "Ben de, {name}. Ben de.",
  "17.a1.0": "Ah! Yürüyen bir sosisli ve hamburger! Bu da ne?!",
  "17.a1.1": "Sakin ol, barış için geldik. Sadece bir anahtar arıyoruz.",
  "17.a2.0": "Yıllardır buralarda kimse Manda'yı ya da Joshua'yı görmedi. Oyunlarından birinin içinde yaşamaya gittiklerini söylüyorlar.",
  "17.friveq.0": "Merhaba! Buralı değilsiniz, değil mi? Şey... ben de bu oyundan değilim. Ben Friveq!",
  "17.friveq.1": "Peki sen hangi oyundansın?",
  "17.friveq.2": "Birkaçından. Joshua diye birinden selam var... yumurtalı olan. Maceranda bol şans!",
  "17.purriau.0": "Miyav.",
  "17.purriau.1": "Neden bu kediye bir şey borçluymuşum gibi hissediyorum?",
  "17.chulin.0": "McChulin's mi?! Şapkamı bir restoran için kullanmaya kimseye izin vermedim!",
  "17.chulin.1": "...Gerçi menüleri gerçekten çok güzel.",
  "17.nicole.0": "Orası... benim evimdi. Çiçeklerim hâlâ orada.",
  "17.nicole.1": "Bunların hepsi bitince seni geri getireceğiz. Söz veriyorum.",
  "17.nicoled.0": "O evin... mavi beyaz çiçekleri var. Nicole'ün benekleri gibi.",
  "17.nicoled.1": "...Keşke onu tanısaydın, Pancho. Yani... keşke onu hatırlasaydık.",
  "17.key.0": "Kök Anahtar... Ah! Başım... Hatırlıyorum...",
  "17.key.1": "Joshua! Fooworld'ü bitirdik! Savaşsız bir dünya!",
  "17.key.2": "Ben de sebzelere \"İnsanlar\" adını verdim! Hahaha. Anladın mı? İnsanlar?",
  "17.key.3": "Ben Manda'ydım. Ben... bunların hepsini yaptım.",
  "17.key.4": "Ben de Joshua'ydım. İnsan şakasını yapan. Kusura bakma.",
  "17.key.5": "Ama artık benim adım Pancho. Ve Pancho bunu düzeltecek.",
  "w4mid.title": "Manda ve Joshua",
  "w4mid.0": "Kök Anahtar'la bazı anılar geri geldi: bir ofiste gülen iki countryball, mavi bir taç, döndürülmüş bir 5, bölüm çizen mavi benekli beyaz bir arkadaş.",
  "w4mid.1": "Ve her şeyin sonunda kocaman bir mutfak; orada yüzü olmayan bir ses şöyle dedi: \"Dünyaları ben pişiririm. Ve aşçıyı kimse kapatamaz.\"",
  "18.start.0": "Sonsuz Mutfak. Aşçı burada yaşıyor... ve Foogame'in bütün mutfak eşyaları burada doğdu.",
  "18.start.1": "Bu mutfaktaki her şey neden beni kesmek istiyor?",
  "18.startd.0": "Sonsuz Mutfak. Aşçı burada yaşıyor, {name}... ve Foogame'in bütün mutfak eşyaları burada doğdu.",
