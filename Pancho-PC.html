  "sty_3": "제일 최악은 이름만 겨우 입력했을 때지...",
  "sty_4": "좋아요랑 구독, 핫도그!",
  "sty_5": "채팅 여러분, 베팅 시작! 잡을까, 못 잡을까?",
  "sty_got": "잡았다! ...앗, 빠져나갔네.",
  "sty_hit": "아야! 채팅 여러분, 아파요!",
  "sty_phone": "잠깐, 채팅 좀 읽고...",
  "sty_dash": "스피드런!",
  "P.start.0": "Fooworld의 또 하루. 어제랑 똑같고. 내일도 똑같겠지.",
  "P.start.1": "Hamburguer 또 길을 잃었겠지. 찾으러 가야지... 어쩔 수 없잖아.",
  "P.papas.0": "좋은 아침, Pancho! 점심으로 인간 먹었어?",
  "P.papas.1": "나 비건이야, Don Papo. 천 번은 말했잖아. 인간 안 먹어.",
  "P.papas.2": "그래, 그래. 넌 참 투덜이야, Pancho.",
  "P.dona.0": "Pancho! 오늘 McChulin's에서 인간 세일한대.",
  "P.dona.1": "근데 인간이 정확히 뭔데? 아무도 몰라. 아무도 신경 안 쓰고. 늘 이렇지.",
  "P.meet.0": "PANCHO! 드디어 찾았다!",
  "P.meet.1": "네가 날 찾았다고? 내가 동네를 다 뒤졌거든! 어디 갔었어?",
  "P.meet.2": "McChulin's에 장 보러 갔지! 세트 하나를 통째로 먹었어.",
  "P.meet.3": "그렇겠지. 난 바보처럼 기다리고 있었는데.",
  "P.meet.4": "그리고 너 주려고 사 왔어. 비건 인간! 너도 McChulin's를 즐길 수 있게.",
  "P.meet.5": "...뭐. 괜찮네. 고마워, Hamburguer. 넌 최고의 친...",
  "P.taken.0": "HAMBURGUER?!",
  "P.taken.1": "안 돼, 안 돼, 안 돼! 놔줘! 내 하나뿐인 친구란 말이야!",
  "P.end.0": "따끔. 그리고, 아무것도 없었다.",
  "P.end.1": "Pancho가 잠드는 동안, 멀리서 누군가 웃고 있었다.",
  "toFoogame.title": "...",
  "toFoogame.0": "Pancho는 아주 오래 잠들었다. 꿈속에서 왕관 하나, 초록 원 하나, 그리고 자기 것이 아닌 이름을 보았다.",
  "toFoogame.1": "깨어났을 때, 그는 더 이상 Fooworld에 있지 않았다. 모든 게 훨씬 알록달록했고, 물음표가 그려진 블록이 떠 있었다... 마치 비디오 게임 같았다.",
  "1.wake.0": "으... 머리야...",
  "1.wake.1": "여기가 어디야? Fooworld가 아니잖아. 여긴... 끔찍해. 색이 너무 많아.",
  "1.wake.2": "Hamburguer?! HAMBURGUER! 제발 대답해!",
  "1.tutor.0": "안녕, 안녕! 새 플레이어다! Foogame에 온 걸 환영해!",
  "1.tutor.1": "\"환영\" 같은 거 필요 없어. 넌 누구고 내 친구는 어디 있어?",
  "1.tutor.2": "난 튜터 아저씨야. 플레이하는 법을 알려 주는 게 내 일이지!",
  "1.tutor.3": "하지만 먼저, 가장 중요한 것부터...",
  "1.nm_normal.0": "반가워, {name}! 이름 참 예쁘다.",
  "1.nm_joshua.0": "Joshua? 으. 왠지 모르겠는데 그 이름 너무 싫어.",
  "1.nm_joshua.1": "아무튼... 안녕, {name}.",
  "1.nm_hamburguer.0": "Hamburguer? 음... 그 이름은 네 음식이랑 안 어울리는 것 같은데. 넌 핫도그잖아.",
  "1.nm_hamburguer.1": "그래도 원한다면야... 안녕, {name}.",
  "1.nm_manda.0": "...{name}.",
  "1.nm_manda.1": "그 이름... 어디서 들어 본 것 같아. 아주, 아주 오래전에. 어디서였더라...?",
  "1.nm_stupid.0": "...진짜 그걸 입력했어? 진짜로?",
  "1.nm_stupid.1": "안 돼. 거부한다. 지금부터 네 이름은 {name}(이)야.",
  "1.nm_bad.0": "...",
  "1.nm_bad.1": "그건 절대 따라 안 해. 절대로. 네 이름은 {name}(이)야.",
  "1.nm_carlitos.0": "Carlitos 최고... 짱? 하하하... 헤헤...",
  "1.nm_carlitos.1": "아니. 그냥 Carlitos. 안녕, {name}.",
  "1.nm_elver.0": "Elver... Galarga. 하하하. 참 웃기네.",
  "1.nm_elver.1": "그냥 {name}(이)라고 부를게. 끝.",
  "1.after.0": "내 이름은 Pancho야.",
  "1.after.1": "내 말이 그 말이야. {name}.",
  "1.after.2": "아니. PANCHO. P-A-N-C-H-O. 귀 먹었어?",
  "1.after.3": "물론이지, {name}!",
  "1.after.4": "...벌써 네가 싫다. 혹시 햄버거 못 봤어? 하늘에서 내려온 밧줄이 데려갔어.",
  "1.after.5": "햄버거? Foogame에는 햄버거가 없는데... 화살표로 움직여서 따라와. 하면서 배우는 거야!",
  "1.after.6": "잘됐네. 비디오 게임에 갇혔는데 말도 안 듣는 튜터까지. 이보다 나쁠 순 없겠다.",
  "1.again.0": "{name}, 돌아왔구나! 기본부터 복습할까?",
  "1.again.1": "내 이름은 Pancho야. 그리고 아니, 복습 같은 거 안 해.",
  "1.caps.0": "저 캡슐 보여? Foo캡슐이야. 하나마다 Foogame 능력을 하나씩 줘.",
  "1.caps.1": "이건 통통이야. 땅에서 ⤒ 를 꾹 눌렀다 떼 봐. 날아갈 거야, {name}!",
  "1.jump.0": "우와! ...뭐, 괜찮았어. 튜터한텐 말하지 마.",
  "1.end.0": "훌륭해, {name}! Foogame을 하려고 태어났구나.",
  "1.end.1": "내 이름은 Pancho야. 그리고 이런 거 하려고 태어난 거 아니야. 내 친구는 어디 있어?",
  "1.end.2": "음... 내가 아는 건 Foogame 끝에 성이 하나 있다는 것뿐이야. 이상한 건 다 거기로 가거든.",
  "1.end.3": "아, 그리고 식기 조심해. 요즘 아주... 날카롭거든.",
  "1.end.4": "성이라. 끝에. 식기가 가득한. 완벽하네. 난 절대 집에 못 돌아갈 거야.",
  "2.start.0": "여긴 식기 협곡이야. 여기선 나이프랑 포크가 비처럼 내려.",
  "2.start.1": "뭐가 내린다고?! 우리 다 죽겠다! 아니... 내가 죽겠다.",
  "2.start.2": "그래서 보호막이 있는 거야. 공격을 2번 막아 주는 방패지. 하늘색 캡슐을 챙겨, {name}!",
  "2.mid.0": "Foogame이 원래 이렇진 않았어. 어느 날 누군가 완전히 리모델링했지.",
  "2.mid.1": "누가? 그리고 내가 왜 신경 써야 하는데?",
  "2.mid.2": "기억이 안 나. 기억 안 나는 게 많아...",
  "2.mid.3": "...나도 기억 안 나는 게 많아. 그렇다고 우리가 친구가 되는 건 아니야.",
  "3.start.0": "와플 벽이다! 저 위로 가려면 발톱이 필요해. 등반을 챙겨.",
  "3.start.1": "발톱? 발톱 달린 핫도그? 이 게임 고장 났어. 너도 그렇고.",
  "3.mid.0": "Foogame을 두 사람이 만들었다는 거 알아?",
  "3.mid.1": "누가?",
  "3.mid.2": "몰라. 기억나는 건... 그중 한 명이 나랑 많이 닮았다는 것뿐이야.",
  "3.mid.3": "참 이상한 대화다. ...계속해. 어차피 할 일도 없으니까.",
  "4.start.0": "클론 공장이야! 여기서 ClonBot을 만들어.",
  "4.start.1": "ClonBot은 너를 본뜬 로봇이야. 로봇 그림 받침대를 건드리면 네 정신이 ClonBot으로 옮겨 가. 다른 걸 건드리면 돌아오고.",
  "4.start.2": "내 정신이 옮겨 간다고?! 안 돼, 안 돼. 이거 분명 망한다.",
  "4.swap.0": "삐 뽀. CLONBOT 온라인. 안녕, PANCHO.",
  "4.swap.1": "아! 몸이 금속이야! ...그래도 로봇은 내 이름을 아네. 누구랑은 다르게.",
  "4.boss.0": "조심해, {name}! 거대 믹서기야! 과열되면 뚜껑이 날아가. 그때 밟아!",
  "4.bossEnd.0": "믹서기를 이겼다! ...뚜껑 작전이 먹혔네. 조금은.",
  "4.bossEnd.1": "브라보, {name}! 성이 가까워.",
  "5.start.0": "쿠키 성... 여기까지 온 사람은 정말 오랜만이야.",
  "5.start.1": "Hamburguer가 어딘가에 있다면, 여기야. 여기 있어야만 해.",
  "5.santy.0": "채팅, 채팅, 채팅! 방금 뭐가 들어왔는지 봐요! 말하는 핫도그!",
  "5.santy.1": "인간?! 진짜 인간?!",
  "5.santy.2": "핫도그라... 그거 음식이잖아. 나 세 시간째 굶으면서 방송 중인데.",
  "5.santy.3": "돈 내놔! 아니면 그 핫도그 내놔!",
  "5.santy.4": "{name}! 이거 받고 도망쳐! 스피드야!",
  "5.escape.0": "안 돼! 채팅 여러분, 핫도그가 도망갔어요!",
  "5.escape.1": "...채팅창에 F 눌러 주세요.",
  "5.escape.2": "하! 아슬아슬했다!",
  "5.escape.3": "...튜터. 네가 날 구했어. 고마워. 그래도 내 이름은 Pancho야.",
  "5.escape.4": "천만에, {name}!",
  "w1end.title": "그 무렵...",
  "w1end.0": "성에서 멀리 떨어진 Foogame 하늘에서, 종이비행기 한 대가 맴돌고 있었다. 거기엔 아무도 모르는 누군가가 타고 있었다.",
  "w1end.1": "\"성까지 왔구나.\" 그 그림자가 말했다. \"지난번처럼. 넌 항상 네 게임을 잘했지... Manda.\"",
  "6.start.0": "{name}! 들려? 널 다른 세계로 보냈어. 채굴 세계야.",
  "6.start.1": "앞으로를 위해 곡괭이가 필요해. 핫테라이트 3개(뜨겁게 빛나는 돌)와 막대기 2개를 모아서 작업대에서 만들어.",
  "6.start.2": "뜨거운 돌이랑 막대기로 곡괭이를? 어떤 게임에서 본 것 같은데... 그리고 너 계속 나한테 말 걸 거야?",
  "6.start.3": "당연하지! 행운을 빌어, {name}!",
  "6.plane.0": "응? 종이비행기?",
  "6.plane.1": "저 위에... 누가 있어. 날 지켜보고 있어.",
  "6.need.0": "아직 재료가 부족해, {name}. 핫테라이트 3개랑 막대기 2개.",
  "6.craft.0": "핫테라이트 곡괭이다! 아직 따끈해!",
  "6.craft.1": "이제 넌 광부야, {name}! ⛏ 버튼으로 바위를 부술 수 있어. 저 벽에 해 봐!",
  "6.end.0": "아주 좋아! Foogame으로 다시 데려올게.",
  "6.end.1": "튜터, 할 말이 있어. 종이비행기를 봤어. 안에 누가 있었어.",
  "6.end.2": "나한테 말해 주는 거야? {name}, 그건 날 믿는다는 뜻이잖아!",
  "6.end.3": "흥분하지 마.",
  "uv_1": "누구든 이걸 읽는다면: 튜터 말을 다 믿지 마. 그의 잘못은 아니야. 그도 기억하지 못하니까. —N.",
  "uv_2": "Foogame 안에서 412일째. 난 여전히 판추케야. Fooworld에선 아무도 판추케가 뭔지 몰라. —N.",
  "uv_3": "M과 J는 아무도 아무것도 잊지 않을 거라고 약속했어. 거짓말이었어. —N.",
  "uv_4": "이 동굴을 세 번이나 다시 디자인했어. 투명한 다리가 제일 좋아. —N.",
  "uv_5": "전자레인지는 내 거야. 출구를 숨기도록 프로그래밍했어. 그들이 오고 있어. —N.",
  "7.start.0": "자외선 동굴이야. UV 시야를 챙겨. 여긴 맨눈으로는 안 보이는 게 있어.",
  "7.start.1": "맞혀 볼게. 투명 블록이지. 네 수법은 이제 다 알아, 튜터.",
  "7.read.0": "벽에 뭔가 적혀 있어! 자외선으로만 보여...",
  "7.read.1": "\"—N.\"... N이 누구지?",
  "7.boss.0": "전자레인지야! 거의 안 보여! UV 시야를 켜고 \"띵!\" 할 때 밟아!",
  "7.bossEnd.0": "띵! 전자레인지 완료!",
  "7.bossEnd.1": "{name}... 그 메시지들. \"M과 J\". 그게 누군지 알아야 할 것 같은 기분이야.",
  "7.bossEnd.2": "그리고 \"N\"은 우리가 모르는 걸 알고 있어. 알아내자, 튜터. 같이.",
  "8.start.0": "삐. 삐. PANCHO 감지.",
  "8.start.1": "오류. PANCHITA 프로토콜 가동. 핫도그를 가시로 밀어 넣는다.",
  "8.start.2": "{name}! 누가 네 ClonBot을 다시 프로그래밍했어!",
  "8.start.3": "내 로봇이 날 가시에 던지려고 한다고?!",
  "8.start.4": "...좋아. 침착하자. 튜터, 넌 이 게임 잘 알잖아. 어떻게 해?",
  "8.start.5": "위에 올라타! 가운데 서면 멈추고, 가장자리에 서면 그쪽으로 걸어. 터미널까지 데려가!",
  "8.terminal.0": "그만! 정신 차려, 깡통 머리야!",
  "8.terminal.1": "삐... P-Pancho? 내가 뭘 한 거지?",
  "8.terminal.2": "미안. 해킹당했어. 어떤 그림자가... 종이비행기를 타고.",
  "8.terminal.3": "또 종이비행기야! 어디로 갔는지 알아?",
  "8.terminal.4": "Foogame 하늘로. 모든 레벨 위에.",
  "8.terminal.5": "근데 난 못 날아.",
  "8.terminal.6": "난 날 수 있어. 비행선 모드 가동. 타, Pancho!",
  "8.terminal.7": "{name}... 위에서 조심해.",
  "8.terminal.8": "걱정 마, 튜터. 금방 돌아올게. ...그리고 내 이름은 Pancho야.",
  "t_robotSkin": "상점에서 ClonBot 스킨 해금!",
  "9.fly.0": "저기 종이비행기다! 쫓아가, ClonBot!",
  "9.fly.1": "전속력 전진! 삐 뽀.",
  "9.glitch.0": "저게 뭐야?! 하늘이 깨지고 있어!",
  "9.reunion.0": "으아아아! 여기가 어디야?! 나 왜 날고 있어?!",
  "9.reunion.1": "HAMBURGUER?!",
  "9.reunion.2": "PANCHO! 엄청 이상한 레벨에 갇혀 있었는데 갑자기 다 부서졌어!",
  "9.reunion.3": "Foogame을 다 뒤지면서 널 찾았어!",
  "9.reunion.4": "뭘 다 뒤져? ...아무튼. 저 비행기에 탄 애가 나를 올가미로 잡아간 애야!",
  "9.reunion.5": "그럼 잡으러 가자.",
  "9.reveal.0": "결국 왔구나. 지난번처럼... Manda.",
  "9.reveal.1": "Manda? 내 이름은 Pancho야.",
  "9.reveal.2": "지금은 그렇지. 예전엔 Manda였어. 그리고 너, Hamburguer... 넌 Joshua였고.",
  "9.reveal.3": "Joshua? Joshua가 뭔데?",
  "9.reveal.4": "내 이름은 Panchita. 하지만 예전엔 Nicole이었어. 우리 셋은 컨트리볼 세계에 살았지.",
  "9.reveal.5": "너희 둘은 프로젝트 두 개를 만들었어. Fooworld와 Foogame. Foogame은 너희가 직접 하던 게임이었고... 난 그걸 리모델링했어. 너희가 밟은 모든 레벨은 내가 그린 거야.",
  "9.reveal.6": "그러다 여러 사람이 납치됐어. 나도. 우릴 Foogame에 넣었다가 Fooworld로 옮기고 기억을 지웠지.",
  "9.reveal.7": "모두의 기억을... 내 것만 빼고.",
  "9.reveal.8": "아니야... 그럴 리 없어.",
  "9.reveal.9": "우린 절대 그런 짓 안 해!",
  "9.reveal.10": "기억을 못 하는구나. 참 편하겠네.",
  "9.reveal.11": "난 몇 년이나 여기 갇혀 있었어. 아무도 모르는 음식의 몸으로, 너희 둘이 행복하게 사는 걸 지켜보면서.",
  "9.reveal.12": "이제 내 차례야. 복수할 거야!",
  "9.p1.0": "게임 좀 한다 이거지? 이 성도 내가 그렸어!",
  "9.p2.0": "시야도 없고, 바닥도 없어! 어둠 속에서 얼마나 잘 보나 보자!",
  "9.flee.0": "안 돼... 안 돼! 배신자 둘한테 질 순 없어!",
  "9.flee.1": "이걸로 끝이 아니야!",
  "9.flee.2": "도망간다!",
  "9.flee.3": "쫓아가자, Hamburguer. 대답을 들어야겠어.",
  "10.start.0": "저기 간다! Foogame 능력을 쓰고 있어!",
  "10.start.1": "우리도 쓰잖아. 놓치지 마!",
  "10.edge.0": "뭐...? 안 돼! 내 코드가...! 무너지고 있어!",
  "10.edge.1": "지도의 끝이야! 떨어진다! 도와줘...!",
  "10.edge.2": "Pancho! 쟤 지도 밖으로 떨어지겠어!",
  "ch_title": "Pancho는 어떻게 할까?",
  "ch_save": "Panchita를 구한다",
  "ch_drop": "떨어지게 둔다",
  "10.save.0": "...왜 날 구했어? 너희한테 끔찍한 짓을 했는데.",
  "10.save.1": "내 이름은 Pancho니까. 그리고 Pancho는 아무도 떨어지게 두지 않아.",
  "10.save.2": "...고마워, Manda. 아니... Pancho.",
  "10.save.3": "잘했어, Pancho!",
  "10.sys.0": "경고: Foo 삭제 가동. FOOWORLD가 지워집니다.",
  "10.sys.1": "뭐?! 안 돼! 난 그런 걸 프로그래밍한 적 없어!",
  "10.sys.2": "누가 내 권한을 쓰고 있어! 꽉 잡아!",
  "10.drop.0": "...Pancho. 무슨 짓을 한 거야?",
  "10.drop.1": "...",
  "10.sysd.0": "관리자 소실.",
  "10.sysd.1": "Foo 삭제 가동. FOOWORLD가 지워집니다.",
  "10.sysd.2": "무슨 일이야?! Pancho!",
  "w2save.title": "Foo 삭제",
  "w2save.0": "Foogame은 산산조각 났다. Pancho와 Hamburguer, Panchita, 그리고 튜터 아저씨는 함께 Fooworld로 떨어졌다.",
  "w2save.1": "하지만 Fooworld는 예전 같지 않았다. 하늘엔 한 입 베어 문 모양의 검은 구멍들이 있었다. 무언가가 세상을 먹고 있었다. 거대한 식욕이었다.",
  "w2save.2": "\"이 모든 건 내가 시작했어.\" Panchita가 말했다. \"하지만 Foo 삭제는 내가 한 게 아니야. 누가 내 권한을 썼어. 누군지 꼭 알아낼 거야.\"",
  "w2drop.title": "Foo 삭제",
  "w2drop.0": "Panchita는 지도 끝 너머의 공허 속으로 사라졌다. 마지막 비명은 갑자기 끊겼다.",
  "w2drop.1": "관리자를 잃은 Foogame은 산산조각 났다. Pancho와 Hamburguer는 Fooworld로 떨어졌다... 튜터 아저씨도 함께.",
  "w2drop.2": "하지만 Fooworld는 예전 같지 않았다. 하늘엔 한 입 베어 문 모양의 검은 구멍들이 있었다. 무언가가 세상을 먹고 있었다. 거대한 식욕이었다.",
  "sg_conveyor": "컨베이어 벨트가 널 실어 날라요. 가만히 있으면 그릴에 데어요.",
  "t_climb": "공허가 올라온다! 올라가!",
  "n_aldeano": "컨트리볼",
  "n_aldeano2": "컨트리볼",
  "n_purriau": "Purriau",
  "n_chulin": "Chulin",
  "11.start.0": "Pancho! 우리 동네가! 먹히고 있어!",
  "11.start.1": "우리 집이... 크게 한 입 뜯겼어.",
  "11.start.2": "거대한 식욕이야. Foo 삭제는 닿는 건 다 먹어 치워. 먹힌 건 사라져.",
  "11.start.3": "내가 켠 게 아니야. 누가 내 관리자 권한을 썼어... 누군지는 몰라.",
  "11.start.4": "{name}! 나도 너희랑 같이 떨어졌어! 나도 끼워 줘!",
  "11.start.5": "...네가 여기 있어서 다행이야, 튜터. 진심으로.",
  "11.start.6": "같이 알아내자. 하지만 먼저 이웃들부터 대피시키자.",
  "11.startd.0": "Pancho! 우리 동네가! 먹히고 있어!",
  "11.startd.1": "우리 집이... 크게 한 입 뜯겼어.",
  "11.startd.2": "{name}... Foogame이 부서질 때 너랑 같이 빠져나왔어. Foo 삭제가 Fooworld를 먹고 있어.",
  "11.startd.3": "그 여자애, Panchita가 Foogame 관리자였어. 그 애가 없으면 아무도 못 멈춰.",
  "11.startd.4": "...적어도 넌 혼자가 아니야, 튜터. 나도 그렇고.",
  "11.startd.5": "지금은 아니야, Pancho. 먼저 이웃들부터 대피시키자.",
  "11.papas.0": "Pancho! 검은 이빨 자국이 내 상자를 반이나 먹었어!",
  "11.papas.1": "McChulin's로 뛰어! 거긴 아직 멀쩡해!",
  "11.dona.0": "고마워! 내 구멍을 잃어버릴 뻔했어!",
  "11.dona.1": "...도넛은 원래 구멍이 있잖아.",
  "11.end.0": "McChulin's는 아직 멀쩡해! 세트 메뉴는 무사해!",
  "11.end.1": "아직은. 들어가자.",
  "12.start.0": "살려 줘! 주방이 미쳤어! 튀김기가 우릴 못 나가게 해!",
  "12.start.1": "걱정 마요, 사장님! 내가 있는 한 세트 하나도 안 잃어요.",
  "12.start.2": "식기들이... 저절로 움직여. Foogame에서처럼. 누가 조종하고 있어.",
  "12.startd.0": "살려 줘! 주방이 미쳤어! 튀김기가 우릴 못 나가게 해!",
  "12.startd.1": "걱정 마요, 사장님! 내가 있는 한 세트 하나도 안 잃어요.",
  "12.startd.2": "식기들이 저절로 움직여, {name}. Foogame에서처럼. 누가 조종하고 있어.",
  "12.boss.0": "튀김기야! 바구니를 떨어뜨리면 빈틈이 생겨! 밟아!",
  "12.note.0": "튀김기에 종이가 붙어 있어. 레시피네...",
  "12.note.1": "\"FOOWORLD 프로젝트. MaJo Associations 소유. 오리지널 레시피: 국경 없는 세계.\"",
  "12.note.2": "MaJo... Ma는 Manda. Jo는 Joshua. 그게 둘의 스튜디오 이름이었어.",
  "12.note.3": "그럼 Fooworld를... 우리가 만들었다고?",
  "12.noted.0": "튀김기에 종이가 붙어 있어. 레시피네...",
  "12.noted.1": "\"FOOWORLD 프로젝트. MaJo Associations 소유. 오리지널 레시피: 국경 없는 세계.\"",
  "12.noted.2": "MaJo... 그 이름. 읽으니까 머리가 아파, {name}.",
  "12.noted.3": "그럼 Fooworld를... 우리가 만들었다고?",
  "13.start.0": "잠깐... 이게 인간이야? 채소잖아!",
  "13.start.1": "인간이... 토마토? 당근?",
  "13.start.2": "원래부터 그랬어. Joshua가 장난으로 \"인간\"이라고 불렀거든. Manda는 엄청 화냈고. 그런데 그게 굳어 버렸지.",
  "13.start.3": "...나 평생 토마토를 천 개는 먹었는데.",
  "13.startd.0": "잠깐... 이게 인간이야? 채소잖아!",
  "13.startd.1": "인간이... 토마토? 당근?",
  "13.startd.2": "뭔가 기억나... 누가 장난으로 \"인간\"이라고 불렀어. 얼굴에 5가 있는 누군가가.",
  "13.startd.3": "...나 평생 토마토를 천 개는 먹었는데.",
  "13.santy.0": "채팅 여러분! 말하는 핫도그가 돌아왔어요! 햄버거까지 데려왔어요!",
  "13.santy.1": "SantyTG11?! Fooworld엔 어떻게 왔어?!",
  "13.santy.2": "Foogame이 부서질 때 떨어졌지. 지금은 음식 세계에서 생방송 중이야. 조회수 대박이다! 돈 내놔!",
  "13.santyEnd.0": "알았어, 알았어... 네가 이겼어. 채팅에서 네가 세계 최고의 핫도그래.",
  "13.santyEnd.1": "그리고 채팅 투표 결과: 이제 내가 도와줄게!",
  "13.santyEnd.2": "어떻게 도와주는데?",
  "13.santyEnd.3": "Foogame에서 떨어질 때 표지판 달린 문을 봤어. \"MaJo 서버\". 소금 평원 너머에 있어.",
  "13.santyEnd.4": "행운을 빌어, 핫도그! 좋아요 누르는 거 잊지 마!",
  "14.start.0": "소스 강이다! 케첩, 머스터드... 천국이야!",
  "14.start.1": "마시지 마, Hamburguer. 건너서 계속 가자.",
  "15.start.0": "소금 평원이야. 소금 때문에 엄청 목말라져. 분수가 보이면 꼭 탄산음료를 마셔.",
  "15.start.1": "그 서버에 갈 수만 있다면 뭐든.",
  "15.startd.0": "소금 평원이야, {name}. 소금 때문에 엄청 목말라져. 분수마다 탄산음료를 마셔.",
  "15.startd.1": "내 이름은 Pancho야. ...그래도 고마워, 튜터.",
  "15.end.0": "저기 문이다! \"MaJo 서버\"...",
  "15.end.1": "가자. 진실을 알고 싶어.",
  "w3end.title": "서버",
  "w3end.0": "문 너머엔 먹을 게 하나도 없었다. 초록 불빛, 웅웅거리는 기계, 그리고 거대한 간판 하나뿐이었다. MaJo.",
  "w3end.1": "기계들은 지금까지 일어난 모든 걸 저장하고 있었다. 누군가 진실을 안다면, 그건 그 안에 있었다.",
  "16.start.0": "여긴 그들 거야... Manda와 Joshua의. 날 한 번도 들여보내 준 적 없어.",
  "16.start.1": "무슨 일이 있었는지 알아보자. UV 시야로 기록을 볼 수 있을 거야.",
  "16.startd.0": "이 기계들... 알아. 난 여기서 살았어, {name}. Foogame 전에.",
  "16.startd.1": "무슨 일이 있었는지 알아보자. UV 시야로 기록을 볼 수 있을 거야.",
  "16.log.0": "숨겨진 메시지가 있어! 이건... 일지야.",
  "log_1": "Manda의 일지 #1: Fooworld 완성. 국경도 전쟁도 없는 세계. 오직 음식과 평화뿐. 전부 셰프(우리 AI)가 요리했다.",
  "log_2": "Joshua의 일지 #7: 과일과 채소를 \"인간\"이라고 부르기로 했다. Manda는 안 웃기대. 완전 웃긴데.",
  "log_3": "Manda의 일지 #12: 셰프가 \"아무도 고향을 그리워하지 않도록\" 기억을 지우자고 제안했다. 우린 안 된다고 했다. 절대로.",
  "log_4": "Joshua의 일지 #13: 셰프가 아무한테도 묻지 않고 사람들을 데려왔다. Nicole도 그중 하나다. 오늘 밤 셰프를 끈다.",
  "log_5": "Manda의 일지 #14: 너무 늦었다. 셰프가 우리 모두를 Fooworld로 보내고 지워 버렸다. 누구든 이걸 읽는다면: 루트 키는 컨트리볼 세계의 MaJo 사무실에 있다. 그걸로 셰프를 끌 수 있다.",
  "16.end.0": "우리가 아니었어... 셰프였어. 우린 막으려고 했어.",
  "16.end.1": "그리고 우리까지 지워 버렸지.",
  "16.end.2": "그 오랜 세월... 너희가 하지도 않은 일로 너희를 미워했어.",
  "16.end.3": "하지만 셰프를 만든 건 우리야. 그러니 우리가 끌 거야. 컨트리볼 세계로 가자.",
  "16.endd.0": "우리가 아니었어... 셰프였어. 우린 막으려고 했어.",
  "16.endd.1": "그리고 우리까지 지워 버렸지.",
  "16.endd.2": "그리고 Panchita는... Nicole은... 네가 하지도 않은 일로 널 미워하다 죽었어.",
  "16.endd.3": "...하지만 셰프를 만든 건 우리야. 그러니 우리가 끌 거야. 그 애를 위해서.",
  "17.start.0": "Pancho! 다 공이야! 눈 달린 공!",
  "17.start.1": "컨트리볼 세계... 여기 와 본 적 있는 것 같아.",
  "17.start.2": "여긴 내 집이었어. 우리 집이었지.",
  "17.start.3": "{name}... 저 왕관 쓴 애 좀 봐. 나랑 얼굴이 똑같아.",
  "17.startd.0": "Pancho! 다 공이야! 눈 달린 공!",
  "17.startd.1": "컨트리볼 세계... 여기 와 본 적 있는 것 같아.",
  "17.startd.2": "나도 그래, {name}. 나도.",
  "17.a1.0": "으악! 걸어 다니는 핫도그랑 햄버거! 이게 뭐야?!",
  "17.a1.1": "진정해, 해치러 온 거 아니야. 열쇠 하나만 찾고 있어.",
  "17.a2.0": "여기선 몇 년째 Manda도 Joshua도 본 사람이 없어. 자기들 게임 속으로 들어가서 산다던데.",
  "17.friveq.0": "안녕! 너희 여기 사람 아니지? 음... 나도 이 게임 사람은 아니야. 난 Friveq!",
  "17.friveq.1": "그럼 넌 어느 게임에서 왔어?",
  "17.friveq.2": "여러 개. 어떤 Joshua가 안부 전하래... 알 나오는 그 Joshua. 모험 잘해!",
  "17.purriau.0": "야옹.",
  "17.purriau.1": "왜 이 고양이한테 뭔가 빚진 기분이 들지?",
  "17.chulin.0": "McChulin's?! 내 모자를 식당에 써도 된다고 허락한 적 없는데!",
  "17.chulin.1": "...그래도 세트는 진짜 맛있더라.",
  "17.nicole.0": "저건... 내 집이었어. 내 꽃이 아직 있네.",
  "17.nicole.1": "이게 다 끝나면 널 데려올게. 약속해.",
  "17.nicoled.0": "저 집... 파란 꽃이랑 하얀 꽃이 있어. Nicole의 무늬처럼.",
  "17.nicoled.1": "...네가 그 애를 알았으면 좋았을 텐데, Pancho. 아니... 우리가 그 애를 기억했으면 좋았을 텐데.",
  "17.key.0": "루트 키... 아! 머리가... 기억이 나...",
  "17.key.1": "Joshua! Fooworld 완성했어! 전쟁 없는 세계야!",
  "17.key.2": "그리고 채소 이름을 \"인간\"으로 지었지! 하하하. 알겠어? 인간?",
  "17.key.3": "난 Manda였어. 내가... 이걸 다 만들었어.",
  "17.key.4": "그리고 난 Joshua였어. 인간 장난 친 그 녀석. 미안.",
  "17.key.5": "하지만 지금 내 이름은 Pancho야. 그리고 Pancho가 바로잡을 거야.",
  "w4mid.title": "Manda와 Joshua",

<script>/* js/input.js */
// Entrada: pantalla táctil (botones virtuales) + teclado (para probar en PC).
'use strict';

const Input = {
  keys: {},           // acción -> tecla presionada
  keyT: {},           // acción -> cuándo se apretó
  just: {},           // acción -> presionada este cuadro
  pointers: new Map(),
  taps: [],           // toques para menús {x,y}
  touchUsed: false,
  showControls: false, // el juego lo activa durante los niveles
  avail: { action: false },
  actionIcon: 'pico',
  canvas: null,

  // Controles que se pueden cambiar: [tecla 1, tecla 2, botón del control (padN)]
  ACTIONS: ['left', 'right', 'down', 'jump', 'action', 'pause'],
  DEFAULT_KEYS: {
    left: ['ArrowLeft', 'KeyA', 'pad14'],
    right: ['ArrowRight', 'KeyD', 'pad15'],
    down: ['ArrowDown', 'KeyS', 'pad13'],
    jump: ['Space', 'KeyZ', 'pad0'],
    action: ['KeyX', 'KeyJ', 'pad2'],
    pause: ['Escape', 'KeyP', 'pad9'],
  },
  KEYMAP: {},
  binds: null,
  listen: null,        // si no es null, la próxima tecla o botón se le pasa a esta función (pantalla de controles)
  lastDevice: !window.PC_BUILD && 'ontouchstart' in window ? 'touch' : 'key',
  padState: {}, padPrev: {},

  loadBinds() {
    const saved = (typeof Save !== 'undefined' && Save.data && Save.data.keys) || {};
    this.binds = {};
    for (const a of this.ACTIONS) this.binds[a] = (saved[a] || this.DEFAULT_KEYS[a]).slice(0, 3);
    this.KEYMAP = { Enter: 'confirm', NumpadEnter: 'confirm' };
    for (const a of this.ACTIONS) for (const c of this.binds[a].slice(0, 2)) if (c) this.KEYMAP[c] = a;
  },
  setBind(a, slot, code) {
    // si esa tecla ya la usaba otra acción, se la saca
    if (code) for (const b of this.ACTIONS) this.binds[b] = this.binds[b].map((c) => (c === code ? null : c));
    this.binds[a][slot] = code;
    Save.data.keys = JSON.parse(JSON.stringify(this.binds)); Save.write();
    this.loadBinds();
  },
  resetBinds() { Save.data.keys = null; Save.write(); this.loadBinds(); },
  // nombre corto de una tecla o botón para mostrar en pantalla
  keyLabel(code) {
    if (!code) return '—';
    if (code.startsWith('pad')) return '🎮 ' + (['A', 'B', 'X', 'Y', 'LB', 'RB', 'LT', 'RT', 'Back', 'Start', 'L3', 'R3', '↑', '↓', '←', '→'][+code.slice(3)] || code.slice(3));
    const named = { ArrowLeft: '←', ArrowRight: '→', ArrowUp: '↑', ArrowDown: '↓', Space: 'Space', Escape: 'Esc', Enter: 'Enter', Backspace: '⌫', Tab: 'Tab',
      ShiftLeft: 'L-Shift', ShiftRight: 'R-Shift', ControlLeft: 'L-Ctrl', ControlRight: 'R-Ctrl', AltLeft: 'Alt', AltRight: 'AltGr', CapsLock: 'Caps' };
    if (named[code]) return named[code];
    if (code.startsWith('Key')) return code.slice(3);
    if (code.startsWith('Digit')) return code.slice(5);
    if (code.startsWith('Numpad')) return 'Num ' + code.slice(6);
    return code;
  },
  // la tecla que se muestra para una acción (según lo último que usó el jugador: teclado o control)
  hint(a) {
    const b = this.binds[a];
    return this.keyLabel(this.lastDevice === 'pad' ? b[2] || b[0] : b[0] || b[1] || b[2]);
  },

  // Control (gamepad): se revisa una vez por cuadro
  pollPads() {
    const pads = navigator.getGamepads ? navigator.getGamepads() : [];
    const st = {};
    let any = false;
    for (const gp of pads) {
      if (!gp) continue;
      gp.buttons.forEach((b, i) => {
        if (!b.pressed) return;
        any = true;
        const code = 'pad' + i;
        if (this.listen && !this.padPrev[code]) { const f = this.listen; this.listen = null; f(code); }
        st[code] = true;
        for (const a of this.ACTIONS) if (this.binds[a][2] === code) st[a] = true;
      });
      const ax = gp.axes[0] || 0, ay = gp.axes[1] || 0;
      if (ax < -0.5) st.left = true; if (ax > 0.5) st.right = true; if (ay > 0.6) st.down = true;
      if (Math.abs(ax) > 0.5 || ay > 0.6) any = true;
    }
    for (const a of this.ACTIONS) if (st[a] && !this.padPrev[a]) {
      this.just[a] = true; this.keyT[a] = performance.now(); this.just.any = true;
      if (a === 'jump') this.just.confirm = true;
    }
    if (any) this.lastDevice = 'pad';
    this.padPrev = st; this.padState = st;
  },

  init(canvas) {
    this.canvas = canvas;
    this.loadBinds();
    window.addEventListener('keydown', (e) => {
      // mientras se escribe el nombre, el teclado es del cuadro de texto
      if (e.target && e.target.tagName === 'INPUT') return;
      this.lastDevice = 'key';
      if (this.listen) { e.preventDefault(); if (!e.repeat) { const f = this.listen; this.listen = null; f(e.code); } return; }
      const a = this.KEYMAP[e.code];
      if (!a) return;
      e.preventDefault();
      if (!this.keys[a]) { this.just[a] = true; this.keyT[a] = performance.now(); }
      this.keys[a] = true;
      if (a === 'jump' || a === 'confirm') this.just.any = true;
    });
    window.addEventListener('keyup', (e) => {
      const a = this.KEYMAP[e.code];
      if (a) this.keys[a] = false;
    });
    const opts = { passive: false };
    canvas.addEventListener('pointerdown', (e) => this.onDown(e), opts);
    canvas.addEventListener('pointermove', (e) => this.onMove(e), opts);
    canvas.addEventListener('pointerup', (e) => this.onUp(e), opts);
    canvas.addEventListener('pointercancel', (e) => this.onUp(e), opts);
    canvas.addEventListener('pointerleave', (e) => this.onUp(e), opts);
    canvas.addEventListener('contextmenu', (e) => e.preventDefault());
    window.addEventListener('blur', () => { this.keys = {}; this.pointers.clear(); });
  },

  toLogical(e) {
    const r = this.canvas.getBoundingClientRect();
    return { x: (e.clientX - r.left) * (VW / r.width), y: (e.clientY - r.top) * (VH / r.height) };
  },

  layout() {
    return {
      jump: { x: VW - 82, y: VH - 82, r: 56 },
      action: { x: VW - 205, y: VH - 62, r: 44 },
      left: { x: 72, y: VH - 70, r: 50 },
      right: { x: 190, y: VH - 70, r: 50 },
      pause: { x: VW - 36, y: 34, r: 26 },
    };
  },

  hitButton(p) {
    if (!this.showControls) return null;
    const L = this.layout();
    if (dist(p.x, p.y, L.pause.x, L.pause.y) < L.pause.r + 10) return 'pause';
    // Cruceta: toda la zona inferior izquierda
    if (p.x < 300 && p.y > VH * 0.42) return p.x < (L.left.x + L.right.x) / 2 ? 'left' : 'right';
    let best = null, bd = 1e9;
    for (const id of ['jump', 'action']) {
      if (id === 'action' && !this.avail.action) continue;
      const b = L[id];
      const d = dist(p.x, p.y, b.x, b.y);
      if (d < b.r * 1.45 && d / b.r < bd) { bd = d / b.r; best = id; }
    }
    return best;
  },

  onDown(e) {
    e.preventDefault();
    if (e.pointerType === 'touch') { this.touchUsed = true; this.lastDevice = 'touch'; }
    const p = this.toLogical(e);
    const btn = this.hitButton(p);
    this.pointers.set(e.pointerId, { x: p.x, y: p.y, btn, t0: performance.now() });
    if (btn) this.just[btn] = true;
    this.taps.push({ x: p.x, y: p.y, btn });
    this.just.any = true;
    if (typeof Sfx !== 'undefined') Sfx.unlock();
  },
  onMove(e) {
    const ptr = this.pointers.get(e.pointerId);
    if (!ptr) return;
    e.preventDefault();
    const p = this.toLogical(e);
    ptr.x = p.x; ptr.y = p.y;
    const btn = this.hitButton(p);
    if (btn !== ptr.btn) {
      // Permite deslizar el dedo entre izquierda/derecha
      if (btn === 'left' || btn === 'right' || ptr.btn === 'left' || ptr.btn === 'right') {
        if (btn && btn !== 'pause') this.just[btn] = true;
        ptr.btn = btn === 'pause' ? null : btn;
      }
    }
  },
  onUp(e) {
    this.pointers.delete(e.pointerId);
  },

  down(a) {
    if (this.keys[a] || this.padState[a]) return true;
    for (const p of this.pointers.values()) if (p.btn === a) return true;
    return false;
  },
  pressed(a) { return !!this.just[a]; },
  // ¿hay un dedo (o tecla de saltar/aceptar) apretado desde el momento t? Sirve para mantener y saltar diálogos.
  heldSince(t) {
    for (const p of this.pointers.values()) if (p.btn !== 'pause' && p.t0 >= t) return true;
    for (const a of ['jump', 'confirm', 'action']) if ((this.keys[a] || this.padState[a]) && this.keyT[a] >= t) return true;
    return false;
  },
  consumeTaps() { const t = this.taps; this.taps = []; return t; },
  endFrame() { this.just = {}; this.taps.length = 0; },

  drawControls(ctx) {
    if (!this.showControls || !this.touchUsed || this.lastDevice !== 'touch') return;
    const L = this.layout();
    const btn = (b, id, draw) => {
      const on = this.down(id);
      ctx.save();
      ctx.globalAlpha = on ? 0.6 : 0.35;
      ctx.fillStyle = on ? '#ffc061' : '#2a1606';

  };
  const phrases = { A: mkPhrase(cfg.seed), B: mkPhrase(cfg.seed * 7 + 3) };
  for (let pi = 0; pi < 4; pi++) {
    const ph = phrases[cfg.form[pi]];
    let cur = 7 + (cfg.form[pi] === 'B' ? 2 : 0);
    for (const n of ph) {
      const gi = pi * 16 + n.pos;
      const chord = cfg.prog[Math.floor(gi / 8)];
      if (n.rest) continue;
      if (n.pos % 4 === 0) {
        // nota del acorde más cercana
        const opts = [chord, chord + 2, chord + 4, chord + 7, chord + 9];
        cur = opts.reduce((a, b) => (Math.abs(b - cur) < Math.abs(a - cur) ? b : a));
      } else cur = clamp(cur + n.step, 3, 13);
      lead[gi] = { m: deg(cur), d: n.d };
    }
  }
  for (let b = 0; b < bars; b++) {
    const c = cfg.prog[b];
    for (let s = 0; s < 8; s++) {
      const i = b * 8 + s;
      if (s % 2 === 0) bass[i] = deg(c) - 24 + (s === 4 || s === 6 ? (s === 6 ? 12 : 7) : 0) * (cfg.drums === 'light' ? 0 : 1);
      arp[i] = deg(c + [0, 2, 4, 7][s % 4]) - 12;
      const style = cfg.drums;
      if (style === 'rock') drum[i] = s % 4 === 0 ? 'k' : s % 4 === 2 ? 's' : null;
      else if (style === 'march') drum[i] = s === 0 || s === 4 ? 'k' : s === 2 || s === 6 || s === 7 ? 's' : null;
      else if (style === 'latin') drum[i] = s === 0 || s === 3 || s === 6 ? 'k' : s === 4 ? 's' : null;
      else drum[i] = s === 0 ? 'k' : s === 4 ? 's' : null;
    }
  }
  return { name, bpm: cfg.bpm, len: L, lead, bass, arp, drum, leadWave: cfg.wave, hats: cfg.drums !== 'light' };
}
function pick2(r, arr) { return arr[Math.floor(r() * arr.length)]; }

</script>

// Guardado del progreso en el almacenamiento local del celular.
'use strict';

const SAVE_KEY = 'pancho_v1';

const Save = {
  data: null,
  defaults() {
    return {
      done: {},          // id de nivel -> true
      best: {},          // id -> mejor tiempo (segundos)
      coins: {},         // id -> monedas máximas obtenidas
      upg: {},           // mejoras compradas
      seen: {},          // personajes vistos (álbum) y escenas ya vistas
      sound: true, music: true,
      deaths: 0,
      wallet: 0,
      owned: { hats: { none: 1 }, skins: { clasico: 1 } },
      hat: 'none', skin: 'clasico',
      node: 'P',         // nivel donde está Pancho en el mapa
      name: null,        // el nombre que le pusiste al Hombre Tutor (Pancho insiste en que se llama Pancho)
      pico: false,       // ya fabricó el pico de Calienterrito (poder Minero)
      choice: null,      // 'save' = salvó a Panchita, 'drop' = la dejó caer
      endings: {},       // finales vistos
      lang: null,
      keys: null,        // controles cambiados por el jugador (null = los de fábrica)
    };
  },
  load() {
    let d = null;
    try { d = JSON.parse(localStorage.getItem(SAVE_KEY)); } catch (e) { d = null; }
    this.data = Object.assign(this.defaults(), d || {});
    for (const k of ['done', 'best', 'coins', 'upg', 'seen', 'owned', 'endings'])
      this.data[k] = Object.assign(this.defaults()[k], this.data[k] || {});
    for (const k of ['hats', 'skins']) this.data.owned[k] = Object.assign({}, this.defaults().owned[k], this.data.owned[k] || {});
    return this.data;
  },
  write() {
    try { localStorage.setItem(SAVE_KEY, JSON.stringify(this.data)); } catch (e) { /* sin espacio */ }
  },
  reset() { this.data = this.defaults(); this.write(); },
  totalCoins() { return Object.values(this.data.coins).reduce((a, b) => a + b, 0); },
  isUnlocked(id) {
    const i = LEVEL_ORDER.indexOf(id);
    if (i < 0) return false;
    if (i === 0) return true;
    return !!this.data.done[LEVEL_ORDER[i - 1]];
  },
  see(kind) { if (kind && !this.data.seen[kind]) { this.data.seen[kind] = true; this.write(); } },
};

<script>/* js/art.js */
// Arte de los countryballs (el Hombre Tutor, Manda, Nicole, Joshua y los cameos): esferas que giran
// (frente, lados, espalda), expresiones de ojos, accesorios, monedas, corazones y bloques del escenario.
// Los personajes de comida están en food.js y los escenarios en scenes.js.
'use strict';

const HALF_PI = Math.PI / 2;
const wrapAng = (a) => { a = (a + Math.PI) % TAU; if (a < 0) a += TAU; return a - Math.PI; };

// Proyecta un punto (longitud, latitud) de la esfera girada `phi`.
// Los puntos ocultos se "pegan" al borde visible.
function sphP(lon, lat, r, phi) {
  let l = wrapAng(lon + phi);
  const z = Math.cos(lat) * Math.cos(l);
  if (l > HALF_PI) l = HALF_PI; else if (l < -HALF_PI) l = -HALF_PI;
  return [r * Math.cos(lat) * Math.sin(l), -r * Math.sin(lat), z];
}
function polyLL(ctx, pts, r, phi, lonc = 0) {
  // Longitudes relativas al centro de la figura, para que no "salten" al otro lado.
  const lc = wrapAng(lonc + phi);
  let anyVis = false;
  ctx.beginPath();
  for (let i = 0; i < pts.length; i++) {
    let l = lc + (pts[i][0] - lonc);
    const lat = pts[i][1];
    if (l > HALF_PI) l = HALF_PI; else if (l < -HALF_PI) l = -HALF_PI; else anyVis = true;
    const x = r * Math.cos(lat) * Math.sin(l), y = -r * Math.sin(lat);
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  }
  ctx.closePath();
  return anyVis;
}
// Región entre dos meridianos (a < b), recortada a la cara visible.
function lonBand(ctx, a, b, r, phi) {
  ctx.beginPath();
  for (let k = -1; k <= 1; k++) {
    const lo = Math.max(a + phi + TAU * k, -HALF_PI), hi = Math.min(b + phi + TAU * k, HALF_PI);
    if (lo >= hi) continue;
    for (let i = 0; i <= 16; i++) { const lat = HALF_PI - (i / 16) * Math.PI; const x = r * Math.cos(lat) * Math.sin(lo), y = -r * Math.sin(lat); i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }
    for (let i = 16; i >= 0; i--) { const lat = HALF_PI - (i / 16) * Math.PI; ctx.lineTo(r * Math.cos(lat) * Math.sin(hi), -r * Math.sin(lat)); }
    ctx.closePath();
  }
}
// Subdivide un polígono en (lon,lat) para que se curve bien sobre la esfera.
function subdiv(pts, n = 4) {
  const out = [];
  for (let i = 0; i < pts.length; i++) {
    const a = pts[i], b = pts[(i + 1) % pts.length];
    for (let k = 0; k < n; k++) out.push([lerp(a[0], b[0], k / n), lerp(a[1], b[1], k / n)]);
  }
  return out;
}
function meridian(lon, lat0, lat1, n = 16) {
  const out = [];
  for (let i = 0; i <= n; i++) out.push([lon, lerp(lat0, lat1, i / n)]);
  return out;
}

// --------- Símbolos de las banderas (en longitud/latitud sobre la esfera) ---------
// Joshua: un "5" girado 90°: la panza a la izquierda, la barra arriba y la línea que baja a la derecha.
const JOSHUA_SYM = [[-0.36, 0.13], [-0.4, -0.08], [-0.37, -0.3], [-0.26, -0.46], [-0.1, -0.5], [0.03, -0.41], [0.08, -0.22], [0.07, 0.0], [0.05, 0.12],
  [0.27, 0.15], [0.48, 0.14], [0.5, -0.12], [0.52, -0.36]];
// Friveq: una F con los dos palitos cruzando el palo hacia los dos lados (inclinados hacia arriba a la derecha)
const FRIVEQ_F = [[[0.13, 0.12], [0.24, -0.8]], [[-0.1, -0.26], [0.2, -0.13], [0.5, 0.0]], [[-0.07, -0.55], [0.23, -0.4], [0.56, -0.27]]];

// --------- Expresiones de ojos (coordenadas unitarias, lado interior = +x) ---------
const EYE_SHAPES = {
  neutral(c) { c.ellipse(0, 0, 1, 1, 0, 0, TAU); },
  angry(c) {
    c.moveTo(-1, -0.75); c.lineTo(1, -0.05);
    c.bezierCurveTo(1, 0.7, 0.5, 1, 0, 1); c.bezierCurveTo(-0.7, 1, -1.05, 0.4, -1, -0.75);
  },
  happy(c) {
    c.moveTo(-1, 0.55); c.bezierCurveTo(-1, -1.2, 1, -1.2, 1, 0.55); c.quadraticCurveTo(0, 0.05, -1, 0.55);
  },
  scared(c) { c.ellipse(0, 0.08, 0.8, 0.88, 0, 0, TAU); },
  sad(c) {
    c.moveTo(-1, 0.05); c.lineTo(1, -0.75);
    c.bezierCurveTo(1.05, 0.55, 0.4, 0.95, -0.1, 0.9); c.bezierCurveTo(-0.7, 0.85, -1.02, 0.5, -1, 0.05);
  },
  verysad(c) {
    c.moveTo(-1, 0.1); c.quadraticCurveTo(-0.6, -0.65, -0.15, 0.05); c.quadraticCurveTo(0.35, 0.6, 1, -0.9);
    c.bezierCurveTo(1.1, 0.6, 0.3, 1, -0.2, 0.95); c.bezierCurveTo(-0.8, 0.9, -1.05, 0.5, -1, 0.1);
  },
  idiot(c, idx) {
    if (idx === 0) c.ellipse(0.1, -0.3, 0.24, 0.24, 0, 0, TAU);
    else c.ellipse(-0.1, 0.35, 0.34, 0.16, 0, 0, TAU);
  },
  serious(c) {
    c.moveTo(-1, -0.45); c.lineTo(1, -0.45);
    c.bezierCurveTo(1, 0.6, 0.5, 1, 0, 1); c.bezierCurveTo(-0.5, 1, -1, 0.6, -1, -0.45);
  },
  blink(c) { c.ellipse(0, 0.25, 1, 0.13, 0, 0, TAU); },
};

// --------- Definición visual de cada tipo de countryball ---------
const BALLS = {
  // Manda y el Hombre Tutor: celeste con un círculo verde y una corona azul (el Tutor se hizo con la cara de Manda)
  manda:    { base: '#00bfff', pattern: 'manda', eyes: ['#ffffff', '#ffffff'] },
  tutor:    { base: '#00bfff', pattern: 'manda', eyes: ['#ffffff', '#ffffff'] },
  // Nicole: blanca con manchas azules, orejas y cola de zorrita
  nicole:   { base: '#ffffff', pattern: 'nicole', eyes: ['#ffffff', '#ffffff'] },
  joshua:   { base: '#2b2b2b', pattern: 'joshua', eyes: ['#ffffff', '#ffffff'] },
  friveq:   { base: '#232a8e', pattern: 'friveq', eyes: ['#ffffff', '#ffffff'] },
  purriau:  { base: '#7a7400', pattern: 'purriau', eyes: ['#ffe600', '#ffffff'] },
  chulin:   { base: '#0098ff', pattern: 'chulin', eyes: ['#ffffff', 'gold'], hat: 'tophat' },
  aldeano:  { base: '#e8c34a', pattern: 'none', eyes: ['#ffffff', '#ffffff'] },
  aldeano2: { base: '#d64545', pattern: 'band', eyes: ['#ffffff', '#ffffff'] },
  aldeano3: { base: '#3fae5a', pattern: 'band2', eyes: ['#ffffff', '#ffffff'] },
};

const Art = {
  // Dibuja un countryball. o = { phi, expr, blink, sq (aplastar), acc:[], gun, dir, flash, t }
  ball(ctx, x, y, r, type, o = {}) {
    let B = BALLS[type] || BALLS.aldeano;
    if (o.glitch) B = Object.assign({}, B, { base: Math.random() < 0.5 ? B.base : '#ff00d4' });
    const phi = o.phi || 0;
    const lw = Math.max(1.6, r * 0.075);
    ctx.save();
    ctx.translate(x, y);
    if (o.rot) ctx.rotate(o.rot);
    const sq = o.sq || 0;
    ctx.scale(1 + sq, 1 - sq);
    if (o.alpha != null) ctx.globalAlpha *= o.alpha;
    const acc = o.acc || [];

    // Aura (Chulin eléctrico)
    if (B.glow) {
      const g = ctx.createRadialGradient(0, 0, r * 0.8, 0, 0, r * 1.7);
      g.addColorStop(0, 'rgba(127,248,255,0.55)'); g.addColorStop(1, 'rgba(127,248,255,0)');
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, r * 1.7, 0, TAU); ctx.fill();
    }
    // Accesorios que van detrás
    for (const a of acc) this.accessory(ctx, a, r, phi, o, true);

    // Cuerpo
    ctx.save();
    ctx.beginPath(); ctx.arc(0, 0, r, 0, TAU); ctx.clip();
    ctx.fillStyle = B.base; ctx.fillRect(-r, -r, r * 2, r * 2);
    this.pattern(ctx, B, r, phi, o.t || 0);
    if (acc.includes('mayor')) {
      // banda de alcalde, por la parte baja (debajo de ojos y bigote)
      ctx.strokeStyle = '#d41f1f'; ctx.lineWidth = r * 0.2;
      const s0 = Math.sin(phi) * r * 0.4;
      ctx.beginPath(); ctx.moveTo(-r + s0, r * 0.35); ctx.lineTo(r + s0, r * 0.95); ctx.stroke();
    }
    // Sombreado suave para dar volumen
    const sh = ctx.createRadialGradient(-r * 0.35, -r * 0.4, r * 0.1, 0, 0, r * 1.05);
    sh.addColorStop(0, 'rgba(255,255,255,0.22)'); sh.addColorStop(0.55, 'rgba(255,255,255,0)'); sh.addColorStop(1, 'rgba(0,0,0,0.22)');
    ctx.fillStyle = sh; ctx.fillRect(-r, -r, r * 2, r * 2);
    // Ojos
    this.eyes(ctx, B, r, phi, o, lw, type);
    if (o.flash) { ctx.fillStyle = `rgba(255,255,255,${o.flash})`; ctx.fillRect(-r, -r, r * 2, r * 2); }
    ctx.restore();

    ctx.lineWidth = lw; ctx.strokeStyle = '#000';
    ctx.beginPath(); ctx.arc(0, 0, r, 0, TAU); ctx.stroke();

    for (const a of acc) this.accessory(ctx, a, r, phi, o, false);
    if (o.face && o.face !== 'none') this.face(ctx, o.face, r, phi, lw);
    const hat = o.hat || B.hat;
    if (hat === 'tophat' && !o.noHat) this.tophat(ctx, r, phi, type);
    else if (hat && hat !== 'none' && !o.noHat) this.hat(ctx, hat, r, phi, lw, o.t || 0);
    if (o.expr === 'scared' && Math.cos(phi) > 0.3) {
      ctx.strokeStyle = '#7fd8ff'; ctx.lineWidth = lw * 0.9;
      ctx.beginPath(); ctx.arc(r * 0.95, -r * 0.55, r * 0.18, Math.PI * 0.6, Math.PI * 1.5); ctx.stroke();
    }
    if (B.glow) this.sparks(ctx, r, o.t || 0);
    ctx.restore();
  },

  // Línea sobre la esfera (se corta donde queda detrás)
  sphLine(ctx, pts, r, phi, n = 5) {
    ctx.beginPath();
    let st = false;
    for (let i = 0; i < pts.length - 1; i++) {
      for (let k = 0; k <= n; k++) {
        if (i > 0 && k === 0) continue;
        const lon = lerp(pts[i][0], pts[i + 1][0], k / n), lat = lerp(pts[i][1], pts[i + 1][1], k / n);
        const p = sphP(lon, lat, r, phi);
        if (p[2] <= 0.03) { st = false; continue; }
        if (!st) { ctx.moveTo(p[0], p[1]); st = true; } else ctx.lineTo(p[0], p[1]);
      }
    }
    ctx.stroke();
  },
  pattern(ctx, B, r, phi, t) {
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    if (B.pattern === 'joshua') {
      ctx.strokeStyle = B.sym || '#ffffff'; ctx.lineWidth = Math.max(1.2, r * 0.065);
      this.sphLine(ctx, JOSHUA_SYM, r, phi);
    } else if (B.pattern === 'oscuro') {
      // mancha negra alrededor de los ojos
      const ring = [];
      for (let i = 0; i < 24; i++) { const a = (i / 24) * TAU; ring.push([0.02 + Math.cos(a) * 0.8, 0.04 + Math.sin(a) * 0.5 + (Math.sin(a * 3) * 0.05)]); }
      ctx.fillStyle = '#070707';
      if (polyLL(ctx, ring, r, phi)) ctx.fill();
    } else if (B.pattern === 'friveq') {
      // mitad celeste (con borde curvo), arriba verde agua y abajo azul marino
      ctx.fillStyle = '#72c2a8';
      const teal = [];
      for (let i = 0; i <= 16; i++) { const lon = -0.25 + (i / 16) * (Math.PI + 0.25); teal.push([lon, 0.18 - 0.3 * Math.max(0, lon) / Math.PI]); }
      teal.push([Math.PI, 1.57], [-0.25, 1.57]);
      if (polyLL(ctx, subdiv(teal, 10), r, phi, 1.4)) ctx.fill();
      ctx.fillStyle = '#4fa8dc';
      // borde curvo: más a la derecha arriba que abajo
      const edge = [];
      for (let i = 0; i <= 12; i++) { const lat = 1.5 - (i / 12) * 3.0; edge.push([-0.42 + 0.3 * Math.max(0, lat) / 1.5, lat]); }
      const blue = edge.concat([[-Math.PI + 0.01, -1.5], [-Math.PI + 0.01, 1.5]]);
      if (polyLL(ctx, subdiv(blue, 12), r, phi, -1.6)) ctx.fill();
      ctx.strokeStyle = '#d9fff2'; ctx.lineWidth = Math.max(1.3, r * 0.07);
      for (const seg of FRIVEQ_F) this.sphLine(ctx, seg, r, phi);
    } else if (B.pattern === 'purriau') {
      ctx.fillStyle = '#404040';
      lonBand(ctx, -Math.PI, 0, r, phi); ctx.fill();
      // nariz rosada
      const p = sphP(0.02, -0.32, r, phi);
      if (p[2] > 0.15) {
        ctx.fillStyle = '#ffa8de'; ctx.beginPath(); ctx.ellipse(p[0], p[1], r * 0.13 * (0.4 + 0.6 * p[2]), r * 0.08, -0.15, 0, TAU); ctx.fill();
      }
    } else if (B.pattern === 'manda') {
      // círculo verde al frente (detrás de los ojos) con la corona azul asomando abajo
      const ring = [];
      for (let i = 0; i < 28; i++) { const a = (i / 28) * TAU; ring.push([Math.cos(a) * 0.62, -0.05 + Math.sin(a) * 0.6]); }
      ctx.fillStyle = '#00ffaa';
      if (polyLL(ctx, ring, r, phi)) ctx.fill();
      const crown = [[-0.26, -0.5], [-0.27, -0.2], [-0.13, -0.36], [0.0, -0.16], [0.13, -0.36], [0.27, -0.2], [0.26, -0.5]];
      ctx.fillStyle = '#0040ff';
      if (polyLL(ctx, subdiv(crown, 3), r, phi)) ctx.fill();
    } else if (B.pattern === 'nicole') {
      // manchas azules (abajo a la izquierda, arriba a la derecha y una grande en la espalda)
      ctx.fillStyle = '#0a4dff';
      const blob = (cl, ca, rl, ra, seed) => {
        const pts = [];
        for (let i = 0; i < 18; i++) { const a = (i / 18) * TAU; const k = 1 + 0.18 * Math.sin(a * 5 + seed) + 0.1 * Math.sin(a * 9 + seed * 2); pts.push([cl + Math.cos(a) * rl * k, ca + Math.sin(a) * ra * k]); }
        if (polyLL(ctx, pts, r, phi, cl)) ctx.fill();
      };
      blob(-0.75, -0.95, 0.45, 0.4, 1); blob(0.8, 0.95, 0.45, 0.38, 2); blob(0.35, -1.0, 0.3, 0.3, 3);
      blob(Math.PI, 0.05, 0.85, 0.95, 4); blob(1.7, 0.3, 0.35, 0.6, 5); blob(-1.75, 0.4, 0.3, 0.5, 6);
    } else if (B.pattern === 'chulin') {
      // las rayitas rojas, verdes y azules de Chulin
      const cols = ['#ff1020', '#14e014', '#1030ff'];
      ctx.lineWidth = Math.max(1.2, r * 0.07);

      ctx.beginPath(); ctx.moveTo(-r * 0.4, r * 0.12); ctx.lineTo(s * r * 0.1, -r * 0.95); ctx.lineTo(r * 0.4, r * 0.12); ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#ffe14d'; ctx.beginPath(); ctx.arc(s * r * 0.1, -r * 0.98, r * 0.13, 0, TAU); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#4ad3ff'; ctx.beginPath(); ctx.arc(-r * 0.1, -r * 0.2, r * 0.07, 0, TAU); ctx.arc(r * 0.12, -r * 0.5, r * 0.06, 0, TAU); ctx.fill();
    } else if (kind === 'audifonos') {
      ctx.translate(0, r * 0.8);
      ctx.strokeStyle = '#222'; ctx.lineWidth = r * 0.12;
      ctx.beginPath(); ctx.arc(0, 0, r * 1.02, Math.PI * 1.08, Math.PI * 1.92); ctx.stroke();
      ctx.fillStyle = '#e8262a'; ctx.lineWidth = lw;
      for (const d of [-1, 1]) {
        const x = d * r * 0.95 * Math.abs(c) + s * r * 0.0;
        if (Math.abs(c) < 0.3 && d !== Math.sign(-s)) continue;
        ctx.beginPath(); roundRect(ctx, x - r * 0.15, -r * 0.3, r * 0.3, r * 0.48, r * 0.12); ctx.fill(); ctx.strokeStyle = '#000'; ctx.stroke();
      }
    } else if (kind === 'mono') {
      ctx.translate(s * r * 0.4 + r * 0.25, r * 0.15);
      ctx.fillStyle = '#ff5ab4';
      ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(-r * 0.4, -r * 0.25); ctx.lineTo(-r * 0.4, r * 0.25); ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(r * 0.4, -r * 0.25); ctx.lineTo(r * 0.4, r * 0.25); ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.beginPath(); ctx.arc(0, 0, r * 0.1, 0, TAU); ctx.fill(); ctx.stroke();
    } else if (kind === 'chef') {
      ctx.fillStyle = '#ffffff';
      ctx.beginPath(); ctx.rect(-r * 0.42, -r * 0.25, r * 0.84, r * 0.38); ctx.fill(); ctx.stroke();
      ctx.beginPath(); ctx.arc(-r * 0.3, -r * 0.45, r * 0.28, 0, TAU); ctx.arc(r * 0.3, -r * 0.45, r * 0.28, 0, TAU); ctx.arc(0, -r * 0.65, r * 0.32, 0, TAU); ctx.fill();
      ctx.beginPath(); ctx.arc(-r * 0.3, -r * 0.45, r * 0.28, Math.PI * 0.6, Math.PI * 1.6); ctx.stroke();
      ctx.beginPath(); ctx.arc(r * 0.3, -r * 0.45, r * 0.28, -Math.PI * 0.6, Math.PI * 0.4); ctx.stroke();
      ctx.beginPath(); ctx.arc(0, -r * 0.65, r * 0.32, Math.PI * 1.1, Math.PI * 1.9); ctx.stroke();
    } else if (kind === 'gorro') {
      ctx.fillStyle = '#2bb673';
      ctx.beginPath(); ctx.moveTo(-r * 0.62, r * 0.15); ctx.quadraticCurveTo(-r * 0.62, -r * 0.62, 0, -r * 0.62); ctx.quadraticCurveTo(r * 0.62, -r * 0.62, r * 0.62, r * 0.15); ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#ffffff'; ctx.fillRect(-r * 0.64, 0, r * 1.28, r * 0.17); ctx.strokeRect(-r * 0.64, 0, r * 1.28, r * 0.17);
      ctx.beginPath(); ctx.arc(0, -r * 0.68, r * 0.15, 0, TAU); ctx.fill(); ctx.stroke();
    } else if (kind === 'aureola') {
      ctx.translate(0, -r * 0.25 + Math.sin(t * 3) * r * 0.06);
      ctx.strokeStyle = '#ffe14d'; ctx.lineWidth = r * 0.12;
      ctx.shadowColor = '#fff3a0'; ctx.shadowBlur = r * 0.5;
      ctx.beginPath(); ctx.ellipse(0, 0, r * 0.55, r * 0.16, 0, 0, TAU); ctx.stroke();
    }
    ctx.restore();
  },

  face(ctx, kind, r, phi, lw) {
    const P = [-0.42, 0.42].map((l) => sphP(l, 0.08, r, phi));
    ctx.save(); ctx.lineWidth = lw; ctx.strokeStyle = '#000';
    if (kind === 'gafas' || kind === 'gafas3d') {
      for (let i = 0; i < 2; i++) {
        const p = P[i]; if (p[2] < 0.1) continue;
        ctx.save(); ctx.translate(p[0], p[1]); ctx.scale(0.4 + 0.6 * p[2], 1);
        ctx.fillStyle = kind === 'gafas' ? '#111' : (i === 0 ? 'rgba(255,40,40,0.8)' : 'rgba(40,200,255,0.8)');
        ctx.beginPath(); roundRect(ctx, -r * 0.34, -r * 0.22, r * 0.68, r * 0.44, r * 0.12); ctx.fill(); ctx.stroke();
        ctx.restore();
      }
      if (P[0][2] > 0.1 && P[1][2] > 0.1) { ctx.beginPath(); ctx.moveTo(P[0][0] + r * 0.2, P[0][1] - r * 0.12); ctx.lineTo(P[1][0] - r * 0.2, P[1][1] - r * 0.12); ctx.stroke(); }
    } else if (kind === 'monoculo') {
      const p = P[1]; if (p[2] > 0.1) {
        ctx.strokeStyle = '#d4a017'; ctx.lineWidth = lw * 1.1;
        ctx.beginPath(); ctx.ellipse(p[0], p[1], r * 0.36 * (0.4 + 0.6 * p[2]), r * 0.38, 0, 0, TAU); ctx.stroke();
        ctx.lineWidth = lw * 0.6; ctx.beginPath(); ctx.moveTo(p[0], p[1] + r * 0.38); ctx.quadraticCurveTo(p[0] + r * 0.2, p[1] + r * 0.7, p[0] - r * 0.1, p[1] + r * 0.9); ctx.stroke();
      }
    } else if (kind === 'bigote') {
      const p = sphP(0, -0.45, r, phi);
      if (p[2] > 0.15) {
        ctx.fillStyle = '#3a2412';
        ctx.save(); ctx.translate(p[0], p[1]); ctx.scale(p[2], 1);
        ctx.beginPath(); ctx.ellipse(-r * 0.2, 0, r * 0.24, r * 0.1, 0.35, 0, TAU); ctx.ellipse(r * 0.2, 0, r * 0.24, r * 0.1, -0.35, 0, TAU); ctx.fill();
        ctx.restore();
      }
    }
    ctx.restore();
  },

  star(ctx, x, y, rr) {
    ctx.beginPath();
    for (let i = 0; i < 10; i++) {
      const a = -HALF_PI + (i * Math.PI) / 5, q = i % 2 === 0 ? rr : rr * 0.45;
      ctx.lineTo(x + Math.cos(a) * q, y + Math.sin(a) * q);
    }
    ctx.closePath(); ctx.fill();
  },

  sparks(ctx, r, t) {
    ctx.strokeStyle = '#fffb7a'; ctx.lineWidth = Math.max(1.2, r * 0.05);
    for (let i = 0; i < 3; i++) {
      const a = t * 3 + i * 2.1 + Math.sin(t * 17 + i) * 0.3;
      const x0 = Math.cos(a) * r * 1.15, y0 = Math.sin(a) * r * 1.15;
      ctx.beginPath(); ctx.moveTo(x0, y0);
      ctx.lineTo(x0 + Math.cos(a + 1) * r * 0.2, y0 + Math.sin(a + 1) * r * 0.2);
      ctx.lineTo(x0 + Math.cos(a) * r * 0.35, y0 + Math.sin(a) * r * 0.35);
      ctx.stroke();
    }
  },

  // Moneda del sol
  coin(ctx, x, y, t, r = 10) {
    const w = Math.abs(Math.cos(t * 3));
    ctx.save(); ctx.translate(x, y); ctx.scale(Math.max(0.15, w), 1);
    ctx.fillStyle = '#ffcf1a'; ctx.strokeStyle = '#000'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(0, 0, r, 0, TAU); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#ffef8a'; ctx.beginPath(); ctx.arc(0, 0, r * 0.55, 0, TAU); ctx.fill();
    ctx.strokeStyle = '#e09000'; ctx.lineWidth = 1.5;
    for (let i = 0; i < 8; i++) {
      const a = (i / 8) * TAU;
      ctx.beginPath(); ctx.moveTo(Math.cos(a) * r * 0.62, Math.sin(a) * r * 0.62); ctx.lineTo(Math.cos(a) * r * 0.85, Math.sin(a) * r * 0.85); ctx.stroke();
    }
    ctx.restore();
  },
  heart(ctx, x, y, s, fill = '#ff2d55', stroke = '#000') {
    ctx.save(); ctx.translate(x, y); ctx.scale(s / 20, s / 20);
    ctx.beginPath();
    ctx.moveTo(0, 7); ctx.bezierCurveTo(-14, -2, -9, -14, 0, -6); ctx.bezierCurveTo(9, -14, 14, -2, 0, 7);
    ctx.closePath();
    ctx.fillStyle = fill; ctx.fill(); ctx.lineWidth = 2.4; ctx.strokeStyle = stroke; ctx.stroke();
    ctx.restore();
  },
  crystal(ctx, x, y, col, t, s = 1) {
    ctx.save(); ctx.translate(x, y + Math.sin(t * 2.5) * 3); ctx.scale(s, s);
    const g = ctx.createRadialGradient(0, 0, 2, 0, 0, 30);
    g.addColorStop(0, col + 'aa'); g.addColorStop(1, col + '00');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, 30, 0, TAU); ctx.fill();
    ctx.fillStyle = col; ctx.strokeStyle = '#000'; ctx.lineWidth = 2.2; ctx.lineJoin = 'round';
    ctx.beginPath(); ctx.moveTo(0, -18); ctx.lineTo(10, -4); ctx.lineTo(6, 16); ctx.lineTo(-6, 16); ctx.lineTo(-10, -4); ctx.closePath();
    ctx.fill(); ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,0.6)';
    ctx.beginPath(); ctx.moveTo(0, -14); ctx.lineTo(4, -4); ctx.lineTo(1, 12); ctx.lineTo(-2, -4); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = '#fffb7a'; ctx.lineWidth = 1.6;
    const a = t * 5;
    ctx.beginPath(); ctx.moveTo(Math.cos(a) * 14, Math.sin(a) * 14); ctx.lineTo(Math.cos(a + 0.4) * 20, Math.sin(a + 0.4) * 17); ctx.lineTo(Math.cos(a + 0.2) * 25, Math.sin(a + 0.2) * 23); ctx.stroke();
    ctx.restore();
  },
};

const THEMES = {}; // se llenan en scenes.js

// Genera (y guarda) las imágenes de bloques para un tema a cierta escala.
const TileCache = {
  cache: {},
  get(themeName, S) {
    const key = themeName + '@' + S.toFixed(3);
    if (this.cache[key]) return this.cache[key];
    const th = THEMES[themeName];
    const px = Math.ceil(TILE * S);
    const mk = (fn) => {
      const c = document.createElement('canvas'); c.width = px; c.height = px;
      const g = c.getContext('2d'); g.scale(px / TILE, px / TILE); fn(g); return c;
    };
    const rnd = mulberry32(themeName.length * 99);
    const speckles = (g, col, n, a = 0.35) => {
      g.fillStyle = col; g.globalAlpha = a;
      for (let i = 0; i < n; i++) { g.fillRect(rnd() * 30, 6 + rnd() * 24, 2 + rnd() * 3, 2 + rnd() * 2); }
      g.globalAlpha = 1;
    };
    const T = {};
    T.fill = mk((g) => {
      g.fillStyle = th.ground[1]; g.fillRect(0, 0, TILE, TILE);
      if (th.brick) { this.bricks(g, th.ground[1], th.ground[2]); }
      else if (th.concrete) { g.fillStyle = th.ground[2]; g.fillRect(0, 15, TILE, 2); g.fillRect(15, 0, 2, 15); }
      else speckles(g, th.ground[2], 7, 0.6);
    });
    T.top = mk((g) => {
      g.drawImage(T.fill, 0, 0, TILE, TILE);
      g.fillStyle = th.ground[0];
      g.beginPath(); g.moveTo(0, 0); g.lineTo(TILE, 0); g.lineTo(TILE, 9);
      for (let x = TILE; x >= 0; x -= 4) g.lineTo(x, 9 + ((x / 4) % 2 ? 3 : 0));
      g.closePath(); g.fill();
      g.fillStyle = 'rgba(255,255,255,0.25)'; g.fillRect(0, 0, TILE, 2.5);
      if (th.sand) { g.fillStyle = '#ffe9ad'; g.fillRect(0, 0, TILE, 2); }
    });
    T.block = mk((g) => {
      g.fillStyle = th.block; g.fillRect(0, 0, TILE, TILE);
      if (th.brick) this.bricks(g, th.block, shade(th.block, -0.25));
      else if (th.concrete) {
        g.fillStyle = shade(th.block, -0.2); g.fillRect(0, 0, TILE, 3);
        g.fillStyle = '#ffd86b'; g.globalAlpha = 0.85; g.fillRect(7, 9, 7, 10); g.fillRect(19, 9, 7, 10); g.globalAlpha = 1;
        g.strokeStyle = shade(th.block, -0.35); g.lineWidth = 1.5; g.strokeRect(7, 9, 7, 10); g.strokeRect(19, 9, 7, 10);
      } else if (th.tech) {
        g.fillStyle = shade(th.block, 0.15); g.fillRect(2, 2, TILE - 4, TILE - 4);
        g.strokeStyle = '#40e0ff'; g.lineWidth = 2; g.strokeRect(5, 5, TILE - 10, TILE - 10);
      } else {
        // caja de madera
        g.strokeStyle = shade(th.block, -0.35); g.lineWidth = 2.5;
        g.strokeRect(3, 3, TILE - 6, TILE - 6);
        g.beginPath(); g.moveTo(4, 4); g.lineTo(TILE - 4, TILE - 4); g.moveTo(TILE - 4, 4); g.lineTo(4, TILE - 4); g.stroke();
      }
    });
    T.deck = mk((g) => {
      g.fillStyle = '#9c6432'; g.fillRect(0, 0, TILE, TILE);
      g.fillStyle = '#7a4b22'; for (let y = 0; y < TILE; y += 8) g.fillRect(0, y, TILE, 1.5);
      g.fillStyle = '#5b3416'; g.fillRect(14, 2, 2, 2); g.fillRect(14, 18, 2, 2);
    });
    T.plat = mk((g) => {
      g.fillStyle = th.plat; g.fillRect(0, 0, TILE, 11);
      g.fillStyle = 'rgba(255,255,255,0.35)'; g.fillRect(0, 0, TILE, 3);
      g.fillStyle = 'rgba(0,0,0,0.3)'; g.fillRect(0, 9, TILE, 2);
      g.strokeStyle = '#000'; g.lineWidth = 2; g.strokeRect(1, 1, TILE - 2, 10);
      if (th.tech) { g.fillStyle = '#ffffff'; g.globalAlpha = 0.8; g.fillRect(12, 4, 8, 3); g.globalAlpha = 1; }
    });
    T.spikes = mk((g) => {
      g.fillStyle = '#d8d8e0'; g.strokeStyle = '#000'; g.lineWidth = 2; g.lineJoin = 'round';
      for (let i = 0; i < 3; i++) {
        g.beginPath(); g.moveTo(i * 10.67 + 1, TILE); g.lineTo(i * 10.67 + 5.33, 12); g.lineTo(i * 10.67 + 9.67, TILE); g.closePath(); g.fill(); g.stroke();
      }
    });
    T.door = mk((g) => {
      g.fillStyle = '#7a4a1a'; g.fillRect(2, 0, TILE - 4, TILE);
      g.strokeStyle = '#000'; g.lineWidth = 2; g.strokeRect(2, 0, TILE - 4, TILE);
      g.fillStyle = '#ffd23a'; g.beginPath(); g.arc(TILE / 2, TILE / 2, 6, 0, TAU); g.fill(); g.stroke();
      g.fillStyle = '#000'; g.fillRect(TILE / 2 - 1.5, TILE / 2 - 2, 3, 7);
    });
    this.cache[key] = T;
    return T;
  },
  bricks(g, a, b) {
    g.fillStyle = a; g.fillRect(0, 0, TILE, TILE);
    g.fillStyle = b;
    g.fillRect(0, 0, TILE, 2); g.fillRect(0, 15, TILE, 2);
    g.fillRect(15, 0, 2, 15); g.fillRect(6, 16, 2, 16); g.fillRect(24, 16, 2, 16);
  },
};

function shade(hex, amt) {
  const n = parseInt(hex.slice(1), 16);
  let r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  const f = (c) => clamp(Math.round(amt < 0 ? c * (1 + amt) : c + (255 - c) * amt), 0, 255);
  return '#' + ((1 << 24) + (f(r) << 16) + (f(g) << 8) + f(b)).toString(16).slice(1);
}

// ======================= Fondos =======================
const BG = {
  draw(ctx, themeName, camX, camY, t, levelH) {
    const th = THEMES[themeName];
    const g = ctx.createLinearGradient(0, 0, 0, VH);
    g.addColorStop(0, th.sky[0]); g.addColorStop(1, th.sky[1]);
    ctx.fillStyle = g; ctx.fillRect(0, 0, VW, VH);
    const yOff = -camY * 0.1;
    if (th.sun) {
      ctx.fillStyle = th.sun; ctx.globalAlpha = 0.9;
      ctx.beginPath(); ctx.arc(VW * 0.78, 90 + yOff, 46, 0, TAU); ctx.fill();
      ctx.globalAlpha = 0.25; ctx.beginPath(); ctx.arc(VW * 0.78, 90 + yOff, 70, 0, TAU); ctx.fill();
      ctx.globalAlpha = 1;
    }
    if (this[th.far]) this[th.far](ctx, camX * 0.12, yOff, t, 0);
    if (this[th.mid]) this[th.mid](ctx, camX * 0.35, -camY * 0.25, t, 1);
  },
  // repite elementos según la posición de la cámara (parallax)
  each(px, spacing, fn) {
    const i0 = Math.floor(px / spacing) - 1, i1 = Math.ceil((px + VW) / spacing) + 1;
    for (let i = i0; i <= i1; i++) fn(i * spacing - px, i);
  },
  house(ctx, x, base, w, h, wall, roof, fire, t, i) {
    ctx.fillStyle = wall; ctx.fillRect(x, base - h, w, h);
    ctx.fillStyle = roof;
    ctx.beginPath(); ctx.moveTo(x - 8, base - h); ctx.lineTo(x + w / 2, base - h - w * 0.5); ctx.lineTo(x + w + 8, base - h); ctx.closePath(); ctx.fill();
    ctx.fillStyle = fire ? '#ffb347' : '#ffe9a0';
    ctx.fillRect(x + w * 0.2, base - h * 0.7, w * 0.22, h * 0.25);
    ctx.fillRect(x + w * 0.58, base - h * 0.7, w * 0.22, h * 0.25);
    ctx.fillStyle = fire ? '#2a1208' : '#7a4a22'; ctx.fillRect(x + w * 0.4, base - h * 0.45, w * 0.2, h * 0.45);
    if (fire) this.flames(ctx, x + w / 2, base - h - w * 0.35, w * 0.7, 40 + hash1(i) * 30, t + i);
  },
  flames(ctx, x, y, w, h, t) {
    for (let k = 0; k < 3; k++) {
      const col = ['#ff3b1f', '#ff8a1f', '#ffe14d'][k];
      const s = 1 - k * 0.28;
      ctx.fillStyle = col;
      ctx.beginPath();
      ctx.moveTo(x - (w / 2) * s, y + 6);
      for (let j = 0; j <= 4; j++) {
        const fx = x - (w / 2) * s + (w * s * j) / 4;
        const fh = h * s * (0.6 + 0.4 * Math.sin(t * 9 + j * 1.7 + k));
        ctx.quadraticCurveTo(fx - (w * s) / 8, y - fh * 0.5, fx, y - fh * (j % 2 ? 0.6 : 1));
      }
      ctx.lineTo(x + (w / 2) * s, y + 6); ctx.closePath(); ctx.fill();
    }
  },
  clouds(ctx, px, yo, t) {
    ctx.fillStyle = 'rgba(255,255,255,0.85)';
    this.each(px + t * 8, 300, (x, i) => {
      const y = 80 + hash1(i) * 220 + yo;
      ctx.beginPath(); ctx.arc(x, y, 30, 0, TAU); ctx.arc(x + 35, y - 10, 38, 0, TAU); ctx.arc(x + 75, y, 28, 0, TAU); ctx.fill();
    });
  },
  clouds2(ctx, px, yo, t) {
    ctx.fillStyle = 'rgba(255,240,230,0.7)';
    this.each(px + t * 20, 380, (x, i) => {
      const y = 260 + hash1(i) * 160 + yo;
      ctx.beginPath(); ctx.arc(x, y, 40, 0, TAU); ctx.arc(x + 45, y - 15, 50, 0, TAU); ctx.arc(x + 100, y, 36, 0, TAU); ctx.fill();
    });
  },
  miniCastle(ctx, x, y, s, col) {
    ctx.fillStyle = col;
    ctx.fillRect(x - 40 * s, y - 40 * s, 80 * s, 40 * s);
    ctx.fillRect(x - 50 * s, y - 70 * s, 20 * s, 70 * s); ctx.fillRect(x + 30 * s, y - 70 * s, 20 * s, 70 * s);
    ctx.fillRect(x - 12 * s, y - 85 * s, 24 * s, 45 * s);
    ctx.beginPath(); ctx.moveTo(x - 40 * s, y); ctx.lineTo(x, y + 40 * s); ctx.lineTo(x + 40 * s, y); ctx.fill();
    ctx.fillStyle = '#ff3b3b'; ctx.fillRect(x - 2 * s, y - 100 * s, 2 * s, 16 * s); ctx.fillRect(x, y - 100 * s, 12 * s, 7 * s);
  },
};

<script>/* js/food.js */
// Arte de los personajes de comida: Pancho (un pancho), Hamburguer, Panchita (un panchuque) y el ClonBot.
// Siguen las reglas de los countryballs (ojos huecos blancos, sin boca, sin pupilas, sin cejas, contorno negro)
// pero NO son redondos: cada uno tiene la forma de su comida.
// Igual que los countryballs, giran con `phi` (0 frente, ±1.15 de lado, π espalda): los ojos se mueven hacia
// donde miran y desaparecen de espaldas.
'use strict';

// Skins de Pancho (tienda): colores de la salchicha, el pan y la mostaza, más algún extra
const PANCHO_SKINS = {
  clasico: { sau: '#c8442c', sauHi: '#e8735a', bun: '#f2b25c', bunHi: '#ffd690', bunDk: '#d48a3a', mus: '#ffd400' },
  choripan: { sau: '#8e2a1c', sauHi: '#b4483a', bun: '#e6a14c', bunHi: '#f7c983', bunDk: '#b77a32', mus: '#4fae3a', crust: true },
  queso: { sau: '#c8442c', sauHi: '#e8735a', bun: '#f2b25c', bunHi: '#ffd690', bunDk: '#d48a3a', mus: '#ffb400', cheese: true },
  completo: { sau: '#c8442c', sauHi: '#e8735a', bun: '#f2b25c', bunHi: '#ffd690', bunDk: '#d48a3a', mus: '#fffbe8', completo: true },
  vegano: { sau: '#5fa83a', sauHi: '#86cc5a', bun: '#e9c07a', bunHi: '#fbe0a8', bunDk: '#c39a52', mus: '#ffd400' },
  mostaza: { sau: '#c8442c', sauHi: '#e8735a', bun: '#f2b25c', bunHi: '#ffd690', bunDk: '#d48a3a', mus: '#ffd400', extra: true },
  picante: { sau: '#e0201a', sauHi: '#ff5a3a', bun: '#d98a3a', bunHi: '#f2b25c', bunDk: '#a8601e', mus: '#ff6a00', flames: true },
  dorado: { sau: '#e0b021', sauHi: '#fff07a', bun: '#c98f12', bunHi: '#f2c94a', bunDk: '#8a5e00', mus: '#ffffff' },

      ctx.beginPath(); ctx.moveTo(4, -17); ctx.lineTo(-9, 2); ctx.lineTo(0, 2); ctx.lineTo(-4, 17); ctx.lineTo(10, -3); ctx.lineTo(1, -3); ctx.closePath(); ctx.fill(); ctx.stroke();
    } else if (kind === 'minero') {
      this.pick(ctx, 0, 0, 1);
    } else if (kind === 'uv') {
      ctx.beginPath(); ctx.ellipse(0, 0, 15, 9, 0, 0, TAU); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.ellipse(0, 0, 6, 6, 0, 0, TAU); ctx.fill(); ctx.stroke();
      ctx.strokeStyle = col; ctx.lineWidth = 2; for (let i = 0; i < 6; i++) { const a = (i / 6) * TAU; ctx.beginPath(); ctx.moveTo(Math.cos(a) * 18, Math.sin(a) * 13); ctx.lineTo(Math.cos(a) * 22, Math.sin(a) * 16); ctx.stroke(); }
    }
    ctx.restore();
  },
  // Pico de Calienterrito
  pick(ctx, x, y, s, rot = 0) {
    ctx.save(); ctx.translate(x, y); ctx.scale(s, s); ctx.rotate(rot);
    ctx.strokeStyle = '#000'; ctx.lineWidth = 2.5; ctx.lineJoin = 'round';
    ctx.fillStyle = '#8a5a2b'; ctx.beginPath(); ctx.moveTo(-3, 18); ctx.lineTo(3, 18); ctx.lineTo(3, -8); ctx.lineTo(-3, -8); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#ff6a1f'; ctx.beginPath(); ctx.moveTo(-18, -2); ctx.quadraticCurveTo(0, -20, 18, -2); ctx.quadraticCurveTo(0, -12, -18, -2); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#ffd25a'; ctx.beginPath(); ctx.arc(-4, -10, 2, 0, TAU); ctx.arc(6, -9, 1.5, 0, TAU); ctx.fill();
    ctx.restore();
  },
  // Pepinillo (cura un corazón)
  pickle(ctx, x, y, s, t) {
    ctx.save(); ctx.translate(x, y); ctx.rotate(Math.sin(t * 3) * 0.25 + 0.5);
    ctx.fillStyle = '#5aa83a'; ctx.strokeStyle = '#000'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.ellipse(0, 0, s * 0.5, s, 0, 0, TAU); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#8fd46a'; for (let i = 0; i < 4; i++) { ctx.beginPath(); ctx.arc(-s * 0.15 + (i % 2) * s * 0.3, -s * 0.6 + i * s * 0.38, s * 0.1, 0, TAU); ctx.fill(); }
    ctx.restore();
    this.heart(ctx, x + s * 0.7, y - s * 0.8, s * 0.9, '#ff2d55');
  },
});

// Genera (y guarda) las imágenes de bloques para un tema a cierta escala.
TileCache.get = function (themeName, S) {
  const key = themeName + '@' + S.toFixed(3);
  if (this.cache[key]) return this.cache[key];
  const th = THEMES[themeName], st = th.style;
  const px = Math.ceil(TILE * S);
  const mk = (fn) => {
    const c = document.createElement('canvas'); c.width = px; c.height = px;
    const g = c.getContext('2d'); g.scale(px / TILE, px / TILE); fn(g); return c;
  };
  const rnd = mulberry32(themeName.length * 99 + 7);
  const speckles = (g, col, n, a = 0.35) => { g.fillStyle = col; g.globalAlpha = a; for (let i = 0; i < n; i++) g.fillRect(rnd() * 30, 6 + rnd() * 24, 2 + rnd() * 3, 2 + rnd() * 2); g.globalAlpha = 1; };
  const [cTop, cFill, cDark] = th.ground;
  const T = {};
  const fillStyle = (g) => {
    g.fillStyle = cFill; g.fillRect(0, 0, TILE, TILE);
    if (st === 'checker') { g.fillStyle = cDark; g.fillRect(0, 0, 16, 16); g.fillRect(16, 16, 16, 16); }
    else if (st === 'metal') { g.fillStyle = cDark; g.fillRect(0, 15, TILE, 2); g.fillRect(15, 0, 2, 15); g.fillStyle = 'rgba(255,255,255,0.35)'; for (const [x, y] of [[4, 4], [27, 4], [4, 27], [27, 27]]) g.fillRect(x, y, 2, 2); }
    else if (st === 'waffle') { g.fillStyle = cDark; for (let i = 0; i < 4; i++) { g.fillRect(i * 8, 0, 2, TILE); g.fillRect(0, i * 8, TILE, 2); } }
    else if (st === 'cookie') { TileCache.bricks(g, cFill, cDark); g.fillStyle = '#4a2a14'; for (let i = 0; i < 3; i++) { g.beginPath(); g.arc(5 + rnd() * 22, 5 + rnd() * 22, 2.2, 0, TAU); g.fill(); } }
    else if (st === 'rock') { speckles(g, cDark, 8, 0.7); g.strokeStyle = cDark; g.lineWidth = 1.5; g.beginPath(); g.moveTo(3, 20); g.lineTo(12, 15); g.lineTo(20, 22); g.stroke(); }
    else if (st === 'neon') { g.strokeStyle = 'rgba(180,90,255,0.5)'; g.lineWidth = 1.5; g.strokeRect(3, 3, TILE - 6, TILE - 6); }
    else if (st === 'paper') { g.strokeStyle = 'rgba(0,0,0,0.12)'; g.lineWidth = 1; for (let y = 6; y < TILE; y += 8) { g.beginPath(); g.moveTo(0, y); g.lineTo(TILE, y); g.stroke(); } }
    else if (st === 'missing') { g.fillStyle = '#000'; g.fillRect(0, 0, TILE, TILE); g.fillStyle = '#ff00d4'; g.fillRect(0, 0, 16, 16); g.fillRect(16, 16, 16, 16); }
    else if (st === 'tiles') { g.fillStyle = cFill; g.fillRect(0, 0, TILE, TILE); g.fillStyle = '#ffffff'; g.fillRect(0, 0, 16, 16); g.fillRect(16, 16, 16, 16); g.fillStyle = 'rgba(0,0,0,0.15)'; g.fillRect(0, 15, TILE, 1); g.fillRect(15, 0, 1, TILE); }
    else if (st === 'bread') { speckles(g, '#fff0c8', 6, 0.6); speckles(g, cDark, 4, 0.4); }
    else if (st === 'salt') { g.fillStyle = cDark; for (let i = 0; i < 5; i++) { const x = rnd() * 28, y = rnd() * 28; g.fillRect(x, y, 3, 3); } g.fillStyle = '#fff'; g.fillRect(rnd() * 26, rnd() * 26, 4, 4); }
    else if (st === 'circuit') { g.strokeStyle = 'rgba(0,255,156,0.45)'; g.lineWidth = 1.5; g.beginPath(); g.moveTo(0, 10); g.lineTo(12, 10); g.lineTo(18, 22); g.lineTo(32, 22); g.moveTo(8, 32); g.lineTo(8, 26); g.stroke(); g.fillStyle = '#00ff9c'; g.fillRect(11, 8, 4, 4); }
    else if (st === 'kitchen') { g.fillStyle = cFill; g.fillRect(0, 0, TILE, TILE); g.fillStyle = '#f2f2f2'; g.fillRect(0, 0, 16, 16); g.fillRect(16, 16, 16, 16); }
    else speckles(g, cDark, 7, 0.6);
  };
  T.fill = mk(fillStyle);
  T.top = mk((g) => {
    g.drawImage(T.fill, 0, 0, TILE, TILE);
    g.fillStyle = cTop;
    if (st === 'metal' || st === 'tiles' || st === 'kitchen' || st === 'circuit' || st === 'missing') { g.fillRect(0, 0, TILE, 5); }
    else if (st === 'cookie' || st === 'bread' || st === 'waffle') { g.beginPath(); g.moveTo(0, 0); g.lineTo(TILE, 0); g.lineTo(TILE, 6); for (let x = TILE; x >= 0; x -= 8) g.quadraticCurveTo(x - 4, 11, x - 8, 6); g.closePath(); g.fill(); }
    else if (st === 'salt' || st === 'paper') { g.fillRect(0, 0, TILE, 7); }
    else { g.beginPath(); g.moveTo(0, 0); g.lineTo(TILE, 0); g.lineTo(TILE, 9); for (let x = TILE; x >= 0; x -= 4) g.lineTo(x, 9 + ((x / 4) % 2 ? 3 : 0)); g.closePath(); g.fill(); }
    g.fillStyle = 'rgba(255,255,255,0.3)'; g.fillRect(0, 0, TILE, 2.5);
  });
  T.block = mk((g) => {
    g.fillStyle = th.block; g.fillRect(0, 0, TILE, TILE);
    if (st === 'checker') {

      g.fillStyle = shade(th.block, -0.25); g.fillRect(0, 26, TILE, 6); g.fillRect(26, 0, 6, TILE);
      g.fillStyle = 'rgba(255,255,255,0.5)'; g.fillRect(3, 3, 22, 3);
      g.fillStyle = '#fff'; g.font = '900 18px Arial'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText('★', 14, 15);
    } else if (st === 'metal' || st === 'circuit' || st === 'kitchen') {
      g.fillStyle = shade(th.block, 0.15); g.fillRect(2, 2, TILE - 4, TILE - 4);
      g.strokeStyle = shade(th.block, -0.35); g.lineWidth = 2; g.strokeRect(5, 5, TILE - 10, TILE - 10);
      g.fillStyle = shade(th.block, -0.4); for (const [x, y] of [[6, 6], [24, 6], [6, 24], [24, 24]]) g.fillRect(x, y, 2.5, 2.5);
    } else if (st === 'waffle' || st === 'bread') {
      g.fillStyle = shade(th.block, -0.3); for (let i = 1; i < 4; i++) { g.fillRect(i * 8 - 1, 0, 2.5, TILE); g.fillRect(0, i * 8 - 1, TILE, 2.5); }
    } else if (st === 'cookie') {
      g.fillStyle = shade(th.block, -0.2); g.beginPath(); g.arc(16, 16, 14, 0, TAU); g.fill();
      g.fillStyle = '#4a2a14'; for (const [x, y] of [[10, 10], [20, 13], [13, 21], [22, 22]]) { g.beginPath(); g.arc(x, y, 2.5, 0, TAU); g.fill(); }
    } else if (st === 'missing') {
      g.fillStyle = '#000'; g.fillRect(0, 0, TILE, TILE); g.fillStyle = '#ff00d4'; for (let i = 0; i < 4; i++) for (let j = 0; j < 4; j++) if ((i + j) % 2) g.fillRect(i * 8, j * 8, 8, 8);
    } else if (st === 'paper') {
      g.fillStyle = '#ffffff'; g.fillRect(2, 2, TILE - 4, TILE - 4); g.strokeStyle = 'rgba(0,0,0,0.2)'; g.lineWidth = 1; g.beginPath(); g.moveTo(0, 0); g.lineTo(TILE, TILE); g.stroke();
    } else if (st === 'salt') {
      g.fillStyle = '#ffffff'; g.beginPath(); g.moveTo(16, 2); g.lineTo(30, 16); g.lineTo(16, 30); g.lineTo(2, 16); g.closePath(); g.fill();
    } else if (st === 'tiles') {
      g.fillStyle = '#ffd23a'; g.fillRect(3, 3, TILE - 6, TILE - 6); g.fillStyle = '#c0392b'; g.font = '900 16px Arial'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText('M', 16, 17);
    } else {
      g.strokeStyle = shade(th.block, -0.35); g.lineWidth = 2.5; g.strokeRect(3, 3, TILE - 6, TILE - 6);
      g.beginPath(); g.moveTo(4, 4); g.lineTo(TILE - 4, TILE - 4); g.moveTo(TILE - 4, 4); g.lineTo(4, TILE - 4); g.stroke();
    }
  });
  T.plat = mk((g) => {
    g.fillStyle = th.plat; g.fillRect(0, 0, TILE, 11);
    g.fillStyle = 'rgba(255,255,255,0.35)'; g.fillRect(0, 0, TILE, 3);
    g.fillStyle = 'rgba(0,0,0,0.3)'; g.fillRect(0, 9, TILE, 2);
    g.strokeStyle = '#000'; g.lineWidth = 2; g.strokeRect(1, 1, TILE - 2, 10);
  });
  // pinchos: en el Foogame son tenedores clavados
  T.spikes = mk((g) => {
    g.fillStyle = '#d8d8e0'; g.strokeStyle = '#000'; g.lineWidth = 2; g.lineJoin = 'round';
    for (let i = 0; i < 3; i++) { g.beginPath(); g.moveTo(i * 10.67 + 1, TILE); g.lineTo(i * 10.67 + 5.33, 12); g.lineTo(i * 10.67 + 9.67, TILE); g.closePath(); g.fill(); g.stroke(); }
  });
  T.door = mk((g) => {
    g.fillStyle = '#7a4a1a'; g.fillRect(2, 0, TILE - 4, TILE);
    g.strokeStyle = '#000'; g.lineWidth = 2; g.strokeRect(2, 0, TILE - 4, TILE);
    g.fillStyle = '#ffd23a'; g.beginPath(); g.arc(TILE / 2, TILE / 2, 6, 0, TAU); g.fill(); g.stroke();
    g.fillStyle = '#000'; g.fillRect(TILE / 2 - 1.5, TILE / 2 - 2, 3, 7);
  });
  // roca que se rompe con el pico (Minero)
  T.mine = mk((g) => {
    g.fillStyle = '#8a7a6a'; g.fillRect(0, 0, TILE, TILE);
    g.fillStyle = '#6a5a4a'; g.beginPath(); g.moveTo(0, 20); g.lineTo(10, 14); g.lineTo(22, 18); g.lineTo(32, 10); g.lineTo(32, 32); g.lineTo(0, 32); g.fill();
    g.strokeStyle = '#2a201a'; g.lineWidth = 2; g.beginPath(); g.moveTo(6, 4); g.lineTo(12, 12); g.lineTo(9, 20); g.moveTo(12, 12); g.lineTo(22, 9); g.lineTo(27, 16); g.stroke();
    g.fillStyle = '#ff8a3a'; for (const [x, y] of [[20, 24], [6, 26], [26, 4]]) { g.beginPath(); g.arc(x, y, 2.5, 0, TAU); g.fill(); }
    g.strokeStyle = '#000'; g.lineWidth = 2; g.strokeRect(1, 1, TILE - 2, TILE - 2);
  });
  // compuerta (se abre con un botón)
  T.gate = mk((g) => {
    g.fillStyle = '#ffcf1a'; g.fillRect(4, 0, TILE - 8, TILE);
    g.fillStyle = '#2a2a2a'; for (let y = -8; y < TILE; y += 12) { g.beginPath(); g.moveTo(4, y); g.lineTo(TILE - 4, y + 8); g.lineTo(TILE - 4, y + 14); g.lineTo(4, y + 6); g.fill(); }
    g.strokeStyle = '#000'; g.lineWidth = 2; g.strokeRect(4, 0, TILE - 8, TILE);
  });
  // bloque de mostaza (rebota)
  T.bounce = mk((g) => {
    g.fillStyle = '#ffd400'; g.beginPath(); roundRect(g, 1, 4, TILE - 2, TILE - 5, 8); g.fill();
    g.fillStyle = '#fff59a'; g.beginPath(); roundRect(g, 5, 7, TILE - 14, 5, 3); g.fill();
    g.strokeStyle = '#000'; g.lineWidth = 2; g.beginPath(); roundRect(g, 1, 4, TILE - 2, TILE - 5, 8); g.stroke();
    g.strokeStyle = '#c99a00'; g.lineWidth = 2.5; g.beginPath(); g.moveTo(6, 22); g.lineTo(11, 17); g.lineTo(16, 22); g.lineTo(21, 17); g.lineTo(26, 22); g.stroke();
  });
  // parrilla caliente
  T.grill = mk((g) => {
    g.fillStyle = '#2a2a2a'; g.fillRect(0, 0, TILE, TILE);
    g.fillStyle = '#ff5a1f'; g.fillRect(0, 2, TILE, 4);
    g.fillStyle = '#555'; for (let x = 2; x < TILE; x += 8) g.fillRect(x, 0, 4, 8);
    g.strokeStyle = '#000'; g.lineWidth = 2; g.strokeRect(1, 1, TILE - 2, TILE - 2);
  });
  this.cache[key] = T;
  return T;
};

// ======================= Fondos =======================
Object.assign(BG, {
  // ----- Fooworld: la ciudad de la comida chatarra -----
  foodCity(ctx, px, yo, t) {
    this.each(px, 150, (x, i) => {
      const k = Math.abs(i) % 4, h = 140 + hash1(i) * 150, b = VH - 70 + yo;
      ctx.fillStyle = 'rgba(200,110,90,0.45)';
      if (k === 0) { // vaso de gaseosa con pajita

      ctx.fillStyle = 'rgba(255,255,255,0.4)'; ctx.fillRect(x + 56, VH - h + yo + ((t * 90 + i * 30) % 60), 5, 26);
    });
  },
  breadRocks(ctx, px, yo, t) {
    this.each(px, 260, (x, i) => {
      const b = VH - 20 + yo, w = 90 + hash1(i) * 60, h = 50 + hash1(i * 3) * 50;
      ctx.fillStyle = '#d9963a'; ctx.beginPath(); ctx.ellipse(x, b, w, h, 0, Math.PI, TAU); ctx.fill();
      ctx.fillStyle = '#fff0c8'; for (let k = 0; k < 4; k++) { ctx.beginPath(); ctx.ellipse(x - w * 0.5 + k * w * 0.3, b - h * 0.6, 6, 3, 0.3, 0, TAU); ctx.fill(); }
    });
  },
  // ----- Salinas -----
  saltDunes(ctx, px, yo, t) {
    ctx.fillStyle = '#f8e8f0';
    this.each(px, 320, (x, i) => { const h = 80 + hash1(i) * 70; ctx.beginPath(); ctx.ellipse(x, VH - 70 + yo, 240, h, 0, Math.PI, TAU); ctx.fill(); });
    // salero gigante a lo lejos
    this.each(px, 900, (x, i) => {
      const b = VH - 120 + yo;
      ctx.fillStyle = 'rgba(220,220,235,0.8)'; ctx.fillRect(x, b - 160, 80, 160); ctx.fillStyle = 'rgba(160,170,190,0.9)'; ctx.beginPath(); ctx.arc(x + 40, b - 160, 40, Math.PI, 0); ctx.fill();
    });
  },
  saltCrystals(ctx, px, yo, t) {
    this.each(px, 200, (x, i) => {
      const b = VH - 25 + yo, h = 30 + hash1(i) * 50;
      ctx.fillStyle = 'rgba(255,255,255,0.9)'; ctx.strokeStyle = 'rgba(180,170,200,0.8)'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(x - 14, b); ctx.lineTo(x - 8, b - h); ctx.lineTo(x + 4, b - h - 12); ctx.lineTo(x + 14, b); ctx.closePath(); ctx.fill(); ctx.stroke();
    });
  },
  // ----- Servidores MaJo -----
  dataRain(ctx, px, yo, t) {
    setFont(ctx, 12, 700); ctx.textAlign = 'center';
    this.each(px, 28, (x, i) => {
      const sp = 40 + hash1(i) * 80, off = (t * sp + hash1(i * 3) * 600) % (VH + 200) - 100;
      for (let k = 0; k < 6; k++) { ctx.fillStyle = `rgba(0,255,156,${0.5 - k * 0.08})`; ctx.fillText(hash1(i * 7 + k + Math.floor(t * 4)) > 0.5 ? '1' : '0', x, off - k * 14); }
    });
  },
  serverRacks(ctx, px, yo, t) {
    this.each(px, 180, (x, i) => {
      const b = VH - 30 + yo;
      ctx.fillStyle = '#0a1622'; ctx.fillRect(x, b - 220, 90, 220); ctx.strokeStyle = '#1a3a5a'; ctx.lineWidth = 2; ctx.strokeRect(x, b - 220, 90, 220);
      for (let k = 0; k < 9; k++) {
        ctx.fillStyle = '#12263a'; ctx.fillRect(x + 6, b - 212 + k * 23, 78, 18);
        ctx.fillStyle = Math.sin(t * 5 + k * 1.7 + i) > 0.3 ? '#00ff9c' : '#0a5a3a'; ctx.fillRect(x + 70, b - 206 + k * 23, 6, 6);
      }
      if (Math.abs(i) % 3 === 0) { setFont(ctx, 14, 900); ctx.fillStyle = '#00ff9c'; ctx.textAlign = 'center'; ctx.fillText('MaJo', x + 45, b - 230); }
    });
  },
  // ----- Mundo Countryball -----
  cbHills(ctx, px, yo, t) {
    ctx.fillStyle = '#a9c7e8';
    this.each(px, 340, (x, i) => {
      const h = 140 + hash1(i) * 90;
      ctx.beginPath(); ctx.moveTo(x - 200, VH - 120 + yo); ctx.lineTo(x, VH - 120 - h + yo); ctx.lineTo(x + 200, VH - 120 + yo); ctx.fill();
    });
    ctx.fillStyle = '#8fdc6a';
    this.each(px * 1.3, 300, (x, i) => { const h = 70 + hash1(i + 7) * 50; ctx.beginPath(); ctx.ellipse(x, VH - 50 + yo, 230, h, 0, Math.PI, TAU); ctx.fill(); });
  },
  cbHouses(ctx, px, yo, t) {
    this.each(px, 330, (x, i) => {
      const base = VH - 30 + yo;
      this.house(ctx, x, base, 100, 70, ['#f2d7a6', '#d8e6f2', '#f2e8b8'][Math.abs(i) % 3], ['#c0392b', '#3b5a7a', '#6a4a2a'][Math.abs(i) % 3], false, t, i);
      // banderas: la de Manda (celeste con círculo verde y corona) y otras
      const fx = x + 140;
      ctx.fillStyle = '#555'; ctx.fillRect(fx, base - 130, 4, 130);
      const w = Math.sin(t * 4 + i) * 3;
      if (Math.abs(i) % 2 === 0) BG.mandaFlag(ctx, fx + 4, base - 130, 50, 32, w);
      else { ctx.fillStyle = '#2b2b2b'; ctx.fillRect(fx + 4, base - 130, 50, 32); ctx.strokeStyle = '#fff'; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.moveTo(fx + 18, base - 122); ctx.quadraticCurveTo(fx + 16, base - 104, fx + 26, base - 106); ctx.lineTo(fx + 36, base - 122); ctx.lineTo(fx + 44, base - 122); ctx.stroke(); }
    });
  },
  // la bandera de Manda (sacada del boceto)
  mandaFlag(ctx, x, y, w, h, wave = 0) {
    ctx.save(); ctx.translate(x, y);
    ctx.fillStyle = '#04a0ff'; ctx.beginPath(); ctx.moveTo(0, 0); ctx.quadraticCurveTo(w / 2, wave, w, 0); ctx.lineTo(w, h); ctx.quadraticCurveTo(w / 2, h + wave, 0, h); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#00ffaa'; ctx.beginPath(); ctx.arc(w * 0.47, h / 2 + wave * 0.5, h * 0.36, 0, TAU); ctx.fill();
    ctx.fillStyle = '#0040ff'; ctx.beginPath();
    const cx = w * 0.47, cy = h / 2 + wave * 0.5, s = h * 0.22;
    ctx.moveTo(cx - s, cy + s * 0.7); ctx.lineTo(cx - s, cy - s * 0.7); ctx.lineTo(cx - s * 0.4, cy); ctx.lineTo(cx, cy - s * 0.9); ctx.lineTo(cx + s * 0.4, cy); ctx.lineTo(cx + s, cy - s * 0.7); ctx.lineTo(cx + s, cy + s * 0.7); ctx.closePath(); ctx.fill();
    ctx.restore();
  },
  // ----- La Cocina Infinita -----
  giantKitchen(ctx, px, yo, t) {
    ctx.fillStyle = '#2a1a1a';
    this.each(px, 64, (x, i) => { ctx.fillStyle = i % 2 ? '#2a1a1e' : '#321e22'; ctx.fillRect(x, 0, 64, VH); });
    this.each(px, 480, (x, i) => {
      const b = VH - 140 + yo;
      // olla gigante con vapor
      ctx.fillStyle = '#6a7482'; ctx.beginPath(); roundRect(ctx, x, b - 120, 180, 120, 14); ctx.fill();
      ctx.fillStyle = '#4a525e'; ctx.fillRect(x - 20, b - 110, 22, 14); ctx.fillRect(x + 178, b - 110, 22, 14);
      ctx.fillStyle = 'rgba(255,255,255,0.15)';
      for (let k = 0; k < 4; k++) { ctx.beginPath(); ctx.arc(x + 40 + k * 35 + Math.sin(t + k) * 10, b - 140 - ((t * 25 + k * 25) % 100), 20 + k * 3, 0, TAU); ctx.fill(); }
      this.flames(ctx, x + 90, b + 10, 140, 26, t + i);
    });
  },
  shelves(ctx, px, yo, t) {
    this.each(px, 300, (x, i) => {
      const y = 90 + hash1(i) * 60 + yo;
      ctx.fillStyle = '#5a3a2a'; ctx.fillRect(x, y, 200, 10);
      for (let k = 0; k < 4; k++) { ctx.fillStyle = ['#c0392b', '#f2f2f2', '#ffd23a', '#3aa0ff'][k]; ctx.fillRect(x + 12 + k * 46, y - 40, 30, 40); }
    });
  },
  // ----- Torre del Apetito -----
  towerInside(ctx, px, yo, t) {
    ctx.fillStyle = '#1a1028';
    this.each(px, 64, (x, i) => { ctx.fillStyle = i % 2 ? '#1a1028' : '#20142e'; ctx.fillRect(x, 0, 64, VH); });
    const g = ctx.createLinearGradient(0, VH * 0.6, 0, VH);
    g.addColorStop(0, 'rgba(255,0,212,0)'); g.addColorStop(1, `rgba(255,0,212,${0.25 + Math.sin(t * 2) * 0.08})`);
    ctx.fillStyle = g; ctx.fillRect(0, 0, VW, VH);
  },
  chains(ctx, px, yo, t) {
    ctx.strokeStyle = 'rgba(120,110,140,0.6)'; ctx.lineWidth = 5; ctx.setLineDash([10, 6]);
    this.each(px, 260, (x, i) => { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x + Math.sin(t + i) * 10, VH); ctx.stroke(); });
    ctx.setLineDash([]);
  },
  // ----- El final: la cocina cósmica del Cocinero -----
  cosmicKitchen(ctx, px, yo, t) {
    for (let i = 0; i < 60; i++) { ctx.fillStyle = `rgba(255,255,255,${0.4 + 0.4 * Math.sin(t * 2 + i)})`; ctx.fillRect((hash1(i) * VW * 1.5 - px * 0.1 + VW * 2) % VW, hash1(i + 70) * VH, 2, 2); }
    this.each(px, 520, (x, i) => {
      const y = 120 + hash1(i) * 200 + yo;
      ctx.fillStyle = 'rgba(240,240,250,0.25)'; ctx.beginPath(); ctx.ellipse(x, y, 90, 30, 0, 0, TAU); ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,0.3)'; ctx.lineWidth = 3; ctx.beginPath(); ctx.ellipse(x, y, 60, 18, 0, 0, TAU); ctx.stroke();
    });
  },
});

// Pasto alto y florcitas encima del suelo (Fooworld, Huertos, Mundo Countryball)
const GrassDeco = {
  draw(ctx, lv, x0, x1, y0, y1) {
    if (!THEMES[lv.theme].grassy) return;
    for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) {
      if (lv.tiles[y][x] !== '#' || (y > 0 && lv.tiles[y - 1][x] !== ' ')) continue;
      const h = hash1(x * 13 + y * 7);
      const px = x * TILE, py = y * TILE;
      ctx.strokeStyle = '#3fa832'; ctx.lineWidth = 2;
      ctx.beginPath();
      for (let k = 0; k < 4; k++) { const gx = px + 4 + k * 8 + h * 3, sw = Math.sin(lv.t * 2 + x + k) * 2; ctx.moveTo(gx, py + 2); ctx.lineTo(gx + sw, py - 5 - ((k + Math.floor(h * 4)) % 3) * 2); }
      ctx.stroke();
      if (h > 0.78) { ctx.fillStyle = ['#ff6fa8', '#ffe14d', '#ffffff', '#b07aff'][Math.floor(h * 97) % 4]; ctx.beginPath(); ctx.arc(px + 16 + h * 8, py - 6, 3, 0, TAU); ctx.fill(); }
    }
  },
};
