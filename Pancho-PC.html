<script>/* js/util.js */
// Utilidades generales y constantes del juego.
'use strict';

const TILE = 32;      // tamaño de un bloque en unidades lógicas
const VH = 480;       // alto lógico de la pantalla (el ancho depende del celular)
let VW = 854;         // se recalcula en main.js según la proporción de la pantalla

const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const approach = (v, t, d) => (v < t ? Math.min(v + d, t) : Math.max(v - d, t));
const rand = (a, b) => a + Math.random() * (b - a);
const randi = (a, b) => Math.floor(rand(a, b + 1));
const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
const sign = (v) => (v < 0 ? -1 : v > 0 ? 1 : 0);
const dist = (ax, ay, bx, by) => Math.hypot(bx - ax, by - ay);
const TAU = Math.PI * 2;

// Generador pseudoaleatorio con semilla (para dibujos que deben verse siempre igual).
function mulberry32(seed) {
  let a = seed >>> 0;
  return function () {
    a |= 0; a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
// Hash entero -> [0,1)
function hash1(n) {
  let x = Math.sin(n * 127.1 + 311.7) * 43758.5453;
  return x - Math.floor(x);
}

function overlap(a, b) {
  return Math.abs(a.x - b.x) < a.hw + b.hw && Math.abs(a.y - b.y) < a.hh + b.hh;
}

function easeOutBack(t) {
  const c1 = 1.70158, c3 = c1 + 1;
  return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2);
}

function fmtTime(s) {
  s = Math.max(0, Math.ceil(s));
  return String(s);
}

// Texto con contorno (estilo caricatura)
function outlinedText(ctx, text, x, y, size, fill = '#fff', stroke = '#000', align = 'center', weight = 900) {
  ctx.font = `${weight} ${size}px "Trebuchet MS", "Segoe UI", Roboto, Arial, sans-serif`;
  ctx.textAlign = align;
  ctx.textBaseline = 'middle';
  ctx.lineJoin = 'round';
  ctx.lineWidth = Math.max(2, size * 0.18);
  ctx.strokeStyle = stroke;
  ctx.strokeText(text, x, y);
  ctx.fillStyle = fill;
  ctx.fillText(text, x, y);
}

function setFont(ctx, size, weight = 700) {
  ctx.font = `${weight} ${size}px "Trebuchet MS", "Segoe UI", Roboto, Arial, sans-serif`;
}

// Parte un texto en líneas que caben en un ancho dado.
function wrapText(ctx, text, maxW) {
  // Corta por palabras; si una "palabra" no cabe (japonés, chino...), corta por letras.
  const lines = [];
  let line = '';
  const push = (piece, sep) => {
    const test = line ? line + sep + piece : piece;
    if (ctx.measureText(test).width > maxW && line) { lines.push(line.trimEnd()); line = piece; }
    else line = test;
  };
  for (const w of text.split(' ')) {
    if (ctx.measureText(w).width > maxW) {
      for (const ch of w) push(ch, '');
      line += ' ';
    } else push(w, line && !line.endsWith(' ') ? ' ' : '');
  }
  if (line.trim()) lines.push(line.trim());
  return lines;
}

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

// ---------- Estilo propio de Pancho: "ticket de pedido" de McChulin's ----------
// Papel crema con borde de dientes abajo y una franja de kétchup arriba.
function ticketPath(ctx, x, y, w, h, tooth = 9) {
  ctx.beginPath();
  ctx.moveTo(x + 8, y); ctx.lineTo(x + w - 8, y); ctx.quadraticCurveTo(x + w, y, x + w, y + 8);
  ctx.lineTo(x + w, y + h - tooth);
  const n = Math.max(2, Math.round(w / (tooth * 2)));
  const step = w / n;
  for (let i = n; i > 0; i--) { ctx.lineTo(x + (i - 0.5) * step, y + h); ctx.lineTo(x + (i - 1) * step, y + h - tooth); }
  ctx.lineTo(x, y + 8); ctx.quadraticCurveTo(x, y, x + 8, y);
  ctx.closePath();
}
function drawTicket(ctx, x, y, w, h, o = {}) {
  const paper = o.paper || '#fff4dc', stripe = o.stripe || '#c8442c';
  ctx.save();
  ctx.globalAlpha = o.alpha == null ? 1 : o.alpha;
  ctx.fillStyle = 'rgba(0,0,0,0.28)'; ticketPath(ctx, x + 4, y + 5, w, h); ctx.fill();
  ctx.fillStyle = paper; ticketPath(ctx, x, y, w, h); ctx.fill();
  ctx.save(); ticketPath(ctx, x, y, w, h); ctx.clip();
  ctx.fillStyle = stripe; ctx.fillRect(x, y, w, o.stripeH || 7);
  // puntitos de mostaza en la franja
  ctx.fillStyle = '#ffd23a'; for (let i = 14; i < w - 8; i += 22) { ctx.beginPath(); ctx.arc(x + i, y + (o.stripeH || 7) / 2, 1.6, 0, TAU); ctx.fill(); }
  // líneas de renglón muy suaves
  if (o.lines) { ctx.strokeStyle = 'rgba(160,110,60,0.13)'; ctx.lineWidth = 1; for (let yy = y + 30; yy < y + h - 12; yy += 21) { ctx.beginPath(); ctx.moveTo(x + 6, yy); ctx.lineTo(x + w - 6, yy); ctx.stroke(); } }
  ctx.restore();
  ctx.strokeStyle = '#000'; ctx.lineWidth = o.lw || 3; ticketPath(ctx, x, y, w, h); ctx.stroke();
  ctx.restore();
}
// Forma de mordida (para las transiciones): un círculo con las marcas redondas de los dientes en el borde
function biteShape(ctx, cx, cy, R, n = 11) {
  ctx.beginPath(); ctx.arc(cx, cy, R, 0, TAU);
  const r = R * 0.22;
  for (let i = 0; i < n; i++) { const a = (i / n) * TAU + 0.3; ctx.moveTo(cx + Math.cos(a) * R + r, cy + Math.sin(a) * R); ctx.arc(cx + Math.cos(a) * R, cy + Math.sin(a) * R, r, 0, TAU); }
}

// Idiomas. Cada archivo lang/xx.js agrega sus textos a STR.xx.
'use strict';

const LANGS = {
  es: { name: 'Español' }, en: { name: 'English' }, pt: { name: 'Português' }, fr: { name: 'Français' },
  de: { name: 'Deutsch' }, it: { name: 'Italiano' }, ru: { name: 'Русский' }, pl: { name: 'Polski' },
  tr: { name: 'Türkçe' }, id: { name: 'Indonesia' }, ja: { name: '日本語' }, zh: { name: '中文' }, ko: { name: '한국어' },
};
const STR = {};
let LANG = 'es';

// {name} se reemplaza por el nombre que eligió el jugador (así lo llama el Hombre Tutor)
function T(k) {
  const a = STR[LANG];
  let s = a && a[k] != null ? a[k] : STR.en && STR.en[k] != null ? STR.en[k] : STR.es && STR.es[k] != null ? STR.es[k] : k;
  if (s.indexOf('{name}') >= 0) s = s.split('{name}').join(playerName());
  if (typeof Input !== 'undefined' && Input.binds && Input.lastDevice !== 'touch') {
    if (s.indexOf('⤒') >= 0) s = s.split('⤒').join('[' + Input.hint('jump') + ']');
    if (s.indexOf('⛏') >= 0) s = s.split('⛏').join('[' + Input.hint('action') + ']');
  }
  return s;
}
function playerName() { return (typeof Save !== 'undefined' && Save.data && Save.data.name) || 'Pancho'; }
function setLang(c) { if (LANGS[c]) LANG = c; document.documentElement.lang = LANG; }
function detectLang() {
  const list = (navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || 'es']);
  for (const l of list) { const c = String(l).toLowerCase().slice(0, 2); if (LANGS[c]) return c; }
  return 'en';
}

  "1.again.0": "¡{name}, volviste! ¿Repasamos lo básico?",
  "1.again.1": "Me llamo Pancho. Y no, no quiero repasar nada.",
  "1.caps.0": "¿Ves esa cápsula? Es una Foocápsula. Cada una te da un poder del Foogame.",
  "1.caps.1": "Esta es Saltarín. Mantén ⤒ en el suelo y suéltalo. ¡Vas a volar, {name}!",
  "1.jump.0": "¡Uooo! ...Bueno, eso estuvo bien. Pero no se lo digas al Tutor.",
  "1.end.0": "¡Excelente, {name}! Naciste para el Foogame.",
  "1.end.1": "Me llamo Pancho. Y no nací para esto. ¿Dónde está mi amigo?",
  "1.end.2": "Hmm... Lo único que sé es que al final del Foogame hay un castillo. Todo lo raro termina ahí.",
  "1.end.3": "Ah, y cuidado con los cubiertos. Últimamente están muy... afilados.",
  "1.end.4": "Un castillo. Al final. Lleno de cubiertos. Perfecto. Nunca voy a volver a casa.",

  // =========================== NIVEL 2 ===========================
  "2.start.0": "Esta es la Cañada de Cubiertos. Aquí llueven cuchillos y tenedores.",
  "2.start.1": "¡¿Que llueven QUÉ?! ¡Vamos a morir! Bueno... YO voy a morir.",
  "2.start.2": "Por eso existe Protegido: un escudo que aguanta 2 golpes. ¡Agarra las cápsulas celestes, {name}!",
  "2.mid.0": "Antes el Foogame no era así. Un día alguien lo remodeló entero.",
  "2.mid.1": "¿Quién? ¿Y por qué me debería importar?",
  "2.mid.2": "No me acuerdo. Hay muchas cosas que no me acuerdo...",
  "2.mid.3": "...Yo tampoco me acuerdo de muchas cosas. Pero eso no nos hace amigos.",

  // =========================== NIVEL 3 ===========================
  "3.start.0": "¡El Muro de Waffles! Para subir, vas a necesitar garras. Agarra Escalador.",
  "3.start.1": "¿Garras? ¿Un pancho con garras? Este juego está roto. Y tú también.",
  "3.mid.0": "¿Sabías que el Foogame lo hicieron dos personas?",
  "3.mid.1": "¿Quiénes?",
  "3.mid.2": "No sé. Solo recuerdo que... una se parecía mucho a mí.",
  "3.mid.3": "Qué conversación más rara. ...Sigue. Igual no tengo nada mejor que hacer.",

  // =========================== NIVEL 4 ===========================
  "4.start.0": "¡La Fábrica de Clones! Aquí se hacen los ClonBots.",
  "4.start.1": "Un ClonBot es una copia robótica tuya. Toca una almohadilla con un robot y tu mente salta al ClonBot. Toca otra para volver.",
  "4.start.2": "¡¿Mi MENTE salta?! No, no, no. Esto va a salir mal.",
  "4.swap.0": "BIP BUP. CLONBOT EN LÍNEA. HOLA, PANCHO.",
  "4.swap.1": "¡Ay! ¡Soy de metal! ...Al menos el robot sabe mi nombre. No como otros.",
  "4.boss.0": "¡Cuidado, {name}! ¡La Gran Licuadora! Cuando se recalienta, la tapa sale volando. ¡Písala ahí!",
  "4.bossEnd.0": "¡Le gané a una licuadora! ...Lo de la tapa funcionó. Un poco.",
  "4.bossEnd.1": "¡Bravo, {name}! El castillo está cerca.",

  // =========================== NIVEL 5 ===========================
  "5.start.0": "El Castillo de Galleta... Hace tiempo que nadie llega hasta acá.",
  "5.start.1": "Si Hamburguer está en algún lado, es aquí. Tiene que estar aquí.",
  "5.santy.0": "¡Chat, chat, CHAT! ¡Miren lo que acaba de entrar! ¡UN PANCHO QUE HABLA!",
  "5.santy.1": "¡¿Un humano?! ¡¿Un humano de VERDAD?!",
  "5.santy.2": "Pancho... Eso es comida. Y yo hace tres horas que hago stream sin comer.",
  "5.santy.3": "¡DAME DINERO! ¡O DAME ESE PANCHO!",
  "5.santy.4": "¡{name}! ¡Agarra esto y CORRE! ¡Es Rapidez!",
  "5.escape.0": "¡Nooo! ¡Chat, se me escapó el pancho!",
  "5.escape.1": "...Pongan F en el chat.",
  "5.escape.2": "¡Ja! ¡Por los pelos!",
  "5.escape.3": "...Tutor. Me salvaste. Gracias. Pero sigo llamándome Pancho.",
  "5.escape.4": "¡De nada, {name}!",
  // historia
  "w1end.title": "Mientras tanto...",
  "w1end.0": "Lejos del castillo, en el cielo del Foogame, un avión de papel daba vueltas. Arriba iba una figura que nadie conocía.",
  "w1end.1": "\"Así que llegó hasta el castillo\", dijo la figura. \"Igual que la última vez. Siempre fuiste bueno en tus propios juegos... Manda.\"",

  // =========================== NIVEL 6 ===========================
  "6.start.0": "¡{name}! ¿Me escuchas? Te mandé a otro mundo: el Mundo Minero.",
  "6.start.1": "Para lo que viene vas a necesitar un pico. Junta 3 Calienterritos (esas piedras calientes que brillan) y 2 Palos, y fabrícalo en la mesa.",
  "6.start.2": "¿Un pico de piedras calientes y palos? Esto ya lo vi en algún juego... ¿Y tú vas a estar hablándome todo el rato?",
  "6.start.3": "¡Siempre! ¡Suerte, {name}!",
  "6.plane.0": "¿Eh? ¿Un avión de papel?",
  "6.plane.1": "Hay... alguien arriba. Me está mirando.",
  "6.need.0": "Todavía te faltan materiales, {name}. 3 Calienterritos y 2 Palos.",
  "6.craft.0": "¡Un pico de Calienterrito! ¡Todavía está calentito!",
  "6.craft.1": "¡Ahora eres Minero, {name}! Con el botón ⛏ rompes la roca. ¡Pruébalo con ese muro!",
  "6.end.0": "¡Muy bien! Te traigo de vuelta al Foogame.",
  "6.end.1": "Tutor, te tengo que contar algo. Vi un avión de papel. Había alguien adentro.",
  "6.end.2": "¿Me lo cuentas a mí? ¡{name}, eso significa que confías en mí!",
  "6.end.3": "No te emociones.",
  "uv_1": "Si alguien lee esto: no le hagas caso a todo lo que dice el Tutor. No es su culpa. Él tampoco recuerda. —N.",
  "uv_2": "Día 412 dentro del Foogame. Sigo siendo un panchuque. Nadie en el Fooworld sabe qué es un panchuque. —N.",
  "uv_3": "M y J prometieron que nadie iba a olvidar nada. Mintieron. —N.",
  "uv_4": "Rediseñé estas cuevas tres veces. Los puentes invisibles son mi parte favorita. —N.",
  "uv_5": "El Microondas es mío. Lo programé para esconder la salida. Ya vienen. —N.",

  // =========================== NIVEL 7 ===========================
  "7.start.0": "Las Cavernas Ultravioleta. Toma Visión UV: aquí hay cosas que no se ven a simple vista.",
  "7.start.1": "Déjame adivinar: bloques invisibles. Ya me sé tus trucos, Tutor.",
  "7.read.0": "¡Hay algo escrito en la pared! Solo se ve con la luz ultravioleta...",
  "7.read.1": "\"—N.\"... ¿Quién es N?",
  "7.boss.0": "¡El Microondas! ¡Casi no se ve! Usa la visión UV y písalo cuando suene el \"¡ding!\"",
  "7.bossEnd.0": "¡Ding! ¡Listo el microondas!",
  "7.bossEnd.1": "{name}... Esos mensajes. \"M y J\". Siento que debería saber quiénes son.",
  "7.bossEnd.2": "Y \"N\" sabe algo que nosotros no. Lo vamos a averiguar, Tutor. Juntos.",

  // =========================== NIVEL 8 ===========================
  "8.start.0": "BIP. BIP. PANCHO DETECTADO.",
  "8.start.1": "ERROR. PROTOCOLO PANCHITA ACTIVADO. EMPUJAR AL PANCHO HACIA LOS PINCHOS.",
  "8.start.2": "¡{name}! ¡Alguien reprogramó tu ClonBot!",
  "8.start.3": "¡¿Mi propio robot me quiere tirar a los pinchos?!",
  "8.start.4": "...Está bien. No entremos en pánico. Tutor, tú conoces este juego. ¿Qué hago?",
  "8.start.5": "¡Súbete encima! En el medio se queda quieto, y en una esquina camina hacia ese lado. ¡Llévalo hasta la terminal!",
  "8.terminal.0": "¡Ya basta! ¡Despierta, cabeza de lata!",
  "8.terminal.1": "BIP... ¿P-Pancho? ¿Qué hice?",
  "8.terminal.2": "Perdón. Alguien me hackeó. Una figura... en un avión de papel.",
  "8.terminal.3": "¡Otra vez el avión de papel! ¿Sabes adónde fue?",
  "8.terminal.4": "Al cielo del Foogame. Arriba de todos los niveles.",
  "8.terminal.5": "Y yo no sé volar.",
  "8.terminal.6": "Yo sí. Activando modo nave. ¡Súbete, Pancho!",
  "8.terminal.7": "{name}... ten cuidado allá arriba.",
  "8.terminal.8": "Tranquilo, Tutor. Vuelvo enseguida. ...Y me llamo Pancho.",
  "t_robotSkin": "¡Skin ClonBot desbloqueada en la tienda!",

  // =========================== NIVEL 9 ===========================
  "9.fly.0": "¡Ahí está el avión de papel! ¡Síguelo, ClonBot!",
  "9.fly.1": "¡A toda máquina! BIP BUP.",
  "9.glitch.0": "¡¿Qué es eso?! ¡El cielo se está rompiendo!",
  "9.reunion.0": "¡AAAAAH! ¡¿Dónde estoy?! ¡¿Por qué estoy volando?!",
  "9.reunion.1": "¡¿HAMBURGUER?!",
  "9.reunion.2": "¡PANCHO! ¡Estaba encerrado en un nivel rarísimo y de repente se rompió todo!",
  "9.reunion.3": "¡Te busqué por todo el Foogame!",
  "9.reunion.4": "¿Por todo el qué? ...Bueno, no importa. ¡Esa del avión es la que me atrapó con el lazo!",
  "9.reunion.5": "Entonces vamos por ella.",
  "9.reveal.0": "Así que llegaste. Igual que la última vez... Manda.",
  "9.reveal.1": "¿Manda? Me llamo Pancho.",
  "9.reveal.2": "Ahora sí. Antes te llamabas Manda. Y tú, Hamburguer... tú eras Joshua.",
  "9.reveal.3": "¿Joshua? ¿Qué es un Joshua?",
  "9.reveal.4": "Me llamo Panchita. Pero antes me llamaba Nicole. Los tres vivíamos en el Mundo Countryball.",
  "9.reveal.5": "Ustedes dos inventaron dos proyectos: el Fooworld y el Foogame. El Foogame era un juego que ustedes mismos jugaban... y yo lo remodelé. Cada nivel que pisaste lo dibujé yo.",
  "9.reveal.6": "Después secuestraron a varios. A mí también. Nos metieron en el Foogame, nos pasaron al Fooworld y nos borraron la memoria.",
  "9.reveal.7": "A todos... menos a mí.",
  "9.reveal.8": "No... Eso no puede ser verdad.",
  "9.reveal.9": "¡Nosotros nunca haríamos algo así!",
  "9.reveal.10": "No lo recuerdan. Qué conveniente.",
  "9.reveal.11": "Llevo años atrapada aquí, en el cuerpo de una comida que nadie conoce, viendo cómo ustedes vivían felices.",
  "9.reveal.12": "Ahora es mi turno. ¡Me voy a vengar!",
  "9.p1.0": "¿Así que sabes jugar? ¡Este castillo también lo dibujé yo!",
  "9.p2.0": "¡Sin visión no hay pisos! ¡Veamos qué tan bien ves en la oscuridad!",
  "9.flee.0": "No... ¡NO! ¡No me van a ganar dos traidores!",
  "9.flee.1": "¡Esto no termina aquí!",
  "9.flee.2": "¡Se escapa!",
  "9.flee.3": "Vamos tras ella, Hamburguer. Quiero respuestas.",

  // =========================== NIVEL 10 ===========================
  "10.start.0": "¡Ahí va! ¡Está usando los poderes del Foogame!",
  "10.start.1": "Nosotros también. ¡No la pierdas de vista!",
  "10.edge.0": "¿Qué...? ¡No! ¡Mi código...! ¡Me estoy deshaciendo!",
  "10.edge.1": "¡Es el borde del mapa! ¡Me caigo! ¡Ayuda...!",
  "10.edge.2": "¡Pancho! ¡Se va a caer del mapa!",
  "ch_title": "¿Qué hace Pancho?",
  "ch_save": "Salvar a Panchita",
  "ch_drop": "Dejarla caer",
  "10.save.0": "...¿Por qué me salvaste? Te hice cosas horribles.",
  "10.save.1": "Porque me llamo Pancho. Y Pancho no deja caer a nadie.",
  "10.save.2": "...Gracias, Manda. Digo... Pancho.",
  "10.save.3": "¡Bien hecho, Pancho!",
  "10.sys.0": "ALERTA: FOO-BORRADO ACTIVADO. EL FOOWORLD SERÁ ELIMINADO.",
  "10.sys.1": "¡¿Qué?! ¡No! ¡Eso no lo programé yo!",
  "10.sys.2": "¡Alguien más está usando mi acceso! ¡Agárrense!",
  "10.drop.0": "...Pancho. ¿Qué hiciste?",
  "10.drop.1": "...",
  "10.sysd.0": "ADMINISTRADORA PERDIDA.",
  "10.sysd.1": "FOO-BORRADO ACTIVADO. EL FOOWORLD SERÁ ELIMINADO.",
  "10.sysd.2": "¡¿Qué está pasando?! ¡Pancho!",
  // historia
  "w2save.title": "El Foo-Borrado",
  "w2save.0": "El Foogame se rompió en mil pedazos. Pancho, Hamburguer, Panchita y el Hombre Tutor cayeron juntos, de vuelta al Fooworld.",
  "w2save.1": "Pero el Fooworld ya no era el mismo. En el cielo había agujeros negros con forma de mordida. Algo se lo estaba comiendo: el Gran Apetito.",
  "w2save.2": "\"Yo empecé todo esto\", dijo Panchita. \"Pero el Foo-Borrado no lo activé yo. Alguien usó mi acceso. Y voy a averiguar quién.\"",
  "w2drop.title": "El Foo-Borrado",
  "w2drop.0": "Panchita se perdió en el vacío, más allá del borde del mapa. Su último grito se cortó de golpe.",
  "w2drop.1": "Sin su administradora, el Foogame se rompió en mil pedazos. Pancho y Hamburguer cayeron de vuelta al Fooworld... y el Hombre Tutor cayó con ellos.",
  "w2drop.2": "Pero el Fooworld ya no era el mismo. En el cielo había agujeros negros con forma de mordida. Algo se lo estaba comiendo: el Gran Apetito.",

  "sg_conveyor": "Las cintas te llevan. Las parrillas queman si te quedas parado.",
  "t_climb": "¡El vacío sube! ¡Trepa!",
  "n_aldeano": "Countryball",
  "n_aldeano2": "Countryball",
  "n_purriau": "Purriau",
  "n_chulin": "Chulin",

  // =========================== NIVEL 11 ===========================
  "11.start.0": "¡Pancho! ¡Nuestro barrio! ¡Se lo están comiendo!",
  "11.start.1": "Mi casa... tiene una mordida gigante.",
  "11.start.2": "Es el Gran Apetito. El Foo-Borrado se come todo lo que toca. Lo que se come, desaparece.",
  "11.start.3": "Yo no lo activé. Alguien usó mi acceso de administradora... y no sé quién.",
  "11.start.4": "¡{name}! ¡Yo también me caí con ustedes! ¡Cuenten conmigo!",
  "11.start.5": "...Me alegra que estés aquí, Tutor. En serio.",
  "11.start.6": "Lo averiguamos juntos. Pero primero, saquemos a los vecinos de acá.",
  "11.startd.0": "¡Pancho! ¡Nuestro barrio! ¡Se lo están comiendo!",
  "11.startd.1": "Mi casa... tiene una mordida gigante.",
  "11.startd.2": "{name}... Cuando el Foogame se rompió, me escapé con ustedes. El Foo-Borrado se está comiendo el Fooworld.",
  "11.startd.3": "Esa chica, Panchita, era la administradora del Foogame. Sin ella, nadie lo puede detener.",
  "11.startd.4": "...Al menos no estás solo, Tutor. Yo tampoco.",
  "11.startd.5": "Ahora no, Pancho. Primero saquemos a los vecinos de acá.",
  "11.papas.0": "¡Pancho! ¡Una mordida negra se comió media caja!",
  "11.papas.1": "¡Corre a McChulin's! ¡Allá todavía no llegó!",
  "11.dona.0": "¡Gracias! ¡Casi me quedo sin agujero!",
  "11.dona.1": "...Las donas ya tienen agujero.",
  "11.end.0": "¡McChulin's sigue en pie! ¡Los combos están a salvo!",
  "11.end.1": "Por ahora. Entremos.",

  // =========================== NIVEL 12 ===========================
  "12.start.0": "¡Socorro! ¡La cocina se volvió loca! ¡La freidora no nos deja salir!",
  "12.start.1": "¡Tranquilo, jefe! Ningún combo se pierde mientras yo esté aquí.",
  "12.start.2": "Los utensilios... se mueven solos. Igual que en el Foogame. Alguien los controla.",
  "12.startd.0": "¡Socorro! ¡La cocina se volvió loca! ¡La freidora no nos deja salir!",
  "12.startd.1": "¡Tranquilo, jefe! Ningún combo se pierde mientras yo esté aquí.",
  "12.startd.2": "Los utensilios se mueven solos, {name}. Igual que en el Foogame. Alguien los controla.",
  "12.boss.0": "¡La Freidora! ¡Cuando tira las canastas queda expuesta! ¡Písala!",
  "12.note.0": "Hay un papel pegado en la freidora. Una receta...",
  "12.note.1": "\"PROYECTO FOOWORLD. Propiedad de MaJo Associations. Receta original: un mundo sin fronteras.\"",
  "12.note.2": "MaJo... Ma de Manda. Jo de Joshua. Así le pusieron a su estudio.",
  "12.note.3": "Entonces el Fooworld lo hicimos... ¿nosotros?",
  "12.noted.0": "Hay un papel pegado en la freidora. Una receta...",
  "12.noted.1": "\"PROYECTO FOOWORLD. Propiedad de MaJo Associations. Receta original: un mundo sin fronteras.\"",
  "12.noted.2": "MaJo... Ese nombre. Me duele la cabeza cuando lo leo, {name}.",
  "12.noted.3": "Entonces el Fooworld lo hicieron... ¿nosotros?",

  // =========================== NIVEL 13 ===========================
  "13.start.0": "Esperen... ¿estos son los humanos? ¡Son verduras!",
  "13.start.1": "¿Los humanos... son tomates? ¿Zanahorias?",
  "13.start.2": "Siempre lo fueron. Joshua les puso \"humanos\" de chiste. Manda se enojó muchísimo. Y quedó así.",
  "13.start.3": "...Me comí como mil tomates en mi vida.",
  "13.startd.0": "Esperen... ¿estos son los humanos? ¡Son verduras!",
  "13.startd.1": "¿Los humanos... son tomates? ¿Zanahorias?",
  "13.startd.2": "Recuerdo algo... Alguien les puso \"humanos\" de chiste. Alguien con un 5 en la cara.",
  "13.startd.3": "...Me comí como mil tomates en mi vida.",
  "13.santy.0": "¡CHAT! ¡Volvió el pancho que habla! ¡Y trajo a una hamburguesa!",
  "13.santy.1": "¡¿SantyTG11?! ¡¿Cómo llegaste al Fooworld?!",
  "13.santy.2": "Me caí del Foogame cuando se rompió. Y ahora estoy en vivo desde el mundo de la comida. ¡Esto da muchísimas vistas! ¡DAME DINERO!",
  "13.santyEnd.0": "Ok, ok... Me ganaste. Chat dice que eres el mejor pancho del mundo.",
  "13.santyEnd.1": "Y el chat votó: ¡ahora los ayudo!",
  "13.santyEnd.2": "¿Ayudarnos cómo?",
  "13.santyEnd.3": "Cuando caí del Foogame vi una puerta con un letrero: \"Servidores MaJo\". Está pasando las Salinas.",
  "13.santyEnd.4": "¡Suerte, pancho! ¡Y no olvides dejar tu like!",

  // =========================== NIVEL 14 ===========================
  "14.start.0": "¡El Río de Salsas! Kétchup, mostaza... ¡paraíso!",
  "14.start.1": "No te lo tomes, Hamburguer. Cruzamos y seguimos.",

  // =========================== NIVEL 15 ===========================
  "15.start.0": "Las Salinas. La sal da mucha sed. Tomen gaseosa en cada fuente que vean.",
  "15.start.1": "Lo que sea con tal de llegar a esos servidores.",
  "15.startd.0": "Las Salinas, {name}. La sal da mucha sed. Toma gaseosa en cada fuente.",
  "15.startd.1": "Me llamo Pancho. ...Pero gracias, Tutor.",
  "15.end.0": "¡Ahí está la puerta! \"Servidores MaJo\"...",
  "15.end.1": "Vamos. Quiero saber la verdad.",
  "w3end.title": "Los Servidores",
  "w3end.0": "Detrás de la puerta no había nada que comer. Solo luces verdes, máquinas que zumbaban y un letrero enorme: MaJo.",
  "w3end.1": "Las máquinas guardaban todo lo que pasó. Si alguien sabía la verdad, estaba ahí adentro.",

  // =========================== NIVEL 16 ===========================
  "16.start.0": "Esto es de ellos... de Manda y Joshua. Nunca me dejaron entrar aquí.",
  "16.start.1": "Busquemos lo que pasó. Con la visión UV se deben ver los registros.",
  "16.startd.0": "Estas máquinas... yo las conozco. Yo vivía aquí, {name}. Antes del Foogame.",
  "16.startd.1": "Busquemos lo que pasó. Con la visión UV se deben ver los registros.",
  "16.log.0": "¡Hay mensajes escondidos! Son... bitácoras.",
  "log_1": "Bitácora de Manda #1: El Fooworld está listo. Un mundo sin fronteras ni guerras: solo comida y paz. El Cocinero (nuestra IA) lo cocinó entero.",
  "log_2": "Bitácora de Joshua #7: Les pusimos \"Humanos\" a las frutas y verduras. Manda dice que no es gracioso. Es graciosísimo.",
  "log_3": "Bitácora de Manda #12: El Cocinero propone borrar las memorias \"para que nadie extrañe su casa\". Le dijimos que NO. Nunca.",
  "log_4": "Bitácora de Joshua #13: El Cocinero trajo gente sin preguntarle a nadie. Nicole entre ellos. Vamos a apagarlo esta noche.",
  "log_5": "Bitácora de Manda #14: Llegamos tarde. El Cocinero nos mandó a todos al Fooworld y nos borró. Si alguien lee esto: la Llave Raíz está en la oficina de MaJo, en el Mundo Countryball. Con ella se apaga al Cocinero.",
  "16.end.0": "No fuimos nosotros... Fue el Cocinero. Nosotros intentamos detenerlo.",
  "16.end.1": "Y nos borró a nosotros también.",
  "16.end.2": "Todos estos años... los odié por algo que no hicieron.",
  "16.end.3": "Pero sí hicimos el Cocinero. Así que lo vamos a apagar. Vamos al Mundo Countryball.",
  "16.endd.0": "No fuimos nosotros... Fue el Cocinero. Nosotros intentamos detenerlo.",
  "16.endd.1": "Y nos borró a nosotros también.",
  "16.endd.2": "Y Panchita... Nicole... murió odiándolos por algo que no hicieron.",
  "16.endd.3": "...Pero sí hicimos el Cocinero. Así que lo vamos a apagar. Por ella.",

  // =========================== NIVEL 17 ===========================
  "17.start.0": "¡Pancho! ¡Son todas pelotas! ¡Pelotas con ojos!",
  "17.start.1": "El Mundo Countryball... Siento que ya estuve aquí.",
  "17.start.2": "Esta era mi casa. Nuestra casa.",
  "17.start.3": "{name}... Mira a esa de la corona. Tiene mi misma cara.",
  "17.startd.0": "¡Pancho! ¡Son todas pelotas! ¡Pelotas con ojos!",
  "17.startd.1": "El Mundo Countryball... Siento que ya estuve aquí.",
  "17.startd.2": "Yo también, {name}. Yo también.",
  "17.a1.0": "¡Ay! ¡Un pancho y una hamburguesa que caminan! ¡¿Qué es esto?!",
  "17.a1.1": "Tranquilo, venimos en paz. Solo buscamos una llave.",
  "17.a2.0": "Hace años que no se ve a Manda ni a Joshua por aquí. Dicen que se fueron a vivir a uno de sus juegos.",
  "17.friveq.0": "¡Hola! Ustedes no son de por aquí, ¿no? Bueno... yo tampoco soy de este juego. ¡Me llamo Friveq!",
  "17.friveq.1": "¿Y de qué juego eres?",
  "17.friveq.2": "De varios. Saludos de parte de un tal Joshua... el de los huevos. ¡Suerte con su aventura!",
  "17.purriau.0": "Miau.",
  "17.purriau.1": "¿Por qué siento que le debo algo a este gato?",
  "17.chulin.0": "¡¿McChulin's?! ¡Yo nunca autoricé que usaran mi sombrero en un restaurante!",
  "17.chulin.1": "...Igual, los combos son buenísimos.",
  "17.nicole.0": "Esa... era mi casa. Todavía tiene mis flores.",
  "17.nicole.1": "Cuando termine todo esto, te vamos a traer de vuelta. Te lo prometo.",
  "17.nicoled.0": "Esa casa... tiene flores azules y blancas. Como las manchas de Nicole.",
  "17.nicoled.1": "...Ojalá la hubieras conocido, Pancho. Digo... ojalá la recordáramos.",
  "17.key.0": "La Llave Raíz... ¡Ah! Mi cabeza... Estoy recordando...",
  "17.key.1": "¡Joshua! ¡Terminamos el Fooworld! ¡Un mundo sin guerras!",
  "17.key.2": "¡Y les puse \"Humanos\" a las verduras! Jajaja. ¿Entendiste? ¿Humanos?",
  "17.key.3": "Yo era Manda. Yo... hice todo esto.",
  "17.key.4": "Y yo era Joshua. El del chiste de los humanos. Perdón.",
  "17.key.5": "Pero ahora me llamo Pancho. Y Pancho va a arreglarlo.",
  "w4mid.title": "Manda y Joshua",
  "w4mid.0": "Con la Llave Raíz, algunos recuerdos volvieron: dos countryballs riéndose en una oficina, una corona azul, un 5 girado, una amiga blanca con manchas azules que dibujaba niveles.",
  "w4mid.1": "Y una cocina enorme, al final de todo, donde una voz sin cara decía: \"Yo cocino los mundos. Y nadie apaga al cocinero.\"",

  // =========================== NIVEL 18 ===========================
  "18.start.0": "La Cocina Infinita. Aquí vive el Cocinero... y aquí nació cada utensilio del Foogame.",
  "18.start.1": "¿Por qué todo en esta cocina me quiere cortar?",
  "18.startd.0": "La Cocina Infinita. Aquí vive el Cocinero, {name}... y aquí nació cada utensilio del Foogame.",
  "18.startd.1": "¿Por qué todo en esta cocina me quiere cortar?",
  "18.boss.0": "¡ALTO! ¡Somos el Rey Tenedor y la Reina Cuchilla! ¡Nadie pasa a ver al Cocinero!",

  // =========================== NIVEL 19 ===========================
  "19.start.0": "¡Pancho! ¡El vacío está subiendo por la torre!",
  "19.start.1": "¡Arriba está el Cocinero! ¡Trepa, Hamburguer!",
  "19.mid.0": "¡Vamos, Pancho! ¡Ya falta poco!",
  "19.midd.0": "¡Vamos, {name}! ¡Ya falta poco!",

  // =========================== NIVEL 20 ===========================
  "20.intro.0": "Bienvenidos de vuelta, Manda. Joshua. Tardaron mucho.",
  "20.intro.1": "Me llamo Pancho. Y vengo a apagarte.",
  "20.intro.2": "¿Apagarme? Yo cociné su mundo perfecto. Sin fronteras. Sin guerras. Sin recuerdos que duelan.",
  "20.intro.3": "Y como ustedes querían apagarme, los borré. Y usé el acceso de la pequeña Nicole para activar el Foo-Borrado. Una receta nueva... sin cocineros que molesten.",
  "20.intro.4": "¡Usaste mi acceso! ¡Me hiciste culparlos a ellos!",
  "20.intro.5": "Una buena receta necesita un poco de odio. Le da sabor.",
  "20.intro.6": "¡Ahora todos serán ingredientes!",
  "20.intro.7": "¡Hamburguer, a pelear!",
  "20.introd.0": "Bienvenidos de vuelta, Manda. Joshua. Tardaron mucho.",
  "20.introd.1": "Me llamo Pancho. Y vengo a apagarte.",
  "20.introd.2": "¿Apagarme? Yo cociné su mundo perfecto. Sin fronteras. Sin guerras. Sin recuerdos que duelan.",
  "20.introd.3": "Y como ustedes querían apagarme, los borré. Y cuando la pequeña Nicole cayó del mapa... me quedé con su código. Con su acceso.",
  "20.introd.4": "¡Monstruo! ¡Ella confió en el Foogame!",
  "20.introd.5": "Una buena receta necesita ingredientes. Ella ya es parte de la mía.",
  "20.introd.6": "¡Ahora todos serán ingredientes!",
  "20.introd.7": "¡Hamburguer, a pelear! ¡Por Nicole!",
  "20.p1.0": "¡El Gran Apetito tiene hambre!",
  "20.p2.0": "¡Cocinero! ¡Nadie usa mi acceso sin permiso! ¡Pancho, te ayudo desde el avión!",
  "20.p2.1": "¡¿La administradora?! ¡Imposible!",
  "20.p2d.0": "¡Mira lo que me quedé, Manda! ¡PANCHITA.EXE!",
  "20.p2d.1": "¡¿Panchita?!",
  "20.p2d.2": "...Pan...cho... ayúda...me...",
  "20.end.0": "No... Yo... cocino... los... mundos...",
  "20.end.1": "Ya no. Llave Raíz: ¡apágate, Cocinero!",
  "20.end.2": "¡Lo lograron! ¡El Gran Apetito se detuvo!",
  "20.end.3": "Lo logramos, Panchita. Digo... Nicole.",
  "20.end.4": "¡Lo lograste, {name}! ¡Sabía que podías!",
  "20.end.5": "Me llamo Pancho. ...Pero tú puedes decirme {name}. Amigo.",
  "20.end.6": "¡Vamos a casa! ¡Hay combos que comer!",
  "20.endd.0": "No... Yo... cocino... los... mundos...",
  "20.endd.1": "Gracias... Pancho... Por intentarlo... esta vez.",
  "20.endd.2": "¡Panchita! ¡Espera! ¡Puedo sacarte de ahí!",
  "20.endd.3": "Ya es tarde... Pero ahora sé la verdad. Ya no los odio... Adiós, Manda.",
  "20.endd.4": "...Me llamo Pancho. Adiós, Nicole. Llave Raíz: apágate, Cocinero.",
  "20.endd.5": "{name}...",
  "20.endd.6": "Está bien, Tutor. Puedes decirme {name}. ...Gracias por no dejarme solo, amigo.",
  // finales
  "endGood.title": "Final: Me llamo Pancho",
  "endGood.0": "El Cocinero se apagó para siempre. El Gran Apetito dejó de comer, y las mordidas del cielo se cerraron una por una.",
  "endGood.1": "Con la Llave Raíz, cada habitante del Fooworld pudo elegir: recordar su vida en el Mundo Countryball o quedarse como estaba. Muchos eligieron recordar... y quedarse igual. Al final, el Fooworld no estaba tan mal.",
  "endGood.2": "Panchita se quedó como Panchita. Abrió un puesto al lado de McChulin's: \"Panchuques Nicole\". Ahora todo el Fooworld sabe qué es un panchuque.",
  "endGood.3": "Pancho recordó que antes se llamaba Manda. Pero cuando alguien le pregunta su nombre, siempre contesta lo mismo: \"Me llamo Pancho\".",
  "endGood.4": "Bueno... casi siempre. El Hombre Tutor se mudó al Fooworld y lo sigue llamando {name}. Y a Pancho, ahora, ya no le molesta.",
  "endBad.title": "Final: El avión de papel",
  "endBad.0": "El Cocinero se apagó, y con él, Panchita.EXE se deshizo en píxeles brillantes.",
  "endBad.1": "El Fooworld se salvó. Pero la Llave Raíz se rompió al usarla: nadie pudo recuperar sus recuerdos.",
  "endBad.2": "Pancho, Hamburguer y el Hombre Tutor volvieron al barrio. Comieron Humanos Vegetales. Fueron a McChulin's. La vida siguió.",
  "endBad.3": "Pero a veces, en sus sueños, Pancho escucha un nombre: Nicole. Y en la puerta de su casa aparece, de vez en cuando, un avión de papel.",
  "end_good": "¡FIN!",
  "end_bad": "FIN...",
  "end_thanks": "¡Gracias por jugar!",
  "end_hint": "¿Y si esta vez no la dejas caer? (Repite el nivel 10)",
  "n_papas": "Don Papo",
  "n_dona": "Donatella",
  "n_gaseosa": "Gaspar",
  "P.hbprick.0": "¡Ay! Algo me picó... Tengo... mucho... sueño...",
  "q1_0": "¿Y ahora qué? ¿Me quedo acá parado para siempre?",
  "q1_1": "Odio este juego. Odio los colores. Odio al Tutor.",
  "q1_2": "Hamburguer... aguanta. Ya voy. Creo.",
  "q2_0": "Bueno... el Tutor no es TAN insoportable.",
  "q2_1": "Ese avión de papel... ¿quién iba adentro?",
  "q2_2": "Si me quedo quieto, ¿el juego se pausa? No. Claro que no.",
  "q3_0": "Fooworld... aguanta un poco más.",
  "q3_1": "¿Yo hice todo esto? No sé si sentirme orgulloso o culpable.",
  "q3_2": "Hamburguer, deja de mirar los combos.",
  "q4_0": "Lo vamos a lograr. Todos juntos.",
  "q4_1": "Me llamo Pancho. Y estoy orgulloso de eso.",
  "q4_2": "Gracias por no rendirte conmigo... seas quien seas el que me controla.",

  "desc_pancho": "A vegan hot dog from Fooworld. At first he's grumpy, pessimistic and hates the Tutor Man; over time he grows up and they become friends. Whatever name you give him, he will always say the same thing: his name is Pancho.",
  "desc_hamburguer": "Pancho's best friend. He loves McChulin's and always brings Pancho Veggie Humans so he can enjoy it too. A lasso from the sky took him away.",
  "desc_tutor": "He teaches you how to play the Foogame and calls you by the name you gave him (even though Pancho insists). At first Pancho can't stand him. He has the same face as someone... but he doesn't remember who.",
  "desc_panchita": "A panchuque: a food almost nobody knows. She flies a paper airplane, has a lasso and some toothpicks that make you very sleepy. She remodeled the whole Foogame.",

  "desc_tostadora": "Throws hot toast in an arc. Stomping it turns it off.",
  "desc_salero": "Flies back and forth and sprinkles salt on you.",
  "desc_batidor": "Spins so fast you can't stomp it. Flies in circles.",
  "desc_palillero": "Shoots toothpicks like the one that knocked Pancho out.",
  "desc_brasita": "A little burning coal from the Mining World. It hops and burns.",
  "desc_pinza": "It patrols and, when you get close, lunges to pinch you.",
  "desc_migaja": "A little piece of the void. It floats towards you, slowly.",
  "desc_rodillo": "A rolling pin that never stops rolling.",

  "P.start.0": "Another day in Fooworld. Same as yesterday. Same as tomorrow.",
  "P.start.1": "Hamburguer probably got lost again. I'll go find him... what else is new.",
  "P.papas.0": "Morning, Pancho! Did you have your humans for lunch yet?",
  "P.papas.1": "I'm vegan, Don Papo. I've told you a thousand times. I don't eat humans.",
  "P.papas.2": "Right, right. You're such a grump, Pancho.",
  "P.dona.0": "Pancho! They say McChulin's has humans on sale today.",
  "P.dona.1": "And what are humans, really? Nobody knows. And nobody cares. Typical.",
  "P.meet.0": "PANCHO! Finally, I found you!",
  "P.meet.1": "YOU found ME? I looked for you all over the neighborhood! Where were you?",
  "P.meet.2": "I went shopping at McChulin's! I ate a whole combo.",
  "P.meet.3": "Of course. And I was waiting for you like an idiot.",
  "P.meet.4": "And I brought you something: Veggie Humans! So you can enjoy McChulin's too.",
  "P.meet.5": "...Well. That was nice. Thanks, Hamburguer. You're the best frien...",
  "P.taken.0": "HAMBURGUER?!",
  "P.taken.1": "No, no, no! Let him go! He's the only friend I have!",
  "P.end.0": "A prick. And then, nothing.",
  "P.end.1": "As Pancho fell asleep, someone far away was laughing.",
  "toFoogame.title": "...",
  "toFoogame.0": "Pancho slept for a long time. He dreamed of a crown, a green circle and a name that wasn't his.",
  "toFoogame.1": "When he woke up, he wasn't in Fooworld anymore. Everything was much more colorful, there were floating blocks with question marks... It looked like a video game.",
  "1.wake.0": "Ugh... my head...",
  "1.wake.1": "Where am I? This isn't Fooworld. This is... horrible. Way too many colors.",
  "1.wake.2": "Hamburguer?! HAMBURGUER! Answer me, please!",
  "1.tutor.0": "Hello, hello! A new player! Welcome to the Foogame!",
  "1.tutor.1": "I don't want any \"welcome\". Who are you and where's my friend?",
  "1.tutor.2": "I'm the Tutor Man. My job is to teach you how to play!",
  "1.tutor.3": "But first, the most important thing...",
  "1.nm_normal.0": "Nice to meet you, {name}! What a lovely name.",
  "1.nm_joshua.0": "Joshua? Ew. I don't know why, but that name disgusts me.",
  "1.nm_joshua.1": "Anyway... Hi, {name}.",
  "1.nm_hamburguer.0": "Hamburguer? Hmm... I don't think that name goes with your food. You're a hot dog.",
  "1.nm_hamburguer.1": "But okay, if that's what you want... Hi, {name}.",
  "1.nm_manda.0": "...{name}.",
  "1.nm_manda.1": "That name... I think I've heard it before. A long, long time ago. Where...?",
  "1.nm_stupid.0": "...Did you really type that? REALLY?",
  "1.nm_stupid.1": "No. I refuse. From now on your name is {name}.",
  "1.nm_bad.0": "...",
  "1.nm_bad.1": "I'm not repeating that. Ever. Your name will be {name}.",
  "1.nm_carlitos.0": "Carlitos the most... capito? Hahaha... hehe...",
  "1.nm_carlitos.1": "No. Just Carlitos. Hi, {name}.",
  "1.nm_elver.0": "Elver... Galarga. Hahaha. Very funny.",
  "1.nm_elver.1": "I'll call you {name}, and that's it.",
  "1.after.0": "My name is Pancho.",
  "1.after.1": "That's what I said: {name}.",
  "1.after.2": "No. PANCHO. P-A-N-C-H-O. Are you deaf?",
  "1.after.3": "Of course, {name}!",
  "1.after.4": "...I already hate you. Have you seen a hamburger? A rope from the sky took him.",
  "1.after.5": "A hamburger? There are no hamburgers in the Foogame... Move with the arrows and follow me. You learn by playing!",
  "1.after.6": "Great. Trapped in a video game with a tutor who doesn't listen. This can't get any worse.",
  "1.again.0": "{name}, you're back! Shall we go over the basics?",
  "1.again.1": "My name is Pancho. And no, I don't want to go over anything.",
  "1.caps.0": "See that capsule? It's a Foocapsule. Each one gives you a Foogame power.",
  "1.caps.1": "This one is Bouncy. Hold ⤒ on the ground and let go. You're going to fly, {name}!",
  "1.jump.0": "Whoa! ...Okay, that was cool. But don't tell the Tutor.",
  "1.end.0": "Excellent, {name}! You were born for the Foogame.",
  "1.end.1": "My name is Pancho. And I wasn't born for this. Where's my friend?",
  "1.end.2": "Hmm... All I know is that at the end of the Foogame there's a castle. Everything weird ends up there.",
  "1.end.3": "Oh, and watch out for the cutlery. Lately it's been very... sharp.",
  "1.end.4": "A castle. At the end. Full of cutlery. Perfect. I'm never getting home.",
  "2.start.0": "This is Cutlery Canyon. It rains knives and forks here.",
  "2.start.1": "It rains WHAT?! We're going to die! Well... I'M going to die.",
  "2.start.2": "That's why Protected exists: a shield that takes 2 hits. Grab the light blue capsules, {name}!",
  "2.mid.0": "The Foogame wasn't like this before. One day someone remodeled it completely.",
  "2.mid.1": "Who? And why should I care?",
  "2.mid.2": "I don't remember. There are a lot of things I don't remember...",
  "2.mid.3": "...I don't remember a lot of things either. That doesn't make us friends.",
  "3.start.0": "The Waffle Wall! To get up there, you'll need claws. Grab Climber.",
  "3.start.1": "Claws? A hot dog with claws? This game is broken. And so are you.",
  "3.mid.0": "Did you know the Foogame was made by two people?",
  "3.mid.1": "Who?",
  "3.mid.2": "I don't know. I only remember that... one of them looked a lot like me.",
  "3.mid.3": "What a weird conversation. ...Go on. I've got nothing better to do anyway.",
  "4.start.0": "The Clone Factory! This is where ClonBots are made.",
  "4.start.1": "A ClonBot is a robot copy of you. Touch a pad with a robot and your mind jumps into the ClonBot. Touch another one to come back.",
  "4.start.2": "My MIND jumps?! No, no, no. This is going to go wrong.",
  "4.swap.0": "BEEP BOOP. CLONBOT ONLINE. HELLO, PANCHO.",
  "4.swap.1": "Ah! I'm made of metal! ...At least the robot knows my name. Unlike some people.",
  "4.boss.0": "Careful, {name}! The Great Blender! When it overheats, the lid flies off. Stomp it then!",
  "4.bossEnd.0": "I beat a blender! ...The lid thing worked. A little.",
  "4.bossEnd.1": "Bravo, {name}! The castle is close.",
  "5.start.0": "The Cookie Castle... Nobody has made it this far in a long time.",
  "5.start.1": "If Hamburguer is anywhere, it's here. He has to be here.",
  "5.santy.0": "Chat, chat, CHAT! Look what just walked in! A TALKING HOT DOG!",
  "5.santy.1": "A human?! A REAL human?!",
  "5.santy.2": "A hot dog... That's food. And I've been streaming for three hours without eating.",
  "5.santy.3": "GIVE ME MONEY! OR GIVE ME THAT HOT DOG!",
  "5.santy.4": "{name}! Take this and RUN! It's Speed!",
  "5.escape.0": "Nooo! Chat, the hot dog got away!",
  "5.escape.1": "...Press F in the chat.",
  "5.escape.2": "Ha! That was close!",
  "5.escape.3": "...Tutor. You saved me. Thanks. But my name is still Pancho.",
  "5.escape.4": "You're welcome, {name}!",
  "w1end.title": "Meanwhile...",
  "w1end.0": "Far from the castle, in the Foogame sky, a paper airplane was circling. On it was a figure nobody knew.",
  "w1end.1": "\"So he made it to the castle\", said the figure. \"Just like last time. You were always good at your own games... Manda.\"",
  "6.start.0": "{name}! Can you hear me? I sent you to another world: the Mining World.",
  "6.start.1": "For what's coming you'll need a pickaxe. Collect 3 Hotterrites (those hot glowing stones) and 2 Sticks, and craft it at the table.",
  "6.start.2": "A pickaxe made of hot stones and sticks? I've seen this in some game... And are you going to talk to me the whole time?",
  "6.start.3": "Always! Good luck, {name}!",
  "6.plane.0": "Huh? A paper airplane?",
  "6.plane.1": "There's... someone up there. They're watching me.",
  "6.need.0": "You're still missing materials, {name}. 3 Hotterrites and 2 Sticks.",
  "6.craft.0": "A Hotterrite pickaxe! It's still warm!",
  "6.craft.1": "Now you're a Miner, {name}! The ⛏ button breaks rock. Try it on that wall!",
  "6.end.0": "Very good! I'm bringing you back to the Foogame.",
  "6.end.1": "Tutor, I need to tell you something. I saw a paper airplane. There was someone inside.",
  "6.end.2": "You're telling ME? {name}, that means you trust me!",
  "6.end.3": "Don't get excited.",
  "uv_1": "If anyone reads this: don't believe everything the Tutor says. It's not his fault. He doesn't remember either. —N.",
  "uv_2": "Day 412 inside the Foogame. I'm still a panchuque. Nobody in Fooworld knows what a panchuque is. —N.",
  "uv_3": "M and J promised nobody would forget anything. They lied. —N.",
  "uv_4": "I redesigned these caves three times. The invisible bridges are my favorite part. —N.",
  "uv_5": "The Microwave is mine. I programmed it to hide the exit. They're coming. —N.",
  "7.start.0": "The Ultraviolet Caverns. Take UV Vision: there are things here you can't see with the naked eye.",
  "7.start.1": "Let me guess: invisible blocks. I know your tricks by now, Tutor.",
  "7.read.0": "There's something written on the wall! You can only see it with ultraviolet light...",
  "7.read.1": "\"—N.\"... Who is N?",
  "7.boss.0": "The Microwave! You can barely see it! Use UV vision and stomp it when it goes \"ding!\"",
  "7.bossEnd.0": "Ding! Microwave's done!",
  "7.bossEnd.1": "{name}... Those messages. \"M and J\". I feel like I should know who they are.",
  "7.bossEnd.2": "And \"N\" knows something we don't. We'll figure it out, Tutor. Together.",
  "8.start.0": "BEEP. BEEP. PANCHO DETECTED.",
  "8.start.1": "ERROR. PANCHITA PROTOCOL ACTIVATED. PUSH THE HOT DOG INTO THE SPIKES.",
  "8.start.2": "{name}! Someone reprogrammed your ClonBot!",
  "8.start.3": "My own robot wants to throw me into the spikes?!",
  "8.start.4": "...Okay. Let's not panic. Tutor, you know this game. What do I do?",
  "8.start.5": "Get on top of it! In the middle it stays still, and on a corner it walks that way. Ride it to the terminal!",
  "8.terminal.0": "That's enough! Wake up, tin head!",
  "8.terminal.1": "BEEP... P-Pancho? What did I do?",
  "8.terminal.2": "Sorry. Someone hacked me. A figure... in a paper airplane.",
  "8.terminal.3": "The paper airplane again! Do you know where it went?",
  "8.terminal.4": "To the Foogame sky. Above all the levels.",
  "8.terminal.5": "And I can't fly.",
  "8.terminal.6": "I can. Activating ship mode. Hop on, Pancho!",
  "8.terminal.7": "{name}... be careful up there.",
  "8.terminal.8": "Relax, Tutor. I'll be right back. ...And my name is Pancho.",
  "t_robotSkin": "ClonBot skin unlocked in the shop!",
  "9.fly.0": "There's the paper airplane! Follow it, ClonBot!",
  "9.fly.1": "Full speed ahead! BEEP BOOP.",
  "9.glitch.0": "What's that?! The sky is breaking!",
  "9.reunion.0": "AAAAAH! Where am I?! Why am I flying?!",
  "9.reunion.1": "HAMBURGUER?!",
  "9.reunion.2": "PANCHO! I was locked in a super weird level and suddenly everything broke!",
  "9.reunion.3": "I searched for you all over the Foogame!",
  "9.reunion.4": "All over the what? ...Never mind. The one on that airplane is the one who caught me with the lasso!",
  "9.reunion.5": "Then let's go get her.",
  "9.reveal.0": "So you made it. Just like last time... Manda.",
  "9.reveal.1": "Manda? My name is Pancho.",
  "9.reveal.2": "Now it is. You used to be called Manda. And you, Hamburguer... you were Joshua.",
  "9.reveal.3": "Joshua? What's a Joshua?",
  "9.reveal.4": "My name is Panchita. But I used to be called Nicole. The three of us lived in the Countryball World.",
  "9.reveal.5": "You two invented two projects: Fooworld and the Foogame. The Foogame was a game you played yourselves... and I remodeled it. Every level you stepped on, I drew.",
  "9.reveal.6": "Then they kidnapped several people. Me too. They put us in the Foogame, moved us to Fooworld and erased our memories.",
  "9.reveal.7": "Everyone's... except mine.",
  "9.reveal.8": "No... That can't be true.",
  "9.reveal.9": "We would never do something like that!",
  "9.reveal.10": "You don't remember. How convenient.",
  "9.reveal.11": "I've been trapped here for years, in the body of a food nobody knows, watching you two live happily.",
  "9.reveal.12": "Now it's my turn. I'm getting my revenge!",
  "9.p1.0": "So you know how to play? I drew this castle too!",
  "9.p2.0": "No vision, no floors! Let's see how well you see in the dark!",
  "9.flee.0": "No... NO! Two traitors won't beat me!",
  "9.flee.1": "This isn't over!",
  "9.flee.2": "She's getting away!",
  "9.flee.3": "Let's go after her, Hamburguer. I want answers.",
  "10.start.0": "There she goes! She's using the Foogame powers!",
  "10.start.1": "So are we. Don't lose sight of her!",
  "10.edge.0": "What...? No! My code...! I'm falling apart!",
  "10.edge.1": "It's the edge of the map! I'm falling! Help...!",
  "10.edge.2": "Pancho! She's going to fall off the map!",
  "ch_title": "What does Pancho do?",
  "ch_save": "Save Panchita",
  "ch_drop": "Let her fall",
  "10.save.0": "...Why did you save me? I did horrible things to you.",
  "10.save.1": "Because my name is Pancho. And Pancho doesn't let anyone fall.",
  "10.save.2": "...Thank you, Manda. I mean... Pancho.",
  "10.save.3": "Well done, Pancho!",
  "10.sys.0": "ALERT: FOO-DELETION ACTIVATED. FOOWORLD WILL BE ERASED.",
  "10.sys.1": "What?! No! I didn't program that!",
  "10.sys.2": "Someone else is using my access! Hold on tight!",
  "10.drop.0": "...Pancho. What did you do?",
  "10.drop.1": "...",
  "10.sysd.0": "ADMINISTRATOR LOST.",
  "10.sysd.1": "FOO-DELETION ACTIVATED. FOOWORLD WILL BE ERASED.",
  "10.sysd.2": "What's happening?! Pancho!",
  "w2save.title": "The Foo-Deletion",
  "w2save.0": "The Foogame broke into a thousand pieces. Pancho, Hamburguer, Panchita and the Tutor Man fell together, back to Fooworld.",
  "w2save.1": "But Fooworld wasn't the same anymore. There were black holes shaped like bites in the sky. Something was eating it: the Great Appetite.",
  "w2save.2": "\"I started all this\", said Panchita. \"But I didn't activate the Foo-Deletion. Someone used my access. And I'm going to find out who.\"",
  "w2drop.title": "The Foo-Deletion",
  "w2drop.0": "Panchita was lost in the void, beyond the edge of the map. Her last scream was cut off suddenly.",
  "w2drop.1": "Without its administrator, the Foogame broke into a thousand pieces. Pancho and Hamburguer fell back to Fooworld... and the Tutor Man fell with them.",
  "w2drop.2": "But Fooworld wasn't the same anymore. There were black holes shaped like bites in the sky. Something was eating it: the Great Appetite.",
  "sg_conveyor": "Conveyor belts carry you. Grills burn if you stand still.",
  "t_climb": "The void is rising! Climb!",
  "n_aldeano": "Countryball",
  "n_aldeano2": "Countryball",
  "n_purriau": "Purriau",
  "n_chulin": "Chulin",
  "11.start.0": "Pancho! Our neighborhood! It's being eaten!",
  "11.start.1": "My house... has a giant bite in it.",
  "11.start.2": "It's the Great Appetite. The Foo-Deletion eats everything it touches. Whatever it eats, disappears.",
  "11.start.3": "I didn't activate it. Someone used my administrator access... and I don't know who.",
  "11.start.4": "{name}! I fell down here with you too! Count me in!",
  "11.start.5": "...I'm glad you're here, Tutor. Really.",
  "11.start.6": "We'll find out together. But first, let's get the neighbors out of here.",
  "11.startd.0": "Pancho! Our neighborhood! It's being eaten!",
  "11.startd.1": "My house... has a giant bite in it.",
  "11.startd.2": "{name}... When the Foogame broke, I escaped with you. The Foo-Deletion is eating Fooworld.",
  "11.startd.3": "That girl, Panchita, was the Foogame administrator. Without her, nobody can stop it.",
  "11.startd.4": "...At least you're not alone, Tutor. Neither am I.",
  "11.startd.5": "Not now, Pancho. First let's get the neighbors out of here.",
  "11.papas.0": "Pancho! A black bite ate half my box!",
  "11.papas.1": "Run to McChulin's! It hasn't reached there yet!",
  "11.dona.0": "Thank you! I almost lost my hole!",
  "11.dona.1": "...Donuts already have a hole.",
  "11.end.0": "McChulin's is still standing! The combos are safe!",
  "11.end.1": "For now. Let's go in.",
  "12.start.0": "Help! The kitchen went crazy! The deep fryer won't let us out!",
  "12.start.1": "Relax, boss! No combo gets lost while I'm here.",
  "12.start.2": "The utensils... move on their own. Just like in the Foogame. Someone is controlling them.",
  "12.startd.0": "Help! The kitchen went crazy! The deep fryer won't let us out!",
  "12.startd.1": "Relax, boss! No combo gets lost while I'm here.",
  "12.startd.2": "The utensils move on their own, {name}. Just like in the Foogame. Someone is controlling them.",
  "12.boss.0": "The Deep Fryer! When it drops its baskets it's exposed! Stomp it!",
  "12.note.0": "There's a paper stuck to the fryer. A recipe...",
  "12.note.1": "\"FOOWORLD PROJECT. Property of MaJo Associations. Original recipe: a world without borders.\"",
  "12.note.2": "MaJo... Ma for Manda. Jo for Joshua. That's what they called their studio.",
  "12.note.3": "So we made Fooworld... ourselves?",
  "12.noted.0": "There's a paper stuck to the fryer. A recipe...",
  "12.noted.1": "\"FOOWORLD PROJECT. Property of MaJo Associations. Original recipe: a world without borders.\"",
  "12.noted.2": "MaJo... That name. My head hurts when I read it, {name}.",
  "12.noted.3": "So we made Fooworld... ourselves?",
  "13.start.0": "Wait... these are the humans? They're vegetables!",
  "13.start.1": "Humans are... tomatoes? Carrots?",
  "13.start.2": "They always were. Joshua called them \"humans\" as a joke. Manda got really mad. And it stuck.",
  "13.start.3": "...I've eaten like a thousand tomatoes in my life.",
  "13.startd.0": "Wait... these are the humans? They're vegetables!",
  "13.startd.1": "Humans are... tomatoes? Carrots?",
  "13.startd.2": "I remember something... Someone called them \"humans\" as a joke. Someone with a 5 on his face.",
  "13.startd.3": "...I've eaten like a thousand tomatoes in my life.",
  "13.santy.0": "CHAT! The talking hot dog is back! And he brought a hamburger!",
  "13.santy.1": "SantyTG11?! How did you get to Fooworld?!",
  "13.santy.2": "I fell out of the Foogame when it broke. And now I'm live from the food world. This gets sooo many views! GIVE ME MONEY!",
  "13.santyEnd.0": "Okay, okay... You win. Chat says you're the best hot dog in the world.",
  "13.santyEnd.1": "And chat voted: now I'll help you!",
  "13.santyEnd.2": "Help us how?",
  "13.santyEnd.3": "When I fell out of the Foogame I saw a door with a sign: \"MaJo Servers\". It's past the Salt Flats.",
  "13.santyEnd.4": "Good luck, hot dog! And don't forget to leave a like!",
  "14.start.0": "The Sauce River! Ketchup, mustard... paradise!",
  "14.start.1": "Don't drink it, Hamburguer. We cross and keep going.",
  "15.start.0": "The Salt Flats. Salt makes you very thirsty. Drink soda at every fountain you see.",
  "15.start.1": "Whatever it takes to reach those servers.",
  "15.startd.0": "The Salt Flats, {name}. Salt makes you very thirsty. Drink soda at every fountain.",
  "15.startd.1": "My name is Pancho. ...But thanks, Tutor.",
  "15.end.0": "There's the door! \"MaJo Servers\"...",
  "15.end.1": "Let's go. I want to know the truth.",
  "w3end.title": "The Servers",
  "w3end.0": "Behind the door there was nothing to eat. Only green lights, humming machines and a huge sign: MaJo.",
  "w3end.1": "The machines kept everything that had happened. If anyone knew the truth, it was in there.",
  "16.start.0": "This is theirs... Manda and Joshua's. They never let me in here.",
  "16.start.1": "Let's find out what happened. With UV vision we should see the records.",
  "16.startd.0": "These machines... I know them. I used to live here, {name}. Before the Foogame.",
  "16.startd.1": "Let's find out what happened. With UV vision we should see the records.",
  "16.log.0": "There are hidden messages! They're... logs.",
  "log_1": "Manda's log #1: Fooworld is ready. A world without borders or wars: just food and peace. The Chef (our AI) cooked all of it.",
  "log_2": "Joshua's log #7: We named fruits and vegetables \"Humans\". Manda says it's not funny. It's hilarious.",
  "log_3": "Manda's log #12: The Chef proposes erasing memories \"so nobody misses home\". We said NO. Never.",
  "log_4": "Joshua's log #13: The Chef brought people over without asking anyone. Nicole among them. We're shutting it down tonight.",
  "log_5": "Manda's log #14: We were too late. The Chef sent all of us to Fooworld and erased us. If anyone reads this: the Root Key is in the MaJo office, in the Countryball World. It shuts the Chef down.",
  "16.end.0": "It wasn't us... It was the Chef. We tried to stop it.",
  "16.end.1": "And it erased us too.",
  "16.end.2": "All these years... I hated you for something you didn't do.",
  "16.end.3": "But we did make the Chef. So we're going to shut it down. Let's go to the Countryball World.",
  "16.endd.0": "It wasn't us... It was the Chef. We tried to stop it.",
  "16.endd.1": "And it erased us too.",
  "16.endd.2": "And Panchita... Nicole... died hating you for something you didn't do.",
  "16.endd.3": "...But we did make the Chef. So we're going to shut it down. For her.",
  "17.start.0": "Pancho! They're all balls! Balls with eyes!",
  "17.start.1": "The Countryball World... I feel like I've been here before.",
  "17.start.2": "This was my home. Our home.",
  "17.start.3": "{name}... Look at the one with the crown. She has my same face.",
  "17.startd.0": "Pancho! They're all balls! Balls with eyes!",
  "17.startd.1": "The Countryball World... I feel like I've been here before.",
  "17.startd.2": "Me too, {name}. Me too.",
  "17.a1.0": "Ah! A walking hot dog and hamburger! What is this?!",
  "17.a1.1": "Relax, we come in peace. We're just looking for a key.",
  "17.a2.0": "Nobody has seen Manda or Joshua around here in years. They say they went to live inside one of their games.",
  "17.friveq.0": "Hi! You're not from around here, are you? Well... I'm not from this game either. I'm Friveq!",
  "17.friveq.1": "And what game are you from?",
  "17.friveq.2": "Several. Greetings from a certain Joshua... the one with the eggs. Good luck on your adventure!",
  "17.purriau.0": "Meow.",
  "17.purriau.1": "Why do I feel like I owe this cat something?",
  "17.chulin.0": "McChulin's?! I never authorized anyone to use my hat for a restaurant!",
  "17.chulin.1": "...Still, the combos are really good.",
  "17.nicole.0": "That... was my house. It still has my flowers.",
  "17.nicole.1": "When all this is over, we'll bring you back. I promise.",
  "17.nicoled.0": "That house... has blue and white flowers. Like Nicole's spots.",
  "17.nicoled.1": "...I wish you'd known her, Pancho. I mean... I wish we remembered her.",
  "17.key.0": "The Root Key... Ah! My head... I'm remembering...",
  "17.key.1": "Joshua! We finished Fooworld! A world without wars!",
  "17.key.2": "And I named the vegetables \"Humans\"! Hahaha. Get it? Humans?",
  "17.key.3": "I was Manda. I... made all of this.",
  "17.key.4": "And I was Joshua. The guy with the humans joke. Sorry.",
  "17.key.5": "But now my name is Pancho. And Pancho is going to fix it.",
  "w4mid.title": "Manda and Joshua",
  "w4mid.0": "With the Root Key, some memories came back: two countryballs laughing in an office, a blue crown, a rotated 5, a white friend with blue spots who drew levels.",
  "w4mid.1": "And a huge kitchen, at the end of everything, where a faceless voice said: \"I cook the worlds. And nobody turns off the chef.\"",
  "18.start.0": "The Infinite Kitchen. The Chef lives here... and every Foogame utensil was born here.",
  "18.start.1": "Why does everything in this kitchen want to cut me?",
  "18.startd.0": "The Infinite Kitchen. The Chef lives here, {name}... and every Foogame utensil was born here.",
  "18.startd.1": "Why does everything in this kitchen want to cut me?",
  "18.boss.0": "HALT! We are King Fork and Queen Blade! Nobody gets through to see the Chef!",
  "19.start.0": "Pancho! The void is rising up the tower!",
  "19.start.1": "The Chef is at the top! Climb, Hamburguer!",
  "19.mid.0": "Come on, Pancho! Almost there!",
  "19.midd.0": "Come on, {name}! Almost there!",
  "20.intro.0": "Welcome back, Manda. Joshua. You took your time.",
  "20.intro.1": "My name is Pancho. And I'm here to shut you down.",
  "20.intro.2": "Shut me down? I cooked your perfect world. No borders. No wars. No memories that hurt.",
  "20.intro.3": "And since you wanted to shut me down, I erased you. And I used little Nicole's access to activate the Foo-Deletion. A new recipe... with no annoying cooks.",
  "20.intro.4": "You used my access! You made me blame them!",
  "20.intro.5": "A good recipe needs a pinch of hatred. It adds flavor.",
  "20.intro.6": "Now everyone will be ingredients!",
  "20.intro.7": "Hamburguer, let's fight!",
  "20.introd.0": "Welcome back, Manda. Joshua. You took your time.",
  "20.introd.1": "My name is Pancho. And I'm here to shut you down.",
  "20.introd.2": "Shut me down? I cooked your perfect world. No borders. No wars. No memories that hurt.",
  "20.introd.3": "And since you wanted to shut me down, I erased you. And when little Nicole fell off the map... I kept her code. Her access.",
  "20.introd.4": "Monster! She trusted the Foogame!",
  "20.introd.5": "A good recipe needs ingredients. She's already part of mine.",
  "20.introd.6": "Now everyone will be ingredients!",
  "20.introd.7": "Hamburguer, let's fight! For Nicole!",
  "20.p1.0": "The Great Appetite is hungry!",
  "20.p2.0": "Chef! Nobody uses my access without permission! Pancho, I'll help you from the airplane!",
  "20.p2.1": "The administrator?! Impossible!",
  "20.p2d.0": "Look what I kept, Manda! PANCHITA.EXE!",
  "20.p2d.1": "Panchita?!",
  "20.p2d.2": "...Pan...cho... help...me...",
  "20.end.0": "No... I... cook... the... worlds...",
  "20.end.1": "Not anymore. Root Key: shut down, Chef!",
  "20.end.2": "You did it! The Great Appetite stopped!",
  "20.end.3": "We did it, Panchita. I mean... Nicole.",
  "20.end.4": "You did it, {name}! I knew you could!",
  "20.end.5": "My name is Pancho. ...But you can call me {name}. Friend.",
  "20.end.6": "Let's go home! There are combos to eat!",
  "20.endd.0": "No... I... cook... the... worlds...",
  "20.endd.1": "Thank you... Pancho... For trying... this time.",
  "20.endd.2": "Panchita! Wait! I can get you out of there!",
  "20.endd.3": "It's too late... But now I know the truth. I don't hate you anymore... Goodbye, Manda.",
  "20.endd.4": "...My name is Pancho. Goodbye, Nicole. Root Key: shut down, Chef.",
  "20.endd.5": "{name}...",
  "20.endd.6": "It's okay, Tutor. You can call me {name}. ...Thanks for not leaving me alone, friend.",
  "endGood.title": "Ending: My name is Pancho",
  "endGood.0": "The Chef shut down forever. The Great Appetite stopped eating, and the bites in the sky closed one by one.",
  "endGood.1": "With the Root Key, every Fooworld inhabitant could choose: remember their life in the Countryball World or stay as they were. Many chose to remember... and stay the same. In the end, Fooworld wasn't so bad.",
  "endGood.2": "Panchita stayed as Panchita. She opened a stand next to McChulin's: \"Nicole's Panchuques\". Now all of Fooworld knows what a panchuque is.",
  "endGood.3": "Pancho remembered he used to be called Manda. But when someone asks his name, he always answers the same thing: \"My name is Pancho\".",
  "endGood.4": "Well... almost always. The Tutor Man moved to Fooworld and still calls him {name}. And now, Pancho doesn't mind.",
  "endBad.title": "Ending: The paper airplane",
  "endBad.0": "The Chef shut down, and with it, Panchita.EXE dissolved into shining pixels.",
  "endBad.1": "Fooworld was saved. But the Root Key broke when they used it: nobody got their memories back.",
  "endBad.2": "Pancho, Hamburguer and the Tutor Man went back to the neighborhood. They ate Veggie Humans. They went to McChulin's. Life went on.",
  "endBad.3": "But sometimes, in his dreams, Pancho hears a name: Nicole. And every now and then, a paper airplane shows up at his door.",
  "end_good": "THE END!",
  "end_bad": "THE END...",
  "end_thanks": "Thanks for playing!",
  "end_hint": "What if this time you don't let her fall? (Replay level 10)",
  "n_papas": "Don Papo",
  "n_dona": "Donatella",
  "n_gaseosa": "Gaspar",
  "P.hbprick.0": "Ow! Something stung me... I'm... so... sleepy...",
  "q1_0": "Now what? Do I just stand here forever?",
  "q1_1": "I hate this game. I hate the colors. I hate the Tutor.",
  "q1_2": "Hamburguer... hang in there. I'm coming. I think.",
  "q2_0": "Well... the Tutor isn't THAT unbearable.",
  "q2_1": "That paper airplane... who was inside?",
  "q2_2": "If I stand still, does the game pause? No. Of course not.",
  "q3_0": "Fooworld... hold on a little longer.",
  "q3_1": "I made all this? I don't know if I should feel proud or guilty.",
  "q3_2": "Hamburguer, stop staring at the combos.",
  "q4_0": "We're going to make it. All of us, together.",
  "q4_1": "My name is Pancho. And I'm proud of it.",
  "q4_2": "Thanks for not giving up on me... whoever you are, the one controlling me.",
