<script>/* js/game.js */
// Núcleo del juego: mapa, colisiones, cámara, diálogos, guiones, elecciones y HUD.
'use strict';

let G = null; // nivel actual
const ZOOM = 1.18; // acercamiento de la cámara en los niveles

// Bloques sólidos. M = roca (se rompe con el pico), U = invisible (se ve con visión UV), g = compuerta,
// T = bloque que aparece y desaparece, > < = cinta transportadora, Y = mostaza que rebota, G = parrilla
const SOLID = { '#': 1, 'B': 1, 'D': 1, 'k': 1, 'X': 1, 'C': 1, 'M': 1, 'U': 1, 'g': 1, 'T': 1, '>': 1, '<': 1, 'Y': 1, 'G': 1 };

// ======================= Constructor de niveles =======================
// Se trabaja con un "cursor" que avanza de izquierda a derecha.
// Las alturas se cuentan en bloques desde abajo.
class LB {
  constructor(H = 17) { this.H = H; this.cols = []; this.x = 0; this.g = 3; this.ents = []; this.gch = '#'; }
  col(x) { while (this.cols.length <= x) this.cols.push(new Array(this.H).fill(' ')); return this.cols[x]; }
  put(x, yb, ch) { const y = this.H - 1 - yb; if (y < 0 || y >= this.H || x < 0) return this; this.col(x)[y] = ch; return this; }
  get(x, yb) { const y = this.H - 1 - yb; if (x < 0 || x >= this.cols.length || y < 0 || y >= this.H) return ' '; return this.cols[x][y]; }
  fillCol(x, h, ch = this.gch) { this.col(x); for (let i = 0; i < h; i++) this.put(x, i, ch); return this; }
  // terreno plano de n columnas a la altura actual
  flat(n) { for (let i = 0; i < n; i++) this.fillCol(this.x + i, this.g); this.x += n; return this; }
  step(d) { this.g += d; return this; }
  at(g) { this.g = g; return this; }
  gap(n) { for (let i = 0; i < n; i++) this.col(this.x + i); this.x += n; return this; }
  // foso con algo al fondo: '^' pinchos, 'L' lava/aceite, 'W' líquido, 'V' vacío
  pit(n, ch = '^', depth = 1) {
    for (let i = 0; i < n; i++) {
      const x = this.x + i;
      if (ch === '^') { this.fillCol(x, 1); this.put(x, 1, '^'); }
      else if (ch === 'W') { this.fillCol(x, 1); for (let k = 1; k <= depth; k++) this.put(x, k, 'W'); }
      else for (let k = 0; k < depth; k++) this.put(x, k, ch);
    }
    this.x += n; return this;
  }
  water(x0, x1, h) { for (let x = x0; x < x1; x++) for (let y = 0; y < h; y++) if (this.get(x, y) === ' ') this.put(x, y, 'W'); return this; }
  rect(dx, yb, w, h, ch = 'B') { for (let i = 0; i < w; i++) for (let j = 0; j < h; j++) this.put(this.x + dx + i, yb + j, ch); return this; }
  rectAbs(x, yb, w, h, ch = 'B') { for (let i = 0; i < w; i++) for (let j = 0; j < h; j++) this.put(x + i, yb + j, ch); return this; }
  plat(dx, h, w, ch = '=') { for (let i = 0; i < w; i++) this.put(this.x + dx + i, h, ch); return this; }
  // pared vertical (para escalar): columna dx, desde yb, alto h
  wall(dx, yb, h, ch = 'B') { for (let j = 0; j < h; j++) this.put(this.x + dx, yb + j, ch); return this; }
  // entidad en la columna (cursor+dx), a la altura h (bloques desde abajo). Sin h: sobre el suelo.
  e(dx, type, props = {}, h = null) {
    const hh = h == null ? this.g : h;
    this.ents.push(Object.assign({ type, tx: this.x + dx, ty: this.H - 1 - hh }, props));
    return this;
  }
  coins(dx, h, n, dy = 0) { for (let i = 0; i < n; i++) this.e(dx + i, 'coin', {}, h + (dy ? Math.round(Math.sin((i / Math.max(1, n - 1)) * Math.PI) * dy) : 0)); return this; }
  // columna de monedas (para niveles verticales)
  coinsUp(dx, h, n) { for (let i = 0; i < n; i++) this.e(dx, 'coin', {}, h + i); return this; }
  done() { this.col(this.x + 1); return { H: this.H, w: this.cols.length, cols: this.cols, ents: this.ents }; }
}

// ======================= Nivel =======================
class Level {
  constructor(def, opts = {}) {
    G = this;
    this.def = def; this.preview = !!opts.preview;
    const b = new LB(def.H || 17); b.gch = def.gch || '#';
    def.build(b);
    const L = b.done();
    this.w = L.w; this.h = L.H;
    this.tiles = [];
    for (let y = 0; y < this.h; y++) { const row = []; for (let x = 0; x < this.w; x++) row.push(L.cols[x][y]); this.tiles.push(row); }
    this.theme = def.theme;
    this.ents = []; this.parts = []; this.coins = 0; this.kills = 0; this.deaths = 0; this.t = 0;
    this.time = 0; this.state = 'play'; this.cut = false; this.fade = 0; this.bars = 0; this.toasts = []; this.scripts = [];
    this.vw = VW / ZOOM; this.vh = VH / ZOOM;
    this.cam = { x: 0, y: 0 }; this.shakeA = 0; this.flash = 0; this.hasKey = false;
    this.bosses = []; this.bossActive = null; this.arena = null; this.dialog = null; this.choice = null; this.titleT = this.preview ? 0 : 3;
    this.portalCool = 0; this.timedT = 0; this.timedOn = true; this.body = null;
    let start = { x: 3 * TILE, y: 0 };
    for (const d of L.ents) {
      if (d.type === 'start') { start = { x: d.tx * TILE + TILE / 2, y: (d.ty + 1) * TILE - 12 }; continue; }
      if (this.preview && !['deco', 'mplat'].includes(d.type)) continue;
      const e = this.spawn(d);
      if (e) this.add(e);
    }
    // niveles con pocas monedas: se ponen grupitos de 3 sobre el suelo firme
    if (!this.preview && !def.noCoins && this.ents.filter((e) => e instanceof Coin).length < 10) {
      for (let x = 8; x < this.w - 10; x += 13) {
        let sy = -1;
        for (let y = 1; y < this.h; y++) if (this.tiles[y][x] === '#' && this.tiles[y - 1][x] === ' ') { sy = y; break; }
        if (sy < 4) continue;
        let ok = true;
        for (let k = 0; k < 3 && ok; k++) for (let dy = 1; dy <= 4; dy++) { if (this.tiles[sy][x + k] !== '#' || this.tiles[sy - dy][x + k] !== ' ') ok = false; }
        if (!ok || (this.arenaX != null && x >= this.arenaX)) continue;
        for (let k = 0; k < 3; k++) this.add(new Coin((x + k) * TILE + 16, (sy - 2 - (k === 1 ? 1 : 0)) * TILE + 16));
      }
    }
    this.coinTotal = this.ents.filter((e) => e instanceof Coin).length;
    this.startX = start.x; this.startY = start.y;
    this.player = new Player(start.x, start.y, def.force || 'pancho');
    if (def.power) this.player.power = def.power;
    if (Save.data.pico && this.player.charId === 'pancho') this.player.pico = true;
    if (Save.data.upg.escudo && !this.preview) this.player.shield = Math.max(this.player.shield, 1);
    if (def.buddy && !this.preview) this.companion = new Buddy(start.x - 40, start.y - 10, def.buddy);
    this.cam.x = this.w * TILE < this.vw ? (this.w * TILE - this.vw) / 2 : clamp(this.player.x - this.vw / 2, 0, this.w * TILE - this.vw);
    this.cam.y = this.camYFor(this.player.y);
    if (!this.preview) {
      Sfx.music(def.music);
      for (const k of (def.see || [])) Save.see(k);
      if (def.start) this.say(def.start);
      if (def.onStart) def.onStart(this);
    }
  }

  spawn(d) {
    const cx = d.tx * TILE + TILE / 2, cy = d.ty * TILE + TILE / 2, by = (d.ty + 1) * TILE;
    const ground = (e) => { e.y = by - e.hh; return e; };
    switch (d.type) {
      case 'coin': return new Coin(cx, cy);
      case 'heart': case 'pickle': return new Pickle(cx, cy);
      case 'power': return new PowerCapsule(cx, cy, d.kind, d.respawn !== false);
      case 'clonpad': return new ClonPad(cx, cy);
      case 'robot': return ground(new RobotShell(cx, 0, d));
      case 'plate': return new Plate(cx, by - 4, d);
      case 'ore': return new Ore(cx, cy, d.kind || 'calienterrito');
      case 'craft': return ground(new CraftTable(cx, 0));
      case 'uvtext': return new UVText(cx, cy, d.key, d.w || 6);
      case 'check': return new Checkpoint(cx, by - 30 + 16);
      case 'goal': return new Goal(cx, by - 48 + 32);
      case 'popspike': return new PopSpike(cx, by - 16, d.phase || 0);
      case 'saw': return new Saw(cx, cy, d.axis, d.range, d.speed);
      case 'portal': return new Portal(cx, by - 22 + 8, d.group || 0);
      case 'powerportal': return ground(new PowerPortal(cx, 0, d));
      case 'mplat': return new MPlat(cx, cy, d.w || 3, d.axis || 'x', d.range || 4, d.speed || 1, d.style || this.def.platStyle || 'tech');
      case 'npc': return ground(new NPC(cx, 0, d));
      case 'sign': return ground(new Sign(cx, 0, d.key, d));
      case 'trigger': return new Trigger(cx, cy, d);
      case 'deco': return new Deco(cx, by - 16, d.kind);
      case 'bite': return new VoidBite(cx, cy, d);
      case 'seed': return ground(new Seed(cx, 0, d));
      case 'geyser': return new Geyser(cx, by, d);
      case 'fan': return new Fan(cx, by - 8, d);
      case 'falling': return new Dropper(cx, cy, d);
      case 'enemy': {
        const C = ENEMY_TYPES[d.kind];
        const e = new C(cx, cy, d);
        if (!e.flying) e.y = by - e.hh;
        if (d.id) e.id = d.id;
        return e;
      }
      case 'boss': {
        const C = ENEMY_TYPES[d.kind];
        const e = new C(cx, cy, Object.assign({ boss: true }, d));
        if (!e.flying) e.y = by - e.hh;
        e.active = false; e.arena = d.arena; e.intro = d.intro; e.outro = d.outro; e.ev = d.ev; e.trig = d.trig; e.seal = d.seal;
        this.bosses.push(e);
        return e;
      }
      default: if (SPAWNERS[d.type]) return SPAWNERS[d.type](this, d, cx, cy, by);
    }
    return null;
  }
  add(e) { this.ents.push(e); return e; }

  // ----------- consultas del mapa -----------
  tile(tx, ty) { if (ty < 0 || ty >= this.h || tx < 0 || tx >= this.w) return ' '; return this.tiles[ty][tx]; }
  setTile(tx, ty, c) { if (ty >= 0 && ty < this.h && tx >= 0 && tx < this.w) this.tiles[ty][tx] = c; }
  isSolid(tx, ty) {
    if (tx < 0 || tx >= this.w) return true;
    if (ty < 0 || ty >= this.h) return false;
    return SOLID[this.tiles[ty][tx]] === 1;
  }
  isSolidPx(x, y) { return this.isSolid(Math.floor(x / TILE), Math.floor(y / TILE)); }
  isGroundPx(x, y) {
    const tx = Math.floor(x / TILE), ty = Math.floor(y / TILE);
    if (this.isSolid(tx, ty) || this.tile(tx, ty) === '=') return true;
    for (const e of this.ents) if (e.platform && Math.abs(e.x - x) < e.hw && Math.abs(e.y - y) < 14) return true;
    return false;
  }
  solidCol(x, y0, y1) {
    const tx = Math.floor(x / TILE);
    for (let ty = Math.floor(y0 / TILE); ty <= Math.floor(y1 / TILE); ty++) if (this.isSolid(tx, ty)) return true;
    return false;
  }
  waterAt(x, y) { return this.tile(Math.floor(x / TILE), Math.floor(y / TILE)) === 'W'; }
  camYFor(py) {
    const maxY = this.h * TILE - this.vh;
    if (maxY <= 0) return maxY;
    return clamp(py - this.vh * 0.55, 0, maxY);
  }

  // Movimiento con colisiones contra bloques y plataformas
  moveBody(e, dt) {
    e.x += e.vx * dt;
    e.hitWall = 0;
    const top = e.y - e.hh + 1, bot = e.y + e.hh - 1;
    const ty0 = Math.floor(top / TILE), ty1 = Math.floor(bot / TILE);
    if (e.vx > 0) {
      const tx = Math.floor((e.x + e.hw) / TILE);
      for (let ty = ty0; ty <= ty1; ty++) if (this.isSolid(tx, ty)) { e.x = tx * TILE - e.hw - 0.01; e.vx = 0; e.hitWall = 1; break; }
    } else if (e.vx < 0) {
      const tx = Math.floor((e.x - e.hw) / TILE);
      for (let ty = ty0; ty <= ty1; ty++) if (this.isSolid(tx, ty)) { e.x = (tx + 1) * TILE + e.hw + 0.01; e.vx = 0; e.hitWall = -1; break; }
    }
    const prevBottom = e.y + e.hh;
    e.y += e.vy * dt;
    e.onGround = false; e.ride = null; e.under = null;
    const tx0 = Math.floor((e.x - e.hw + 1) / TILE), tx1 = Math.floor((e.x + e.hw - 1) / TILE);
    if (e.vy >= 0) {
      const ty = Math.floor((e.y + e.hh) / TILE);
      for (let tx = tx0; tx <= tx1; tx++) {
        const c = this.tile(tx, ty);
        if (this.isSolid(tx, ty) || (c === '=' && prevBottom <= ty * TILE + 1 && !e.dropping)) {
          e.landVy = e.vy;
          e.y = ty * TILE - e.hh; e.vy = 0; e.onGround = true; e.under = c;
          // la mostaza, las cintas y la parrilla tienen prioridad sobre el bloque de al lado
          for (let k = tx0; k <= tx1; k++) { const u = this.tile(k, ty); if ('Y<>G'.includes(u) && u !== ' ') e.under = u; }
          break;
        }
      }
      if (!e.onGround) {
        for (const p of this.ents) {
          if (!p.platform || p.fallen > 0 || p === e) continue;
          const ptop = p.y - p.hh;
          if (Math.abs(e.x - p.x) < p.hw + e.hw - 4 && prevBottom <= ptop - (p.dy || 0) + 2 && e.y + e.hh >= ptop) {
            e.landVy = e.vy;
            e.y = ptop - e.hh; e.vy = 0; e.onGround = true; e.ride = p; break;
          }
        }
      }
    } else {
      const ty = Math.floor((e.y - e.hh) / TILE);
      for (let tx = tx0; tx <= tx1; tx++) if (this.isSolid(tx, ty)) { e.y = (ty + 1) * TILE + e.hh; e.vy = 0; e.hitCeil = true; break; }
    }
  }

  // ----------- efectos -----------
  puff(x, y, col, n = 6, sp = 100) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * TAU, s = Math.random() * sp;
      this.parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 30, life: 0.4 + Math.random() * 0.4, max: 0.8, col, size: 3 + Math.random() * 4, g: 200 });
    }
  }
  dust(x, y) { this.puff(x, y, 'rgba(230,220,200,0.9)', 3, 50); }
  sparkle(x, y, col, n = 10) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * TAU, s = 60 + Math.random() * 140;
      this.parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 0.6, max: 0.6, col, size: 3, g: 0, star: true });
    }
  }
  splash(x, y) { const c = THEMES[this.theme].liquidName === 'ketchup' ? '#ff5a4a' : '#bfe9ff'; for (let i = 0; i < 10; i++) this.parts.push({ x: x + rand(-10, 10), y, vx: rand(-80, 80), vy: rand(-320, -120), life: 0.6, max: 0.6, col: c, size: 3, g: 900 }); }
  glitchFx(x, y, n = 10) { for (let i = 0; i < n; i++) this.parts.push({ x: x + rand(-20, 20), y: y + rand(-20, 20), vx: rand(-120, 120), vy: rand(-120, 120), life: 0.4, max: 0.4, col: pick(['#ff00d4', '#00ffd0', '#000']), size: 4 + Math.random() * 5, g: 0, sq: true }); }
  explode(x, y, r, hurtsPlayer) {
    Sfx.play('explode'); this.shake(8);
    for (let i = 0; i < 22; i++) {
      const a = Math.random() * TAU, s = Math.random() * r * 4;
      this.parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 0.5 + Math.random() * 0.3, max: 0.8, col: pick(['#ff3b1f', '#ff8a1f', '#ffe14d', '#555']), size: 5 + Math.random() * 8, g: -50 });
    }
    const p = this.player;
    if (hurtsPlayer && dist(p.x, p.y, x, y) < r) p.hurt(1, x);
    for (const e of this.ents) if (e.isEnemy && !e.dead && dist(e.x, e.y, x, y) < r + (e.r || 10)) e.hurt(2, null);
  }
  shake(a) { this.shakeA = Math.max(this.shakeA, a); }
  toast(text) { this.toasts.push({ text, t: 2.2 }); if (this.toasts.length > 3) this.toasts.shift(); }

  // ----------- diálogos, elecciones y guiones -----------
  say(key, cb) {
    // key puede ser 'clave', o ['clave', desde, hasta] para decir solo algunas líneas
    let from = 0, lines;
    if (Array.isArray(key) && typeof key[0] === 'string' && typeof key[1] === 'number') { from = key[1]; lines = DLG[key[0]].slice(key[1], key[2]); key = key[0]; }
    else lines = typeof key === 'string' ? DLG[key] : key;
    if (!lines) { if (cb) cb(); return; }
    const L = lines.map((l, i) => ({ who: l[0], expr: l[1] || 'neutral', text: T(l[2] || `${key}.${i + from}`), red: l[3] === 'red' }));
    if (this.dialog) { this.dialog.lines.push(...L); const old = this.dialog.cb; this.dialog.cb = () => { if (old) old(); if (cb) cb(); }; return; }
    // si venías saltando con el dedo apretado, el diálogo siguiente también se salta
    const keep = this.skipFrom != null && Input.heldSince(this.skipFrom);
    this.dialog = { lines: L, i: 0, n: 0, cb, t0: keep ? this.skipFrom : performance.now(), hold: keep ? 1 : 0, ff: 0 };
  }
  updateDialog(dt) {
    const d = this.dialog;
    const line = d.lines[d.i];
    const before = Math.floor(d.n);
    d.n = Math.min(line.text.length, d.n + dt * 48);
    if (Math.floor(d.n) !== before && Math.floor(d.n) % 3 === 0) Sfx.play('talk');
    let adv = Input.pressed('jump') || Input.pressed('confirm') || Input.pressed('action');
    for (const tp of Input.taps) if (tp.btn !== 'pause') adv = true;
    // mantener apretado el dedo: los diálogos pasan solos, rapidísimo
    d.hold = Input.heldSince(d.t0) ? d.hold + dt : 0;
    if (d.hold > 0.45) { d.ff -= dt; adv = false; if (d.ff <= 0) { d.ff = 0.06; adv = true; d.n = line.text.length; } }
    if (adv) {
      if (d.n < line.text.length) d.n = line.text.length;
      else {
        d.i++; d.n = 0;
        if (d.i >= d.lines.length) {
          this.dialog = null;
          this.skipFrom = d.hold > 0.45 ? d.t0 : null;
          if (d.cb) d.cb();
        }
      }
    }
  }
  // Pregunta con botones (p. ej. salvar o no a Panchita). opts = [['clave', valor], ...]
  ask(titleKey, opts, cb) { this.choice = { title: titleKey, opts, cb, t: 0 }; Sfx.play('choice'); }
  updateChoice(dt) {
    const c = this.choice; c.t += dt;
    if (c.t < 0.6) return;
    const r = this.choiceRects();
    for (const tp of Input.taps) r.forEach((b, i) => { if (tp.x >= b.x && tp.x <= b.x + b.w && tp.y >= b.y && tp.y <= b.y + b.h) c.pick = i; });
    if (Input.pressed('left')) c.sel = 0; if (Input.pressed('right')) c.sel = 1;
    if (Input.pressed('confirm') && c.sel != null) c.pick = c.sel;
    if (c.pick != null) { this.choice = null; Sfx.play('select'); c.cb(c.opts[c.pick][1]); }
  }
  choiceRects() {
    const n = this.choice.opts.length, w = Math.min(280, (VW - 80) / n - 20), h = 64;
    return this.choice.opts.map((o, i) => ({ x: VW / 2 - (n * (w + 20) - 20) / 2 + i * (w + 20), y: VH * 0.55, w, h }));
  }
  run(genFn) { this.scripts.push({ gen: genFn(this), wait: 0 }); }
  stepScripts(dt) {
    for (const s of this.scripts) {
      if (s.done) continue;
      if (s.wait > 0) { s.wait -= dt; continue; }
      if (s.dlgWait) { if (this.dialog || this.choice) continue; s.dlgWait = false; }
      if (s.until) { if (!s.until()) continue; s.until = null; }
      const r = s.gen.next(s.answer);
      if (r.done) { s.done = true; continue; }
      const v = r.value;
      if (typeof v === 'number') s.wait = v;
      else if (v && v.dlg) { this.say(v.dlg); s.dlgWait = true; }
      else if (v && v.ask) { this.ask(v.ask, v.opts, (ans) => { s.answer = ans; }); s.dlgWait = true; }
      else if (v && v.until) s.until = v.until;
    }
    this.scripts = this.scripts.filter((s) => !s.done);
  }
  event(name) {
    const evs = this.def.events || {};
    if (name === 'boss') { const b = this.bosses.find((x) => !x.dead && !x.active); if (b && !this.bossActive) this.startBoss(b); return; }
    if (evs[name]) evs[name](this);
  }

  // ----------- ClonBot: cambiar de cuerpo -----------
  swapTo(robot) {
    const p = this.player;
    if (p.charId === 'robot' || !robot) return;
    Sfx.play('swap'); this.flash = 0.35; this.glitchFx(p.x, p.y, 14);
    p.vx = p.vy = 0; p.sleeping = true;
    this.body = p;
    const r = new Player(robot.x, robot.y, 'robot');
    r.dir = robot.dir || 1; r.shell = robot; robot.inUse = true;
    r.checkX = robot.x; r.checkY = robot.y; r.padLock = true;
    this.player = r;
    if (!Save.data.seen.clonbot) Save.see('clonbot');
    this.event('swap');
  }
  swapBack(fromDeath) {
    const r = this.player;
    if (r.charId !== 'robot' || !this.body) return;
    const sh = r.shell;
    if (sh) { sh.inUse = false; if (fromDeath) { sh.x = sh.homeX; sh.y = sh.homeY; sh.boom = 1; } else { sh.x = r.x; sh.y = r.y; sh.dir = r.dir; } }
    Sfx.play('swap'); this.flash = 0.35; this.glitchFx(r.x, r.y, 14);
    this.player = this.body; this.player.sleeping = false; this.player.inv = 0.8; this.player.padLock = true; this.body = null;
    this.event('swapback');
  }

  // ----------- jefes -----------
  startBoss(b) {
    this.bossActive = b;
    if (b.arena) {
      this.arena = { x0: b.arena[0], x1: b.arena[1] };
      for (const x of [b.arena[0], b.arena[1]]) for (let y = 0; y < this.h; y++) if (this.tile(x, y) === ' ') this.setTile(x, y, 'X');
    }
    Sfx.music(b.music || this.def.bossMusic || 'boss');
    Save.see(b.nameKey);
    b.homeX = b.x; b.homeY = b.y;
    if (b.seal) { const [sx, syb, sw] = b.seal; for (let i = 0; i < sw; i++) this.setTile(sx + i, this.h - 1 - syb, 'B'); }
    // Si mueres durante la pelea, reapareces dentro y la pelea se reinicia
    if (!b.noReset) {
      const p = this.player;
      if (b.arena) { p.checkX = (b.arena[0] + 3) * TILE + 16; p.checkY = p.y - 4; }
      else { p.checkX = p.x; p.checkY = p.y - 4; }
    }
    const go = () => { b.active = true; };
    if (b.intro) this.say(b.intro, go); else go();
  }
  resetBoss() {
    const b = this.bossActive;
    if (!b || b.noReset) return;
    b.hp = b.maxHp; b.x = b.homeX; b.y = b.homeY; b.vx = b.vy = 0; b.flash = 0; b.inv = 1;
    if (b.reset) b.reset();
    for (const e of this.ents) {
      if (e.isEnemy && !e.boss) e.dead = true;
      if ((e instanceof Bullet && e.enemy) || e instanceof Shockwave || e.bossHazard) e.dead = true;
    }
    if (!b.ownRetryMsg) this.toast(T('t_bossRetry'));
  }
  endBoss(b) {
    this.bossActive = null; this.lastBoss = b;
    if (b.arena) for (let y = 0; y < this.h; y++) for (let x = 0; x < this.w; x++) if (this.tiles[y][x] === 'X') this.tiles[y][x] = ' ';
    this.arena = null;
    for (let i = 0; i < 5; i++) setTimeout(() => this.explode(b.x + rand(-b.r, b.r), b.y + rand(-b.r, b.r), 30, false), i * 150);
    for (const e of this.ents) if (e.isEnemy && !e.boss) e.hurt(99);
    for (const e of this.ents) if ((e instanceof Bullet && e.enemy) || e.bossHazard) e.dead = true;
    Sfx.music(this.def.music);
    const after = () => { if (b.ev) this.event(b.ev); };
    if (b.outro) this.say(b.outro, after); else after();
  }

  reachGoal(goal) {
    if (this.state !== 'play') return;
    this.state = 'clear';
    this.player.goalAnim = 0.01; this.player.x = goal.x; this.player.vx = 0;
    Sfx.stopMusic(); Sfx.play('clear');
    const finish = () => { if (this.onFinish) this.onFinish(this.result()); };
    const outro = typeof this.def.outro === 'function' ? this.def.outro() : this.def.outro;
    setTimeout(() => {
      if (outro) this.say(outro, finish);
      else finish();
    }, 1400);
  }
  finish() {
    if (this.state === 'clear') return;
    this.state = 'clear'; Sfx.stopMusic(); Sfx.play('clear');
    setTimeout(() => { if (this.onFinish) this.onFinish(this.result()); }, 1200);
  }
  result() {
    return { id: this.def.id, coins: this.coins, coinTotal: this.coinTotal, time: Math.ceil(this.time), deaths: this.deaths, kills: this.kills, next: this.next };
  }

  // ----------- actualización -----------
  update(dt) {
    this.t += dt;
    if (this.titleT > 0 && !this.dialog) this.titleT -= dt;
    this.vw = VW / (this.preview ? 1 : ZOOM); this.vh = VH / (this.preview ? 1 : ZOOM);
    if (this.preview) {
      this.cam.x += 60 * dt;
      if (this.cam.x > this.w * TILE - this.vw) this.cam.x = 0;
      this.cam.y = Math.max(0, this.h * TILE - this.vh);
      for (const e of this.ents) e.update(dt);
      return;
    }
    this.stepScripts(dt);
    if (this.glitchT > 0 && (this.dialog || this.cut)) this.glitchT -= dt;
    if (this.choice) { this.updateChoice(dt); this.updateParts(dt); return; }
    if (this.dialog) { this.updateDialog(dt); this.updateParts(dt); return; }
    if (this.state === 'play' && !this.cut) this.time += dt;
    this.bars = approach(this.bars, this.cut ? 1 : 0, dt * 3);
    if (this.portalCool > 0) this.portalCool -= dt;
    this.updateTimed(dt);
    for (const e of this.ents) if (e.platform) e.update(dt);
    this.player.update(dt);
    // Durante una pelea de jefe nadie sale de la arena (ni escalando la barrera)
    if (this.arena && this.bossActive) {
      const lo = (this.arena.x0 + 1) * TILE, hi = this.arena.x1 * TILE;
      const p = this.player;
      if (!p.dying) { if (p.x < lo + p.hw) { p.x = lo + p.hw; p.vx = Math.max(0, p.vx); } if (p.x > hi - p.hw) { p.x = hi - p.hw; p.vx = Math.min(0, p.vx); } }
      const b = this.bossActive;
      if (!b.noClamp) b.x = clamp(b.x, lo + b.hw, hi - b.hw);
    }
    if (this.companion) this.companion.update(dt);
    const cx = this.cam.x + this.vw / 2;
    for (let i = 0; i < this.ents.length; i++) {
      const e = this.ents[i];
      if (e.platform || e.dead) continue;
      if (!e.boss && !e.always && !(e instanceof Bullet) && Math.abs(e.x - cx) > this.vw * 1.2) continue;
      e.update(dt);
    }
    this.ents = this.ents.filter((e) => !e.dead || (e.boss && e === this.bossActive));
    // puertas con llave
    if (this.hasKey) {
      const p = this.player, tx = Math.floor(p.x / TILE), ty = Math.floor(p.y / TILE);
      for (let dx = -1; dx <= 1; dx++) for (let dy = -1; dy <= 1; dy++) if (this.tile(tx + dx, ty + dy) === 'k') this.openDoor(tx + dx, ty + dy);
    }
    // jefes
    for (const b of this.bosses) {
      if (!b.dead && !b.active && !this.bossActive && b.arena && !b.trig && this.player.x > (b.arena[0] + 2) * TILE && this.player.x < b.arena[1] * TILE) this.startBoss(b);
      if (!b.dead && !b.active && !b.arena && !b.trig && !this.bossActive && Math.abs(this.player.x - b.x) < 450) this.startBoss(b);
    }
    if (this.bossActive && this.bossActive.dead) { const b = this.bossActive; this.ents = this.ents.filter((e) => e !== b); this.endBoss(b); }
    this.updateParts(dt);
    for (const t of this.toasts) t.t -= dt;
    this.toasts = this.toasts.filter((t) => t.t > 0);
    if (this.flash > 0) this.flash -= dt;
    if (this.glitchT > 0) this.glitchT -= dt;
    this.updateCam(dt);
  }
  // Bloques que aparecen y desaparecen (T encendido, t apagado)
  updateTimed(dt) {
    if (!this.def.timed) return;
    this.timedT += dt;
    const per = this.def.timed;
    if (this.timedT < per) return;
    this.timedT = 0; this.timedOn = !this.timedOn;
    const p = this.player;
    for (let y = 0; y < this.h; y++) for (let x = 0; x < this.w; x++) {
      const c = this.tiles[y][x];
      // los dos grupos se turnan: T/t y H/h (al revés)
      if (c === 'T' || c === 't') {
        const on = this.timedOn;
        if (on && Math.abs(p.x - (x * TILE + 16)) < 16 + p.hw && Math.abs(p.y - (y * TILE + 16)) < 16 + p.hh) continue;
        this.tiles[y][x] = on ? 'T' : 't';
      } else if (c === 'H' || c === 'h') {
        this.tiles[y][x] = this.timedOn ? 'h' : 'H';
      }
    }
    Sfx.play('beep');
  }
  // Rompe la roca 'M' (pico de Calienterrito) en un área
  mineArea(hb) {
    const x0 = Math.floor((hb.x - hb.hw) / TILE), x1 = Math.floor((hb.x + hb.hw) / TILE);
    const y0 = Math.floor((hb.y - hb.hh) / TILE), y1 = Math.floor((hb.y + hb.hh) / TILE);
    let n = 0;
    for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) if (this.tile(x, y) === 'M') {
      this.setTile(x, y, ' '); n++;
      this.puff(x * TILE + 16, y * TILE + 16, '#8a7a6a', 6, 140); this.puff(x * TILE + 16, y * TILE + 16, '#ff8a3a', 3, 90);
    }
    if (n) { Sfx.play('mine'); this.shake(4); this.event('mined'); }
    return n;
  }
  openDoor(tx, ty, ch = 'k') {
    const stack = [[tx, ty]];
    while (stack.length) {
      const [x, y] = stack.pop();
      if (this.tile(x, y) !== ch) continue;
      this.setTile(x, y, ' '); this.puff(x * TILE + 16, y * TILE + 16, ch === 'g' ? '#ffcf1a' : '#c9a227', 5, 80);
      stack.push([x + 1, y], [x - 1, y], [x, y + 1], [x, y - 1]);
    }
    Sfx.play('key'); if (ch === 'k') this.hasKey = false;
  }
  updateParts(dt) {
    for (const p of this.parts) { p.life -= dt; p.vy += p.g * dt; p.x += p.vx * dt; p.y += p.vy * dt; }
    this.parts = this.parts.filter((p) => p.life > 0);
    if (this.parts.length > 600) this.parts.splice(0, this.parts.length - 600);
  }
  updateCam(dt) {
    const p = this.player;
    const vw = this.vw;
    const lead = p.power === 'rapidez' ? clamp(p.vx * 0.22, -170, 170) : p.dir * 50;
    let tx = p.x - vw / 2 + lead, ty = this.camYFor(p.y);
    if (this.camOverride) { tx = this.camOverride.x - vw / 2; ty = this.camYFor(this.camOverride.y); }
    let minX = 0, maxX = this.w * TILE - vw;
    if (this.arena) {
      const ax0 = this.arena.x0 * TILE, ax1 = (this.arena.x1 + 1) * TILE;
      if (ax1 - ax0 <= vw) { minX = maxX = (ax0 + ax1) / 2 - vw / 2; } else { minX = ax0; maxX = ax1 - vw; }
    }
    tx = clamp(tx, minX, Math.max(minX, maxX));
    if (this.w * TILE < vw) tx = (this.w * TILE - vw) / 2;
    const k = 1 - Math.exp(-dt * (p.power === 'rapidez' ? 12 : 7));
    this.cam.x = lerp(this.cam.x, tx, k);
    this.cam.y = lerp(this.cam.y, ty, 1 - Math.exp(-dt * (p.vy < -900 ? 10 : 5)));
    if (this.shakeA > 0) this.shakeA = Math.max(0, this.shakeA - dt * 30);
  }

  get uv() { return !this.preview && this.player && this.player.power === 'uv'; }

  // ----------- dibujo -----------
  draw(ctx, S) {
    const cam = this.cam;
    const sx = this.shakeA ? rand(-this.shakeA, this.shakeA) : 0, sy = this.shakeA ? rand(-this.shakeA, this.shakeA) : 0;
    BG.draw(ctx, this.theme, cam.x, cam.y, this.t, this.h);
    ctx.save();
    const z = this.preview ? 1 : ZOOM;
    ctx.scale(z, z);
    ctx.translate(-cam.x + sx, -cam.y + sy);
    for (const e of this.ents) if (e.drawBack) e.drawBack(ctx);
    for (const e of this.ents) if (e.back) e.draw(ctx);
    this.drawTiles(ctx, S * z, false);
    {
      const x0 = Math.max(0, Math.floor(cam.x / TILE) - 1), x1 = Math.min(this.w - 1, Math.ceil((cam.x + this.vw) / TILE) + 1);
      const y0 = Math.max(1, Math.floor(cam.y / TILE) - 1), y1 = Math.min(this.h - 1, Math.ceil((cam.y + this.vh) / TILE) + 1);

    for (const e of this.ents) if (!e.back && !e.front && !(e instanceof Bullet)) e.draw(ctx);
    if (!this.preview) {
      if (this.body) this.body.draw(ctx);
      if (this.companion) this.companion.draw(ctx);
      this.player.draw(ctx);
    }
    for (const e of this.ents) if (e instanceof Bullet || e.front) e.draw(ctx);
    this.drawParts(ctx);
    this.drawTiles(ctx, S * z, true);
    ctx.restore();
    const th = THEMES[this.theme];
    // cuevas oscuras: solo se ve alrededor de Pancho
    if (th.dark && !this.preview) {
      const p = this.player, px = (p.x - cam.x) * z, py = (p.y - cam.y) * z;
      const g = ctx.createRadialGradient(px, py, 60, px, py, 330);
      g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, `rgba(0,0,0,${th.dark * 2.4})`);
      ctx.fillStyle = g; ctx.fillRect(0, 0, VW, VH);
    }
    if (this.uv) { ctx.fillStyle = `rgba(150,40,255,${0.13 + Math.sin(this.t * 3) * 0.03})`; ctx.fillRect(0, 0, VW, VH); }
    if (this.flash > 0) { ctx.fillStyle = `rgba(255,255,255,${Math.min(0.8, this.flash * 2)})`; ctx.fillRect(0, 0, VW, VH); }
    if (this.glitchT > 0) {
      for (let i = 0; i < 6; i++) { ctx.fillStyle = pick(['rgba(255,0,212,0.35)', 'rgba(0,255,208,0.3)', 'rgba(0,0,0,0.5)']); ctx.fillRect(0, rand(0, VH), VW, rand(3, 22)); }
    }
    if (this.fade > 0) { ctx.fillStyle = this.fadeCol || `rgba(0,0,0,${Math.min(1, this.fade)})`; if (this.fadeCol) ctx.globalAlpha = Math.min(1, this.fade); ctx.fillRect(0, 0, VW, VH); ctx.globalAlpha = 1; }

    if (this.bars > 0 && !this.preview) { const h = 44 * this.bars; ctx.fillStyle = '#000'; ctx.fillRect(0, 0, VW, h); ctx.fillRect(0, VH - h, VW, h); }
  }
  drawTiles(ctx, S, overlay) {

    const x0 = Math.max(0, Math.floor(this.cam.x / TILE) - 1), x1 = Math.min(this.w - 1, Math.ceil((this.cam.x + this.vw) / TILE) + 1);
    const y0 = Math.max(0, Math.floor(this.cam.y / TILE) - 1), y1 = Math.min(this.h - 1, Math.ceil((this.cam.y + this.vh) / TILE) + 1);
    const th = THEMES[this.theme];
    const uv = this.uv || this.preview;
    if (!overlay) {
      const edges = [];
      for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) {
        const c = this.tiles[y][x];
        if (c === ' ') continue;
        const px = x * TILE, py = y * TILE;
        switch (c) {
          case '#': ctx.drawImage(SOLID[this.tile(x, y - 1)] || y === 0 ? T.fill : T.top, px, py, TILE, TILE); break;
          case 'B': ctx.drawImage(T.block, px, py, TILE, TILE); break;
          case 'M': ctx.drawImage(T.mine, px, py, TILE, TILE); break;
          case 'g': ctx.drawImage(T.gate, px, py, TILE, TILE); break;
          case 'Y': ctx.drawImage(T.bounce, px, py, TILE, TILE); break;
          case 'G': {
            ctx.drawImage(T.grill, px, py, TILE, TILE);
            if (Math.random() < 0.04) this.parts.push({ x: px + rand(4, 28), y: py, vx: 0, vy: -40, life: 0.8, max: 0.8, col: 'rgba(200,200,200,0.6)', size: 4, g: -20 });
            break;
          }
          case '>': case '<': {
            ctx.fillStyle = '#3a3a3a'; ctx.fillRect(px, py, TILE, TILE);
            ctx.fillStyle = '#5a5a5a'; ctx.fillRect(px, py, TILE, 8);
            ctx.fillStyle = '#ffcf1a'; const off = ((this.t * 60 * (c === '>' ? 1 : -1)) % 16 + 16) % 16;
            ctx.save(); ctx.beginPath(); ctx.rect(px, py, TILE, 8); ctx.clip();
            for (let k = -16; k < TILE + 16; k += 16) { ctx.beginPath(); const xx = px + k + off; if (c === '>') { ctx.moveTo(xx, py); ctx.lineTo(xx + 6, py + 4); ctx.lineTo(xx, py + 8); } else { ctx.moveTo(xx + 6, py); ctx.lineTo(xx, py + 4); ctx.lineTo(xx + 6, py + 8); } ctx.lineTo(xx + 3, py + 8); ctx.lineTo(xx + (c === '>' ? 9 : -3), py + 4); ctx.lineTo(xx + 3, py); ctx.fill(); }
            ctx.restore();

            break;
          }
          case 'T': case 'H': {
            const blink = this.def.timed && this.timedT > this.def.timed - 0.5 && Math.floor(this.t * 10) % 2;
            ctx.fillStyle = c === 'T' ? '#ff5ab4' : '#3ad7ff'; ctx.globalAlpha = blink ? 0.5 : 1; ctx.fillRect(px, py, TILE, TILE);
            ctx.fillStyle = 'rgba(255,255,255,0.4)'; ctx.fillRect(px + 3, py + 3, TILE - 6, 4); ctx.globalAlpha = 1;
            break;
          }
          case 't': case 'h': ctx.strokeStyle = c === 't' ? 'rgba(255,90,180,0.6)' : 'rgba(58,215,255,0.6)'; ctx.lineWidth = 2; ctx.setLineDash([4, 4]); ctx.strokeRect(px + 2, py + 2, TILE - 4, TILE - 4); ctx.setLineDash([]); break;
          case 'U': {

            } else if (hash1(x * 31 + y * 17 + Math.floor(this.t * 2)) > 0.97) { ctx.fillStyle = 'rgba(255,255,255,0.5)'; ctx.fillRect(px + 14, py + 14, 3, 3); }
            break;

          case 'C': ctx.drawImage(T.mine, px, py, TILE, TILE); break;
          case '=': ctx.drawImage(T.plat, px, py, TILE, TILE); break;
          case '^': ctx.drawImage(T.spikes, px, py, TILE, TILE); break;
          case 'k': ctx.drawImage(T.door, px, py, TILE, TILE); break;
          case 'L': {
            const col = th.lava || '#e8401c';
            ctx.fillStyle = col; ctx.fillRect(px, py, TILE, TILE);
            if (this.tile(x, y - 1) !== 'L') {
              ctx.fillStyle = shade(col, 0.35);
              ctx.beginPath(); ctx.moveTo(px, py + 8);
              for (let i = 0; i <= 4; i++) ctx.lineTo(px + i * 8, py + 5 + Math.sin(this.t * 4 + x * 1.3 + i) * 3);
              ctx.lineTo(px + TILE, py + 12); ctx.lineTo(px, py + 12); ctx.fill();
              if (hash1(x * 7 + Math.floor(this.t * 2)) > 0.8) { ctx.fillStyle = '#fff6c0'; ctx.beginPath(); ctx.arc(px + 16, py + 10 - ((this.t * 20) % 10), 3, 0, TAU); ctx.fill(); }
            }
            break;
          }
          case 'V': {
            // el vacío del Gran Apetito
            ctx.fillStyle = '#07000c'; ctx.fillRect(px, py, TILE, TILE);
            if (this.tile(x, y - 1) !== 'V') {
              ctx.fillStyle = '#ff00d4';
              for (let i = 0; i < 4; i++) { const h = 3 + Math.abs(Math.sin(this.t * 6 + x * 2 + i)) * 6; ctx.fillRect(px + i * 8, py, 6, h); }
            }
            if (Math.random() < 0.02) { ctx.fillStyle = '#00ffd0'; ctx.fillRect(px + rand(0, 28), py + rand(0, 28), 4, 4); }
            break;
          }
          case 'X': {
            ctx.fillStyle = `rgba(255,140,40,${0.35 + Math.sin(this.t * 8 + y) * 0.15})`; ctx.fillRect(px + 8, py, 16, TILE);
            ctx.strokeStyle = '#ffd25a'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(px + 16 + Math.sin(this.t * 20 + y) * 5, py); ctx.lineTo(px + 16 - Math.sin(this.t * 20 + y) * 5, py + TILE); ctx.stroke();
            break;
          }
        }
        if (SOLID[c] && c !== 'X' && (c !== 'U' || uv)) edges.push(x, y);
      }
      // contorno negro estilo caricatura
      ctx.strokeStyle = 'rgba(0,0,0,0.85)'; ctx.lineWidth = 2;
      ctx.beginPath();
      for (let i = 0; i < edges.length; i += 2) {
        const x = edges[i], y = edges[i + 1], px = x * TILE, py = y * TILE;
        const s = (dx, dy) => { const c = this.tile(x + dx, y + dy); return SOLID[c] && c !== 'X' && (c !== 'U' || uv); };
        if (!s(0, -1)) { ctx.moveTo(px, py + 1); ctx.lineTo(px + TILE, py + 1); }
        if (!s(0, 1) && y < this.h - 1) { ctx.moveTo(px, py + TILE - 1); ctx.lineTo(px + TILE, py + TILE - 1); }
        if (!s(-1, 0) && x > 0) { ctx.moveTo(px + 1, py); ctx.lineTo(px + 1, py + TILE); }
        if (!s(1, 0) && x < this.w - 1) { ctx.moveTo(px + TILE - 1, py); ctx.lineTo(px + TILE - 1, py + TILE); }
      }
      ctx.stroke();
    } else {
      for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) {
        const c = this.tiles[y][x];
        if (c !== 'W') continue;
        const px = x * TILE, py = y * TILE;
        ctx.fillStyle = th.liquid;
        const top = this.tile(x, y - 1) !== 'W';
        const wy = top ? py + 6 + Math.sin(this.t * 3 + x * 0.8) * 2 : py;
        ctx.fillRect(px, wy, TILE, py + TILE - wy);

  }
  drawParts(ctx) {
    for (const p of this.parts) {

  // Al empezar un nivel, la pantalla se abre con una mordida (estilo propio de Pancho)
  drawBite(ctx) {

    Art.coin(ctx, 28, 58, 0, 10);
    outlinedText(ctx, `${this.coins}/${this.coinTotal}`, 44, 59, 16, '#3a200c', '#fff', 'left');
    let yy = 98;
    // poder actual
    if (p.power) {
      ctx.save(); ctx.fillStyle = 'rgba(40,20,8,0.55)'; roundRect(ctx, 8, yy - 18, 150, 34, 10); ctx.fill(); ctx.restore();
      Art.powerIcon(ctx, 26, yy, p.power, 0.7);
      outlinedText(ctx, T('pw_' + p.power), 44, yy, 14, POWERS[p.power].col, '#000', 'left', 800);
      yy += 38;

    }

      ctx.fillStyle = p.charge >= 1 ? '#fff' : '#ff5ab4'; ctx.fillRect(14, yy - 6, 120 * Math.min(1, p.charge), 10);

      ctx.save(); ctx.fillStyle = 'rgba(40,20,8,0.55)'; roundRect(ctx, 8, yy - 8, 150, 26, 8); ctx.fill(); ctx.restore();

      ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fillRect(36, yy, 112, 10);

      ctx.strokeStyle = '#000'; ctx.lineWidth = 2; ctx.strokeRect(36, yy, 112, 10);

    if (b && b.active && !b.noBar) {
      const w = Math.min(420, VW * 0.5), x = VW / 2 - w / 2, y = 52;
      ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(x - 3, y - 3, w + 6, 18);
      ctx.fillStyle = '#ff2d55'; ctx.fillRect(x, y, w * Math.max(0, b.hp / b.maxHp), 12);
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.strokeRect(x - 3, y - 3, w + 6, 18);

// Nombre del nivel: "5 · El Castillo"
function levelLabel(id) { return id === 'P' ? T('lv_P') : `${T('ui_level')} ${id} · ${T('lv_' + id)}`; }

// Retratos para los diálogos: [tipo, accesorios, color del nombre]. 'food:...' son comidas, 'santy' es humano.
const PORTRAITS = {
  pancho: ['food:pancho', [], '#ffc061'], hamburguer: ['food:hamburguer', [], '#ff9a3a'], panchita: ['food:panchita', [], '#ff8ab0'],
  clonbot: ['food:robot', [], '#9adfff'], tutor: ['tutor', [], '#00ffaa'], manda: ['manda', [], '#00bfff'],
  nicole: ['nicole', ['foxEars', 'foxTail'], '#9ab8ff'], joshua: ['joshua', [], '#c9a2ff'], friveq: ['friveq', ['friveqHair'], '#00ffc8'],
  santy: ['santy', [], '#ffd84a'], cocinero: ['cocinero', [], '#ffffff'], papas: ['food:v:papas', [], '#ffe14d'], dona: ['food:v:dona', [], '#ff8ac0'], gaseosa: ['food:v:gaseosa', [], '#ff6a4a'],
  sistema: null, narrador: null,
};

function drawPortrait(ctx, P, x, y, r, expr, t) {
  const blink = (t % 3.5) < 0.1;
  if (P[0].startsWith('food:')) {
    const k = P[0].slice(5);
    if (k.startsWith('v:')) Art.vecino(ctx, x, y, r * 0.75, k.slice(2), { expr, t, blink });
    else Art.food(ctx, x, y + r * 0.1, r * (k === 'pancho' || k === 'robot' ? 0.62 : 0.7), k, { expr, t, blink, phi: 0.25 });
  } else if (P[0] === 'santy') Art.santy(ctx, x, y + 4, r * 0.03, { expr, t, blink, bust: true });
  else if (P[0] === 'cocinero') Art.cocinero(ctx, x, y + r * 0.2, r * 0.016, { expr, t, blink });
  else Art.ball(ctx, x, y, r, P[0], { expr, acc: P[1], t, phi: 0.25, blink });
}

<script>/* js/entities.js */
// Entidades: Pancho (con los poderes del Foogame), el ClonBot, Hamburguer (compañero), objetos, trampas y NPCs.
'use strict';

const GRAV = 1900, MAXFALL = 820;
const SALTARIN_MAX = Math.sqrt(5); // salto cargado: hasta 5 veces más alto (la altura crece con el cuadrado de la velocidad)

class Ent {
  constructor(x, y, hw, hh) {
    this.x = x; this.y = y; this.hw = hw; this.hh = hh;
    this.vx = 0; this.vy = 0; this.dead = false; this.t = 0;
    this.onGround = false; this.hitWall = 0;
  }
  update(dt) { this.t += dt; }
  draw(ctx) {}
  near(e, d) { return Math.abs(e.x - this.x) < d && Math.abs(e.y - this.y) < d; }
}

// ======================= Jugador =======================
class Player extends Ent {
  constructor(x, y, charId) {
    super(x, y, 17, 11);
    this.setChar(charId);
    this.dir = 1; this.phi = 1.15; this.idle = 0;
    this.jbuf = 0; this.coyote = 0; this.jumps = 0; this.lock = 0;
    this.inv = 0; this.melee = 0; this.meleeCd = 0;
    this.shield = 0; this.power = null; this.charge = 0; this.charging = false; this.grillT = 0;
    this.sq = 0; this.spin = 0; this.hurtT = 0; this.blinkT = 2;
    this.dying = 0; this.ride = null; this.wall = 0; this.goalAnim = 0; this.happyT = 0;
    this.checkX = x; this.checkY = y; this.water = 1; this.meterT = 0;
  }
  setChar(id) {
    this.charId = id;
    this.st = PLAYABLE[id];
    const d = Save.data;
    this.maxHp = this.st.hp + (d.upg.corazon && !this.st.robot ? 1 : 0);
    this.hp = this.maxHp;
    this.hw = this.st.hw || 17; this.hh = this.st.hh || 11;
  }
  get s() { return this.charId === 'hamburguer' ? 15.5 : 15; }
  get r() { return 15; }
  airJumps() { return this.st.air + (this.power === 'saltarin' ? 4 - this.st.air : 0); }

  dyingRot() { return (1.6 - this.dying) * 9; }
  hurt(dmg, fromX) {
    if (this.inv > 0 || this.dying || G.state !== 'play' || this.sleeping) return false;
    if (this.shield > 0) {
      // el escudo de Protegido aguanta los golpes
      this.shield--; this.inv = 0.9; Sfx.play(this.shield ? 'shield' : 'shieldbreak');
      G.sparkle(this.x, this.y, '#3ad7ff', 14); this.vx = (this.x < (fromX ?? this.x - this.dir) ? 1 : -1) * 160; this.vy = Math.min(this.vy, -200);
      return false;
    }
    this.hp -= Math.max(1, Math.round(dmg));
    this.inv = 1.3; this.hurtT = 0.6; this.charging = false; this.charge = 0;
    this.vy = -360; this.vx = (this.x < (fromX ?? this.x - this.dir) ? -1 : 1) * 260; this.lock = 0.18;
    Sfx.play('hurt'); G.shake(5);
    if (this.hp <= 0) this.die();
    return true;
  }
  die() {
    if (this.dying) return;
    // si el ClonBot se rompe, Pancho vuelve a su cuerpo
    if (this.st.robot && G.body) { G.explode(this.x, this.y, 30, false); G.swapBack(true); return; }
    this.dying = 1.6; this.hp = 0; this.vy = -560; this.vx = 0; this.charging = false; this.charge = 0;
    Sfx.play('die'); G.deaths++; Save.data.deaths++;
    if (G.onPlayerDie) G.onPlayerDie();
  }
  respawn() {
    this.dying = 0; this.hp = this.maxHp; this.inv = 1.5; this.spin = 0; this.sq = 0; this.goalAnim = 0;
    this.x = this.checkX; this.y = this.checkY; this.vx = this.vy = 0; this.water = 1; this.grillT = 0;
    if (G.bossActive) G.resetBoss();
    if (G.companion) { G.companion.x = this.x - 30; G.companion.y = this.y - 10; }
    if (G.onRespawn) G.onRespawn();
  }

  update(dt) {
    this.t += dt;
    const I = Input;
    if (this.sleeping) { this.vx = 0; this.vy += GRAV * dt; G.moveBody(this, dt); return; }
    this.updateQuip(dt);
    if (this.dying) {
      this.dying -= dt; this.vy += GRAV * dt; this.y += this.vy * dt;
      if (this.dying <= 0) this.respawn();
      return;
    }
    // si va arriba de algo que se mueve, se mueve con eso aunque esté en una escena
    if ((this.frozenCut || this.goalAnim) && this.ride && !this.ride.dead) { this.x += this.ride.dx || 0; this.y += this.ride.dy || 0; }
    if (this.frozenCut) { this.vx = 0; if (!this.noGrav) { this.vy += GRAV * dt; G.moveBody(this, dt); } this.phi = approach(this.phi, this.lookPhi ?? this.phi, dt * 6); return; }
    if (this.goalAnim) { this.goalAnim += dt; this.vx = 0; this.vy += GRAV * dt; G.moveBody(this, dt); return; }
    const ctl = G.state === 'play' && !G.cut;
    if (this.ride && !this.ride.dead) { this.x += this.ride.dx || 0; this.y += this.ride.dy || 0; }
    const inWater = G.waterAt(this.x, this.y + 4);
    const ketchup = inWater && THEMES[G.theme].liquidName === 'ketchup';
    if (inWater && !this.wasWater && this.vy > 200) { Sfx.play('splash'); G.splash(this.x, this.y); }
    this.wasWater = inWater;

    let L = ctl && I.down('left'), R = ctl && I.down('right');
    if (this.lock > 0) { this.lock -= dt; L = R = false; }
    const want = (R ? 1 : 0) - (L ? 1 : 0);
    const fast = this.power === 'rapidez';
    const maxV = this.st.speed * (fast ? 5 : 1) * (inWater ? (ketchup ? 0.42 : 0.62) : 1) * (this.charging ? 0.25 : 1) * (G.def.meter && this.water <= 0 ? 0.7 : 1);
    const grip = 1;
    const acc = fast ? 5200 : 2600;
    if (want) {
      this.dir = want;
      this.vx = approach(this.vx, want * maxV, (this.onGround ? acc : acc * 0.65) * grip * dt);
    } else this.vx = approach(this.vx, 0, (this.onGround ? (fast ? 4200 : 2800) : 900) * grip * dt);
    if (fast && Math.abs(this.vx) > 500 && this.onGround && Math.random() < 0.5) G.puff(this.x - this.dir * 16, this.y + 10, 'rgba(255,240,180,0.9)', 1, 40);
    // cinta transportadora
    if (this.onGround && (this.under === '>' || this.under === '<')) this.x += (this.under === '>' ? 1 : -1) * 120 * dt;

    // ----- saltar -----
    const jPress = ctl && I.pressed('jump'), jHeld = ctl && I.down('jump');
    if (jPress) this.jbuf = 0.13; else this.jbuf -= dt;
    this.coyote = this.onGround ? 0.1 : this.coyote - dt;
    if (this.onGround) this.jumps = this.airJumps();

    // Saltarín: mantener ⤒ en el suelo carga un súper salto (hasta 5 veces más alto)
    if (this.power === 'saltarin' && !inWater) {
      if (this.charging) {
        if (!this.onGround && this.coyote <= 0) { this.charging = false; this.charge = 0; }
        else if (jHeld) {
          const was = this.charge; this.charge = Math.min(1, this.charge + dt / 0.85);
          if (was < 1 && this.charge >= 1) { Sfx.play('charge'); G.sparkle(this.x, this.y, '#ff5ab4', 8); }
          this.sq = 0.12 + this.charge * 0.18;
        } else {
          const k = this.charge < 0.18 ? 1.08 : lerp(1.3, SALTARIN_MAX, (this.charge - 0.18) / 0.82);
          this.vy = -this.st.jump * k; this.charging = false; this.charge = 0; this.coyote = 0; this.jbuf = 0;
          this.sq = -0.25; this.jumps = this.airJumps(); this.superJump = k > 1.6;
          Sfx.play(k > 1.6 ? 'superjump' : 'jump'); G.dust(this.x, this.y + this.hh);
          if (k > 1.6) G.puff(this.x, this.y + this.hh, '#ff5ab4', 10, 120);
        }
      } else if (this.jbuf > 0 && this.coyote > 0 && !this.wall) { this.charging = true; this.charge = 0; this.jbuf = 0; }
    }

    // Paredes (Escalador): con las garras se trepa hacia arriba
    this.wall = 0;
    const climber = this.power === 'escalador' || (G.def.abil && G.def.abil.wall);
    if (climber && !this.onGround && !inWater) {
      if (G.solidCol(this.x + this.hw + 2, this.y - this.hh + 4, this.y + this.hh - 4)) this.wall = 1;
      else if (G.solidCol(this.x - this.hw - 2, this.y - this.hh + 4, this.y + this.hh - 4)) this.wall = -1;
    }
    const sliding = this.wall && want === this.wall;

    let g = GRAV;
    if (inWater) g = ketchup ? 380 : 560;
    else if (this.vy < 0 && !jHeld && !this.superJump) g *= 2.3;
    if (this.vy >= 0) this.superJump = false;
    this.vy += g * dt;
    if (sliding) {
      // agarrado a la pared: mantener hacia la pared = trepar
      this.vy = this.power === 'escalador' ? -150 : Math.min(this.vy, 90);
      if (Math.random() < 0.25) G.dust(this.x + this.wall * this.hw, this.y + 6);
      // al llegar arriba de la pared, se impulsa por encima del borde
      if (!G.solidCol(this.x + this.wall * (this.hw + 2), this.y - this.hh - 6, this.y - this.hh)) { this.vy = -360; this.vx = this.wall * 140; }
    } else if (this.wall && this.vy > 0) this.vy = Math.min(this.vy, 70);
    this.vy = Math.min(this.vy, inWater ? (ketchup ? 110 : 170) : MAXFALL);

    if (this.jbuf > 0 && !this.charging) {
      if (inWater) { this.vy = G.waterAt(this.x, this.y - 22) ? (ketchup ? -300 : -380) : -600; this.jbuf = 0; Sfx.play('splash'); }
      else if (this.coyote > 0) {
        this.vy = -this.st.jump; this.jbuf = 0; this.coyote = 0; this.jumps = this.airJumps();
        this.sq = -0.2; Sfx.play('jump'); G.dust(this.x, this.y + this.hh);
      } else if (this.wall) {
        this.vy = -600; this.vx = -this.wall * 310; this.dir = -this.wall; this.lock = 0.13; this.jbuf = 0;
        this.jumps = this.airJumps(); Sfx.play('walljump'); G.dust(this.x + this.wall * this.hw, this.y);
      } else if (this.jumps > 0 && this.st.jump2) {
        this.vy = -this.st.jump2; this.jumps--; this.jbuf = 0; this.spin = 1; Sfx.play('djump');
        G.puff(this.x, this.y + this.hh, this.power === 'saltarin' ? '#ff5ab4' : '#ffffff', 6, 80);
      }
    }

    const wasGround = this.onGround;
    G.moveBody(this, dt);
    if (this.onGround && !wasGround) {
      this.sq = 0.22;
      // mostaza: rebota muy alto
      if (this.under === 'Y') { this.vy = -1080; this.onGround = false; this.jumps = this.airJumps(); this.sq = -0.3; Sfx.play('boing'); G.puff(this.x, this.y + this.hh, '#ffd400', 8, 120); }
    }
    this.sq = approach(this.sq, 0, dt * 1.6);
    if (this.spin > 0) this.spin = Math.max(0, this.spin - dt * 3.5);

    // ----- acción: el pico de Calienterrito (Minero) -----
    this.meleeCd -= dt;
    if (this.melee > 0) {
      this.melee -= dt;
      const hb = { x: this.x + this.dir * 28, y: this.y - 2, hw: 16, hh: 14 };
      for (const e of G.ents) {
        if (e.isEnemy && !e.dead && overlap(hb, e) && !this.meleeHit.has(e)) { this.meleeHit.add(e); e.hurt(2, this); }
        if (e instanceof Bullet && e.enemy && overlap(hb, e)) { e.dead = true; G.puff(e.x, e.y, '#fff', 4, 60); }
        if (e.onMelee && !e.dead && overlap(hb, e) && !this.meleeHit.has(e)) { this.meleeHit.add(e); e.onMelee(this); }
      }
      if (!this.mined) {
        this.mined = true;
        let n = G.mineArea(hb);
        // si no hay nada adelante, pica hacia abajo (o hacia arriba si está saltando)
        if (!n && this.onGround) n = G.mineArea({ x: this.x, y: this.y + this.hh + 14, hw: 10, hh: 6 });
        if (!n && !this.onGround) G.mineArea({ x: this.x, y: this.y - this.hh - 14, hw: 10, hh: 6 });
      }
    }
    if (ctl && this.pico && I.pressed('action') && this.meleeCd <= 0) {
      this.melee = 0.22; this.meleeCd = 0.32; this.meleeHit = new Set(); this.mined = false;
      Sfx.play('melee');
    }

    if (this.inv > 0) this.inv -= dt;
    if (this.hurtT > 0) this.hurtT -= dt;
    if (this.happyT > 0) this.happyT -= dt;
    this.hazards(dt, inWater);

    // Animación: hacia dónde mira
    if (Math.abs(this.vx) > 15 || !this.onGround) this.idle = 0; else this.idle += dt;
    let target = this.dir * 1.15;
    if (this.idle > 0.9) target = 0;
    if (this.wall) target = this.wall * 1.15;
    this.phi = approach(this.phi, target, dt * 9);
    this.blinkT -= dt; if (this.blinkT < -0.12) this.blinkT = 2 + Math.random() * 3;
    if (this.y > G.h * TILE + 80) {
      const fe = G.def.fallEvent;
      if (fe && !G.fell) { G.fell = true; this.vy = 0; this.frozenCut = true; G.event('fall'); }
      else if (!G.fell) this.die();
    }
  }

  hazards(dt, inWater) {
    const x0 = Math.floor((this.x - this.hw + 2) / TILE), x1 = Math.floor((this.x + this.hw - 2) / TILE);
    const y0 = Math.floor((this.y - this.hh + 2) / TILE), y1 = Math.floor((this.y + this.hh - 1) / TILE);
    for (let ty = y0; ty <= y1; ty++) for (let tx = x0; tx <= x1; tx++) {
      const c = G.tile(tx, ty);
      if (c === '^') { if (this.y + this.hh > ty * TILE + 14 && !this.st.robot) { this.hurt(1, tx * TILE + 16); this.vy = -520; } }
      else if (c === 'L') { if (this.y + this.hh > ty * TILE + 8) { this.hurt(1, this.x - this.dir); this.vy = -780; G.puff(this.x, this.y + 10, '#ff6a00', 10, 160); Sfx.play('fire'); } }
      else if (c === 'V') { if (!this.dying) { G.glitchFx(this.x, this.y, 16); Sfx.play('bite'); this.inv = 0; this.shield = 0; this.hp = 1; this.hurt(9, this.x); } }
    }
    // parrilla: quedarse parado quema
    if (this.onGround && this.under === 'G' && !this.st.robot) { this.grillT += dt; if (Math.random() < 0.2) G.puff(this.x, this.y + 8, 'rgba(200,200,200,0.8)', 1, 30); if (this.grillT > 0.55) { this.grillT = 0; this.hurt(1, this.x - this.dir); this.vy = -480; Sfx.play('fry'); } }
    else this.grillT = Math.max(0, this.grillT - dt);
    // sed (Salinas): la sal reseca. Las fuentes de gaseosa recargan.
    const m = G.def.meter;
    if (m && G.state === 'play' && !G.cut && !G.dialog && !G.bossActive) {
      const src = G.ents.find((e) => e.oasis && !e.dead && Math.abs(e.x - this.x) < (e.range || 90) && Math.abs(e.y - this.y) < 90);
      if (src) { this.water = Math.min(1, this.water + dt * 0.6); if (Math.random() < 0.1) G.sparkle(this.x, this.y - 20, '#6fd0ff', 1); }
      else this.water = Math.max(0, this.water - dt / (G.def.meterTime || 38));
      if (this.water <= 0) { this.meterT += dt; if (this.meterT > 2.2) { this.meterT = 0; this.inv = 0; this.hurt(1, this.x - this.dir); } }
      else this.meterT = 0;
    }
  }

  // Si Pancho se queda quieto, refunfuña. Lo que dice cambia con cada mundo: al principio es gruñón y al final es cálido.
  updateQuip(dt) {
    if (this.charId !== 'pancho' || this.st.robot || G.preview) return;
    const idle = G.state === 'play' && !G.dialog && !G.cut && !G.choice && this.onGround && Math.abs(this.vx) < 5 && !this.dying;
    if (this.quip) { this.quip.t -= dt; if (this.quip.t <= 0 || !idle) this.quip = null; }
    this.idleT = idle ? (this.idleT || 0) + dt : 0;
    if (this.idleT > (this.quipWait || 6)) {
      this.idleT = 0; this.quipWait = 14;
      const wi = WORLDS.findIndex((w) => w.levels.includes(G.def.id)), w = clamp(wi, 1, 4);
      let n; do n = Math.floor(Math.random() * 3); while (n === this.lastQuip);
      this.lastQuip = n;
      this.quip = { text: T(`q${w}_${n}`), t: 3.6, expr: ['angry', 'serious', 'neutral', 'happy'][w - 1] };
    }
  }
  draw(ctx) {
    if (this.inv > 0 && !this.dying && !this.sleeping && Math.floor(this.t * 20) % 2 === 0) return;
    let expr = 'neutral';
    if (this.forceExpr) expr = this.forceExpr;
    else if (this.sleeping) expr = 'blink';
    else if (this.dying) expr = 'verysad';
    else if (this.hurtT > 0) expr = 'scared';
    else if (this.quip) expr = this.quip.expr;
    else if (G.def.meter && this.water < 0.25) expr = 'sad';
    else if (this.happyT > 0 || this.goalAnim) expr = 'happy';
    else if (this.charging && this.charge > 0.5) expr = 'serious';
    else if (this.melee > 0) expr = 'angry';
    else if (this.power === 'rapidez' && Math.abs(this.vx) > 600) expr = 'happy';
    else if (this.wall && !this.onGround) expr = 'serious';
    const robot = this.st.robot;
    const o = {
      phi: this.goalAnim ? Math.PI : this.phi, expr, blink: this.blinkT < 0 && expr === 'neutral',
      sq: this.sq + (this.onGround && Math.abs(this.vx) > 30 && !this.dying ? Math.sin(this.t * 18) * 0.04 : 0),
      rot: this.dying ? this.dyingRot() : this.spin * TAU * this.dir * 0.5, t: this.t,
      claws: this.power === 'escalador' && !this.dying, hat: robot ? 'none' : (this.charId === 'pancho' ? Save.data.hat : 'none'), rebel: this.rebel,
    };
    if (this.quip) drawBubble(ctx, this.x, this.y - 30, this.quip.text, 220);
    // estela de Rapidez
    if (this.power === 'rapidez' && Math.abs(this.vx) > 450 && !this.dying) {
      ctx.save(); ctx.strokeStyle = 'rgba(255,225,77,0.7)'; ctx.lineWidth = 3;
      for (let i = 0; i < 4; i++) { const yy = this.y - 8 + i * 6; ctx.beginPath(); ctx.moveTo(this.x - this.dir * 22, yy); ctx.lineTo(this.x - this.dir * (40 + Math.random() * 30), yy); ctx.stroke(); }
      ctx.restore();
    }
    // el pico en la espalda (o dando el golpe)
    if (this.pico && !this.dying && !robot) {
      if (this.melee > 0) { const k = (0.22 - this.melee) / 0.22; Art.pick(ctx, this.x + this.dir * 22, this.y - 2, 0.75, this.dir * (-1.4 + k * 2.6)); }
      else Art.pick(ctx, this.x - this.dir * 6, this.y - 12, 0.55, this.dir * -0.6);
    }
    Art.food(ctx, this.x, this.y + 1, this.s, robot ? 'robot' : this.st.food, o);
    // visera de visión ultravioleta
    if (this.power === 'uv' && !this.dying) {
      ctx.save(); ctx.fillStyle = 'rgba(176,77,255,0.55)'; ctx.strokeStyle = '#000'; ctx.lineWidth = 1.8;
      ctx.beginPath(); roundRect(ctx, this.x - 14 + Math.sin(this.phi) * 4, this.y - 9, 28, 9, 4); ctx.fill(); ctx.stroke(); ctx.restore();
    }
    if (this.shield > 0) {
      ctx.save(); ctx.globalAlpha = 0.4 + Math.sin(this.t * 10) * 0.12;
      ctx.strokeStyle = '#3ad7ff'; ctx.lineWidth = 3; ctx.fillStyle = 'rgba(58,215,255,0.18)';
      ctx.beginPath(); ctx.ellipse(this.x, this.y, 30, 23, 0, 0, TAU); ctx.fill(); ctx.stroke();
      if (this.shield > 1) { ctx.beginPath(); ctx.ellipse(this.x, this.y, 35, 28, 0, 0, TAU); ctx.stroke(); }
      ctx.restore();
    }
    if (this.charging) {
      ctx.save(); ctx.globalAlpha = 0.3 + this.charge * 0.5; ctx.strokeStyle = '#ff5ab4'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(this.x, this.y + 6, 18 + this.charge * 10 + Math.sin(this.t * 30) * 2, Math.PI * 1.1, Math.PI * 1.9); ctx.stroke(); ctx.restore();
    }
    if (this.sleeping) outlinedText(ctx, 'z', this.x + 14 + Math.sin(this.t * 2) * 3, this.y - 22 - ((this.t * 12) % 14), 13, '#fff', '#000');
  }
}

// ======================= Hamburguer (compañero que sigue a Pancho) =======================
class Buddy extends Ent {
  constructor(x, y, kind = 'hamburguer') {
    super(x, y, 14, 14); this.kind = kind;
    this.dir = 1; this.phi = 1.15; this.talkT = 6 + Math.random() * 5; this.bubble = null; this.shootT = 2;
  }
  update(dt) {
    this.t += dt;
    if (this.hidden) return;
    const p = G.player;
    if (this.ride && !this.ride.dead) { this.x += this.ride.dx || 0; this.y += this.ride.dy || 0; }
    if (this.cutX != null) { this.vx = Math.abs(this.cutX - this.x) > 6 ? sign(this.cutX - this.x) * 200 : 0; }
    else {
      const tx = p.x - p.dir * 44;
      const dx = tx - this.x;
      this.vx = Math.abs(dx) > 12 ? sign(dx) * Math.min(p.power === 'rapidez' ? 1100 : 300, Math.abs(dx) * 4) : approach(this.vx, 0, 900 * dt);
    }
    if (Math.abs(this.vx) > 10) this.dir = sign(this.vx);
    this.vy += GRAV * dt; this.vy = Math.min(this.vy, MAXFALL);
    if (this.onGround && this.cutX == null && (p.y < this.y - 40 || (this.hitWall && Math.abs(p.x - this.x) > 20))) this.vy = -640;
    G.moveBody(this, dt);
    if (this.cutX == null && (dist(this.x, this.y, p.x, p.y) > 380 || this.y > G.h * TILE || G.tile(Math.floor(this.x / TILE), Math.floor(this.y / TILE)) === 'V')) { this.x = p.x - p.dir * 30; this.y = p.y - 16; this.vx = this.vy = 0; }
    // en las peleas tira pepinillos al jefe
    const b = G.bossActive;
    this.shootT -= dt;
    if (b && b.active && !b.noBuddy && this.shootT <= 0 && !G.cut) {
      this.shootT = 1.4 + Math.random() * 0.6;
      const tx = b.aimX ? b.aimX() : b.x, ty = b.aimY ? b.aimY() : b.y;
      const a = Math.atan2(ty - this.y, tx - this.x);
      const bl = new Bullet(this.x, this.y - 6, Math.cos(a) * 520, Math.sin(a) * 520 - 60, false, PICKLE_SHOT); bl.owner = this; G.add(bl);
      Sfx.play('hop');
    }
    this.talkT -= dt;
    if (this.talkT <= 0 && !G.dialog) { this.talkT = 10 + Math.random() * 8; this.bubble = { text: T('hb_' + Math.floor(Math.random() * 6)), t: 2.6 }; }
    if (this.bubble) { this.bubble.t -= dt; if (this.bubble.t <= 0) this.bubble = null; }
    this.phi = approach(this.phi, Math.abs(this.vx) > 10 || !this.onGround ? this.dir * 1.15 : 0, dt * 8);
  }
  draw(ctx) {
    if (this.hidden) return;
    const walk = this.onGround && Math.abs(this.vx) > 30 ? Math.abs(Math.sin(this.t * 14)) * 3 : 0;
    Art.food(ctx, this.x, this.y - walk, 14.5, this.kind, { phi: this.phi, expr: this.expr || 'happy', t: this.t, blink: this.t % 3.3 < 0.12 });
    if (this.bubble) drawBubble(ctx, this.x, this.y - 26, this.bubble.text);
  }
}

function drawBubble(ctx, x, y, text, maxW = 200) {
  setFont(ctx, 13, 700);
  const lines = wrapText(ctx, text, maxW);
  const w = Math.min(maxW, Math.max(...lines.map((l) => ctx.measureText(l).width))) + 16, h = lines.length * 16 + 10;
  ctx.save();
  ctx.fillStyle = '#fff'; ctx.strokeStyle = '#000'; ctx.lineWidth = 2;
  roundRect(ctx, x - w / 2, y - h, w, h, 8); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x - 6, y - 1); ctx.lineTo(x, y + 8); ctx.lineTo(x + 6, y - 1); ctx.fill();
  ctx.beginPath(); ctx.moveTo(x - 6, y); ctx.lineTo(x, y + 8); ctx.lineTo(x + 6, y); ctx.stroke();
  ctx.fillStyle = '#111'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  lines.forEach((l, i) => ctx.fillText(l, x, y - h + 13 + i * 16));
  ctx.restore();
}

// ======================= Proyectiles =======================
class Bullet extends Ent {
  constructor(x, y, vx, vy, enemy, W) {
    super(x, y, W.r || 5, W.r || 5);
    this.vx = vx; this.vy = vy; this.enemy = enemy; this.W = W;
    this.dmg = W.dmg; this.life = W.life || 1.4; this.grav = W.grav || 0; this.hits = new Set();
  }
  update(dt) {
    this.t += dt; this.life -= dt;
    this.vy += this.grav * dt;
    this.x += this.vx * dt; this.y += this.vy * dt;
    if (this.life <= 0) { this.dead = true; return; }
    const tx = Math.floor(this.x / TILE), ty = Math.floor(this.y / TILE);
    if (!this.W.ghost && G.isSolid(tx, ty)) { this.dead = true; G.puff(this.x, this.y, this.W.col || '#fff', 4, 70); return; }
    if (this.enemy) {
      const p = G.player;
      if (!p.dying && overlap(this, p)) { this.dead = true; p.hurt(this.dmg, this.x); }
    } else {
      for (const e of G.ents) {
        if (!e.isEnemy || e.dead || this.hits.has(e) || e.active === false) continue;
        if (overlap(this, e)) { this.hits.add(e); e.hurt(this.dmg, this); this.dead = true; break; }
      }
    }
  }
  draw(ctx) {
    const W = this.W;
    ctx.save(); ctx.translate(this.x, this.y);
    ctx.strokeStyle = '#000'; ctx.lineWidth = 2; ctx.lineJoin = 'round';
    if (W.kind === 'toast') {
      ctx.rotate(this.t * 6); ctx.fillStyle = '#d9963a';
      ctx.beginPath(); ctx.moveTo(-9, 9); ctx.lineTo(-9, -3); ctx.quadraticCurveTo(-11, -11, 0, -11); ctx.quadraticCurveTo(11, -11, 9, -3); ctx.lineTo(9, 9); ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#ffe9b0'; ctx.fillRect(-6, -4, 12, 11);
    } else if (W.kind === 'salt') {
      ctx.fillStyle = '#fff'; ctx.fillRect(-3, -3, 6, 6); ctx.strokeRect(-3, -3, 6, 6);
    } else if (W.kind === 'palillo') {
      ctx.rotate(Math.atan2(this.vy, this.vx)); ctx.strokeStyle = '#000'; ctx.lineWidth = 5; ctx.beginPath(); ctx.moveTo(-12, 0); ctx.lineTo(12, 0); ctx.stroke();
      ctx.strokeStyle = '#f0d49a'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(-12, 0); ctx.lineTo(12, 0); ctx.stroke();
    } else if (W.kind === 'pickle') {
      ctx.rotate(this.t * 10); ctx.fillStyle = '#5aa83a'; ctx.beginPath(); ctx.ellipse(0, 0, 5, 9, 0, 0, TAU); ctx.fill(); ctx.stroke();
    } else if (W.kind === 'oil') {
      ctx.fillStyle = '#ffb81a'; ctx.beginPath(); ctx.arc(0, 0, this.hw, 0, TAU); ctx.fill(); ctx.stroke(); ctx.fillStyle = '#fff6c0'; ctx.beginPath(); ctx.arc(-2, -2, this.hw * 0.35, 0, TAU); ctx.fill();
    } else if (W.kind === 'smoothie') {
      ctx.fillStyle = '#ff6aa8'; ctx.beginPath(); ctx.arc(0, 0, this.hw, 0, TAU); ctx.fill(); ctx.stroke();
    } else if (W.kind === 'paper') {
      ctx.rotate(Math.atan2(this.vy, this.vx)); ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.moveTo(12, 0); ctx.lineTo(-10, -8); ctx.lineTo(-5, 0); ctx.lineTo(-10, 8); ctx.closePath(); ctx.fill(); ctx.stroke();
    } else if (W.kind === 'chat') {
      // mensaje del chat de SantyTG11
      ctx.rotate(Math.sin(this.t * 6) * 0.2); ctx.fillStyle = this.W.col || '#9146ff'; ctx.beginPath(); roundRect(ctx, -16, -9, 32, 18, 6); ctx.fill(); ctx.stroke();
      setFont(ctx, 10, 900); ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(this.txt || 'xD', 0, 1);
    } else if (W.kind === 'coin') {
      ctx.restore(); Art.coin(ctx, this.x, this.y, this.t * 3, 8); return;
    } else if (W.kind === 'wave') {
      ctx.strokeStyle = '#ffe14d'; ctx.lineWidth = 4; ctx.beginPath(); ctx.arc(0, 0, this.hw, -1, 1); ctx.stroke(); ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(-3, 0, this.hw * 0.7, -1, 1); ctx.stroke();
    } else if (W.kind === 'void') {
      ctx.fillStyle = '#07000c'; ctx.beginPath(); ctx.arc(0, 0, this.hw + 1, 0, TAU); ctx.fill(); ctx.strokeStyle = '#ff00d4'; ctx.stroke();
    } else {
      ctx.fillStyle = '#000'; ctx.beginPath(); ctx.arc(0, 0, this.hw + 1.5, 0, TAU); ctx.fill();
      ctx.fillStyle = W.col || '#ff4d4d'; ctx.beginPath(); ctx.arc(0, 0, this.hw, 0, TAU); ctx.fill();
    }
    ctx.restore();
  }
}
const PICKLE_SHOT = { dmg: 1, r: 6, kind: 'pickle', life: 2, grav: 300 };
const TOAST = { dmg: 1, r: 9, kind: 'toast', life: 4, grav: 900 };

const PALILLO = { dmg: 1, r: 6, kind: 'palillo', life: 4 };
const OIL = { dmg: 1, r: 7, kind: 'oil', life: 4, grav: 900 };
const SMOOTHIE = { dmg: 1, r: 8, kind: 'smoothie', life: 4, grav: 800 };

function enemyShot(x, y, tx, ty, speed, W) {
  const a = Math.atan2(ty - y, tx - x);

}

class Coin extends Ent {
  constructor(x, y) { super(x, y, 10, 10); this.ph = Math.random() * 6; }
  update(dt) {
    this.t += dt;
    if (this.vy) {
      this.vy += GRAV * 0.5 * dt; this.y += this.vy * dt;

      if (this.vy < 0 && G.isSolidPx(this.x, this.y - 10)) { this.vy = 1; this.y = Math.floor((this.y - 10) / TILE + 1) * TILE + 10; }
      else if (this.vy > 0 && G.isSolidPx(this.x, this.y + 10)) { this.vy = 0; this.y = Math.floor((this.y + 10) / TILE) * TILE - 10; }
      if (this.y > G.h * TILE + 50) this.dead = true;
    }
    const pl = G.player;
    if (Save.data.upg.iman && !pl.dying && dist(this.x, this.y, pl.x, pl.y) < 110) { this.x = lerp(this.x, pl.x, dt * 8); this.y = lerp(this.y, pl.y, dt * 8); }
    if (overlap(this, pl) && !pl.dying) { this.dead = true; G.coins++; Sfx.play('coin'); G.sparkle(this.x, this.y, '#ffd700'); }
  }
  draw(ctx) { Art.coin(ctx, this.x, this.y + Math.sin(this.t * 3 + this.ph) * 2, this.t + this.ph); }
}

class PowerCapsule extends Ent {
  constructor(x, y, kind, respawn = true) { super(x, y, 16, 16); this.kind = kind; this.respawn = respawn; this.gone = 0; }

      const already = this.kind === 'protegido' ? p.shield >= 2 : p.power === this.kind;

      if (first && !(G.def.events && G.def.events['got_' + this.kind])) G.say([['tutor', 'happy', 'pwd_' + this.kind]]);

  }
}

// Almohadilla del ClonBot: cambia de cuerpo con el robot (o vuelve al cuerpo de Pancho)
class ClonPad extends Ent {
  constructor(x, y) { super(x, y, 14, 16); }
  update(dt) {
    this.t += dt;
    const p = G.player;
    // después de cambiar de cuerpo, hay que salir de la almohadilla antes de volver a usarla
    if (p.padLock) { if (!G.ents.some((e) => e instanceof ClonPad && overlap(e, p))) p.padLock = false; return; }
    if (!overlap(this, p) || p.dying || G.state !== 'play' || (G.swapCool || 0) > G.t) return;
    if (p.st.robot) { G.swapCool = G.t + 1; G.swapBack(false); }
    else {
      const shells = G.ents.filter((e) => e instanceof RobotShell && !e.boomT);
      if (!shells.length) return;
      const r = shells.reduce((a, b) => (dist(a.x, a.y, this.x, this.y) < dist(b.x, b.y, this.x, this.y) ? a : b));
      G.swapCool = G.t + 1; G.swapTo(r);
    }
  }
  draw(ctx) {
    const y = this.y + Math.sin(this.t * 3) * 3;
    ctx.save(); ctx.globalAlpha = 0.3 + Math.sin(this.t * 5) * 0.12; ctx.fillStyle = '#40e0ff'; ctx.beginPath(); ctx.arc(this.x, y, 22, 0, TAU); ctx.fill(); ctx.restore();
    Art.food(ctx, this.x, y, 9, 'robot', { expr: 'happy', t: this.t, phi: Math.sin(this.t) * 0.8 });
    ctx.strokeStyle = 'rgba(64,224,255,0.8)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.ellipse(this.x, y + 14, 16, 4, 0, 0, TAU); ctx.stroke();
  }
}

// El cuerpo del ClonBot cuando nadie lo usa (en otro lugar del nivel)
class RobotShell extends Ent {
  constructor(x, y, o = {}) { super(x, y, 17, 11); this.homeX = x; this.homeY = null; this.dir = o.dir || 1; this.inUse = false; this.boom = 0; }
  update(dt) {
    this.t += dt;
    if (this.homeY == null) this.homeY = this.y;
    if (this.boom > 0) { this.boom -= dt; this.boomT = true; if (this.boom <= 0) { this.boomT = false; G.sparkle(this.x, this.y, '#40e0ff', 12); } return; }
    if (this.inUse) return;
    this.vx = 0; this.vy += GRAV * dt; G.moveBody(this, dt);
    if (this.y > G.h * TILE + 50) { this.x = this.homeX; this.y = this.homeY; this.vy = 0; }
  }
  draw(ctx) {
    if (this.inUse || this.boom > 0) return;
    Art.food(ctx, this.x, this.y + 1, 15, 'robot', { phi: this.dir * 0.5, expr: 'blink', t: this.t });
    outlinedText(ctx, '⚡', this.x, this.y - 30 + Math.sin(this.t * 3) * 3, 14, '#40e0ff', '#000');
  }
}

class MPlat extends Ent {
  constructor(x, y, w = 3, axis = 'x', range = 4, speed = 1, style = 'tech') {

    this.fall = false; this.fallT = 0; this.fallen = 0;
  }
  update(dt) {
    this.t += dt;
    const px = this.x, py = this.y;
    if (this.axis === 'fall') {
      if (this.fallen > 0) { this.fallen -= dt; if (this.fallen <= 0) { this.x = this.ox; this.y = this.oy; this.vy = 0; this.fallT = 0; } }

    }

      ctx.fillStyle = '#40e0ff'; ctx.fillRect(x0 + 6, y0 + 4, this.hw * 2 - 12, 3);

      ctx.fillStyle = '#f2c070'; ctx.beginPath(); roundRect(ctx, x0 + 4, y0 + 3, this.hw * 2 - 8, 8, 4); ctx.fill();
    } else if (this.style === 'paper') {
      ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.moveTo(x0, y0 + 4); ctx.lineTo(x0 + this.hw * 2, y0); ctx.lineTo(x0 + this.hw * 2 - 8, y0 + 14); ctx.lineTo(x0 + 6, y0 + 14); ctx.closePath(); ctx.fill(); ctx.stroke();
    } else {

      ctx.fillStyle = 'rgba(255,255,255,0.25)'; ctx.fillRect(x0 + 2, y0 + 2, this.hw * 2 - 4, 3);
    }

  }
}

  constructor(x, y, o) { super(x, y, 10, 10); this.r = (o.r || 2) * TILE; this.every = o.every || 4; this.st = o.delay || 1; this.state = 'wait'; this.eaten = []; this.always = true; }
  update(dt) {
    this.t += dt; this.st -= dt;
    const p = G.player;
    if (this.state === 'wait' && this.st <= 0) { this.state = 'warn'; this.st = 1.1; }
    else if (this.state === 'warn' && this.st <= 0) {
      this.state = 'bite'; this.st = 2.6; Sfx.play('bite'); G.shake(5);
      const x0 = Math.floor((this.x - this.r) / TILE), x1 = Math.floor((this.x + this.r) / TILE);
      const y0 = Math.floor((this.y - this.r) / TILE), y1 = Math.floor((this.y + this.r) / TILE);
      for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) {
        const c = G.tile(x, y);
        if (c !== ' ' && c !== 'V' && dist(x * TILE + 16, y * TILE + 16, this.x, this.y) < this.r) { this.eaten.push([x, y, c]); G.setTile(x, y, ' '); }
      }
      if (!p.dying && dist(p.x, p.y, this.x, this.y) < this.r) p.hurt(1, this.x);
      G.glitchFx(this.x, this.y, 18);
    } else if (this.state === 'bite' && this.st <= 0) {
      // vuelve a crecer (si Pancho no está adentro)
      const pt = [Math.floor(p.x / TILE), Math.floor(p.y / TILE)];
      for (const [x, y, c] of this.eaten) if (!(Math.abs(x - pt[0]) <= 1 && Math.abs(y - pt[1]) <= 1)) G.setTile(x, y, c);
      this.eaten = []; this.state = 'wait'; this.st = this.every;
    }
  }
  draw(ctx) {
    if (this.state === 'warn') {
      ctx.save(); ctx.strokeStyle = `rgba(255,0,212,${0.4 + 0.4 * Math.sin(this.t * 20)})`; ctx.lineWidth = 3; ctx.setLineDash([8, 6]);
      ctx.beginPath(); ctx.arc(this.x, this.y, this.r, 0, TAU); ctx.stroke(); ctx.restore();
    } else if (this.state === 'bite' && this.st > 2.2) {
      ctx.save(); ctx.fillStyle = 'rgba(7,0,12,0.85)'; ctx.beginPath();
      for (let k = 0; k <= 24; k++) { const a = (k / 24) * TAU, q = this.r * (k % 2 ? 1 : 0.85); ctx.lineTo(this.x + Math.cos(a) * q, this.y + Math.sin(a) * q); }
      ctx.fill(); ctx.strokeStyle = '#ff00d4'; ctx.lineWidth = 3; ctx.stroke(); ctx.restore();
    }
  }

// [cómo se dibuja] según el tipo de NPC
const NPC_LOOK = {

  manda: (ctx, n, o) => Art.ball(ctx, n.x, n.y - 2, 17, 'manda', o),
