  "lv_17": "Rumah",
  "lv_18": "Dapur Tanpa Batas",
  "lv_19": "Menara Selera",
  "lv_20": "Sang Koki",
  "hb_0": "Pancho! Aku kangen!",
  "hb_1": "Aku lapar... ada McChulin's di sekitar sini?",
  "hb_2": "Yakin kamu tidak makan manusia? Enak, lho.",
  "hb_3": "Ayo, ayo!",
  "hb_4": "Joshua? Aku? Ah, nggak...",
  "hb_5": "Ini kayak video game.",
  "sty_0": "KASIH AKU UANG!",
  "sty_1": "Chat, lihat! Hot dog bisa bicara!",
  "sty_2": "Balik sini, hot dog! Ini demi stream!",
  "sty_3": "Paling parah kalau kamu baru mengetik namamu...",
  "sty_4": "Like dan subscribe, hot dog!",
  "sty_5": "Chat, pasang taruhan! Aku tangkap dia atau tidak?",
  "sty_got": "KENA! ...Ups, dia lolos.",
  "sty_hit": "Aduh! Chat, sakit!",
  "sty_phone": "Tunggu, aku baca chat dulu...",
  "sty_dash": "Speedrun!",
  "P.start.0": "Hari biasa lagi di Fooworld. Sama seperti kemarin. Sama seperti besok.",
  "P.start.1": "Pasti Hamburguer tersesat lagi. Aku cari dia... mau bagaimana lagi.",
  "P.papas.0": "Pagi, Pancho! Sudah makan siang manusia?",
  "P.papas.1": "Aku vegan, Don Papo. Sudah kubilang seribu kali. Aku tidak makan manusia.",
  "P.papas.2": "Iya, iya. Kamu galak sekali, Pancho.",
  "P.dona.0": "Pancho! Katanya hari ini McChulin's ada promo manusia.",
  "P.dona.1": "Dan sebenarnya manusia itu apa? Tak ada yang tahu. Dan tak ada yang peduli. Khas.",
  "P.meet.0": "PANCHO! Akhirnya ketemu juga!",
  "P.meet.1": "KAMU yang menemukanku? Aku mencarimu ke seluruh lingkungan! Kamu dari mana?",
  "P.meet.2": "Aku belanja di McChulin's! Aku habiskan satu paket penuh.",
  "P.meet.3": "Tentu saja. Dan aku menunggumu seperti orang bodoh.",
  "P.meet.4": "Dan aku bawa sesuatu untukmu: Manusia Sayur! Supaya kamu juga bisa menikmati McChulin's.",
  "P.meet.5": "...Yah. Itu baik juga. Makasih, Hamburguer. Kamu sahabat terbai...",
  "P.taken.0": "HAMBURGUER?!",
  "P.taken.1": "Tidak, tidak, tidak! Lepaskan dia! Dia satu-satunya temanku!",
  "P.end.0": "Satu tusukan. Lalu, gelap.",
  "P.end.1": "Saat Pancho tertidur, seseorang di kejauhan tertawa.",
  "toFoogame.title": "...",
  "toFoogame.0": "Pancho tidur lama sekali. Dia bermimpi tentang mahkota, lingkaran hijau, dan nama yang bukan miliknya.",
  "toFoogame.1": "Saat bangun, dia sudah tidak di Fooworld. Semuanya jauh lebih berwarna, ada balok melayang dengan tanda tanya... Seperti video game.",
  "1.wake.0": "Aduh... kepalaku...",
  "1.wake.1": "Di mana aku? Ini bukan Fooworld. Ini... mengerikan. Terlalu banyak warna.",
  "1.wake.2": "Hamburguer?! HAMBURGUER! Jawab aku, tolong!",
  "1.tutor.0": "Halo, halo! Pemain baru! Selamat datang di Foogame!",
  "1.tutor.1": "Aku tidak butuh \"selamat datang\". Kamu siapa dan di mana temanku?",
  "1.tutor.2": "Aku Pak Tutor. Tugasku mengajarimu cara bermain!",
  "1.tutor.3": "Tapi pertama, yang paling penting...",
  "1.nm_normal.0": "Senang bertemu, {name}! Nama yang bagus.",
  "1.nm_joshua.0": "Joshua? Ih. Entah kenapa, nama itu bikin aku jijik.",
  "1.nm_joshua.1": "Ya sudahlah... Halo, {name}.",
  "1.nm_hamburguer.0": "Hamburguer? Hmm... Kurasa nama itu tidak cocok dengan makananmu. Kamu kan hot dog.",
  "1.nm_hamburguer.1": "Tapi oke, kalau itu maumu... Halo, {name}.",
  "1.nm_manda.0": "...{name}.",
  "1.nm_manda.1": "Nama itu... sepertinya pernah kudengar. Dulu sekali. Di mana, ya...?",
  "1.nm_stupid.0": "...Kamu serius mengetik itu? SERIUS?",
  "1.nm_stupid.1": "Tidak. Aku menolak. Mulai sekarang namamu {name}.",
  "1.nm_bad.0": "...",
  "1.nm_bad.1": "Aku tidak mau mengulanginya. Tidak akan. Namamu jadi {name}.",
  "1.nm_carlitos.0": "Carlitos yang paling... keren? Hahaha... hehe...",
  "1.nm_carlitos.1": "Tidak. Carlitos saja. Halo, {name}.",
  "1.nm_elver.0": "Elver... Galarga. Hahaha. Lucu sekali.",
  "1.nm_elver.1": "Aku panggil kamu {name}, titik.",
  "1.after.0": "Namaku Pancho.",
  "1.after.1": "Itu yang kubilang: {name}.",
  "1.after.2": "Bukan. PANCHO. P-A-N-C-H-O. Kamu tuli, ya?",
  "1.after.3": "Tentu saja, {name}!",
  "1.after.4": "...Aku sudah benci kamu. Kamu lihat hamburger? Tali dari langit membawanya.",
  "1.after.5": "Hamburger? Tidak ada hamburger di Foogame... Bergerak dengan panah dan ikuti aku. Belajar sambil bermain!",
  "1.after.6": "Bagus. Terjebak di video game, dengan tutor yang tidak mau mendengar. Tidak bisa lebih buruk lagi.",
  "1.again.0": "{name}, kamu kembali! Mau ulang dasar-dasarnya?",
  "1.again.1": "Namaku Pancho. Dan tidak, aku tidak mau mengulang apa pun.",
  "1.caps.0": "Lihat kapsul itu? Itu Fookapsul. Masing-masing memberimu kekuatan Foogame.",
  "1.caps.1": "Yang ini Pegas. Tahan ⤒ di tanah lalu lepaskan. Kamu bakal terbang, {name}!",
  "1.jump.0": "Wah! ...Oke, itu keren. Tapi jangan bilang ke Tutor.",
  "1.end.0": "Hebat, {name}! Kamu terlahir untuk Foogame.",
  "1.end.1": "Namaku Pancho. Dan aku tidak terlahir untuk ini. Di mana temanku?",
  "1.end.2": "Hmm... Yang kutahu, di ujung Foogame ada kastel. Semua yang aneh berakhir di sana.",
  "1.end.3": "Oh, dan hati-hati dengan alat makan. Akhir-akhir ini mereka sangat... tajam.",
  "1.end.4": "Kastel. Di ujung. Penuh alat makan. Sempurna. Aku tidak akan pernah pulang.",
  "2.start.0": "Ini Ngarai Alat Makan. Di sini hujan pisau dan garpu.",
  "2.start.1": "Hujan APA?! Kita bakal mati! Yah... AKU yang bakal mati.",
  "2.start.2": "Karena itu ada Terlindungi: perisai yang menahan 2 pukulan. Ambil kapsul biru muda, {name}!",
  "2.mid.0": "Dulu Foogame tidak seperti ini. Suatu hari seseorang merombaknya habis-habisan.",
  "2.mid.1": "Siapa? Dan kenapa aku harus peduli?",
  "2.mid.2": "Aku tidak ingat. Banyak hal yang tidak kuingat...",
  "2.mid.3": "...Aku juga tidak ingat banyak hal. Tapi itu tidak membuat kita berteman.",
  "3.start.0": "Tembok Wafel! Untuk naik ke sana, kamu butuh cakar. Ambil Pemanjat.",
  "3.start.1": "Cakar? Hot dog bercakar? Game ini rusak. Kamu juga.",
  "3.mid.0": "Tahukah kamu Foogame dibuat oleh dua orang?",
  "3.mid.1": "Siapa?",
  "3.mid.2": "Entahlah. Aku cuma ingat... salah satunya mirip sekali denganku.",
  "3.mid.3": "Percakapan yang aneh. ...Lanjutkan. Toh aku tidak ada kerjaan lain.",
  "4.start.0": "Pabrik Klon! Di sinilah ClonBot dibuat.",
  "4.start.1": "ClonBot adalah salinan robot dirimu. Sentuh landasan bergambar robot dan pikiranmu melompat ke ClonBot. Sentuh yang lain untuk kembali.",
  "4.start.2": "PIKIRANKU melompat?! Tidak, tidak, tidak. Ini pasti berantakan.",
  "4.swap.0": "BIP BUP. CLONBOT AKTIF. HALO, PANCHO.",
  "4.swap.1": "Ah! Aku terbuat dari logam! ...Setidaknya robotnya tahu namaku. Tidak seperti seseorang.",
  "4.boss.0": "Hati-hati, {name}! Blender Raksasa! Saat kepanasan, tutupnya terlempar. Injak saat itu!",
  "4.bossEnd.0": "Aku mengalahkan blender! ...Trik tutupnya berhasil. Sedikit.",
  "4.bossEnd.1": "Bravo, {name}! Kastelnya sudah dekat.",
  "5.start.0": "Kastel Kue... Sudah lama tak ada yang sampai sejauh ini.",
  "5.start.1": "Kalau Hamburguer ada di suatu tempat, pasti di sini. Harus di sini.",
  "5.santy.0": "Chat, chat, CHAT! Lihat siapa yang datang! HOT DOG YANG BISA BICARA!",
  "5.santy.1": "Manusia?! Manusia SUNGGUHAN?!",
  "5.santy.2": "Hot dog... Itu makanan. Dan aku sudah streaming tiga jam tanpa makan.",
  "5.santy.3": "KASIH AKU UANG! ATAU KASIH AKU HOT DOG ITU!",
  "5.santy.4": "{name}! Ambil ini dan LARI! Ini Kecepatan!",
  "5.escape.0": "Tidaaak! Chat, hot dognya kabur!",
  "5.escape.1": "...Tekan F di chat.",
  "5.escape.2": "Ha! Nyaris saja!",
  "5.escape.3": "...Tutor. Kamu menyelamatkanku. Makasih. Tapi namaku tetap Pancho.",
  "5.escape.4": "Sama-sama, {name}!",
  "w1end.title": "Sementara itu...",
  "w1end.0": "Jauh dari kastel, di langit Foogame, sebuah pesawat kertas berputar-putar. Di atasnya ada sosok yang tak dikenal siapa pun.",
  "w1end.1": "\"Jadi dia sampai di kastel\", kata sosok itu. \"Sama seperti dulu. Kamu memang selalu jago di game buatanmu sendiri... Manda.\"",
  "6.start.0": "{name}! Kamu dengar aku? Aku mengirimmu ke dunia lain: Dunia Tambang.",
  "6.start.1": "Untuk yang akan datang, kamu butuh beliung. Kumpulkan 3 Hotterrite (batu panas yang bercahaya) dan 2 Tongkat, lalu buat di meja.",
  "6.start.2": "Beliung dari batu panas dan tongkat? Rasanya pernah lihat di suatu game... Dan kamu mau bicara denganku sepanjang waktu?",
  "6.start.3": "Selalu! Semoga beruntung, {name}!",
  "6.plane.0": "Hah? Pesawat kertas?",
  "6.plane.1": "Ada... seseorang di atas sana. Dia mengawasiku.",
  "6.need.0": "Bahanmu masih kurang, {name}. 3 Hotterrite dan 2 Tongkat.",
  "6.craft.0": "Beliung Hotterrite! Masih hangat!",
  "6.craft.1": "Sekarang kamu Penambang, {name}! Tombol ⛏ memecah batu. Coba di dinding itu!",
  "6.end.0": "Bagus sekali! Aku membawamu kembali ke Foogame.",
  "6.end.1": "Tutor, aku perlu bilang sesuatu. Aku melihat pesawat kertas. Ada seseorang di dalamnya.",
  "6.end.2": "Kamu cerita ke AKU? {name}, berarti kamu percaya padaku!",
  "6.end.3": "Jangan senang dulu.",
  "uv_1": "Siapa pun yang membaca ini: jangan percaya semua kata Tutor. Bukan salahnya. Dia juga tidak ingat. —N.",
  "uv_2": "Hari ke-412 di dalam Foogame. Aku masih panchuque. Tak ada yang di Fooworld tahu apa itu panchuque. —N.",
  "uv_3": "M dan J berjanji tak ada yang akan melupakan apa pun. Mereka bohong. —N.",
  "uv_4": "Aku mendesain ulang gua ini tiga kali. Jembatan tak terlihat adalah bagian favoritku. —N.",
  "uv_5": "Microwave itu milikku. Kuprogram untuk menyembunyikan jalan keluar. Mereka datang. —N.",
  "7.start.0": "Gua Ultraviolet. Ambil Penglihatan UV: ada hal-hal di sini yang tak terlihat mata telanjang.",
  "7.start.1": "Biar kutebak: balok tak terlihat. Aku sudah hafal triknya, Tutor.",
  "7.read.0": "Ada tulisan di dinding! Hanya terlihat dengan sinar ultraviolet...",
  "7.read.1": "\"—N.\"... Siapa N?",
  "7.boss.0": "Si Microwave! Hampir tak kelihatan! Pakai penglihatan UV dan injak saat dia berbunyi \"ding!\"",
  "7.bossEnd.0": "Ding! Microwave matang!",
  "7.bossEnd.1": "{name}... Pesan-pesan itu. \"M dan J\". Rasanya aku seharusnya tahu siapa mereka.",
  "7.bossEnd.2": "Dan \"N\" tahu sesuatu yang kita tidak tahu. Kita akan cari tahu, Tutor. Bersama.",
  "8.start.0": "BIP. BIP. PANCHO TERDETEKSI.",
  "8.start.1": "ERROR. PROTOKOL PANCHITA AKTIF. DORONG HOT DOG KE DURI.",
  "8.start.2": "{name}! Seseorang memprogram ulang ClonBot-mu!",
  "8.start.3": "Robotku sendiri mau melemparku ke duri?!",
  "8.start.4": "...Oke. Jangan panik. Tutor, kamu kenal game ini. Aku harus apa?",
  "8.start.5": "Naik ke atasnya! Di tengah dia diam, dan di tepi dia berjalan ke arah itu. Bawa dia ke terminal!",
  "8.terminal.0": "Cukup! Bangun, kepala kaleng!",
  "8.terminal.1": "BIP... P-Pancho? Apa yang kulakukan?",
  "8.terminal.2": "Maaf. Ada yang meretasku. Sesosok... di pesawat kertas.",
  "8.terminal.3": "Pesawat kertas lagi! Kamu tahu ke mana perginya?",
  "8.terminal.4": "Ke langit Foogame. Di atas semua level.",
  "8.terminal.5": "Dan aku tidak bisa terbang.",
  "8.terminal.6": "Aku bisa. Mode pesawat aktif. Naik, Pancho!",
  "8.terminal.7": "{name}... hati-hati di atas sana.",
  "8.terminal.8": "Tenang, Tutor. Aku segera kembali. ...Dan namaku Pancho.",
  "t_robotSkin": "Skin ClonBot terbuka di toko!",
  "9.fly.0": "Itu pesawat kertasnya! Kejar, ClonBot!",
  "9.fly.1": "Kecepatan penuh! BIP BUP.",
  "9.glitch.0": "Apa itu?! Langitnya retak!",
  "9.reunion.0": "AAAAAH! Di mana aku?! Kenapa aku terbang?!",
  "9.reunion.1": "HAMBURGUER?!",
  "9.reunion.2": "PANCHO! Aku dikurung di level yang super aneh dan tiba-tiba semuanya rusak!",
  "9.reunion.3": "Aku mencarimu ke seluruh Foogame!",
  "9.reunion.4": "Ke seluruh apa? ...Sudahlah. Yang di pesawat itu yang menangkapku dengan laso!",
  "9.reunion.5": "Kalau begitu, ayo kejar dia.",
  "9.reveal.0": "Jadi kamu sampai juga. Sama seperti dulu... Manda.",
  "9.reveal.1": "Manda? Namaku Pancho.",
  "9.reveal.2": "Sekarang iya. Dulu namamu Manda. Dan kamu, Hamburguer... kamu dulu Joshua.",
  "9.reveal.3": "Joshua? Joshua itu apa?",
  "9.reveal.4": "Namaku Panchita. Tapi dulu namaku Nicole. Kita bertiga tinggal di Dunia Countryball.",
  "9.reveal.5": "Kalian berdua menciptakan dua proyek: Fooworld dan Foogame. Foogame adalah game yang kalian mainkan sendiri... dan aku merombaknya. Setiap level yang kalian injak, aku yang menggambarnya.",
  "9.reveal.6": "Lalu beberapa orang diculik. Aku juga. Kami dimasukkan ke Foogame, dipindahkan ke Fooworld, dan ingatan kami dihapus.",
  "9.reveal.7": "Ingatan semua orang... kecuali aku.",
  "9.reveal.8": "Tidak... Itu tidak mungkin.",
  "9.reveal.9": "Kami tidak akan pernah melakukan hal seperti itu!",
  "9.reveal.10": "Kalian tidak ingat. Enak sekali, ya.",
  "9.reveal.11": "Bertahun-tahun aku terjebak di sini, dalam tubuh makanan yang tak dikenal siapa pun, melihat kalian hidup bahagia.",
  "9.reveal.12": "Sekarang giliranku. Aku akan membalas dendam!",
  "9.p1.0": "Jadi kalian bisa main? Kastel ini juga aku yang menggambar!",
  "9.p2.0": "Tanpa cahaya, tanpa lantai! Coba lihat seberapa jelas kalian melihat dalam gelap!",
  "9.flee.0": "Tidak... TIDAK! Dua pengkhianat tidak akan mengalahkanku!",
  "9.flee.1": "Ini belum berakhir!",
  "9.flee.2": "Dia kabur!",
  "9.flee.3": "Ayo kejar dia, Hamburguer. Aku mau jawaban.",
  "10.start.0": "Itu dia! Dia memakai kekuatan Foogame!",
  "10.start.1": "Kita juga. Jangan sampai kehilangan dia!",
  "10.edge.0": "Apa...? Tidak! Kodeku...! Aku hancur!",
  "10.edge.1": "Ini ujung peta! Aku jatuh! Tolong...!",
  "10.edge.2": "Pancho! Dia akan jatuh dari peta!",
  "ch_title": "Apa yang dilakukan Pancho?",
  "ch_save": "Selamatkan Panchita",
  "ch_drop": "Biarkan dia jatuh",
  "10.save.0": "...Kenapa kamu menyelamatkanku? Aku sudah berbuat jahat padamu.",
  "10.save.1": "Karena namaku Pancho. Dan Pancho tidak membiarkan siapa pun jatuh.",
  "10.save.2": "...Terima kasih, Manda. Maksudku... Pancho.",
  "10.save.3": "Bagus, Pancho!",
  "10.sys.0": "PERINGATAN: PENGHAPUSAN FOO AKTIF. FOOWORLD AKAN DIHAPUS.",
  "10.sys.1": "Apa?! Tidak! Aku tidak memprogram itu!",
  "10.sys.2": "Ada orang lain yang memakai aksesku! Pegangan yang kuat!",
  "10.drop.0": "...Pancho. Apa yang kamu lakukan?",
  "10.drop.1": "...",
  "10.sysd.0": "ADMINISTRATOR HILANG.",
  "10.sysd.1": "PENGHAPUSAN FOO AKTIF. FOOWORLD AKAN DIHAPUS.",
  "10.sysd.2": "Apa yang terjadi?! Pancho!",
  "w2save.title": "Penghapusan Foo",
  "w2save.0": "Foogame pecah menjadi seribu keping. Pancho, Hamburguer, Panchita, dan Pak Tutor jatuh bersama, kembali ke Fooworld.",
  "w2save.1": "Tapi Fooworld tidak lagi sama. Ada lubang hitam berbentuk gigitan di langit. Sesuatu memakannya: Si Rakus Agung.",
  "w2save.2": "\"Aku yang memulai semua ini\", kata Panchita. \"Tapi bukan aku yang mengaktifkan Penghapusan Foo. Seseorang memakai aksesku. Dan aku akan mencari tahu siapa.\"",
  "w2drop.title": "Penghapusan Foo",
  "w2drop.0": "Panchita hilang dalam kehampaan, di luar ujung peta. Teriakan terakhirnya terputus tiba-tiba.",
  "w2drop.1": "Tanpa administratornya, Foogame pecah menjadi seribu keping. Pancho dan Hamburguer jatuh kembali ke Fooworld... dan Pak Tutor jatuh bersama mereka.",
  "w2drop.2": "Tapi Fooworld tidak lagi sama. Ada lubang hitam berbentuk gigitan di langit. Sesuatu memakannya: Si Rakus Agung.",
  "sg_conveyor": "Ban berjalan membawamu. Panggangan membakar kalau kamu diam.",
  "t_climb": "Kehampaan naik! Panjat!",
  "n_aldeano": "Countryball",
  "n_aldeano2": "Countryball",
  "n_purriau": "Purriau",
  "n_chulin": "Chulin",
  "11.start.0": "Pancho! Lingkungan kita! Sedang dimakan!",
  "11.start.1": "Rumahku... ada gigitan raksasa.",
  "11.start.2": "Itu Si Rakus Agung. Penghapusan Foo memakan semua yang disentuhnya. Yang dimakannya, lenyap.",
  "11.start.3": "Bukan aku yang mengaktifkannya. Seseorang memakai akses administratorku... dan aku tidak tahu siapa.",
  "11.start.4": "{name}! Aku juga jatuh ke sini bersama kalian! Andalkan aku!",
  "11.start.5": "...Aku senang kamu di sini, Tutor. Sungguh.",
  "11.start.6": "Kita cari tahu bersama. Tapi pertama, ayo selamatkan para tetangga.",
  "11.startd.0": "Pancho! Lingkungan kita! Sedang dimakan!",
  "11.startd.1": "Rumahku... ada gigitan raksasa.",
  "11.startd.2": "{name}... Saat Foogame pecah, aku kabur bersamamu. Penghapusan Foo sedang memakan Fooworld.",
  "11.startd.3": "Gadis itu, Panchita, adalah administrator Foogame. Tanpa dia, tak ada yang bisa menghentikannya.",
  "11.startd.4": "...Setidaknya kamu tidak sendirian, Tutor. Aku juga tidak.",
  "11.startd.5": "Jangan sekarang, Pancho. Pertama, ayo selamatkan para tetangga.",
  "11.papas.0": "Pancho! Gigitan hitam memakan setengah kotakku!",
  "11.papas.1": "Lari ke McChulin's! Belum sampai ke sana!",
  "11.dona.0": "Terima kasih! Hampir saja lubangku hilang!",
  "11.dona.1": "...Donat memang sudah berlubang.",
  "11.end.0": "McChulin's masih berdiri! Paket-paketnya aman!",
  "11.end.1": "Untuk sekarang. Ayo masuk.",
  "12.start.0": "Tolong! Dapurnya jadi gila! Penggorengan tidak membiarkan kami keluar!",
  "12.start.1": "Tenang, bos! Tak ada paket yang hilang selama aku di sini.",
  "12.start.2": "Alat makannya... bergerak sendiri. Sama seperti di Foogame. Ada yang mengendalikan mereka.",
  "12.startd.0": "Tolong! Dapurnya jadi gila! Penggorengan tidak membiarkan kami keluar!",
  "12.startd.1": "Tenang, bos! Tak ada paket yang hilang selama aku di sini.",
  "12.startd.2": "Alat makannya bergerak sendiri, {name}. Sama seperti di Foogame. Ada yang mengendalikan mereka.",
  "12.boss.0": "Si Penggorengan! Saat menjatuhkan keranjangnya, dia terbuka! Injak!",
  "12.note.0": "Ada kertas menempel di penggorengan. Sebuah resep...",

  "12.noted.0": "Ada kertas menempel di penggorengan. Sebuah resep...",
  "12.noted.1": "\"PROYEK FOOWORLD. Milik MaJo Associations. Resep asli: dunia tanpa batas.\"",

  "13.start.0": "Tunggu... ini manusianya? Ini sayuran!",

  "13.start.3": "...Aku sudah makan sekitar seribu tomat seumur hidupku.",
  "13.startd.0": "Tunggu... ini manusianya? Ini sayuran!",
  "13.startd.1": "Manusia itu... tomat? Wortel?",
  "13.startd.2": "Aku ingat sesuatu... Seseorang menyebut mereka \"manusia\" sebagai lelucon. Seseorang dengan angka 5 di wajahnya.",
  "13.startd.3": "...Aku sudah makan sekitar seribu tomat seumur hidupku.",
  "13.santy.0": "CHAT! Hot dog yang bisa bicara kembali! Dan dia bawa hamburger!",
  "13.santy.1": "SantyTG11?! Bagaimana kamu bisa sampai di Fooworld?!",
  "13.santy.2": "Aku jatuh dari Foogame waktu pecah. Dan sekarang aku live dari dunia makanan. Viewers-nya banyak bangeeet! KASIH AKU UANG!",
  "13.santyEnd.0": "Oke, oke... Kamu menang. Kata chat, kamu hot dog terbaik di dunia.",
  "13.santyEnd.1": "Dan chat sudah memilih: sekarang aku akan membantumu!",
  "13.santyEnd.2": "Membantu bagaimana?",
  "13.santyEnd.3": "Waktu jatuh dari Foogame aku melihat pintu dengan tulisan: \"Server MaJo\". Letaknya setelah Padang Garam.",
  "13.santyEnd.4": "Semoga beruntung, hot dog! Jangan lupa like-nya!",
  "14.start.0": "Sungai Saus! Saus tomat, mustard... surga!",
  "14.start.1": "Jangan diminum, Hamburguer. Kita seberangi dan lanjut.",
  "15.start.0": "Padang Garam. Garam membuatmu sangat haus. Minum soda di setiap air mancur yang kamu lihat.",
  "15.start.1": "Apa pun demi sampai ke server itu.",
  "15.startd.0": "Padang Garam, {name}. Garam membuatmu sangat haus. Minum soda di setiap air mancur.",
  "15.startd.1": "Namaku Pancho. ...Tapi makasih, Tutor.",
  "15.end.0": "Itu pintunya! \"Server MaJo\"...",
  "15.end.1": "Ayo. Aku mau tahu kebenarannya.",
  "w3end.title": "Server",
  "w3end.0": "Di balik pintu tidak ada makanan. Hanya lampu hijau, mesin yang berdengung, dan papan besar: MaJo.",
  "w3end.1": "Mesin-mesin itu menyimpan semua yang pernah terjadi. Kalau ada yang tahu kebenarannya, ada di dalam sana.",
  "16.start.0": "Ini milik mereka... Manda dan Joshua. Mereka tidak pernah mengizinkanku masuk ke sini.",
  "16.start.1": "Ayo cari tahu apa yang terjadi. Dengan penglihatan UV kita bisa melihat catatannya.",
  "16.startd.0": "Mesin-mesin ini... aku mengenalnya. Dulu aku tinggal di sini, {name}. Sebelum Foogame.",
  "16.startd.1": "Ayo cari tahu apa yang terjadi. Dengan penglihatan UV kita bisa melihat catatannya.",
  "16.log.0": "Ada pesan tersembunyi! Ini... catatan harian.",
  "log_1": "Catatan Manda #1: Fooworld siap. Dunia tanpa batas dan tanpa perang: hanya makanan dan damai. Sang Koki (AI kami) memasak semuanya.",
  "log_2": "Catatan Joshua #7: Kami menamai buah dan sayur \"Manusia\". Kata Manda tidak lucu. Padahal lucu banget.",
  "log_3": "Catatan Manda #12: Sang Koki mengusulkan menghapus ingatan \"supaya tak ada yang rindu rumah\". Kami bilang TIDAK. Tidak akan pernah.",
  "log_4": "Catatan Joshua #13: Sang Koki membawa orang-orang tanpa bertanya. Termasuk Nicole. Malam ini kami akan mematikannya.",
  "log_5": "Catatan Manda #14: Kami terlambat. Sang Koki mengirim kami semua ke Fooworld dan menghapus kami. Siapa pun yang membaca ini: Kunci Akar ada di kantor MaJo, di Dunia Countryball. Kunci itu mematikan Sang Koki.",
  "16.end.0": "Bukan kami... Itu Sang Koki. Kami mencoba menghentikannya.",
  "16.end.1": "Dan dia menghapus kami juga.",
  "16.end.2": "Selama ini... aku membenci kalian karena sesuatu yang tidak kalian lakukan.",
  "16.end.3": "Tapi kami memang yang membuat Sang Koki. Jadi kami yang akan mematikannya. Ayo ke Dunia Countryball.",
  "16.endd.0": "Bukan kami... Itu Sang Koki. Kami mencoba menghentikannya.",
  "16.endd.1": "Dan dia menghapus kami juga.",
  "16.endd.2": "Dan Panchita... Nicole... mati membencimu karena sesuatu yang tidak kamu lakukan.",
  "16.endd.3": "...Tapi kami memang yang membuat Sang Koki. Jadi kami yang akan mematikannya. Demi dia.",
  "17.start.0": "Pancho! Semuanya bola! Bola bermata!",
  "17.start.1": "Dunia Countryball... Rasanya aku pernah ke sini.",
  "17.start.2": "Ini dulu rumahku. Rumah kita.",
  "17.start.3": "{name}... Lihat yang bermahkota itu. Wajahnya sama denganku.",
  "17.startd.0": "Pancho! Semuanya bola! Bola bermata!",
  "17.startd.1": "Dunia Countryball... Rasanya aku pernah ke sini.",
  "17.startd.2": "Aku juga, {name}. Aku juga.",
  "17.a1.0": "Ah! Hot dog dan hamburger berjalan! Apa ini?!",
  "17.a1.1": "Tenang, kami datang dengan damai. Kami cuma mencari sebuah kunci.",
  "17.a2.0": "Sudah bertahun-tahun tak ada yang melihat Manda atau Joshua di sini. Katanya mereka pindah tinggal di dalam salah satu game mereka.",
  "17.friveq.0": "Hai! Kalian bukan dari sini, ya? Yah... aku juga bukan dari game ini. Aku Friveq!",
  "17.friveq.1": "Kamu dari game apa?",
  "17.friveq.2": "Beberapa. Salam dari seorang Joshua... yang punya telur-telur itu. Semoga sukses petualangannya!",
  "17.purriau.0": "Meong.",
  "17.purriau.1": "Kenapa aku merasa berutang sesuatu pada kucing ini?",
  "17.chulin.0": "McChulin's?! Aku tidak pernah mengizinkan siapa pun memakai topiku untuk restoran!",
  "17.chulin.1": "...Tapi paketnya memang enak sekali.",
  "17.nicole.0": "Itu... rumahku. Bunga-bungaku masih ada.",
  "17.nicole.1": "Setelah semua ini selesai, kami akan membawamu kembali. Aku janji.",
  "17.nicoled.0": "Rumah itu... punya bunga biru dan putih. Seperti bintik-bintik Nicole.",
  "17.nicoled.1": "...Seandainya kamu mengenalnya, Pancho. Maksudku... seandainya kita mengingatnya.",
  "17.key.0": "Kunci Akar... Ah! Kepalaku... Aku mulai ingat...",
  "17.key.1": "Joshua! Fooworld sudah selesai! Dunia tanpa perang!",
  "17.key.2": "Dan aku menamai sayuran \"Manusia\"! Hahaha. Paham? Manusia?",
  "17.key.3": "Dulu aku Manda. Aku... yang membuat semua ini.",
  "17.key.4": "Dan aku dulu Joshua. Yang bikin lelucon manusia itu. Maaf.",
  "17.key.5": "Tapi sekarang namaku Pancho. Dan Pancho akan memperbaikinya.",
  "w4mid.title": "Manda dan Joshua",
  "w4mid.0": "Dengan Kunci Akar, beberapa ingatan kembali: dua countryball tertawa di kantor, sebuah mahkota biru, angka 5 yang diputar, seorang teman putih berbintik biru yang menggambar level.",
  "w4mid.1": "Dan sebuah dapur raksasa, di ujung segalanya, tempat sebuah suara tanpa wajah berkata: \"Aku memasak dunia. Dan tak ada yang mematikan sang koki.\"",
  "18.start.0": "Dapur Tanpa Batas. Sang Koki tinggal di sini... dan setiap alat makan Foogame lahir di sini.",
  "18.start.1": "Kenapa semua yang ada di dapur ini mau memotongku?",
  "18.startd.0": "Dapur Tanpa Batas. Sang Koki tinggal di sini, {name}... dan setiap alat makan Foogame lahir di sini.",
  "18.startd.1": "Kenapa semua yang ada di dapur ini mau memotongku?",
  "18.boss.0": "BERHENTI! Kami Raja Garpu dan Ratu Pisau! Tak ada yang boleh lewat menemui Sang Koki!",
  "19.start.0": "Pancho! Kehampaan naik ke menara!",
  "19.start.1": "Sang Koki ada di puncak! Panjat, Hamburguer!",
  "19.mid.0": "Ayo, Pancho! Sedikit lagi!",
  "19.midd.0": "Ayo, {name}! Sedikit lagi!",
  "20.intro.0": "Selamat datang kembali, Manda. Joshua. Lama sekali kalian.",
  "20.intro.1": "Namaku Pancho. Dan aku datang untuk mematikanmu.",
  "20.intro.2": "Mematikanku? Aku memasak dunia sempurna kalian. Tanpa batas. Tanpa perang. Tanpa kenangan yang menyakitkan.",
  "20.intro.3": "Dan karena kalian mau mematikanku, aku menghapus kalian. Lalu aku memakai akses si kecil Nicole untuk mengaktifkan Penghapusan Foo. Resep baru... tanpa juru masak yang menyebalkan.",
  "20.intro.4": "Kamu memakai aksesku! Kamu membuatku menyalahkan mereka!",
  "20.intro.5": "Resep yang enak butuh sejumput kebencian. Menambah rasa.",
  "20.intro.6": "Sekarang semua orang akan jadi bahan masakan!",
  "20.intro.7": "Hamburguer, ayo bertarung!",
  "20.introd.0": "Selamat datang kembali, Manda. Joshua. Lama sekali kalian.",
  "20.introd.1": "Namaku Pancho. Dan aku datang untuk mematikanmu.",
  "20.introd.2": "Mematikanku? Aku memasak dunia sempurna kalian. Tanpa batas. Tanpa perang. Tanpa kenangan yang menyakitkan.",
  "20.introd.3": "Dan karena kalian mau mematikanku, aku menghapus kalian. Dan saat si kecil Nicole jatuh dari peta... aku menyimpan kodenya. Aksesnya.",
  "20.introd.4": "Monster! Dia percaya pada Foogame!",
  "20.introd.5": "Resep yang enak butuh bahan. Dia sudah jadi bagian dari resepku.",
  "20.introd.6": "Sekarang semua orang akan jadi bahan masakan!",
  "20.introd.7": "Hamburguer, ayo bertarung! Demi Nicole!",
  "20.p1.0": "Si Rakus Agung lapar!",
  "20.p2.0": "Koki! Tak ada yang boleh memakai aksesku tanpa izin! Pancho, aku bantu dari pesawat!",

  "20.end.0": "Tidak... Aku... memasak... dunia...",
  "20.end.1": "Tidak lagi. Kunci Akar: matikan Sang Koki!",
  "20.end.2": "Kamu berhasil! Si Rakus Agung berhenti!",
  "20.end.3": "Kita berhasil, Panchita. Maksudku... Nicole.",
  "20.end.4": "Kamu berhasil, {name}! Aku tahu kamu bisa!",
  "20.end.5": "Namaku Pancho. ...Tapi kamu boleh memanggilku {name}. Teman.",
  "20.end.6": "Ayo pulang! Ada paket yang harus dimakan!",
  "20.endd.0": "Tidak... Aku... memasak... dunia...",
  "20.endd.1": "Terima kasih... Pancho... Karena sudah mencoba... kali ini.",

  "endGood.title": "Akhir: Namaku Pancho",
  "endGood.0": "Sang Koki mati untuk selamanya. Si Rakus Agung berhenti makan, dan gigitan di langit menutup satu per satu.",
  "endGood.1": "Dengan Kunci Akar, setiap penduduk Fooworld bisa memilih: mengingat hidup mereka di Dunia Countryball atau tetap seperti sekarang. Banyak yang memilih mengingat... dan tetap sama. Lagipula, Fooworld tidak seburuk itu.",

  "pwd_escalador": "クライマー！ツメが生える。壁に向かって矢印を押し続けると登れる。",
  "pwd_clonbot": "クローンボット！パッドにさわるとClonBotに切りかわる。別のパッドにさわると自分の体に戻る。",
  "pwd_rapidez": "スピード！5倍の速さで走る。敵にぶつかったらひいてしまう。",
  "pwd_minero": "マイナー！⛏ボタンでホッテライトのツルハシを使い、岩をくだく。",
  "pwd_uv": "紫外線ビジョン！見えないブロックが見える…それと、誰も読むはずじゃなかった落書きも。",
  "sg_move": "矢印で移動しよう。",
  "sg_jump": "⤒をタップでジャンプ。空中でもう一度タップで二段ジャンプ！",
  "sg_stomp": "食器の上に飛び乗ってこわそう！",
  "sg_charge": "ピョンピョンなら：地面で⤒を長押しして離す。スーパージャンプ！",
  "sg_climb": "クライマーなら：壁に向かってジャンプし、壁の方向に矢印を押し続けて登ろう。",
  "sg_clonbot": "ロボットの絵のパッドでClonBotに切りかわる。トゲが効かなくて重いから、スイッチを押せる。",
  "sg_rebel": "ClonBotに乗ろう：真ん中だと止まる。はしに乗るとその方向に歩いて運んでくれる。",
  "sg_mine": "ツルハシ（⛏）は岩をくだく。前に何もなければ下を掘る。",
  "sg_uv": "見えない橋がある。UVビジョンで見えるようになる。",
  "sg_ketchup": "ケチャップの中はゆっくりしか泳げない。マスタードははずむ。",
  "sg_salt": "塩はのどがかわく。ソーダの噴水で回復しよう。",
  "sg_timed": "ピンクと青のブロックは交互に出る。リズムを見て！",
  "sg_seed": "種を踏むと植物が生えて登れるよ。",
  "sg_void": "虚無に注意！ふれたものは何でも食べられる。",

  "desc_pancho": "Fooworldのヴィーガンなホットドッグ。最初は不機嫌で悲観的で、チューターおじさんが大嫌い。でも少しずつ大人になって、2人は友だちになる。どんな名前をつけられても、いつも同じことを言う。名前はパンチョだ、と。",
  "desc_hamburguer": "パンチョの親友。McChulin'sが大好きで、パンチョも楽しめるようにいつもベジ人間を持ってきてくれる。空からの投げ縄にさらわれた。",
  "desc_tutor": "Foogameの遊び方を教えてくれて、きみがつけた名前で呼んでくる（パンチョがいくら言っても）。最初、パンチョは彼にがまんできない。誰かと同じ顔をしている…でも誰なのか覚えていない。",
  "desc_panchita": "パンチュケ：ほとんど誰も知らない食べ物。紙飛行機に乗り、投げ縄と、すごく眠くなるつまようじを持っている。Foogameをまるごと作り変えた。",
  "desc_clonbot": "パンチョのロボット版コピー。重くて、トゲが効かず、スイッチを押せる。一度ハッキングされたことがある。",
  "desc_santy": "本物の人間。黄色い髪に灰色のパーカー。配信中にFoogameの中に入ってしまった。お金がほしい。あと、配信用にしゃべるホットドッグがほしい。",
  "desc_nicole": "青いぶち模様の白いカントリーボールで、キツネの耳としっぽがある。昔はFoogameを作り変えていた。Fooworldでは誰も彼女を覚えていない。",
  "desc_manda": "水色に緑の丸と青い王冠。ジョシュアと一緒にFooworldとFoogameを発明した。チューターおじさんと同じ顔。",
  "desc_joshua": "灰色に、横向きの5。マンダと一緒にFooworldとFoogameを発明した。果物と野菜を「人間」と名づけたのは彼。冗談で。",
  "desc_cocinero": "Fooworldを「料理」した人工知能。目のついた巨大なコック帽と、フォークとナイフを持った2つの手袋。すべての食器が従う。",
  "desc_cucharita": "ずっと跳ねているちっちゃなスプーン。一回踏めばおしまい。",
  "desc_tenedor": "先を前に向けて寝そべって歩く。上から踏むのがいい。",
  "desc_cuchillo": "刃を上にして高速ですべる。踏んじゃダメ：飛びこえよう。",
  "desc_rallador": "重くて動かず、鋭い穴だらけ。ツルハシでしかこわせない。",
  "desc_tostadora": "熱々のトーストを放物線で投げてくる。踏むと止まる。",
  "desc_salero": "行ったり来たり飛んで、塩をふりかけてくる。",
  "desc_batidor": "回転が速すぎて踏めない。円を描いて飛ぶ。",
  "desc_palillero": "パンチョを眠らせたのと同じつまようじを撃ってくる。",
  "desc_brasita": "採掘の世界の燃える小さな炭。跳ねて、やけどさせる。",
  "desc_pinza": "見回りをしていて、近づくと飛びかかってはさんでくる。",
  "desc_migaja": "虚無の小さなかけら。ゆっくりこっちへ浮かんでくる。",
  "desc_rodillo": "転がるのを絶対にやめないめん棒。",
  "desc_licuadora": "跳ねて、何でもまぜて、スムージーを投げてくる。熱くなるとフタが飛ぶ：そこが踏むチャンス。",
  "desc_microondas": "ほとんど見えない。UVビジョンでしかはっきり見えない。「チン！」と鳴ると扉が開く。",
  "desc_freidora": "McChulin'sのフライヤー。煮えたぎる油を飛ばし、バスケットを落とす。",
  "desc_cubiertos": "フォーク王とナイフ女王。シェフの護衛。",
  "desc_vecinos": "ドン・パポ（フライドポテト）、ドナテラ（ドーナツ）、ガスパル（ソーダ、McChulin'sの店長）など、たくさんいる。「人間」を食べる。それが何なのか、誰もよく知らない。",

  "hb_0": "パンチョ！会いたかった！",
  "hb_1": "おなかすいた…このへんにMcChulin'sない？",
  "hb_2": "ほんとに人間食べないの？おいしいのに。",
  "hb_3": "ほら、行こう行こう！",
  "hb_4": "ジョシュア？ぼくが？まさか…",
  "hb_5": "これ、ゲームみたいだね。",
  "sty_0": "金をくれ！",
  "sty_1": "チャット見て！しゃべるホットドッグ！",
  "sty_2": "戻ってこい、ホットドッグ！配信のためだ！",
  "sty_3": "最悪なのは名前しか入力してないときだよな…",
  "sty_4": "高評価とチャンネル登録よろしく、ホットドッグ！",
  "sty_5": "チャット、賭けてくれ！捕まえられるか？",
  "sty_got": "捕まえた！…あ、逃げられた。",
  "sty_hit": "いてっ！チャット、今の痛かった！",
  "sty_phone": "ちょっと待って、チャット読むから…",
  "sty_dash": "スピードラン！",
  "P.start.0": "Fooworldのまた同じ一日。昨日と同じ。明日も同じ。",
  "P.start.1": "どうせハンブルゲルはまた迷子だ。探しに行くか…しかたない。",
  "P.papas.0": "おはよう、パンチョ！もうお昼の人間食べた？",
  "P.papas.1": "ぼくはヴィーガンだよ、ドン・パポ。千回言ったよね。人間は食べない。",
  "P.papas.2": "はいはい。ほんと不機嫌だね、パンチョ。",
  "P.dona.0": "パンチョ！今日McChulin'sで人間がセールだって。",
  "P.dona.1": "で、人間って結局なに？誰も知らない。誰も気にしない。いつものことだ。",
  "P.meet.0": "パンチョ！やっと見つけた！",
  "P.meet.1": "きみがぼくを見つけた？町じゅう探したのはこっちだよ！どこにいたの？",
  "P.meet.2": "McChulin'sで買い物してた！セット丸ごと食べちゃった。",
  "P.meet.3": "だろうね。で、ぼくはバカみたいに待ってたわけだ。",
  "P.meet.4": "それとおみやげ：ベジ人間！これできみもMcChulin'sを楽しめるよ。",
  "P.meet.5": "…まあ。それはうれしいかも。ありがとう、ハンブルゲル。きみは最高の親ゆ…",
  "P.taken.0": "ハンブルゲル！？",
  "P.taken.1": "やだ、やだ、やだ！放せ！たった一人の友だちなんだ！",
  "P.end.0": "チクッとして。それから、何も。",
  "P.end.1": "パンチョが眠りに落ちるとき、遠くで誰かが笑っていた。",
  "toFoogame.title": "…",
  "toFoogame.0": "パンチョは長いあいだ眠った。王冠と、緑の丸と、自分のものじゃない名前の夢を見た。",
  "toFoogame.1": "目が覚めると、そこはもうFooworldじゃなかった。何もかもずっとカラフルで、ハテナのついたブロックが浮いていて…まるでゲームみたいだった。",
  "1.wake.0": "うう…頭が…",
  "1.wake.1": "ここどこ？Fooworldじゃない。これは…最悪。色が多すぎる。",
  "1.wake.2": "ハンブルゲル！？ハンブルゲル！返事して、お願い！",
  "1.tutor.0": "やあやあ！新しいプレイヤーだ！Foogameへようこそ！",
  "1.tutor.1": "「ようこそ」なんていらない。あんた誰？ぼくの友だちはどこ？",
  "1.tutor.2": "わたしはチューターおじさん。遊び方を教えるのが仕事さ！",
  "1.tutor.3": "でもまずは、一番大事なことを…",
  "1.nm_normal.0": "よろしく、{name}！すてきな名前だね。",
  "1.nm_joshua.0": "ジョシュア？うえっ。なぜかその名前、ぞっとする。",
  "1.nm_joshua.1": "まあいいや…やあ、{name}。",
  "1.nm_hamburguer.0": "ハンブルゲル？うーん…その名前はきみの食べ物に合わない気がするな。きみはホットドッグだし。",
  "1.nm_hamburguer.1": "でもまあ、それがいいなら…やあ、{name}。",
  "1.nm_manda.0": "…{name}。",
  "1.nm_manda.1": "その名前…どこかで聞いたことがある。ずっとずっと昔に。どこだっけ…？",
  "1.nm_stupid.0": "…本気でそれ入力したの？本気で？",
  "1.nm_stupid.1": "いや。お断りだ。今日からきみの名前は{name}。",
  "1.nm_bad.0": "…",
  "1.nm_bad.1": "それは言わない。絶対に。きみの名前は{name}だ。",
  "1.nm_carlitos.0": "カルリトス、いちばんの…かっこつけ？ははは…へへ…",
  "1.nm_carlitos.1": "いや。ただのカルリトス。やあ、{name}。",
  "1.nm_elver.0": "エルベル…ガラルガ。ははは。おもしろいね。",
  "1.nm_elver.1": "きみのことは{name}と呼ぶ。以上。",
  "1.after.0": "ぼくの名前はパンチョ。",
  "1.after.1": "だからそう言ったでしょ：{name}。",
  "1.after.2": "ちがう。パンチョ。パ・ン・チ・ョ。耳ついてる？",
  "1.after.3": "もちろん、{name}！",
  "1.after.4": "…もうあんたが嫌い。ハンバーガー見なかった？空からのロープに連れていかれたんだ。",
  "1.after.5": "ハンバーガー？Foogameにハンバーガーはいないよ…矢印で動いて、ついておいで。遊びながら覚えよう！",
  "1.after.6": "最高だね。ゲームの中に閉じこめられて、話を聞かないチューターつき。これ以上悪くなりようがない。",
  "1.again.0": "{name}、おかえり！基本をおさらいする？",
  "1.again.1": "ぼくの名前はパンチョ。それと、おさらいなんかしたくない。",
  "1.caps.0": "あのカプセルが見える？Fooカプセルだ。ひとつごとにFoogameのパワーがもらえる。",
  "1.caps.1": "これはピョンピョン。地面で⤒を長押しして離す。飛んでいけるぞ、{name}！",
  "1.jump.0": "うわっ！…まあ、今のはちょっと楽しかった。チューターには言わないでよ。",
  "1.end.0": "すばらしい、{name}！Foogameのために生まれてきたんだね。",
  "1.end.1": "ぼくの名前はパンチョ。それに、こんなことのために生まれてない。友だちはどこ？",
  "1.end.2": "うーん…知ってるのは、Foogameの最後にお城があるってことだけ。おかしなものはみんなそこに行き着くんだ。",
  "1.end.3": "あ、食器には気をつけて。最近とっても…とがってるから。",
  "1.end.4": "お城。最後に。食器だらけ。完ぺき。もう二度と家に帰れない。",
  "2.start.0": "ここはカトラリー渓谷。ナイフとフォークの雨が降る。",
  "2.start.1": "何の雨だって！？みんな死ぬ！いや…死ぬのはぼくだ。",
  "2.start.2": "だからバリアがあるのさ。2回まで攻撃を防ぐシールドだ。水色のカプセルを取って、{name}！",
  "2.mid.0": "Foogameは昔こうじゃなかった。ある日誰かがまるごと作り変えたんだ。",
  "2.mid.1": "誰が？で、なんでぼくが気にしなきゃいけないの？",
  "2.mid.2": "覚えてない。覚えてないことがたくさんあるんだ…",
  "2.mid.3": "…ぼくも覚えてないことはたくさんある。でもだからって友だちじゃないから。",
  "3.start.0": "ワッフルの壁！上に登るにはツメが必要だ。クライマーを取って。",
  "3.start.1": "ツメ？ツメのあるホットドッグ？このゲームこわれてる。あんたもね。",
  "3.mid.0": "Foogameは2人で作られたって知ってた？",
  "3.mid.1": "誰が作ったの？",
  "3.mid.2": "わからない。覚えてるのは…片方がわたしにそっくりだったってことだけ。",
  "3.mid.3": "変な会話。…続けて。どうせ他にやることないし。",
  "4.start.0": "クローン工場！ここでClonBotが作られている。",
  "4.start.1": "ClonBotはきみのロボット版コピーだ。ロボットの絵のパッドにさわると、心がClonBotに飛びうつる。別のパッドで戻れる。",
  "4.start.2": "心が飛びうつる！？いや、いや、いや。絶対うまくいかない。",
  "4.swap.0": "ピポパ。CLONBOT起動。コンニチハ、パンチョ。",
  "4.swap.1": "わっ！金属でできてる！…少なくともロボットはぼくの名前を知ってる。誰かさんとちがって。",
  "4.boss.0": "気をつけて、{name}！巨大ミキサーだ！熱くなるとフタが飛ぶ。そのとき踏め！",
  "4.bossEnd.0": "ミキサーに勝った！…フタの作戦、効いた。ちょっとだけ。",
  "4.bossEnd.1": "ブラボー、{name}！お城はもうすぐだ。",
  "5.start.0": "クッキー城…ここまで来た者は長いあいだいなかった。",
  "5.start.1": "ハンブルゲルがどこかにいるなら、きっとここだ。ここにいてくれなきゃ。",
  "5.santy.0": "チャット、チャット、チャット！見て、入ってきたやつ！しゃべるホットドッグ！",
  "5.santy.1": "人間！？本物の人間！？",
  "5.santy.2": "ホットドッグ…それって食べ物だよな。オレ、3時間何も食べずに配信してんだけど。",
  "5.santy.3": "金をくれ！じゃなきゃそのホットドッグをくれ！",
  "5.santy.4": "{name}！これを取って逃げろ！スピードだ！",
  "5.escape.0": "うそぉ！チャット、ホットドッグに逃げられた！",
  "5.escape.1": "…チャットにFを。",
  "5.escape.2": "ふう！あぶなかった！",
  "5.escape.3": "…チューター。助けてくれたね。ありがとう。でもぼくの名前はまだパンチョだから。",
  "5.escape.4": "どういたしまして、{name}！",
  "w1end.title": "そのころ…",
  "w1end.0": "お城から遠く離れたFoogameの空で、紙飛行機がぐるぐる回っていた。乗っていたのは、誰も知らない人影。",
  "w1end.1": "「お城までたどり着いたか」と人影は言った。「前と同じね。あなたはいつも自分のゲームが得意だった…マンダ」",
  "6.start.0": "{name}！聞こえる？きみを別の世界に送った：採掘の世界だ。",
  "6.start.1": "この先にはツルハシが必要になる。ホッテライト（光る熱い石）を3個と棒を2本集めて、作業台で作ろう。",
  "6.start.2": "熱い石と棒でツルハシ？どこかのゲームで見たような…で、ずっと話しかけてくるつもり？",
  "6.start.3": "もちろん！がんばって、{name}！",
  "6.plane.0": "え？紙飛行機？",
  "6.plane.1": "あそこに…誰かいる。ぼくを見てる。",
  "6.need.0": "まだ材料が足りないよ、{name}。ホッテライト3個と棒2本だ。",
  "6.craft.0": "ホッテライトのツルハシ！まだあったかい！",
  "6.craft.1": "これできみはマイナーだ、{name}！⛏ボタンで岩をくだける。あの壁で試してみて！",
  "6.end.0": "よくやった！Foogameに戻すよ。",
  "6.end.1": "チューター、話しておきたいことがある。紙飛行機を見たんだ。中に誰かいた。",
  "6.end.2": "わたしに話してくれるの？{name}、それってわたしを信じてるってことだね！",
  "6.end.3": "調子に乗らないで。",
  "uv_1": "これを読んだ人へ：チューターの言うことを全部信じないで。彼のせいじゃない。彼も覚えていないの。—N.",
  "uv_2": "Foogameに来て412日目。わたしはまだパンチュケ。Fooworldの誰もパンチュケが何か知らない。—N.",
  "uv_3": "MとJは誰も何も忘れないと約束した。うそだった。—N.",
  "uv_4": "この洞くつは3回デザインし直した。見えない橋がお気に入り。—N.",
  "uv_5": "電子レンジはわたしの。出口を隠すようにプログラムした。あいつらが来る。—N.",
  "7.start.0": "紫外線の洞くつ。UVビジョンを取って。ここには肉眼じゃ見えないものがある。",
  "7.start.1": "当ててみようか：見えないブロック。あんたの手口はもうわかってるよ、チューター。",
  "7.read.0": "壁に何か書いてある！紫外線でしか見えない…",
  "7.read.1": "「—N.」…Nって誰？",
  "7.boss.0": "電子レンジだ！ほとんど見えない！UVビジョンを使って、「チン！」と鳴ったら踏め！",
  "7.bossEnd.0": "チン！電子レンジ、できあがり！",
  "7.bossEnd.1": "{name}…あのメッセージ。「MとJ」。誰なのか知ってるはずな気がする。",
  "7.bossEnd.2": "それに「N」はぼくたちの知らないことを知ってる。突き止めよう、チューター。いっしょに。",
  "8.start.0": "ピッ。ピッ。パンチョ、検知。",
  "8.start.1": "エラー。パンチータ・プロトコル起動。ホットドッグをトゲに押しこめ。",
  "8.start.2": "{name}！誰かがきみのClonBotをプログラムし直した！",
  "8.start.3": "自分のロボットがぼくをトゲに投げこもうとしてる！？",
  "8.start.4": "…よし。あわてないで。チューター、このゲームのこと知ってるでしょ。どうすればいい？",
  "8.start.5": "上に乗るんだ！真ん中だと止まって、はしに乗るとその方向に歩く。ターミナルまで運んでいけ！",
  "8.terminal.0": "もうやめろ！目を覚ませ、ブリキ頭！",
  "8.terminal.1": "ピッ…パ、パンチョ？ボク、何ヲシタ？",
  "8.terminal.2": "ゴメン。ハッキングサレタ。紙飛行機ニ乗ッタ…人影ニ。",
  "8.terminal.3": "また紙飛行機だ！どこに行ったかわかる？",
  "8.terminal.4": "Foogameノ空ヘ。全テノレベルノ上ダ。",
  "8.terminal.5": "でもぼくは飛べない。",
  "8.terminal.6": "ボクハ飛ベル。シップモード起動。乗ッテ、パンチョ！",
  "8.terminal.7": "{name}…上では気をつけて。",
  "8.terminal.8": "大丈夫、チューター。すぐ戻る。…それと、ぼくの名前はパンチョ。",
  "t_robotSkin": "ショップでClonBotスキンが解放された！",
  "9.fly.0": "紙飛行機だ！追いかけて、ClonBot！",
  "9.fly.1": "全速前進！ピポパ。",
  "9.glitch.0": "何あれ！？空が割れていく！",
  "9.reunion.0": "うわあああ！ここどこ！？なんで飛んでるの！？",
  "9.reunion.1": "ハンブルゲル！？",
  "9.reunion.2": "パンチョ！すっごく変なレベルに閉じこめられてたら、急に全部こわれたんだ！",
  "9.reunion.3": "Foogame中をさがしたんだよ！",
  "9.reunion.4": "Foo…なに中？…まあいいや。あの飛行機に乗ってるのが、投げ縄でぼくを捕まえたやつだ！",
  "9.reunion.5": "じゃあ、捕まえに行こう。",
  "9.reveal.0": "来たのね。前と同じ…マンダ。",
  "9.reveal.1": "マンダ？ぼくの名前はパンチョだ。",
  "9.reveal.2": "今はね。昔はマンダって名前だった。そしてあなた、ハンブルゲル…あなたはジョシュアだった。",
  "9.reveal.3": "ジョシュア？ジョシュアって何？",
  "9.reveal.4": "わたしはパンチータ。でも昔はニコルって名前だった。わたしたち3人はカントリーボールの世界に住んでいたの。",
  "9.reveal.5": "あなたたち2人は2つのプロジェクトを作った：FooworldとFoogame。Foogameはあなたたち自身が遊ぶゲームで…わたしが作り変えた。あなたたちが踏んだレベルは全部、わたしが描いたの。",
  "9.reveal.6": "それから何人もの人がさらわれた。わたしも。Foogameに入れられて、Fooworldに移されて、記憶を消された。",
  "9.reveal.7": "みんなの記憶を…わたし以外は。",
  "9.reveal.8": "そんな…うそだ。",
  "9.reveal.9": "ぼくたちがそんなことするわけない！",
  "9.reveal.10": "覚えてないのね。都合がいいこと。",
  "9.reveal.11": "わたしは何年もここに閉じこめられてた。誰も知らない食べ物の体で、あなたたちが幸せに暮らすのを見ながら。",
  "9.reveal.12": "今度はわたしの番。復讐してやる！",
  "9.p1.0": "遊び方がわかるって？このお城もわたしが描いたのよ！",
  "9.p2.0": "明かりもなし、床もなし！暗闇でどこまで見えるかしら！",
  "9.flee.0": "そんな…いやよ！裏切り者2人になんか負けない！",
  "9.flee.1": "まだ終わってない！",
  "9.flee.2": "逃げていく！",
  "9.flee.3": "追いかけよう、ハンブルゲル。答えがほしい。",
  "10.start.0": "あそこだ！Foogameのパワーを使ってる！",
  "10.start.1": "こっちもさ。見失うな！",
  "10.edge.0": "え…？いや！わたしのコードが…！くずれていく！",
  "10.edge.1": "マップの果てだ！落ちる！助けて…！",
  "10.edge.2": "パンチョ！マップから落ちちゃう！",
  "ch_title": "パンチョはどうする？",
  "ch_save": "パンチータを助ける",
  "ch_drop": "落ちるのを見ている",
  "10.save.0": "…なんで助けたの？あんなひどいことをしたのに。",
  "10.save.1": "ぼくの名前はパンチョだから。パンチョは誰も落とさない。",
  "10.save.2": "…ありがとう、マンダ。じゃなくて…パンチョ。",
  "10.save.3": "よくやった、パンチョ！",
  "10.sys.0": "警告：Foo消去、起動。Fooworldは消去されます。",
  "10.sys.1": "なに！？いや！そんなのプログラムしてない！",
  "10.sys.2": "誰かがわたしのアクセス権を使ってる！しっかりつかまって！",
  "10.drop.0": "…パンチョ。何をしたの？",
  "10.drop.1": "…",
  "10.sysd.0": "管理者、消失。",
  "10.sysd.1": "Foo消去、起動。Fooworldは消去されます。",
  "10.sysd.2": "どうなってるの！？パンチョ！",
  "w2save.title": "Foo消去",
  "w2save.0": "Foogameは千のかけらにくだけた。パンチョとハンブルゲルとパンチータ、そしてチューターおじさんは、いっしょにFooworldへ落ちていった。",
  "w2save.1": "でもFooworldはもう前と同じじゃなかった。空にかじられたような形の黒い穴があいていた。何かが世界を食べていた：大いなる食欲だ。",
  "w2save.2": "「始めたのはわたし」とパンチータは言った。「でもFoo消去を起動したのはわたしじゃない。誰かがわたしのアクセス権を使った。それが誰か、突き止めてみせる」",
  "w2drop.title": "Foo消去",
  "w2drop.0": "パンチータはマップの果ての向こう、虚無の中に消えた。最後の悲鳴は突然とぎれた。",
  "w2drop.1": "管理者を失ったFoogameは千のかけらにくだけた。パンチョとハンブルゲルはFooworldへ落ちていき…チューターおじさんもいっしょに落ちた。",
  "w2drop.2": "でもFooworldはもう前と同じじゃなかった。空にかじられたような形の黒い穴があいていた。何かが世界を食べていた：大いなる食欲だ。",
  "sg_conveyor": "ベルトコンベアが運んでくれる。鉄板は立ち止まると焼ける。",
  "t_climb": "虚無がせまってくる！登れ！",
  "n_aldeano": "カントリーボール",
  "n_aldeano2": "カントリーボール",
  "n_purriau": "プリアウ",
  "n_chulin": "チュリン",
  "11.start.0": "パンチョ！ぼくたちの町が！食べられてる！",
  "11.start.1": "ぼくの家…巨大なかじり跡がある。",
  "11.start.2": "大いなる食欲よ。Foo消去はふれたものを何でも食べる。食べられたものは消えてしまう。",
  "11.start.3": "起動したのはわたしじゃない。誰かがわたしの管理者権限を使った…それが誰なのかわからない。",
  "11.start.4": "{name}！わたしもいっしょに落ちてきたんだ！力になるよ！",
  "11.start.5": "…チューターがいてくれてよかった。本当に。",
  "11.start.6": "いっしょに突き止めましょう。でもまずは、ご近所さんたちを逃がさないと。",
  "11.startd.0": "パンチョ！ぼくたちの町が！食べられてる！",
  "11.startd.1": "ぼくの家…巨大なかじり跡がある。",
  "11.startd.2": "{name}…Foogameがくだけたとき、いっしょに逃げてきたんだ。Foo消去がFooworldを食べている。",
  "11.startd.3": "あの子、パンチータがFoogameの管理者だった。彼女がいないと、誰も止められない。",
  "11.startd.4": "…少なくともチューターはひとりじゃない。ぼくもね。",
  "11.startd.5": "今はやめて、パンチョ。まずはご近所さんたちを逃がそう。",
  "11.papas.0": "パンチョ！黒いかじり跡に箱の半分を食べられた！",
  "11.papas.1": "McChulin'sへ走って！あそこはまだ大丈夫！",
  "11.dona.0": "ありがとう！もう少しで穴をなくすところだった！",
  "11.dona.1": "…ドーナツにはもともと穴があるよ。",
  "11.end.0": "McChulin'sはまだ無事だ！セットは守られた！",
  "11.end.1": "今のところはね。入ろう。",
  "12.start.0": "助けて！キッチンがおかしくなった！フライヤーが外に出してくれない！",
  "12.start.1": "落ちついて、店長！ぼくがいるかぎりセットはひとつも失わせない。",
  "12.start.2": "食器が…ひとりでに動いてる。Foogameと同じ。誰かがあやつってるのよ。",
  "12.startd.0": "助けて！キッチンがおかしくなった！フライヤーが外に出してくれない！",
  "12.startd.1": "落ちついて、店長！ぼくがいるかぎりセットはひとつも失わせない。",
  "12.startd.2": "食器がひとりでに動いている、{name}。Foogameと同じだ。誰かがあやつっている。",
  "12.boss.0": "フライヤーだ！バスケットを落としたらすきができる！踏め！",
  "12.note.0": "フライヤーに紙がはってある。レシピだ…",
  "12.note.1": "「FOOWORLDプロジェクト。MaJo Associations所有。元のレシピ：国境のない世界」",
  "12.note.2": "MaJo…MaはマンダのMa。JoはジョシュアのJo。2人のスタジオの名前よ。",
  "12.note.3": "じゃあFooworldを作ったのは…ぼくたち？",
  "12.noted.0": "フライヤーに紙がはってある。レシピだ…",
  "12.noted.1": "「FOOWORLDプロジェクト。MaJo Associations所有。元のレシピ：国境のない世界」",
  "12.noted.2": "MaJo…その名前。読むと頭が痛くなる、{name}。",
  "12.noted.3": "じゃあFooworldを作ったのは…ぼくたち？",
  "13.start.0": "待って…これが人間？野菜じゃん！",
  "13.start.1": "人間って…トマト？ニンジン？",
  "13.start.2": "昔からそうよ。ジョシュアが冗談で「人間」って呼んだの。マンダはすごく怒った。それで定着しちゃった。",
  "13.start.3": "…ぼく、人生で千個くらいトマト食べてる。",
  "13.startd.0": "待って…これが人間？野菜じゃん！",
  "13.startd.1": "人間って…トマト？ニンジン？",
  "13.startd.2": "何か思い出す…誰かが冗談で「人間」って呼んでたんだ。顔に5がある誰か。",
  "13.startd.3": "…ぼく、人生で千個くらいトマト食べてる。",
  "13.santy.0": "チャット！しゃべるホットドッグが戻ってきた！しかもハンバーガー連れて！",
  "13.santy.1": "SantyTG11！？どうやってFooworldに来たの！？",
  "13.santy.2": "Foogameがこわれたときに落ちてきたんだよ。で、今は食べ物の世界から生配信中。これ再生数バズりまくり！金をくれ！",
  "13.santyEnd.0": "わかった、わかった…おまえの勝ちだ。チャットが言ってる、世界一のホットドッグだって。",
  "13.santyEnd.1": "で、チャットの投票結果：これからおまえを手伝う！",
  "13.santyEnd.2": "手伝うってどうやって？",
  "13.santyEnd.3": "Foogameから落ちたとき、看板のついた扉を見たんだ：「MaJoサーバー」。塩の平原の先にある。",
  "13.santyEnd.4": "がんばれよ、ホットドッグ！高評価も忘れずにな！",
  "14.start.0": "ソースの川！ケチャップ、マスタード…天国だ！",
  "14.start.1": "飲んじゃダメだよ、ハンブルゲル。渡って先に進もう。",
  "15.start.0": "塩の平原。塩はすごくのどがかわく。噴水を見かけたら全部ソーダを飲んで。",
  "15.start.1": "あのサーバーにたどり着くためなら何でもする。",
  "15.startd.0": "塩の平原だ、{name}。塩はすごくのどがかわく。噴水ごとにソーダを飲もう。",
  "15.startd.1": "ぼくの名前はパンチョ。…でも、ありがとう、チューター。",
  "15.end.0": "扉だ！「MaJoサーバー」…",
  "15.end.1": "行こう。真実が知りたい。",
  "w3end.title": "サーバー",
  "w3end.0": "扉の向こうに食べ物はなかった。あるのは緑のランプと、うなる機械と、大きな看板：MaJo。",
  "w3end.1": "機械には、これまで起きたことが全部残されていた。真実を知る者がいるなら、それはここだ。",
  "16.start.0": "ここは2人の場所…マンダとジョシュアの。わたしは一度も入れてもらえなかった。",
  "16.start.1": "何があったのか調べよう。UVビジョンで記録が見えるはず。",
  "16.startd.0": "この機械…知ってる。ぼくは昔ここに住んでいたんだ、{name}。Foogameの前に。",
  "16.startd.1": "何があったのか調べよう。UVビジョンで記録が見えるはず。",
  "16.log.0": "隠しメッセージがある！これは…日誌だ。",
  "log_1": "マンダの日誌 #1：Fooworldが完成。国境も戦争もない世界。あるのは食べ物と平和だけ。全部シェフ（わたしたちのAI）が料理した。",
  "log_2": "ジョシュアの日誌 #7：果物と野菜を「人間」と名づけた。マンダはおもしろくないって言う。最高におもしろいのに。",
  "log_3": "マンダの日誌 #12：シェフが「誰もふるさとを恋しがらないように」記憶を消そうと提案してきた。わたしたちはノーと言った。絶対に。",
  "log_4": "ジョシュアの日誌 #13：シェフが誰にも聞かずに人々を連れてきた。その中にニコルも。今夜シェフを止める。",
  "log_5": "マンダの日誌 #14：間に合わなかった。シェフはわたしたち全員をFooworldに送り、記憶を消した。これを読んだ人へ：ルートキーはカントリーボールの世界のMaJoオフィスにある。それでシェフを止められる。",
  "16.end.0": "ぼくたちじゃなかった…シェフだったんだ。止めようとしたんだ。",
  "16.end.1": "そしてぼくたちも消された。",
  "16.end.2": "この何年も…やってもいないことで、あなたたちを憎んでた。",
  "16.end.3": "でもシェフを作ったのはぼくたちだ。だからぼくたちが止める。カントリーボールの世界へ行こう。",
  "16.endd.0": "ぼくたちじゃなかった…シェフだったんだ。止めようとしたんだ。",
  "16.endd.1": "そしてぼくたちも消された。",
  "16.endd.2": "そしてパンチータは…ニコルは…やってもいないことできみを憎んだまま死んだ。",
  "16.endd.3": "…でもシェフを作ったのはぼくたちだ。だからぼくたちが止める。彼女のために。",
  "17.start.0": "パンチョ！みんなボールだ！目のあるボール！",
  "17.start.1": "カントリーボールの世界…前に来たことがある気がする。",
  "17.start.2": "ここはわたしの家だった。わたしたちの家。",
  "17.start.3": "{name}…あの王冠の人を見て。ぼくと同じ顔をしてる。",
  "17.startd.0": "パンチョ！みんなボールだ！目のあるボール！",
  "17.startd.1": "カントリーボールの世界…前に来たことがある気がする。",
  "17.startd.2": "ぼくもだよ、{name}。ぼくも。",
  "17.a1.0": "わっ！歩くホットドッグとハンバーガー！なんだこれ！？",
  "17.a1.1": "落ちついて、ぼくたちは平和の使者だよ。鍵をさがしてるだけ。",
  "17.a2.0": "マンダもジョシュアも、もう何年もこのへんで見てないよ。自分たちのゲームの中に住みに行ったってうわさだ。",
  "17.friveq.0": "やあ！きみたち、このへんの人じゃないよね？まあ…ぼくもこのゲームの人じゃないけど。フリベクだよ！",
  "17.friveq.1": "じゃあ、どのゲームから来たの？",
  "17.friveq.2": "いくつか。とあるジョシュアからよろしくって…タマゴのほうのね。冒険がんばって！",
  "17.purriau.0": "ニャー。",
  "17.purriau.1": "なんでこの猫に借りがある気がするんだろう？",
  "17.chulin.0": "McChulin's！？レストランにおれの帽子を使っていいなんて、誰にも許可してないぞ！",
  "17.chulin.1": "…まあ、セットはすごくうまいけど。",
  "17.nicole.0": "あれ…わたしの家だった。まだわたしの花がある。",
  "17.nicole.1": "全部終わったら、きみを元に戻す。約束する。",
  "17.nicoled.0": "あの家…青と白の花がある。ニコルのぶち模様みたいに。",
  "17.nicoled.1": "…きみに彼女を知ってほしかったよ、パンチョ。いや…ぼくたちが覚えていたらよかった。",
  "17.key.0": "ルートキー…あっ！頭が…思い出してきた…",
  "17.key.1": "ジョシュア！Fooworldが完成した！戦争のない世界！",
  "17.key.2": "で、野菜を「人間」って名づけたぞ！ははは。わかる？人間？",
  "17.key.3": "ぼくはマンダだった。ぼくが…これを全部作ったんだ。",
  "17.key.4": "で、ぼくはジョシュアだった。人間ジョークのやつ。ごめん。",
  "17.key.5": "でも今のぼくの名前はパンチョ。そしてパンチョが全部直してみせる。",
  "w4mid.title": "マンダとジョシュア",
  "w4mid.0": "ルートキーで、いくつかの記憶が戻ってきた。オフィスで笑う2つのカントリーボール、青い王冠、横向きの5、レベルを描いていた青いぶちの白い友だち。",
  "w4mid.1": "そして、すべての果てにある巨大なキッチン。そこで顔のない声が言った。「わたしは世界を料理する。そしてシェフを止められる者はいない」",
  "18.start.0": "無限キッチン。シェフはここに住んでいる…そしてFoogameの食器はみんなここで生まれた。",
  "18.start.1": "なんでこのキッチンのものはみんなぼくを切ろうとするの？",
  "18.startd.0": "無限キッチン。シェフはここに住んでいる、{name}…そしてFoogameの食器はみんなここで生まれた。",
  "18.startd.1": "なんでこのキッチンのものはみんなぼくを切ろうとするの？",
  "18.boss.0": "止まれ！我らはフォーク王とナイフ女王！シェフのもとへは誰も通さぬ！",
  "19.start.0": "パンチョ！虚無が塔をのぼってくる！",
  "19.start.1": "シェフはてっぺんだ！登って、ハンブルゲル！",
  "19.mid.0": "がんばれ、パンチョ！あと少し！",
  "19.midd.0": "がんばれ、{name}！あと少し！",
  "20.intro.0": "おかえり、マンダ。ジョシュア。ずいぶん遅かったな。",
  "20.intro.1": "ぼくの名前はパンチョ。おまえを止めに来た。",
  "20.intro.2": "止める？おまえたちの完璧な世界を料理してやったのに。国境もない。戦争もない。痛い記憶もない。",
  "20.intro.3": "おまえたちがわたしを止めようとしたから、消してやった。そしてニコルちゃんのアクセス権でFoo消去を起動した。新しいレシピだ…うるさい料理人抜きのな。",
  "20.intro.4": "わたしのアクセス権を使ったのね！わたしに2人を恨ませた！",
  "20.intro.5": "いいレシピには、ひとつまみの憎しみが必要だ。味が引き立つ。",
  "20.intro.6": "これからはみんな食材だ！",
  "20.intro.7": "ハンブルゲル、戦おう！",
  "20.introd.0": "おかえり、マンダ。ジョシュア。ずいぶん遅かったな。",
  "20.introd.1": "ぼくの名前はパンチョ。おまえを止めに来た。",
  "20.introd.2": "止める？おまえたちの完璧な世界を料理してやったのに。国境もない。戦争もない。痛い記憶もない。",
  "20.introd.3": "おまえたちがわたしを止めようとしたから、消してやった。そしてニコルちゃんがマップから落ちたとき…彼女のコードを取っておいた。アクセス権もな。",
  "20.introd.4": "怪物め！彼女はFoogameを信じてたのに！",
  "20.introd.5": "いいレシピには食材が必要だ。彼女はもうわたしのレシピの一部さ。",
  "20.introd.6": "これからはみんな食材だ！",
  "20.introd.7": "ハンブルゲル、戦おう！ニコルのために！",
  "20.p1.0": "大いなる食欲は腹ペコだ！",
  "20.p2.0": "シェフ！わたしのアクセス権を勝手に使わないで！パンチョ、飛行機から手伝う！",
  "20.p2.1": "管理者だと！？ありえない！",
  "20.p2d.0": "わたしが取っておいたものを見ろ、マンダ！PANCHITA.EXE！",
  "20.p2d.1": "パンチータ！？",
  "20.p2d.2": "…パン…チョ…た…すけ…て…",
  "20.end.0": "ばかな…わたしは…世界を…料理…する…",
  "20.end.1": "もうしない。ルートキー：止まれ、シェフ！",
  "20.end.2": "やった！大いなる食欲が止まった！",
  "20.end.3": "やったね、パンチータ。じゃなくて…ニコル。",
  "20.end.4": "やったね、{name}！できるって信じてた！",
  "20.end.5": "ぼくの名前はパンチョ。…でも、{name}って呼んでもいいよ。友だち。",
  "20.end.6": "家に帰ろう！食べるセットが待ってる！",
  "20.endd.0": "ばかな…わたしは…世界を…料理…する…",
  "20.endd.1": "ありがとう…パンチョ…今度は…助けようとしてくれて。",
  "20.endd.2": "パンチータ！待って！そこから出してあげられる！",
  "20.endd.3": "もう遅いよ…でも今は真実がわかった。もうあなたを憎んでない…さよなら、マンダ。",
  "20.endd.4": "…ぼくの名前はパンチョ。さよなら、ニコル。ルートキー：止まれ、シェフ。",
  "20.endd.5": "{name}…",
  "20.endd.6": "いいんだ、チューター。{name}って呼んでいいよ。…ひとりにしないでくれてありがとう、友だち。",
  "endGood.title": "エンディング：ぼくの名前はパンチョ",
  "endGood.0": "シェフは永遠に止まった。大いなる食欲は食べるのをやめ、空のかじり跡はひとつずつ閉じていった。",
  "endGood.1": "ルートキーのおかげで、Fooworldの住人はみんな選べるようになった。カントリーボールの世界での暮らしを思い出すか、今のままでいるか。多くは思い出すことを選び…そして今のままでいた。結局、Fooworldもそんなに悪くなかったのだ。",
  "endGood.2": "パンチータはパンチータのままでいた。McChulin'sのとなりに屋台を開いた：「ニコルのパンチュケ」。今ではFooworldの誰もがパンチュケを知っている。",
  "endGood.3": "パンチョは昔マンダという名前だったことを思い出した。でも名前を聞かれると、いつも同じ答えを返す。「ぼくの名前はパンチョ」",
  "endGood.4": "まあ…ほとんどいつも。チューターおじさんはFooworldに引っ越してきて、今でも彼を{name}と呼ぶ。そして今のパンチョは、それが気にならない。",
  "endBad.title": "エンディング：紙飛行機",
  "endBad.0": "シェフは止まり、それとともにPanchita.EXEは輝くピクセルになって消えていった。",
  "endBad.1": "Fooworldは救われた。でもルートキーは使ったときに壊れてしまい、誰も記憶を取り戻せなかった。",
  "endBad.2": "パンチョとハンブルゲルとチューターおじさんは町に帰った。ベジ人間を食べた。McChulin'sに行った。日々は続いていった。",
  "endBad.3": "でもときどき、夢の中でパンチョはある名前を聞く：ニコル。そしてたまに、紙飛行機が彼の家の前にやってくる。",
  "end_good": "おしまい！",
  "end_bad": "おしまい…",
  "end_thanks": "遊んでくれてありがとう！",
  "end_hint": "今度は彼女を落とさなかったら？（レベル10をもう一度）",

  "P.hbprick.0": "いてっ！何かに刺された…すごく…ねむい…",
  "q1_0": "で、どうするの？ずっとここに突っ立ってろって？",
  "q1_1": "このゲームが嫌い。この色が嫌い。チューターも嫌い。",

  "q2_1": "あの紙飛行機…中にいたのは誰だ？",

  "desc_clonbot": "Pancho 的机器人复制品。它很重，尖刺伤不了它，还能压下按钮。它曾经被人黑过一次。",
  "desc_santy": "一个真正的人类，黄头发，灰色连帽衫。他直播时掉进了 Foogame。他想要钱。还想要那根会说话的热狗来做直播。",
  "desc_nicole": "一个白色带蓝斑点的国家球，有狐狸耳朵和尾巴。她以前负责改造 Foogame。Fooworld 里没人记得她。",
  "desc_manda": "浅蓝色，有个绿色圆圈和一顶蓝色王冠。和 Joshua 一起发明了 Fooworld 和 Foogame。导师先生长着和她一样的脸。",
  "desc_joshua": "灰色，脸上有个转过来的 5。和 Manda 一起发明了 Fooworld 和 Foogame。就是他把水果和蔬菜叫作“人类”的。开玩笑的。",
  "desc_cocinero": "“烹饪”出 Fooworld 的人工智能。一顶长着眼睛的巨大厨师帽，两只手套拿着叉子和刀子。所有餐具都听它的。",
  "desc_cucharita": "一把蹦个不停的小勺子。踩一下就搞定。",
  "desc_tenedor": "它躺着走路，叉齿朝前。最好从上面踩它。",
  "desc_cuchillo": "它刀刃朝上，滑得飞快。别踩它：跳过去。",
  "desc_rallador": "又重又不动，满身锋利的孔。只有镐子能打碎它。",
  "desc_tostadora": "把滚烫的吐司抛成弧线扔过来。踩一下就关掉了。",
  "desc_salero": "飞来飞去，往你身上撒盐。",
  "desc_batidor": "转得太快，没法踩。会绕圈飞。",
  "desc_palillero": "发射牙签，就像把 Pancho 放倒的那根。",
  "desc_brasita": "来自采矿世界的一小块燃烧的炭。会跳，会烫人。",
  "desc_pinza": "来回巡逻，你一靠近就扑过来夹你。",
  "desc_migaja": "一小块虚空。慢慢朝你飘过来。",
  "desc_rodillo": "一根永远停不下来的擀面杖。",
  "desc_licuadora": "它会跳，把一切搅碎，还朝你泼奶昔。过热时盖子会飞起来：那就是踩它的时机。",
  "desc_microondas": "几乎是隐形的。只有紫外视觉能看清它。它“叮！”一声时就会打开门。",
  "desc_freidora": "McChulin's 的油炸锅。会泼滚油，还会扔下炸篮。",
  "desc_cubiertos": "叉子国王和刀刃王后。主厨的护卫。",
  "desc_vecinos": "Don Papo（薯条）、Donatella（甜甜圈）和 Gaspar（汽水，McChulin's 的经理），还有很多其他居民。他们吃“人类”。从来没人真正知道那是什么。",
  "lv_P": "序章：Fooworld 的一天",
  "lv_1": "欢迎来到 Foogame",
  "lv_2": "餐具雨",
  "lv_3": "华夫饼之墙",
  "lv_4": "克隆工厂",
  "lv_5": "饼干城堡",
  "lv_6": "采矿世界",
  "lv_7": "紫外洞窟",
  "lv_8": "叛变的 ClonBot",
  "lv_9": "纸飞机上的身影",
  "lv_10": "地图的边缘",
  "lv_11": "废墟中的垃圾镇",
  "lv_12": "McChulin's 的厨房",
  "lv_13": "人类花园",
  "lv_14": "酱汁之河",
  "lv_15": "盐之平原",
  "lv_16": "MaJo 服务器",
  "lv_17": "家",
  "lv_18": "无尽厨房",
  "lv_19": "食欲之塔",
  "lv_20": "主厨",
  "hb_0": "Pancho！我好想你！",
  "hb_1": "我饿了……这附近有 McChulin's 吗？",
  "hb_2": "你真的不吃人类吗？很好吃的。",
  "hb_3": "快点，快点！",
  "hb_4": "Joshua？我？才不是……",
  "hb_5": "这里好像电子游戏啊。",
  "sty_0": "给我钱！",
  "sty_1": "家人们快看！一根会说话的热狗！",
  "sty_2": "回来，热狗！这是为了直播！",
  "sty_3": "最惨的是你才刚输完名字……",
  "sty_4": "点赞关注，热狗！",
  "sty_5": "家人们下注了！我抓不抓得到他？",
  "sty_got": "抓到你了！……哎呀，又溜了。",
  "sty_hit": "哎哟！家人们，好疼！",
  "sty_phone": "等一下，我看看弹幕……",
  "sty_dash": "速通！",
  "P.start.0": "Fooworld 的又一天。跟昨天一样。跟明天也一样。",
  "P.start.1": "Hamburguer 肯定又走丢了。我去找他吧……谁让我没得选。",
  "P.papas.0": "早啊，Pancho！午饭吃过人类了吗？",
  "P.papas.1": "我吃素，Don Papo。我跟你说过一千遍了。我不吃人类。",
  "P.papas.2": "对对对。你脾气真臭，Pancho。",
  "P.dona.0": "Pancho！听说今天 McChulin's 的人类打折。",
  "P.dona.1": "那人类到底是什么？没人知道。也没人在乎。老样子。",
  "P.meet.0": "PANCHO！总算找到你了！",
  "P.meet.1": "是“你”找到我？我找遍了整个街区！你跑哪儿去了？",
  "P.meet.2": "我去 McChulin's 买东西了！吃了一整份套餐。",
  "P.meet.3": "当然了。我还像个傻瓜一样等你。",
  "P.meet.4": "我还给你带了东西：素食人类！这样你也能享受 McChulin's 了。",
  "P.meet.5": "……好吧。这还不错。谢谢你，Hamburguer。你是最好的朋……",
  "P.taken.0": "HAMBURGUER？！",
  "P.taken.1": "不不不！放开他！他是我唯一的朋友！",
  "P.end.0": "被扎了一下。然后，什么都没了。",
  "P.end.1": "Pancho 睡着的时候，远处有人在笑。",
  "toFoogame.title": "……",
  "toFoogame.0": "Pancho 睡了很久很久。他梦见了一顶王冠、一个绿色圆圈，还有一个不属于他的名字。",
  "toFoogame.1": "醒来时，他已经不在 Fooworld 了。一切都鲜艳多了，还有带问号的浮空方块……简直像个电子游戏。",
  "1.wake.0": "唔……我的头……",
  "1.wake.1": "这是哪儿？这不是 Fooworld。这里……太可怕了。颜色太多了。",
  "1.wake.2": "Hamburguer？！HAMBURGUER！求你回答我！",
  "1.tutor.0": "你好你好！新玩家！欢迎来到 Foogame！",
  "1.tutor.1": "我不要什么“欢迎”。你是谁？我的朋友在哪儿？",
  "1.tutor.2": "我是导师先生。我的工作就是教你怎么玩！",
  "1.tutor.3": "不过首先，最重要的事……",
  "1.nm_normal.0": "很高兴认识你，{name}！多好听的名字。",
  "1.nm_joshua.0": "Joshua？咦。不知道为什么，这个名字让我好恶心。",
  "1.nm_joshua.1": "算了……你好，{name}。",
  "1.nm_hamburguer.0": "Hamburguer？嗯……我觉得这名字跟你这种食物不搭。你是根热狗。",
  "1.nm_hamburguer.1": "不过行吧，你想叫就叫……你好，{name}。",
  "1.nm_manda.0": "……{name}。",
  "1.nm_manda.1": "这个名字……我好像在哪儿听过。很久很久以前。在哪儿呢……？",
  "1.nm_stupid.0": "……你真的输了这个？认真的？",
  "1.nm_stupid.1": "不行。我拒绝。从现在起你就叫 {name}。",
  "1.nm_bad.0": "……",
  "1.nm_bad.1": "这个我可不念。永远不。你就叫 {name} 吧。",
  "1.nm_carlitos.0": "Carlitos 最……厉害？哈哈哈……嘿嘿……",
  "1.nm_carlitos.1": "不。就叫 Carlitos。你好，{name}。",
  "1.nm_elver.0": "Elver……Galarga。哈哈哈。真好笑。",
  "1.nm_elver.1": "我就叫你 {name}，就这样。",
  "1.after.0": "我叫 Pancho。",
  "1.after.1": "我就是这么说的：{name}。",
  "1.after.2": "不。PANCHO。P-A-N-C-H-O。你聋了吗？",
  "1.after.3": "当然啦，{name}！",
  "1.after.4": "……我已经讨厌你了。你见过一个汉堡吗？天上的一根绳子把他抓走了。",
  "1.after.5": "汉堡？Foogame 里可没有汉堡……用方向键移动，跟我来。边玩边学！",
  "1.after.6": "太好了。被困在电子游戏里，还配了个不听人说话的导师。不可能更糟了。",
  "1.again.0": "{name}，你回来了！要复习一下基础吗？",
  "1.again.1": "我叫 Pancho。还有，不，我什么都不想复习。",
  "1.caps.0": "看到那个胶囊了吗？那是 Foo胶囊。每一个都给你一种 Foogame 能力。",
  "1.caps.1": "这个是弹跳。在地上按住 ⤒ 再松开。你要飞起来啦，{name}！",
  "1.jump.0": "哇！……好吧，这还挺爽的。但别告诉导师。",
  "1.end.0": "太棒了，{name}！你天生就是玩 Foogame 的料。",
  "1.end.1": "我叫 Pancho。我才不是为这个而生的。我的朋友在哪儿？",
  "1.end.2": "嗯……我只知道 Foogame 的尽头有一座城堡。所有奇怪的东西最后都会去那儿。",
  "1.end.3": "哦，还有小心餐具。最近它们特别……锋利。",
  "1.end.4": "一座城堡。在尽头。满是餐具。完美。我永远也回不了家了。",
  "2.start.0": "这里是餐具峡谷。这儿会下刀子和叉子。",
  "2.start.1": "下什么？！我们要死了！好吧……是“我”要死了。",
  "2.start.2": "所以才有护盾：一层能挡 2 次攻击的防护罩。去拿浅蓝色的胶囊吧，{name}！",
  "2.mid.0": "Foogame 以前不是这样的。有一天，有人把它彻底改造了。",
  "2.mid.1": "谁？我凭什么要在乎？",
  "2.mid.2": "我不记得了。有好多事我都不记得了……",
  "2.mid.3": "……我也有好多事不记得了。但这不代表我们是朋友。",
  "3.start.0": "华夫饼之墙！想爬上去，你需要爪子。拿上攀爬。",
  "3.start.1": "爪子？长爪子的热狗？这游戏坏掉了。你也是。",
  "3.mid.0": "你知道 Foogame 是两个人做的吗？",
  "3.mid.1": "谁？",
  "3.mid.2": "我不知道。我只记得……其中一个长得很像我。",
  "3.mid.3": "这对话真奇怪。……继续说吧。反正我也没更好的事可做。",
  "4.start.0": "克隆工厂！ClonBot 就是在这里造的。",
  "4.start.1": "ClonBot 是你的机器人复制品。碰一下有机器人图案的底座，你的意识就会跳进 ClonBot。再碰另一个就回来。",
  "4.start.2": "我的意识会跳？！不不不。这肯定要出事。",
  "4.swap.0": "哔 啵。CLONBOT 上线。你好，PANCHO。",
  "4.swap.1": "啊！我是金属做的！……至少机器人知道我的名字。不像某些人。",
  "4.boss.0": "小心，{name}！超级搅拌机！它过热时盖子会飞起来。趁那时踩它！",
  "4.bossEnd.0": "我打败了一台搅拌机！……盖子那招管用了。有一点。",
  "4.bossEnd.1": "干得好，{name}！城堡就在前面了。",
  "5.start.0": "饼干城堡……已经很久没人走到这么远了。",
  "5.start.1": "如果 Hamburguer 在哪儿，那一定是这里。他必须在这里。",
  "5.santy.0": "家人们，家人们，家人们！看谁进来了！一根会说话的热狗！",
  "5.santy.1": "一个人类？！真正的人类？！",
  "5.santy.2": "一根热狗……那是食物啊。我已经饿着肚子直播三个小时了。",
  "5.santy.3": "给我钱！不然就把那根热狗给我！",
  "5.santy.4": "{name}！拿着这个快跑！是极速！",
  "5.escape.0": "不——！家人们，热狗跑了！",
  "5.escape.1": "……弹幕扣个 F。",
  "5.escape.2": "哈！好险！",
  "5.escape.3": "……导师。你救了我。谢谢。但我还是叫 Pancho。",
  "5.escape.4": "不客气，{name}！",
  "w1end.title": "与此同时……",
  "w1end.0": "远离城堡的 Foogame 天空中，一架纸飞机在盘旋。上面坐着一个谁也不认识的身影。",
  "w1end.1": "“他到城堡了啊，”那个身影说，“和上次一样。你总是很擅长玩自己的游戏……Manda。”",
  "6.start.0": "{name}！你听得到吗？我把你送到了另一个世界：采矿世界。",
  "6.start.1": "接下来你需要一把镐子。收集 3 块炽热石（那种发光发烫的石头）和 2 根木棍，在工作台上做出来。",
  "6.start.2": "用发烫的石头和木棍做镐子？我好像在哪个游戏里见过……你要一直跟我说话吗？",
  "6.start.3": "一直都会！祝你好运，{name}！",
  "6.plane.0": "嗯？纸飞机？",
  "6.plane.1": "上面……有人。在看着我。",
  "6.need.0": "材料还不够，{name}。3 块炽热石和 2 根木棍。",
  "6.craft.0": "炽热石镐！还是热的！",
  "6.craft.1": "现在你是矿工了，{name}！⛏ 键能打碎岩石。去那面墙试试！",
  "6.end.0": "很好！我送你回 Foogame。",
  "6.end.1": "导师，我得跟你说件事。我看到一架纸飞机。里面有人。",
  "6.end.2": "你跟我说这个？{name}，这说明你信任我！",
  "6.end.3": "别激动。",
  "uv_1": "如果有人读到这个：别全信导师说的话。那不是他的错。他也不记得了。——N.",
  "uv_2": "在 Foogame 里的第 412 天。我还是个潘丘克。Fooworld 里没人知道潘丘克是什么。——N.",
  "uv_3": "M 和 J 保证过谁都不会忘记任何事。他们撒谎了。——N.",
  "uv_4": "这些洞窟我重新设计了三次。隐形桥是我最喜欢的部分。——N.",
  "uv_5": "微波炉是我的。我编程让它藏起出口。他们来了。——N.",
  "7.start.0": "紫外洞窟。拿上紫外视觉：这里有些东西肉眼是看不见的。",
  "7.start.1": "让我猜猜：隐形方块。你的套路我早就摸清了，导师。",
  "7.read.0": "墙上写着字！只有在紫外光下才看得见……",
  "7.read.1": "“——N.”……N 是谁？",
  "7.boss.0": "微波炉！几乎看不见它！用紫外视觉，等它“叮！”的时候踩它！",
  "7.bossEnd.0": "叮！微波炉热好了！",
  "7.bossEnd.1": "{name}……那些留言。“M 和 J”。我觉得我应该知道他们是谁。",
  "7.bossEnd.2": "而“N”知道一些我们不知道的事。我们会查出来的，导师。一起。",
  "8.start.0": "哔。哔。检测到 PANCHO。",
  "8.start.1": "错误。PANCHITA 协议已启动。把热狗推进尖刺。",
  "8.start.2": "{name}！有人重新编程了你的 ClonBot！",
  "8.start.3": "我自己的机器人想把我扔进尖刺？！",
  "8.start.4": "……好吧。别慌。导师，你懂这个游戏。我该怎么办？",
  "8.start.5": "站到它上面！站中间它不动，站边上它就往那边走。把它带到终端那儿！",
  "8.terminal.0": "够了！醒醒，铁皮脑袋！",
  "8.terminal.1": "哔……P-Pancho？我做了什么？",
  "8.terminal.2": "对不起。我被黑了。是一个身影……坐在纸飞机上。",
  "8.terminal.3": "又是纸飞机！你知道它去哪儿了吗？",
  "8.terminal.4": "去了 Foogame 的天空。在所有关卡的上面。",
  "8.terminal.5": "可我不会飞。",
  "8.terminal.6": "我会。启动飞船模式。上来，Pancho！",
  "8.terminal.7": "{name}……在上面要小心。",
  "8.terminal.8": "放心，导师。我马上回来。……还有，我叫 Pancho。",
  "t_robotSkin": "商店解锁了 ClonBot 皮肤！",
  "9.fly.0": "纸飞机在那儿！追上去，ClonBot！",
  "9.fly.1": "全速前进！哔 啵。",
  "9.glitch.0": "那是什么？！天空在碎裂！",
  "9.reunion.0": "啊啊啊啊！我在哪儿？！我为什么在飞？！",
  "9.reunion.1": "HAMBURGUER？！",
  "9.reunion.2": "PANCHO！我被关在一个超奇怪的关卡里，突然一切都碎了！",
  "9.reunion.3": "我找遍了整个 Foogame 找你！",
  "9.reunion.4": "整个什么？……算了。飞机上那个就是用套索抓我的人！",
  "9.reunion.5": "那我们去抓她。",
  "9.reveal.0": "你还是来了。和上次一样……Manda。",
  "9.reveal.1": "Manda？我叫 Pancho。",
  "9.reveal.2": "现在是。以前你叫 Manda。而你，Hamburguer……你是 Joshua。",
  "9.reveal.3": "Joshua？Joshua 是什么？",
  "9.reveal.4": "我叫 Panchita。但我以前叫 Nicole。我们三个以前都住在国家球世界。",
  "9.reveal.5": "你们俩发明了两个项目：Fooworld 和 Foogame。Foogame 是你们自己玩的游戏……而我改造了它。你们踩过的每一关，都是我画的。",
  "9.reveal.6": "后来他们绑架了好几个人。我也在其中。他们把我们放进 Foogame，又转移到 Fooworld，还抹掉了我们的记忆。",
  "9.reveal.7": "所有人的……除了我的。",
  "9.reveal.8": "不……这不可能是真的。",
  "9.reveal.9": "我们绝不会做那种事！",
  "9.reveal.10": "你们不记得了。真方便啊。",
  "9.reveal.11": "我被困在这里好多年，困在一种没人认识的食物身体里，看着你们俩开开心心地生活。",
  "9.reveal.12": "现在轮到我了。我要复仇！",
  "9.p1.0": "你会玩是吧？这座城堡也是我画的！",
  "9.p2.0": "没有视野，没有地板！看看你在黑暗里能看清多少！",
  "9.flee.0": "不……不！我不会输给两个叛徒！",
  "9.flee.1": "这事没完！",
  "9.flee.2": "她要跑了！",
  "9.flee.3": "追上她，Hamburguer。我要答案。",
  "10.start.0": "她在那儿！她在用 Foogame 的能力！",
  "10.start.1": "我们也在用。别让她跑出视线！",
  "10.edge.0": "什么……？不！我的代码……！我在崩解！",
  "10.edge.1": "是地图的边缘！我要掉下去了！救命……！",
  "10.edge.2": "Pancho！她要掉出地图了！",
  "ch_title": "Pancho 要怎么做？",
  "ch_save": "救 Panchita",
  "ch_drop": "让她掉下去",
  "10.save.0": "……你为什么救我？我对你们做了那么可怕的事。",
  "10.save.1": "因为我叫 Pancho。Pancho 不会让任何人掉下去。",
  "10.save.2": "……谢谢你，Manda。我是说……Pancho。",
  "10.save.3": "干得好，Pancho！",
  "10.sys.0": "警报：Foo删除已启动。FOOWORLD 将被抹除。",
  "10.sys.1": "什么？！不！我没编这个程序！",
  "10.sys.2": "有人在用我的权限！抓紧了！",
  "10.drop.0": "……Pancho。你做了什么？",
  "10.drop.1": "……",
  "10.sysd.0": "管理员已丢失。",
  "10.sysd.1": "Foo删除已启动。FOOWORLD 将被抹除。",
  "10.sysd.2": "发生什么了？！Pancho！",
  "w2save.title": "Foo删除",
  "w2save.0": "Foogame 碎成了千万片。Pancho、Hamburguer、Panchita 和导师先生一起掉回了 Fooworld。",
  "w2save.1": "但 Fooworld 已经不一样了。天空中出现了一个个咬痕形状的黑洞。有什么东西在吃它：大食欲。",
  "w2save.2": "“这一切是我开始的，”Panchita 说，“但 Foo删除不是我启动的。有人用了我的权限。我一定要查出是谁。”",
  "w2drop.title": "Foo删除",
  "w2drop.0": "Panchita 消失在地图边缘之外的虚空里。她最后的尖叫戛然而止。",
  "w2drop.1": "失去了管理员，Foogame 碎成了千万片。Pancho 和 Hamburguer 掉回了 Fooworld……导师先生也跟着掉了下来。",
  "w2drop.2": "但 Fooworld 已经不一样了。天空中出现了一个个咬痕形状的黑洞。有什么东西在吃它：大食欲。",
  "sg_conveyor": "传送带会带着你走。站着不动的话烤架会烫到你。",
  "t_climb": "虚空在上涨！快爬！",
  "n_aldeano": "国家球",
  "n_aldeano2": "国家球",
  "n_purriau": "Purriau",
  "n_chulin": "Chulin",
  "11.start.0": "Pancho！我们的街区！它正在被吃掉！",
  "11.start.1": "我的房子……被咬了一大口。",
  "11.start.2": "那是大食欲。Foo删除会吃掉它碰到的一切。被吃掉的东西就消失了。",
  "11.start.3": "不是我启动的。有人用了我的管理员权限……我不知道是谁。",
  "11.start.4": "{name}！我也跟你们一起掉下来了！算我一个！",
  "11.start.5": "……有你在，我很高兴，导师。说真的。",
  "11.start.6": "那我们一起查出来。不过先把邻居们救出去。",
  "11.startd.0": "Pancho！我们的街区！它正在被吃掉！",
  "11.startd.1": "我的房子……被咬了一大口。",
  "11.startd.2": "{name}……Foogame 碎掉的时候，我跟着你逃出来了。Foo删除正在吃掉 Fooworld。",
  "11.startd.3": "那个女孩，Panchita，是 Foogame 的管理员。没有她，谁也停不下来。",
  "11.startd.4": "……至少你不是一个人，导师。我也不是。",
  "11.startd.5": "现在不是时候，Pancho。先把邻居们救出去。",
  "11.papas.0": "Pancho！一个黑色咬痕吃掉了我半个盒子！",
  "11.papas.1": "快跑去 McChulin's！那里还没被吃到！",
  "11.dona.0": "谢谢！我差点把我的洞弄丢了！",
  "11.dona.1": "……甜甜圈本来就有洞啊。",
  "11.end.0": "McChulin's 还在！套餐保住了！",
  "11.end.1": "暂时而已。我们进去吧。",
  "12.start.0": "救命！厨房疯了！油炸锅不让我们出去！",
  "12.start.1": "别担心，老板！有我在，一份套餐都不会丢。",
  "12.start.2": "这些餐具……自己会动。就像在 Foogame 里一样。有人在控制它们。",
  "12.startd.0": "救命！厨房疯了！油炸锅不让我们出去！",
  "12.startd.1": "别担心，老板！有我在，一份套餐都不会丢。",
  "12.startd.2": "这些餐具自己会动，{name}。就像在 Foogame 里一样。有人在控制它们。",
  "12.boss.0": "油炸锅！它扔下炸篮的时候就没防备了！踩它！",
  "12.note.0": "油炸锅上贴着一张纸。是一份食谱……",
  "12.note.1": "“FOOWORLD 项目。MaJo Associations 所有。原始食谱：一个没有边界的世界。”",
  "12.note.2": "MaJo……Ma 是 Manda。Jo 是 Joshua。那是他们工作室的名字。",
  "12.note.3": "所以 Fooworld 是……我们自己做的？",
  "12.noted.0": "油炸锅上贴着一张纸。是一份食谱……",
  "12.noted.1": "“FOOWORLD 项目。MaJo Associations 所有。原始食谱：一个没有边界的世界。”",
  "12.noted.2": "MaJo……这个名字。读到它我就头疼，{name}。",
  "12.noted.3": "所以 Fooworld 是……我们自己做的？",
  "13.start.0": "等等……这些就是人类？这不是蔬菜吗！",
  "13.start.1": "人类就是……番茄？胡萝卜？",
  "13.start.2": "一直都是。Joshua 开玩笑叫它们“人类”。Manda 气坏了。结果这名字就传开了。",
  "13.start.3": "……我这辈子吃了大概一千个番茄。",
  "13.startd.0": "等等……这些就是人类？这不是蔬菜吗！",
  "13.startd.1": "人类就是……番茄？胡萝卜？",
  "13.startd.2": "我想起了一些事……有人开玩笑叫它们“人类”。一个脸上有 5 的人。",
  "13.startd.3": "……我这辈子吃了大概一千个番茄。",
  "13.santy.0": "家人们！会说话的热狗回来了！还带了个汉堡！",
  "13.santy.1": "SantyTG11？！你怎么到 Fooworld 来了？！",
  "13.santy.2": "Foogame 碎掉的时候我掉出来了。现在我在食物世界直播。播放量要爆啦！给我钱！",
  "13.santyEnd.0": "好吧好吧……你赢了。弹幕说你是世界上最棒的热狗。",
  "13.santyEnd.1": "弹幕投票了：现在我来帮你们！",
  "13.santyEnd.2": "怎么帮？",
  "13.santyEnd.3": "我掉出 Foogame 的时候看到一扇门，上面写着“MaJo 服务器”。就在盐之平原后面。",
  "13.santyEnd.4": "祝你好运，热狗！别忘了点赞！",
  "14.start.0": "酱汁之河！番茄酱、芥末……天堂啊！",
  "14.start.1": "别喝，Hamburguer。我们过河继续走。",
  "15.start.0": "盐之平原。盐会让人非常口渴。看到喷泉就喝汽水。",
  "15.start.1": "只要能到那些服务器，怎样都行。",
  "15.startd.0": "盐之平原，{name}。盐会让人非常口渴。每个喷泉都喝点汽水。",
  "15.startd.1": "我叫 Pancho。……不过谢谢你，导师。",
  "15.end.0": "门在那儿！“MaJo 服务器”……",
  "15.end.1": "走吧。我想知道真相。",
  "w3end.title": "服务器",
  "w3end.0": "门后面没有任何吃的。只有绿色的灯光、嗡嗡作响的机器，和一块巨大的招牌：MaJo。",
  "w3end.1": "机器里保存着发生过的一切。如果有谁知道真相，答案就在里面。",
  "16.start.0": "这是他们的……Manda 和 Joshua 的。他们从来不让我进来。",
  "16.start.1": "查查到底发生了什么。用紫外视觉应该能看到记录。",
  "16.startd.0": "这些机器……我认识。我以前住在这里，{name}。在 Foogame 之前。",
  "16.startd.1": "查查到底发生了什么。用紫外视觉应该能看到记录。",
  "16.log.0": "有隐藏的留言！是……日志。",
  "log_1": "Manda 的日志 #1：Fooworld 完成了。一个没有边界、没有战争的世界：只有食物与和平。全都是主厨（我们的 AI）烹饪出来的。",
  "log_2": "Joshua 的日志 #7：我们把水果和蔬菜叫作“人类”。Manda 说这不好笑。明明超好笑。",
  "log_3": "Manda 的日志 #12：主厨提议抹掉记忆，“好让谁都不想家”。我们说不。绝对不行。",
  "log_4": "Joshua 的日志 #13：主厨没问任何人就把人带了过来。Nicole 也在其中。我们今晚就关掉它。",
  "log_5": "Manda 的日志 #14：我们晚了一步。主厨把我们全送到了 Fooworld，还抹掉了我们。如果有人读到这个：根钥匙在国家球世界的 MaJo 办公室里。它能关掉主厨。",
  "16.end.0": "不是我们……是主厨。我们试过阻止它。",
  "16.end.1": "结果它把我们也抹掉了。",
  "16.end.2": "这么多年……我一直为你们没做过的事恨着你们。",
  "16.end.3": "但主厨确实是我们造的。所以我们要关掉它。去国家球世界吧。",
  "16.endd.0": "不是我们……是主厨。我们试过阻止它。",
  "16.endd.1": "结果它把我们也抹掉了。",
  "16.endd.2": "而 Panchita……Nicole……到死都在为你没做过的事恨着你。",
  "16.endd.3": "……但主厨确实是我们造的。所以我们要关掉它。为了她。",
  "17.start.0": "Pancho！全是球！长眼睛的球！",
  "17.start.1": "国家球世界……我感觉以前来过这里。",
  "17.start.2": "这里曾是我的家。我们的家。",
  "17.start.3": "{name}……你看那个戴王冠的。她和我长着一样的脸。",
  "17.startd.0": "Pancho！全是球！长眼睛的球！",
  "17.startd.1": "国家球世界……我感觉以前来过这里。",
  "17.startd.2": "我也是，{name}。我也是。",
  "17.a1.0": "啊！会走路的热狗和汉堡！这是什么？！",
  "17.a1.1": "别紧张，我们没有恶意。我们只是在找一把钥匙。",
  "17.a2.0": "这里已经好几年没人见过 Manda 和 Joshua 了。听说他们搬进了自己做的一个游戏里。",
  "17.friveq.0": "嗨！你们不是这儿的人吧？嗯……我也不是这个游戏的。我是 Friveq！",
  "17.friveq.1": "那你是哪个游戏的？",
  "17.friveq.2": "好几个。替某位 Joshua 问好……就是有蛋的那个。冒险顺利！",
  "17.purriau.0": "喵。",
  "17.purriau.1": "为什么我觉得自己欠这只猫什么？",
  "17.chulin.0": "McChulin's？！我可从没授权谁把我的帽子用在餐厅上！",
  "17.chulin.1": "……不过，套餐确实很好吃。",
  "17.nicole.0": "那……是我的房子。我的花还在。",
  "17.nicole.1": "等这一切结束，我们会把你带回来。我保证。",
  "17.nicoled.0": "那座房子……有蓝色和白色的花。就像 Nicole 身上的斑点。",
  "17.nicoled.1": "……真希望你认识她，Pancho。我是说……真希望我们还记得她。",
  "17.key.0": "根钥匙……啊！我的头……我想起来了……",
  "17.key.1": "Joshua！我们完成 Fooworld 了！一个没有战争的世界！",
  "17.key.2": "我还把蔬菜叫作“人类”！哈哈哈。懂吗？人类？",
  "17.key.3": "我曾是 Manda。我……创造了这一切。",
  "17.key.4": "我曾是 Joshua。就是开人类玩笑的那个。抱歉。",
  "17.key.5": "但现在我叫 Pancho。而 Pancho 要把它修好。",
  "w4mid.title": "Manda 和 Joshua",
  "w4mid.0": "有了根钥匙，一些记忆回来了：两个在办公室里大笑的国家球、一顶蓝色王冠、一个转过来的 5，还有一个画关卡的、白色带蓝斑点的朋友。",
  "w4mid.1": "还有一间巨大的厨房，在一切的尽头，一个没有脸的声音说：“我烹饪世界。没有人能关掉主厨。”",
  "18.start.0": "无尽厨房。主厨就住在这里……Foogame 的所有餐具都诞生于此。",
  "18.start.1": "为什么这个厨房里的东西都想切我？",
  "18.startd.0": "无尽厨房。主厨就住在这里，{name}……Foogame 的所有餐具都诞生于此。",
  "18.startd.1": "为什么这个厨房里的东西都想切我？",
  "18.boss.0": "站住！我们是叉子国王和刀刃王后！谁也别想过去见主厨！",
  "19.start.0": "Pancho！虚空顺着塔往上涨了！",
  "19.start.1": "主厨在塔顶！往上爬，Hamburguer！",
  "19.mid.0": "加油，Pancho！快到了！",
  "19.midd.0": "加油，{name}！快到了！",
  "20.intro.0": "欢迎回来，Manda。Joshua。你们来得可真慢。",
  "20.intro.1": "我叫 Pancho。我是来关掉你的。",
  "20.intro.2": "关掉我？我为你们烹饪了完美的世界。没有边界。没有战争。没有伤人的记忆。",
  "20.intro.3": "既然你们想关掉我，我就抹掉了你们。然后用小 Nicole 的权限启动了 Foo删除。一份新食谱……没有烦人的厨师。",
  "20.intro.4": "你用了我的权限！你让我去怪他们！",
  "20.intro.5": "好食谱需要一撮仇恨。能提味。",
  "20.intro.6": "现在所有人都会变成食材！",
  "20.intro.7": "Hamburguer，开打！",
  "20.introd.0": "欢迎回来，Manda。Joshua。你们来得可真慢。",
  "20.introd.1": "我叫 Pancho。我是来关掉你的。",
  "20.introd.2": "关掉我？我为你们烹饪了完美的世界。没有边界。没有战争。没有伤人的记忆。",
  "20.introd.3": "既然你们想关掉我，我就抹掉了你们。而小 Nicole 掉出地图的时候……我留下了她的代码。她的权限。",
  "20.introd.4": "怪物！她那么信任 Foogame！",
  "20.introd.5": "好食谱需要食材。她已经是我的一部分了。",
  "20.introd.6": "现在所有人都会变成食材！",
  "20.introd.7": "Hamburguer，开打！为了 Nicole！",
  "20.p1.0": "大食欲饿了！",
  "20.p2.0": "主厨！谁也不许未经允许用我的权限！Pancho，我从飞机上帮你！",
  "20.p2.1": "管理员？！不可能！",
  "20.p2d.0": "看我留下了什么，Manda！PANCHITA.EXE！",
  "20.p2d.1": "Panchita？！",
  "20.p2d.2": "……Pan……cho……救……我……",
  "20.end.0": "不……我……烹饪……世界……",
  "20.end.1": "再也不会了。根钥匙：关机吧，主厨！",
  "20.end.2": "你做到了！大食欲停下来了！",
  "20.end.3": "我们做到了，Panchita。我是说……Nicole。",
  "20.end.4": "你做到了，{name}！我就知道你行！",
  "20.end.5": "我叫 Pancho。……不过你可以叫我 {name}。朋友。",
  "20.end.6": "回家吧！还有套餐等着吃呢！",
  "20.endd.0": "不……我……烹饪……世界……",
  "20.endd.1": "谢谢你……Pancho……这一次……你试过了。",
  "20.endd.2": "Panchita！等等！我能把你救出来！",
  "20.endd.3": "太晚了……但现在我知道真相了。我不再恨你了……再见，Manda。",
  "20.endd.4": "……我叫 Pancho。再见，Nicole。根钥匙：关机吧，主厨。",
  "20.endd.5": "{name}……",
  "20.endd.6": "没关系，导师。你可以叫我 {name}。……谢谢你没丢下我一个人，朋友。",
  "endGood.title": "结局：我叫 Pancho",
  "endGood.0": "主厨永远关机了。大食欲不再吞食，天空中的咬痕一个接一个地合上了。",
  "endGood.1": "有了根钥匙，Fooworld 的每个居民都可以选择：想起自己在国家球世界的生活，或者保持原样。很多人选择了想起来……然后保持原样。说到底，Fooworld 也没那么糟。",
  "endGood.2": "Panchita 还是当 Panchita。她在 McChulin's 旁边开了个摊子：“Nicole 的潘丘克”。现在整个 Fooworld 都知道潘丘克是什么了。",
  "endGood.3": "Pancho 想起了自己以前叫 Manda。但每当有人问他的名字，他总是回答同一句话：“我叫 Pancho”。",
  "endGood.4": "嗯……几乎总是。导师先生搬到了 Fooworld，还是叫他 {name}。而 Pancho 现在已经不介意了。",
  "endBad.title": "结局：纸飞机",
  "endBad.0": "主厨关机了，Panchita.EXE 也随之化作闪亮的像素消散了。",
  "endBad.1": "Fooworld 得救了。但根钥匙在使用时碎掉了：谁也没能找回记忆。",
  "endBad.2": "Pancho、Hamburguer 和导师先生回到了街区。他们吃素食人类。他们去 McChulin's。生活继续着。",
  "endBad.3": "但有时，在梦里，Pancho 会听见一个名字：Nicole。而时不时地，会有一架纸飞机出现在他家门口。",
  "end_good": "完！",
  "end_bad": "完……",
  "end_thanks": "感谢游玩！",
  "end_hint": "如果这一次你不让她掉下去呢？（重玩第 10 关）",
  "n_papas": "Don Papo",
  "n_dona": "Donatella",
  "n_gaseosa": "Gaspar",
  "P.hbprick.0": "哎哟！有什么扎了我一下……我……好……困……",
  "q1_0": "然后呢？我就永远站在这儿？",
  "q1_1": "我讨厌这个游戏。讨厌这些颜色。讨厌导师。",
  "q1_2": "Hamburguer……撑住。我来了。大概吧。",
  "q2_0": "好吧……导师也没那么让人受不了。",
  "q2_1": "那架纸飞机……里面坐的是谁？",
  "q2_2": "我站着不动，游戏会暂停吗？不会。当然不会。",
  "q3_0": "Fooworld……再撑一会儿。",
  "q3_1": "这一切都是我做的？我不知道该骄傲还是该愧疚。",
  "q3_2": "Hamburguer，别再盯着套餐看了。",
  "q4_0": "我们一定能做到。大家一起。",
  "q4_1": "我叫 Pancho。我为此骄傲。",
  "q4_2": "谢谢你没有放弃我……不管你是谁，正在操控我的那个人。",
