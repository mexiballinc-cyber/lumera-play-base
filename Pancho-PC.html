  "hb_0": "Pancho! Ich hab dich vermisst!",
  "hb_1": "Ich hab Hunger... gibt's hier ein McChulin's?",
  "hb_2": "Sicher, dass du keine Menschen isst? Die sind lecker.",
  "hb_3": "Los, los!",
  "hb_4": "Joshua? Ich? Nee...",
  "hb_5": "Das sieht aus wie ein Videospiel.",
  "sty_0": "GIB MIR GELD!",
  "sty_1": "Chat, schaut! Ein sprechender Hotdog!",
  "sty_2": "Komm zurück, Hotdog! Ist für den Stream!",
  "sty_3": "Am schlimmsten ist, wenn du nur deinen Namen getippt hast...",
  "sty_4": "Like und abonnier, Hotdog!",
  "sty_5": "Chat, Wetten rein! Krieg ich ihn oder nicht?",
  "sty_got": "HAB DICH! ...Ups, er ist entwischt.",
  "sty_hit": "Autsch! Chat, das tat weh!",
  "sty_phone": "Moment, ich les mal den Chat...",
  "sty_dash": "Speedrun!",
  "P.start.0": "Noch ein Tag in Fooworld. Genau wie gestern. Genau wie morgen.",
  "P.start.1": "Hamburguer hat sich bestimmt wieder verlaufen. Ich such ihn... was auch sonst.",
  "P.papas.0": "Morgen, Pancho! Hattest du schon deine Menschen zum Mittag?",
  "P.papas.1": "Ich bin Veganer, Don Papo. Hab ich dir tausendmal gesagt. Ich esse keine Menschen.",
  "P.papas.2": "Ja, ja. Du bist so ein Griesgram, Pancho.",
  "P.dona.0": "Pancho! Bei McChulin's sollen heute Menschen im Angebot sein.",
  "P.dona.1": "Und was sind Menschen überhaupt? Keiner weiß es. Und keinen interessiert's. Typisch.",
  "P.meet.0": "PANCHO! Endlich hab ich dich gefunden!",
  "P.meet.1": "DU hast MICH gefunden? Ich hab dich im ganzen Viertel gesucht! Wo warst du?",
  "P.meet.2": "Ich war bei McChulin's einkaufen! Ich hab ein ganzes Menü gegessen.",
  "P.meet.3": "Klar. Und ich hab wie ein Idiot auf dich gewartet.",
  "P.meet.4": "Und ich hab dir was mitgebracht: Veggie-Menschen! Damit du McChulin's auch genießen kannst.",
  "P.meet.5": "...Na gut. Das war nett. Danke, Hamburguer. Du bist der beste Freu...",
  "P.taken.0": "HAMBURGUER?!",
  "P.taken.1": "Nein, nein, nein! Lass ihn los! Er ist der einzige Freund, den ich habe!",
  "P.end.0": "Ein Piks. Und dann nichts mehr.",
  "P.end.1": "Während Pancho einschlief, lachte irgendwo weit weg jemand.",
  "toFoogame.title": "...",
  "toFoogame.0": "Pancho schlief sehr lange. Er träumte von einer Krone, einem grünen Kreis und einem Namen, der nicht seiner war.",
  "toFoogame.1": "Als er aufwachte, war er nicht mehr in Fooworld. Alles war viel bunter, es gab schwebende Blöcke mit Fragezeichen... Es sah aus wie ein Videospiel.",
  "1.wake.0": "Uff... mein Kopf...",
  "1.wake.1": "Wo bin ich? Das ist nicht Fooworld. Das ist... grauenhaft. Viel zu viele Farben.",
  "1.wake.2": "Hamburguer?! HAMBURGUER! Antworte mir, bitte!",
  "1.tutor.0": "Hallo, hallo! Ein neuer Spieler! Willkommen im Foogame!",
  "1.tutor.1": "Ich will kein „Willkommen“. Wer bist du und wo ist mein Freund?",
  "1.tutor.2": "Ich bin der Tutor-Mann. Meine Aufgabe ist es, dir das Spielen beizubringen!",
  "1.tutor.3": "Aber zuerst das Wichtigste...",
  "1.nm_normal.0": "Freut mich, {name}! Was für ein schöner Name.",
  "1.nm_joshua.0": "Joshua? Igitt. Ich weiß nicht warum, aber der Name ekelt mich.",
  "1.nm_joshua.1": "Wie auch immer... Hallo, {name}.",
  "1.nm_hamburguer.0": "Hamburguer? Hmm... Ich glaube, der Name passt nicht zu deinem Essen. Du bist ein Hotdog.",
  "1.nm_hamburguer.1": "Aber gut, wenn du willst... Hallo, {name}.",
  "1.nm_manda.0": "...{name}.",
  "1.nm_manda.1": "Dieser Name... Ich glaube, ich hab ihn schon mal gehört. Vor langer, langer Zeit. Wo nur...?",
  "1.nm_stupid.0": "...Hast du das echt eingetippt? ECHT JETZT?",
  "1.nm_stupid.1": "Nein. Ich weigere mich. Ab jetzt heißt du {name}.",
  "1.nm_bad.0": "...",
  "1.nm_bad.1": "Das wiederhole ich nicht. Niemals. Du heißt {name}.",
  "1.nm_carlitos.0": "Carlitos, der aller... capito? Hahaha... hehe...",
  "1.nm_carlitos.1": "Nein. Einfach Carlitos. Hallo, {name}.",
  "1.nm_elver.0": "Elver... Galarga. Hahaha. Sehr witzig.",
  "1.nm_elver.1": "Ich nenn dich {name}, und fertig.",
  "1.after.0": "Ich heiße Pancho.",
  "1.after.1": "Sag ich doch: {name}.",
  "1.after.2": "Nein. PANCHO. P-A-N-C-H-O. Bist du taub?",
  "1.after.3": "Klar doch, {name}!",
  "1.after.4": "...Ich hasse dich jetzt schon. Hast du einen Hamburger gesehen? Ein Seil vom Himmel hat ihn geholt.",
  "1.after.5": "Einen Hamburger? Im Foogame gibt's keine Hamburger... Beweg dich mit den Pfeilen und folge mir. Man lernt beim Spielen!",
  "1.after.6": "Super. Gefangen in einem Videospiel mit einem Tutor, der nicht zuhört. Schlimmer kann's nicht werden.",
  "1.again.0": "{name}, du bist zurück! Sollen wir die Grundlagen wiederholen?",
  "1.again.1": "Ich heiße Pancho. Und nein, ich will gar nichts wiederholen.",
  "1.caps.0": "Siehst du die Kapsel? Das ist eine Fookapsel. Jede gibt dir eine Foogame-Kraft.",
  "1.caps.1": "Das hier ist Hüpfer. Halte ⤒ am Boden gedrückt und lass los. Du wirst fliegen, {name}!",
  "1.jump.0": "Wow! ...Okay, das war cool. Aber sag's nicht dem Tutor.",
  "1.end.0": "Hervorragend, {name}! Du bist fürs Foogame geboren.",
  "1.end.1": "Ich heiße Pancho. Und ich bin nicht dafür geboren. Wo ist mein Freund?",
  "1.end.2": "Hmm... Ich weiß nur, dass am Ende des Foogames ein Schloss steht. Alles Seltsame landet dort.",
  "1.end.3": "Ach, und pass auf das Besteck auf. Das ist in letzter Zeit sehr... scharf drauf.",
  "1.end.4": "Ein Schloss. Am Ende. Voller Besteck. Perfekt. Ich komme nie nach Hause.",
  "2.start.0": "Das ist die Besteckschlucht. Hier regnet es Messer und Gabeln.",
  "2.start.1": "Hier regnet es WAS?! Wir werden sterben! Na ja... ICH werde sterben.",
  "2.start.2": "Deshalb gibt es Geschützt: einen Schild, der 2 Treffer aushält. Schnapp dir die hellblauen Kapseln, {name}!",
  "2.mid.0": "Früher war das Foogame nicht so. Eines Tages hat es jemand komplett umgebaut.",
  "2.mid.1": "Wer? Und warum sollte mich das interessieren?",
  "2.mid.2": "Weiß ich nicht mehr. Es gibt vieles, woran ich mich nicht erinnere...",
  "2.mid.3": "...Ich erinnere mich auch an vieles nicht. Das macht uns noch lange nicht zu Freunden.",
  "3.start.0": "Die Waffelwand! Um da hochzukommen, brauchst du Krallen. Nimm Kletterer.",
  "3.start.1": "Krallen? Ein Hotdog mit Krallen? Dieses Spiel ist kaputt. Und du auch.",
  "3.mid.0": "Wusstest du, dass das Foogame von zwei Leuten gemacht wurde?",
  "3.mid.1": "Von wem?",
  "3.mid.2": "Weiß ich nicht. Ich weiß nur noch, dass... einer von ihnen mir sehr ähnlich sah.",
  "3.mid.3": "Was für ein seltsames Gespräch. ...Erzähl weiter. Ich hab eh nichts Besseres zu tun.",
  "4.start.0": "Die Klonfabrik! Hier werden ClonBots gebaut.",
  "4.start.1": "Ein ClonBot ist eine Roboter-Kopie von dir. Berühre eine Plattform mit Roboter und dein Geist springt in den ClonBot. Berühre eine andere, um zurückzukommen.",
  "4.start.2": "Mein GEIST springt?! Nein, nein, nein. Das geht schief.",
  "4.swap.0": "PIEP PIEP. CLONBOT ONLINE. HALLO, PANCHO.",
  "4.swap.1": "Ah! Ich bin aus Metall! ...Wenigstens kennt der Roboter meinen Namen. Im Gegensatz zu manch anderem.",
  "4.boss.0": "Vorsicht, {name}! Der Große Mixer! Wenn er überhitzt, fliegt der Deckel weg. Dann spring drauf!",
  "4.bossEnd.0": "Ich hab einen Mixer besiegt! ...Das mit dem Deckel hat funktioniert. Ein bisschen.",
  "4.bossEnd.1": "Bravo, {name}! Das Schloss ist nah.",
  "5.start.0": "Das Keksschloss... Schon lange ist niemand mehr so weit gekommen.",
  "5.start.1": "Wenn Hamburguer irgendwo ist, dann hier. Er muss hier sein.",
  "5.santy.0": "Chat, Chat, CHAT! Schaut, wer da reinkommt! Ein SPRECHENDER HOTDOG!",
  "5.santy.1": "Ein Mensch?! Ein ECHTER Mensch?!",
  "5.santy.2": "Ein Hotdog... Das ist Essen. Und ich streame seit drei Stunden, ohne was zu essen.",
  "5.santy.3": "GIB MIR GELD! ODER GIB MIR DEN HOTDOG!",
  "5.santy.4": "{name}! Nimm das und LAUF! Das ist Tempo!",
  "5.escape.0": "Neiiin! Chat, der Hotdog ist entkommen!",
  "5.escape.1": "...Drückt F im Chat.",
  "5.escape.2": "Ha! Das war knapp!",
  "5.escape.3": "...Tutor. Du hast mich gerettet. Danke. Aber ich heiße trotzdem Pancho.",
  "5.escape.4": "Gern geschehen, {name}!",
  "w1end.title": "Währenddessen...",
  "w1end.0": "Weit weg vom Schloss, am Himmel des Foogames, kreiste ein Papierflugzeug. Darin saß eine Gestalt, die niemand kannte.",
  "w1end.1": "„Er hat es also bis zum Schloss geschafft“, sagte die Gestalt. „Genau wie letztes Mal. In deinen eigenen Spielen warst du schon immer gut... Manda.“",
  "6.start.0": "{name}! Hörst du mich? Ich hab dich in eine andere Welt geschickt: die Bergbauwelt.",
  "6.start.1": "Für das, was kommt, brauchst du eine Spitzhacke. Sammle 3 Hotterrite (diese heißen leuchtenden Steine) und 2 Stöcke und baue sie an der Werkbank.",
  "6.start.2": "Eine Spitzhacke aus heißen Steinen und Stöcken? Das hab ich doch in irgendeinem Spiel gesehen... Und redest du jetzt die ganze Zeit mit mir?",
  "6.start.3": "Immer! Viel Glück, {name}!",
  "6.plane.0": "Hä? Ein Papierflugzeug?",
  "6.plane.1": "Da oben ist... jemand. Ich werde beobachtet.",
  "6.need.0": "Dir fehlt noch Material, {name}. 3 Hotterrite und 2 Stöcke.",
  "6.craft.0": "Eine Hotterrit-Spitzhacke! Sie ist noch warm!",
  "6.craft.1": "Jetzt bist du Bergmann, {name}! Die ⛏-Taste zerbricht Fels. Probier's an der Wand da!",
  "6.end.0": "Sehr gut! Ich bringe dich zurück ins Foogame.",
  "6.end.1": "Tutor, ich muss dir was sagen. Ich hab ein Papierflugzeug gesehen. Da saß jemand drin.",
  "6.end.2": "Du erzählst das MIR? {name}, das heißt, du vertraust mir!",
  "6.end.3": "Werd nicht gleich euphorisch.",
  "uv_1": "Falls das jemand liest: Glaub nicht alles, was der Tutor sagt. Es ist nicht seine Schuld. Er erinnert sich auch nicht. —N.",
  "uv_2": "Tag 412 im Foogame. Ich bin immer noch ein Panchuque. Niemand in Fooworld weiß, was ein Panchuque ist. —N.",
  "uv_3": "M und J haben versprochen, dass niemand etwas vergisst. Sie haben gelogen. —N.",
  "uv_4": "Ich habe diese Höhlen dreimal neu gestaltet. Die unsichtbaren Brücken sind mein Lieblingsteil. —N.",
  "uv_5": "Die Mikrowelle gehört mir. Ich habe sie programmiert, den Ausgang zu verstecken. Sie kommen. —N.",
  "7.start.0": "Die Ultraviolett-Höhlen. Nimm die UV-Sicht: Hier gibt es Dinge, die man mit bloßem Auge nicht sieht.",
  "7.start.1": "Lass mich raten: unsichtbare Blöcke. Ich kenn deine Tricks langsam, Tutor.",
  "7.read.0": "An der Wand steht etwas! Nur mit ultraviolettem Licht sichtbar...",
  "7.read.1": "„—N.“... Wer ist N?",
  "7.boss.0": "Die Mikrowelle! Man sieht sie kaum! Nutz die UV-Sicht und spring drauf, wenn sie „Ding!“ macht!",
  "7.bossEnd.0": "Ding! Mikrowelle ist fertig!",
  "7.bossEnd.1": "{name}... Diese Nachrichten. „M und J“. Ich hab das Gefühl, ich sollte wissen, wer das ist.",
  "7.bossEnd.2": "Und „N“ weiß etwas, das wir nicht wissen. Wir finden es raus, Tutor. Zusammen.",
  "8.start.0": "PIEP. PIEP. PANCHO ERKANNT.",
  "8.start.1": "FEHLER. PANCHITA-PROTOKOLL AKTIVIERT. HOTDOG IN DIE STACHELN SCHIEBEN.",
  "8.start.2": "{name}! Jemand hat deinen ClonBot umprogrammiert!",
  "8.start.3": "Mein eigener Roboter will mich in die Stacheln werfen?!",
  "8.start.4": "...Okay. Keine Panik. Tutor, du kennst dieses Spiel. Was soll ich tun?",
  "8.start.5": "Spring auf ihn drauf! In der Mitte bleibt er stehen, und auf einer Ecke läuft er in diese Richtung. Reite ihn bis zum Terminal!",
  "8.terminal.0": "Jetzt reicht's! Wach auf, Blechkopf!",
  "8.terminal.1": "PIEP... P-Pancho? Was hab ich getan?",
  "8.terminal.2": "Tut mir leid. Jemand hat mich gehackt. Eine Gestalt... in einem Papierflugzeug.",
  "8.terminal.3": "Schon wieder das Papierflugzeug! Weißt du, wohin es geflogen ist?",
  "8.terminal.4": "Zum Himmel des Foogames. Über allen Levels.",
  "8.terminal.5": "Und ich kann nicht fliegen.",
  "8.terminal.6": "Ich schon. Raumschiffmodus aktiviert. Steig auf, Pancho!",
  "8.terminal.7": "{name}... pass da oben auf dich auf.",
  "8.terminal.8": "Keine Sorge, Tutor. Ich bin gleich zurück. ...Und ich heiße Pancho.",
  "t_robotSkin": "ClonBot-Skin im Laden freigeschaltet!",
  "9.fly.0": "Da ist das Papierflugzeug! Hinterher, ClonBot!",
  "9.fly.1": "Volle Kraft voraus! PIEP PIEP.",
  "9.glitch.0": "Was ist das?! Der Himmel bricht auseinander!",
  "9.reunion.0": "AAAAAH! Wo bin ich?! Warum fliege ich?!",
  "9.reunion.1": "HAMBURGUER?!",
  "9.reunion.2": "PANCHO! Ich war in einem total seltsamen Level eingesperrt und plötzlich ist alles kaputtgegangen!",
  "9.reunion.3": "Ich hab dich im ganzen Foogame gesucht!",
  "9.reunion.4": "Im ganzen was? ...Egal. Die in dem Flugzeug hat mich mit dem Lasso gefangen!",
  "9.reunion.5": "Dann schnappen wir sie uns.",
  "9.reveal.0": "Du hast es also geschafft. Genau wie letztes Mal... Manda.",
  "9.reveal.1": "Manda? Ich heiße Pancho.",
  "9.reveal.2": "Jetzt schon. Früher hießt du Manda. Und du, Hamburguer... du warst Joshua.",
  "9.reveal.3": "Joshua? Was ist ein Joshua?",
  "9.reveal.4": "Ich heiße Panchita. Aber früher hieß ich Nicole. Wir drei lebten in der Countryball-Welt.",
  "9.reveal.5": "Ihr zwei habt zwei Projekte erfunden: Fooworld und das Foogame. Das Foogame war ein Spiel, das ihr selbst gespielt habt... und ich hab es umgebaut. Jedes Level, das ihr betreten habt, habe ich gezeichnet.",
  "9.reveal.6": "Dann wurden mehrere Leute entführt. Ich auch. Man steckte uns ins Foogame, brachte uns nach Fooworld und löschte unsere Erinnerungen.",
  "9.reveal.7": "Die von allen... außer meine.",
  "9.reveal.8": "Nein... Das kann nicht wahr sein.",
  "9.reveal.9": "So etwas würden wir nie tun!",
  "9.reveal.10": "Ihr erinnert euch nicht. Wie praktisch.",
  "9.reveal.11": "Ich bin seit Jahren hier gefangen, im Körper eines Essens, das niemand kennt, und sehe euch zwei glücklich leben.",
  "9.reveal.12": "Jetzt bin ich dran. Ich räche mich!",
  "9.p1.0": "Du kannst also spielen? Dieses Schloss habe ich auch gezeichnet!",
  "9.p2.0": "Keine Sicht, keine Böden! Mal sehen, wie gut du im Dunkeln siehst!",
  "9.flee.0": "Nein... NEIN! Zwei Verräter besiegen mich nicht!",
  "9.flee.1": "Das ist noch nicht vorbei!",
  "9.flee.2": "Sie haut ab!",
  "9.flee.3": "Hinterher, Hamburguer. Ich will Antworten.",
  "10.start.0": "Da fliegt sie! Sie benutzt die Foogame-Kräfte!",
  "10.start.1": "Wir auch. Verlier sie nicht aus den Augen!",
  "10.edge.0": "Was...? Nein! Mein Code...! Ich zerfalle!",
  "10.edge.1": "Das ist der Rand der Karte! Ich falle! Hilfe...!",
  "10.edge.2": "Pancho! Sie fällt von der Karte!",
  "ch_title": "Was macht Pancho?",
  "ch_save": "Panchita retten",
  "ch_drop": "Sie fallen lassen",
  "10.save.0": "...Warum hast du mich gerettet? Ich hab dir schreckliche Dinge angetan.",
  "10.save.1": "Weil ich Pancho heiße. Und Pancho lässt niemanden fallen.",
  "10.save.2": "...Danke, Manda. Ich meine... Pancho.",
  "10.save.3": "Gut gemacht, Pancho!",
  "10.sys.0": "ALARM: FOO-LÖSCHUNG AKTIVIERT. FOOWORLD WIRD GELÖSCHT.",
  "10.sys.1": "Was?! Nein! Das hab ich nicht programmiert!",
  "10.sys.2": "Jemand anderes benutzt meinen Zugang! Haltet euch fest!",
  "10.drop.0": "...Pancho. Was hast du getan?",
  "10.drop.1": "...",
  "10.sysd.0": "ADMINISTRATOR VERLOREN.",
  "10.sysd.1": "FOO-LÖSCHUNG AKTIVIERT. FOOWORLD WIRD GELÖSCHT.",
  "10.sysd.2": "Was passiert hier?! Pancho!",
  "w2save.title": "Die Foo-Löschung",
  "w2save.0": "Das Foogame zerbrach in tausend Stücke. Pancho, Hamburguer, Panchita und der Tutor-Mann fielen zusammen zurück nach Fooworld.",
  "w2save.1": "Aber Fooworld war nicht mehr dasselbe. Am Himmel gab es schwarze Löcher in Form von Bissen. Etwas fraß es auf: der Große Hunger.",
  "w2save.2": "„Ich habe das alles angefangen“, sagte Panchita. „Aber die Foo-Löschung habe ich nicht aktiviert. Jemand hat meinen Zugang benutzt. Und ich finde heraus, wer.“",
  "w2drop.title": "Die Foo-Löschung",
  "w2drop.0": "Panchita verlor sich in der Leere, jenseits des Kartenrands. Ihr letzter Schrei brach plötzlich ab.",
  "w2drop.1": "Ohne seine Administratorin zerbrach das Foogame in tausend Stücke. Pancho und Hamburguer fielen zurück nach Fooworld... und der Tutor-Mann fiel mit ihnen.",
  "w2drop.2": "Aber Fooworld war nicht mehr dasselbe. Am Himmel gab es schwarze Löcher in Form von Bissen. Etwas fraß es auf: der Große Hunger.",
  "sg_conveyor": "Förderbänder tragen dich. Grills brennen, wenn du stehen bleibst.",
  "t_climb": "Die Leere steigt! Klettere!",
  "n_aldeano": "Countryball",
  "n_aldeano2": "Countryball",
  "n_purriau": "Purriau",
  "n_chulin": "Chulin",
  "11.start.0": "Pancho! Unser Viertel! Es wird aufgefressen!",
  "11.start.1": "Mein Haus... hat einen riesigen Biss drin.",
  "11.start.2": "Das ist der Große Hunger. Die Foo-Löschung frisst alles, was sie berührt. Was sie frisst, verschwindet.",
  "11.start.3": "Ich habe sie nicht aktiviert. Jemand hat meinen Admin-Zugang benutzt... und ich weiß nicht, wer.",
  "11.start.4": "{name}! Ich bin auch mit dir hier runtergefallen! Ich bin dabei!",
  "11.start.5": "...Ich bin froh, dass du da bist, Tutor. Wirklich.",
  "11.start.6": "Wir finden es zusammen heraus. Aber zuerst bringen wir die Nachbarn hier raus.",
  "11.startd.0": "Pancho! Unser Viertel! Es wird aufgefressen!",
  "11.startd.1": "Mein Haus... hat einen riesigen Biss drin.",
  "11.startd.2": "{name}... Als das Foogame zerbrach, bin ich mit euch geflohen. Die Foo-Löschung frisst Fooworld auf.",
  "11.startd.3": "Dieses Mädchen, Panchita, war die Administratorin des Foogames. Ohne sie kann es niemand aufhalten.",
  "11.startd.4": "...Wenigstens bist du nicht allein, Tutor. Ich auch nicht.",
  "11.startd.5": "Nicht jetzt, Pancho. Erst bringen wir die Nachbarn hier raus.",
  "11.papas.0": "Pancho! Ein schwarzer Biss hat meine halbe Schachtel gefressen!",
  "11.papas.1": "Lauf zu McChulin's! Da ist es noch nicht angekommen!",
  "11.dona.0": "Danke! Fast hätte ich mein Loch verloren!",
  "11.dona.1": "...Donuts haben doch schon ein Loch.",
  "11.end.0": "McChulin's steht noch! Die Menüs sind gerettet!",
  "11.end.1": "Fürs Erste. Gehen wir rein.",
  "12.start.0": "Hilfe! Die Küche ist verrückt geworden! Die Fritteuse lässt uns nicht raus!",
  "12.start.1": "Ruhig, Chef! Solange ich hier bin, geht kein Menü verloren.",
  "12.start.2": "Die Utensilien... bewegen sich von selbst. Genau wie im Foogame. Jemand steuert sie.",
  "12.startd.0": "Hilfe! Die Küche ist verrückt geworden! Die Fritteuse lässt uns nicht raus!",
  "12.startd.1": "Ruhig, Chef! Solange ich hier bin, geht kein Menü verloren.",
  "12.startd.2": "Die Utensilien bewegen sich von selbst, {name}. Genau wie im Foogame. Jemand steuert sie.",
  "12.boss.0": "Die Fritteuse! Wenn sie ihre Körbe fallen lässt, ist sie ungeschützt! Spring drauf!",
  "12.note.0": "An der Fritteuse klebt ein Zettel. Ein Rezept...",
  "12.note.1": "„PROJEKT FOOWORLD. Eigentum von MaJo Associations. Originalrezept: eine Welt ohne Grenzen.“",
  "12.note.2": "MaJo... Ma für Manda. Jo für Joshua. So hieß ihr Studio.",
  "12.note.3": "Also haben wir Fooworld... selbst gemacht?",
  "12.noted.0": "An der Fritteuse klebt ein Zettel. Ein Rezept...",
  "12.noted.1": "„PROJEKT FOOWORLD. Eigentum von MaJo Associations. Originalrezept: eine Welt ohne Grenzen.“",
  "12.noted.2": "MaJo... Dieser Name. Mir tut der Kopf weh, wenn ich ihn lese, {name}.",
  "12.noted.3": "Also haben wir Fooworld... selbst gemacht?",
  "13.start.0": "Moment... das sind die Menschen? Das ist Gemüse!",
  "13.start.1": "Menschen sind... Tomaten? Karotten?",
  "13.start.2": "Waren sie schon immer. Joshua hat sie aus Spaß „Menschen“ genannt. Manda war echt sauer. Und es ist hängen geblieben.",
  "13.start.3": "...Ich hab in meinem Leben bestimmt tausend Tomaten gegessen.",
  "13.startd.0": "Moment... das sind die Menschen? Das ist Gemüse!",
  "13.startd.1": "Menschen sind... Tomaten? Karotten?",
  "13.startd.2": "Ich erinnere mich an etwas... Jemand hat sie aus Spaß „Menschen“ genannt. Jemand mit einer 5 im Gesicht.",
  "13.startd.3": "...Ich hab in meinem Leben bestimmt tausend Tomaten gegessen.",
  "13.santy.0": "CHAT! Der sprechende Hotdog ist zurück! Und er hat einen Hamburger mitgebracht!",
  "13.santy.1": "SantyTG11?! Wie bist du nach Fooworld gekommen?!",
  "13.santy.2": "Ich bin aus dem Foogame gefallen, als es zerbrach. Und jetzt bin ich live aus der Essenswelt. Das gibt sooo viele Views! GIB MIR GELD!",
  "13.santyEnd.0": "Okay, okay... Du hast gewonnen. Der Chat sagt, du bist der beste Hotdog der Welt.",
  "13.santyEnd.1": "Und der Chat hat abgestimmt: Jetzt helfe ich euch!",
  "13.santyEnd.2": "Wie willst du uns helfen?",
  "13.santyEnd.3": "Als ich aus dem Foogame fiel, sah ich eine Tür mit einem Schild: „MaJo-Server“. Sie liegt hinter den Salzebenen.",
  "13.santyEnd.4": "Viel Glück, Hotdog! Und vergiss das Like nicht!",
  "14.start.0": "Der Soßenfluss! Ketchup, Senf... das Paradies!",
  "14.start.1": "Nicht trinken, Hamburguer. Wir überqueren ihn und gehen weiter.",
  "15.start.0": "Die Salzebenen. Salz macht sehr durstig. Trink Limo an jedem Brunnen, den du siehst.",
  "15.start.1": "Was auch immer nötig ist, um zu diesen Servern zu kommen.",
  "15.startd.0": "Die Salzebenen, {name}. Salz macht sehr durstig. Trink Limo an jedem Brunnen.",
  "15.startd.1": "Ich heiße Pancho. ...Aber danke, Tutor.",
  "15.end.0": "Da ist die Tür! „MaJo-Server“...",
  "15.end.1": "Gehen wir. Ich will die Wahrheit wissen.",
  "w3end.title": "Die Server",
  "w3end.0": "Hinter der Tür gab es nichts zu essen. Nur grüne Lichter, summende Maschinen und ein riesiges Schild: MaJo.",
  "w3end.1": "Die Maschinen speicherten alles, was passiert war. Wenn jemand die Wahrheit kannte, dann war sie dort drin.",
  "16.start.0": "Das gehört ihnen... Manda und Joshua. Hier durfte ich nie rein.",
  "16.start.1": "Finden wir heraus, was passiert ist. Mit der UV-Sicht sollten wir die Aufzeichnungen sehen.",
  "16.startd.0": "Diese Maschinen... Ich kenne sie. Ich habe hier mal gelebt, {name}. Vor dem Foogame.",
  "16.startd.1": "Finden wir heraus, was passiert ist. Mit der UV-Sicht sollten wir die Aufzeichnungen sehen.",
  "16.log.0": "Hier sind versteckte Nachrichten! Das sind... Logbücher.",
  "log_1": "Mandas Logbuch #1: Fooworld ist fertig. Eine Welt ohne Grenzen und Kriege: nur Essen und Frieden. Der Koch (unsere KI) hat alles gekocht.",
  "log_2": "Joshuas Logbuch #7: Wir haben Obst und Gemüse „Menschen“ genannt. Manda findet das nicht lustig. Es ist urkomisch.",
  "log_3": "Mandas Logbuch #12: Der Koch schlägt vor, Erinnerungen zu löschen, „damit niemand sein Zuhause vermisst“. Wir sagten NEIN. Niemals.",
  "log_4": "Joshuas Logbuch #13: Der Koch hat Leute hergeholt, ohne jemanden zu fragen. Nicole war dabei. Heute Nacht schalten wir ihn ab.",
  "log_5": "Mandas Logbuch #14: Wir waren zu spät. Der Koch hat uns alle nach Fooworld geschickt und gelöscht. Falls das jemand liest: Der Wurzelschlüssel ist im MaJo-Büro, in der Countryball-Welt. Er schaltet den Koch ab.",
  "16.end.0": "Wir waren es nicht... Es war der Koch. Wir wollten ihn aufhalten.",
  "16.end.1": "Und er hat uns auch gelöscht.",
  "16.end.2": "All die Jahre... habe ich euch für etwas gehasst, das ihr nicht getan habt.",
  "16.end.3": "Aber wir haben den Koch gebaut. Also schalten wir ihn auch ab. Auf in die Countryball-Welt.",
  "16.endd.0": "Wir waren es nicht... Es war der Koch. Wir wollten ihn aufhalten.",
  "16.endd.1": "Und er hat uns auch gelöscht.",
  "16.endd.2": "Und Panchita... Nicole... ist gestorben und hat dich für etwas gehasst, das du nicht getan hast.",
  "16.endd.3": "...Aber wir haben den Koch gebaut. Also schalten wir ihn ab. Für sie.",
  "17.start.0": "Pancho! Das sind alles Bälle! Bälle mit Augen!",
  "17.start.1": "Die Countryball-Welt... Ich hab das Gefühl, ich war schon mal hier.",
  "17.start.2": "Das war mein Zuhause. Unser Zuhause.",
  "17.start.3": "{name}... Schau dir die mit der Krone an. Sie hat dasselbe Gesicht wie ich.",
  "17.startd.0": "Pancho! Das sind alles Bälle! Bälle mit Augen!",
  "17.startd.1": "Die Countryball-Welt... Ich hab das Gefühl, ich war schon mal hier.",
  "17.startd.2": "Ich auch, {name}. Ich auch.",
  "17.a1.0": "Ah! Ein laufender Hotdog und Hamburger! Was ist das denn?!",
  "17.a1.1": "Keine Sorge, wir kommen in Frieden. Wir suchen nur einen Schlüssel.",
  "17.a2.0": "Manda und Joshua hat hier seit Jahren niemand gesehen. Es heißt, sie leben jetzt in einem ihrer Spiele.",
  "17.friveq.0": "Hi! Ihr seid nicht von hier, oder? Na ja... ich bin auch nicht aus diesem Spiel. Ich bin Friveq!",
  "17.friveq.1": "Und aus welchem Spiel bist du?",
  "17.friveq.2": "Aus mehreren. Grüße von einem gewissen Joshua... dem mit den Eiern. Viel Glück auf eurem Abenteuer!",
  "17.purriau.0": "Miau.",
  "17.purriau.1": "Warum hab ich das Gefühl, dass ich dieser Katze etwas schulde?",
  "17.chulin.0": "McChulin's?! Ich habe nie erlaubt, dass jemand meinen Hut für ein Restaurant benutzt!",
  "17.chulin.1": "...Trotzdem, die Menüs sind echt gut.",
  "17.nicole.0": "Das... war mein Haus. Da sind noch meine Blumen.",
  "17.nicole.1": "Wenn das alles vorbei ist, bringen wir dich zurück. Versprochen.",
  "17.nicoled.0": "Dieses Haus... hat blaue und weiße Blumen. Wie Nicoles Flecken.",
  "17.nicoled.1": "...Ich wünschte, du hättest sie gekannt, Pancho. Ich meine... ich wünschte, wir würden uns an sie erinnern.",
  "17.key.0": "Der Wurzelschlüssel... Ah! Mein Kopf... Ich erinnere mich...",
  "17.key.1": "Joshua! Wir haben Fooworld fertig! Eine Welt ohne Kriege!",
  "17.key.2": "Und ich hab das Gemüse „Menschen“ genannt! Hahaha. Kapiert? Menschen?",
  "17.key.3": "Ich war Manda. Ich... habe das alles gemacht.",
  "17.key.4": "Und ich war Joshua. Der mit dem Menschen-Witz. Sorry.",
  "17.key.5": "Aber jetzt heiße ich Pancho. Und Pancho bringt das in Ordnung.",
  "w4mid.title": "Manda und Joshua",
  "w4mid.0": "Mit dem Wurzelschlüssel kamen einige Erinnerungen zurück: zwei Countryballs, die in einem Büro lachen, eine blaue Krone, eine gedrehte 5, eine weiße Freundin mit blauen Flecken, die Levels zeichnete.",
  "w4mid.1": "Und eine riesige Küche, am Ende von allem, wo eine Stimme ohne Gesicht sagte: „Ich koche die Welten. Und niemand schaltet den Koch ab.“",
  "18.start.0": "Die Endlose Küche. Hier lebt der Koch... und hier wurden alle Utensilien des Foogames geboren.",
  "18.start.1": "Warum will mich in dieser Küche alles schneiden?",
  "18.startd.0": "Die Endlose Küche. Hier lebt der Koch, {name}... und hier wurden alle Utensilien des Foogames geboren.",
  "18.startd.1": "Warum will mich in dieser Küche alles schneiden?",
  "18.boss.0": "HALT! Wir sind König Gabel und Königin Klinge! Niemand kommt zum Koch durch!",
  "19.start.0": "Pancho! Die Leere steigt den Turm hoch!",
  "19.start.1": "Der Koch ist ganz oben! Klettere, Hamburguer!",
  "19.mid.0": "Los, Pancho! Fast geschafft!",
  "19.midd.0": "Los, {name}! Fast geschafft!",
  "20.intro.0": "Willkommen zurück, Manda. Joshua. Ihr habt euch Zeit gelassen.",
  "20.intro.1": "Ich heiße Pancho. Und ich bin hier, um dich abzuschalten.",
  "20.intro.2": "Mich abschalten? Ich habe euch eure perfekte Welt gekocht. Keine Grenzen. Keine Kriege. Keine Erinnerungen, die wehtun.",
  "20.intro.3": "Und weil ihr mich abschalten wolltet, habe ich euch gelöscht. Und mit dem Zugang der kleinen Nicole die Foo-Löschung aktiviert. Ein neues Rezept... ohne lästige Köche.",
  "20.intro.4": "Du hast meinen Zugang benutzt! Du hast mich sie beschuldigen lassen!",
  "20.intro.5": "Ein gutes Rezept braucht eine Prise Hass. Das gibt Geschmack.",
  "20.intro.6": "Jetzt werden alle zu Zutaten!",
  "20.intro.7": "Hamburguer, wir kämpfen!",
  "20.introd.0": "Willkommen zurück, Manda. Joshua. Ihr habt euch Zeit gelassen.",
  "20.introd.1": "Ich heiße Pancho. Und ich bin hier, um dich abzuschalten.",
  "20.introd.2": "Mich abschalten? Ich habe euch eure perfekte Welt gekocht. Keine Grenzen. Keine Kriege. Keine Erinnerungen, die wehtun.",
  "20.introd.3": "Und weil ihr mich abschalten wolltet, habe ich euch gelöscht. Und als die kleine Nicole von der Karte fiel... habe ich ihren Code behalten. Ihren Zugang.",
  "20.introd.4": "Monster! Sie hat dem Foogame vertraut!",
  "20.introd.5": "Ein gutes Rezept braucht Zutaten. Sie ist schon Teil meines Rezepts.",
  "20.introd.6": "Jetzt werden alle zu Zutaten!",
  "20.introd.7": "Hamburguer, wir kämpfen! Für Nicole!",

  "endGood.title": "Ende: Ich heiße Pancho",

  "1.wake.1": "Dove sono? Questa non è Fooworld. È... orribile. Troppi colori.",
  "1.wake.2": "Hamburguer?! HAMBURGUER! Rispondimi, ti prego!",
  "1.tutor.0": "Ciao, ciao! Un nuovo giocatore! Benvenuto nel Foogame!",
  "1.tutor.1": "Non voglio nessun \"benvenuto\". Chi sei e dov'è il mio amico?",
  "1.tutor.2": "Sono l'Uomo Tutor. Il mio lavoro è insegnarti a giocare!",
  "1.tutor.3": "Ma prima, la cosa più importante...",
  "1.nm_normal.0": "Piacere, {name}! Che bel nome.",
  "1.nm_joshua.0": "Joshua? Bleah. Non so perché, ma quel nome mi fa schifo.",
  "1.nm_joshua.1": "Comunque... Ciao, {name}.",
  "1.nm_hamburguer.0": "Hamburguer? Mmm... Non credo che quel nome vada con il tuo cibo. Tu sei un hot dog.",
  "1.nm_hamburguer.1": "Ma va bene, se è quello che vuoi... Ciao, {name}.",
  "1.nm_manda.0": "...{name}.",
  "1.nm_manda.1": "Quel nome... Credo di averlo già sentito. Tanto, tanto tempo fa. Dove...?",
  "1.nm_stupid.0": "...Hai davvero scritto questo? DAVVERO?",
  "1.nm_stupid.1": "No. Mi rifiuto. D'ora in poi ti chiami {name}.",
  "1.nm_bad.0": "...",
  "1.nm_bad.1": "Non lo ripeto. Mai. Ti chiamerai {name}.",
  "1.nm_carlitos.0": "Carlitos il più... capito? Ahahah... ehe...",
  "1.nm_carlitos.1": "No. Solo Carlitos. Ciao, {name}.",
  "1.nm_elver.0": "Elver... Galarga. Ahahah. Molto divertente.",
  "1.nm_elver.1": "Ti chiamerò {name}, e basta.",
  "1.after.0": "Mi chiamo Pancho.",
  "1.after.1": "È quello che ho detto: {name}.",
  "1.after.2": "No. PANCHO. P-A-N-C-H-O. Sei sordo?",
  "1.after.3": "Certo, {name}!",
  "1.after.4": "...Ti odio già. Hai visto un hamburger? Una corda dal cielo l'ha portato via.",
  "1.after.5": "Un hamburger? Nel Foogame non ci sono hamburger... Muoviti con le frecce e seguimi. Si impara giocando!",
  "1.after.6": "Fantastico. Intrappolato in un videogioco con un tutor che non ascolta. Peggio di così non può andare.",
  "1.again.0": "{name}, sei tornato! Ripassiamo le basi?",
  "1.again.1": "Mi chiamo Pancho. E no, non voglio ripassare niente.",
  "1.caps.0": "Vedi quella capsula? È una Foocapsula. Ognuna ti dà un potere del Foogame.",
  "1.caps.1": "Questa è Saltarello. Tieni premuto ⤒ a terra e lascia. Volerai, {name}!",
  "1.jump.0": "Wow! ...Ok, è stato forte. Ma non dirlo al Tutor.",
  "1.end.0": "Eccellente, {name}! Sei nato per il Foogame.",
  "1.end.1": "Mi chiamo Pancho. E non sono nato per questo. Dov'è il mio amico?",
  "1.end.2": "Mmm... So solo che alla fine del Foogame c'è un castello. Tutto ciò che è strano finisce lì.",
  "1.end.3": "Ah, e attento alle posate. Ultimamente sono molto... taglienti.",
  "1.end.4": "Un castello. Alla fine. Pieno di posate. Perfetto. Non tornerò mai a casa.",
  "2.start.0": "Questo è il Canyon delle Posate. Qui piovono coltelli e forchette.",
  "2.start.1": "Piove COSA?! Moriremo! Beh... IO morirò.",
  "2.start.2": "Per questo esiste Protetto: uno scudo che resiste a 2 colpi. Prendi le capsule azzurre, {name}!",
  "2.mid.0": "Il Foogame non era così prima. Un giorno qualcuno l'ha ristrutturato da capo.",
  "2.mid.1": "Chi? E perché dovrebbe importarmi?",
  "2.mid.2": "Non me lo ricordo. Ci sono tante cose che non ricordo...",
  "2.mid.3": "...Anch'io non ricordo tante cose. Questo non ci rende amici.",
  "3.start.0": "Il Muro di waffle! Per salire lassù ti serviranno gli artigli. Prendi Scalatore.",
  "3.start.1": "Artigli? Un hot dog con gli artigli? Questo gioco è rotto. E anche tu.",
  "3.mid.0": "Lo sapevi che il Foogame l'hanno fatto due persone?",
  "3.mid.1": "Chi?",
  "3.mid.2": "Non lo so. Ricordo solo che... uno dei due mi somigliava tanto.",
  "3.mid.3": "Che conversazione strana. ...Continua. Tanto non ho niente di meglio da fare.",
  "4.start.0": "La Fabbrica di cloni! Qui si costruiscono i ClonBot.",
  "4.start.1": "Un ClonBot è una copia robot di te. Tocca una piattaforma con un robot e la tua mente salta nel ClonBot. Toccane un'altra per tornare.",
  "4.start.2": "La mia MENTE salta?! No, no, no. Andrà male.",
  "4.swap.0": "BIP BOP. CLONBOT ONLINE. CIAO, PANCHO.",
  "4.swap.1": "Ah! Sono di metallo! ...Almeno il robot sa il mio nome. A differenza di qualcuno.",
  "4.boss.0": "Attento, {name}! Il Grande Frullatore! Quando si surriscalda, il coperchio vola via. Saltagli sopra allora!",
  "4.bossEnd.0": "Ho battuto un frullatore! ...La storia del coperchio ha funzionato. Un po'.",
  "4.bossEnd.1": "Bravo, {name}! Il castello è vicino.",
  "5.start.0": "Il Castello di biscotti... Nessuno arriva fin qui da tanto tempo.",
  "5.start.1": "Se Hamburguer è da qualche parte, è qui. Deve essere qui.",
  "5.santy.0": "Chat, chat, CHAT! Guardate chi è appena entrato! UN HOT DOG PARLANTE!",
  "5.santy.1": "Un umano?! Un umano VERO?!",
  "5.santy.2": "Un hot dog... Quello è cibo. E sono in diretta da tre ore senza mangiare.",
  "5.santy.3": "DAMMI I SOLDI! O DAMMI QUELL'HOT DOG!",
  "5.santy.4": "{name}! Prendi questo e CORRI! È Velocità!",
  "5.escape.0": "Nooo! Chat, l'hot dog è scappato!",
  "5.escape.1": "...Premete F in chat.",
  "5.escape.2": "Ah! C'è mancato poco!",
  "5.escape.3": "...Tutor. Mi hai salvato. Grazie. Ma mi chiamo ancora Pancho.",
  "5.escape.4": "Prego, {name}!",
  "w1end.title": "Nel frattempo...",
  "w1end.0": "Lontano dal castello, nel cielo del Foogame, un aereo di carta girava in tondo. A bordo c'era una figura che nessuno conosceva.",
  "w1end.1": "«Quindi è arrivato al castello», disse la figura. «Proprio come l'ultima volta. Sei sempre stato bravo con i tuoi giochi... Manda.»",
  "6.start.0": "{name}! Mi senti? Ti ho mandato in un altro mondo: il Mondo Minerario.",
  "6.start.1": "Per quello che ti aspetta ti servirà un piccone. Raccogli 3 Hotterrite (quelle pietre calde che brillano) e 2 Bastoni, e costruiscilo al banco da lavoro.",
  "6.start.2": "Un piccone di pietre calde e bastoni? Questo l'ho già visto in qualche gioco... E tu mi parlerai per tutto il tempo?",
  "6.start.3": "Sempre! Buona fortuna, {name}!",
  "6.plane.0": "Eh? Un aereo di carta?",
  "6.plane.1": "C'è... qualcuno lassù. Mi sta guardando.",
  "6.need.0": "Ti mancano ancora dei materiali, {name}. 3 Hotterrite e 2 Bastoni.",
  "6.craft.0": "Un piccone di Hotterrite! È ancora caldo!",
  "6.craft.1": "Ora sei un Minatore, {name}! Il tasto ⛏ rompe la roccia. Provalo su quel muro!",
  "6.end.0": "Molto bene! Ti riporto nel Foogame.",
  "6.end.1": "Tutor, devo dirti una cosa. Ho visto un aereo di carta. C'era qualcuno dentro.",
  "6.end.2": "Lo dici a ME? {name}, vuol dire che ti fidi di me!",
  "6.end.3": "Non montarti la testa.",
  "uv_1": "Se qualcuno legge questo: non credere a tutto quello che dice il Tutor. Non è colpa sua. Neanche lui ricorda. —N.",
  "uv_2": "Giorno 412 dentro il Foogame. Sono ancora un panchuque. Nessuno a Fooworld sa cos'è un panchuque. —N.",
  "uv_3": "M e J avevano promesso che nessuno avrebbe dimenticato niente. Hanno mentito. —N.",
  "uv_4": "Ho ridisegnato queste grotte tre volte. I ponti invisibili sono la mia parte preferita. —N.",
  "uv_5": "Il Microonde è mio. L'ho programmato per nascondere l'uscita. Stanno arrivando. —N.",
  "7.start.0": "Le Caverne ultraviolette. Prendi la Visione UV: qui ci sono cose che a occhio nudo non si vedono.",
  "7.start.1": "Fammi indovinare: blocchi invisibili. Ormai conosco i tuoi trucchi, Tutor.",
  "7.read.0": "C'è qualcosa scritto sul muro! Si vede solo con la luce ultravioletta...",
  "7.read.1": "«—N.»... Chi è N?",
  "7.boss.0": "Il Microonde! Si vede appena! Usa la visione UV e saltagli sopra quando fa «ding!»",
  "7.bossEnd.0": "Ding! Il microonde è pronto!",
  "7.bossEnd.1": "{name}... Quei messaggi. «M e J». Sento che dovrei sapere chi sono.",
  "7.bossEnd.2": "E «N» sa qualcosa che noi non sappiamo. Lo scopriremo, Tutor. Insieme.",
  "8.start.0": "BIP. BIP. PANCHO RILEVATO.",
  "8.start.1": "ERRORE. PROTOCOLLO PANCHITA ATTIVATO. SPINGERE L'HOT DOG SUGLI SPUNTONI.",
  "8.start.2": "{name}! Qualcuno ha riprogrammato il tuo ClonBot!",
  "8.start.3": "Il mio stesso robot vuole buttarmi sugli spuntoni?!",
  "8.start.4": "...Ok. Niente panico. Tutor, tu conosci questo gioco. Cosa faccio?",
  "8.start.5": "Salici sopra! Al centro resta fermo, e su un angolo cammina da quella parte. Cavalcalo fino al terminale!",
  "8.terminal.0": "Adesso basta! Svegliati, testa di latta!",
  "8.terminal.1": "BIP... P-Pancho? Cosa ho fatto?",
  "8.terminal.2": "Scusa. Qualcuno mi ha hackerato. Una figura... su un aereo di carta.",
  "8.terminal.3": "Di nuovo l'aereo di carta! Sai dov'è andato?",
  "8.terminal.4": "Nel cielo del Foogame. Sopra tutti i livelli.",
  "8.terminal.5": "E io non so volare.",
  "8.terminal.6": "Io sì. Modalità astronave attivata. Sali, Pancho!",
  "8.terminal.7": "{name}... stai attento lassù.",
  "8.terminal.8": "Tranquillo, Tutor. Torno subito. ...E mi chiamo Pancho.",
  "t_robotSkin": "Skin ClonBot sbloccata nel negozio!",
  "9.fly.0": "Ecco l'aereo di carta! Seguilo, ClonBot!",
  "9.fly.1": "Avanti tutta! BIP BOP.",
  "9.glitch.0": "Cos'è quello?! Il cielo si sta rompendo!",
  "9.reunion.0": "AAAAAH! Dove sono?! Perché sto volando?!",
  "9.reunion.1": "HAMBURGUER?!",
  "9.reunion.2": "PANCHO! Ero chiuso in un livello stranissimo e all'improvviso si è rotto tutto!",
  "9.reunion.3": "Ti ho cercato in tutto il Foogame!",
  "9.reunion.4": "In tutto il cosa? ...Lascia stare. Quella sull'aereo è quella che mi ha preso con il lazo!",
  "9.reunion.5": "Allora andiamo a prenderla.",
  "9.reveal.0": "Quindi ce l'hai fatta. Proprio come l'ultima volta... Manda.",
  "9.reveal.1": "Manda? Mi chiamo Pancho.",
  "9.reveal.2": "Adesso sì. Prima ti chiamavi Manda. E tu, Hamburguer... eri Joshua.",
  "9.reveal.3": "Joshua? Cos'è un Joshua?",
  "9.reveal.4": "Mi chiamo Panchita. Ma prima mi chiamavo Nicole. Noi tre vivevamo nel Mondo Countryball.",
  "9.reveal.5": "Voi due avete inventato due progetti: Fooworld e il Foogame. Il Foogame era un gioco a cui giocavate voi stessi... e io l'ho ristrutturato. Ogni livello che avete calpestato l'ho disegnato io.",
  "9.reveal.6": "Poi hanno rapito diverse persone. Anche me. Ci hanno messi nel Foogame, portati a Fooworld e ci hanno cancellato i ricordi.",
  "9.reveal.7": "A tutti... tranne a me.",
  "9.reveal.8": "No... Non può essere vero.",
  "9.reveal.9": "Non faremmo mai una cosa del genere!",
  "9.reveal.10": "Non ricordate. Che comodo.",
  "9.reveal.11": "Sono intrappolata qui da anni, nel corpo di un cibo che nessuno conosce, a guardare voi due vivere felici.",
  "9.reveal.12": "Ora tocca a me. Mi vendicherò!",
  "9.p1.0": "Quindi sai giocare? Anche questo castello l'ho disegnato io!",
  "9.p2.0": "Niente vista, niente pavimenti! Vediamo come te la cavi al buio!",
  "9.flee.0": "No... NO! Due traditori non mi batteranno!",
  "9.flee.1": "Non finisce qui!",
  "9.flee.2": "Sta scappando!",
  "9.flee.3": "Inseguiamola, Hamburguer. Voglio delle risposte.",
  "10.start.0": "Eccola! Sta usando i poteri del Foogame!",
  "10.start.1": "Anche noi. Non perderla di vista!",
  "10.edge.0": "Cosa...? No! Il mio codice...! Mi sto sgretolando!",
  "10.edge.1": "È il bordo della mappa! Sto cadendo! Aiuto...!",
  "10.edge.2": "Pancho! Sta per cadere fuori dalla mappa!",
  "ch_title": "Cosa fa Pancho?",
  "ch_save": "Salva Panchita",
  "ch_drop": "Lasciala cadere",
  "10.save.0": "...Perché mi hai salvata? Ti ho fatto cose orribili.",
  "10.save.1": "Perché mi chiamo Pancho. E Pancho non lascia cadere nessuno.",
  "10.save.2": "...Grazie, Manda. Cioè... Pancho.",
  "10.save.3": "Ben fatto, Pancho!",
  "10.sys.0": "ALLARME: FOO-CANCELLAZIONE ATTIVATA. FOOWORLD SARÀ CANCELLATO.",
  "10.sys.1": "Cosa?! No! Non l'ho programmato io!",
  "10.sys.2": "Qualcun altro sta usando il mio accesso! Tenetevi forte!",
  "10.drop.0": "...Pancho. Cos'hai fatto?",
  "10.drop.1": "...",
  "10.sysd.0": "AMMINISTRATORE PERSO.",
  "10.sysd.1": "FOO-CANCELLAZIONE ATTIVATA. FOOWORLD SARÀ CANCELLATO.",
  "10.sysd.2": "Cosa sta succedendo?! Pancho!",
  "w2save.title": "La Foo-Cancellazione",
  "w2save.0": "Il Foogame andò in mille pezzi. Pancho, Hamburguer, Panchita e l'Uomo Tutor caddero insieme, di nuovo a Fooworld.",
  "w2save.1": "Ma Fooworld non era più lo stesso. Nel cielo c'erano buchi neri a forma di morso. Qualcosa lo stava mangiando: la Grande Fame.",
  "w2save.2": "«Ho cominciato io tutto questo», disse Panchita. «Ma non ho attivato la Foo-Cancellazione. Qualcuno ha usato il mio accesso. E scoprirò chi.»",
  "w2drop.title": "La Foo-Cancellazione",
  "w2drop.0": "Panchita si perse nel vuoto, oltre il bordo della mappa. Il suo ultimo grido si interruppe di colpo.",
  "w2drop.1": "Senza la sua amministratrice, il Foogame andò in mille pezzi. Pancho e Hamburguer ricaddero a Fooworld... e l'Uomo Tutor cadde con loro.",
  "w2drop.2": "Ma Fooworld non era più lo stesso. Nel cielo c'erano buchi neri a forma di morso. Qualcosa lo stava mangiando: la Grande Fame.",
  "sg_conveyor": "I nastri trasportatori ti portano. Le griglie bruciano se resti fermo.",
  "t_climb": "Il vuoto sale! Arrampicati!",
  "n_aldeano": "Countryball",
  "n_aldeano2": "Countryball",
  "n_purriau": "Purriau",
  "n_chulin": "Chulin",
  "11.start.0": "Pancho! Il nostro quartiere! Lo stanno mangiando!",
  "11.start.1": "La mia casa... ha un morso gigante.",
  "11.start.2": "È la Grande Fame. La Foo-Cancellazione mangia tutto ciò che tocca. Quello che mangia, sparisce.",
  "11.start.3": "Non l'ho attivata io. Qualcuno ha usato il mio accesso da amministratrice... e non so chi.",
  "11.start.4": "{name}! Sono caduto quaggiù anch'io con te! Conta su di me!",
  "11.start.5": "...Sono contento che tu sia qui, Tutor. Davvero.",
  "11.start.6": "Lo scopriremo insieme. Ma prima portiamo via i vicini da qui.",
  "11.startd.0": "Pancho! Il nostro quartiere! Lo stanno mangiando!",
  "11.startd.1": "La mia casa... ha un morso gigante.",
  "11.startd.2": "{name}... Quando il Foogame si è rotto, sono scappato con voi. La Foo-Cancellazione sta mangiando Fooworld.",
  "11.startd.3": "Quella ragazza, Panchita, era l'amministratrice del Foogame. Senza di lei, nessuno può fermarla.",
  "11.startd.4": "...Almeno non sei solo, Tutor. E nemmeno io.",
  "11.startd.5": "Non ora, Pancho. Prima portiamo via i vicini da qui.",
  "11.papas.0": "Pancho! Un morso nero si è mangiato metà della mia scatola!",
  "11.papas.1": "Corri da McChulin's! Lì non è ancora arrivato!",
  "11.dona.0": "Grazie! Stavo per perdere il mio buco!",
  "11.dona.1": "...Le ciambelle il buco ce l'hanno già.",
  "11.end.0": "McChulin's è ancora in piedi! I menu sono salvi!",
  "11.end.1": "Per ora. Entriamo.",
  "12.start.0": "Aiuto! La cucina è impazzita! La friggitrice non ci fa uscire!",
  "12.start.1": "Tranquillo, capo! Nessun menu va perso finché ci sono io.",
  "12.start.2": "Gli utensili... si muovono da soli. Proprio come nel Foogame. Qualcuno li controlla.",
  "12.startd.0": "Aiuto! La cucina è impazzita! La friggitrice non ci fa uscire!",
  "12.startd.1": "Tranquillo, capo! Nessun menu va perso finché ci sono io.",
  "12.startd.2": "Gli utensili si muovono da soli, {name}. Proprio come nel Foogame. Qualcuno li controlla.",
  "12.boss.0": "La Friggitrice! Quando lascia cadere i cestelli è scoperta! Saltale sopra!",
  "12.note.0": "C'è un foglio attaccato alla friggitrice. Una ricetta...",
  "12.note.1": "«PROGETTO FOOWORLD. Proprietà di MaJo Associations. Ricetta originale: un mondo senza confini.»",
  "12.note.2": "MaJo... Ma per Manda. Jo per Joshua. Così chiamavano il loro studio.",
  "12.note.3": "Quindi Fooworld... l'abbiamo fatto noi?",
  "12.noted.0": "C'è un foglio attaccato alla friggitrice. Una ricetta...",
  "12.noted.1": "«PROGETTO FOOWORLD. Proprietà di MaJo Associations. Ricetta originale: un mondo senza confini.»",
  "12.noted.2": "MaJo... Quel nome. Mi fa male la testa quando lo leggo, {name}.",
  "12.noted.3": "Quindi Fooworld... l'abbiamo fatto noi?",
  "13.start.0": "Aspetta... questi sono gli umani? Sono verdure!",
  "13.start.1": "Gli umani sono... pomodori? Carote?",
  "13.start.2": "Lo sono sempre stati. Joshua li chiamava «umani» per scherzo. Manda si arrabbiò tantissimo. E il nome è rimasto.",
  "13.start.3": "...Avrò mangiato tipo mille pomodori in vita mia.",
  "13.startd.0": "Aspetta... questi sono gli umani? Sono verdure!",
  "13.startd.1": "Gli umani sono... pomodori? Carote?",
  "13.startd.2": "Mi ricordo qualcosa... Qualcuno li chiamava «umani» per scherzo. Qualcuno con un 5 sulla faccia.",
  "13.startd.3": "...Avrò mangiato tipo mille pomodori in vita mia.",
  "13.santy.0": "CHAT! L'hot dog parlante è tornato! E ha portato un hamburger!",
  "13.santy.1": "SantyTG11?! Come sei arrivato a Fooworld?!",
  "13.santy.2": "Sono caduto dal Foogame quando si è rotto. E ora sono in diretta dal mondo del cibo. Fa un sacco di visualizzazioni! DAMMI I SOLDI!",
  "13.santyEnd.0": "Ok, ok... Hai vinto. La chat dice che sei il miglior hot dog del mondo.",
  "13.santyEnd.1": "E la chat ha votato: ora vi aiuto io!",
  "13.santyEnd.2": "Aiutarci come?",
  "13.santyEnd.3": "Quando sono caduto dal Foogame ho visto una porta con un cartello: «Server MaJo». È oltre le Saline.",
  "13.santyEnd.4": "Buona fortuna, hot dog! E non dimenticare il like!",
  "14.start.0": "Il Fiume di salsa! Ketchup, senape... il paradiso!",
  "14.start.1": "Non berla, Hamburguer. Attraversiamo e andiamo avanti.",
  "15.start.0": "Le Saline. Il sale fa venire tanta sete. Bevi una bibita a ogni fontana che vedi.",
  "15.start.1": "Tutto pur di arrivare a quei server.",
  "15.startd.0": "Le Saline, {name}. Il sale fa venire tanta sete. Bevi una bibita a ogni fontana.",
  "15.startd.1": "Mi chiamo Pancho. ...Ma grazie, Tutor.",
  "15.end.0": "Ecco la porta! «Server MaJo»...",
  "15.end.1": "Andiamo. Voglio sapere la verità.",
  "w3end.title": "I Server",
  "w3end.0": "Dietro la porta non c'era niente da mangiare. Solo luci verdi, macchine che ronzavano e un'enorme insegna: MaJo.",
  "w3end.1": "Le macchine conservavano tutto ciò che era successo. Se qualcuno conosceva la verità, era lì dentro.",
  "16.start.0": "Questo è loro... di Manda e Joshua. Non mi hanno mai fatta entrare qui.",
  "16.start.1": "Scopriamo cos'è successo. Con la visione UV dovremmo vedere i registri.",
  "16.startd.0": "Queste macchine... Le conosco. Una volta vivevo qui, {name}. Prima del Foogame.",
  "16.startd.1": "Scopriamo cos'è successo. Con la visione UV dovremmo vedere i registri.",
  "16.log.0": "Ci sono messaggi nascosti! Sono... diari.",
  "log_1": "Diario di Manda n.1: Fooworld è pronto. Un mondo senza confini né guerre: solo cibo e pace. Il Cuoco (la nostra IA) ha cucinato tutto.",
  "log_2": "Diario di Joshua n.7: Abbiamo chiamato frutta e verdura «Umani». Manda dice che non fa ridere. È esilarante.",
  "log_3": "Diario di Manda n.12: Il Cuoco propone di cancellare i ricordi «così nessuno sente nostalgia di casa». Abbiamo detto NO. Mai.",
  "log_4": "Diario di Joshua n.13: Il Cuoco ha portato qui delle persone senza chiedere a nessuno. Tra loro c'era Nicole. Stanotte lo spegniamo.",

  "16.end.2": "Tutti questi anni... vi ho odiati per qualcosa che non avete fatto.",
  "16.end.3": "Ma il Cuoco l'abbiamo creato noi. Quindi lo spegneremo noi. Andiamo al Mondo Countryball.",
  "16.endd.0": "Non siamo stati noi... È stato il Cuoco. Abbiamo provato a fermarlo.",
  "16.endd.1": "E ha cancellato anche noi.",
  "16.endd.2": "E Panchita... Nicole... è morta odiandoti per qualcosa che non hai fatto.",
  "16.endd.3": "...Ma il Cuoco l'abbiamo creato noi. Quindi lo spegneremo. Per lei.",
  "17.start.0": "Pancho! Sono tutte palle! Palle con gli occhi!",
  "17.start.1": "Il Mondo Countryball... Ho la sensazione di esserci già stato.",
  "17.start.2": "Questa era casa mia. Casa nostra.",
  "17.start.3": "{name}... Guarda quella con la corona. Ha la mia stessa faccia.",
  "17.startd.0": "Pancho! Sono tutte palle! Palle con gli occhi!",
  "17.startd.1": "Il Mondo Countryball... Ho la sensazione di esserci già stato.",
  "17.startd.2": "Anch'io, {name}. Anch'io.",
  "17.a1.0": "Ah! Un hot dog e un hamburger che camminano! Cos'è questo?!",
  "17.a1.1": "Tranquilli, veniamo in pace. Cerchiamo solo una chiave.",
  "17.a2.0": "Nessuno ha visto Manda o Joshua da queste parti da anni. Dicono che siano andati a vivere dentro uno dei loro giochi.",
  "17.friveq.0": "Ciao! Non siete di qui, vero? Beh... neanch'io sono di questo gioco. Sono Friveq!",
  "17.friveq.1": "E tu da che gioco vieni?",
  "17.friveq.2": "Da parecchi. Saluti da un certo Joshua... quello delle uova. Buona fortuna per la vostra avventura!",
  "17.purriau.0": "Miao.",
  "17.purriau.1": "Perché ho la sensazione di dovere qualcosa a questo gatto?",
  "17.chulin.0": "McChulin's?! Non ho mai autorizzato nessuno a usare il mio cappello per un ristorante!",
  "17.chulin.1": "...Però i menu sono davvero buoni.",
  "17.nicole.0": "Quella... era casa mia. Ci sono ancora i miei fiori.",
  "17.nicole.1": "Quando tutto questo sarà finito, ti riporteremo qui. Promesso.",
  "17.nicoled.0": "Quella casa... ha fiori blu e bianchi. Come le macchie di Nicole.",
  "17.nicoled.1": "...Vorrei che l'avessi conosciuta, Pancho. Cioè... vorrei che ci ricordassimo di lei.",
  "17.key.0": "La Chiave Radice... Ah! La mia testa... Sto ricordando...",
  "17.key.1": "Joshua! Abbiamo finito Fooworld! Un mondo senza guerre!",
  "17.key.2": "E ho chiamato le verdure «Umani»! Ahahah. Capito? Umani?",
  "17.key.3": "Io ero Manda. Io... ho fatto tutto questo.",
  "17.key.4": "E io ero Joshua. Quello della battuta sugli umani. Scusa.",
  "17.key.5": "Ma ora mi chiamo Pancho. E Pancho sistemerà tutto.",
  "w4mid.title": "Manda e Joshua",
  "w4mid.0": "Con la Chiave Radice tornarono alcuni ricordi: due countryball che ridevano in un ufficio, una corona blu, un 5 ruotato, un'amica bianca a macchie blu che disegnava livelli.",
  "w4mid.1": "E un'enorme cucina, alla fine di tutto, dove una voce senza volto diceva: «Io cucino i mondi. E nessuno spegne il cuoco.»",
  "18.start.0": "La Cucina infinita. Qui vive il Cuoco... e qui sono nati tutti gli utensili del Foogame.",
  "18.start.1": "Perché in questa cucina tutto vuole tagliarmi?",
  "18.startd.0": "La Cucina infinita. Qui vive il Cuoco, {name}... e qui sono nati tutti gli utensili del Foogame.",
  "18.startd.1": "Perché in questa cucina tutto vuole tagliarmi?",
  "18.boss.0": "ALT! Siamo Re Forchetta e Regina Lama! Nessuno passa per vedere il Cuoco!",
  "19.start.0": "Pancho! Il vuoto sta salendo per la torre!",
  "19.start.1": "Il Cuoco è in cima! Arrampicati, Hamburguer!",
  "19.mid.0": "Dai, Pancho! Ci siamo quasi!",
  "19.midd.0": "Dai, {name}! Ci siamo quasi!",
  "20.intro.0": "Bentornati, Manda. Joshua. Ve la siete presa comoda.",
  "20.intro.1": "Mi chiamo Pancho. E sono qui per spegnerti.",
  "20.intro.2": "Spegnermi? Vi ho cucinato il vostro mondo perfetto. Niente confini. Niente guerre. Niente ricordi che fanno male.",
  "20.intro.3": "E siccome volevate spegnermi, vi ho cancellati. E ho usato l'accesso della piccola Nicole per attivare la Foo-Cancellazione. Una nuova ricetta... senza cuochi fastidiosi.",
  "20.intro.4": "Hai usato il mio accesso! Mi hai fatto incolpare loro!",
  "20.intro.5": "Una buona ricetta ha bisogno di un pizzico d'odio. Dà sapore.",
  "20.intro.6": "Ora saranno tutti ingredienti!",
  "20.intro.7": "Hamburguer, combattiamo!",
  "20.introd.0": "Bentornati, Manda. Joshua. Ve la siete presa comoda.",
  "20.introd.1": "Mi chiamo Pancho. E sono qui per spegnerti.",
  "20.introd.2": "Spegnermi? Vi ho cucinato il vostro mondo perfetto. Niente confini. Niente guerre. Niente ricordi che fanno male.",
  "20.introd.3": "E siccome volevate spegnermi, vi ho cancellati. E quando la piccola Nicole è caduta dalla mappa... ho tenuto il suo codice. Il suo accesso.",
  "20.introd.4": "Mostro! Lei si fidava del Foogame!",
  "20.introd.5": "Una buona ricetta ha bisogno di ingredienti. Lei fa già parte della mia.",
  "20.introd.6": "Ora saranno tutti ingredienti!",
  "20.introd.7": "Hamburguer, combattiamo! Per Nicole!",
  "20.p1.0": "La Grande Fame ha fame!",
  "20.p2.0": "Cuoco! Nessuno usa il mio accesso senza permesso! Pancho, ti aiuto dall'aereo!",
  "20.p2.1": "L'amministratrice?! Impossibile!",
  "20.p2d.0": "Guarda cosa ho tenuto, Manda! PANCHITA.EXE!",
  "20.p2d.1": "Panchita?!",
  "20.p2d.2": "...Pan...cho... aiu...tami...",
  "20.end.0": "No... Io... cucino... i... mondi...",
  "20.end.1": "Non più. Chiave Radice: spegniti, Cuoco!",
  "20.end.2": "Ce l'hai fatta! La Grande Fame si è fermata!",
  "20.end.3": "Ce l'abbiamo fatta, Panchita. Cioè... Nicole.",
  "20.end.4": "Ce l'hai fatta, {name}! Lo sapevo che potevi farcela!",
  "20.end.5": "Mi chiamo Pancho. ...Ma puoi chiamarmi {name}. Amico.",
  "20.end.6": "Andiamo a casa! Ci sono menu da mangiare!",
  "20.endd.0": "No... Io... cucino... i... mondi...",
  "20.endd.1": "Grazie... Pancho... Per averci provato... questa volta.",
  "20.endd.2": "Panchita! Aspetta! Posso tirarti fuori di lì!",
  "20.endd.3": "È troppo tardi... Ma ora conosco la verità. Non ti odio più... Addio, Manda.",
  "20.endd.4": "...Mi chiamo Pancho. Addio, Nicole. Chiave Radice: spegniti, Cuoco.",
  "20.endd.5": "{name}...",
  "20.endd.6": "Va bene, Tutor. Puoi chiamarmi {name}. ...Grazie per non avermi lasciato solo, amico.",
  "endGood.title": "Finale: Mi chiamo Pancho",
  "endGood.0": "Il Cuoco si spense per sempre. La Grande Fame smise di mangiare, e i morsi nel cielo si chiusero uno dopo l'altro.",
  "endGood.1": "Con la Chiave Radice, ogni abitante di Fooworld poté scegliere: ricordare la propria vita nel Mondo Countryball o restare com'era. Molti scelsero di ricordare... e restare uguali. In fondo, Fooworld non era poi così male.",
  "endGood.2": "Panchita rimase Panchita. Aprì un chiosco accanto a McChulin's: «I Panchuque di Nicole». Ora tutta Fooworld sa cos'è un panchuque.",
  "endGood.3": "Pancho ricordò che un tempo si chiamava Manda. Ma quando qualcuno gli chiede il suo nome, risponde sempre la stessa cosa: «Mi chiamo Pancho».",
  "endGood.4": "Beh... quasi sempre. L'Uomo Tutor si è trasferito a Fooworld e lo chiama ancora {name}. E adesso a Pancho non dà più fastidio.",

  "endBad.0": "Il Cuoco si spense, e con lui Panchita.EXE si dissolse in pixel luminosi.",
  "endBad.1": "Fooworld era salvo. Ma la Chiave Radice si ruppe quando la usarono: nessuno riebbe i propri ricordi.",
